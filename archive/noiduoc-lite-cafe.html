<body>
<title>NóiĐược</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Bố cục: một cột kiểu app điện thoại, thanh tab cố định dưới, mỗi màn hình một việc chính. */
:root {
  --bg: #f6f3ee;
  --surface: #ffffff;
  --sunk: #ece6dc;
  --ink: #1b2a2c;
  --muted: #5b6a6b;
  --line: #ddd4c6;
  --teal: #0f5257;
  --teal-ink: #ffffff;
  --amber: #e2902f;
  --amber-ink: #2a1600;
  --good: #23784a;
  --good-bg: #e2f2e7;
  --bad: #b03d2b;
  --bad-bg: #fbe5df;
  --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1e20; --surface: #15292c; --sunk: #1c3639; --ink: #e7eeed; --muted: #9bb0ae; --line: #2a4a4d;
    --teal: #55b6b2; --teal-ink: #06201f; --amber: #f0a752; --amber-ink: #2a1600;
    --good: #72d39b; --good-bg: #173a29; --bad: #f28b77; --bad-bg: #432018; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1e20; --surface: #15292c; --sunk: #1c3639; --ink: #e7eeed; --muted: #9bb0ae; --line: #2a4a4d;
  --teal: #55b6b2; --teal-ink: #06201f; --amber: #f0a752; --amber-ink: #2a1600;
  --good: #72d39b; --good-bg: #173a29; --bad: #f28b77; --bad-bg: #432018; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--ink); font: 16px/1.5 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px calc(88px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 560px; margin: 0 auto; }
h1, h2, h3 { margin: 0; line-height: 1.25; text-wrap: balance; }
h1 { font-size: 1.55rem; font-weight: 700; }
h2 { font-size: 1.15rem; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; gap: 12px; align-items: center; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.center { text-align: center; }
.label { font-size: .75rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
button {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; min-height: 48px; padding: 10px 16px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
}
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.primary { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); font-weight: 600; }
.accent { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); font-weight: 600; }
.ghost { background: transparent; border-color: transparent; color: var(--teal); }
.block { width: 100%; }
input[type=text], textarea {
  width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-height: 50px;
}

/* Thống kê đầu trang */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 8px; text-align: center; }
.stat b { display: block; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .78rem; color: var(--muted); }
.bar { height: 10px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--amber); border-radius: 99px; transition: width .35s; }

/* Lộ trình */
.lesson { width: 100%; justify-content: flex-start; text-align: left; gap: 14px; }
.lesson .dot { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); font-weight: 700; font-size: .9rem; }
.lesson.done .dot { background: var(--good-bg); color: var(--good); }
.lesson.next { border: 2px solid var(--teal); }
.lesson .meta { flex: 1; min-width: 0; }

/* Bài học */
.topbar { display: flex; align-items: center; gap: 12px; }
.topbar .bar { flex: 1; }
.q { font-size: 1.2rem; font-weight: 600; }
.options { display: grid; gap: 10px; }
.options button { justify-content: flex-start; text-align: left; }
.options button[aria-pressed="true"] { border: 2px solid var(--teal); background: var(--sunk); }
.options button.right { background: var(--good-bg); border-color: var(--good); }
.options button.wrong { background: var(--bad-bg); border-color: var(--bad); }
.big { font-size: 2.1rem; font-weight: 700; text-align: center; line-height: 1.2; }
.ipa { font-family: var(--mono); color: var(--muted); text-align: center; font-size: .95rem; }
.passage { white-space: pre-line; background: var(--sunk); border-radius: 12px; padding: 12px; font-size: .95rem; }
.tokens { display: flex; flex-wrap: wrap; gap: 8px; min-height: 52px; align-content: flex-start; }
.tokens.answer { border-bottom: 2px dashed var(--line); padding-bottom: 10px; }
.tokens button { min-height: 44px; padding: 8px 14px; }
.feedback { border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.feedback.ok { background: var(--good-bg); }
.feedback.ok strong { color: var(--good); }
.feedback.no { background: var(--bad-bg); }
.feedback.no strong { color: var(--bad); }
.dock { position: sticky; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); padding-top: 12px; background: linear-gradient(transparent, var(--bg) 35%); }
.listen { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

/* Luyện nói */
.words { display: flex; flex-wrap: wrap; gap: 4px 6px; justify-content: center; font-size: 1.35rem; font-weight: 600; }
.words .hit { color: var(--good); }
.words .miss { color: var(--bad); text-decoration: underline wavy; text-underline-offset: 4px; }
.score { font-size: 2.4rem; font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; }
.mic { width: 84px; height: 84px; border-radius: 50%; margin: 0 auto; background: var(--teal); color: var(--teal-ink); border: none; }
.mic.live { background: var(--bad); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
.sentence { width: 100%; justify-content: space-between; text-align: left; }
.sentence .meta { flex: 1; min-width: 0; }
.chip { font-size: .75rem; padding: 2px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.good { background: var(--good-bg); color: var(--good); }

/* Flashcard */
.card { min-height: 250px; display: flex; flex-direction: column; justify-content: center; gap: 10px; text-align: center; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grades button { flex-direction: column; gap: 0; padding: 8px 4px; font-size: .9rem; }
.grades small { color: var(--muted); font-size: .72rem; }

/* Tiến độ */
.week { display: flex; align-items: flex-end; gap: 8px; height: 130px; }
.week div { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.week i { width: 100%; min-height: 3px; background: var(--teal); border-radius: 6px 6px 0 0; }
.week .today i { background: var(--amber); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.badge { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--surface); }
.badge.off { opacity: .45; }

/* Thanh tab */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 4px max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px));
}
.tabs button { flex: 1; max-width: 140px; flex-direction: column; gap: 2px; border: none; background: none; min-height: 60px; font-size: .74rem; color: var(--muted); border-radius: 10px; }
.tabs button[aria-current="page"] { color: var(--teal); font-weight: 600; }
.tabs svg { width: 24px; height: 24px; }
.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; max-width: 88vw; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; font-size: .9rem; }
.toast.show { opacity: 1; }
.note { background: var(--sunk); border-radius: 12px; padding: 12px; font-size: .88rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

const KEY = 'noiduoc-lite-v1';
const fresh = () => ({ name: '', goal: 20, days: {}, lessons: {}, cards: {}, reviews: 0, spoken: {}, ach: {} });
let S = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch (e) { /* trình duyệt chặn lưu trữ */ }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* bỏ qua */ } }

const ITEMS = Object.fromEntries(COURSE.items.map((i) => [i.key, i]));

// ===== Ngày, streak, XP =====
const today = () => new Date().toLocaleDateString('en-CA');
function shiftDay(k, n) { const d = new Date(k + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function streak() {
  const t = today();
  let c = S.days[t] ? t : shiftDay(t, -1), n = 0;
  while (S.days[c]) { n++; c = shiftDay(c, -1); }
  return n;
}
function longest() {
  const ks = Object.keys(S.days).filter((k) => S.days[k] > 0).sort();
  let best = 0, run = 0, prev = null;
  for (const k of ks) { run = prev && shiftDay(prev, 1) === k ? run + 1 : 1; best = Math.max(best, run); prev = k; }
  return best;
}
function addXp(n) { const t = today(); S.days[t] = (S.days[t] || 0) + n; save(); }

// ===== SM-2 rút gọn 4 mức: 1 Quên, 2 Khó, 3 Nhớ, 4 Dễ =====
function review(card, g, now = new Date()) {
  let { ease, interval_days: iv, reps, lapses } = card;
  if (g === 1) return { ease: Math.max(1.3, +(ease - 0.2).toFixed(2)), interval_days: 0, reps: 0, lapses: lapses + 1, due_at: new Date(+now + 10 * 60000).toISOString() };
  const q = g + 1;
  const ne = Math.max(1.3, +(ease + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02))).toFixed(2));
  let next;
  if (reps === 0) next = g === 4 ? 4 : 1;
  else if (reps === 1) next = g === 2 ? 3 : g === 3 ? 6 : 8;
  else next = g === 2 ? iv * 1.2 : g === 3 ? iv * ne : iv * ne * 1.3;
  if (reps >= 2) next = Math.max(iv + 1, Math.round(next));
  next = Math.min(365, next);
  return { ease: ne, interval_days: next, reps: reps + 1, lapses, due_at: new Date(+now + next * 86400000).toISOString() };
}
const dueCards = () => { const now = new Date().toISOString(); return Object.entries(S.cards).filter(([, c]) => c.due_at <= now).sort((a, b) => a[1].due_at.localeCompare(b[1].due_at)).map(([k]) => k); };
function fmtInterval(c) {
  if (c.interval_days === 0) return '10 phút';
  return c.interval_days < 30 ? c.interval_days + ' ngày' : Math.round(c.interval_days / 30) + ' tháng';
}

// ===== Chấm bài =====
const CONTR = { "i'd": 'i would', "i'm": 'i am', "it's": 'it is', "that's": 'that is', "can't": 'cannot', "don't": 'do not', "here's": 'here is', "what's": 'what is', "you're": 'you are', "i'll": 'i will' };
function norm(s) {
  return String(s || '').normalize('NFC').toLowerCase().replace(/[’‘`´]/g, "'").replace(/[.,!?;:"“”()…]/g, ' ')
    .replace(/\s+/g, ' ').trim().split(' ').map((w) => CONTR[w] || w).join(' ');
}
function lev(a, b) {
  if (a === b) return 0;
  let p = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const c = [i];
    for (let j = 1; j <= b.length; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    p = c;
  }
  return p[b.length];
}
// So khớp từng từ của câu mẫu với lời nói (dãy con chung dài nhất), trả về từ nào trúng
function alignWords(target, said) {
  const t = norm(target).split(' '), s = norm(said).split(' ').filter(Boolean);
  const dp = Array.from({ length: t.length + 1 }, () => new Array(s.length + 1).fill(0));
  for (let i = 1; i <= t.length; i++) for (let j = 1; j <= s.length; j++)
    dp[i][j] = t[i - 1] === s[j - 1] ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
  const hit = new Array(t.length).fill(false);
  let i = t.length, j = s.length;
  while (i > 0 && j > 0) {
    if (t[i - 1] === s[j - 1]) { hit[i - 1] = true; i--; j--; } else if (dp[i - 1][j] >= dp[i][j - 1]) i--; else j--;
  }
  return { words: t, hit, score: Math.round((dp[t.length][s.length] / t.length) * 100) };
}
function grade(ex, resp) {
  const a = ex.answer || {};
  if (ex.type === 'mcq') return { correct: resp.index === a.index, expected: ex.prompt.options[a.index] };
  if (ex.type === 'speak') {
    if (resp.self) return { correct: true, self: true };
    const r = alignWords(a.accept[0], resp.transcript);
    return { correct: r.score >= 80, score: r.score, expected: ex.prompt.text, align: r };
  }
  const given = norm(ex.type === 'order' ? resp.tokens.join(' ') : resp.text);
  const acc = a.accept.map(norm);
  if (acc.includes(given)) return { correct: true, expected: a.accept[0] };
  if (ex.type !== 'order' && given.length >= 5 && acc.some((x) => lev(x, given) <= (x.length > 20 ? 2 : 1)))
    return { correct: true, expected: a.accept[0], note: 'Gần đúng, xem lại chính tả nhé.' };
  return { correct: false, expected: a.accept[0] };
}

let voice = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find((v) => v.lang === 'en-US' && /Samantha|Ava|Allison|Google US/i.test(v.name)) || vs.find((v) => v.lang === 'en-US') || vs.find((v) => /^en/.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, slow) {
  if (!('speechSynthesis' in window) || !text) { toast('Thiết bị này chưa hỗ trợ đọc to.'); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; if (voice) u.voice = voice; u.rate = slow ? 0.65 : 0.92;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
let micBlocked = !Rec; // bị chặn (vd. trong khung xem của Claude) thì chuyển sang tự đánh giá
function listen() {
  return new Promise((resolve, reject) => {
    const r = new Rec(); r.lang = 'en-US'; r.interimResults = false; r.maxAlternatives = 1;
    let done = false;
    r.onresult = (e) => { done = true; resolve(e.results[0][0].transcript); };
    r.onerror = (e) => { if (!done) { done = true; reject(e.error || 'error'); } };

  const drawCtrl = () => ctrl.replaceChildren(micBlocked
    ? h('div', { class: 'grades', style: { gridTemplateColumns: 'repeat(3, 1fr)' } },
        ...[['Còn vấp', 40], ['Khá ổn', 70], ['Trôi chảy', 90]].map(([t, v]) => h('button', { onclick: () => record(v, null) }, t)))
    : h('div', { class: 'stack' }, h('button', { class: 'mic', 'aria-label': 'Bấm để nói', onclick: async (e) => {
        const b = e.currentTarget; b.classList.add('live');
        const said = await tryListen(); b.classList.remove('live');
        if (said) record(null, said); else drawCtrl();
      } }, icon(ICON.speak)), h('p', { class: 'small muted' }, 'Bấm micro rồi nói cả câu')));
  function record(selfScore, said) {
    let score;
    if (said) {
      const r = alignWords(s.en, said); score = r.score;
      words.replaceChildren(...r.words.map((w, i) => h('span', { class: r.hit[i] ? 'hit' : 'miss' }, w)));
      result.replaceChildren(h('div', { class: 'score' }, score + '%'), h('p', { class: 'center small muted' }, 'Máy nghe được: “' + said + '”'),
        h('p', { class: 'center small' }, score >= 80 ? 'Rất tốt! Thử nói nhanh và tự nhiên hơn.' : 'Từ gạch đỏ là chỗ máy chưa nghe rõ. Nghe chậm rồi thử lại.'));
    } else {
      score = selfScore;
      result.replaceChildren(h('p', { class: 'center' }, 'Đã ghi nhận. Nói lại thêm vài lần cho quen miệng nhé.'));
    }
    S.spoken[norm(s.en)] = Math.max(S.spoken[norm(s.en)] || 0, score);
    addXp(1); checkAch(); drawCtrl();
  }
  drawCtrl();
  mount(h('div', { class: 'stack-lg' },
    h('div', { class: 'topbar' }, h('button', { class: 'ghost', onclick: speakListView }, 'Danh sách câu'), h('span', { class: 'muted small' }, (idx + 1) + '/' + all.length)),
    h('div', { class: 'panel stack center' },
      h('p', { class: 'label' }, 'Bài ' + s.lesson.n + ' · ' + s.lesson.title),
      words, h('p', { class: 'muted' }, s.vi), listenBtns(s.en)),
    ctrl, result,
    nextS && h('button', { class: 'block', onclick: () => speakView(nextS, all) }, 'Câu tiếp theo')));
  setTimeout(() => say(s.en), 300);
}

// ===== Ôn tập flashcard =====
function reviewView() {
  const queue = dueCards();
  let count = 0;
  if (!queue.length) {
    const total = Object.keys(S.cards).length;
    const soon = Object.values(S.cards).map((c) => c.due_at).sort()[0];
    mount(h('div', { class: 'stack-lg' }, h('h1', {}, 'Ôn tập'), h('div', { class: 'panel stack center' },
      h('h2', {}, total ? 'Chưa có thẻ nào đến hạn' : 'Chưa có từ nào để ôn'),
      h('p', { class: 'muted' }, total ? 'Thẻ tiếp theo đến hạn lúc ' + new Date(soon).toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' }) + '.' : 'Học một bài để từ vựng vào hàng ôn tập.'),
      h('button', { class: 'primary block', onclick: () => go('home') }, 'Về trang Học'))));
    return;
  }
  const show = () => {
    const k = queue[0];
    if (!k) {
      checkAch();
      mount(h('div', { class: 'stack-lg' }, h('h1', {}, 'Ôn tập'), h('div', { class: 'panel stack center' }, h('h2', {}, 'Xong phiên ôn tập'), h('p', { class: 'muted' }, 'Bạn đã ôn ' + count + ' lượt.'),
        h('button', { class: 'primary block', onclick: () => go('home') }, 'Về trang Học'))));
      return;
    }
    const it = ITEMS[k], c = S.cards[k];
    const back = h('div', { class: 'stack', hidden: true },
      it.reading && h('div', { class: 'ipa' }, it.reading),
      h('p', { style: { fontSize: '1.2rem', fontWeight: 600 } }, it.meaning_vi),
      it.example && h('p', { lang: 'en' }, '“' + it.example + '”'),
      it.example_vi && h('p', { class: 'small muted' }, it.example_vi));
    const grades = h('div', { class: 'grades', hidden: true },
      ...[[1, 'Quên'], [2, 'Khó'], [3, 'Nhớ'], [4, 'Dễ']].map(([g, t]) => h('button', { onclick: () => {
        S.cards[k] = review(c, g); S.reviews++; count++; addXp(1);
        queue.shift(); if (g === 1) queue.push(k);
        show();
      } }, h('b', {}, t), h('small', {}, fmtInterval(review(c, g))))));
    const reveal = h('button', { class: 'primary block', onclick: () => { back.hidden = false; grades.hidden = false; reveal.hidden = true; say(it.text); } }, 'Hiện nghĩa');
    mount(h('div', { class: 'stack-lg' },
      h('div', { class: 'row between' }, h('h1', {}, 'Ôn tập'), h('span', { class: 'muted small' }, 'Còn ' + queue.length + ' thẻ')),
      h('div', { class: 'panel card' },
        h('p', { class: 'small muted' }, 'Cố nhớ nghĩa trước khi lật thẻ'),
        h('div', { class: 'big', lang: 'en' }, it.text),
        h('div', {}, h('button', { class: 'ghost', onclick: () => say(it.text) }, 'Nghe')),
        back),
      h('div', { class: 'dock stack' }, reveal, grades)));
  };
  show();
}

// ===== Tiến độ =====
function progressView() {
  const t = today(), days = Array.from({ length: 7 }, (_, i) => shiftDay(t, i - 6));
  const max = Math.max(10, ...days.map((d) => S.days[d] || 0));
  const cards = Object.values(S.cards);
  const wd = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
  const total = Object.values(S.days).reduce((a, b) => a + b, 0);
  let confirmReset = false;
  const resetBtn = h('button', { class: 'ghost block', onclick: () => {
    if (!confirmReset) { confirmReset = true; resetBtn.textContent = 'Bấm lần nữa để xóa toàn bộ tiến độ'; return; }
    S = fresh(); save(); welcomeView();
  } }, 'Xóa tiến độ và học lại từ đầu');
  mount(h('div', { class: 'stack-lg' },
    h('h1', {}, 'Tiến độ'),
    h('div', { class: 'stats' },
      h('div', { class: 'stat' }, h('b', {}, streak()), h('span', {}, 'chuỗi hiện tại')),
      h('div', { class: 'stat' }, h('b', {}, longest()), h('span', {}, 'chuỗi dài nhất')),
      h('div', { class: 'stat' }, h('b', {}, total), h('span', {}, 'tổng XP'))),
    h('div', { class: 'panel stack' }, h('h3', {}, 'XP 7 ngày qua'),
      h('div', { class: 'week', role: 'img', 'aria-label': days.map((d) => d + ': ' + (S.days[d] || 0) + ' XP').join(', ') },
        days.map((d) => h('div', { class: d === t ? 'today' : '' }, h('span', {}, S.days[d] || ''), h('i', { style: { height: ((S.days[d] || 0) / max * 100) + '%' } }), h('span', {}, wd[new Date(d + 'T00:00:00Z').getUTCDay()]))))),
    h('div', { class: 'stats' },
      h('div', { class: 'stat' }, h('b', {}, cards.length), h('span', {}, 'từ đang học')),
      h('div', { class: 'stat' }, h('b', {}, cards.filter((c) => c.interval_days >= 21).length), h('span', {}, 'đã thuộc (≥21 ngày)')),
      h('div', { class: 'stat' }, h('b', {}, Object.values(S.spoken).filter((v) => v >= 80).length), h('span', {}, 'câu nói đạt'))),
    h('div', { class: 'stack' }, h('h2', {}, 'Thành tích'),
      h('div', { class: 'badges' }, ACH.map(([code, title, desc]) => h('div', { class: 'badge' + (S.ach[code] ? '' : ' off') }, h('b', {}, title), h('p', { class: 'small muted' }, desc))))),
    h('div', { class: 'note' }, 'Thêm vào màn hình chính trên iPhone: mở link bằng Safari, bấm nút Chia sẻ, chọn “Thêm vào MH chính”.'),
    resetBtn));
}

// ===== Khởi động =====
if (S.name) go('home'); else welcomeView();
</script>
