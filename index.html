<!doctype html>
<html lang="vi">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lingogo">
<title>Lingogo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Bố cục: một cột kiểu app điện thoại; đổi ngôn ngữ ở đầu trang, thanh tab cố định dưới, mỗi màn hình một việc chính. */
:root {
  --bg: #f6f3ee;
  --surface: #ffffff;
  --sunk: #ece6dc;
  --ink: #1b2a2c;
  --muted: #5b6a6b;
  --line: #ddd4c6;
  --teal: #0f5257;
  --teal-ink: #ffffff;
  --amber: #e2902f;
  --amber-ink: #2a1600;
  --good: #23784a;
  --good-bg: #e2f2e7;
  --bad: #b03d2b;
  --bad-bg: #fbe5df;
  --grid: #e3d9ca;
  --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --zh: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --ja: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1e20; --surface: #15292c; --sunk: #1c3639; --ink: #e7eeed; --muted: #9bb0ae; --line: #2a4a4d;
    --teal: #55b6b2; --teal-ink: #06201f; --amber: #f0a752; --amber-ink: #2a1600; --grid: #2a4a4d;
    --good: #72d39b; --good-bg: #173a29; --bad: #f28b77; --bad-bg: #432018; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1e20; --surface: #15292c; --sunk: #1c3639; --ink: #e7eeed; --muted: #9bb0ae; --line: #2a4a4d;
  --teal: #55b6b2; --teal-ink: #06201f; --amber: #f0a752; --amber-ink: #2a1600; --grid: #2a4a4d;
  --good: #72d39b; --good-bg: #173a29; --bad: #f28b77; --bad-bg: #432018; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--ink); font: 16px/1.5 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px calc(88px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 560px; margin: 0 auto; }
h1, h2, h3 { margin: 0; line-height: 1.25; text-wrap: balance; }
h1 { font-size: 1.5rem; font-weight: 700; }
h2 { font-size: 1.15rem; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
[lang="zh-Hans"] { font-family: var(--zh); }
[lang="ja"] { font-family: var(--ja); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.center { text-align: center; }
.label { font-size: .75rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.note { background: var(--sunk); border-radius: 12px; padding: 12px; font-size: .88rem; color: var(--muted); }
button, select {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; min-height: 48px; padding: 10px 16px; cursor: pointer;
}
button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.primary { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); font-weight: 600; }
.accent { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); font-weight: 600; }
.ghost { background: transparent; border-color: transparent; color: var(--teal); }
.block { width: 100%; }
.mini { min-height: 36px; padding: 6px 12px; font-size: .88rem; border-radius: 10px; }
input[type=text], input[type=password], textarea {
  width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-height: 50px;
}
select { width: 100%; }

/* Chọn ngôn ngữ */
.langpick { display: grid; gap: 12px; }
.langcard { width: 100%; display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: center; text-align: left; padding: 18px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); }
.langcard:hover { border-color: var(--teal); }
.langcard.cur { border: 2px solid var(--teal); }
.langcard .glyph { grid-row: span 3; width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; background: var(--sunk); font-size: 1.9rem; font-weight: 700; color: var(--teal); }
.langcard .name { font-size: 1.2rem; font-weight: 700; }
.langcard .bar { grid-column: 2; }
.langchip { min-height: 40px; padding: 6px 12px; border-radius: 99px; font-weight: 600; gap: 6px; }
.langchip .caret { font-size: .75rem; color: var(--muted); }
.langs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--sunk); padding: 4px; border-radius: 14px; }
.langs button { border: none; background: transparent; min-height: 42px; font-weight: 600; color: var(--muted); border-radius: 10px; padding: 6px; }
.langs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* Thống kê */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 8px; text-align: center; min-width: 0; }
.stat b { display: block; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .76rem; color: var(--muted); }
.bar { height: 10px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--amber); border-radius: 99px; transition: width .35s; }

/* Lộ trình */
.phase { margin-top: 8px; }
.topic { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.topic.cur { border: 2px solid var(--teal); }
.topic > button.head { width: 100%; border: none; border-radius: 0; justify-content: flex-start; text-align: left; gap: 12px; padding: 12px 14px; background: transparent; }
.topic .num { flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--sunk); font-weight: 700; font-size: .85rem; font-variant-numeric: tabular-nums; }
.topic.done .num { background: var(--good-bg); color: var(--good); }
.topic .meta { flex: 1; min-width: 0; }
.topic .meta b { display: block; overflow-wrap: anywhere; }
.topic .body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.lesson { width: 100%; justify-content: flex-start; text-align: left; gap: 12px; min-height: 52px; }
.lesson .dot { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); font-weight: 700; font-size: .8rem; }
.lesson.done .dot { background: var(--good-bg); color: var(--good); }
.lesson.next { border: 2px solid var(--teal); }
.lesson .meta { flex: 1; min-width: 0; }
.extras { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.level { font-size: .74rem; font-weight: 700; padding: 2px 7px; border-radius: 6px; letter-spacing: .02em; flex: none; text-transform: uppercase; }
.chip.level.a1 { background: #e6f7ec; color: #0d8a43; border: 1px solid #b7ebc6; }
.chip.level.a2 { background: #e6f4ff; color: #096dd9; border: 1px solid #91caff; }
.chip.level.b1 { background: #f9f0ff; color: #722ed1; border: 1px solid #d3adf7; }
.chip.level.b2 { background: #fff7e6; color: #d46b08; border: 1px solid #ffd591; }
.chip.level.hsk1 { background: #e6f7ec; color: #0d8a43; border: 1px solid #b7ebc6; }
.chip.level.hsk2 { background: #e6f4ff; color: #096dd9; border: 1px solid #91caff; }
.chip.level.hsk3 { background: #f0f5ff; color: #1d39c4; border: 1px solid #adc6ff; }
.chip.level.hsk4 { background: #f9f0ff; color: #722ed1; border: 1px solid #d3adf7; }
.chip.level.hsk5 { background: #fff7e6; color: #d46b08; border: 1px solid #ffd591; }
.chip.level.hsk6 { background: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; }
.chip.level.hsk7 { background: #f0f0ff; color: #391085; border: 1px solid #d3adf7; }
.chip.level.hsk8 { background: #fff0f6; color: #c41d7f; border: 1px solid #ffadd2; }
.chip.level.hsk9 { background: #feffe6; color: #ad8b00; border: 1px solid #ffe58f; font-weight: 800; box-shadow: 0 0 4px rgba(250,219,20,.4); }
.chip.level.n5 { background: #e6f7ec; color: #0d8a43; border: 1px solid #b7ebc6; }
.chip.level.n4 { background: #e6f4ff; color: #096dd9; border: 1px solid #91caff; }
.chip.level.n3 { background: #f0f5ff; color: #1d39c4; border: 1px solid #adc6ff; }
.chip.level.n2 { background: #f9f0ff; color: #722ed1; border: 1px solid #d3adf7; }
.chip.level.n1 { background: #feffe6; color: #ad8b00; border: 1px solid #ffe58f; font-weight: 800; box-shadow: 0 0 4px rgba(250,219,20,.4); }
.kbd { flex: none; display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 7px; font: 600 .8rem/1 var(--font); color: var(--muted); background: var(--bg); font-variant-numeric: tabular-nums; }
.options button { gap: 12px; }
.options button[aria-pressed="true"] .kbd { border-color: var(--teal); color: var(--teal); }
.grades .kbd { min-width: 20px; height: 20px; font-size: .7rem; margin-bottom: 2px; }
.keyhint { text-align: center; font-size: .75rem; color: var(--muted); }
@media (hover: none) { .keyhint { display: none; } }

/* Phân loại chủ đề */
.cat-bar { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; margin-top: 4px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.cat-bar::-webkit-scrollbar { display: none; }
.cat-pill { flex: none; padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); font-size: .88rem; font-weight: 500; cursor: pointer; transition: all .15s ease; white-space: nowrap; line-height: 1.2; }
.cat-pill:hover { border-color: var(--teal); color: var(--ink); }
.cat-pill.active { background: var(--teal); color: #fff; border-color: var(--teal); font-weight: 600; box-shadow: 0 2px 6px rgba(0, 128, 128, 0.25); }
/* Nút Subjects & menu chọn chủ đề */
.subjects-box { position: relative; width: 100%; }
.subjects-trigger {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 14px;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  cursor: pointer;
  transition: all .15s ease;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.subjects-trigger:hover, .subjects-trigger.open {
  border-color: var(--teal);
  box-shadow: 0 2px 8px rgba(15,82,87,.12);
}
.subjects-badge {
  display: inline-flex;
  align-items: center;
  font-size: .75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .04em;
  background: var(--teal);
  color: var(--teal-ink);
  padding: 3px 8px;
  border-radius: 6px;
  line-height: 1;
  flex: none;
}
.subjects-name {
  font-size: .95rem;
  font-weight: 700;
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.subjects-arrow {
  font-size: .75rem;
  color: var(--muted);
  flex: none;
  transition: transform .15s ease;
}
.subjects-dropdown {
  position: relative;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 6px 18px rgba(0,0,0,.08);
  padding: 6px;
  gap: 4px;
  margin-top: 6px;
  z-index: 10;
  animation: fadeInDown .15s ease;
}
@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}
.subjects-item {
  width: 100%;
  display: flex;
  flex-direction: column;
  padding: 10px 12px;
  background: transparent;
  border: 1.5px solid transparent;
  border-radius: 10px;
  cursor: pointer;
  text-align: left;
  transition: all .12s ease;
}
.subjects-item:hover {
  background: var(--sunk);
}
.subjects-item.selected {
  background: var(--sunk);
  border-color: var(--teal);
}
.subjects-check {
  display: inline-grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 99px;
  background: var(--teal);
  color: #fff;
  font-size: .75rem;
  font-weight: 700;
  flex: none;
}


/* Bài học */
.topbar { display: flex; align-items: center; gap: 12px; }
.topbar .bar { flex: 1; }
.q { font-size: 1.15rem; font-weight: 600; white-space: pre-line; }
.options { display: grid; gap: 10px; }
.options button { justify-content: flex-start; text-align: left; }
.options button[aria-pressed="true"] { border: 2px solid var(--teal); background: var(--sunk); }
.options button.right { background: var(--good-bg); border-color: var(--good); }
.options button.wrong { background: var(--bad-bg); border-color: var(--bad); }
.big { font-size: 2.2rem; font-weight: 700; text-align: center; line-height: 1.25; overflow-wrap: anywhere; }
.big[lang="zh-Hans"], .big[lang="ja"] { font-size: 2.8rem; font-weight: 500; }
.read { color: var(--teal); text-align: center; font-size: 1rem; }
.ipa { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: var(--teal); font-weight: 600; text-align: center; font-size: 1.05rem; letter-spacing: .25px; }
.hv { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 12px; border-radius: 12px; background: var(--sunk); }
.hv .hvw { color: var(--teal); font-size: 1.25rem; letter-spacing: .02em; }
.hvrows { display: flex; flex-direction: column; gap: 4px; width: 100%; max-width: 320px; }
.hvrow { display: flex; align-items: baseline; gap: 8px; font-size: .92rem; text-align: left; border-top: 1px solid var(--line); padding-top: 4px; }
.hvrow .hvc { flex: none; font-size: 1.2rem; min-width: 1.6em; text-align: center; }
.hvglue { text-align: center; color: var(--ink); }
.endef { text-align: center; color: var(--muted); font-size: .95rem; font-style: italic; }
.tokens { display: flex; flex-wrap: wrap; gap: 8px; min-height: 52px; align-content: flex-start; }
.tokens.answer { border-bottom: 2px dashed var(--line); padding-bottom: 10px; }
.tokens button { min-height: 44px; padding: 8px 14px; }
.feedback { border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.feedback.ok { background: var(--good-bg); }
.feedback.ok strong { color: var(--good); }
.feedback.no { background: var(--bad-bg); }
.feedback.no strong { color: var(--bad); }
.dock { position: sticky; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); padding-top: 12px; background: linear-gradient(transparent, var(--bg) 35%); z-index: 2; }
.lessonmode .dock { bottom: env(safe-area-inset-bottom, 0px); padding-bottom: 8px; }
.listen { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; align-items: center; }
.spk { flex: none; width: 40px; height: 40px; min-height: 40px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--teal); display: inline-grid; place-items: center; vertical-align: middle; }
.spk svg { width: 20px; height: 20px; }
.spk.big { width: 52px; height: 52px; min-height: 52px; }
.spk.big svg { width: 26px; height: 26px; }
.spk .turtle { font-size: 1.3rem; line-height: 1; }
.spk.big .turtle { font-size: 1.6rem; }
.spk:active { background: var(--sunk); }
span.spk { width: 34px; height: 34px; min-height: 34px; }
.fill { line-height: 2.4; white-space: pre-line; }
.fill select { width: auto; min-height: 38px; padding: 4px 8px; border-radius: 10px; font-size: .95rem; margin: 0 2px; }
.fill select.right { border-color: var(--good); background: var(--good-bg); }
.fill select.wrong { border-color: var(--bad); background: var(--bad-bg); }

/* Luyện nói */
.words { display: flex; flex-wrap: wrap; gap: 4px 6px; justify-content: center; font-size: 1.3rem; font-weight: 600; }
.words[lang="zh-Hans"], .words[lang="ja"] { gap: 0; font-weight: 500; font-size: 1.6rem; }
.words .hit { color: var(--good); }
.words .miss { color: var(--bad); text-decoration: underline wavy; text-underline-offset: 4px; }
.score { font-size: 2.4rem; font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; }
.mic { width: 84px; height: 84px; border-radius: 50%; margin: 0 auto; background: var(--teal); color: var(--teal-ink); border: none; }
.mic.live { background: var(--bad); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
.mic svg { width: 32px; height: 32px; }
.sentence { width: 100%; justify-content: space-between; text-align: left; }
.sentence .meta { flex: 1; min-width: 0; }
.phrases { display: flex; flex-wrap: wrap; gap: 6px; }
.phrases span { border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px; font-size: .9rem; }
.phrases span.used { background: var(--good-bg); border-color: var(--good); color: var(--good); }

/* Viết chữ */
.charbox { width: min(300px, 78vw); aspect-ratio: 1; max-width: 100%; margin: 0 auto; border: 2px solid var(--line); border-radius: 12px; background-color: var(--surface);
  background-image: linear-gradient(to right, transparent calc(50% - .5px), var(--grid) calc(50% - .5px), var(--grid) calc(50% + .5px), transparent calc(50% + .5px)),
    linear-gradient(to bottom, transparent calc(50% - .5px), var(--grid) calc(50% - .5px), var(--grid) calc(50% + .5px), transparent calc(50% + .5px));
  touch-action: none; }
.charbox svg { display: block; width: 100%; height: 100%; }
.chargrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.chargrid button { min-height: 64px; padding: 4px; flex-direction: column; gap: 0; font-size: 1.6rem; line-height: 1.2; }
.chargrid button small { font-size: .7rem; color: var(--muted); font-family: var(--font); }
.chargrid button.done { border-color: var(--good); }
.kana { grid-template-columns: repeat(5, 1fr); }
.kana button { min-height: 56px; font-size: 1.4rem; }
.kana .gap { visibility: hidden; }

/* Flashcard */
.card { min-height: 180px; display: flex; flex-direction: column; justify-content: center; gap: 10px; text-align: center; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grades button { flex-direction: column; gap: 0; padding: 8px 4px; font-size: .9rem; }
.grades small { color: var(--muted); font-size: .72rem; }

/* Ngữ pháp */
.gram { display: flex; flex-direction: column; gap: 6px; }
.gram p { overflow-wrap: anywhere; }
.gram .ex { background: var(--sunk); border-radius: 8px; padding: 6px 10px; font-size: 1.05rem; }
.gram .pat { font-weight: 700; color: var(--teal); }
ruby rt { font-size: .55em; color: var(--muted); }
.kj { display: flex; gap: 14px; align-items: flex-start; }
.kj .k { flex: none; font: 500 3rem/1.1 var(--ja); color: var(--teal); width: 72px; text-align: center; }

/* Tiến độ */
.week { display: flex; align-items: flex-end; gap: 8px; height: 130px; }

// ===== Chuyển tiến độ giữa bản trên Claude và bản web (mã chữ, gộp không ghi đè) =====
const b64 = { enc: (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); },
  dec: (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0)) };
async function pipeBytes(u8, stream) { return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(stream)).arrayBuffer()); }
async function exportCode() {
  const raw = new TextEncoder().encode(JSON.stringify(S));
  if (window.CompressionStream) { try { return 'LGG1z.' + b64.enc(await pipeBytes(raw, new CompressionStream('gzip'))); } catch (e) { /* dùng bản không nén */ } }
  return 'LGG1.' + b64.enc(raw);
}
async function importCode(code) {
  const m = String(code).replace(/\s+/g, '').match(/^LGG1(z?)\.([A-Za-z0-9+/=]+)$/);
  if (!m) throw new Error('Mã không đúng. Hãy dán nguyên đoạn mã bắt đầu bằng LGG1.');
  let bytes = b64.dec(m[2]);
  if (m[1]) { if (!window.DecompressionStream) throw new Error('Trình duyệt này quá cũ để đọc mã. Hãy cập nhật iOS/trình duyệt.'); bytes = await pipeBytes(bytes, new DecompressionStream('gzip')); }
  const o = JSON.parse(new TextDecoder().decode(bytes));
  if (!o || o.v !== 2 || typeof o.srs !== 'object' || typeof o.lessons !== 'object') throw new Error('Mã không phải tiến độ Lingogo.');
  return o;
}
async function copyProgress() {

    route();

async function getSyncUrl() {
  const cfg = getGhConfig();
  let payload = {};
  if (cfg.token && cfg.gistId) {
    payload = { v: 2, token: cfg.token, gistId: cfg.gistId, user: cfg.user };
  } else {
    payload = { v: 2, code: await exportCode() };
  }
  const str = encodeURIComponent(JSON.stringify(payload));
  return window.location.origin + window.location.pathname + '#sync=' + str;
}
async function handleUrlSync() {
  const hash = window.location.hash;
  if (!hash || !hash.includes('sync=')) return false;
  const match = hash.match(/sync=([^&]+)/);
  if (!match) return false;
  try {
    const raw = decodeURIComponent(match[1]);
    let parsed = null;
    try { parsed = JSON.parse(raw); } catch (e) {
      try { parsed = JSON.parse(decodeURIComponent(escape(atob(raw)))); } catch (e2) { parsed = null; }
    }
    if (!parsed && raw.startsWith('LGG1')) {
      parsed = { code: raw };
    }
    if (!parsed) return false;

    let imported = false;
    // 1. Cấu hình GitHub Gist nếu có trong link
    if (parsed.token) {
      saveGhConfig({ token: parsed.token, gistId: parsed.gistId || '', user: parsed.user || '' });
      try {
        const pulled = await pullGhSync(false);
        if (pulled) imported = true;
      } catch (e) {}
    }

    // 2. Mã tiến độ
    if (parsed.code) {
      try {
        const inc = await importCode(parsed.code);
        S = mergeState(S, inc);
        save();
        imported = true;
      } catch (e) {}
    }

    if (imported) {
      toast('Đồng bộ thành công! Chào mừng ' + (S.name || 'bạn') + '.');
    }

    history.replaceState(null, '', window.location.pathname + window.location.search);
    return true;
  } catch (err) {
    console.warn('Lỗi xử lý URL sync:', err);
    return false;
  }
}
async function autoSync() {
  const btn = document.querySelector('.sync-btn');
  if (btn) btn.classList.add('spinning');
  try {
    const cfg = getGhConfig();
    if (!cfg.token) {
      toast('Chưa kết nối GitHub! Vui lòng nhập Token một lần để đồng bộ.');
      showSyncModal();
      return;
    }
    // 1. Tự động đồng bộ qua GitHub Gist nếu đã thiết lập
    if (!cfg.gistId) {
      try {
        const res = await findOrCreateGhGist(cfg.token);
        cfg.gistId = res.gistId; cfg.user = res.user; saveGhConfig(cfg);
      } catch (e) {
        toast('Lỗi xác thực GitHub: ' + (e.message || ''));
        return;
      }
    }
    if (cfg.gistId) {
      try {
        const res = await fetch('https://api.github.com/gists/' + cfg.gistId, { headers: ghHeaders(cfg.token) });
        if (!res.ok) {
          if (res.status === 401) {
            toast('GitHub Token không hợp lệ hoặc đã hết hạn. Vui lòng kiểm tra lại!');
            showSyncModal();
            return;
          }
          if (res.status === 404) {
            toast('Không tìm thấy bản sao lưu cũ trên GitHub. Đang tạo mới...');
            const found = await findOrCreateGhGist(cfg.token);
            cfg.gistId = found.gistId; cfg.user = found.user; saveGhConfig(cfg);
          }
        } else {
          const gist = await res.json();
          const f = gist.files && gist.files['lingogo-progress.json'];
          if (f && f.content) {
            const remote = JSON.parse(f.content);
            const prevL = Object.keys(S.lessons || {}).length;
            const prevS = Object.keys(S.srs || {}).length;
            const prevW = Object.keys(S.written || {}).length;
            const remoteT = remote.t || 0;
            const localT = S.t || 0;

            const merged = mergeState(S, remote);
            const dl = Object.keys(merged.lessons || {}).length - prevL;
            const ds = Object.keys(merged.srs || {}).length - prevS;
            const dw = Object.keys(merged.written || {}).length - prevW;
            const remoteHasMore = dl > 0 || ds > 0 || dw > 0;

            if (remoteT > localT || remoteHasMore) {
              S = merged;
              GH_SYNC.seen = S.t || Date.now();
              save();
              route();
              const parts = [dl && (dl + ' bài'), ds && (ds + ' mục ôn'), dw && (dw + ' chữ viết')].filter(Boolean).join(', ');
              toast('Đã kéo (Pull): ' + (parts ? 'gộp thêm ' + parts + ' từ GitHub.' : 'tiến độ đã cập nhật mới nhất từ GitHub.'));
              return;
            } else {
              await pushGhSync(true);
              toast('Đã đẩy (Push): Tiến độ máy này mới nhất, đã lưu lên GitHub (@' + (cfg.user || 'User') + ').');
              return;
            }
          }
        }
      } catch (ghErr) {
        toast('Lỗi kết nối GitHub: ' + (ghErr.message || 'Kiểm tra mạng'));
        return;
      }
    }
  } catch (err) {
    toast('Lỗi đồng bộ: ' + (err.message || 'Không thể đồng bộ.'));
  } finally {
    if (btn) setTimeout(() => btn.classList.remove('spinning'), 600);
  }
}

    locText = 'Tập viết chữ' + (cur.topicTitle ? ' (' + cur.topicTitle + ')' : '');
  } else if (cur.mode === 'grammar') {
    locText = 'Ngữ pháp · ' + (cur.topicTitle || '');
  } else if (cur.mode === 'kanji') {
    locText = 'Kanji · ' + (cur.topicTitle || '');
  } else if (VIEW === 'progress') {
    locText = 'Tiến độ & Cài đặt';
  }

  const device = /iPhone|iPad|iPod/.test(navigator.userAgent) ? 'iPhone/iPad (iOS)' :
                 /Android/.test(navigator.userAgent) ? 'Android' :
                 /Macintosh/.test(navigator.userAgent) ? 'Mac (macOS)' :
                 /Windows/.test(navigator.userAgent) ? 'Windows' : 'Khác';

  const browser = /CriOS|Chrome/.test(navigator.userAgent) ? 'Chrome' :
                  /Safari/.test(navigator.userAgent) ? 'Safari' :
                  /Firefox/.test(navigator.userAgent) ? 'Firefox' : 'Browser';

  const TAGS = [
    { id: 'audio', label: '🔊 Lỗi âm thanh / giọng đọc' },
    { id: 'content', label: '✏️ Sai đáp án / từ vựng' },
    { id: 'ui', label: '📱 Lỗi giao diện / hiển thị' },
    { id: 'feature', label: '💡 Đề xuất tính năng mới' },
    { id: 'other', label: '❓ Khác' }
  ];
  let selectedTag = 'audio';

  const tagContainer = h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '8px' } });
  const renderTags = () => {
    tagContainer.replaceChildren(...TAGS.map(t => {
      return h('button', {
        class: 'feedback-tag' + (selectedTag === t.id ? ' active' : ''),
        onclick: () => { selectedTag = t.id; renderTags(); }
      }, t.label);
    }));
  };
  renderTags();

  const textarea = h('textarea', {
    rows: 4,
    placeholder: 'Mô tả chi tiết lỗi bạn gặp phải (ví dụ: giọng đọc topic 21 bị đánh vần từng chữ, câu này thiếu đáp án đúng, giao diện bị lệch...)',
    style: {
      width: '100%',
      padding: '12px',
      borderRadius: '12px',
      border: '1px solid var(--line)',
      background: 'var(--surface)',
      color: 'var(--ink)',
      fontFamily: 'inherit',
      fontSize: '.9rem',
      lineHeight: '1.4',
      boxSizing: 'border-box',
      resize: 'vertical'
    }
  });

  const statusArea = h('div', { class: 'small', style: { minHeight: '18px', transition: 'all .2s' } });

  function buildReportText() {
    const tagObj = TAGS.find(t => t.id === selectedTag) || TAGS[0];
    const desc = textarea.value.trim() || 'Không có mô tả chi tiết';
    return (
      `### 💬 [Báo lỗi Lingogo] ${tagObj.label}\n` +
      `- **Ngôn ngữ:** ${langName} (${S.lang})\n` +
      `- **Vị trí bài học:** ${locText}\n` +
      `- **Thiết bị:** ${device} · ${browser} (${window.innerWidth}x${window.innerHeight})\n` +
      `- **Thời gian:** ${new Date().toLocaleString('vi-VN')}\n\n` +
      `**Mô tả của người học:**\n` +
      `${desc}\n`
    );
  }

  const copyBtn = h('button', {
    class: 'primary block',
    style: { fontWeight: 600 },
    onclick: async () => {
      const text = buildReportText();
      let ok = false;
      try {
        await navigator.clipboard.writeText(text);
        ok = true;
      } catch (err) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { ok = document.execCommand('copy'); } catch (e) {}
        ta.remove();
      }
      if (ok) {
        statusArea.innerHTML = '<span style="color:#10b981;font-weight:600">✅ Đã sao chép! Bạn dán (Ctrl+V) vào khung chat với AI để AI sửa ngay nhé!</span>';
        toast('Đã sao chép báo lỗi cho AI!');
      } else {
        statusArea.innerHTML = '<span style="color:#ef4444">Không sao chép tự động được, bạn vui lòng copy thủ công.</span>';
      }
    }
  }, '📋 Sao chép nội dung gửi AI');

  const ghIssueBtn = h('button', {
    class: 'ghost block',
    style: { display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px' },
    onclick: () => {
      const tagObj = TAGS.find(t => t.id === selectedTag) || TAGS[0];
      const title = `[Báo lỗi] ${tagObj.label.replace(/^.+?\s/, '')} - ${locText.split('·')[0].trim()}`;
      const body = buildReportText();
      const issueUrl = `https://github.com/nguyendang3103/lingogo/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
      window.open(issueUrl, '_blank');
      statusArea.innerHTML = '<span class="muted">Đã mở trang tạo Issue trên GitHub. Bạn bấm "Submit new issue" nhé!</span>';
    }
  }, icon(ICON.github, { size: 18 }), ' Mở GitHub Issue');

  const cfg = getGhConfig();
  const autoGhBtn = cfg.token ? h('button', {
    class: 'ghost mini block',
    style: { color: 'var(--teal)' },
    onclick: async () => {
      autoGhBtn.disabled = true;
      autoGhBtn.textContent = 'Đang gửi lên GitHub...';
      try {
        const tagObj = TAGS.find(t => t.id === selectedTag) || TAGS[0];
        const title = `[Báo lỗi] ${tagObj.label.replace(/^.+?\s/, '')} - ${locText.split('·')[0].trim()}`;
        const body = buildReportText();
        const res = await fetch('https://api.github.com/repos/nguyendang3103/lingogo/issues', {
          method: 'POST',
          headers: {
            'Authorization': 'token ' + cfg.token,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ title, body })
        });
        if (res.ok) {
          const data = await res.json();
          statusArea.innerHTML = `<span style="color:#10b981;font-weight:600">✅ Đã tạo Issue #${data.number} trên GitHub! AI có thể kiểm tra và sửa ngay.</span>`;
          toast(`Đã gửi Issue #${data.number} lên GitHub!`);
        } else {
          statusArea.innerHTML = `<span class="muted">Token GitHub cần thêm quyền repo để gửi trực tiếp. Bạn dùng nút "Mở GitHub Issue" hoặc "Sao chép nội dung gửi AI" nhé!</span>`;
        }
      } catch (e) {
        statusArea.innerHTML = `<span style="color:#ef4444">Không thể kết nối GitHub: ${e.message}</span>`;
      } finally {
        autoGhBtn.disabled = false;
        autoGhBtn.textContent = '🚀 Gửi thẳng qua GitHub Token đã lưu';
      }
    }
  }, '🚀 Gửi thẳng qua GitHub Token đã lưu') : null;

  const box = h('div', { class: 'modal-box stack', style: { gap: '16px' } },
    h('div', { class: 'row between', style: { alignItems: 'center' } },
      h('div', { class: 'row', style: { gap: '10px', alignItems: 'center' } },
        h('span', { class: 'sync-badge-icon', style: { color: '#eab308', background: 'rgba(234, 179, 8, .12)' } }, icon(ICON.feedback, { size: 20 })),
        h('div', {},
          h('h2', { style: { margin: 0, fontSize: '1.15rem' } }, 'Góp ý & Báo lỗi'),
          h('span', { class: 'small muted' }, 'AI sẽ tiếp nhận và sửa lỗi ngay')
        )
      ),
      h('button', { class: 'ghost mini', onclick: close, 'aria-label': 'Đóng', style: { fontSize: '1.2rem', padding: '4px 8px' } }, '✕')
    ),

    h('div', { style: { background: 'var(--sunk)', padding: '10px 14px', borderRadius: '12px', border: '1px solid var(--line)', fontSize: '.82rem' } },
      h('div', { style: { fontWeight: 600, color: 'var(--ink)', marginBottom: '4px' } }, '📍 Vị trí đang học:'),
      h('div', { class: 'muted' }, '• Ngôn ngữ: ' + langName),
      h('div', { class: 'muted' }, '• Bài học: ' + locText),
      h('div', { class: 'muted', style: { fontSize: '.75rem', marginTop: '2px' } }, '• Thiết bị: ' + device + ' (' + browser + ')')
    ),

    h('div', { class: 'stack', style: { gap: '6px' } },
      h('span', { class: 'label', style: { fontSize: '.78rem' } }, 'Loại vấn đề'),
      tagContainer
    ),

    h('div', { class: 'stack', style: { gap: '6px' } },
      h('span', { class: 'label', style: { fontSize: '.78rem' } }, 'Nội dung chi tiết'),
      textarea
    ),

    statusArea,

    h('div', { class: 'stack', style: { gap: '8px' } },
      copyBtn,
      ghIssueBtn,
      autoGhBtn
    ),

    h('p', { class: 'small muted center', style: { margin: 0, fontSize: '.76rem' } },
      'Sau khi gửi hoặc sao chép, bạn chỉ cần nhắn với AI: "AI sửa lỗi giúp mình" là AI sẽ tự động kiểm tra và cập nhật web.'
    )
  );

  overlay.append(box);
  document.body.append(overlay);
  setTimeout(() => textarea.focus(), 100);
}

function transferPanel() {
  const out = h('textarea', { class: 'code', readonly: true, rows: 3, hidden: true, 'aria-label': 'Mã tiến độ', onfocus: (e) => e.target.select() });
  const inp = h('textarea', { class: 'code', rows: 3, placeholder: 'Dán mã LGG1… vào đây', 'aria-label': 'Dán mã tiến độ' });
  const copyBtn = h('button', { class: 'ghost block', onclick: async () => {
    const code = await exportCode(); out.value = code; out.hidden = false; out.focus(); out.select();
    let ok = false; try { await navigator.clipboard.writeText(code); ok = true; } catch (e) { try { ok = document.execCommand('copy'); } catch (e2) { ok = false; } }
    toast(ok ? 'Đã sao chép mã tiến độ.' : 'Mã đã được chọn sẵn: giữ tay để Sao chép.');
  } }, 'Sao chép mã tiến độ');
  const mergeBtn = h('button', { class: 'block', onclick: async () => {
    try {
      const inc = await importCode(inp.value);
      const nL = Object.keys(S.lessons).length, nS = Object.keys(S.srs).length, nW = Object.keys(S.written).length;
      S = mergeState(S, inc); save();
      const dl = Object.keys(S.lessons).length - nL, ds = Object.keys(S.srs).length - nS, dw = Object.keys(S.written).length - nW;
      inp.value = '';
      toast(dl || ds || dw ? 'Đã gộp: thêm ' + dl + ' bài, ' + ds + ' mục ôn' + (dw ? ', ' + dw + ' chữ viết' : '') + '.' : 'Đã gộp. Hai bản vốn đã giống nhau.');
      route();
    } catch (e) { toast(e.message || 'Không đọc được mã.'); }
  } }, 'Dán mã để gộp');
  return h('div', { class: 'panel stack' }, h('h3', {}, 'Chuyển tiến độ'),
    h('p', { class: 'small muted' }, 'Dùng khi học cả bản trên Claude và bản web. Sao chép mã ở bản này, dán vào bản kia. Tiến độ được gộp, không bị ghi đè.'),
    h('button', { class: 'primary mini block', onclick: showSyncModal }, '⚙ Cấu hình tự động đồng bộ (GitHub Gist)'),
    copyBtn, out, inp, mergeBtn);
}

function progressView() {
  const t = todayN(), days = Array.from({ length: 7 }, (_, i) => t - 6 + i);
  const xd = (d) => xpOf(d, S.lang);
  const max = Math.max(goal(), ...days.map(xd));
  const wd = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
  const total = Object.values(S.days).reduce((a, b) => a + b, 0);
  const perLang = Object.entries(LANGS).filter(([c]) => c !== S.lang).map(([c, v]) => {
    const keys = Object.keys(S.srs).filter((k) => k.startsWith(c + ':'));
    const lessons = Object.keys(S.lessons).filter((k) => k.startsWith(c + ':')).length;
    return h('div', { class: 'langrow' }, h('b', { lang: v.lang }, v.label), h('span', { class: 'chip' + (metGoal(t, c) ? ' good' : '') }, xpOf(t, c) + '/' + goal() + ' XP hôm nay'),
      h('span', { class: 'small muted' }, 'Chuỗi ' + streak(c) + ' ngày · dài nhất ' + longest(c) + ' ngày'), h('span', { class: 'small muted' }, lessons + ' bài đã học'),
      h('span', { class: 'small muted' }, keys.length + ' mục đang ôn · ' + keys.filter((k) => S.srs[k].b >= 3).length + ' đã nhớ chắc'),
      h('span', { class: 'small muted' }, Object.keys(S.written).filter((k) => k.startsWith(c + ':')).length ? Object.keys(S.written).filter((k) => k.startsWith(c + ':')).length + ' chữ đã viết' : ''));
  });
  const goalSel = h('select', { id: 'goal', onchange: (e) => { S.goal = Number(e.target.value); save(); toast('Đã lưu mục tiêu.'); } },
    [[20, 'Tối thiểu · 20 XP mỗi thứ tiếng'], [30, 'Vừa phải · 30 XP mỗi thứ tiếng'], [50, 'Nghiêm túc · 50 XP mỗi thứ tiếng']].map(([v, l]) => h('option', { value: v, selected: goal() === v }, l)));
  let confirmReset = false;
  const resetBtn = h('button', { class: 'ghost block', onclick: () => { if (!confirmReset) { confirmReset = true; resetBtn.textContent = 'Bấm lần nữa để xóa toàn bộ tiến độ của cả ba thứ tiếng'; return; } S = fresh(); save(); welcomeView(); } }, 'Xóa tiến độ và học lại từ đầu');
  const c0 = S.lang, k0 = Object.keys(S.srs).filter((k) => k.startsWith(c0 + ':'));
  const xpTotal = (c) => Object.values(S.dl || {}).reduce((a, m) => a + (m[c] || 0), 0);
  const w0 = Object.keys(S.written).filter((k) => k.startsWith(c0 + ':')).length;
  mount(h('div', { class: 'stack-lg' },
    h('div', { class: 'row between' }, h('h1', {}, 'Tiến độ'), h('div', { class: 'row', style: { gap: '6px', alignItems: 'center' } }, feedbackBtn({ mode: 'progress' }), langSwitch())), 
    h('div', { class: 'stats' },
      h('div', { class: 'stat' }, h('b', {}, streak(c0)), h('span', {}, 'chuỗi ngày · dài nhất ' + longest(c0))),
      h('div', { class: 'stat' }, h('b', {}, xpOf(t, c0) + '/' + goal()), h('span', {}, 'XP hôm nay')),
      h('div', { class: 'stat' }, h('b', {}, xpTotal(c0)), h('span', {}, 'tổng XP ' + L().short))),
    h('div', { class: 'stats' },
      h('div', { class: 'stat' }, h('b', {}, Object.keys(S.lessons).filter((k) => k.startsWith(c0 + ':')).length), h('span', {}, 'bài đã học')),
      h('div', { class: 'stat' }, h('b', {}, k0.length), h('span', {}, 'mục đang ôn')),
      h('div', { class: 'stat' }, h('b', {}, LANGS[c0].cjk ? w0 : k0.filter((k) => S.srs[k].b >= 3).length), h('span', {}, LANGS[c0].cjk ? 'chữ đã viết' : 'đã nhớ chắc'))),
    h('div', { class: 'panel stack' }, h('h3', {}, 'XP ' + L().short + ' 7 ngày qua'),
      h('div', { class: 'week', role: 'img', 'aria-label': days.map((d) => wd[dayDate(d).getUTCDay()] + ': ' + xd(d) + ' XP').join(', ') },
        days.map((d) => h('div', { class: d === t ? 'today' : '' }, h('span', {}, xd(d) || ''), h('i', { style: { height: (xd(d) / max * 100) + '%' } }), h('span', {}, wd[dayDate(d).getUTCDay()]))))),
    h('div', { class: 'stack' }, h('h2', {}, 'Thành tích'),
      h('div', { class: 'badges' }, ACH.map(([code, title, desc]) => h('div', { class: 'badge' + (S.ach[code] ? '' : ' off') }, h('b', {}, title), h('p', { class: 'small muted' }, desc))))),
    h('div', { class: 'panel stack' }, h('h3', {}, 'Cài đặt'), h('label', { for: 'goal', class: 'label' }, 'Mục tiêu mỗi ngày'), goalSel, h('p', { class: 'small muted' }, 'Mỗi từ, kanji, câu hoặc tình huống làm đúng được 5 XP. Học lại bài cũ được nửa XP.'),
      h('p', { class: 'small muted' }, 'Thêm vào màn hình chính trên iPhone: mở link bằng Safari, bấm Chia sẻ, chọn “Thêm vào MH chính”.')),
    h('div', { class: 'panel stack', style: { background: 'var(--sunk)', border: '1px solid var(--line)', gap: '10px' } },
      h('div', { class: 'row between', style: { alignItems: 'center' } },
        h('div', { class: 'row', style: { gap: '10px', alignItems: 'center' } },
          h('span', { class: 'sync-badge-icon', style: { color: '#eab308', background: 'rgba(234, 179, 8, .12)' } }, icon(ICON.feedback, { size: 20 })),
          h('div', { style: { minWidth: 0 } },
            h('b', { style: { display: 'block', fontSize: '.92rem' } }, 'Góp ý & Báo lỗi cho AI'),
            h('span', { class: 'small muted', style: { fontSize: '.8rem' } }, 'Phát hiện câu sai, lỗi âm thanh hay cần tính năng mới?')
          )
        ),
        h('button', { class: 'primary mini', onclick: () => showFeedbackModal() }, 'Góp ý ngay')
      )
    ),
    transferPanel(),
    resetBtn));
}

// ===== Phím tắt: 1–9 chọn đáp án (hoặc mức nhớ khi ôn), Enter = Kiểm tra / Tiếp tục / Hiện nghĩa =====
const visible = (el) => el && !el.disabled && el.offsetParent !== null && !el.closest('[hidden]');
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
  if (/^[1-9]$/.test(e.key)) {
    const n = Number(e.key) - 1;
    const grades = [...document.querySelectorAll('.grades button')].filter(visible);
    let opts = grades.length ? grades : [...document.querySelectorAll('.options button')].filter(visible);
    if (!opts.length) opts = [...document.querySelectorAll('.langcard')].filter(visible);
    if (opts[n]) { e.preventDefault(); opts[n].click(); }
    return;
  }
  if (e.key === 'Escape' && subjectsOpen) {
    subjectsOpen = false;
    homeView();
    return;
  }
  if (e.key === 'Enter') {
    const main = [...document.querySelectorAll('.dock button')].filter((b) => visible(b) && !b.closest('.grades'))[0];
    if (main) { e.preventDefault(); main.click(); }
  }
});
document.addEventListener('click', (e) => {
  if (subjectsOpen && !e.target.closest('.subjects-box') && !e.target.closest('.langchip')) {
    subjectsOpen = false;
    homeView();
  }
});

async function checkAppUpdate() {
  try {
    const res = await fetch('version.json?_t=' + Date.now(), { cache: 'no-store' });
    if (res.ok) {
      const data = await res.json();
      if (data.build && data.build !== APP_BUILD_ID) {
        console.log('Phát hiện bản cập nhật mới:', data.build);
        window.location.reload(true);
      }
    }
  } catch (e) {}
}

// ===== Khởi động =====
(async () => {
  await handleUrlSync();
  route();
  startSync();
  startGhSync();
  checkAppUpdate();
})();
</script>
