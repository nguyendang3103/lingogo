let IELTS_MODE = 'volumes'; // Thuần túy đề thi IELTS chính thức theo năm (ieltsonlinetests.com)
let IELTS_CURRENT_VOL = '2026-1'; // Mặc định mở bộ đề mới nhất năm 2026 ở trên đầu
let IELTS_FILTER_YEAR = 'all'; // 'all', 2026, 2025, 2024, 2023, 2022

function ieltsTabView() {
  const code = S.lang;
  if (code !== 'en') return go('home');
  IELTS_MODE = 'volumes';
  const currentVol = IELTS_IOT_VOLUMES.find((v) => v.vol === IELTS_CURRENT_VOL) || IELTS_IOT_VOLUMES[0];
  const t = { id: 'vol_' + currentVol.vol, lang: 'en', title: currentVol.title, sub: currentVol.sub, level: currentVol.targetBand };
  
  IELTS_CURRENT_TOPIC = t;
  const data = getIeltsData(t, currentVol);
  const doneCount = ieltsDoneCount(t);

  // Bộ lọc năm (2026 xếp đầu, 2025, 2024, 2023, 2022)
  const years = [2026, 2025, 2024, 2023, 2022];
  const yearFilterChips = h('div', { class: 'ielts-year-chips' },
    ...['all', ...years].map((yr) => {
      const isActive = (IELTS_FILTER_YEAR === yr || (yr === 'all' && !IELTS_FILTER_YEAR));
      const lbl = yr === 'all' ? 'Tất cả năm' : (yr === 2026 ? '⚡ 2026 Mới nhất' : 'Năm ' + yr);
      return h('button', {
        class: isActive ? 'primary' : 'ghost',
        style: { border: isActive ? 'none' : '1px solid var(--line)' },
        onclick: () => {
          IELTS_FILTER_YEAR = yr;
          if (yr !== 'all') {
            const firstOfYr = IELTS_IOT_VOLUMES.find((v) => v.year === yr);
            if (firstOfYr) IELTS_CURRENT_VOL = firstOfYr.vol;
          }
          ieltsTabView();
        }
      }, lbl);
    })
  );

  // Menu chọn đề thi theo từng năm (2026 ở trên đầu)
  const displayedVols = (IELTS_FILTER_YEAR === 'all')
    ? IELTS_IOT_VOLUMES
    : IELTS_IOT_VOLUMES.filter((v) => v.year === parseInt(IELTS_FILTER_YEAR, 10));

  const volGroups = years.map((yr) => {
    const list = displayedVols.filter((v) => v.year === yr);
    if (!list.length) return null;
    const label = yr === 2026 ? '✨ Đề thi IELTS 2026 (Mới nhất)' : ('📅 Đề thi IELTS ' + yr);
    return h('optgroup', { label }, ...list.map((v) => h('option', {
      value: v.vol,
      selected: currentVol && currentVol.vol === v.vol
    }, '📄 ' + v.code + ': ' + v.title + ' (' + v.type + ' · ' + v.targetBand + ')')));
  }).filter(Boolean);

  const volSelect = h('select', {
    class: 'ielts-vol-select',
    'aria-label': 'Kho đề thi IELTS 2022–2026',
    onchange: (e) => {
      IELTS_CURRENT_VOL = e.target.value;
      IELTS_ACTIVE_SKILL = 'listen';
      ieltsTabView();
    }
  }, ...volGroups);

  const head = h('div', { class: 'stack' },
    h('div', { class: 'row between wrap', style: { alignItems: 'center', gap: '8px' } },
      h('h1', { style: { margin: 0 } }, 'Luyện IELTS'),
      h('div', { class: 'row', style: { gap: '6px', alignItems: 'center', flexWrap: 'wrap' } },
        h('button', {
          class: 'mini ghost',
          style: { border: '1px solid #d97706', color: '#d97706', fontWeight: 600, padding: '4px 8px' },
          onclick: () => showIeltsTipsModal(IELTS_ACTIVE_SKILL)
        }, '💡 Cẩm nang Tip'),
        feedbackBtn({ mode: 'ielts', topicId: t.id, topicTitle: t.sub || t.title }),
        langSwitch()
      )
    ),
    h('p', { class: 'small muted', style: { marginTop: '-4px' } }, 'Kho đề thi thực tế IELTS 2022–2026 (ieltsonlinetests.com) · 🎧 Nghe ➔ 🎙️ Nói ➔ 📖 Đọc ➔ ✍️ Viết'),
    h('div', { class: 'stack', style: { gap: '4px' } }, yearFilterChips, volSelect),
    h('div', { class: 'ielts-info-banner' },
      h('div', { class: 'row', style: { gap: '8px', alignItems: 'center', flexWrap: 'wrap' } },
        h('span', { class: 'chip level', style: { fontWeight: 700 } }, currentVol ? currentVol.code : (t.level || 'B1')),
        h('b', { style: { color: 'var(--teal)', fontSize: '1.02rem' } }, currentVol ? currentVol.targetBand : data.band),
        h('span', { class: 'small muted', style: { wordBreak: 'break-word' } }, currentVol ? currentVol.sub : (t.sub || t.title))
      ),
      h('div', { class: 'row between', style: { gap: '8px', alignItems: 'center', flexWrap: 'wrap', width: '100%', justifyContent: 'space-between' } },
        h('span', { class: 'chip small' + (doneCount === 4 ? ' good' : '') }, doneCount + '/4 kỹ năng ✓'),
        doneCount > 0 ? h('button', { class: 'mini accent', onclick: () => showIeltsSummaryModal(t) }, '📊 Bảng điểm Mock TRF') : null
      )
    )
  );

  const skills = [
    ['listen', '🎧 Nghe', 'Listen'],
    ['speak', '🎙️ Nói', 'Speak'],
    ['read', '📖 Đọc', 'Read'],
    ['write', '✍️ Viết', 'Write']
  ];

  const skillTabs = h('div', { class: 'ielts-tabs' },
    ...skills.map(([sk, iconLabel, enLabel]) => {
      const isDone = isIeltsDone(t, sk);
      const isActive = IELTS_ACTIVE_SKILL === sk;
      const bStr = getIeltsBand(t, sk);
      return h('button', {
        class: 'ielts-tab-btn' + (isActive ? ' active' : ''),
        onclick: () => { IELTS_ACTIVE_SKILL = sk; ieltsTabView(); }
      },
        h('span', { style: { fontSize: '.92rem' } }, iconLabel),
        h('span', { style: { fontSize: '.72rem', opacity: isActive ? 1 : 0.8 } },
          isDone ? (bStr !== 'Chưa thi' ? 'Band ' + bStr : '✓ Xong') : enLabel
        )
      );
    })
  );

  let contentEl = null;
  if (IELTS_ACTIVE_SKILL === 'listen') contentEl = renderIeltsListening(t, data);
  else if (IELTS_ACTIVE_SKILL === 'speak') contentEl = renderIeltsSpeaking(t, data);
  else if (IELTS_ACTIVE_SKILL === 'read') contentEl = renderIeltsReading(t, data);
  else contentEl = renderIeltsWriting(t, data);

  mount(h('div', { class: 'stack-lg', style: { paddingBottom: '70px' } }, head, skillTabs, contentEl));
}

// 1. Giao diện IELTS Listening
function renderIeltsListening(t, data) {
  const code = 'en';
  const ls = data.listening;
  const audioSrc = ls.audioSrc || IELTS_AUDIO_MAP[IELTS_CURRENT_VOL] || 'English/audio/ielts/iot-2026-1.mp3';
  let isPlaying = false;
  let showTranscript = false;
  let slowSpeed = false;

  const statusText = h('span', { class: 'small muted' }, 'Sẵn sàng phát đĩa nghe MP3');

  const audioPlayer = h('audio', {
    controls: 'controls',
    preload: 'metadata',
    src: audioSrc,
    style: { width: '100%', height: '38px', marginTop: '4px' }
  });

  const playBtn = h('button', { class: 'primary', onclick: () => {
    if (!audioPlayer.paused) {
      audioPlayer.pause();
    } else {
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      audioPlayer.playbackRate = slowSpeed ? 0.8 : 1.0;
      audioPlayer.play().catch(() => {
        say(code, ls.audioText, slowSpeed);
      });
    }
  } }, '▶ Nghe bài nói');

  audioPlayer.addEventListener('play', () => {
    isPlaying = true;
    playBtn.textContent = '⏸ Tạm dừng';
    statusText.textContent = 'Đang phát bài nghe IELTS…';
  });
  audioPlayer.addEventListener('pause', () => {
    isPlaying = false;
    playBtn.textContent = '▶ Nghe bài nói';
    if (audioPlayer.currentTime > 0 && !audioPlayer.ended) {
      statusText.textContent = 'Đã tạm dừng';
    }
  });
  audioPlayer.addEventListener('ended', () => {
    isPlaying = false;
    playBtn.textContent = '▶ Nghe bài nói';
    statusText.textContent = 'Đã nghe xong ✓';
  });

  const replayBtn = h('button', { class: 'ghost mini', onclick: () => {
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    audioPlayer.currentTime = 0;
    audioPlayer.playbackRate = slowSpeed ? 0.8 : 1.0;
    audioPlayer.play().catch(() => {
      say(code, ls.audioText, slowSpeed);
    });
  } }, '⏪ Nghe lại từ đầu');

  const speedBtn = h('button', { class: 'ghost mini', onclick: () => {
    slowSpeed = !slowSpeed;
    audioPlayer.playbackRate = slowSpeed ? 0.8 : 1.0;
    speedBtn.textContent = slowSpeed ? 'Tốc độ: 0.8x (Chậm)' : 'Tốc độ: 1.0x (Chuẩn)';
  } }, 'Tốc độ: 1.0x (Chuẩn)');

  const transcriptBox = h('div', {
    class: 'panel stack',
    style: { display: 'none', background: 'var(--surface)', fontSize: '.9rem', lineHeight: 1.55, gap: '8px' }
  },
    ...(ls.lines && ls.lines.length
      ? ls.lines.map((ln) => h('div', { class: 'panel', style: { background: 'var(--sunk)', padding: '8px 10px', borderRadius: '8px' } },
          h('div', { class: 'row between', style: { alignItems: 'center', gap: '6px' } },
            h('b', { style: { color: 'var(--teal)' } }, ln.speaker + ':'),
            h('div', { class: 'row', style: { gap: '4px' } },
              spk('en', ln.text),
              spk('en', ln.text, { slow: true })
            )
          ),
          h('p', { lang: 'en', style: { margin: '4px 0 2px 0' } }, ln.text),
          ln.vi ? h('p', { class: 'small muted', style: { margin: 0 } }, ln.vi) : null
        ))
      : [h('div', { style: { whiteSpace: 'pre-wrap' } }, ls.transcript)])
  );

  const transcriptToggleBtn = h('button', { class: 'ghost mini', onclick: () => {
    showTranscript = !showTranscript;
    transcriptBox.style.display = showTranscript ? 'flex' : 'none';
    transcriptToggleBtn.textContent = showTranscript ? 'Ẩn Transcript ▴' : '📜 Xem Transcript & Nghe từng câu ▾';
  } }, '📜 Xem Transcript & Nghe từng câu ▾');

  // Question 1: Multiple Choice
  let selectedMc = null;
  const mcOptionBtns = ls.mc.options.map((opt, idx) => {
    const btn = h('button', {
      class: 'sentence',
      style: { textAlign: 'left', margin: '4px 0', border: '1px solid var(--line)' },
      onclick: () => {
        selectedMc = idx;
        mcOptionBtns.forEach((b, j) => {
          b.style.borderColor = (j === idx) ? 'var(--teal)' : 'var(--line)';
          b.style.background = (j === idx) ? 'rgba(15, 82, 87, 0.08)' : '';
        });
      }
    }, h('span', { class: 'kbd' }, String.fromCharCode(65 + idx)), h('span', { class: 'grow' }, opt));
    return btn;
  });

  // Question 2: Fill-in blank
  const fillInput = h('input', {
    type: 'text',
    placeholder: 'Gõ từ còn thiếu vào đây…',
    autocomplete: 'off',
    style: { maxWidth: '280px', marginTop: '6px' }
  });

  const feedbackArea = h('div', { class: 'panel stack', style: { display: 'none' } });

  const submitBtn = h('button', { class: 'accent block', style: { marginTop: '12px' }, onclick: () => {
    let score = 0;
    const isMcCorrect = selectedMc === ls.mc.answer;
    if (isMcCorrect) score += 50;
    const userFill = (fillInput.value || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
    const isFillCorrect = userFill === ls.fill.target;
    if (isFillCorrect) score += 50;

    const band = (isMcCorrect && isFillCorrect) ? '8.5' : (isMcCorrect || isFillCorrect) ? '6.5' : '5.0';
    feedbackArea.style.display = 'block';
    feedbackArea.replaceChildren(
      h('button', {
        class: 'primary block',
        style: { marginBottom: '14px', padding: '12px', fontSize: '1rem', fontWeight: 700, borderRadius: '10px' },
        onclick: () => {
          IELTS_ACTIVE_SKILL = 'speak';
          ieltsTabView();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }, 'Chuyển sang kỹ năng kế tiếp: Nói (Speaking) ➔'),
      h('div', { class: 'row between', style: { alignItems: 'center' } },
        h('h3', { style: { margin: 0 } }, isMcCorrect && isFillCorrect ? '🎉 Xuất sắc! Đúng cả 2/2 câu' : 'Kết quả bài nghe: ' + (score / 50) + '/2 câu đúng'),
        h('span', { class: 'chip good', style: { fontSize: '.95rem', fontWeight: 700 } }, 'Band ' + band)
      ),
      h('p', {}, '1. Trắc nghiệm: ' + (isMcCorrect ? '✓ Chính xác' : '✗ Chưa đúng (Đáp án: ' + String.fromCharCode(65 + ls.mc.answer) + ')')),
      h('p', { class: 'small muted' }, ls.mc.why),
      h('p', {}, '2. Điền từ: ' + (isFillCorrect ? '✓ Chính xác (' + ls.fill.rawTarget + ')' : '✗ Chưa đúng. Đáp án: "' + ls.fill.rawTarget + '"')),
      h('p', { class: 'small muted' }, ls.fill.hint)
    );

    markIeltsDone(t, 'listen', Math.max(score, 60), band);
  } }, 'Kiểm tra đáp án & Nộp bài (+15 XP)');

  return h('div', { class: 'stack-lg' },
    h('div', { class: 'panel stack' },
      h('div', { class: 'row between' },
        h('b', {}, '🎧 IELTS Listening · Bài nghe thực tế'),
        statusText
      ),
      h('p', { class: 'small muted' }, 'Lắng nghe đoạn hội thoại hoặc độc thoại chuẩn bản xứ, sau đó hoàn thành các câu hỏi bên dưới.'),
      ieltsTipBox('Tip: Chiến lược & Bẫy nghe (Listening)', [
        'Dự đoán loại từ (danh từ số ít/nhiều, tên riêng, con số) trong 30–45s trước khi nghe.',
        'Cảnh giác bẫy Distractor: Người nói thường đưa thông tin rồi sửa lại (Actually, Sorry, However, I thought so at first but...).',
        'Tuân thủ tuyệt đối giới hạn số từ và chính tả (Spelling, số nhiều -s/-es).',
        'Bỏ qua ngay khi bị lỡ (Move on): Không dừng lại suy nghĩ tránh mất điểm 3–4 câu kế tiếp.'
      ], 'listening'),
      h('div', { class: 'panel stack', style: { background: 'rgba(15, 82, 87, 0.06)', border: '1px solid var(--teal)', borderRadius: '10px', padding: '10px 12px', gap: '6px' } },
        h('div', { class: 'row between wrap', style: { alignItems: 'center', gap: '6px' } },
          h('b', { style: { color: 'var(--teal)', fontSize: '.88rem' } }, '🎧 Đĩa Audio Đề Thi IELTS (MP3): ' + (ls.title || 'Section 1')),
          h('a', {
            href: audioSrc,
            download: audioSrc.split('/').pop(),
            class: 'chip good small',
            style: { textDecoration: 'none', fontWeight: 600, display: 'inline-flex', alignItems: 'center', gap: '4px' }
          }, '⬇️ Tải MP3')
        ),
        audioPlayer
      ),
      h('div', { class: 'row', style: { gap: '8px', flexWrap: 'wrap' } }, playBtn, replayBtn, speedBtn, transcriptToggleBtn),
      transcriptBox
    ),
    h('div', { class: 'panel stack' },
      h('p', { class: 'label' }, 'Câu hỏi 1 · Multiple Choice (Trắc nghiệm)'),
      h('p', { style: { fontWeight: 600 } }, ls.mc.q),
      h('div', { class: 'stack', style: { gap: '4px' } }, ...mcOptionBtns)
    ),
    h('div', { class: 'panel stack' },
      h('p', { class: 'label' }, 'Câu hỏi 2 · Note Completion (Điền từ)'),
      h('p', { class: 'small muted' }, ls.fill.prompt),
      h('p', { style: { fontSize: '1.02rem', lineHeight: 1.6 } }, ls.fill.sentence),
      h('div', { class: 'row', style: { gap: '8px', alignItems: 'center', flexWrap: 'wrap' } }, fillInput, h('span', { class: 'small muted' }, ls.fill.hint))
    ),
    submitBtn,
    feedbackArea
  );
}

// Bộ ghi âm & nhận diện giọng nói cho IELTS Speaking
function createIeltsSpeechRecorder(promptText, sampleAnswer, onFinished) {
  const box = h('div', { class: 'ielts-speak-recorder stack' });
  let isRecording = false;
  let mediaRecorder = null;
  let recordedChunks = [];
  let stream = null;
  let timerInterval = null;
  let seconds = 0;
  let recognizedText = '';

  const statusLabel = h('p', { class: 'small muted', style: { margin: '0' } }, 'Bấm Micro để ghi âm câu trả lời của bạn:');
  const timerBadge = h('span', { class: 'chip small', style: { display: 'none', background: 'var(--bad)', color: '#fff', fontWeight: 700 } }, '● Đang ghi âm: 00:00');
  const transcriptEl = h('div', { class: 'small', style: { display: 'none', background: 'rgba(15, 82, 87, 0.05)', padding: '8px 10px', borderRadius: '8px', lineHeight: 1.5, margin: '4px 0' } });
  const audioPlayerWrap = h('div', { style: { display: 'none', margin: '4px 0' } });

  const recordBtn = h('button', {
    class: 'primary mini',
    style: { display: 'inline-flex', alignItems: 'center', gap: '6px', fontWeight: 600 },
    onclick: async () => {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    }
  }, '🎙️ Bấm để ghi âm');

  async function startRecording() {
    isRecording = true;
    box.className = 'ielts-speak-recorder recording stack';
    recordBtn.className = 'accent mini';
    recordBtn.textContent = '⏹ Dừng ghi âm';
    timerBadge.style.display = 'inline-block';
    statusLabel.textContent = 'Đang ghi âm... Hãy nói to và rõ câu trả lời vào micro:';
    transcriptEl.style.display = 'block';
    transcriptEl.textContent = 'Đang nhận diện giọng nói...';
    audioPlayerWrap.style.display = 'none';

    seconds = 0;
    timerBadge.textContent = '● Đang ghi âm: 00:00';
    timerInterval = setInterval(() => {
      seconds++;
      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      timerBadge.textContent = '● Đang ghi âm: ' + m + ':' + s;
    }, 1000);

    // Thu âm bằng MediaRecorder nếu trình duyệt hỗ trợ
    recordedChunks = [];
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) recordedChunks.push(e.data);
        };
        mediaRecorder.onstop = () => {
          const mime = (mediaRecorder && mediaRecorder.mimeType) || 'audio/webm';
          const blob = new Blob(recordedChunks, { type: mime });
          const url = URL.createObjectURL(blob);
          const aud = h('audio', { controls: 'controls', src: url, style: { width: '100%', height: '36px', marginTop: '4px' } });
          audioPlayerWrap.replaceChildren(
            h('p', { class: 'small muted', style: { margin: '2px 0', fontWeight: 600 } }, '🎧 Nghe lại phần nói vừa ghi âm của bạn:'),
            aud
          );
          audioPlayerWrap.style.display = 'block';
          if (stream) {
            try { stream.getTracks().forEach(t => t.stop()); } catch (e) {}
          }
        };
        mediaRecorder.start();
      } catch (err) {
        console.log('MediaRecorder info:', err);
      }
    }

    // Nhận diện chữ viết bằng Web Speech API
    tryListen('en', (interim) => {
      if (isRecording) {
        transcriptEl.textContent = interim;
      }
    }).then((said) => {
      if (said) {
        recognizedText = said;
        const words = said.trim().split(/\s+/).length;
        transcriptEl.replaceChildren(
          h('p', { style: { margin: 0, fontWeight: 600 } }, '🗣️ Máy nghe được: “' + said + '”'),
          h('div', { class: 'row between wrap', style: { marginTop: '4px', alignItems: 'center', gap: '4px' } },
            h('span', { class: 'chip good small' }, 'Độ dài: ' + words + ' từ'),
            h('span', { class: 'small muted' }, words >= 12 ? '✓ Độ dài tốt chuẩn Band 7.0+' : '💡 Nên mở rộng thêm 1–2 câu giải thích/ví dụ')
          )
        );
      } else if (!recognizedText) {
        transcriptEl.textContent = 'Đã hoàn thành lượt nói. Bạn có thể nghe lại audio bên dưới!';
      }
      if (onFinished) onFinished(said);
    }).catch(() => {});
  }

  function stopRecording() {
    isRecording = false;
    clearInterval(timerInterval);
    if (ACTIVE_STOP_FN) {
      try { ACTIVE_STOP_FN(); } catch (e) {}
    }
    box.className = 'ielts-speak-recorder stack';
    recordBtn.className = 'ghost mini';
    recordBtn.textContent = '🔄 Ghi âm lại';
    timerBadge.style.display = 'none';
    statusLabel.textContent = 'Đã hoàn thành lượt ghi âm!';

    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      try { mediaRecorder.stop(); } catch (e) {}
    }
  }

  const btnRow = h('div', { class: 'row', style: { gap: '8px', alignItems: 'center', flexWrap: 'wrap' } },
    recordBtn,
    timerBadge
  );

  box.replaceChildren(
    statusLabel,
    btnRow,
    transcriptEl,
    audioPlayerWrap
  );

  return box;
}

// 2. Giao diện IELTS Speaking
function renderIeltsSpeaking(t, data) {
  const spk = data.speaking;
  let partTab = 'p1';

  const partTabs = h('div', { class: 'ielts-mode-switch', style: { gridTemplateColumns: 'repeat(3, 1fr)' } },
    h('button', { class: 'mini ' + (partTab === 'p1' ? 'primary' : 'ghost'), style: { border: partTab === 'p1' ? 'none' : '1px solid var(--line)' }, onclick: () => { partTab = 'p1'; renderPart(); } }, 'Part 1'),
    h('button', { class: 'mini ' + (partTab === 'p2' ? 'primary' : 'ghost'), style: { border: partTab === 'p2' ? 'none' : '1px solid var(--line)' }, onclick: () => { partTab = 'p2'; renderPart(); } }, 'Part 2 Cue Card'),
    h('button', { class: 'mini ' + (partTab === 'p3' ? 'primary' : 'ghost'), style: { border: partTab === 'p3' ? 'none' : '1px solid var(--line)' }, onclick: () => { partTab = 'p3'; renderPart(); } }, 'Part 3 Thảo luận')
  );

  const container = h('div', { class: 'stack-lg' });

  function renderPart() {
    partTabs.querySelectorAll('button').forEach((b, idx) => {
      const match = (idx === 0 && partTab === 'p1') || (idx === 1 && partTab === 'p2') || (idx === 2 && partTab === 'p3');
      b.className = 'mini ' + (match ? 'primary' : 'ghost');
    });

    if (partTab === 'p1') {
      container.replaceChildren(
        h('div', { class: 'panel stack' },
          h('b', {}, 'Part 1: Personal Interview (Phỏng vấn cá nhân)'),
          ieltsTipBox('Tip: Phòng thi Speaking Part 1', [
            'Không nghe rõ: "Could you please repeat the question?" (Hỏi lại lịch sự, không bị trừ điểm).',
            'Tránh trả lời cộc lốc: Áp dụng công thức P-E-E-R (Point ➔ Explanation ➔ Example ➔ Result).',
            'Tránh nhồi nhét idioms sáo rỗng ("rain cats and dogs"), dùng Collocations tự nhiên.'
          ], 'speaking'),
          h('p', { class: 'small muted' }, 'Giám khảo sẽ hỏi bạn 2–3 câu hỏi quen thuộc về cuộc sống và thói quen hàng ngày. Bấm Micro để luyện nói từng câu hoặc xem câu trả lời mẫu Band 8.0+.'),
          ...spk.part1.map((p, idx) => {
            let showModel = false;
            const modelBox = h('div', { class: 'panel', style: { display: 'none', background: 'rgba(15, 82, 87, 0.06)' } },
              h('p', { class: 'label' }, 'Câu trả lời mẫu Band 8.0+'),
              h('p', { lang: 'en', style: { fontWeight: 600 } }, p.sa),
              listenBtns('en', p.sa)
            );
            const toggleModelBtn = h('button', { class: 'ghost mini', onclick: () => {
              showModel = !showModel;
              modelBox.style.display = showModel ? 'block' : 'none';
              toggleModelBtn.textContent = showModel ? 'Ẩn câu trả lời mẫu' : '💡 Xem câu trả lời mẫu Band 8.0+';
            } }, '💡 Xem câu trả lời mẫu Band 8.0+');

            const recBox = createIeltsSpeechRecorder(p.q, p.sa);

            return h('div', { class: 'stack', style: { padding: '10px 0', borderBottom: '1px solid var(--line)' } },
              h('p', { style: { fontWeight: 600 } }, (idx + 1) + '. ' + p.q),
              p.vi && h('p', { class: 'small muted' }, p.vi),
              h('p', { class: 'small' }, h('span', { class: 'chip accent' }, 'Gợi ý bắt đầu:'), ' ' + p.st),
              recBox,
              h('div', { class: 'row', style: { gap: '6px', alignItems: 'center', marginTop: '4px' } }, toggleModelBtn),
              modelBox
            );
          })
        ),
        h('div', { class: 'ielts-action-col' },
          h('button', { class: 'accent block grow', onclick: () => { markIeltsDone(t, 'speak', 85, '7.5'); toast('Đã lưu kết quả Part 1!'); } }, 'Hoàn thành Part 1 (+15 XP)'),
          h('button', { class: 'primary block grow', onclick: () => { partTab = 'p2'; renderPart(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }, 'Sang Part 2 (Cue Card) ➔')
        )
      );
    } else if (partTab === 'p2') {
      // Part 2: Cue Card
      let timerInterval = null;
      let secondsLeft = 60;
      let timerType = 'prep';

      const timerNum = h('span', { class: 'ielts-timer-num' }, '01:00');
      const timerLabel = h('span', { class: 'small muted' }, 'Thời gian chuẩn bị (1 phút)');

      const startPrepBtn = h('button', { class: 'primary mini', onclick: () => {
        clearInterval(timerInterval);
        secondsLeft = 60;
        timerType = 'prep';
        timerLabel.textContent = 'Đang đếm ngược 1 phút chuẩn bị…';
        timerInterval = setInterval(() => {
          secondsLeft--;
          const m = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
          const s = String(secondsLeft % 60).padStart(2, '0');
          timerNum.textContent = m + ':' + s;
          if (secondsLeft <= 0) {
            clearInterval(timerInterval);
            timerLabel.textContent = 'Hết giờ chuẩn bị! Hãy bắt đầu nói 2 phút.';
            toast('🔔 Hết 1 phút chuẩn bị! Bắt đầu nói.');
          }
        }, 1000);
      } }, '⏱️ Bắt đầu 1 Phút chuẩn bị');

      const startSpeakBtn = h('button', { class: 'accent mini', onclick: () => {
        clearInterval(timerInterval);
        secondsLeft = 120;
        timerType = 'speak';
        timerLabel.textContent = 'Đang đếm ngược 2 phút nói độc thoại…';
        timerInterval = setInterval(() => {
          secondsLeft--;
          const m = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
          const s = String(secondsLeft % 60).padStart(2, '0');
          timerNum.textContent = m + ':' + s;
          if (secondsLeft <= 0) {
            clearInterval(timerInterval);
            timerLabel.textContent = 'Hết 2 phút nói! Hoàn thành phần Part 2.';
            toast('🎉 Hoàn thành 2 phút nói độc thoại!');
          }
        }, 1000);
      } }, '🎙️ Bắt đầu 2 Phút nói');

      let showModelP2 = false;
      const modelP2Box = h('div', { class: 'panel', style: { display: 'none', background: 'rgba(15, 82, 87, 0.06)' } },
        h('p', { class: 'label' }, 'Bài nói độc thoại mẫu Band 8.5 (2 Minutes Monologue)'),
        h('p', { lang: 'en', style: { lineHeight: 1.6 } }, spk.part2.modelAnswer),
        listenBtns('en', spk.part2.modelAnswer)
      );

      const toggleModelP2Btn = h('button', { class: 'ghost mini', onclick: () => {
        showModelP2 = !showModelP2;
        modelP2Box.style.display = showModelP2 ? 'block' : 'none';
        toggleModelP2Btn.textContent = showModelP2 ? 'Ẩn bài mẫu độc thoại' : '💡 Xem bài nói mẫu Band 8.5';
      } }, '💡 Xem bài nói mẫu Band 8.5');

      const cueRecorder = createIeltsSpeechRecorder(spk.part2.title, spk.part2.modelAnswer);

      container.replaceChildren(
        h('div', { class: 'ielts-cue-card stack' },
          h('div', { class: 'row between' },
            h('span', { class: 'chip level', style: { fontWeight: 700 } }, 'IELTS CANDIDATE TASK CARD'),
            h('span', { class: 'small muted' }, 'Part 2 Long Turn')
          ),
          h('h3', { style: { margin: '6px 0' } }, spk.part2.title),
          ieltsTipBox('Tip: Chuẩn bị 1 phút & nói 2 phút (Part 2 Long Turn)', [
            'Lập dàn ý bám sát 4 câu hỏi gợi ý trên Cue Card (Who - When - Where - Why).',
            'Xử lý khi bị "lệch tủ": Bình tĩnh kể chuyện chân thực tự nhiên thay vì cố nhớ bài mẫu.',
            'Tránh filler rác (uhm, ah, like, you know): Tập thói quen tạm dừng im lặng 1 giây để thở và sắp xếp ý.'
          ], 'speaking'),
          h('p', { class: 'small muted' }, 'You should say:'),
          h('ul', { style: { paddingLeft: '20px', lineHeight: 1.6 } }, ...spk.part2.prompts.map((pm) => h('li', {}, pm))),
          h('div', { class: 'ielts-timer-box' },
            timerNum,
            h('div', { class: 'stack grow', style: { minWidth: '180px' } },
              timerLabel,
              h('div', { class: 'row wrap', style: { gap: '6px' } }, startPrepBtn, startSpeakBtn)
            )
          ),
          h('div', { class: 'stack', style: { marginTop: '8px' } },
            h('b', { style: { fontSize: '.88rem' } }, '🎙️ Thu âm bài nói 2 phút độc thoại của bạn:'),
            cueRecorder
          ),
          h('div', { class: 'row', style: { marginTop: '8px' } }, toggleModelP2Btn),
          modelP2Box
        ),
        h('div', { class: 'ielts-action-col' },
          h('button', { class: 'accent block grow', onclick: () => { markIeltsDone(t, 'speak', 90, '8.0'); toast('Đã lưu kết quả Part 2!'); } }, 'Hoàn thành Part 2 (+15 XP)'),
          h('button', { class: 'primary block grow', onclick: () => { partTab = 'p3'; renderPart(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }, 'Sang Part 3 (Thảo luận) ➔')
        )
      );
    } else {
      // Part 3: Discussion
      container.replaceChildren(
        h('div', { class: 'panel stack' },
          h('b', {}, 'Part 3: Two-way Discussion (Thảo luận phản biện sâu)'),
          ieltsTipBox('Tip: Chiến lược phản biện Speaking Part 3', [
            'Cần thời gian suy nghĩ: Dùng filler học thuật "That’s a thought-provoking question, let me consider that for a moment..."',
            'Tránh connectives overload: Đừng bắt đầu mọi câu bằng Furthermore/Moreover, hãy dùng Also, On top of that, In fact.',
            'Chưa có trải nghiệm: "To be fair, I don’t have much firsthand experience with this, but from what I’ve observed..."'
          ], 'speaking'),
          h('p', { class: 'small muted' }, 'Giám khảo sẽ mở rộng câu hỏi mang tính xã hội và tư duy phản biện. Đòi hỏi bạn dùng từ vựng nâng cao và cấu trúc lập luận nhiều chiều.'),
          ...spk.part3.map((p, idx) => {
            const p3RecBox = createIeltsSpeechRecorder(p.q, p.sa);
            return h('div', { class: 'stack', style: { padding: '10px 0', borderBottom: '1px solid var(--line)' } },
              h('p', { style: { fontWeight: 600 } }, (idx + 1) + '. ' + p.q),
              p.vi && h('p', { class: 'small muted' }, p.vi),
              p3RecBox,
              h('div', { class: 'panel', style: { background: 'rgba(15, 82, 87, 0.05)', marginTop: '6px' } },
                h('p', { class: 'label' }, 'Mẫu câu trả lời Band 8.5'),
                h('p', { lang: 'en', style: { lineHeight: 1.6 } }, p.sa),
                listenBtns('en', p.sa)
              )
            );
          })
        ),
        h('div', { class: 'stack', style: { gap: '8px' } },
          h('button', { class: 'accent block', onclick: () => markIeltsDone(t, 'speak', 95, '8.5') }, 'Hoàn thành bài luyện Nói (+15 XP · Band 8.5)'),
          h('button', {
            class: 'primary block',
            style: { padding: '12px', fontSize: '1rem', fontWeight: 700, borderRadius: '10px' },
            onclick: () => {
              IELTS_ACTIVE_SKILL = 'read';
              ieltsTabView();
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }
          }, 'Chuyển sang kỹ năng kế tiếp: Đọc (Reading) ➔')
        )
      );
    }
  }

  renderPart();
  return h('div', { class: 'stack-lg' }, partTabs, container);
}

// 3. Giao diện IELTS Reading
function renderIeltsReading(t, data) {
  const rd = data.reading;

  const passageBox = h('div', { class: 'ielts-passage' },
    ...rd.paragraphs.map((p, idx) => h('p', {}, h('b', { style: { color: 'var(--teal)', marginRight: '6px' } }, '[' + String.fromCharCode(65 + idx) + ']'), p))
  );

  const vocabBox = h('div', { class: 'panel stack' },
    h('b', {}, 'Từ vựng học thuật quan trọng trong bài đọc (Key IELTS Vocabulary)'),
    h('div', { class: 'row', style: { gap: '6px', flexWrap: 'wrap' } },
      ...rd.vocab.map((v) => h('button', {
        class: 'chip',
        style: { fontSize: '.84rem', cursor: 'pointer' },
        onclick: () => { say('en', v.w); toast(v.w + ' ' + (v.r || '') + ': ' + v.m); }
      }, '🔊 ' + v.w + ' (' + v.m + ')'))
    )
  );

  // True / False / Not Given
  const tfngAnswers = {};
  const tfngContainers = rd.tfng.map((item, idx) => {
    const btnRow = h('div', { class: 'ielts-tfng-row' });
    ['TRUE', 'FALSE', 'NOT GIVEN'].forEach((opt) => {
      const b = h('button', {
        class: 'mini ghost',
        onclick: () => {
          tfngAnswers[idx] = opt;
          btnRow.querySelectorAll('button').forEach((other) => {
            other.className = (other.textContent === opt) ? 'mini primary' : 'mini ghost';
          });
        }
      }, opt);
      btnRow.appendChild(b);
    });

    const expBox = h('div', { class: 'small muted', style: { display: 'none', marginTop: '6px', lineHeight: 1.5 } });

    return {
      el: h('div', { class: 'stack', style: { padding: '10px 0', borderBottom: '1px solid var(--line)' } },
        h('p', { style: { fontWeight: 600 } }, (idx + 1) + '. ' + item.stmt),
        btnRow,
        expBox
      ),
      item,
      expBox
    };
  });

  const feedbackArea = h('div', { class: 'panel stack', style: { display: 'none' } });

  const submitBtn = h('button', { class: 'accent block', onclick: () => {
    let correctCount = 0;
    tfngContainers.forEach(({ item, expBox }, idx) => {
      const userAns = tfngAnswers[idx];
      const isRight = userAns === item.ans;
      if (isRight) correctCount++;
      expBox.style.display = 'block';
      expBox.innerHTML = '<b style="color:' + (isRight ? 'var(--good)' : 'var(--bad)') + '">' +
        (isRight ? '✓ Đúng (' + item.ans + ')' : '✗ Chưa đúng. Đáp án: ' + item.ans) + '</b><br>' +
        '<i>Dẫn chứng:</i> ' + item.clue + '<br>' + item.why;
    });

    const band = correctCount === rd.tfng.length ? '8.5' : correctCount >= 2 ? '7.5' : correctCount === 1 ? '6.0' : '5.0';
    feedbackArea.style.display = 'block';
    feedbackArea.replaceChildren(
      h('button', {
        class: 'primary block',
        style: { marginBottom: '14px', padding: '12px', fontSize: '1rem', fontWeight: 700, borderRadius: '10px' },
        onclick: () => {
          IELTS_ACTIVE_SKILL = 'write';
          ieltsTabView();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }, 'Chuyển sang kỹ năng kế tiếp: Viết (Writing) ➔'),
      h('div', { class: 'row between', style: { alignItems: 'center' } },
        h('h3', { style: { margin: 0 } }, correctCount === rd.tfng.length ? '🎉 Hoàn hảo! Đúng ' + correctCount + '/' + rd.tfng.length + ' câu True/False/Not Given' : 'Đúng ' + correctCount + '/' + rd.tfng.length + ' câu'),
        h('span', { class: 'chip good', style: { fontSize: '.95rem', fontWeight: 700 } }, 'Band ' + band)
      ),
      h('p', { class: 'small muted' }, 'Hệ thống đã hiển thị câu dẫn chứng trực tiếp trong đoạn văn ở từng câu hỏi.')
    );

    markIeltsDone(t, 'read', Math.round((correctCount / rd.tfng.length) * 100), band);
  } }, 'Kiểm tra đáp án & Nộp bài (+15 XP)');

  return h('div', { class: 'stack-lg' },
    h('div', { class: 'panel stack' },
      h('div', { class: 'row between' },
        h('b', {}, '📖 IELTS Academic Reading · Đoạn văn học thuật'),
      ieltsTipBox('Tip: Chiến lược Đọc hiệu quả', [
        'Đọc tổng quan 1–2 phút nắm cấu trúc trước khi trả lời câu hỏi.',
        'Skimming tốc độ: Đọc lướt tiêu đề, Topic sentence đầu đoạn và câu kết luận.',
        'Scanning chính xác: Dùng mắt quét từ khóa khó thay thế (tên riêng, số liệu, năm) không đọc chi tiết.',
        'Bẫy hạn định tuyệt đối: Cực kỳ cẩn trọng với always, never, all, completely, solely trong True/False/Not Given.'
      ], 'reading'),
        h('span', { class: 'chip level' }, data.band)
      ),
      passageBox
    ),
    vocabBox,
    h('div', { class: 'panel stack' },
      h('p', { class: 'label' }, 'True / False / Not Given (Chọn TRUE nếu đúng, FALSE nếu sai, NOT GIVEN nếu không có)'),
      ...tfngContainers.map((c) => c.el)
    ),
    submitBtn,
    feedbackArea
  );
}

// 4. Giao diện IELTS Writing
function renderIeltsWriting(t, data) {
  const wr = data.writing;
  let currentTask = 'task2';

  const taskTabs = h('div', { class: 'ielts-task-tabs' },
    h('button', { class: 'mini ' + (currentTask === 'task1' ? 'primary' : 'ghost'), style: { border: currentTask === 'task1' ? 'none' : '1px solid var(--line)' }, onclick: () => { currentTask = 'task1'; draw(); } }, 'Task 1: Thư/Báo cáo (≥150 từ)'),
    h('button', { class: 'mini ' + (currentTask === 'task2' ? 'primary' : 'ghost'), style: { border: currentTask === 'task2' ? 'none' : '1px solid var(--line)' }, onclick: () => { currentTask = 'task2'; draw(); } }, 'Task 2: Bài luận (≥250 từ)')
  );

  const container = h('div', { class: 'stack-lg' });

  function draw() {
    taskTabs.querySelectorAll('button').forEach((b, idx) => {
      b.className = 'mini ' + ((idx === 0 && currentTask === 'task1') || (idx === 1 && currentTask === 'task2') ? 'primary' : 'ghost');
    });

    const isT2 = currentTask === 'task2';
    const targetObj = isT2 ? wr.task2 : wr.task1;
    const minWords = targetObj.minWords;

    const wordCountBadge = h('span', { class: 'ielts-word-counter warn' }, '0 / ' + minWords + ' từ (Chưa đủ)');

    const textarea = h('textarea', {
      rows: 10,
      placeholder: isT2 ? 'Bắt đầu viết bài luận Task 2 (tối thiểu 250 từ) vào đây…' : 'Bắt đầu viết email / thư Task 1 (tối thiểu 150 từ) vào đây…',
      style: { width: '100%', padding: '12px', fontSize: '.96rem', lineHeight: 1.6, borderRadius: '10px', border: '1px solid var(--line)', fontFamily: 'inherit' },
      oninput: () => updateWordCount()
    });

    function updateWordCount() {
      const words = (textarea.value || '').trim().split(/\s+/).filter(Boolean);
      const count = words.length;
      if (count >= minWords) {
        wordCountBadge.className = 'ielts-word-counter good';
        wordCountBadge.textContent = '✓ ' + count + ' / ' + minWords + ' từ (Đạt yêu cầu)';
      } else {
        wordCountBadge.className = 'ielts-word-counter warn';
        wordCountBadge.textContent = count + ' / ' + minWords + ' từ (Chưa đủ ' + minWords + ' từ)';
      }
    }

    // Nút chèn nhanh liên từ học thuật
    const linkingChips = (wr.task2.linkingWords || []).map((w) => h('button', {
      class: 'ielts-linking-chip',
      onclick: () => {
        const start = textarea.selectionStart || textarea.value.length;
        const end = textarea.selectionEnd || textarea.value.length;
        textarea.value = textarea.value.substring(0, start) + w + ' ' + textarea.value.substring(end);
        textarea.focus();
        updateWordCount();
      }
    }, '+ ' + w));

    let showModel = false;
    const modelBox = h('div', { class: 'panel stack', style: { display: 'none', background: 'rgba(15, 82, 87, 0.06)' } },
      h('p', { class: 'label' }, isT2 ? 'Bài viết mẫu Band 8.5 (Model Essay)' : 'Bài viết mẫu Task 1 (Model Letter)'),
      h('div', { style: { whiteSpace: 'pre-wrap', lineHeight: 1.65, fontSize: '.94rem' } }, isT2 ? wr.task2.modelEssay : wr.task1.modelAnswer)
    );

    const toggleModelBtn = h('button', { class: 'ghost mini', onclick: () => {
      showModel = !showModel;
      modelBox.style.display = showModel ? 'block' : 'none';
      toggleModelBtn.textContent = showModel ? 'Ẩn bài mẫu' : '💡 Xem bài mẫu Band 8.5';
    } }, '💡 Xem bài mẫu Band 8.5');

    container.replaceChildren(
      h('div', { class: 'panel stack' },
        h('div', { class: 'row between' },
          h('b', {}, targetObj.type),
          h('span', { class: 'chip accent' }, 'Yêu cầu: ≥ ' + minWords + ' từ')
        ),
        h('p', { style: { fontWeight: 600, whiteSpace: 'pre-wrap' } }, targetObj.prompt)
      ),
      isT2 ? h('div', { class: 'panel stack' },
        h('b', {}, 'Dàn ý 4 đoạn chuẩn thi IELTS (Essay Structure)'),
        ...wr.task2.outline.map((o) => h('div', { class: 'stack', style: { gap: '2px' } },
          h('span', { style: { fontWeight: 600, color: 'var(--teal)' } }, o.part),
          h('span', { class: 'small muted' }, o.guide)
        ))
      ) : null,
      h('div', { class: 'panel stack' },
        h('div', { class: 'row between', style: { alignItems: 'center' } },
          h('b', {}, 'Khu vực viết bài'),
          wordCountBadge
        ),
        h('p', { class: 'small muted' }, 'Chèn nhanh liên từ học thuật Band 7.5+:'),
        ieltsTipBox('Tip: Chiến lược Writing Task 1 & Task 2', [
          'Quy tắc 1: Đặt dấu phẩy trước liên từ FANBOYS khi nối 2 mệnh đề độc lập có S + V.',
          'Quy tắc 2: Đặt dấu phẩy sau mệnh đề trạng ngữ / cụm mở đầu (Although..., Consequently,...).',
          'Quy tắc 3: Dùng cặp dấu phẩy bao quanh mệnh đề quan hệ không xác định.',
          'Quy tắc 4: Tránh lỗi Comma Splice (ghép 2 câu độc lập chỉ bằng dấu phẩy).',
          'Task 2 Causes & Solutions: Mở bài 2 câu ➔ Thân bài 1 Nguyên nhân ➔ Thân bài 2 Giải pháp ➔ Kết bài 1–2 câu.'
        ], 'writing'),
        h('p', { class: 'small muted', style: { marginTop: '6px', marginBottom: '2px' } }, 'Liên từ nối câu Band 7.5+: '),
        h('div', { class: 'ielts-linking-bank' }, ...linkingChips),
        h('p', { class: 'small muted', style: { marginTop: '6px', marginBottom: '2px' } }, 'Từ vựng Nguyên nhân (Causes): '),
        h('div', { class: 'ielts-linking-bank' }, ...IELTS_TIPS_DATA.writing.causesSolutions.vocabCauses.map(w => h('button', {
          class: 'ielts-linking-chip',
          onclick: () => {
            const st = textarea.selectionStart || textarea.value.length;
            const en = textarea.selectionEnd || textarea.value.length;
            textarea.value = textarea.value.substring(0, st) + w + ' ' + textarea.value.substring(en);
            textarea.focus();
            updateWordCount();
          }
        }, '+ ' + w))),
        h('p', { class: 'small muted', style: { marginTop: '6px', marginBottom: '2px' } }, 'Từ vựng Giải pháp (Solutions): '),
        h('div', { class: 'ielts-linking-bank' }, ...IELTS_TIPS_DATA.writing.causesSolutions.vocabSolutions.map(w => h('button', {
          class: 'ielts-linking-chip',
          onclick: () => {
            const st = textarea.selectionStart || textarea.value.length;
            const en = textarea.selectionEnd || textarea.value.length;
            textarea.value = textarea.value.substring(0, st) + w + ' ' + textarea.value.substring(en);
            textarea.focus();
            updateWordCount();
          }
        }, '+ ' + w))),
        textarea,
        h('div', { class: 'row', style: { marginTop: '6px' } }, toggleModelBtn),

// Kéo thả và đổi vị trí từ khi sắp xếp câu
function attachTokenReorder(btn, c, idx, chosen, draw, isDone) {
  btn.setAttribute('draggable', isDone() ? 'false' : 'true');
  btn.addEventListener('dragstart', (e) => {
    if (isDone()) return;
    e.dataTransfer.setData('text/plain', String(idx));
    e.dataTransfer.effectAllowed = 'move';
    btn.classList.add('dragging');
  });
  btn.addEventListener('dragend', () => {
    btn.classList.remove('dragging');
    const container = btn.parentElement;
    if (container) container.querySelectorAll('button').forEach((b) => b.classList.remove('drop-target-before', 'drop-target-after'));
  });
  btn.addEventListener('dragover', (e) => {
    if (isDone()) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const rect = btn.getBoundingClientRect();
    const isAfter = e.clientX > (rect.left + rect.width / 2);
    btn.classList.toggle('drop-target-after', isAfter);
    btn.classList.toggle('drop-target-before', !isAfter);
  });
  btn.addEventListener('dragleave', () => {
    btn.classList.remove('drop-target-before', 'drop-target-after');
  });
  btn.addEventListener('drop', (e) => {
    if (isDone()) return;
    e.preventDefault();
    const fromIdx = parseInt(e.dataTransfer.getData('text/plain'), 10);
    if (isNaN(fromIdx) || fromIdx === idx) return;
    const rect = btn.getBoundingClientRect();
    const isAfter = e.clientX > (rect.left + rect.width / 2);
    let targetIdx = isAfter ? idx + 1 : idx;
    if (fromIdx < targetIdx) targetIdx--;
    const [item] = chosen.splice(fromIdx, 1);
    chosen.splice(targetIdx, 0, item);
    draw();
  });

  let startX = 0, startY = 0, isDragging = false, clone = null;
  btn.addEventListener('touchstart', (e) => {
    if (isDone() || e.touches.length > 1) return;
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY;
    isDragging = false; clone = null;
  }, { passive: true });

  btn.addEventListener('touchmove', (e) => {
    if (isDone() || e.touches.length > 1) return;
    const t = e.touches[0];
    const dx = t.clientX - startX, dy = t.clientY - startY;
    if (!isDragging && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
      isDragging = true;
      clone = document.createElement('div');
      clone.className = 'token-drag-clone';
      clone.textContent = c.t;
      document.body.appendChild(clone);
      btn.classList.add('dragging');
    }
    if (isDragging) {
      if (e.cancelable) e.preventDefault();
      if (clone) {
        clone.style.left = t.clientX + 'px';
        clone.style.top = t.clientY + 'px';
      }
      clone.style.display = 'none';
      const under = document.elementFromPoint(t.clientX, t.clientY);
      clone.style.display = 'block';
      const targetBtn = under && under.closest('.tokens.answer button');
      const container = btn.parentElement;
      if (container) container.querySelectorAll('button').forEach((b) => b.classList.remove('drop-target-before', 'drop-target-after'));
      if (targetBtn && targetBtn !== btn) {
        const rect = targetBtn.getBoundingClientRect();
        const isAfter = t.clientX > (rect.left + rect.width / 2);
        targetBtn.classList.toggle('drop-target-after', isAfter);
        targetBtn.classList.toggle('drop-target-before', !isAfter);
      }
    }
  }, { passive: false });

  btn.addEventListener('touchend', (e) => {
    if (clone) { clone.remove(); clone = null; }
    btn.classList.remove('dragging');
    const container = btn.parentElement;
    if (container) container.querySelectorAll('button').forEach((b) => b.classList.remove('drop-target-before', 'drop-target-after'));
    if (isDragging) {
      if (e.cancelable) e.preventDefault();
      const t = e.changedTouches && e.changedTouches[0];
      if (t && container) {
        const under = document.elementFromPoint(t.clientX, t.clientY);
        const targetBtn = under && under.closest('.tokens.answer button');
        if (targetBtn && targetBtn !== btn) {
          const fromIdx = chosen.indexOf(c);
          const toItemIdx = [...container.children].indexOf(targetBtn);
          if (fromIdx !== -1 && toItemIdx !== -1) {
            const rect = targetBtn.getBoundingClientRect();
            const isAfter = t.clientX > (rect.left + rect.width / 2);
            let targetIdx = isAfter ? toItemIdx + 1 : toItemIdx;
            if (fromIdx < targetIdx) targetIdx--;
            const [item] = chosen.splice(fromIdx, 1);
            chosen.splice(targetIdx, 0, item);
            draw();
          }
        }
      }
    }
  });

  btn.addEventListener('click', () => {
    if (isDone() || isDragging) return;
    const curIdx = chosen.indexOf(c);
    if (curIdx !== -1) {
      chosen.splice(curIdx, 1);
      draw();
    }
  });
}

// Tách câu thành các mảnh để sắp xếp
function tokensOf(code, text) {
  if (code === 'en') return text.split(/\s+/).filter(Boolean);
  const d = DATA[code], dict = new Set();
  d.topics.forEach((t) => t.vocab.forEach((v) => { const w = plain(v.w); if (w.length >= 2 && w.length <= 4) dict.add(w); }));
  const s = [...text], out = [];
  for (let i = 0; i < s.length;) {
    if (/[。，！？、,.!?：:；;“”]/.test(s[i]) && out.length) { out[out.length - 1] += s[i]; i++; continue; }
    let took = 1;
    for (let k = 4; k >= 2; k--) if (dict.has(s.slice(i, i + k).join(''))) { took = k; break; }
    out.push(s.slice(i, i + took).join('')); i += took;
  }
  // Gộp bớt khi quá nhiều mảnh
  while (out.length > 8) { let j = 0, best = Infinity; for (let k = 0; k < out.length - 1; k++) { const l = out[k].length + out[k + 1].length; if (l < best) { best = l; j = k; } } out.splice(j, 2, out[j] + out[j + 1]); }
  return out;
}
function firstCjk(code, w) {
  const cs = [...plain(w)].filter((c) => /[぀-ヿ㐀-鿿]/.test(c));
  if (code === 'ja') return cs.find((c) => /[㐀-鿿]/.test(c)) || cs.find((c) => !/[ゃゅょっャュョッー]/.test(c));
  return cs[0];
}

function makeGrammarQuizStep(code, gid) {
  const d = DATA[code];
  if (!gid || !d || !d.grammar || !d.grammar[gid]) return null;
  const all = grammarPoints(code);
  const pool = [...new Set(all.flatMap((x) => gqKeywords(x.g)))];
  const p = all.find((x) => x.gid === gid) || { gid, g: d.grammar[gid], lv: d.grammar[gid].lv || (code === 'ja' ? 'N5' : 'HSK 1') };
  for (let attempt = 0; attempt < 8; attempt++) {
    const q = gqMake(p, all, pool);
    if (q) return { type: 'gquiz', q };
  }
  return null;
}

function getTopicDialogues(arg1, arg2) {
  const code = (typeof arg1 === 'string') ? arg1 : ((arg1 && arg1.lang) || S.lang || 'en');
  const t = (typeof arg1 === 'string') ? arg2 : arg1;
  if (!t) return [];

  const out = [];

  // 1. Nếu chủ đề có t.speak (scenes với các lượt lời thoại)
  if (t.speak && t.speak.length) {
    t.speak.forEach((sc, scIdx) => {
      const sceneTitle = sc.title || ('Tình huống ' + (scIdx + 1));
      const lines = (sc.lines || []).map((ln, idx) => ({
        speaker: ln.s || (idx % 2 === 0 ? 'A' : 'B'),
        name: (ln.s || (idx % 2 === 0 ? 'A' : 'B')) === 'A' ? 'A (Bạn)' : 'B (Đối tác)',
        text: ln.t || ln.text || '',
        t: ln.t || ln.text || '',
        r: ln.r || '',
        m: ln.m || '',
        raw: ln.raw || '',
        s: sceneTitle
      }));
      if (lines.length) {
        out.push({
          id: sc.id || ('dlg-' + scIdx),
          title: sceneTitle,
          lines
        });
      }
    });
  }

  // 2. Nếu tiếng Nhật có t.sents (câu giao tiếp / hội thoại)
  if (code === 'ja' && t.sents && t.sents.length) {
    const sLines = t.sents.map((s, idx) => {
      const text = s.chunks ? s.chunks.join('') : (s.text || '');
      return {
        speaker: idx % 2 === 0 ? 'A' : 'B',
        name: idx % 2 === 0 ? 'A (田中)' : 'B (山田)',
        text,
        t: text,
        r: s.r || '',
        m: s.m || s.trans || '',
        raw: s.raw || '',
        s: 'Giao tiếp hội thoại'
      };
    });
    out.push({
      id: 'sents-' + t.id,
      title: 'Hội thoại mẫu: ' + (t.sub || t.title),
      lines: sLines
    });
  }

  // 3. Nếu tiếng Anh / Trung có t.fill (đoạn văn / email thực hành)
  if (t.fill && t.fill.text && !out.length) {
    const cleanText = t.fill.text.replace(/\[\[([^\]|]+)(?:\|[^\]]+)?\]\]/g, '$1');
    const sentences = cleanText.split(/(?<=[.!?])\s+/).filter(Boolean);
    const fLines = sentences.map((st, idx) => ({
      speaker: idx % 2 === 0 ? 'A' : 'B',
      name: idx % 2 === 0 ? 'A' : 'B',
      text: st,
      t: st,
      r: '',
      m: t.fill.trans || '',
      raw: '',
      s: 'Đoạn văn thực tế'
    }));
    out.push({
      id: 'fill-' + t.id,
      title: 'Đoạn văn thực tế: ' + (t.sub || t.title),
      lines: fLines
    });
  }

  return out;
}

// ===== Bài học =====
function buildSteps(t, i) {
  const code = t.lang || S.lang || 'en', d = DATA[code] || DATA[S.lang], l = t.lessons[i], steps = [];
  if (!d || !l) return steps;
  const allWords = (d.topics || []).flatMap((x) => x.vocab || []);
  const topicWords = t.vocab || [];
  const opt = (v, field) => shuffle([v, ...sample(topicWords.length >= 6 ? topicWords : allWords, 3, (x) => x.id === v.id || x[field] === v[field])]);

  if (l.kind === 'learn') {
    // 1. TỪ VỰNG MỚI (Vocabulary)
    l.words.forEach((v, n0) => steps.push({ type: 'intro', v, tip: n0 === 0 }));

    // Lồng thẻ ngữ pháp vào bài học sớm (tiếng Trung & Nhật)
    let currentGid = null;
    if ((code === 'zh' || code === 'ja') && t.gram && t.gram.length && d.grammar) {
      const learnIdx = t.lessons.slice(0, i).filter((x) => x.kind === 'learn').length;
      currentGid = t.gram[learnIdx % t.gram.length];
      const g = d.grammar[currentGid];
      if (g) steps.push({ type: 'gintro', gid: currentGid, g });
    }

    // Trắc nghiệm từ vựng: Chọn nghĩa đúng & Phản xạ từ
    shuffle(l.words).forEach((v) => steps.push({ type: 'meaning', v, opts: opt(v, 'm') }));

    // Hán Việt của từng chữ (với tiếng Trung & Nhật)
    if (code !== 'en') {
      const chars = [...new Map(l.words.flatMap((v) => hvParts(code, v.w).filter((x) => x.hv).map((x) => [x.c, { ...x, v }]))).values()];
      const pool = [...new Set(allWords.flatMap((w) => hvParts(code, w.w)).map((x) => x.hv).filter(Boolean))];
      sample(chars, 2).forEach((x) => {
        const meanLower = (x.m || '').toLowerCase().normalize('NFC');
        const meanWords = meanLower.split(/[\s,;/()]+/).filter(Boolean);
        const dis = sample(pool.filter((q) => {
          if (q === x.hv) return false;
          const qLower = q.toLowerCase().normalize('NFC');
          if (meanWords.includes(qLower) || meanLower === qLower) return false;
          return true;
        }), 3).map((hv) => ({ hv })), correct = { hv: x.hv };
        if (dis.length === 3) steps.push({ type: 'hvw', v: x.v, c: x.c, m: x.m, correct, opts: shuffle([correct, ...dis]) });
      });
    }

    // 2. KỸ NĂNG NGHE (Listening)
    // Nghe và chọn từ vừa nghe thấy
    sample(l.words, Math.min(2, l.words.length)).forEach((v) => steps.push({ type: 'listen', v, opts: opt(v, 'w') }));
    sample(l.words, Math.min(2, l.words.length)).forEach((v) => steps.push({ type: 'reverse', v, opts: opt(v, 'w') }));

    // 3. KỸ NĂNG NÓI (Speaking) - Micro AI chấm phát âm câu giao tiếp
    const withEx = l.words.filter((v) => v.ex && tokensOf(code, v.ex).length >= 3);
    const spWord = withEx[0] || l.words[0];
    if (spWord) {
      steps.push({
        type: 'speak',
        text: spWord.ex || spWord.w,
        r: spWord.ex ? spWord.exr : spWord.r,
        m: spWord.ex ? spWord.exm : spWord.m,
        scene: '🎙️ Luyện nói Micro AI · Câu bài học'
      });
    }
    // Luyện thêm 1 câu từ hội thoại chủ đề (nếu có)
    const dlgs = getTopicDialogues(code, t);
    const dlgLines = dlgs.flatMap((d) => d.lines || []);
    if (dlgLines.length) {
      const dLine = dlgLines[i % dlgLines.length];
      if (dLine && dLine.t) {
        steps.push({
          type: 'speak',
          text: dLine.t,
          r: dLine.r,
          m: dLine.m,
          scene: '🎙️ Luyện nói Micro AI · Hội thoại: ' + (dLine.s || 'Giao tiếp thực tế')
        });
      }
    }

    // 4. KỸ NĂNG ĐỌC (Reading) - Đọc hiểu tình huống / trắc nghiệm chủ đề
    if (t.quiz && t.quiz.length) {
      const qIndex = i % t.quiz.length;
      steps.push({ type: 'quiz', q: t.quiz[qIndex] });
    }

    // 5. KỸ NĂNG VIẾT (Writing)
    // Sắp xếp câu hoàn chỉnh (order)
    const orderWords = withEx.length ? withEx.slice(0, Math.min(2, withEx.length)) : [];
    orderWords.forEach((v) => {
      steps.push({
        type: 'order',
        text: v.ex,
        r: v.exr,
        trans: v.exm || ('Câu có từ “' + plain(v.w) + '” (' + v.m + ')'),
        tokens: tokensOf(code, v.ex),
        v
      });
    });
    if (!orderWords.length && t.sents && t.sents.length) {
      const s = t.sents[i % t.sents.length];
      steps.push({
        type: 'order',
        text: s.chunks.join(''),
        r: s.r,
        trans: s.m || s.trans || '',
        tokens: s.chunks,
        raw: s.raw,
        s
      });
    }

    // Bài tập ngữ pháp / điền từ
    if ((code === 'zh' || code === 'ja') && currentGid && d.grammar) {
      const qStep = makeGrammarQuizStep(code, currentGid);
      if (qStep) steps.push(qStep);
    } else if (code === 'en' && withEx.length) {
      const vTarget = withEx[withEx.length - 1];
      const plainWord = plain(vTarget.w);
      const regexW = new RegExp('\\b' + plainWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
      if (regexW.test(vTarget.ex)) {
        const prompt = vTarget.ex.replace(regexW, '＿＿＿＿＿＿');
        const distPool = sample(allWords.filter((x) => x.id !== vTarget.id && x.w && plain(x.w) !== plainWord), 3).map((x) => plain(x.w));
        if (distPool.length === 3) {
          steps.push({
            type: 'gquiz',
            q: {
              type: 'cloze',
              label: 'Điền từ đúng vào cấu trúc câu',
              prompt,
              hint: vTarget.exm || vTarget.m,
              answer: plainWord,
              opts: shuffle([plainWord, ...distPool]),
              e: [vTarget.ex, vTarget.exr || '', vTarget.exm || ''],
              p: { g: { t: 'Cấu trúc câu: ' + (vTarget.d || vTarget.w), f: '', notes: [] } }
            }
          });
        }
      }
    }

    // Tập viết chữ Hán / Kanji (với CJK)
    if (LANGS[code].cjk) {
      const chs = [...new Set(l.words.map((v) => firstCjk(code, v.w)).filter(Boolean))];
      sample(chs, Math.min(2, chs.length)).forEach((c) => steps.push({ type: 'write', ch: c, v: l.words.find((v) => plain(v.w).includes(c)) }));
    }

    // Điền từ vào email công việc / đoạn hội thoại 301
    const learnTotal = t.lessons.filter((x) => x.kind === 'learn').length;
    const learnFills = topicFillsList(t);
    if (learnFills.length) {
      const fillSlot = i - Math.max(0, learnTotal - learnFills.length);
      if (fillSlot >= 0 && learnFills[fillSlot]) {
        steps.push({ type: 'fill', fill: learnFills[fillSlot] });
      }
    }
  } else if (l.kind === 'kanji') {
    const pool = t.kanji.length >= 4 ? t.kanji : d.topics.flatMap((x) => x.kanji || []);
    l.kanji.forEach((k) => steps.push({ type: 'kintro', k }));
    shuffle(l.kanji).forEach((k) => steps.push({ type: 'kanji', k, opts: shuffle([k, ...sample(pool, 3, (x) => x.k === k.k)]) }));
    l.kanji.forEach((k) => steps.push({ type: 'write', ch: k.k, k }));
  } else if (l.kind === 'quiz') {
    l.quiz.forEach((q) => steps.push({ type: 'quiz', q }));
  } else if (l.kind === 'fill') {
    const fList = topicFillsList(t);
    if (fList.length) steps.push({ type: 'fill', fill: fList[0] });
    sample(topicWords.filter((v) => v.ex && tokensOf(code, v.ex).length >= 3), 2).forEach((v) => steps.push({ type: 'order', text: v.ex, r: v.exr, trans: v.exm || ('Câu có từ “' + plain(v.w) + '” (' + v.m + ')'), tokens: tokensOf(code, v.ex), v }));
  } else if (l.kind === 'speak') {
    t.speak.forEach((sc) => sc.lines.forEach((ln) => steps.push({ type: 'speak', text: ln.t, r: ln.r, m: ln.m, scene: sc.title })));
    (t.sents || []).slice(0, 4).forEach((s) => { steps.push({ type: 'order', text: s.chunks.join(''), r: s.r, trans: s.m || s.trans || '', tokens: s.chunks, raw: s.raw, s }); steps.push({ type: 'speak', text: s.chunks.join(''), raw: s.raw, r: s.r, m: s.m || s.trans || '' }); });
    (t.coach || []).slice(0, 2).forEach((c) => steps.push({ type: 'speak', text: c.sa, m: c.q + (c.vi ? ' · ' + c.vi : ''), scene: 'Trả lời câu hỏi' }));
  } else {
    // kind === 'review': Tổng ôn đầy đủ 4 kỹ năng
    const weak = topicWords.slice().sort((a, b) => ((S.srs[sid(code, a.id)] || { b: 0 }).b - (S.srs[sid(code, b.id)] || { b: 0 }).b));
    weak.slice(0, 6).forEach((v, n) => steps.push(n % 2 ? { type: 'reverse', v, opts: opt(v, 'w') } : { type: 'meaning', v, opts: opt(v, 'm') }));
    sample(topicWords, 2).forEach((v) => steps.push({ type: 'listen', v, opts: opt(v, 'w') }));
    
    // Luyện nói trong review
    const spCandidate = topicWords.find((v) => v.ex) || topicWords[0];
    if (spCandidate) steps.push({ type: 'speak', text: spCandidate.ex || spCandidate.w, r: spCandidate.ex ? spCandidate.exr : spCandidate.r, m: spCandidate.ex ? spCandidate.exm : spCandidate.m, scene: '🎙️ Luyện nói tổng ôn' });
    
    sample(t.kanji || [], 3).forEach((k) => steps.push({ type: 'kanji', k, opts: shuffle([k, ...sample(t.kanji.length >= 4 ? t.kanji : d.topics.flatMap((x) => x.kanji || []), 3, (x) => x.k === k.k)]) }));
    sample(t.quiz, 2).forEach((q) => steps.push({ type: 'quiz', q }));
    if ((code === 'zh' || code === 'ja') && t.gram && t.gram.length && d.grammar) {
      sample(t.gram, Math.min(3, t.gram.length)).forEach((gid) => {
        const qStep = makeGrammarQuizStep(code, gid);
        if (qStep) steps.push(qStep);
      });
    }
    // Sắp xếp câu trong review
    const revEx = topicWords.filter((v) => v.ex && tokensOf(code, v.ex).length >= 3);
    if (revEx.length) {
      const v = revEx[0];
      steps.push({ type: 'order', text: v.ex, r: v.exr, trans: v.exm || ('Câu có từ “' + plain(v.w) + '” (' + v.m + ')'), tokens: tokensOf(code, v.ex), v });
    }
    const revFills = topicFillsList(t);
    if (revFills.length) {
      steps.push({ type: 'fill', fill: revFills[0] });
    }
  }
  return steps;
}

const READ_DLG_IDX = {}, READ_FILL_IDX = {}, READ_MODE = {}, READ_QUIZ_IDX = {};

function topicFillsList(t) {
  if (!t) return [];
  if (Array.isArray(t.fills) && t.fills.length) return t.fills.filter((f) => f && f.text);
  return (t.fill && t.fill.text) ? [t.fill] : [];
}

function resolveQuizDialogue(t, q) {
  if (!q) return null;
  if (Array.isArray(q.dialogue) && q.dialogue.length) {
    return { title: q.dialogueTitle || 'Đoạn hội thoại đọc hiểu', src: q.src || '', lines: q.dialogue };
  }
  if (q.speakIdx != null && t && Array.isArray(t.speak) && t.speak[q.speakIdx] && Array.isArray(t.speak[q.speakIdx].lines)) {
    const sc = t.speak[q.speakIdx];
    return { title: sc.title || 'Đoạn hội thoại đọc hiểu', src: q.src || sc.src || '', lines: sc.lines };
  }
  return null;
}

async function playLinesSeq(code, lines, btn) {
  if (btn.dataset.playing === '1') {
    btn.dataset.playing = '0';
    btn.dataset.seq = String((+btn.dataset.seq || 0) + 1);
    if (window.speechSynthesis) try { window.speechSynthesis.cancel(); } catch {}
    btn.textContent = '🔊 Nghe cả bài';
    return;
  }
  const mySeq = String((+btn.dataset.seq || 0) + 1);
  btn.dataset.seq = mySeq;
  btn.dataset.playing = '1';
  btn.textContent = '⏹️ Dừng';
  try {
    for (const ln of lines) {
      if (!btn.isConnected || btn.dataset.seq !== mySeq || btn.dataset.playing !== '1') break;
      if (ln && ln.t) await say(code, ln.t);
    }
  } finally {
    if (btn.dataset.seq === mySeq) {
      btn.dataset.playing = '0';
      btn.textContent = '🔊 Nghe cả bài';
    }
  }
}

function buildFillInputs(code, fill, onChange) {

function lessonView(t, i) {

  setFeedbackContext({ mode: 'lesson', topicId: t.id, topicTitle: t.sub || t.title, lessonIndex: i, lessonKind: t.lessons[i].kind, lessonTitle: lessonTitle(t, i) });
  const code = t.lang || S.lang || 'en', steps = buildSteps(t, i), first = new Map(), retried = new Set(), queue = steps.map((s, n) => ({ ...s, n }));

  function step() {
    const ex = queue.shift();
    if (!ex) return finish();
    if (CURRENT_CTX) {
      CURRENT_CTX.stepType = ex.type;
      CURRENT_CTX.stepItem = ex.v ? (plain(ex.v.w) + (ex.v.m ? ' (' + ex.v.m + ')' : '')) : (ex.text || (ex.k ? ex.k.k : (ex.g ? ex.g.t : (ex.q ? (ex.q.p && ex.q.p.g ? (ex.q.p.g.t + ': ' + ex.q.prompt) : (ex.q.q || '')) : ''))));

    const fb = h('div', { 'aria-live': 'assertive' });
    const update = () => { if (!checked) btn.disabled = !ready(); };
    const submit = () => { if (!checked && ready()) check(); };
    const choose = (opts, label, showReading) => {
      let sel = null;
      const bs = opts.map((o, k) => h('button', { 'aria-pressed': 'false', 'aria-keyshortcuts': String(k + 1), onclick: () => { sel = k; bs.forEach((b, j) => b.setAttribute('aria-pressed', String(j === k))); update(); } }, h('span', { class: 'kbd', 'aria-hidden': 'true' }, k + 1), h('span', { class: 'grow' }, label(o))));
      ready = () => sel !== null;
      after = () => bs.forEach((b, j) => { b.disabled = true; if (opts[j] === correctOpt) b.classList.add('right'); else if (j === sel) b.classList.add('wrong'); });
      let correctOpt = null;

        h('h2', { style: { margin: 0 } }, g.t),
        h('p', { lang: langAttr, class: 'muted', style: { margin: 0 } }, g.zh),
        g.f && h('p', { class: 'pat', lang: langAttr }, g.f),
        ...g.notes.map((n) => h('p', { class: 'small' }, n)),
        h('p', { class: 'label', style: { marginTop: '4px', marginBottom: 0 } }, 'Ví dụ cách dùng:'),
        ...g.ex.slice(0, 2).map((e) => h('div', { class: 'ex' },
          h('p', { lang: langAttr }, e[0], ' ', spk(code, e[0])),
          h('p', { class: 'small read', style: { textAlign: 'left' } }, e[1]),
          h('p', { class: 'small muted' }, e[2])
        ))
      );
    } else if (ex.type === 'gquiz') {
      const q = ex.q, langAttr = LANGS[code].lang;
      if (q.type === 'cloze') {
        const c = choose(q.opts, (o) => h('span', { lang: langAttr }, o));
        c.setCorrect(q.answer);
        body = h('div', { class: 'stack' },
          h('p', { class: 'label' }, 'Ngữ pháp · ' + q.label),
          h('p', { class: 'q', lang: langAttr }, q.prompt),
          q.hint && h('p', { class: 'small muted' }, 'Nghĩa: ' + q.hint),
          c.el
        );
        ready = () => c.sel() != null;
        gradeFn = () => ({ correct: c.sel() === q.answer, expected: q.answer });
      } else {
        const chosen = [];
        const ans = h('div', { class: 'tokens answer', lang: langAttr, 'aria-label': 'Câu của bạn' }), pool = h('div', { class: 'tokens', lang: langAttr });
        const draw = () => {
          ans.replaceChildren(...chosen.map((c, idx) => {
            const b = h('button', {}, c.t);
            attachTokenReorder(b, c, idx, chosen, draw, () => checked);
            return b;
          }));
          pool.replaceChildren(...q.bank.filter((b) => !chosen.includes(b)).map((b) => h('button', { onclick: () => { if (!checked) { chosen.push(b); draw(); } } }, b.t)));
          update();
        };
        body = h('div', { class: 'stack' },
          h('p', { class: 'label' }, 'Ngữ pháp · ' + q.label),
          h('p', { class: 'q' }, q.prompt),
          ans, pool
        );
        ready = () => chosen.length === q.bank.length;
        after = () => { pool.replaceChildren(); };
        gradeFn = () => ({ correct: chosen.map((c) => c.t).join('') === q.answer, expected: q.e[0] });
        setTimeout(draw);
      }
    }

    function check() {
      checked = true;
      if (ex.type === 'intro' || ex.type === 'kintro' || ex.type === 'gintro' || (ex.type === 'speak' && !resp)) { done++; return step(); }
      const r = gradeFn();
      if (!first.has(ex.n)) {
        first.set(ex.n, Object.assign(r, { ex }));
        if (ex.v && ['meaning', 'listen', 'reverse'].includes(ex.type)) {
          const k = sid(code, ex.v.id), prev = S.srs[k];
          if (!prev || prev.last !== todayN() || !r.correct) srsRate(k, r.correct);
        }
        if (ex.k) srsRate(sid(code, ex.k.id), r.correct);
        if (ex.q && ex.q.id) srsRate(sid(code, ex.q.id), r.correct);
        if (ex.type === 'speak' && resp) srsRate(code + ':speak:' + plain(ex.text), resp.score >= 70);
        if (ex.type === 'write') srsRate(code + ':write:' + ex.ch, r.correct);
        if (ex.type === 'gquiz') {
          srsRate(code + ':gram:' + ex.q.p.gid, r.correct);
          const st = gqStore();
          if (r.correct) {
            if (st.wrong[ex.q.p.gid]) {
              st.wrong[ex.q.p.gid]--;
              if (st.wrong[ex.q.p.gid] <= 0) delete st.wrong[ex.q.p.gid];
            }
          } else {
            st.wrong[ex.q.p.gid] = (st.wrong[ex.q.p.gid] || 0) + 1;
          }
          save();
        }
      }
      if (!r.correct && !retried.has(ex.n) && ex.type !== 'write') { retried.add(ex.n); queue.push(ex); }
      if (ex.type === 'write' && !r.self) S.written[sid(code, ex.ch)] = (S.written[sid(code, ex.ch)] || 0) + 1;
      if (ex.type === 'speak') { done++; return step(); }
      done++; after(r);
      fb.replaceChildren(h('div', { class: 'feedback ' + (r.correct ? 'ok' : 'no') },
        h('strong', {}, r.self ? 'Tốt lắm!' : r.correct ? 'Chính xác!' : 'Chưa đúng'),
        r.align && h('div', { class: 'words', lang: LANGS[code].lang }, r.align.units.map((w, k) => h('span', { class: r.align.hit[k] ? 'hit' : 'miss' }, w))),
        r.score != null && h('p', { class: 'small' }, 'Máy nghe đúng ' + r.score + '%' + (r.correct ? '.' : '. Chỗ gạch đỏ là chỗ cần nói rõ hơn.')),
        !r.correct && !r.align && r.expected && ex.type !== 'order' && ex.type !== 'quiz' && ex.type !== 'gquiz' && h('p', { lang: LANGS[code].lang }, 'Đáp án: ' + r.expected),
        r.note && ex.type !== 'quiz' && h('p', { class: 'small' }, r.note),
        ex.type === 'order' ? orderFeedback(code, ex, r) : null,
        ex.type === 'quiz' ? quizFeedback(code, ex, r) : null,
        ex.type === 'gquiz' ? grammarQuizFeedback(code, ex, r) : null,
        ex.type === 'reverse' && ex.v && ex.v.r ? h('div', { class: 'stack', style: { gap: '4px', marginTop: '4px' } },
          h('p', { class: code === 'en' ? 'ipa' : 'read', style: { margin: 0, color: 'var(--teal)', fontWeight: 600, textAlign: 'left' } }, ex.v.r),
          h('div', { class: 'listen', style: { justifyContent: 'flex-start' } }, listenBtns(code, ex.v.w))
        ) : null,
        ex.v && ['meaning', 'listen', 'reverse'].includes(ex.type) && code !== 'en' ? h('div', { style: { marginTop: '8px' } }, hvBlock(code, ex.v)) : null
      ),
      ex.type === 'fill' ? fillReveal(code, ex.fill, (ex.fill.src && !ex.fill.audio) ? null : t.id) : '');
      if (ex.type === 'order') setTimeout(() => say(code, ex.text), 250);
      if (ex.type === 'quiz' && (code === 'en' || (code === 'zh' && /[\u4e00-\u9fff]/.test(((ex.q.o || ex.q.opts || [])[ex.q.a]) || '')))) { const optTarget = (ex.q.o || ex.q.opts || [])[ex.q.a]; if (optTarget) setTimeout(() => say(code, optTarget), 250); }
      if (ex.type === 'gquiz') setTimeout(() => say(code, ex.q.e[0]), 250);
      btn.hidden = false; btn.disabled = false; btn.textContent = 'Tiếp theo ➔'; btn.onclick = step; btn.focus();
    }
    btn.addEventListener('click', () => { if (!checked) check(); });
    const total = done + queue.length + 1;
    mount(h('div', { class: 'stack-lg' },
      h('div', { class: 'topbar' }, h('button', { class: 'ghost', onclick: exit }, 'Thoát'), h('div', { class: 'bar' }, h('i', { style: { width: (done / total * 100) + '%' } })), feedbackBtn()),
      retried.has(ex.n) && first.has(ex.n) && h('span', { class: 'chip', style: { alignSelf: 'flex-start' } }, 'Làm lại câu chưa đúng'),
      body, h('div', { class: 'dock stack', style: { gap: '6px' } }, btn, h('p', { class: 'keyhint' }, 'Phím 1–4 để chọn · Enter để kiểm tra / tiếp tục')), fb));
    update();
  }

  function finish() {
    const all = [...first.values()], graded = all.filter((r) => !r.self);
    const correct = graded.filter((r) => r.correct).length, total = graded.length;
    const pct = total ? Math.round(correct / total * 100) : 100;
    const k = lkey(t, i), repeat = S.lessons[k] != null;
    if (S.del && S.del[k]) delete S.del[k];
    if (S.del && S.del['spk:' + k]) delete S.del['spk:' + k];
    if (S.del && S.del['wrt:' + k]) delete S.del['wrt:' + k];
    if (t.lessons[i] && t.lessons[i].words) {
      t.lessons[i].words.forEach((w) => {
        const sKey = sid(code, w.id);
        if (S.del && S.del[sKey]) delete S.del[sKey];
      });
    }
    // XP: mỗi từ / kanji / câu / tình huống làm đúng ngay lần đầu = 5 XP; điền từ: 5 XP mỗi chỗ đúng
    const keyOf = (e) => e.v ? 'v' + e.v.id : e.k ? 'k' + e.k.id : e.type === 'gquiz' ? ('gq' + (e.q && e.q.p ? e.q.p.gid : '')) : e.type === 'quiz' ? ('qz' + (e.q ? (e.q.id || e.q.q) : '')) : e.type === 'write' ? 'w' + e.ch : 's' + (e.text || '');
    const won = new Set(); let fillXp = 0;
    all.forEach((r) => { if (r.ex.type === 'fill') fillXp += XP_ITEM * (r.ok || 0); else if (r.correct && !(r.ex.type === 'write' && r.self)) won.add(keyOf(r.ex)); });
    let xp = XP_ITEM * won.size + fillXp; if (repeat) xp = Math.ceil(xp / 2);
    S.lessons[k] = Math.max(pct, typeof S.lessons[k] === 'number' ? S.lessons[k] : 0);
    addXp(xp, code); checkAch();
    const nx = nextLesson(DATA[code]);
    setFeedbackContext(null);
    VIEW = 'home';
    mount(h('div', { class: 'panel stack center', style: { marginTop: '24px' } },
      h('p', { class: 'label' }, t.sub || t.title),
      h('h1', {}, correct === total ? 'Không sai câu nào!' : 'Xong bài rồi!'),
      h('p', {}, h('b', {}, correct + '/' + total + ' câu đúng'), ' · +' + xp + ' XP' + (repeat ? ' (học lại: nửa XP)' : '')),
      h('p', {}, 'Hôm nay ' + LANGS[code].short + ': ' + xpOf(todayN(), code) + '/' + goal() + ' XP · chuỗi ' + streak(code) + ' ngày'),
      nx && h('button', { class: 'primary block', onclick: () => lessonView(nx.t, nx.i) }, 'Học bài tiếp theo'),
      h('button', { class: 'block', onclick: () => go('home') }, 'Về trang Học'),
      repeat && h('button', {
        class: 'ghost mini block',
        style: { color: 'var(--muted)', marginTop: '4px', fontSize: '.82rem' },
        onclick: () => {
          if (confirm('Xóa tiến độ bài “' + lessonTitle(t, i) + '” để học lại từ đầu?')) {
            resetLesson(t, i);
            go('home');
          }
        }
      }, 'Xóa tiến độ bài này')));
  }

  const isDone = lessonDone(t, i);
  const oldScoreText = typeof S.lessons[lkey(t, i)] === 'number' ? ('Điểm cao nhất: ' + S.lessons[lkey(t, i)] + '%') : 'Đã học ở app cũ';

  mount(h('div', { class: 'stack-lg' },
    h('div', { class: 'topbar' }, h('button', { class: 'ghost', onclick: exit }, 'Thoát'), h('span', { class: 'muted small grow' }, t.sub || t.title), feedbackBtn()),
    h('h1', { lang: t.lessons[i].kind === 'learn' ? LANGS[code].lang : null }, lessonTitle(t, i)),
    isDone && h('div', {
      class: 'panel row between',
      style: {
        alignItems: 'center',
        padding: '12px 14px',
        background: 'rgba(15, 82, 87, 0.08)',
        border: '1px solid var(--teal)',
        borderRadius: '12px',
        gap: '12px',
        flexWrap: 'wrap'
      }
    },
      h('div', { class: 'stack', style: { gap: '2px', minWidth: '180px', flex: 1 } },
        h('div', { class: 'row', style: { gap: '6px', alignItems: 'center' } },
          h('span', { class: 'chip good', style: { fontSize: '.75rem', padding: '2px 8px' } }, '✓ Bài học cũ'),
          h('span', { class: 'small muted', style: { fontSize: '.84rem' } }, oldScoreText)
        ),
        h('span', { class: 'small muted', style: { fontSize: '.78rem' } }, 'Bạn có thể xóa tiến độ bài này để học lại từ đầu như bài mới.')
      ),
      h('button', {
        class: 'ghost mini danger-btn',
        style: {
          color: '#ef4444',
          borderColor: 'rgba(239, 68, 68, 0.4)',
          borderRadius: '10px',
          fontWeight: 600,
          padding: '8px 12px',
          whiteSpace: 'nowrap'
        },
        onclick: () => {
          if (confirm('Xóa tiến độ bài “' + lessonTitle(t, i) + '” để học lại từ đầu như bài mới?')) {
            resetLesson(t, i);
            lessonView(t, i);
          }
        }
      }, '🗑️ Xóa tiến độ bài này')
    ),
    t.lessons[i].words.length > 0 && h('div', { class: 'panel stack' }, h('h3', {}, 'Từ mới trong bài'),
      ...t.lessons[i].words.map((v) => h('button', { class: 'lesson', onclick: () => say(code, v.w) },
        h('span', { class: 'meta' }, h('b', { lang: LANGS[code].lang }, plain(v.w)), v.r && v.r !== v.w ? h('span', { class: 'small' + (code === 'en' ? ' ipa' : ' muted'), style: code === 'en' ? { color: 'var(--teal)', fontWeight: 600, display: 'inline-block', marginLeft: '6px' } : null }, v.r) : '', h('span', { class: 'small muted', style: { display: 'block' } }, v.m)),
        h('span', { class: 'spk', 'aria-hidden': 'true' }, icon(ICON.speaker))))),
    t.lessons[i].kind !== 'learn' && h('p', { class: 'muted' }, ({ review: 'Ôn lại những từ còn yếu của cả chủ đề, nghe chọn từ, kanji và tình huống.', quiz: 'Chọn cách nói đúng trong các tình huống thực tế.', fill: t.lang === 'en' ? 'Điền từ vào email, rồi sắp xếp câu ví dụ.' : 'Điền từ vào đoạn hội thoại, rồi sắp xếp câu ví dụ.', speak: 'Nghe và nói lại các câu trong chủ đề.', kanji: 'Học kanji mới: nghĩa Hán Việt, cách đọc, rồi tập viết từng chữ.' })[t.lessons[i].kind]),
    h('div', { class: 'dock stack', style: { gap: '8px' } },
      h('button', { class: 'primary block', onclick: step }, isDone ? ('Học lại bài này · ' + steps.filter((s) => s.type !== 'intro').length + ' câu') : ('Bắt đầu · ' + steps.filter((s) => s.type !== 'intro').length + ' câu')),
      isDone && h('button', {
        class: 'ghost block mini',

// ===== Ôn tập theo phương pháp Spaced Repetition (Lặp lại ngắt quãng) =====
let REVIEW_SKILL = 'vocab'; // Ôn tập ngắt quãng chỉ ôn từ mới theo yêu cầu

function reviewView(forceExtra = false) {
  const code = S.lang, t0 = todayN();
  ensureSrsItems(code);
  REVIEW_SKILL = 'vocab';

  const allDueItems = srsDueItems(code, 'vocab');
  const totalVaultDue = allDueItems.length;
  const dailyQuota = getDailyReviewQuota(code, t0);
  const doneBefore = getReviewedToday(code, t0);
  const remDailyQuota = Math.max(0, dailyQuota - doneBefore);

  const batchSizes = [
    [5, '⚡ 5 từ (~2p · Ôn nhanh)'],
    [10, '🎯 10 từ (~4p · Chuẩn)'],
    [15, '🔥 15 từ (~6p · Chuyên sâu)']

  const head = (isReviewing = false) => {
    const curDone = getReviewedToday(code, t0);

    const title = 'Ôn tập theo gói nhỏ vừa sức (SRS)';
    const subtitle = 'Hệ thống tự lọc 10–15 từ dễ quên nhất cho mỗi buổi. Kho từ còn lại được tự động bảo lưu sang ngày tiếp theo.';
    const backBtn = h('button', { class: 'ghost mini', onclick: () => go('home') }, '← Về trang Học');
    const quotaBadge = h('span', { class: 'chip ' + (curDone >= dailyQuota ? 'good' : 'accent'), style: { fontSize: '.78rem', fontWeight: 700 } },
      '🎯 Định mức hôm nay: ' + curDone + '/' + dailyQuota + ' từ'
    );
    const vaultBadge = h('span', { class: 'chip', style: { fontSize: '.76rem' } },
      '📦 Kho chờ luân phiên: ' + curVault + ' từ'
    );

    const sizeSelector = h('div', { class: 'row wrap', style: { gap: '6px', marginTop: '4px' } },
      batchSizes.map(([sz, label]) =>
        h('button', {
          class: (REVIEW_BATCH_SIZE === sz ? 'primary' : 'ghost') + ' mini',
          style: { fontSize: '.75rem', padding: '5px 10px', fontWeight: REVIEW_BATCH_SIZE === sz ? 700 : 500 },
          onclick: () => { REVIEW_BATCH_SIZE = sz; reviewView(forceExtra); }

    return h('div', { class: 'stack', style: { gap: '10px' } },
      h('div', { class: 'row between', style: { alignItems: 'center' } },
        backBtn,

  // Nếu đã đạt định mức ngày mà chưa bấm forceExtra, hiển thị màn hình hoàn thành định mức

        h('p', { class: 'muted center', style: { margin: 0, lineHeight: 1.5 } },
          totalVaultDue === 0
            ? 'Bạn đã hoàn thành toàn bộ các từ vựng đến hạn. Hãy học thêm bài mới để tiếp tục lộ trình!'
            : ('Hôm nay bạn đã ôn đủ ' + doneBefore + '/' + dailyQuota + ' từ chuẩn khoa học. Còn ' + totalVaultDue + ' từ trong kho được hệ thống tự bảo lưu sang các ngày tới để tránh quá tải.')

  const targetSessionSize = forceExtra

  const queue = allDueItems.slice(0, Math.max(1, targetSessionSize));
  let count = 0;

  const show = () => {

    const item = queue[0];

      const afterDone = getReviewedToday(code, t0);

      mount(h('div', { class: 'stack-lg' }, head(),
        h('div', { class: 'panel stack center', style: { padding: '24px', borderRadius: '16px', gap: '10px' } },

              : ('Bạn đã ôn ' + afterDone + '/' + dailyQuota + ' từ định mức hôm nay (còn ' + quotaLeft + ' từ nữa là trọn vẹn định mức ngày).')
          ),
          afterVault > 0 ? h('button', {
            class: (quotaLeft > 0 ? 'accent' : 'ghost') + ' block',

            : ('🔄 Ôn thêm 1 gói ' + Math.min(REVIEW_BATCH_SIZE, afterVault) + ' từ nữa (Tự chọn)')) : null,
          h('div', { class: 'row center wrap', style: { gap: '8px', marginTop: '12px' } },
            h('button', { class: 'primary', onclick: () => go('home') }, 'Về trang Học'),
            h('button', { class: 'ghost', onclick: () => go('pick') }, 'Về Màn hình chính')

    const k = item.key, s = S.srs[k];
    const skillBadge = {
      vocab: h('span', { class: 'chip' }, item.it && item.it.k ? 'Kanji' : 'Từ vựng'),
      speak: h('span', { class: 'chip accent' }, '🎙️ Nói'),

    );

    // 1. TỪ VỰNG / KANJI
    if (item.skill === 'vocab') {
      const it = item.it;
      let front, back, sayText;
      if (it.v) {
        const v = it.v; sayText = v.w;
        front = h('div', { class: 'big', lang: L().lang }, plain(v.w));
        const gTip = grammarTipForWord(code, v);
        back = h('div', { class: 'stack', hidden: true, style: { gap: '8px', marginTop: '8px' } },

            }, renderHighlightedEx(v.ex, v.w, L().lang)),

            }, v.exr),

            }, v.exm),
