      h('p', { class: 'label', style: { margin: 0 } }, 'Kỳ Thi Khẩu Ngữ HSKK (Cấp 3–6)'),
      h('div', { class: 'row', style: { gap: '6px', alignItems: 'center' } },
        feedbackBtn({ mode: 'exam_hskk' }),
        langSwitch()
      )
    ),
    h('h1', { style: { margin: 0 } }, 'Luyện Thi HSKK Khẩu Ngữ'),
    h('p', { class: 'muted small', style: { margin: '2px 0 0 0' } },
      'Đề mẫu chính thức CTI/CLEC · Nghe thuật lại, Nhìn tranh kể chuyện & Nghị luận PEEL'
    )
  );

  // Chọn cấp độ HSKK 3 - 6
  const lvSelector = h('div', { class: 'row', style: { gap: '6px', flexWrap: 'wrap', margin: '4px 0 10px 0' } },
    ...levels.map((lv) => h('button', {
      class: 'mini' + (HSKK_LV === lv ? ' primary' : ' ghost'),
      style: { fontWeight: 700, minWidth: '72px' },
      onclick: () => { HSKK_LV = lv; examTabView(); }
    }, HSKK_DATA[lv].shortName))
  );

  // Thẻ Cấu trúc đề & Audio chính thức
  const structureCard = h('div', { class: 'panel card stack', style: { gap: '10px', background: 'var(--surface)', borderRadius: '12px' } },
    h('div', { class: 'row between', style: { alignItems: 'center' } },
      h('h2', { style: { margin: 0, fontSize: '1.1rem' } }, '📋 ' + curData.name),
      h('span', { class: 'chip good', style: { fontWeight: 700 } }, curData.totalTime)
    ),
    h('p', { class: 'small', style: { margin: 0 } }, curData.desc),
    h('div', { class: 'row between', style: { flexWrap: 'wrap', gap: '8px', background: 'var(--sunk)', padding: '10px 14px', borderRadius: '10px' } },
      h('div', {}, h('p', { class: 'small muted', style: { margin: 0 } }, 'Tổng số câu:'), h('b', {}, curData.totalQs + ' câu')),
      h('div', {}, h('p', { class: 'small muted', style: { margin: 0 } }, 'Tiêu chuẩn ĐẬU:'), h('b', { style: { color: 'var(--good)' } }, curData.passScore))
    ),
    h('div', { class: 'stack', style: { gap: '4px' } },
      h('p', { class: 'label', style: { margin: 0 } }, 'Phân bổ các phần thi khẩu ngữ:'),
      ...curData.partsSummary.map((part) => h('div', { class: 'row', style: { gap: '6px', alignItems: 'center' } },
        h('span', { style: { color: 'var(--teal)' } }, '✔'),
        h('span', { class: 'small' }, part)
      ))
    ),
    // Audio Player cho Đề mẫu chính thức
    h('div', { class: 'panel stack', style: { background: 'rgba(15, 82, 87, 0.06)', border: '1px solid var(--teal)', borderRadius: '10px', padding: '12px', gap: '6px' } },
      h('div', { class: 'row between wrap', style: { alignItems: 'center', gap: '6px' } },
        h('b', { style: { color: 'var(--teal)', fontSize: '.9rem' } }, '🎧 Đĩa Audio Đề Thi Chính Thức (MP3 Gốc CLEC): ' + curData.audioName),
        h('div', { class: 'row', style: { gap: '6px', flexWrap: 'wrap' } },
          curData.pdfUrl ? h('a', {
            href: curData.pdfUrl,
            target: '_blank',
            class: 'chip accent small',
            style: { textDecoration: 'none', fontWeight: 600, display: 'inline-flex', alignItems: 'center', gap: '4px' }
          }, '📄 Xem Đề PDF Gốc') : null,
          h('a', {
            href: curData.audioUrl,
            download: curData.audioName,
            class: 'chip good small',
            style: { textDecoration: 'none', fontWeight: 600, display: 'inline-flex', alignItems: 'center', gap: '4px' }
          }, '⬇️ Tải MP3 Gốc')
        )
      ),
      h('audio', {
        controls: 'controls',
        preload: 'metadata',
        src: curData.audioUrl,
        style: { width: '100%', height: '38px', marginTop: '4px' }
      }),
      h('p', { class: 'small muted', style: { margin: 0, fontSize: '.75rem' } },
        '💡 Bạn có thể nghe toàn bộ đĩa thi gốc ở trên, hoặc bấm thanh phát audio / nút loa 🔊 ở từng câu hỏi bên dưới để luyện nghe và nhại theo (Shadowing) từng câu cắt trực tiếp từ băng gốc.'
      )
    )
  );

  // Thẻ Cẩm nang chiến lược làm bài thi Khẩu ngữ (Collapsible)
  const strategyCard = h('details', { class: 'panel card stack', style: { gap: '8px', background: 'var(--surface)', borderRadius: '12px', padding: '12px' } },
    h('summary', { style: { fontWeight: 700, color: 'var(--teal)', cursor: 'pointer', fontSize: '1.02rem' } }, '💡 Cẩm nang chiến lược 3 dạng bài thi Khẩu ngữ HSKK (Chuẩn CLEC) ▾'),
    h('div', { class: 'stack', style: { gap: '10px', marginTop: '8px' } },
      h('div', { class: 'panel', style: { background: 'var(--sunk)', borderRadius: '10px', padding: '10px' } },
        h('b', { style: { color: 'var(--teal)' } }, '1. Nghe nhắc lại (HSKK 3) & Nghe thuật lại (HSKK 4–6)'),
        h('p', { class: 'small', style: { margin: '4px 0 0 0', lineHeight: 1.45 } },
          '• Với HSKK 3: Không dịch thầm sang tiếng Việt trong đầu; nhẩm theo ngay khi tai nghe câu cuối; bắt đúng từ khóa động từ + danh từ chính.\n' +
          '• Với HSKK 4–6: Quy tắc tốc ký 3 phần: Bối cảnh (Ai, ở đâu, khi nào) ➔ Diễn biến (Mâu thuẫn, thử thách) ➔ Kết cục (Bài học, chân lý). Sử dụng từ nối giữ nhịp: 首先 ➔ 接着 ➔ 后来 ➔ 最后.'
        )
      ),
      h('div', { class: 'panel', style: { background: 'var(--sunk)', borderRadius: '10px', padding: '10px' } },
        h('b', { style: { color: 'var(--teal)' } }, '2. Nhìn tranh nói (Tranh đơn & Chuỗi tranh liên hoàn)'),
        h('p', { class: 'small', style: { margin: '4px 0 0 0', lineHeight: 1.45 } },
          '• Tranh đơn (HSKK 3): Công thức 3 câu: Chủ ngữ là ai + Đang làm gì ở đâu + Trạng thái / Cảm xúc.\n' +
          '• Chuỗi 3–4 tranh (HSKK 4–6): Biến thành một câu chuyện hoàn chỉnh có diễn biến tâm lý và thông điệp: 1. Thiết lập bối cảnh ➔ 2. Cao trào/khó khăn ➔ 3. Nỗ lực đồng hành vượt qua ➔ 4. Thành quả, niềm vui và bài học nhân văn.'
        )
      ),
      h('div', { class: 'panel', style: { background: 'var(--sunk)', borderRadius: '10px', padding: '10px' } },
        h('b', { style: { color: 'var(--teal)' } }, '3. Trả lời câu hỏi mở / Nghị luận xã hội (Mô hình PEEL)'),
        h('p', { class: 'small', style: { margin: '4px 0 0 0', lineHeight: 1.45 } },
          '• P (Point): Trả lời trực diện quan điểm trong 1–2 câu đầu.\n' +
          '• E (Explanation): Đưa ra 2 luận điểm giải thích rõ ràng (一方面... 另一方面...).\n' +
          '• E (Example): Lấy dẫn chứng thực tế từ công việc, cuộc sống hoặc hiện tượng xã hội.\n' +
          '• L (Link): Tóm tắt thông điệp và liên hệ hành động.'
        )
      )
    )
  );

  // Bộ lọc phần thi
  const filterTabs = h('div', { class: 'row', style: { gap: '6px', flexWrap: 'wrap', margin: '4px 0 6px 0' } },
    h('button', {
      class: 'mini' + (HSKK_FILTER_PART === 'all' ? ' primary' : ' ghost'),
      onclick: () => { HSKK_FILTER_PART = 'all'; examTabView(); }
    }, 'Tất cả câu hỏi (' + curData.totalQs + ')'),
    h('button', {
      class: 'mini' + (HSKK_FILTER_PART === 'p1' ? ' primary' : ' ghost'),
      onclick: () => { HSKK_FILTER_PART = 'p1'; examTabView(); }
    }, 'Phần 1: Nghe phản xạ'),
    h('button', {
      class: 'mini' + (HSKK_FILTER_PART === 'p2' ? ' primary' : ' ghost'),
      onclick: () => { HSKK_FILTER_PART = 'p2'; examTabView(); }
    }, 'Phần 2: Nhìn tranh'),
    h('button', {
      class: 'mini' + (HSKK_FILTER_PART === 'p3' ? ' primary' : ' ghost'),
      onclick: () => { HSKK_FILTER_PART = 'p3'; examTabView(); }
    }, 'Phần 3: Trả lời câu hỏi')
  );

  // Danh sách các phần thi và câu hỏi tương tác
  const sectionsToRender = (HSKK_FILTER_PART === 'all')
    ? curData.sections
    : curData.sections.filter((s) => s.partId === HSKK_FILTER_PART);

  const sectionElements = sectionsToRender.map((sec) => {
    const secHeader = h('div', { class: 'stack', style: { gap: '2px', marginTop: '6px' } },
      h('h3', { style: { margin: 0, fontSize: '1.05rem', color: 'var(--teal)' } }, sec.title),
      h('p', { class: 'small muted', style: { margin: 0 } }, sec.guide)
    );

    const itemCards = sec.items.map((it) => {
      const itemKey = curData.id + '-' + it.qId;
      const isExpanded = !!HSKK_EXPANDED_ITEMS[itemKey];

      // Thẻ từng câu hỏi
      const card = h('div', { class: 'panel card stack', style: { gap: '8px', background: 'var(--surface)', borderRadius: '12px', padding: '12px' } });

      // 1. DẠNG NGHE NHẮC LẠI (HSKK 3)
      if (sec.partId === 'p1' && curData.id === 'hskk-3') {
        card.replaceChildren(
          h('div', { class: 'row between wrap', style: { alignItems: 'center', gap: '6px' } },
            h('span', { class: 'chip good small', style: { fontWeight: 700 } }, 'Câu ' + it.qId),
            h('span', { class: 'small muted' }, '⏱️ 10 giây nhắc lại · Audio băng gốc'),
            h('div', { class: 'row', style: { gap: '4px' } },
              spk('zh', it.text, { src: it.audioSrc }),
              spk('zh', it.text, { src: it.audioSrc, slow: true })
            )
          ),
          it.audioSrc ? h('audio', {
            controls: 'controls',
            preload: 'metadata',
            src: it.audioSrc,
            style: { width: '100%', height: '34px', margin: '2px 0' }
          }) : null,
          h('h3', { lang: 'zh-Hans', style: { margin: '2px 0', fontSize: '1.2rem', color: 'var(--ink)' } }, it.text),
          h('p', { class: 'small pinyin', style: { margin: 0, color: 'var(--teal)' } }, it.pinyin),
          h('p', { class: 'small muted', style: { margin: 0 } }, 'Nghĩa: ' + it.trans),
          it.tip ? h('p', { class: 'small', style: { margin: 0, color: '#f59e0b', fontSize: '.78rem' } }, '💡 ' + it.tip) : null,
          createHskkTimer(0, 10),
          createHskkSpeakingPractice(it, curData, it.text)
        );
        return card;
      }

      // 2. DẠNG NGHE THUẬT LẠI (HSKK 4, 5, 6)
      if (sec.partId === 'p1') {
        const speakTime = (curData.id === 'hskk-4') ? 40 : 90;
        card.replaceChildren(
          h('div', { class: 'row between wrap', style: { alignItems: 'center', gap: '6px' } },
            h('span', { class: 'chip good small', style: { fontWeight: 700 } }, 'Câu ' + it.qId + ' · Thuật lại'),
            h('span', { class: 'small muted' }, '⏱️ Nói trong ' + speakTime + 's · Audio băng gốc'),
            h('div', { class: 'row', style: { gap: '4px' } },
              spk('zh', it.listenScript, { src: it.audioSrc }),
              spk('zh', it.listenScript, { src: it.audioSrc, slow: true })
            )
          ),
          h('b', { style: { fontSize: '.98rem', color: 'var(--teal)' } }, it.title),
          it.audioSrc ? h('audio', {
            controls: 'controls',
            preload: 'metadata',
            src: it.audioSrc,
            style: { width: '100%', height: '36px', margin: '2px 0' }
          }) : null,
          h('div', { class: 'panel', style: { background: 'var(--sunk)', borderRadius: '10px', padding: '10px' } },
            h('p', { class: 'small label', style: { margin: 0, color: 'var(--muted)' } }, '🎧 Lời thoại gốc từ băng thi CLEC (Bấm loa hoặc thanh phát để nghe):'),
            h('p', { lang: 'zh-Hans', style: { margin: '6px 0 0 0', fontSize: '1.02rem', lineHeight: 1.55 } }, it.listenScript)
          ),
          createHskkTimer(0, speakTime),
          createHskkSpeakingPractice(it, curData, it.sampleText),
          // Accordion bài thuật lại mẫu
          h('details', { style: { marginTop: '4px' } },
            h('summary', { style: { cursor: 'pointer', fontWeight: 600, color: 'var(--teal)', fontSize: '.88rem' } }, '📖 Xem Gợi ý tóm tắt & Thuật lại mẫu (Chuẩn HSK 3.0) ▾'),
            h('div', { class: 'panel stack', style: { background: 'rgba(15,82,87,.07)', borderRadius: '10px', padding: '10px', marginTop: '6px', gap: '6px' } },
              h('div', { class: 'row between', style: { alignItems: 'center' } },
                h('span', { class: 'label', style: { margin: 0, color: 'var(--teal)', fontWeight: 700 } }, 'Bài thuật lại mẫu:'),
                spk('zh', it.sampleText)
              ),
              h('p', { lang: 'zh-Hans', style: { margin: 0, lineHeight: 1.55, fontWeight: 500 } }, it.sampleText),
              it.keywords ? h('div', { class: 'stack', style: { gap: '2px', marginTop: '4px' } },
                h('span', { class: 'small muted', style: { fontWeight: 600 } }, 'Từ khóa ghi điểm:'),
                h('div', { class: 'row wrap', style: { gap: '4px' } },
                  ...it.keywords.map((kw) => h('span', { class: 'chip small' }, kw))
                )
              ) : null
            )
          )
        );
        return card;
      }

      // 3. DẠNG NHÌN TRANH NÓI (Phần 2)
      if (sec.partId === 'p2') {
        const isSinglePic = !it.svgKeys && !it.imgUrls;
        const prepTime = isSinglePic ? 0 : 180;
        const speakTime = isSinglePic ? 15 : 120;

        let pictureArea;
        if (it.imgUrl) {
          pictureArea = h('div', { style: { textAlign: 'center', margin: '8px 0' } },
            h('img', {
              src: it.imgUrl,
              alt: it.title || it.scene || 'Tranh đề thi HSKK',
              loading: 'lazy',
              style: {
                maxWidth: '100%',
                maxHeight: '360px',
                borderRadius: '12px',
                boxShadow: '0 4px 16px rgba(0,0,0,0.25)',
                objectFit: 'contain',
                border: '1px solid rgba(255,255,255,0.12)'
              }
            })
          );
        } else if (it.imgUrls && it.imgUrls.length) {
          pictureArea = h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))', gap: '8px', margin: '8px 0' } },
            ...it.imgUrls.map((url, idx) => h('div', { class: 'stack', style: { gap: '4px', textAlign: 'center', background: 'rgba(0,0,0,0.15)', padding: '8px', borderRadius: '10px', border: '1px solid rgba(255,255,255,0.08)' } },
              h('img', {
                src: url,
                alt: 'Tranh ' + (idx + 1),
                loading: 'lazy',
                style: {
                  width: '100%',
                  height: '145px',
                  objectFit: 'cover',
                  borderRadius: '8px'
                }
              }),
              h('span', { class: 'chip small', style: { fontSize: '.72rem', alignSelf: 'center', fontWeight: 700 } }, 'Tranh ' + (idx + 1)),
              h('p', { class: 'small muted', style: { margin: 0, fontSize: '.72rem', lineHeight: 1.25 } }, (it.imagesDesc && it.imagesDesc[idx]) || '')
            ))
          );
        } else if (isSinglePic) {
          pictureArea = renderHskkSvg(it.svgKey);
        } else {
          pictureArea = h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(130px, 1fr))', gap: '6px', margin: '4px 0' } },
            ...(it.svgKeys || []).map((k, idx) => h('div', { class: 'stack', style: { gap: '4px', textAlign: 'center' } },
              renderHskkSvg(k),
              h('p', { class: 'small muted', style: { margin: 0, fontSize: '.72rem', lineHeight: 1.2 } }, (it.imagesDesc && it.imagesDesc[idx]) || '')
            ))
          );
        }

        card.replaceChildren(
          h('div', { class: 'row between wrap', style: { alignItems: 'center', gap: '6px' } },
            h('span', { class: 'chip good small', style: { fontWeight: 700 } }, 'Câu ' + it.qId + ' · Nhìn tranh nói'),
            h('span', { class: 'small muted' }, (prepTime ? 'Chuẩn bị 3p · ' : '') + 'Nói ' + speakTime + 's'),
            spk('zh', it.sampleText)
          ),
          h('b', { style: { fontSize: '.98rem', color: 'var(--teal)' } }, it.title || it.scene),
          pictureArea,
          it.sceneFlow ? h('p', { class: 'small', style: { margin: '2px 0', color: 'var(--teal)', fontWeight: 600 } }, 'Diễn biến: ' + it.sceneFlow) : null,
          createHskkTimer(prepTime, speakTime),
          createHskkSpeakingPractice(it, curData, it.sampleText),
          // Accordion bài mẫu
          h('details', { style: { marginTop: '4px' } },
            h('summary', { style: { cursor: 'pointer', fontWeight: 600, color: 'var(--teal)', fontSize: '.88rem' } }, '📖 Xem Bài kể chuyện mẫu chuẩn HSK 3.0 & Từ khóa ▾'),
            h('div', { class: 'panel stack', style: { background: 'rgba(15,82,87,.07)', borderRadius: '10px', padding: '10px', marginTop: '6px', gap: '6px' } },
              h('div', { class: 'row between', style: { alignItems: 'center' } },
                h('span', { class: 'label', style: { margin: 0, color: 'var(--teal)', fontWeight: 700 } }, 'Bài nói mẫu chuẩn:'),
                spk('zh', it.sampleText)
              ),
              h('p', { lang: 'zh-Hans', style: { margin: 0, lineHeight: 1.55, fontWeight: 500 } }, it.sampleText),
              it.pinyin ? h('p', { class: 'small pinyin', style: { margin: 0, color: 'var(--teal)' } }, it.pinyin) : null,
              it.trans ? h('p', { class: 'small muted', style: { margin: 0 } }, 'Dịch nghĩa: ' + it.trans) : null,
              it.keywords ? h('div', { class: 'stack', style: { gap: '2px', marginTop: '4px' } },
                h('span', { class: 'small muted', style: { fontWeight: 600 } }, 'Từ vựng đắt giá:'),
                h('div', { class: 'row wrap', style: { gap: '4px' } },
                  ...it.keywords.map((kw) => h('span', { class: 'chip small' }, kw))
                )
              ) : null
            )
          )
        );
        return card;
      }

      // 4. DẠNG TRẢ LỜI CÂU HỎI MỞ / NGHỊ LUẬN (Phần 3)
      const prepTime = (curData.id === 'hskk-3') ? 180 : 210;
      const speakTime = (curData.id === 'hskk-3') ? 90 : ((curData.id === 'hskk-4') ? 120 : 150);

      card.replaceChildren(
        h('div', { class: 'row between wrap', style: { alignItems: 'center', gap: '6px' } },
          h('span', { class: 'chip good small', style: { fontWeight: 700 } }, 'Câu ' + it.qId + ' · Trả lời câu hỏi'),
          h('span', { class: 'small muted' }, 'Chuẩn bị 3.5p · Nói ' + (speakTime / 60) + ' phút'),
          h('div', { class: 'row', style: { gap: '4px' } },
            spk('zh', it.prompt),
            spk('zh', it.sampleText)
          )
        ),
        h('h3', { lang: 'zh-Hans', style: { margin: '2px 0', fontSize: '1.15rem', color: 'var(--ink)' } }, it.prompt),
        it.pinyin ? h('p', { class: 'small pinyin', style: { margin: 0, color: 'var(--teal)' } }, it.pinyin) : null,
        it.trans ? h('p', { class: 'small muted', style: { margin: 0 } }, 'Dịch nghĩa: ' + it.trans) : null,
        it.outline ? h('div', { class: 'panel', style: { background: 'var(--sunk)', borderRadius: '10px', padding: '8px 10px', margin: '2px 0' } },
          h('b', { style: { color: 'var(--teal)', fontSize: '.84rem' } }, '🎯 Dàn ý gợi ý (PEEL):'),
          h('p', { class: 'small', style: { margin: '2px 0 0 0', lineHeight: 1.4 } }, it.outline)
        ) : null,
        createHskkTimer(prepTime, speakTime),
        createHskkSpeakingPractice(it, curData, it.sampleText),
        // Accordion bài văn mẫu hoàn chỉnh
        h('details', { style: { marginTop: '4px' } },
          h('summary', { style: { cursor: 'pointer', fontWeight: 600, color: 'var(--teal)', fontSize: '.88rem' } }, '📖 Xem Bài văn mẫu hoàn chỉnh chuẩn HSK 3.0 & Từ khóa ▾'),
          h('div', { class: 'panel stack', style: { background: 'rgba(15,82,87,.07)', borderRadius: '10px', padding: '10px', marginTop: '6px', gap: '6px' } },
            h('div', { class: 'row between', style: { alignItems: 'center' } },
              h('span', { class: 'label', style: { margin: 0, color: 'var(--teal)', fontWeight: 700 } }, 'Bài văn mẫu chuẩn:'),
              spk('zh', it.sampleText)
            ),
            h('p', { lang: 'zh-Hans', style: { margin: 0, lineHeight: 1.55, fontWeight: 500 } }, it.sampleText),
            it.keywords ? h('div', { class: 'stack', style: { gap: '2px', marginTop: '4px' } },
              h('span', { class: 'small muted', style: { fontWeight: 600 } }, 'Từ khóa đắt giá:'),
              h('div', { class: 'row wrap', style: { gap: '4px' } },
                ...it.keywords.map((kw) => h('span', { class: 'chip small' }, kw))
              )
            ) : null
          )
        )
      );
      return card;
    });

    return h('div', { class: 'stack', style: { gap: '8px' } }, secHeader, ...itemCards);
  });

// Chế độ thi thử Demo cho HSK / JLPT
function startExamDemo(code, lv) {
  const isZh = code === 'zh';
  const pts = grammarPoints(code).filter((x) => x.lv === lv);
  const samplePts = pts.length >= 3 ? pts.slice(0, 5) : grammarPoints(code).slice(0, 5);
  let curQ = 0;
  let score = 0;
  const total = samplePts.length;

  const questions = samplePts.map((p, idx) => {
    const ex = p.g.ex && p.g.ex[0];
    const plainSentence = ex ? ex[0] : p.g.t;
    const meaning = ex ? ex[2] : (p.g.notes && p.g.notes[0]) || '';
    const kw = gqKeywords(p.g)[0] || (isZh ? '的' : 'は');
    const wrongPool = isZh ? ['不', '在', '了', '很', '没', '和'] : ['が', 'を', 'に', 'で', 'も', 'と'];
    const dist = sample(wrongPool.filter((w) => w !== kw), 3);
    const opts = shuffle([kw, ...dist]);
    return {
      num: idx + 1,
      prompt: plainSentence.replace(kw, ' ( ___ ) '),
      answer: kw,
      opts,
      meaning,
      full: plainSentence
    };
  });

  const renderQuiz = () => {
    if (curQ >= total) {
      // Kết quả thi
      const pass = score >= Math.ceil(total * 0.6);
      mount(h('div', { class: 'stack-lg center', style: { paddingTop: '24px' } },
        h('h1', { style: { color: pass ? 'var(--good)' : 'var(--bad)' } }, pass ? '🎉 CHÚC MỪNG BẠN ĐÃ ĐẠT!' : '⚡ CẦN TIẾP TỤC ÔN LUYỆN'),
        h('div', { class: 'panel card stack center', style: { padding: '24px', borderRadius: '16px', gap: '12px' } },
          h('p', { class: 'label' }, 'Kết quả bài thi thử mẫu ' + lv),
          h('div', { style: { fontSize: '2.5rem', fontWeight: 800, color: pass ? 'var(--good)' : 'var(--bad)' } }, score + ' / ' + total),
          h('p', { class: 'small muted center' }, pass ? 'Bạn nắm rất chắc các điểm kiến thức trọng tâm của cấp độ này!' : 'Hãy vào tab Kiến thức để ôn lại các điểm ngữ pháp trước khi thi.'),
          h('div', { class: 'row center', style: { gap: '10px', marginTop: '12px' } },
            h('button', { class: 'primary', onclick: () => examTabView() }, 'Về phòng thi'),
            h('button', { class: 'ghost', onclick: () => startExamDemo(code, lv) }, 'Làm lại đề này')
          )
        )
      ));
      return;
    }

    const q = questions[curQ];
    mount(h('div', { class: 'stack-lg' },
      h('div', { class: 'row between', style: { alignItems: 'center' } },
        h('button', { class: 'ghost mini', onclick: () => examTabView() }, '✕ Hủy bài thi'),
        h('span', { class: 'chip good', style: { fontWeight: 700 } }, 'Câu ' + (curQ + 1) + ' / ' + total),
        h('span', { class: 'small muted' }, 'Điểm: ' + score)
      ),
      h('div', { class: 'panel card stack', style: { gap: '12px', borderRadius: '14px' } },
        h('div', { class: 'row between', style: { alignItems: 'center' } },
          h('p', { class: 'label', style: { margin: 0 } }, isZh ? 'Chọn từ thích hợp điền vào chỗ trống:' : '正しい言葉を一つ選んでください:'),
          h('div', { class: 'row', style: { gap: '4px' } },
            spk(code, q.full),
            spk(code, q.full, { slow: true })
          )
        ),
        h('h2', { lang: LANGS[code].lang, style: { margin: '8px 0', fontSize: '1.25rem', lineHeight: 1.5 } }, q.prompt),
        q.meaning ? h('p', { class: 'small muted', style: { margin: 0 } }, 'Ý nghĩa: ' + q.meaning) : null,
        h('div', { class: 'options', style: { marginTop: '12px' } },
          ...q.opts.map((opt, i) => h('button', {
            class: 'primary',
            style: { padding: '14px', fontSize: '1.05rem', textAlign: 'left', fontWeight: 600 },
            onclick: () => {
              const ok = opt === q.answer;
              if (ok) score++;
              toast(ok ? 'Chính xác! (+1)' : ('Chưa đúng. Đáp án: ' + q.answer));
              curQ++;
              setTimeout(renderQuiz, 400);
            }
          }, h('span', { class: 'kbd' }, i + 1), opt))
        )
      )
    ));
  };

  renderQuiz();
}

// ===== Chuyển tiến độ giữa bản trên Claude và bản web (mã chữ, gộp không ghi đè) =====
const b64 = { enc: (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); },
  dec: (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0)) };
async function pipeBytes(u8, stream) { return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(stream)).arrayBuffer()); }
async function exportCode() {
  const raw = new TextEncoder().encode(JSON.stringify(S));
  if (window.CompressionStream) { try { return 'LGG1z.' + b64.enc(await pipeBytes(raw, new CompressionStream('gzip'))); } catch (e) { /* dùng bản không nén */ } }
  return 'LGG1.' + b64.enc(raw);
}
async function importCode(code) {
  const m = String(code).replace(/\s+/g, '').match(/^LGG1(z?)\.([A-Za-z0-9+/=]+)$/);
  if (!m) throw new Error('Mã không đúng. Hãy dán nguyên đoạn mã bắt đầu bằng LGG1.');
  let bytes = b64.dec(m[2]);
  if (m[1]) { if (!window.DecompressionStream) throw new Error('Trình duyệt này quá cũ để đọc mã. Hãy cập nhật iOS/trình duyệt.'); bytes = await pipeBytes(bytes, new DecompressionStream('gzip')); }
  const o = JSON.parse(new TextDecoder().decode(bytes));
  if (!o || o.v !== 2 || typeof o.srs !== 'object' || typeof o.lessons !== 'object') throw new Error('Mã không phải tiến độ Lingogo.');
  return o;
}
async function copyProgress() {
  const code = await exportCode();
  let ok = false; try { await navigator.clipboard.writeText(code); ok = true; } catch (e) { try { const ta = h('textarea', { readonly: true }); ta.value = code; document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove(); } catch (e2) { ok = false; } }
  toast(ok ? 'Đã sao chép tiến độ (Push). Mở máy khác bấm Nhận (Pull).' : 'Không sao chép tự động được.');
  return ok;
}
async function pasteProgress() {
  let txt = ''; try { txt = await navigator.clipboard.readText(); } catch (e) { toast('Không đọc được bộ nhớ tạm. Hãy dán mã vào ô.'); return false; }
  try {
    const inc = await importCode(txt);
    const nL = Object.keys(S.lessons).length, nS = Object.keys(S.srs).length;
    S = mergeState(S, inc); save();
    const dl = Object.keys(S.lessons).length - nL, ds = Object.keys(S.srs).length - nS;
    toast(dl || ds ? 'Đã gộp (Pull): thêm ' + dl + ' bài, ' + ds + ' mục ôn.' : 'Đã gộp (Pull). Tiến độ đã khớp.');
    route();
    return true;
  } catch (e) { toast(e.message || 'Không đọc được mã.'); return false; }
}
async function getSyncUrl() {
  const cfg = getGhConfig();
  let payload = {};
  if (cfg.token && cfg.gistId) {
    payload = { v: 2, token: cfg.token, gistId: cfg.gistId, user: cfg.user };
  } else {
    payload = { v: 2, code: await exportCode() };
  }
  const str = encodeURIComponent(JSON.stringify(payload));
  return window.location.origin + window.location.pathname + '#sync=' + str;
}
async function handleUrlSync() {
  const hash = window.location.hash;
  if (!hash || !hash.includes('sync=')) return false;
  const match = hash.match(/sync=([^&]+)/);
  if (!match) return false;
  try {
    const raw = decodeURIComponent(match[1]);
    let parsed = null;
    try { parsed = JSON.parse(raw); } catch (e) {
      try { parsed = JSON.parse(decodeURIComponent(escape(atob(raw)))); } catch (e2) { parsed = null; }
    }
    if (!parsed && raw.startsWith('LGG1')) {
      parsed = { code: raw };
    }
    if (!parsed) return false;

    let imported = false;
    // 1. Cấu hình GitHub Gist nếu có trong link
    if (parsed.token) {
      saveGhConfig({ token: parsed.token, gistId: parsed.gistId || '', user: parsed.user || '' });
      try {
        const pulled = await pullGhSync(false);
        if (pulled) imported = true;
      } catch (e) {}
    }

    // 2. Mã tiến độ
    if (parsed.code) {
      try {
        const inc = await importCode(parsed.code);
        S = mergeState(S, inc);
        save();
        imported = true;
      } catch (e) {}
    }

    if (imported) {
      toast('Đồng bộ thành công! Chào mừng ' + (S.name || 'bạn') + '.');
    }

    history.replaceState(null, '', window.location.pathname + window.location.search);
    return true;
  } catch (err) {
    console.warn('Lỗi xử lý URL sync:', err);
    return false;
  }
}
async function autoSync() {
  const btn = document.querySelector('.sync-btn');
  if (btn) btn.classList.add('spinning');
  try {
    const cfg = getGhConfig();
    if (!cfg.token) {
      toast('Chưa kết nối GitHub! Vui lòng nhập Token một lần để đồng bộ.');
      showSyncModal();
      return;
    }
    // 1. Tự động đồng bộ qua GitHub Gist nếu đã thiết lập
    if (!cfg.gistId) {
      try {
        const res = await findOrCreateGhGist(cfg.token);
        cfg.gistId = res.gistId; cfg.user = res.user; saveGhConfig(cfg);
      } catch (e) {
        toast('Lỗi xác thực GitHub: ' + (e.message || ''));
        return;
      }
    }
    if (cfg.gistId) {
      try {
        const res = await fetch('https://api.github.com/gists/' + cfg.gistId, { headers: ghHeaders(cfg.token) });
        if (!res.ok) {
          if (res.status === 401) {
            toast('GitHub Token không hợp lệ hoặc đã hết hạn. Vui lòng kiểm tra lại!');
            showSyncModal();
            return;
          }
          if (res.status === 404) {
            toast('Không tìm thấy bản sao lưu cũ trên GitHub. Đang tạo mới...');
            const found = await findOrCreateGhGist(cfg.token);
            cfg.gistId = found.gistId; cfg.user = found.user; saveGhConfig(cfg);
          }
        } else {
          const gist = await res.json();
          const f = gist.files && gist.files['lingogo-progress.json'];
          if (f && f.content) {
            const remote = JSON.parse(f.content);
            const prevL = Object.keys(S.lessons || {}).length;
            const prevS = Object.keys(S.srs || {}).length;
            const prevW = Object.keys(S.written || {}).length;
            const remoteT = remote.t || 0;
            const localT = S.t || 0;

            if (remoteT > localT) {
              const merged = mergeState(S, remote);
              S = merged;
              GH_SYNC.seen = S.t || Date.now();
              save();
              route();
              const dl = Object.keys(merged.lessons || {}).length - prevL;
              const ds = Object.keys(merged.srs || {}).length - prevS;
              const dw = Object.keys(merged.written || {}).length - prevW;
              const parts = [dl > 0 && (dl + ' bài'), ds > 0 && (ds + ' mục ôn'), dw > 0 && (dw + ' chữ viết')].filter(Boolean).join(', ');
              toast('Đã kéo (Pull): ' + (parts ? 'gộp thêm ' + parts + ' từ GitHub.' : 'tiến độ đã cập nhật mới nhất từ GitHub.'));
              return;
            } else {
              await pushGhSync(true);
              toast('Đã đẩy (Push): Tiến độ máy này mới nhất, đã lưu lên GitHub (@' + (cfg.user || 'User') + ').');
              return;
            }
          }
        }
      } catch (ghErr) {
        toast('Lỗi kết nối GitHub: ' + (ghErr.message || 'Kiểm tra mạng'));
        return;
      }
    }
  } catch (err) {

  } }, 'Dán mã để gộp');

    h('p', { class: 'small muted' }, 'Dùng khi học cả bản trên Claude và bản web. Sao chép mã ở bản này, dán vào bản kia. Tiến độ được gộp, không bị ghi đè.'),
    h('button', { class: 'primary mini block', onclick: showSyncModal }, '⚙ Cấu hình tự động đồng bộ (GitHub Gist)'),
    copyBtn, out, inp, mergeBtn);
}

function progressView() {

  const perLang = Object.entries(LANGS).filter(([c]) => c !== S.lang).map(([c, v]) => {
    const keys = Object.keys(S.srs).filter((k) => k.startsWith(c + ':'));

  });
  const goalSel = h('select', { id: 'goal', onchange: (e) => { S.goal = Number(e.target.value); save(); toast('Đã lưu mục tiêu.'); } },
    [[20, 'Tối thiểu · 20 XP cơ bản (Focus: 40 XP / Duy trì: 10 XP)'], [30, 'Vừa phải · 30 XP cơ bản (Focus: 60 XP / Duy trì: 15 XP)'], [50, 'Nghiêm túc · 50 XP cơ bản (Focus: 100 XP / Duy trì: 25 XP)']].map(([v, l]) => h('option', { value: v, selected: (S.goal || 20) === v }, l)));
  const smartSchedCheck = h('input', { type: 'checkbox', id: 'smartSched', checked: S.smartSchedule !== false, onchange: (e) => { S.smartSchedule = e.target.checked; save(); toast('Đã cập nhật chế độ lộ trình.'); progressView(); } });
  let confirmReset = false;
  const resetBtn = h('button', { class: 'ghost block', onclick: async () => {
    if (!confirmReset) { confirmReset = true; resetBtn.textContent = 'Bấm lần nữa để xóa toàn bộ tiến độ của cả ba thứ tiếng'; return; }
    const resetTime = Date.now();
    S = fresh();
    S.delAll = resetTime;
    S.t = resetTime;
    save();
    await pushGhSync(true);
    toast('Đã xóa toàn bộ tiến độ và cập nhật lên máy chủ.');
    welcomeView();
  } }, 'Xóa tiến độ và học lại từ đầu');
  const c0 = S.lang, k0 = Object.keys(S.srs).filter((k) => k.startsWith(c0 + ':'));
  const xpTotal = (c) => Object.values(S.dl || {}).reduce((a, m) => a + (m[c] || 0), 0);
  const w0 = Object.keys(S.written).filter((k) => k.startsWith(c0 + ':')).length;
  mount(h('div', { class: 'stack-lg' },
    h('div', { class: 'row between' }, h('h1', {}, 'Tiến độ'), h('div', { class: 'row', style: { gap: '6px', alignItems: 'center' } }, feedbackBtn({ mode: 'progress' }), langSwitch())), 
    h('div', { class: 'stats' },
      h('div', { class: 'stat' }, h('b', {}, streak(c0)), h('span', {}, 'chuỗi ngày · dài nhất ' + longest(c0))),
      h('div', { class: 'stat' }, h('b', {}, xpOf(t, c0) + '/' + goal()), h('span', {}, 'XP hôm nay')),
      h('div', { class: 'stat' }, h('b', {}, xpTotal(c0)), h('span', {}, 'tổng XP ' + L().short))),
    h('div', { class: 'stats' },
      h('div', { class: 'stat' }, h('b', {}, Object.keys(S.lessons).filter((k) => k.startsWith(c0 + ':')).length), h('span', {}, 'bài đã học')),
      h('div', { class: 'stat' }, h('b', {}, k0.length), h('span', {}, 'mục đang ôn')),
      h('div', { class: 'stat' }, h('b', {}, LANGS[c0].cjk ? w0 : k0.filter((k) => S.srs[k].b >= 3).length), h('span', {}, LANGS[c0].cjk ? 'chữ đã viết' : 'đã nhớ chắc'))),
    h('div', { class: 'panel stack' }, h('h3', {}, 'XP ' + L().short + ' 7 ngày qua'),
      h('div', { class: 'week', role: 'img', 'aria-label': days.map((d) => wd[dayDate(d).getUTCDay()] + ': ' + xd(d) + ' XP').join(', ') },
        days.map((d) => h('div', { class: d === t ? 'today' : '' }, h('span', {}, xd(d) || ''), h('i', { style: { height: (xd(d) / max * 100) + '%' } }), h('span', {}, wd[dayDate(d).getUTCDay()]))))),
    h('div', { class: 'stack' }, h('h2', {}, 'Thành tích'),
      h('div', { class: 'badges' }, ACH.map(([code, title, desc]) => h('div', { class: 'badge' + (S.ach[code] ? '' : ' off') }, h('b', {}, title), h('p', { class: 'small muted' }, desc))))),
    h('div', { class: 'panel stack' }, h('h3', {}, 'Cài đặt lộ trình thông minh'),
      h('label', { class: 'row', style: { alignItems: 'center', gap: '8px', cursor: 'pointer', fontWeight: 600 } }, smartSchedCheck, h('span', {}, 'Bật lộ trình học theo thứ trong tuần (chống loạn ngôn ngữ)')),
      h('p', { class: 'small muted', style: { margin: 0 } }, 'Tự động tăng mục tiêu XP cho ngôn ngữ trọng tâm trong ngày và giảm nhẹ cho các ngôn ngữ duy trì (kèm nhắc nhở Spaced Repetition).'),
      h('label', { for: 'goal', class: 'label', style: { marginTop: '8px' } }, 'Mức độ mục tiêu cơ bản'), goalSel, h('p', { class: 'small muted' }, 'Mỗi từ, kanji, câu hoặc tình huống làm đúng được 5 XP. Học lại bài cũ được nửa XP.'),
      h('p', { class: 'small muted' }, 'Thêm vào màn hình chính trên iPhone: mở link bằng Safari, bấm Chia sẻ, chọn “Thêm vào MH chính”.')),
    h('div', { class: 'panel stack', style: { background: 'var(--sunk)', border: '1px solid var(--line)', gap: '10px' } },
      h('div', { class: 'row between', style: { alignItems: 'center' } },
        h('div', { class: 'row', style: { gap: '10px', alignItems: 'center' } },
          h('span', { class: 'sync-badge-icon', style: { color: '#eab308', background: 'rgba(234, 179, 8, .12)' } }, icon(ICON.feedback, { size: 20 })),
          h('div', { style: { minWidth: 0 } },
            h('b', { style: { display: 'block', fontSize: '.92rem' } }, 'Góp ý & Báo lỗi cho AI'),
            h('span', { class: 'small muted', style: { fontSize: '.8rem' } }, 'Phát hiện câu sai, lỗi âm thanh hay cần tính năng mới?')
          )
        ),
        h('button', { class: 'primary mini', onclick: () => showFeedbackModal() }, 'Góp ý ngay')
      )
    ),
    transferPanel(),
    resetBtn));
}

// ===== Phím tắt: 1–9 chọn đáp án (hoặc mức nhớ khi ôn), Enter = Kiểm tra / Tiếp tục / Hiện nghĩa =====
const visible = (el) => el && !el.disabled && el.offsetParent !== null && !el.closest('[hidden]');
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
  if (/^[1-9]$/.test(e.key)) {
    const n = Number(e.key) - 1;
    const grades = [...document.querySelectorAll('.grades button')].filter(visible);
    let opts = grades.length ? grades : [...document.querySelectorAll('.options button')].filter(visible);
    if (!opts.length) opts = [...document.querySelectorAll('.langcard')].filter(visible);
    if (opts[n]) { e.preventDefault(); opts[n].click(); }
    return;
  }
  if (e.key === 'Escape' && subjectsOpen) {
    subjectsOpen = false;
    homeView();
    return;
  }
  if (e.key === 'Enter') {
    const main = [...document.querySelectorAll('.dock button, .next-btn')].filter((b) => visible(b) && !b.closest('.grades'))[0];
    if (main) { e.preventDefault(); main.click(); }
  }
});
document.addEventListener('click', (e) => {
  if (subjectsOpen && !e.target.closest('.subjects-box') && !e.target.closest('.langchip')) {
    subjectsOpen = false;
    homeView();
  }
});

async function checkAppUpdate() {
  try {
    const res = await fetch('version.json?_t=' + Date.now(), { cache: 'no-store' });
    if (res.ok) {
      const data = await res.json();
      if (data.build && data.build !== APP_BUILD_ID) {
        const reloadKey = 'lingogo_reload_' + data.build;
        if (sessionStorage.getItem(reloadKey)) {
          console.warn('Đang chờ cache CDN làm mới bản build:', APP_BUILD_ID, '->', data.build);
          return;
        }
        sessionStorage.setItem(reloadKey, '1');
        console.log('Phát hiện bản cập nhật mới:', data.build);
        window.location.reload();
      }
    }
  } catch (e) {}
}

// ===== Khởi động =====
(async () => {
  await handleUrlSync();
  route();
  startSync();
  startGhSync();
  checkAppUpdate();
})();
