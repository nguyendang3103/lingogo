<!doctype html>
<html lang="vi">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lingogo">
<title>Lingogo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Bố cục: một cột kiểu app điện thoại; đổi ngôn ngữ ở đầu trang, thanh tab cố định dưới, mỗi màn hình một việc chính. */
:root {
  --bg: #f6f3ee;
  --surface: #ffffff;
  --sunk: #ece6dc;
  --ink: #1b2a2c;
  --muted: #5b6a6b;
  --line: #ddd4c6;
  --teal: #0f5257;
  --teal-ink: #ffffff;
  --amber: #e2902f;
  --amber-ink: #2a1600;
  --good: #23784a;
  --good-bg: #e2f2e7;
  --bad: #b03d2b;
  --bad-bg: #fbe5df;
  --grid: #e3d9ca;
  --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --zh: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --ja: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1e20; --surface: #15292c; --sunk: #1c3639; --ink: #e7eeed; --muted: #9bb0ae; --line: #2a4a4d;
    --teal: #55b6b2; --teal-ink: #06201f; --amber: #f0a752; --amber-ink: #2a1600; --grid: #2a4a4d;
    --good: #72d39b; --good-bg: #173a29; --bad: #f28b77; --bad-bg: #432018; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1e20; --surface: #15292c; --sunk: #1c3639; --ink: #e7eeed; --muted: #9bb0ae; --line: #2a4a4d;
  --teal: #55b6b2; --teal-ink: #06201f; --amber: #f0a752; --amber-ink: #2a1600; --grid: #2a4a4d;
  --good: #72d39b; --good-bg: #173a29; --bad: #f28b77; --bad-bg: #432018; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--ink); font: 16px/1.5 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px calc(88px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 560px; margin: 0 auto; }
h1, h2, h3 { margin: 0; line-height: 1.25; text-wrap: balance; }
h1 { font-size: 1.5rem; font-weight: 700; }
h2 { font-size: 1.15rem; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
[lang="zh-Hans"] { font-family: var(--zh); }
[lang="ja"] { font-family: var(--ja); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.center { text-align: center; }
.label { font-size: .75rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.note { background: var(--sunk); border-radius: 12px; padding: 12px; font-size: .88rem; color: var(--muted); }
button, select {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; min-height: 48px; padding: 10px 16px; cursor: pointer;
}
button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.primary { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); font-weight: 600; }
.accent { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); font-weight: 600; }
.ghost { background: transparent; border-color: transparent; color: var(--teal); }
.block { width: 100%; }
.mini { min-height: 36px; padding: 6px 12px; font-size: .88rem; border-radius: 10px; }
input[type=text], input[type=password], input[type=search], textarea {
  width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-height: 50px;
}
select { width: 100%; }

/* Chọn ngôn ngữ */
.langpick { display: grid; gap: 12px; }
.langcard { width: 100%; display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: center; text-align: left; padding: 18px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); }
.langcard:hover { border-color: var(--teal); }
.langcard.cur { border: 2px solid var(--teal); }
.langcard .glyph { grid-row: span 3; width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; background: var(--sunk); font-size: 1.9rem; font-weight: 700; color: var(--teal); }
.langcard .name { font-size: 1.2rem; font-weight: 700; }
.langcard .bar { grid-column: 2; }
.langchip { min-height: 40px; padding: 6px 12px; border-radius: 99px; font-weight: 600; gap: 6px; }
.langchip .caret { font-size: .75rem; color: var(--muted); }
.langs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--sunk); padding: 4px; border-radius: 14px; }
.langs button { border: none; background: transparent; min-height: 42px; font-weight: 600; color: var(--muted); border-radius: 10px; padding: 6px; }
.langs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* Thống kê */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 8px; text-align: center; min-width: 0; }
.stat b { display: block; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .76rem; color: var(--muted); }
.bar { height: 10px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--amber); border-radius: 99px; transition: width .35s; }

/* Lộ trình */
.phase { margin-top: 8px; }
.topic { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.topic.cur { border: 2px solid var(--teal); }
.topic > button.head { width: 100%; border: none; border-radius: 0; justify-content: flex-start; text-align: left; gap: 12px; padding: 12px 14px; background: transparent; }
.topic .num { flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--sunk); font-weight: 700; font-size: .85rem; font-variant-numeric: tabular-nums; }
.topic.done .num { background: var(--good-bg); color: var(--good); }
.topic .meta { flex: 1; min-width: 0; }
.topic .meta b { display: block; overflow-wrap: anywhere; }
.topic .body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.lesson { width: 100%; justify-content: flex-start; text-align: left; gap: 12px; min-height: 52px; }
.lesson .dot { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); font-weight: 700; font-size: .8rem; }
.lesson.done .dot { background: var(--good-bg); color: var(--good); }
.lesson.next { border: 2px solid var(--teal); }
.lesson .meta { flex: 1; min-width: 0; }
.extras { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.level { font-size: .74rem; font-weight: 700; padding: 2px 7px; border-radius: 6px; letter-spacing: .02em; flex: none; text-transform: uppercase; }
.chip.level.a1 { background: #e6f7ec; color: #0d8a43; border: 1px solid #b7ebc6; }
.chip.level.a2 { background: #e6f4ff; color: #096dd9; border: 1px solid #91caff; }
.chip.level.b1 { background: #f9f0ff; color: #722ed1; border: 1px solid #d3adf7; }
.chip.level.b2 { background: #fff7e6; color: #d46b08; border: 1px solid #ffd591; }
.chip.level.c1 { background: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; }
.chip.level.c2 { background: #feffe6; color: #ad8b00; border: 1px solid #ffe58f; font-weight: 800; box-shadow: 0 0 4px rgba(250,219,20,.4); }
.chip.level.hsk1 { background: #e6f7ec; color: #0d8a43; border: 1px solid #b7ebc6; }
.chip.level.hsk2 { background: #e6f4ff; color: #096dd9; border: 1px solid #91caff; }
.chip.level.hsk3 { background: #f0f5ff; color: #1d39c4; border: 1px solid #adc6ff; }
.chip.level.hsk4 { background: #f9f0ff; color: #722ed1; border: 1px solid #d3adf7; }
.chip.level.hsk5 { background: #fff7e6; color: #d46b08; border: 1px solid #ffd591; }
.chip.level.hsk6 { background: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; }
.chip.level.hsk7 { background: #f0f0ff; color: #391085; border: 1px solid #d3adf7; }
.chip.level.hsk8 { background: #fff0f6; color: #c41d7f; border: 1px solid #ffadd2; }
.chip.level.hsk9 { background: #feffe6; color: #ad8b00; border: 1px solid #ffe58f; font-weight: 800; box-shadow: 0 0 4px rgba(250,219,20,.4); }
.chip.level.n5 { background: #e6f7ec; color: #0d8a43; border: 1px solid #b7ebc6; }
.chip.level.n4 { background: #e6f4ff; color: #096dd9; border: 1px solid #91caff; }
.chip.level.n3 { background: #f0f5ff; color: #1d39c4; border: 1px solid #adc6ff; }
.chip.level.n2 { background: #f9f0ff; color: #722ed1; border: 1px solid #d3adf7; }
.chip.level.n1 { background: #feffe6; color: #ad8b00; border: 1px solid #ffe58f; font-weight: 800; box-shadow: 0 0 4px rgba(250,219,20,.4); }
.kbd { flex: none; display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 7px; font: 600 .8rem/1 var(--font); color: var(--muted); background: var(--bg); font-variant-numeric: tabular-nums; }
.options button { gap: 12px; }
.options button[aria-pressed="true"] .kbd { border-color: var(--teal); color: var(--teal); }
.grades .kbd { min-width: 20px; height: 20px; font-size: .7rem; margin-bottom: 2px; }
.keyhint { text-align: center; font-size: .75rem; color: var(--muted); }
@media (hover: none) { .keyhint { display: none; } }

/* Phân loại chủ đề */
.cat-bar { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; margin-top: 4px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.cat-bar::-webkit-scrollbar { display: none; }
.cat-pill { flex: none; padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); font-size: .88rem; font-weight: 500; cursor: pointer; transition: all .15s ease; white-space: nowrap; line-height: 1.2; }
.cat-pill:hover { border-color: var(--teal); color: var(--ink); }
.cat-pill.active { background: var(--teal); color: #fff; border-color: var(--teal); font-weight: 600; box-shadow: 0 2px 6px rgba(0, 128, 128, 0.25); }
/* Nút Subjects & menu chọn chủ đề */
.subjects-box { position: relative; width: 100%; }
.subjects-trigger {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 14px;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  cursor: pointer;
  transition: all .15s ease;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.subjects-trigger:hover, .subjects-trigger.open {
  border-color: var(--teal);
  box-shadow: 0 2px 8px rgba(15,82,87,.12);
}
.subjects-badge {
  display: inline-flex;
  align-items: center;
  font-size: .75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .04em;
  background: var(--teal);
  color: var(--teal-ink);
  padding: 3px 8px;
  border-radius: 6px;
  line-height: 1;
  flex: none;
}
.subjects-name {
  font-size: .95rem;
  font-weight: 700;
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.subjects-arrow {
  font-size: .75rem;
  color: var(--muted);
  flex: none;
  transition: transform .15s ease;
}
.subjects-dropdown {
  position: relative;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 6px 18px rgba(0,0,0,.08);
  padding: 6px;
  gap: 4px;
  margin-top: 6px;
  z-index: 10;
  animation: fadeInDown .15s ease;
}
@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}
.subjects-item {
  width: 100%;
  display: flex;
  flex-direction: column;
  padding: 10px 12px;
  background: transparent;
  border: 1.5px solid transparent;
  border-radius: 10px;
  cursor: pointer;
  text-align: left;
  transition: all .12s ease;
}
.subjects-item:hover {
  background: var(--sunk);
}
.subjects-item.selected {
  background: var(--sunk);
  border-color: var(--teal);
}
.subjects-check {
  display: inline-grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 99px;
  background: var(--teal);
  color: #fff;
  font-size: .75rem;
  font-weight: 700;
  flex: none;
}


/* Bài học */
.topbar { display: flex; align-items: center; gap: 12px; }
.topbar .bar { flex: 1; }
.q { font-size: 1.15rem; font-weight: 600; white-space: pre-line; }
.options { display: grid; gap: 10px; }
.options button { justify-content: flex-start; text-align: left; }
.options button[aria-pressed="true"] { border: 2px solid var(--teal); background: var(--sunk); }
.options button.right { background: var(--good-bg); border-color: var(--good); }
.options button.wrong { background: var(--bad-bg); border-color: var(--bad); }
.big { font-size: 2.2rem; font-weight: 700; text-align: center; line-height: 1.25; overflow-wrap: anywhere; }
.big[lang="zh-Hans"], .big[lang="ja"] { font-size: 2.8rem; font-weight: 500; }
.read { color: var(--teal); text-align: center; font-size: 1rem; }
.ipa { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: var(--teal); font-weight: 600; text-align: center; font-size: 1.05rem; letter-spacing: .25px; }
.hv { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 12px; border-radius: 12px; background: var(--sunk); }
.hv .hvw { color: var(--teal); font-size: 1.25rem; letter-spacing: .02em; }
.hvrows { display: flex; flex-direction: column; gap: 4px; width: 100%; max-width: 320px; }
.hvrow { display: flex; align-items: baseline; gap: 8px; font-size: .92rem; text-align: left; border-top: 1px solid var(--line); padding-top: 4px; }
.hvrow .hvc { flex: none; font-size: 1.2rem; min-width: 1.6em; text-align: center; }
.hvglue { text-align: center; color: var(--ink); }
.endef { text-align: center; color: var(--muted); font-size: .95rem; font-style: italic; }
.tokens { display: flex; flex-wrap: wrap; gap: 8px; min-height: 52px; align-content: flex-start; }
.tokens.answer { border-bottom: 2px dashed var(--line); padding-bottom: 10px; }
.tokens button { min-height: 44px; padding: 8px 14px; user-select: none; -webkit-user-select: none; touch-action: manipulation; transition: transform .12s, box-shadow .12s, border-color .12s; }
.tokens.answer button { cursor: grab; }
.tokens.answer button:active { cursor: grabbing; }
.tokens.answer button.dragging { opacity: .25; transform: scale(.92); }
.tokens.answer button.drop-target-before { border-left: 3px solid var(--teal) !important; transform: translateX(3px); }
.tokens.answer button.drop-target-after { border-right: 3px solid var(--teal) !important; transform: translateX(-3px); }
.token-drag-clone {
  position: fixed; pointer-events: none; z-index: 1000;
  border-radius: 12px; background: var(--surface); color: var(--ink);
  border: 2px solid var(--teal); box-shadow: 0 10px 24px rgba(0,0,0,.35);
  padding: 8px 16px; font-weight: 600; font-size: 1.1rem;
  transform: translate(-50%, -50%) scale(1.08);
  transition: none;
}
.feedback { border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.feedback.ok { background: var(--good-bg); }
.feedback.ok strong { color: var(--good); }
.feedback.no { background: var(--bad-bg); }
.feedback.no strong { color: var(--bad); }
.dock { position: sticky; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); padding-top: 12px; background: linear-gradient(transparent, var(--bg) 35%); z-index: 2; }
.lessonmode .dock { bottom: env(safe-area-inset-bottom, 0px); padding-bottom: 8px; }
.listen { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; align-items: center; }
.spk { flex: none; width: 40px; height: 40px; min-height: 40px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--teal); display: inline-grid; place-items: center; vertical-align: middle; }
.spk svg { width: 20px; height: 20px; }
.spk.big { width: 52px; height: 52px; min-height: 52px; }
.spk.big svg { width: 26px; height: 26px; }
.spk .turtle { font-size: 1.3rem; line-height: 1; }
.spk.big .turtle { font-size: 1.6rem; }
.spk:active { background: var(--sunk); }
span.spk { width: 34px; height: 34px; min-height: 34px; }
.fill { line-height: 2.4; white-space: pre-line; }
.fill select { width: auto; min-height: 38px; padding: 4px 8px; border-radius: 10px; font-size: .95rem; margin: 0 2px; }
.fill select.right { border-color: var(--good); background: var(--good-bg); }
.fill select.wrong { border-color: var(--bad); background: var(--bad-bg); }

/* Luyện nói */
.words { display: flex; flex-wrap: wrap; gap: 4px 6px; justify-content: center; font-size: 1.3rem; font-weight: 600; }
.words[lang="zh-Hans"], .words[lang="ja"] { gap: 0; font-weight: 500; font-size: 1.6rem; }
.words .hit { color: var(--good); }
.words .miss { color: var(--bad); text-decoration: underline wavy; text-underline-offset: 4px; }
.score { font-size: 2.4rem; font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; }
.mic { width: 84px; height: 84px; border-radius: 50%; margin: 0 auto; background: var(--teal); color: var(--teal-ink); border: none; }
.mic.live { background: var(--bad); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
.mic svg { width: 32px; height: 32px; }
.sentence { width: 100%; justify-content: space-between; text-align: left; }
.sentence .meta { flex: 1; min-width: 0; }
.phrases { display: flex; flex-wrap: wrap; gap: 6px; }
.phrases span { border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px; font-size: .9rem; }
.phrases span.used { background: var(--good-bg); border-color: var(--good); color: var(--good); }

/* Viết chữ */
.charbox { width: min(300px, 78vw); aspect-ratio: 1; max-width: 100%; margin: 0 auto; border: 2px solid var(--line); border-radius: 12px; background-color: var(--surface);
  background-image: linear-gradient(to right, transparent calc(50% - .5px), var(--grid) calc(50% - .5px), var(--grid) calc(50% + .5px), transparent calc(50% + .5px)),
    linear-gradient(to bottom, transparent calc(50% - .5px), var(--grid) calc(50% - .5px), var(--grid) calc(50% + .5px), transparent calc(50% + .5px));
  touch-action: none; }
.charbox svg { display: block; width: 100%; height: 100%; }
.chargrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.chargrid button { min-height: 64px; padding: 4px; flex-direction: column; gap: 0; font-size: 1.6rem; line-height: 1.2; }
.chargrid button small { font-size: .7rem; color: var(--muted); font-family: var(--font); }
.chargrid button.done { border-color: var(--good); }
.kana { grid-template-columns: repeat(5, 1fr); }

  };
}

function calcFinishEstimate(remTopics, remLessons, pace = STUDY_PACE, code = 'en') {
  if (remTopics <= 0 && remLessons <= 0) {
    return { days: 0, weeks: 0, timeText: 'Đã hoàn thành! 🎉', dateStr: 'Hôm nay', monthYearStr: 'Đã xong' };
  }

  // Tốc độ học: tính theo số chủ đề/bài học mỗi ngày
  // Mỗi buổi trọng tâm (25–30 phút) người học hoàn thành 1 chủ đề (gồm từ vựng + ngữ pháp + luyện nói + tổng ôn)
  let topicsPerDay = 1;
  if (pace === 'daily1') {
    topicsPerDay = 1; // 1 bài/ngày (7 bài/tuần)
  } else if (pace === 'daily2') {
    topicsPerDay = 2; // 2 bài/ngày (14 bài/tuần)
  } else {
    // Lịch xoay vòng 2-2-2-1 cân bằng 3 thứ tiếng:
    // Tiếng Anh: T2, T5 (2 bài/tuần)
    // Tiếng Trung: T3, T6 (2 bài/tuần)
    // Tiếng Nhật: T4, T7 (2 bài/tuần)
    topicsPerDay = 2 / 7;
  }

  // Hệ số quy đổi số tiết học nhỏ sang số buổi học trọng tâm (mỗi buổi 25-30p):
  // - Tiếng Nhật: trung bình 9.5 tiết/chủ đề (do bài Kanji N5 101 chữ và bài Minna no Nihongo dài 50-80 từ)
  // - Tiếng Trung: trung bình 6.7 tiết/chủ đề
  // - Tiếng Anh: trung bình 6.3 tiết/chủ đề
  const lessonDivisor = code === 'ja' ? 9.5 : (code === 'zh' ? 6.7 : 6);
  const effectiveRem = Math.max(remTopics, Math.ceil(remLessons / lessonDivisor));
  const days = Math.max(1, Math.ceil(effectiveRem / topicsPerDay));
  const weeks = Math.round((days / 7) * 10) / 10;

  const targetDate = new Date();
  targetDate.setDate(targetDate.getDate() + days);

  const day = targetDate.getDate();
  const month = targetDate.getMonth() + 1;
  const year = targetDate.getFullYear();
  const dateStr = (day < 10 ? '0' + day : day) + '/' + (month < 10 ? '0' + month : month) + '/' + year;
  const monthYearStr = 'Tháng ' + (month < 10 ? '0' + month : month) + '/' + year;

  let timeText = '';
  if (days <= 14) {
    timeText = '~' + days + ' ngày (' + dateStr + ')';
  } else if (weeks <= 8) {
    timeText = '~' + Math.round(weeks) + ' tuần (' + dateStr + ')';
  } else {
    const months = Math.round((days / 30) * 10) / 10;
    timeText = '~' + months + ' tháng (' + monthYearStr + ')';
  }

  return { days, weeks, timeText, dateStr, monthYearStr };
}

function renderMiniWeekChart(code, t) {
  const days = Array.from({ length: 7 }, (_, i) => t - 6 + i);
  const xd = (d) => xpOf(d, code);
  const g = goal(code, t);
  const max = Math.max(g, ...days.map(xd), 10);
  const wd = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];

  return h('div', { class: 'mini-week-box' },

const EN_CATEGORIES = CATEGORIES.en;
let subjectsOpen = false;
const fresh = () => ({ v: 2, name: '', goal: 20, lang: 'en', enCat: 'a1', zhCat: 'hsk1', jaCat: 'n5', days: {}, dl: {}, pv: {}, srs: {}, lessons: {}, spoken: {}, written: {}, fill: {}, gq: {}, ach: {}, del: {}, delAll: 0, t: 0 });
let S = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch (e) { /* bị chặn lưu trữ */ }
const SYNC = { ref: null, timer: 0, seen: -1 };
function save() {

// Gộp hai bản tiến độ (điện thoại và máy tính): giữ phần học nhiều hơn ở mỗi mục
function mergeState(a, b) {
  const [newer, older] = (a.t || 0) >= (b.t || 0) ? [a, b] : [b, a];
  const out = Object.assign(fresh(), older, newer);

  // 1. Quản lý mốc xóa toàn bộ (delAll)
  out.delAll = Math.max(older.delAll || 0, newer.delAll || 0);
  if (out.delAll > 0 && (older.t || 0) <= out.delAll) {
    return Object.assign(fresh(), newer, { del: newer.del || {}, delAll: out.delAll, t: Math.max(a.t || 0, b.t || 0) });
  }

  // 2. Gộp danh sách các mục đã xóa (tombstones)
  out.del = Object.assign({}, older.del || {}, newer.del || {});

  out.days = Object.assign({}, older.days);
  for (const [k, v] of Object.entries(newer.days || {})) out.days[k] = Math.max(out.days[k] || 0, v);

  out.dl = {};
  for (const src of [older.dl || {}, newer.dl || {}]) {
    for (const [d, m] of Object.entries(src)) {
      out.dl[d] = out.dl[d] || {};
      for (const [c, v] of Object.entries(m)) out.dl[d][c] = Math.max(out.dl[d][c] || 0, v);
    }
  }
  out.pv = Object.assign({}, older.pv, newer.pv);

  // 3. SRS: bỏ qua các mục đã xóa
  out.srs = {};
  for (const [k, v] of Object.entries(older.srs || {})) {
    if (!out.del[k]) out.srs[k] = v;
  }
  for (const [k, v] of Object.entries(newer.srs || {})) {
    if (!out.del[k]) {
      const o = out.srs[k];
      if (!o || (v.last || 0) > (o.last || 0) || ((v.last || 0) === (o.last || 0) && v.b >= o.b)) {
        out.srs[k] = v;
      }
    }
  }

  // 4. lessons, spoken, written: bỏ qua các bài đã xóa
  for (const f of ['lessons', 'spoken', 'written']) {
    out[f] = {};
    for (const [k, v] of Object.entries(older[f] || {})) {
      if (!out.del[k]) out[f][k] = v;
    }
    for (const [k, v] of Object.entries(newer[f] || {})) {
      if (!out.del[k]) {
        const o = out[f][k];
        out[f][k] = typeof v === 'number' && typeof o === 'number' ? Math.max(v, o) : (typeof v === 'number' ? v : o != null ? o : v);
      }
    }
  }

  out.fill = Object.assign({}, older.fill, newer.fill);
  out.ielts_challenge = Object.assign({}, older.ielts_challenge, newer.ielts_challenge);
  out.ach = Object.assign({}, older.ach, newer.ach);
  out.name = newer.name || older.name;
  out.t = Math.max(a.t || 0, b.t || 0);
  return out;
}
async function pullSync() {
  const snap = await SYNC.ref.get();
  const remote = snap && snap.exists && snap.data();
  if (remote && remote.json && (remote.t || 0) !== SYNC.seen) {
    S = mergeState(S, JSON.parse(remote.json)); SYNC.seen = remote.t || 0;
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* bỏ qua */ }
    return true;
  }
  return false;
}
async function pushSync() {
  try { await pullSync(); S.t = Math.max(Date.now(), (S.t || 0) + 1); await SYNC.ref.set({ json: JSON.stringify(S), t: S.t }); SYNC.seen = S.t; } catch (e) { /* thử lại lần lưu sau */ }
}
async function startSync() {
  try {
    if (!window.claude || !claude.use) return;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    SYNC.ref = db.doc('data/users/' + id + '/progress');
    const changed = await pullSync();
    if (changed && VIEW !== 'lesson') route();
    if (S.t && S.t !== SYNC.seen) pushSync();
    document.addEventListener('visibilitychange', async () => { if (!document.hidden && SYNC.ref) { try { if (await pullSync() && VIEW !== 'lesson') route(); } catch (e) { /* bỏ qua */ } } });
  } catch (e) { /* không đồng bộ được: vẫn dùng bản trên máy */ }
}

// ===== Đồng bộ GitHub Gist (tự động sao lưu tiến độ lên tài khoản GitHub) =====
const GH_KEY = 'lingogo-github-sync';
const GH_SYNC = { timer: 0, seen: -1, running: false };
function getGhConfig() {
  try { const raw = localStorage.getItem(GH_KEY); return raw ? JSON.parse(raw) : { token: '', gistId: '', user: '' }; } catch (e) { return { token: '', gistId: '', user: '' }; }
}
function saveGhConfig(cfg) {
  try { localStorage.setItem(GH_KEY, JSON.stringify(cfg)); } catch (e) {}
}
function ghHeaders(token) {
  const clean = (token || '').trim();
  const auth = clean.startsWith('Bearer ') || clean.startsWith('token ') ? clean : ('Bearer ' + clean);
  return { 'Accept': 'application/vnd.github+json', 'Authorization': auth, 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' };
}
async function findOrCreateGhGist(token) {
  const h = ghHeaders(token);
  const uRes = await fetch('https://api.github.com/user', { headers: h });
  if (!uRes.ok) throw new Error('Token không hợp lệ hoặc thiếu quyền gist (lỗi ' + uRes.status + ')');
  const uData = await uRes.json();
  const username = uData.login || '';
  const lRes = await fetch('https://api.github.com/gists?per_page=50', { headers: h });
  if (lRes.ok) {
    const list = await lRes.json();
    const found = list.find((g) => g.files && g.files['lingogo-progress.json']);
    if (found) return { gistId: found.id, user: username, isNew: false };
  }
  const cRes = await fetch('https://api.github.com/gists', {
    method: 'POST',
    headers: h,
    body: JSON.stringify({
      description: 'Lingogo Learning Progress Backup (Tự động đồng bộ)',
      public: false,
      files: { 'lingogo-progress.json': { content: JSON.stringify(S) } }
    })
  });
  if (!cRes.ok) throw new Error('Không thể tạo Gist (lỗi ' + cRes.status + ')');
  const created = await cRes.json();
  return { gistId: created.id, user: username, isNew: true };
}
async function pullGhSync(quiet = false) {
  const cfg = getGhConfig();
  if (!cfg.token || !cfg.gistId || GH_SYNC.running) return false;
  try {
    GH_SYNC.running = true;
    const res = await fetch('https://api.github.com/gists/' + cfg.gistId, { headers: ghHeaders(cfg.token) });
    if (!res.ok) {
      if (res.status === 404) {
        const found = await findOrCreateGhGist(cfg.token);
        cfg.gistId = found.gistId; saveGhConfig(cfg);
      }
      return false;
    }
    const gist = await res.json();
    const f = gist.files && gist.files['lingogo-progress.json'];
    if (!f || !f.content) return false;
    const remote = JSON.parse(f.content);
    if (remote && (remote.t || 0) !== GH_SYNC.seen) {
      // Nếu máy hiện tại mới hơn remote (ví dụ vừa bấm xóa bài hoặc xóa toàn bộ), không nạp lại từ remote mà cập nhật lên remote
      if ((S.t || 0) > (remote.t || 0)) {
        GH_SYNC.seen = S.t || Date.now();
        scheduleGhPush();
        return false;
      }
      const prevL = Object.keys(S.lessons || {}).length, prevS = Object.keys(S.srs || {}).length;
      S = mergeState(S, remote);
      GH_SYNC.seen = S.t || Date.now();
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
      const dl = Object.keys(S.lessons || {}).length - prevL, ds = Object.keys(S.srs || {}).length - prevS;
      if (!quiet) toast(dl || ds ? ('Đồng bộ GitHub: nhận thêm ' + dl + ' bài, ' + ds + ' mục ôn.') : 'Tiến độ đã đồng bộ mới nhất từ GitHub.');
      if (typeof route === 'function' && VIEW !== 'lesson') route();
      return true;
    }
    return false;
  } catch (e) {
    if (!quiet) toast('Lỗi đọc tiến độ từ GitHub: ' + (e.message || ''));
    return false;
  } finally {
    GH_SYNC.running = false;
  }
}
async function pushGhSync(quiet = true) {
  const cfg = getGhConfig();
  if (!cfg.token || !cfg.gistId || GH_SYNC.running) return false;
  try {
    GH_SYNC.running = true;
    try {
      const getRes = await fetch('https://api.github.com/gists/' + cfg.gistId, { headers: ghHeaders(cfg.token) });
      if (getRes.ok) {
        const gist = await getRes.json();
        const f = gist.files && gist.files['lingogo-progress.json'];
        if (f && f.content) {
          const remote = JSON.parse(f.content);
          if (remote && (remote.t || 0) > (S.t || 0)) S = mergeState(S, remote);
        }
      }
    } catch (e) {}
    S.t = Math.max(Date.now(), (S.t || 0) + 1);
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    const res = await fetch('https://api.github.com/gists/' + cfg.gistId, {
      method: 'PATCH',
      headers: ghHeaders(cfg.token),
      body: JSON.stringify({ files: { 'lingogo-progress.json': { content: JSON.stringify(S) } } })
    });
    if (!res.ok) throw new Error('Mã ' + res.status);
    GH_SYNC.seen = S.t;
    if (!quiet) toast('Đã sao lưu tiến độ lên GitHub!');
    return true;
  } catch (e) {
    if (!quiet) toast('Chưa thể lưu lên GitHub: ' + (e.message || ''));
    return false;
  } finally {
    GH_SYNC.running = false;
  }
}
function scheduleGhPush() {
  const cfg = getGhConfig();
  if (!cfg.token || !cfg.gistId) return;
  clearTimeout(GH_SYNC.timer);
  GH_SYNC.timer = setTimeout(() => { pushGhSync(true); }, 2500);
}
async function startGhSync() {
  const cfg = getGhConfig();
  if (!cfg.token) return;
  try {
    if (!cfg.gistId) {
      const res = await findOrCreateGhGist(cfg.token);
      cfg.gistId = res.gistId; cfg.user = res.user; saveGhConfig(cfg);
    }
    const updated = await pullGhSync(true);
    if (updated) {
      toast('Đã tự động nạp tiến độ mới nhất từ GitHub (@' + (cfg.user || 'User') + ')');
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) pullGhSync(true); });
  } catch (e) { /* yên lặng khi khởi động nếu offline */ }
}

function getDaySchedule(d = todayN()) {
  const diffDays = d - todayN();
  const dateObj = new Date();
  if (diffDays !== 0) dateObj.setDate(dateObj.getDate() + diffDays);
  return WEEKLY_SCHEDULE[dateObj.getDay()] || WEEKLY_SCHEDULE[0];
}

function goal(code = S.lang, d = todayN()) {
  const base = Math.max(20, S.goal || 20);
  if (S.smartSchedule === false) return base;
  const sch = getDaySchedule(d);
  if (!sch || !sch.goals || !sch.goals[code]) return base;
  return Math.max(10, Math.round(base * sch.goals[code]));
}

const xpOf = (d, code) => ((S.dl || {})[d] || {})[code] || 0;
const metGoal = (d, code) => xpOf(d, code) >= goal(code, d);
// Duy trì chuỗi ngày học liên tục (Streak): Chỉ cần người học duy trì việc học đều đặn mỗi ngày (tối thiểu 10 XP hoặc đạt mục tiêu)
const hasLearnedDay = (d, code) => xpOf(d, code) >= Math.min(10, goal(code, d));

function streak(code = S.lang) {
  let d = todayN(); if (!hasLearnedDay(d, code)) d--;
  let n = 0; while (hasLearnedDay(d, code)) { n++; d--; }
  return n;
}

function longest(code = S.lang) {
  const ks = Object.keys(S.dl || {}).filter((k) => hasLearnedDay(k, code)).map(Number).sort((a, b) => a - b);
  let best = 0, run = 0, prev = null;
  for (const k of ks) { run = prev !== null && k === prev + 1 ? run + 1 : 1; best = Math.max(best, run); prev = k; }
  return best;
}

function addXp(n, code = S.lang) {
  if (!n) return;
  const t = todayN(), before = metGoal(t, code);
  S.days[t] = (S.days[t] || 0) + n;
  S.dl = S.dl || {}; S.dl[t] = S.dl[t] || {}; S.dl[t][code] = (S.dl[t][code] || 0) + n;
  save();

function getStrokePositions(charData, width, height, padding) {
  if (!charData || !charData.medians || !window.HanziWriter) return [];
  const tf = HanziWriter.getScalingTransform ? HanziWriter.getScalingTransform(width, height, padding) : null;
  const scale = tf ? tf.scale : ((width - 2 * padding) / 1024);
  const xOffset = tf ? tf.x : padding;
  const yOffset = tf ? tf.y : padding;

  const pts = [];
  for (let i = 0; i < charData.medians.length; i++) {
    const m = charData.medians[i];
    if (!m || !m[0]) continue;
    const p = m[0];
    let sx = p[0] * scale + xOffset;
    let sy = height - yOffset - p[1] * scale;
    sx = Math.max(padding + 9, Math.min(width - padding - 9, sx));
    sy = Math.max(padding + 9, Math.min(height - padding - 9, sy));
    pts.push({ strokeNum: i + 1, x: sx, y: sy });
  }

  // Adjust slight collisions so all numbers remain legible
  for (let i = 0; i < pts.length; i++) {
    for (let j = i + 1; j < pts.length; j++) {
      const dx = pts[j].x - pts[i].x, dy = pts[j].y - pts[i].y;
      const dist = Math.hypot(dx, dy);
      if (dist < 18) {
        const angle = Math.atan2(dy || 1, dx || 0.1);
        const nudge = (18 - dist) / 2 + 2;
        pts[j].x += Math.cos(angle) * nudge;
        pts[j].y += Math.sin(angle) * nudge;
        pts[i].x -= Math.cos(angle) * nudge;
        pts[i].y -= Math.sin(angle) * nudge;
      }
    }
  }
  return pts;
}

function renderStrokeNumbers(box, strokePositions, visibleCount, completedCount = 0) {
  if (!box) return null;
  const svg = box.querySelector ? box.querySelector('svg') : null;
  if (!svg) return null;
  let g = svg.querySelector('.stroke-numbers');
  if (!g) {
    g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'stroke-numbers');
    g.setAttribute('style', 'pointer-events: none;');
    svg.appendChild(g);
  }
  while (g.firstChild) g.removeChild(g.firstChild);

  if (visibleCount <= 0 || !strokePositions || !strokePositions.length) return g;

  const count = Math.min(visibleCount, strokePositions.length);
  for (let i = 0; i < count; i++) {
    const pt = strokePositions[i];
    const isCompleted = (i + 1) <= completedCount;
    const isCurrent = (i + 1) === (completedCount + 1);

    const itemG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    itemG.setAttribute('class', 'stroke-num-item');
    itemG.setAttribute('data-stroke', String(pt.strokeNum));

    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', pt.x.toFixed(1));
    circle.setAttribute('cy', pt.y.toFixed(1));
    circle.setAttribute('r', pt.strokeNum >= 10 ? '10.5' : '9.5');
    circle.setAttribute('fill', isCompleted ? '#23784a' : (isCurrent ? '#e2902f' : '#d9383a'));
    circle.setAttribute('stroke', '#ffffff');
    circle.setAttribute('stroke-width', '1.5');
    circle.setAttribute('filter', 'drop-shadow(0 1px 2px rgba(0,0,0,0.35))');

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', pt.x.toFixed(1));
    text.setAttribute('y', pt.y.toFixed(1));
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dominant-baseline', 'central');
    text.setAttribute('fill', '#ffffff');
    text.setAttribute('font-size', pt.strokeNum >= 10 ? '9' : '10.5');
    text.setAttribute('font-weight', '700');
    text.setAttribute('font-family', 'system-ui, -apple-system, sans-serif');
    text.textContent = String(pt.strokeNum);

    itemG.appendChild(circle);
    itemG.appendChild(text);
    g.appendChild(itemG);
  }
  return g;
}

const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;

// Kích hoạt Auto Gain Control trên phần cứng Micro để tự động khuếch đại âm lượng giọng nói nhỏ
async function getSensitiveMicStream() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return null;
  try {
    return await navigator.mediaDevices.getUserMedia({
      audio: {
        autoGainControl: true, // Tăng độ nhạy cho giọng đọc nhỏ
        noiseSuppression: true, // Khử tạp âm nền
        echoCancellation: true  // Chống dội âm
      }

  } catch (e) {

// Dừng phiên nhận diện trước đó sạch sẽ để triệt tiêu lỗi 'aborted' ở lần nói 2, 3
async function stopActiveRecognition() {
  if (ACTIVE_STOP_FN) {
    const fn = ACTIVE_STOP_FN;
    ACTIVE_STOP_FN = null;
    try { fn(); } catch (e) {}
  }
  if (ACTIVE_REC) {
    const rec = ACTIVE_REC;
    ACTIVE_REC = null;
    try {
      rec.onstart = null;
      rec.onresult = null;
      rec.onerror = null;
      rec.onend = null;
      rec.abort();
    } catch (e) {}
    await new Promise((r) => setTimeout(r, 120));
  }
  if (ACTIVE_STREAM) {
    const st = ACTIVE_STREAM;
    ACTIVE_STREAM = null;
    try { st.getTracks().forEach((t) => t.stop()); } catch (e) {}
  }
}

function listenOnce(code, onInterim, isRetry = false) {
  return new Promise(async (resolve, reject) => {
    if (!Rec) return reject('not-supported');
    if (location.protocol === 'file:') return reject('file-protocol');

    await stopActiveRecognition();
    ACTIVE_STREAM = await getSensitiveMicStream();

    let done = false;
    let transcript = '';
    let speechTimer = null;
    const r = new Rec();
    ACTIVE_REC = r;

    r.lang = LANGS[code] ? LANGS[code].rec : 'en-US';
    r.interimResults = true;
    r.maxAlternatives = 5;
    r.continuous = true;

    const finish = (text) => {
      if (done) return;
      done = true;
      if (speechTimer) clearTimeout(speechTimer);
      ACTIVE_STOP_FN = null;
      ACTIVE_REC = null;
      try {
        r.onstart = null;
        r.onresult = null;
        r.onerror = null;
        r.onend = null;
        r.stop();
      } catch (e) {}
      if (ACTIVE_STREAM) {
        try { ACTIVE_STREAM.getTracks().forEach((t) => t.stop()); } catch (e) {}
        ACTIVE_STREAM = null;
      }
      resolve((text || transcript).trim());
    };

    const fail = (err) => {
      if (done) return;
      done = true;
      if (speechTimer) clearTimeout(speechTimer);
      ACTIVE_STOP_FN = null;
      ACTIVE_REC = null;
      try {
        r.onstart = null;
        r.onresult = null;
        r.onerror = null;
        r.onend = null;
        r.abort();
      } catch (e) {}
      if (ACTIVE_STREAM) {
        try { ACTIVE_STREAM.getTracks().forEach((t) => t.stop()); } catch (e) {}
        ACTIVE_STREAM = null;
      }
      reject(err);
    };

    ACTIVE_STOP_FN = () => {
      finish(transcript);
    };

    r.onstart = () => {
      if (onInterim) onInterim('🎙️ Đang nghe... Hãy nói to và rõ!');
    };

    r.onresult = (e) => {
      let cur = '';
      for (let i = 0; i < e.results.length; ++i) {
        const res = e.results[i];
        if (res && res[0] && res[0].transcript) {
          cur += res[0].transcript;
        }
      }
      if (cur) {
        transcript = cur;
        if (onInterim) onInterim('Đang nghe: “' + cur + '”');
        if (speechTimer) clearTimeout(speechTimer);
        // Tự động nhận diện xong sau 1.8 giây ngưng giọng
        speechTimer = setTimeout(() => {
          finish(transcript);
        }, 1800);
      }
    };

    r.onerror = (e) => {
      const errName = e.error || 'error';
      if (errName === 'aborted') {
        if (transcript.trim()) {
          return finish(transcript);
        }
        if (!isRetry) {
          done = true;
          stopActiveRecognition().then(() => {
            listenOnce(code, onInterim, true).then(resolve).catch(reject);
          });
          return;
        }
        return finish('');
      }

      if (transcript.trim()) {
        finish(transcript);
      } else {
        fail(errName);
      }
    };

    r.onend = () => {
      finish(transcript);
    };

    try {
      r.start();
    } catch (e) {
      if (!isRetry) {
        done = true;
        stopActiveRecognition().then(() => {
          listenOnce(code, onInterim, true).then(resolve).catch(reject);
        });
        return;
      }
      fail('not-allowed');
      return;
    }

    setTimeout(() => {
      if (!done) {
        finish(transcript);
      }
    }, code === 'en' ? 15000 : 10000);
  });
}

async function tryListen(code, onInterim) {
  try {

function go(k) {

function approxRawDueCount(code, t0 = todayN()) {
  if (DATA[code]) return rawDueIn(code);
  const prefix = code + ':';
  return Object.keys(S.srs || {}).filter((k) => {
    if (!k.startsWith(prefix)) return false;
    const rest = k.slice(prefix.length);
    if (rest.startsWith('speak:') || rest.startsWith('gram:') || rest.startsWith('write:')) return false;
    return S.srs[k] && S.srs[k].due <= t0;
  }).length;
}
function approxDueCount(code, t0 = todayN()) {
  const raw = approxRawDueCount(code, t0);
  const remQuota = Math.max(0, getDailyReviewQuota(code, t0) - getSessionReviewedToday(code, t0));
  return Math.min(raw, remQuota);
}
function formatReviewBtnText(code, t0 = todayN(), shortName = '') {
  const due = approxDueCount(code, t0);
  const done = getReviewedToday(code, t0);
  const namePart = shortName ? (' ' + shortName) : '';
  if (due > 0) {
    return done > 0
      ? ('🔄 Ôn' + (namePart || ' tiếp') + ' (' + due + ' từ · Đã ôn ' + done + ')')
      : ('🔄 Ôn' + (namePart || ' tập') + ' (' + due + ' từ)');
  }
  return done > 0
    ? ('✓ Đã ôn' + namePart + ' (' + done + ' mục hôm nay)')
    : ('🔄 Ôn' + (namePart || ' tập'));
}
async function goLangNextLesson(code) {
  if (!LANGS[code]) return;
  S.lang = code;
  save();
  mount(h('p', { class: 'loading' }, 'Đang tải bài học ' + LANGS[code].short + '…'));
  try {
    await loadLang(code);
    const nx = nextLesson(DATA[code]);
    if (nx) {
      lessonView(nx.t, nx.i);
    } else {
      go('home');
    }
  } catch (e) {
    go('home');
  }
}
function goLangReview(code) {
  if (!LANGS[code]) return;
  S.lang = code;
  REVIEW_SKILL = 'vocab';
  save();
  go('review');
}

  wrap.style.width = '44px';

    wrap.innerHTML = '<svg viewBox="0 0 60 40" width="44" height="32" aria-hidden="true">' +
      '<rect width="60" height="40" fill="#012169"/>' +
      '<path d="M0,0 L60,40 M60,0 L0,40" stroke="#fff" stroke-width="8"/>' +
      '<path d="M0,0 L60,40 M60,0 L0,40" stroke="#C8102E" stroke-width="4"/>' +
      '<path d="M30,0 V40 M0,20 H60" stroke="#fff" stroke-width="12"/>' +
      '<path d="M30,0 V40 M0,20 H60" stroke="#C8102E" stroke-width="7"/>' +
      '</svg>';

    wrap.innerHTML = '<svg viewBox="0 0 60 40" width="44" height="32" aria-hidden="true">' +
      '<rect width="60" height="40" fill="#DE2910"/>' +
      '<polygon points="12,6 14.1,12.5 20.9,12.5 15.4,16.5 17.5,23 12,19 6.5,23 8.6,16.5 3.1,12.5 9.9,12.5" fill="#FFDE00"/>' +
      '<circle cx="24" cy="5.5" r="1.8" fill="#FFDE00"/>' +
      '<circle cx="28" cy="9.5" r="1.8" fill="#FFDE00"/>' +
      '<circle cx="28" cy="15.5" r="1.8" fill="#FFDE00"/>' +

function pickView() {
  setTabs(false);
  const t = todayN();
  const sch = getDaySchedule(t);

  if (!PICK_SRS_PRELOADED) {
    PICK_SRS_PRELOADED = true;
    const learnedLangs = Object.keys(LANGS).filter((c) => !DATA[c] && Object.keys(S.lessons || {}).some((k) => k.startsWith(c + ':')));
    if (learnedLangs.length) {
      Promise.all(learnedLangs.map((c) => loadLang(c).then(() => ensureSrsItems(c)).catch(() => {}))).then(() => {
        if (VIEW === 'pick') pickView();
      });
    }
  }

  if (!PICK_HUB_OPEN) {
    const langChoices = h('div', { class: 'langpick' },
      ...Object.keys(LANGS).map((c) => {
        const lg = LANGS[c];
        const isCur = S.lang === c;
        return h('button', {
          class: 'langcard' + (isCur ? ' cur' : ''),
          style: { display: 'flex', alignItems: 'center', gap: '16px', padding: '18px 20px' },
          onclick: () => { S.lang = c; save(); go('home'); }
        },
          h('div', { class: 'glyph', style: { flexShrink: '0' } }, langFlagSvg(c)),
          h('div', { class: 'name', style: { fontSize: '1.25rem', fontWeight: 700 } }, lg.vi)
        );
      })
    );

    const roadmapBtn = h('button', {
      class: 'btn ghost full',
      style: {
        padding: '14px 18px',
        borderRadius: '16px',
        fontSize: '1rem',
        fontWeight: 700,
        borderColor: 'var(--teal)',
        color: 'var(--teal)'
      },
      onclick: () => { PICK_HUB_OPEN = true; pickView(); }
    }, '🗺️ Lộ trình');

    mount(h('div', { class: 'stack-lg', style: { paddingTop: '16px' } },
      h('div', { class: 'stack', style: { gap: '4px' } },
        h('p', { class: 'label' }, 'Lingogo'),
        h('h1', {}, 'Chào ' + S.name + ', hôm nay học gì?')
      ),
      langChoices,
      roadmapBtn
    ));
    return;
  }

  const tabsBar = h('div', { class: 'pick-tabs', role: 'tablist' },
    [
      ['progress', '📊 Tiến độ 3 tiếng'],
      ['schedule', '📅 Thời gian biểu'],
      ['roadmap', '🚀 Lộ trình & Cán đích']
    ].map(([id, label]) => h('button', {
      class: 'pick-tab-btn' + (PICK_TAB === id ? ' active' : ''),
      role: 'tab',
      'aria-selected': String(PICK_TAB === id),
      onclick: () => { PICK_TAB = id; pickView(); }
    }, label))
  );

  let tabContent;
  if (PICK_TAB === 'schedule') {
    tabContent = renderScheduleTabContent(t, sch);
  } else if (PICK_TAB === 'roadmap') {
    tabContent = renderRoadmapTabContent(t);
  } else {
    tabContent = renderProgressTabContent(t, sch);
  }

  mount(h('div', { class: 'stack-lg', style: { paddingTop: '16px' } },
    h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '8px', flexWrap: 'wrap' } },
      h('button', {
        class: 'btn ghost',
        style: { minHeight: '36px', padding: '6px 14px', fontSize: '.85rem' },
        onclick: () => { PICK_HUB_OPEN = false; pickView(); }
      }, '← Quay lại chọn ngôn ngữ'),
      h('span', { class: 'small muted' }, '🗺️ Lộ trình & Tiến độ')
    ),
    tabsBar,
    ...tabContent
  ));
}

  let goal = Math.max(20, S.goal || 20), lang = S.lang || 'en';

  let start;

function syncButton() {
  const cfg = getGhConfig();
  const isConnected = !!(cfg.token && cfg.gistId);
  let lp = null;
  const dot = h('span', {
    class: 'sync-dot ' + (isConnected ? 'on' : 'off'),
    title: isConnected ? ('Đã kết nối GitHub (@' + (cfg.user || 'User') + ')') : 'Chưa kết nối đồng bộ đám mây (bấm để kết nối)'
  });
  const btn = h('button', {
    class: 'sync-btn',
    'aria-label': isConnected ? 'Tự động đồng bộ' : 'Cài đặt đồng bộ',
    title: isConnected ? ('Đã kết nối GitHub (@' + (cfg.user || 'User') + ') · Bấm để đồng bộ ngay (Nhấn giữ để cài đặt)') : 'Chưa kết nối GitHub · Bấm để cài đặt đồng bộ',
    onclick: () => {
      if (btn.dataset.longPressed === 'true') {

// ===== HỆ THỐNG LUYỆN THI IELTS 4 KỸ NĂNG (TIẾNG ANH) =====
function bandOfLevel(lvl) {
  if (lvl === 'A1') return 'Band 4.5–5.0';
  if (lvl === 'A2') return 'Band 5.0–5.5';
  if (lvl === 'B1') return 'Band 5.5–6.5';
  if (lvl === 'B2') return 'Band 6.5–7.5';
  return 'Band 7.5–8.5+';
}

function isIeltsDone(t, skill) {
  if (!S.ielts) return false;
  const k = t.lang + ':' + t.id + ':' + skill;
  return !!(S.ielts[k] && S.ielts[k].done);
}

function ieltsDoneCount(t) {
  const skills = ['listen', 'speak', 'read', 'write'];
  return skills.filter((s) => isIeltsDone(t, s)).length;
}

function markIeltsDone(t, skill, score, band) {
  if (!S.ielts) S.ielts = {};
  const k = t.lang + ':' + t.id + ':' + skill;
  const isFirst = !S.ielts[k] || !S.ielts[k].done;
  const b = band || (score >= 90 ? '8.5' : score >= 80 ? '7.5' : score >= 70 ? '6.5' : '6.0');
  S.ielts[k] = { done: true, score: score || 100, band: b, ts: Date.now() };
  if (isFirst) {
    addXp(15, 'en');
    checkAch();
    save();
    toast('🎉 Hoàn thành IELTS ' + (skill === 'listen' ? 'Listening' : skill === 'speak' ? 'Speaking' : skill === 'read' ? 'Reading' : 'Writing') + ' (Band ' + b + ')! +15 XP');
  } else {
    save();
    toast('Đã cập nhật bài làm IELTS (Band ' + b + ')!');
  }
}

sents a pragmatic and indispensable public health strategy. By disincentivizing unhealthy consumption and financing nutritional education, governments can stem the epidemic of chronic lifestyle diseases."

function getIeltsBand(t, skill) {
  if (!S.ielts) return 'Chưa thi';
  const k = t.lang + ':' + t.id + ':' + skill;
  const item = S.ielts[k];
  if (!item || !item.done) return 'Chưa thi';
  if (item.band) return item.band;
  const s = item.score || 80;
  if (s >= 90) return '8.5';
  if (s >= 80) return '7.5';
  if (s >= 70) return '6.5';
  if (s >= 60) return '6.0';
  return '5.5';
}

function calculateOverallIeltsBand(t) {
  const skills = ['listen', 'speak', 'read', 'write'];
  const bands = skills.map((sk) => {
    const bStr = getIeltsBand(t, sk);
    const num = parseFloat(bStr);
    return isNaN(num) ? 6.5 : num;
  });
  const avg = bands.reduce((a, b) => a + b, 0) / 4;
  const whole = Math.floor(avg);
  const frac = avg - whole;
  if (frac < 0.25) return (whole).toFixed(1);
  if (frac < 0.75) return (whole + 0.5).toFixed(1);
  return (whole + 1.0).toFixed(1);
}

          const nextTopic = d.topics[idx + 1] || d.topics[0];
          IELTS_TOPIC['en'] = nextTopic.id;

function ieltsTipBox(title, items, fullModalTab) {
  let open = false;
  const content = h('div', { class: 'stack', style: { display: 'none', gap: '8px', marginTop: '8px', fontSize: '.86rem', lineHeight: 1.55 } },
    ...items.map(it => {
      if (typeof it === 'string') return h('p', { class: 'small muted', style: { margin: '2px 0' } }, '• ' + it);
      return h('div', { class: 'stack', style: { gap: '2px', padding: '6px 0', borderBottom: '1px dashed var(--line)' } },
        h('b', { style: { color: 'var(--teal)' } }, it.title || it.q || it.trap || it.rule || it.name),
        h('span', { class: 'small' }, it.desc || it.say || it.fix || it.ex),
        it.note && h('span', { class: 'small muted', style: { fontStyle: 'italic' } }, it.note)
      );
    }),
    fullModalTab ? h('button', {
      class: 'ghost mini',
      style: { alignSelf: 'flex-start', marginTop: '6px', color: 'var(--teal)', fontWeight: 600, padding: '4px 8px' },
      onclick: () => showIeltsTipsModal(fullModalTab)
    }, '📖 Mở Cẩm nang đầy đủ ➔') : null
  );

  const toggleBtn = h('button', {
    class: 'mini ghost',
    style: { border: '1px solid rgba(217, 119, 6, 0.35)', color: '#d97706', fontWeight: 600, padding: '3px 8px' },
    onclick: () => {
      open = !open;
      content.style.display = open ? 'flex' : 'none';
      toggleBtn.textContent = open ? 'Thu gọn ▴' : 'Xem mẹo ▾';
    }
  }, 'Xem mẹo ▾');

  return h('div', { class: 'ielts-tip-box stack' },
    h('div', { class: 'row between', style: { alignItems: 'center' } },
      h('div', { class: 'row', style: { gap: '6px', alignItems: 'center' } },
        h('span', { style: { fontSize: '1.05rem' } }, '💡'),
        h('b', { style: { fontSize: '.88rem', color: '#b45309' } }, title)
      ),
      toggleBtn
    ),
    content
  );
}

function showIeltsTipsModal(defaultTab) {
  let activeTab = defaultTab || 'roadmap';
  if (activeTab === 'listen') activeTab = 'listening';
  if (activeTab === 'speak') activeTab = 'speaking';
  if (activeTab === 'read') activeTab = 'reading';
  if (activeTab === 'write') activeTab = 'writing';

  const overlay = h('div', {
    class: 'modal-overlay',
    style: {
      position: 'fixed', top: 0, left: 0, right: 0, bottom: 0,
      background: 'rgba(0,0,0,0.72)', zIndex: 100,
      display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '12px'
    },
    onclick: (e) => { if (e.target === overlay) overlay.remove(); }
  });

  const tabs = [
    ['roadmap', '🚀 Lộ trình 0-7.5+'],
    ['listening', '🎧 10 Mẹo Nghe'],
    ['speaking', '🎙️ Nói & Phản xạ'],
    ['reading', '📖 Đọc Band 8.0+'],
    ['writing', '✍️ Viết & Dấu phẩy'],
    ['drills', '🎯 3 Bài luyện']
  ];

  const bodyArea = h('div', {
    class: 'stack',
    style: {
      gap: '12px', marginTop: '6px',
      overflowY: 'auto', flex: '1 1 auto', minHeight: 0,
      paddingRight: '4px', scrollbarWidth: 'thin'
    }
  });

  const tabButtons = tabs.map(([k, label]) => h('button', {
    class: 'ielts-tip-tab-btn' + (k === activeTab ? ' active' : ''),
    onclick: () => { activeTab = k; renderTab(); }
  }, label));

  const tabsBar = h('div', { class: 'ielts-tip-tabs-bar' }, ...tabButtons);

  function renderTab() {
    tabButtons.forEach((b, idx) => {
      b.className = 'ielts-tip-tab-btn' + (tabs[idx][0] === activeTab ? ' active' : '');
    });
    bodyArea.replaceChildren();

    if (activeTab === 'roadmap') {
      bodyArea.appendChild(h('p', { class: 'small muted' }, 'Lộ trình 4 giai đoạn chuẩn bị thi từ nền tảng đến 7.5+ IELTS từ chuyên mục Cẩm nang Tip:'));
      IELTS_TIPS_DATA.roadmap.forEach((r) => {
        bodyArea.appendChild(h('div', { class: 'panel stack', style: { background: 'rgba(15,82,87,0.06)', borderLeft: '4px solid var(--teal)' } },
          h('div', { class: 'row between', style: { alignItems: 'center' } },
            h('b', { style: { color: 'var(--teal)', fontSize: '.96rem' } }, r.stage),
            h('span', { class: 'chip level' }, 'Band ' + r.target)
          ),
          h('p', { class: 'small', style: { margin: '4px 0' } }, h('b', {}, 'Trọng tâm: '), r.focus),
          h('p', { class: 'small muted', style: { margin: 0 } }, h('b', {}, 'Thói quen: '), r.habit)
        ));
      });
    } else if (activeTab === 'listening') {
      bodyArea.appendChild(h('p', { class: 'small muted' }, '10 Mẹo thực chiến cải thiện điểm số và tránh bẫy nghe trong đề thi IELTS:'));
      IELTS_TIPS_DATA.listening.tips.forEach((t) => {
        bodyArea.appendChild(h('div', { class: 'panel stack', style: { background: 'var(--surface)', padding: '10px 12px' } },
          h('b', { style: { color: '#b45309', fontSize: '.92rem' } }, t.title),
          h('p', { class: 'small', style: { margin: 0, lineHeight: 1.55 } }, t.desc)
        ));
      });
    } else if (activeTab === 'speaking') {
      bodyArea.appendChild(h('b', { style: { color: 'var(--teal)', fontSize: '1.02rem' } }, '6 Tình huống ứng biến linh hoạt trong phòng thi'));
      IELTS_TIPS_DATA.speaking.scenarios.forEach((s) => {
        bodyArea.appendChild(h('div', { class: 'panel stack', style: { background: 'var(--surface)', padding: '10px 12px' } },
          h('b', { style: { color: '#0f5257' } }, s.q),
          h('p', { lang: 'en', style: { fontWeight: 600, color: 'var(--teal)', margin: '2px 0' } }, s.say),
          h('div', { class: 'row between', style: { alignItems: 'center' } },
            h('span', { class: 'small muted' }, s.note),
            listenBtns('en', s.say.split(' / ')[0])
          )
        ));
      });
      bodyArea.appendChild(h('b', { style: { color: '#ef4444', fontSize: '1.02rem', marginTop: '10px' } }, '5 Bẫy mất điểm Speaking cần tránh tuyệt đối'));
      IELTS_TIPS_DATA.speaking.pitfalls.forEach((p) => {
        bodyArea.appendChild(h('div', { class: 'panel stack', style: { background: 'rgba(239,68,68,0.06)', borderLeft: '4px solid #ef4444', padding: '10px 12px' } },
          h('b', { style: { color: '#b91c1c' } }, p.trap),
          h('p', { class: 'small', style: { margin: 0 } }, h('b', {}, 'Cách khắc phục: '), p.fix)
        ));
      });
    } else if (activeTab === 'reading') {
      bodyArea.appendChild(h('b', { style: { color: 'var(--teal)', fontSize: '1.02rem' } }, 'Nhận diện 4 thể loại văn bản học thuật'));
      bodyArea.appendChild(h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' } },
        ...IELTS_TIPS_DATA.reading.genres.map(g => h('div', { class: 'panel stack', style: { padding: '10px' } },
          h('b', { style: { color: 'var(--teal)' } }, g.name),
          h('p', { class: 'small muted', style: { margin: 0 } }, g.desc)
        ))
      ));
      bodyArea.appendChild(h('b', { style: { color: 'var(--teal)', fontSize: '1.02rem', marginTop: '8px' } }, '8 Chiến lược then chốt đạt Band 8.0+'));
      IELTS_TIPS_DATA.reading.strategies.forEach((st) => {
        bodyArea.appendChild(h('div', { class: 'panel', style: { padding: '10px 12px', background: 'var(--surface)' } },

    } else if (activeTab === 'writing') {
      bodyArea.appendChild(h('b', { style: { color: 'var(--teal)', fontSize: '1.02rem' } }, 'Quy tắc dùng dấu phẩy (Punctuation) đạt Band 7+ Grammatical Range'));
      IELTS_TIPS_DATA.writing.punctuation.forEach((p) => {
        bodyArea.appendChild(h('div', { class: 'panel stack', style: { background: 'var(--surface)', padding: '10px 12px' } },
          h('b', { style: { color: '#0f5257' } }, p.rule),
          h('p', { lang: 'en', style: { fontStyle: 'italic', margin: '2px 0', background: 'rgba(15,82,87,0.06)', padding: '6px 8px', borderRadius: '6px' } }, p.ex),
          h('span', { class: 'small muted' }, p.note)
        ));
      });
      bodyArea.appendChild(h('b', { style: { color: 'var(--teal)', fontSize: '1.02rem', marginTop: '10px' } }, 'Cấu trúc chuẩn Task 2: Causes & Solutions (Nguyên nhân & Giải pháp)'));
      const cs = IELTS_TIPS_DATA.writing.causesSolutions;
      [
        ['1. Introduction', cs.intro],
        ['2. Body Paragraph 1 (Nguyên nhân)', cs.body1],
        ['3. Body Paragraph 2 (Giải pháp)', cs.body2],
        ['4. Conclusion', cs.conclusion]
      ].forEach(([pName, pGuide]) => {
        bodyArea.appendChild(h('div', { class: 'panel stack', style: { background: 'var(--surface)', padding: '10px 12px' } },
          h('b', { style: { color: 'var(--teal)' } }, pName),
          h('p', { class: 'small', style: { margin: 0, lineHeight: 1.55 } }, pGuide)
        ));
      });
      bodyArea.appendChild(h('div', { class: 'panel stack', style: { background: 'rgba(217,119,6,0.08)', border: '1px solid rgba(217,119,6,0.28)', padding: '12px' } },
        h('b', { style: { color: '#b45309' } }, 'Bộ từ vựng đắt giá cho dạng Causes & Solutions:'),
        h('p', { class: 'small', style: { margin: '4px 0' } }, h('b', {}, 'Diễn đạt nguyên nhân: '), cs.vocabCauses.join(' · ')),
        h('p', { class: 'small', style: { margin: 0 } }, h('b', {}, 'Diễn đạt giải pháp: '), cs.vocabSolutions.join(' · '))
      ));
    } else if (activeTab === 'drills') {
      bodyArea.appendChild(h('p', { class: 'small muted' }, '3 Bài luyện áp dụng thực chiến giúp bứt phá band điểm từ tài liệu của Sally:'));
      IELTS_TIPS_DATA.drills.forEach((dr) => {
        bodyArea.appendChild(h('div', { class: 'panel stack', style: { background: 'rgba(15,82,87,0.06)', borderLeft: '4px solid var(--teal)', padding: '12px' } },
          h('b', { style: { color: 'var(--teal)', fontSize: '.96rem' } }, dr.name),
          h('p', { class: 'small', style: { margin: 0, lineHeight: 1.6 } }, dr.desc)
        ));
      });
    }
  }

  renderTab();

  const card = h('div', {
    class: 'panel',
    style: {
      maxWidth: '540px', width: '100%', maxHeight: '90vh',
      borderRadius: '16px', border: '2px solid var(--teal)', boxShadow: '0 10px 36px rgba(0,0,0,0.4)',
      background: 'var(--surface)', padding: '16px 18px',
      display: 'flex', flexDirection: 'column', boxSizing: 'border-box', overflow: 'hidden'
    }
  },
    h('div', { class: 'row between', style: { alignItems: 'center', flexShrink: 0, marginBottom: '8px' } },
      h('div', { class: 'stack', style: { gap: '2px' } },
        h('span', { class: 'chip accent', style: { fontWeight: 700 } }, 'ieltsonlinetests.com · Sally Wiki'),
        h('h2', { style: { margin: '4px 0 0 0', fontSize: '1.25rem' } }, '💡 Cẩm nang Tip & Lộ trình 4 Kỹ năng')
      ),
      h('button', { class: 'ghost mini', style: { flexShrink: 0, fontSize: '.9rem', padding: '4px 8px' }, onclick: () => overlay.remove() }, '✕ Đóng')
    ),
    tabsBar,
    bodyArea
  );

  overlay.appendChild(card);
  document.body.appendChild(overlay);
}

function getTipForStep(ex, code) {
  if (!ex) return null;
  if (ex.type === 'order') {
    if (code === 'en') return '💡 Tip: Trật tự từ S + V + O. Tránh lỗi Comma Splice (ghép 2 mệnh đề chỉ bằng dấu phẩy) - hãy dùng liên từ nối (FANBOYS) hoặc dấu chấm phẩy.';
    if (code === 'ja') return '💡 Tip: Vị ngữ động từ/tính từ luôn nằm ở CUỐI câu. Trợ từ (は, が, を, に, で, と) luôn đứng ngay sau danh từ mà nó bổ nghĩa.';
    if (code === 'zh') return '💡 Tip: Trật tự ngữ pháp cơ bản: Chủ ngữ + [Thời gian/Địa điểm] + Phó từ + Động từ + Tân ngữ. Trạng từ thời gian luôn đứng trước động từ.';
    return '💡 Tip: Sắp xếp các từ theo đúng cấu trúc ngữ pháp và trật tự câu.';
  }
  if (ex.type === 'gquiz') {
    if (code === 'en') return '💡 Tip: Xác định từ loại cần điền (danh từ, động từ, tính từ hay giới từ) dựa vào các từ đứng liền trước và sau trong câu.';
    if (code === 'ja') return '💡 Tip: Xác định trợ từ đi kèm và thể chia của động từ/tính từ (thể từ điển, thể て, thể ない) để chọn dạng ngữ pháp đúng.';
    if (code === 'zh') return '💡 Tip: Chú ý vị trí của lượng từ, phó từ phủ định (不/没) và trợ từ kết cấu (的/得/地) trong mẫu câu.';
    return '💡 Tip: Quan sát kỹ dấu hiệu ngữ pháp trong câu để chọn đáp án chính xác.';
  }
  if (ex.type === 'quiz') {
    if (code === 'en') return '💡 Tip: Đọc kỹ từ khóa (keywords) trong câu hỏi, chú ý bẫy từ đồng nghĩa (paraphrase) và loại trừ các đáp án chứa thông tin sai lệch.';
    return '💡 Tip: Bám sát câu hỏi để tìm từ khóa trong ngữ cảnh, chú ý các từ phủ định hoặc điều kiện để không bị chọn nhầm bẫy.';
  }
  if (ex.type === 'fill') {
    return '💡 Tip: Đọc lướt cả câu để nắm ý nghĩa toàn cảnh trước khi điền, chú ý liên từ nối câu và sự hòa hợp thì của mệnh đề.';
  }
  if (ex.type === 'speak') {
    if (code === 'en') return '💡 Tip: Dùng công thức P-E-E-R (Point ➔ Explanation ➔ Example ➔ Result); tạm dừng (pause) ngắn 1 giây để thở thay vì dùng filler rác (uhm, like).';
    if (code === 'ja') return '💡 Tip: Chú ý cao độ ngữ điệu (Pitch Accent), ngắt nghỉ đúng chỗ và phát âm rõ âm ngắt (っ), trường âm (ー).';
    if (code === 'zh') return '💡 Tip: Chú ý chuẩn hóa 4 thanh điệu (đặc biệt thanh 1 ngân cao phẳng, thanh 4 dứt khoát) và biến điệu của 一, 不.';
    return '💡 Tip: Giữ nhịp thở đều, tạm dừng ngắn 1 giây giữa các vế câu và phát âm to, dứt khoát.';
  }
  if (ex.type === 'write') {
    return '💡 Tip: Quy tắc viết thuận tay: từ trên xuống dưới, từ trái sang phải, ngang trước sổ sau, ngoài trước trong sau, vào trước đóng sau.';
  }
  if (ex.type === 'meaning' || ex.type === 'listen' || ex.type === 'reverse') {
    if (code === 'en') return '💡 Tip: Ghi nhớ từ vựng kèm câu ví dụ và collocations đi kèm; liên tưởng từ đồng nghĩa để nhớ sâu và lâu hơn.';
    return '💡 Tip: Gắn kết từ vựng với nghĩa Hán Việt gốc; âm Hán Việt chiếm hơn 70% từ vựng giúp bạn suy luận nghĩa từ mới cực nhanh.';
  }
  return null;
}

function stepTipBadge(ex, code) {
  if (!ex || ex.type === 'intro' || ex.type === 'kintro' || ex.type === 'gintro') return null;
  const tip = getTipForStep(ex, code);
  if (!tip) return null;
  let open = false;
  const tipText = h('p', {
    class: 'small',
    style: { display: 'none', margin: '4px 0 0 0', color: '#b45309', lineHeight: 1.45, fontWeight: 500 }
  }, tip);
  const btn = h('button', {
    type: 'button',
    class: 'ghost mini',
    style: {
      padding: '2px 8px',
      fontSize: '.74rem',
      color: '#d97706',
      borderColor: 'rgba(217, 119, 6, 0.35)',
      borderRadius: '8px',
      fontWeight: 600,
      cursor: 'pointer'
    },
    onclick: () => {
      open = !open;
      tipText.style.display = open ? 'block' : 'none';
      btn.textContent = open ? '💡 Tip ▴' : '💡 Tip ▾';
    }
  }, '💡 Tip ▾');

  return h('div', {
    class: 'step-tip-bar',
    style: {
      alignSelf: 'flex-start',
      margin: '0 0 8px 0',
      padding: '4px 10px',
      background: 'rgba(217, 119, 6, 0.08)',
      borderRadius: '8px',
      border: '1px dashed rgba(217, 119, 6, 0.3)',
      maxWidth: '100%',
      boxSizing: 'border-box'
    }
  },
    h('div', { class: 'row between', style: { alignItems: 'center', gap: '8px' } },
      h('span', { class: 'small', style: { color: '#b45309', fontWeight: 600 } }, '💡 Gợi ý làm bài:'),
      btn
    ),
    tipText
  );
}

// Sinh bộ đề IELTS 4 kỹ năng hoàn chỉnh cho bất kỳ chủ đề tiếng Anh nào
function getIeltsData(t, currentVol) {
  if (IELTS_MODE === 'volumes') {
    const volId = (currentVol && currentVol.vol) || IELTS_CURRENT_VOL || '2026-1';
    if (IELTS_IOT_TESTS[volId]) {
      const testObj = IELTS_IOT_TESTS[volId];
      if (testObj.listening && !testObj.listening.audioSrc && IELTS_AUDIO_MAP[volId]) {
        testObj.listening.audioSrc = IELTS_AUDIO_MAP[volId];
      }
      return testObj;
    }
  }
  const lvl = t.level || 'B1';
  const band = bandOfLevel(lvl);
  const vList = t.vocab || [];
  const speakLines = (t.speak || []).flatMap((s) => s.lines || []);
  
  // 1. Listening
  let listenLines = [];
  if (speakLines.length >= 2) {
    listenLines = speakLines.map((ln, i) => ({
      speaker: i % 2 === 0 ? 'Speaker A' : 'Speaker B',
      text: ln.t,
      vi: ln.m || ''
    }));
  } else {
    listenLines = [
      { speaker: 'Speaker A', text: 'Hello, thank you for meeting with me today to discuss our arrangements.', vi: 'Xin chào, cảm ơn bạn đã gặp tôi hôm nay để trao đổi về các sắp xếp của chúng ta.' },
      { speaker: 'Speaker B', text: 'It is a pleasure. Let us review the key points and finalize the schedule.', vi: 'Rất hân hạnh. Hãy cùng xem lại các điểm chính và chốt lịch trình nhé.' }
    ];
  }
  
  const listenScript = listenLines.map((l) => l.speaker + ': "' + l.text + '"').join('\n');
  const listenAudioText = listenLines.map((l) => l.text).join('. ');
  
  const listenMc = (t.quiz && t.quiz[0]) ? {
    q: t.quiz[0].q,
    options: t.quiz[0].o,
    answer: t.quiz[0].a,
    why: t.quiz[0].why || 'Dựa vào thông tin chi tiết người nói đã đề cập trong bài nghe.'
  } : {
    q: 'What is the primary focus of the conversation?',
    options: ['Making practical arrangements and communicating effectively', 'Complaining about delays', 'Canceling an upcoming project'],
    answer: 0,
    why: 'The speakers are discussing practical arrangements and effective communication.'
  };

  const keyWordObj = vList[0] || { w: 'meeting', m: 'cuộc hẹn / cuộc gặp' };
  const listenFill = {
    prompt: 'Listen and fill in the missing word (write ONE word):',
    sentence: 'The speaker highlights the necessity of having a clear understanding of ' + plain(keyWordObj.w).toLowerCase() + ' in real-world contexts.',
    target: plain(keyWordObj.w).toLowerCase().replace(/[^a-z0-9]/g, ''),
    rawTarget: plain(keyWordObj.w),
    hint: 'Gợi ý: ' + keyWordObj.m
  };

  // 2. Speaking
  const coachItems = t.coach || [];
  const p1Questions = coachItems.slice(0, 2).map((c) => ({
    q: c.q,
    vi: c.vi || '',
    st: c.st || 'I would say that...',
    sa: c.sa || ('In my view, ' + t.title.toLowerCase() + ' plays a fundamental role in our daily routines.'),
    phrases: c.ph || ['to be honest', 'in my daily routine', 'most importantly']
  }));
  if (p1Questions.length === 0) {
    p1Questions.push({
      q: 'How often do you encounter situations related to ' + t.title.toLowerCase() + '?',
      vi: 'Bạn thường gặp các tình huống liên quan đến chủ đề này như thế nào?',
      st: 'To be honest, I regularly...',
      sa: 'To be honest, I deal with this almost every day, especially during interactions with friends and coworkers.',
      phrases: ['on a regular basis', 'from my perspective', 'without a doubt']
    });
  }

  const p2CueCard = {
    title: 'Describe an important situation or experience where you had to deal with ' + t.title.toLowerCase(),
    prompts: [
      'When and where this situation took place',
      'Who you were communicating or working with',
      'What specific actions or conversations occurred',
      'And explain why this experience was particularly significant or memorable to you.'
    ],
    prepSeconds: 60,
    speakSeconds: 120,
    modelAnswer: 'I would like to talk about a memorable experience involving ' + t.title.toLowerCase() + '. ' +
      'It occurred a few months ago when I was participating in an important collaborative project. ' +
      'At that time, I was working closely with several colleagues from different backgrounds, which required clear communication and active listening. ' +
      'Throughout the interaction, we exchanged ideas, aligned our expectations, and addressed potential misunderstandings constructively. ' +
      'This experience was truly meaningful because it demonstrated the immense value of clarity and mutual respect. ' +
      'Looking back, it not only enhanced my confidence but also broadened my professional perspective substantially.'
  };

  const p3Discussion = [
    {
      q: 'Why do you think proficiency in ' + t.title.toLowerCase() + ' is so essential in modern life?',
      vi: 'Tại sao việc thành thạo chủ đề này lại vô cùng thiết yếu trong đời sống hiện đại?',
      sa: 'In my perspective, contemporary society relies heavily on swift, effective communication. Individuals who excel in this area can build trust faster, avoid friction, and collaborate productively.'
    },
    {
      q: 'How might technology change how people approach this area in the near future?',
      vi: 'Công nghệ có thể thay đổi cách mọi người tiếp cận vấn đề này trong tương lai ra sao?',
      sa: 'Undoubtedly, digital tools and automated platforms streamline routine workflows. However, emotional empathy, critical thinking, and nuanced expression will always require genuine human involvement.'
    }
  ];

  // 3. Reading
  const passageTitle = 'Reading Passage · ' + t.title;
  const pA = 'Mastery and thoughtful engagement with ' + t.title.toLowerCase() + ' have become indispensable in contemporary academic and professional spheres. Linguistic studies consistently indicate that learners who immerse themselves in structured discourse develop superior cognitive adaptability and collaborative problem-solving skills.';
  const pB = 'Furthermore, real-world case studies illustrate that genuine comprehension entails far more than rote memorization of lexical items. In complex environments, successful communicators distinguish themselves by their ability to decode contextual nuances, evaluate perspectives, and respond with precision and tact.';
  const pC = 'In conclusion, whether candidates are preparing for the international IELTS examination or pursuing personal growth, steady exposure paired with reflective practice remains the true benchmark of enduring fluency and intellectual advancement.';
  const fullPassage = [pA, pB, pC];

  const tfngQuestions = [
    {
      stmt: 'Research suggests that engaging in structured discourse enhances cognitive adaptability.',
      ans: 'TRUE',
      clue: 'Paragraph A explicitly states: "learners who immerse themselves in structured discourse develop superior cognitive adaptability..."',
      why: 'Thông tin trong bài đọc hoàn toàn trùng khớp với khẳng định của câu hỏi (TRUE).'
    },
    {
      stmt: 'Rote memorization of vocabulary is considered the single most important factor for successful communication.',
      ans: 'FALSE',
      clue: 'Paragraph B states: "genuine comprehension entails far more than rote memorization of lexical items."',
      why: 'Bài đọc chỉ rõ rằng việc học vẹt từ vựng là chưa đủ, mà còn cần sự nhạy bén ngữ cảnh (FALSE).'
    },
    {
      stmt: 'Most international corporations now require employees to retake the IELTS exam every two years.',
      ans: 'NOT GIVEN',
      clue: 'Paragraph C mentions preparing for international exams such as IELTS, but nowhere mentions corporation re-examination policies.',
      why: 'Bài đọc không hề đề cập đến quy định thi lại 2 năm một lần của các tập đoàn (NOT GIVEN).'
    }
  ];

  const readingVocab = vList.slice(0, 4).map((v) => ({
    w: plain(v.w),
    r: v.r || '',
    m: v.m || '',
    ex: v.ex || ''
  }));

  // 4. Writing
  const task1 = {
    type: 'Task 1 · Letter / Email',
    minWords: 150,
    prompt: (t.fill && t.fill.trans)
      ? ('You are writing a semi-formal email regarding ' + t.title.toLowerCase() + '.\\n- Explain the background and current situation\\n- Detail the key points and arrangements\\n- Propose suitable next steps or request a convenient meeting time.\\n(Write at least 150 words.)')
      : ('Write a formal/semi-formal email to a colleague or partner regarding ' + t.title.toLowerCase() + '.\\n- State your purpose and context\\n- Outline your specific suggestions\\n- Request their feedback by the end of the week.\\n(Write at least 150 words.)'),
    modelAnswer: (t.fill && t.fill.text)
      ? ('Dear Alex,\\n\\nI am writing to formally update you regarding our ongoing progress with ' + t.title.toLowerCase() + '. Everything is moving forward smoothly, and we have achieved the preliminary milestones established during our last discussion.\\n\\nWith regard to our upcoming schedule, I would like to propose a brief follow-up meeting next week so that we can review the outcomes in detail and address any lingering questions. Please let me know what day and time would be most convenient for your calendar.\\n\\nThank you very much for your consistent support and cooperation. I look forward to your response.\\n\\nWarm regards,\\nSally')
      : ('Dear Mr. Davis,\\n\\nI am writing to provide you with an overview of our latest developments in relation to ' + t.title.toLowerCase() + '. Over the past several weeks, our team has thoroughly assessed current workflows and identified valuable avenues for improvement.\\n\\nFirst and foremost, establishing a transparent communication routine has proved immensely beneficial for all stakeholders. In addition, streamlining day-to-day procedures enables greater agility without compromising standards.\\n\\nCould you please review the attached summary and let me know if you have any questions or further suggestions? I would appreciate receiving your thoughts by this Friday.\\n\\nSincerely,\\nSally')
  };

  const task2 = {
    type: 'Task 2 · Opinion / Discussion Essay',
    minWords: 250,
    prompt: 'Some people argue that competence in ' + t.title.toLowerCase() + ' is most effectively developed through formal educational courses, while others believe that practical everyday immersion is far more crucial. Discuss both views and give your own opinion. (Write at least 250 words.)',
    outline: [
      { part: '1. Introduction', guide: 'Paraphrase the prompt + Thesis statement (state that while formal courses provide core principles, practical immersion is indispensable).' },
      { part: '2. Body Paragraph 1 (Formal Education)', guide: 'Discuss structured methodology, guidance from certified instructors, and foundational accuracy.' },
      { part: '3. Body Paragraph 2 (Practical Immersion)', guide: 'Discuss spontaneous real-world practice, cognitive agility, and handling authentic nuances.' },
      { part: '4. Conclusion', guide: 'Summarize both perspectives and reaffirm your balanced personal verdict.' }
    ],
    linkingWords: ['Furthermore,', 'In addition,', 'On the other hand,', 'Consequently,', 'It is widely argued that', 'From my perspective,', 'In stark contrast,', 'Ultimately,'],
    modelEssay: 'In contemporary society, whether proficiency in ' + t.title.toLowerCase() + ' is better cultivated through formal classroom instruction or direct real-world immersion remains a prominent topic of discussion. While formal pedagogical training offers indispensable theoretical foundations, I firmly believe that experiential immersion is the ultimate driver of authentic communicative mastery.\n\nOn the one hand, advocates of structured education highlight the merits of systematic pedagogical guidance. In an academic environment, learners are methodically introduced to foundational rules, standardized terminology, and analytical frameworks. Furthermore, experienced instructors provide immediate, constructive feedback that prevents misconceptions from solidifying into persistent habits. Consequently, learners with rigorous educational grounding often exhibit high structural precision and academic composure.\n\nOn the other hand, real-world immersion provides indispensable advantages that cannot be replicated within traditional classrooms. Engaging in spontaneous, authentic situations compels individuals to process information in real time and adapt to diverse communicative styles. Moreover, successfully navigating real-life challenges cultivates psychological resilience and self-assurance. For instance, professionals who actively apply their competencies in active workplace environments consistently demonstrate superior practical agility compared to those who only memorize textbook theories.\n\nIn conclusion, although formal instruction establishes a dependable baseline of core mechanics, experiential immersion is undeniably paramount for genuine fluency. A balanced synergy between both methodologies represents the most effective pathway toward excellence in ' + t.title.toLowerCase() + '.'
  };

  return {
    band,
    title: t.title,
    sub: t.sub || t.title,
    listening: {
      title: 'IELTS Listening · Section 1 & 2',
      audioText: listenAudioText,
      transcript: listenScript,
      lines: listenLines,
      mc: listenMc,
      fill: listenFill
    },
    speaking: {
      title: 'IELTS Speaking · 3 Parts',
      part1: p1Questions,
      part2: p2CueCard,
      part3: p3Discussion
    },
    reading: {
      title: passageTitle,
      paragraphs: fullPassage,
      tfng: tfngQuestions,
      vocab: readingVocab
    },
    writing: {
      title: 'IELTS Writing · Task 1 & Task 2',
      task1,
      task2
    }
  };
}

const IELTS_TOPIC = {};
