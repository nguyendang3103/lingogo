          h('p', { class: 'small muted' }, e[2])
        ))
      );
    } else if (ex.type === 'gquiz') {
      const q = ex.q, langAttr = LANGS[code].lang;
      if (q.type === 'cloze') {
        const c = choose(q.opts, (o) => h('span', { lang: langAttr }, o));
        c.setCorrect(q.answer);
        body = h('div', { class: 'stack' },
          h('p', { class: 'label' }, 'Ngữ pháp · ' + q.label),
          h('p', { class: 'q', lang: langAttr }, q.prompt),
          q.hint && h('p', { class: 'small muted' }, 'Nghĩa: ' + q.hint),
          c.el
        );
        ready = () => c.sel() != null;
        gradeFn = () => ({ correct: c.sel() === q.answer, expected: q.answer });
      } else {
        const chosen = [];
        const ans = h('div', { class: 'tokens answer', lang: langAttr, 'aria-label': 'Câu của bạn' }), pool = h('div', { class: 'tokens', lang: langAttr });
        const draw = () => {
          ans.replaceChildren(...chosen.map((c, idx) => {
            const b = h('button', {}, c.t);
            attachTokenReorder(b, c, idx, chosen, draw, () => checked);
            return b;
          }));
          pool.replaceChildren(...q.bank.filter((b) => !chosen.includes(b)).map((b) => h('button', { onclick: () => { if (!checked) { chosen.push(b); draw(); } } }, b.t)));
          update();
        };
        body = h('div', { class: 'stack' },
          h('p', { class: 'label' }, 'Ngữ pháp · ' + q.label),
          h('p', { class: 'q' }, q.prompt),
          ans, pool
        );
        ready = () => chosen.length === q.bank.length;
        after = () => { pool.replaceChildren(); };
        gradeFn = () => ({ correct: chosen.map((c) => c.t).join('') === q.answer, expected: q.e[0] });
        setTimeout(draw);
      }
    }

    function check() {
      checked = true;
      if (ex.type === 'intro' || ex.type === 'kintro' || ex.type === 'gintro' || (ex.type === 'speak' && !resp)) { done++; return step(); }
      const r = gradeFn();
      if (!first.has(ex.n)) {
        first.set(ex.n, Object.assign(r, { ex }));
        if (ex.v && ['meaning', 'listen', 'reverse'].includes(ex.type)) {
          const k = sid(code, ex.v.id), prev = S.srs[k];
          if (!prev || prev.last !== todayN() || !r.correct) srsRate(k, r.correct);
        }
        if (ex.k) srsRate(sid(code, ex.k.id), r.correct);
        if (ex.q) srsRate(sid(code, ex.q.id), r.correct);
        if (ex.type === 'speak' && resp) srsRate(code + ':speak:' + plain(ex.text), resp.score >= 70);
        if (ex.type === 'write') srsRate(code + ':write:' + ex.ch, r.correct);
        if (ex.type === 'gquiz') {
          srsRate(code + ':gram:' + ex.q.p.gid, r.correct);
          const st = gqStore();
          if (r.correct) {
            if (st.wrong[ex.q.p.gid]) {
              st.wrong[ex.q.p.gid]--;
              if (st.wrong[ex.q.p.gid] <= 0) delete st.wrong[ex.q.p.gid];
            }
          } else {
            st.wrong[ex.q.p.gid] = (st.wrong[ex.q.p.gid] || 0) + 1;
          }
          save();
        }
      }
      if (!r.correct && !retried.has(ex.n) && ex.type !== 'write') { retried.add(ex.n); queue.push(ex); }
      if (ex.type === 'write' && !r.self) S.written[sid(code, ex.ch)] = (S.written[sid(code, ex.ch)] || 0) + 1;
      if (ex.type === 'speak') { done++; return step(); }
      done++; after(r);
      fb.replaceChildren(h('div', { class: 'feedback ' + (r.correct ? 'ok' : 'no') },
        h('strong', {}, r.self ? 'Tốt lắm!' : r.correct ? 'Chính xác!' : 'Chưa đúng'),
        r.align && h('div', { class: 'words', lang: LANGS[code].lang }, r.align.units.map((w, k) => h('span', { class: r.align.hit[k] ? 'hit' : 'miss' }, w))),
        r.score != null && h('p', { class: 'small' }, 'Máy nghe đúng ' + r.score + '%' + (r.correct ? '.' : '. Chỗ gạch đỏ là chỗ cần nói rõ hơn.')),
        !r.correct && !r.align && r.expected && ex.type !== 'order' && ex.type !== 'quiz' && ex.type !== 'gquiz' && h('p', { lang: LANGS[code].lang }, 'Đáp án: ' + r.expected),
        r.note && ex.type !== 'quiz' && h('p', { class: 'small' }, r.note),
        getTipForStep(ex, code) ? h('div', { class: 'ielts-tip-box', style: { margin: '6px 0 2px 0', padding: '8px 12px', fontSize: '.84rem', borderRadius: '10px' } },
          h('p', { style: { margin: 0, color: '#b45309', fontWeight: 500, lineHeight: 1.45 } }, getTipForStep(ex, code))
        ) : null,
        ex.type === 'order' ? orderFeedback(code, ex, r) : null,
        ex.type === 'quiz' ? quizFeedback(code, ex, r) : null,
        ex.type === 'gquiz' ? grammarQuizFeedback(code, ex, r) : null,
        ex.type === 'reverse' && ex.v && ex.v.r ? h('div', { class: 'stack', style: { gap: '4px', marginTop: '4px' } },
          h('p', { class: code === 'en' ? 'ipa' : 'read', style: { margin: 0, color: 'var(--teal)', fontWeight: 600, textAlign: 'left' } }, ex.v.r),
          h('div', { class: 'listen', style: { justifyContent: 'flex-start' } }, listenBtns(code, ex.v.w))
        ) : null,
        ex.v && ['meaning', 'listen', 'reverse'].includes(ex.type) && code !== 'en' ? h('div', { style: { marginTop: '8px' } }, hvBlock(code, ex.v)) : null
      ),
      ex.type === 'fill' ? fillReveal(code, ex.fill, t.id) : '');
      if (ex.type === 'order') setTimeout(() => say(code, ex.text), 250);
      if (ex.type === 'quiz' && (code === 'zh' || code === 'en')) setTimeout(() => say(code, ex.q.o[ex.q.a]), 250);
      if (ex.type === 'gquiz') setTimeout(() => say(code, ex.q.e[0]), 250);
      btn.hidden = false; btn.disabled = false; btn.textContent = 'Tiếp theo ➔'; btn.onclick = step; btn.focus();
    }
    btn.addEventListener('click', () => { if (!checked) check(); });
    const total = done + queue.length + 1;
    mount(h('div', { class: 'stack-lg' },
      h('div', { class: 'topbar' }, h('button', { class: 'ghost', onclick: exit }, 'Thoát'), h('div', { class: 'bar' }, h('i', { style: { width: (done / total * 100) + '%' } })), feedbackBtn()),
      retried.has(ex.n) && first.has(ex.n) && h('span', { class: 'chip', style: { alignSelf: 'flex-start' } }, 'Làm lại câu chưa đúng'),
      stepTipBadge(ex, code),
      body, h('div', { class: 'dock stack', style: { gap: '6px' } }, btn, h('p', { class: 'keyhint' }, 'Phím 1–4 để chọn · Enter để kiểm tra / tiếp tục')), fb));
    update();
  }

  function finish() {
    const all = [...first.values()], graded = all.filter((r) => !r.self);
    const correct = graded.filter((r) => r.correct).length, total = graded.length;
    const pct = total ? Math.round(correct / total * 100) : 100;
    const k = lkey(t, i), repeat = S.lessons[k] != null;
    // XP: mỗi từ / kanji / câu / tình huống làm đúng ngay lần đầu = 5 XP; điền từ: 5 XP mỗi chỗ đúng
    const keyOf = (e) => e.v ? 'v' + e.v.id : e.k ? 'k' + e.k.id : e.q ? 'q' + e.q.id : e.type === 'gquiz' ? 'gq' + e.q.p.gid : e.type === 'write' ? 'w' + e.ch : 's' + (e.text || '');
    const won = new Set(); let fillXp = 0;
    all.forEach((r) => { if (r.ex.type === 'fill') fillXp += XP_ITEM * (r.ok || 0); else if (r.correct && !(r.ex.type === 'write' && r.self)) won.add(keyOf(r.ex)); });

      h('p', { class: 'label' }, t.sub || t.title),

      h('p', {}, h('b', {}, correct + '/' + total + ' câu đúng'), ' · +' + xp + ' XP' + (repeat ? ' (học lại: nửa XP)' : '')),
      h('p', {}, 'Hôm nay ' + LANGS[code].short + ': ' + xpOf(todayN(), code) + '/' + goal() + ' XP · chuỗi ' + streak(code) + ' ngày'),
      nx && h('button', { class: 'primary block', onclick: () => lessonView(nx.t, nx.i) }, 'Học bài tiếp theo'),
      h('button', { class: 'block', onclick: () => go('home') }, 'Về trang Học'),
      repeat && h('button', {
        class: 'ghost mini block',
        style: { color: 'var(--muted)', marginTop: '4px', fontSize: '.82rem' },
        onclick: () => {
          if (confirm('Xóa tiến độ bài “' + lessonTitle(t, i) + '” để học lại từ đầu?')) {

            go('home');
          }
        }
      }, 'Xóa tiến độ bài này')));

  const isDone = lessonDone(t, i);
  const oldScoreText = typeof S.lessons[lkey(t, i)] === 'number' ? ('Điểm cao nhất: ' + S.lessons[lkey(t, i)] + '%') : 'Đã học ở app cũ';

  mount(h('div', { class: 'stack-lg' },

          h('span', { class: 'small muted', style: { fontSize: '.84rem' } }, oldScoreText)
        ),
        h('span', { class: 'small muted', style: { fontSize: '.78rem' } }, 'Bạn có thể xóa tiến độ bài này để học lại từ đầu như bài mới.')
      ),

        },
        onclick: () => {
          if (confirm('Xóa tiến độ bài “' + lessonTitle(t, i) + '” để học lại từ đầu như bài mới?')) {

      ...t.lessons[i].words.map((v) => h('button', { class: 'lesson', onclick: () => say(code, v.w) },
        h('span', { class: 'meta' }, h('b', { lang: LANGS[code].lang }, plain(v.w)), v.r && v.r !== v.w ? h('span', { class: 'small' + (code === 'en' ? ' ipa' : ' muted'), style: code === 'en' ? { color: 'var(--teal)', fontWeight: 600, display: 'inline-block', marginLeft: '6px' } : null }, v.r) : '', h('span', { class: 'small muted', style: { display: 'block' } }, v.m)),
        h('span', { class: 'spk', 'aria-hidden': 'true' }, icon(ICON.speaker))))),
    t.lessons[i].kind !== 'learn' && h('p', { class: 'muted' }, ({ review: 'Ôn lại những từ còn yếu của cả chủ đề, nghe chọn từ, kanji và tình huống.', quiz: 'Chọn cách nói đúng trong các tình huống thực tế.', fill: t.lang === 'en' ? 'Điền từ vào email, rồi sắp xếp câu ví dụ.' : 'Điền từ vào đoạn hội thoại, rồi sắp xếp câu ví dụ.', speak: 'Nghe và nói lại các câu trong chủ đề.', kanji: 'Học kanji mới: nghĩa Hán Việt, cách đọc, rồi tập viết từng chữ.' })[t.lessons[i].kind]),
    h('div', { class: 'dock stack', style: { gap: '8px' } },
      h('button', { class: 'primary block', onclick: step }, isDone ? ('Học lại bài này · ' + steps.filter((s) => s.type !== 'intro').length + ' câu') : ('Bắt đầu · ' + steps.filter((s) => s.type !== 'intro').length + ' câu')),
      isDone && h('button', {
        class: 'ghost block mini',

        onclick: () => {
          if (confirm('Xóa tiến độ bài “' + lessonTitle(t, i) + '” để học lại từ đầu như bài mới?')) {

let REVIEW_SKILL = 'vocab'; // Mặc định chỉ ôn từ mới

function reviewView() {

  const counts = {

      badge = h('span', { class: 'chip accent', style: { fontSize: '.8rem' } }, '🎙️ Có ' + (counts.speak || 0) + ' câu cần ôn');
    } else if (REVIEW_SKILL === 'write') {
      title = '✍️ Ôn tập kỹ năng Viết';
      subtitle = 'Luyện viết lại các chữ Hán / Kanji đã học theo nét chuẩn.';
      backBtn = h('button', { class: 'ghost mini', onclick: () => { SKILL_TAB = 'write'; go('skills'); } }, '← Về tab Luyện Viết');
      badge = h('span', { class: 'chip accent', style: { fontSize: '.8rem' } }, '✍️ Có ' + (counts.write || 0) + ' chữ cần ôn');
    } else if (REVIEW_SKILL === 'gram') {
      title = '📖 Ôn tập ngữ pháp';
      subtitle = 'Ôn tập các mẫu câu và cấu trúc ngữ pháp đã học.';
      backBtn = h('button', { class: 'ghost mini', onclick: () => go('knowledge') }, '← Về tab Kiến thức');
      badge = h('span', { class: 'chip accent', style: { fontSize: '.8rem' } }, '📖 Có ' + (counts.gram || 0) + ' điểm cần ôn');
    }

    return h('div', { class: 'stack', style: { gap: '10px' } },
      h('div', { class: 'row between', style: { alignItems: 'center' } },
        backBtn,
        h('div', { class: 'row', style: { gap: '6px', alignItems: 'center' } },
          feedbackBtn({ mode: 'review_' + REVIEW_SKILL }),
          langSwitch()
        )
      ),
      h('div', { class: 'stack', style: { gap: '4px' } },
        h('h1', { style: { margin: 0, fontSize: '1.4rem' } }, title),
        h('p', { class: 'small muted', style: { margin: 0 } }, subtitle),
        h('div', { class: 'row', style: { marginTop: '4px' } }, badge)
      )
    );
  };

  const queue = srsDueItems(code, REVIEW_SKILL)
    .sort((a, b) => S.srs[a.key].due - S.srs[b.key].due || S.srs[a.key].b - S.srs[b.key].b)
    .slice(0, 30);
  let count = 0;

  if (!queue.length) {
    mount(h('div', { class: 'stack-lg' }, head(),
      h('div', { class: 'panel stack center', style: { padding: '24px', borderRadius: '16px', gap: '10px' } },
        h('h2', {}, REVIEW_SKILL === 'vocab' ? '🎉 Đã ôn hết từ mới hôm nay!' : '🎉 Đã hoàn thành xong phần ôn tập!'),
        h('p', { class: 'muted center', style: { margin: 0 } },
          REVIEW_SKILL === 'vocab'
            ? 'Bạn đã hoàn thành toàn bộ các từ vựng đến hạn ôn hôm nay. Hãy học thêm bài mới hoặc sang tab Kỹ năng để luyện Nghe - Nói - Đọc - Viết!'
            : 'Bạn đã hoàn thành xong các mục đến hạn hôm nay.'
        ),
        h('div', { class: 'row center', style: { gap: '8px', marginTop: '12px' } },
          h('button', { class: 'primary', onclick: () => go('home') }, 'Về trang Học'),
          h('button', { class: 'ghost', onclick: () => go('exam') }, 'Đến tab Luyện thi')
        )
      )
    ));
    return;
  }

  const show = () => {
    window.scrollTo(0, 0);
    const item = queue[0];
    if (!item) {
      checkAch();
      mount(h('div', { class: 'stack-lg' }, head(),
        h('div', { class: 'panel stack center', style: { padding: '24px', borderRadius: '16px', gap: '10px' } },
          h('h2', {}, REVIEW_SKILL === 'vocab' ? '🎉 Xong phiên ôn tập từ mới!' : '🎉 Xong phiên ôn tập!'),
          h('p', { class: 'muted center', style: { margin: 0 } }, 'Bạn đã hoàn thành ' + count + ' lượt lặp lại ngắt quãng.'),
          counts[REVIEW_SKILL] > count ? h('button', { class: 'accent block', onclick: () => reviewView() }, 'Ôn tiếp các từ còn lại') : null,
          h('div', { class: 'row center', style: { gap: '8px', marginTop: '12px' } },
            h('button', { class: 'primary', onclick: () => go('home') }, 'Về trang Học'),
            h('button', { class: 'ghost', onclick: () => go('exam') }, 'Đến tab Luyện thi')
          )
        )
      ));
      return;
    }

    const k = item.key, s = S.srs[k];
    const skillBadge = {
      vocab: h('span', { class: 'chip' }, item.it && item.it.k ? 'Kanji' : 'Từ vựng'),
      speak: h('span', { class: 'chip accent' }, '🎙️ Nói'),
      write: h('span', { class: 'chip good' }, '✍️ Luyện viết'),
      gram: h('span', { class: 'chip' }, '📖 Ngữ pháp')
    }[item.skill] || h('span', { class: 'chip' }, item.skill);

    const subTitle = (item.it && item.it.t && (item.it.t.sub || item.it.t.title)) || (item.it && item.it.lv) || 'Spaced Repetition';
    const topBar = h('div', { class: 'row between', style: { alignItems: 'center' } },
      h('div', { class: 'row', style: { gap: '6px', alignItems: 'center' } }, skillBadge, h('span', { class: 'small muted' }, subTitle)),
      h('span', { class: 'chip' }, 'Còn ' + queue.length)
    );

    // 1. TỪ VỰNG / KANJI
    if (item.skill === 'vocab') {
      const it = item.it;
      let front, back, sayText;
      if (it.v) {
        const v = it.v; sayText = v.w;
        front = h('div', { class: 'big', lang: L().lang }, plain(v.w));
        const gTip = grammarTipForWord(code, v);
        back = h('div', { class: 'stack', hidden: true, style: { gap: '8px', marginTop: '8px' } },
          v.r && (v.r !== v.w ? h('div', { class: code === 'en' ? 'ipa' : 'read', lang: code === 'ja' ? 'ja' : null }, v.r) : null),
          h('p', { style: { fontSize: '1.25rem', fontWeight: 700, margin: '2px 0' } }, v.m),
          v.d && code === 'en' && h('p', { class: 'small muted', style: { margin: 0 } }, v.d),
          code !== 'en' && hvBlock(code, v),
          v.ex && h('div', {
            class: 'panel stack',
            style: {
              background: 'rgba(15,82,87,.07)',
              border: '1px solid var(--line)',
              borderRadius: '12px',
              padding: '12px 14px',
              gap: '6px',
              marginTop: '6px',
              textAlign: 'left'
            }
          },
            h('div', { class: 'row between', style: { alignItems: 'center' } },
              h('span', { class: 'label', style: { margin: 0, color: 'var(--teal)', fontWeight: '700', fontSize: '.8rem' } }, '📝 Ví dụ đặt câu kết hợp ngữ pháp:'),
              listenBtns(code, v.ex)
            ),
            h('p', {
              lang: L().lang,
              style: { fontSize: '1.15rem', fontWeight: 600, margin: 0, lineHeight: 1.45 }
            }, renderHighlightedEx(v.ex, v.w, L().lang)),
            v.exr && h('p', {
              class: code === 'en' ? 'ipa' : 'read',
              lang: code === 'ja' ? 'ja' : null,
              style: { margin: 0, fontSize: '1rem', color: 'var(--teal)', fontWeight: 500 }
            }, v.exr),
            v.exm && h('p', {
              class: 'small muted',
              style: { margin: 0, fontSize: '.95rem', lineHeight: 1.4 }
            }, v.exm),
            gTip
          )
        );
      } else {
        const kj = it.k; sayText = kj.ex && kj.ex[0] ? plain(kj.ex[0][0]) : kj.k;
        front = h('div', { class: 'big', lang: 'ja' }, kj.k);
        back = h('div', { class: 'stack', hidden: true, style: { gap: '8px', marginTop: '8px' } },
          h('p', { style: { fontSize: '1.3rem', fontWeight: 700, margin: '2px 0' } }, kj.hv + (kj.m ? ' (' + kj.m + ')' : '')),
          h('p', { class: 'small', lang: 'ja', style: { color: 'var(--teal)', fontWeight: 600 } }, 'On: ' + kj.on + ' · Kun: ' + kj.kun),
          kj.ex && kj.ex.length && h('div', {
            class: 'panel stack',
            style: {
              background: 'rgba(15,82,87,.07)',
              border: '1px solid var(--line)',
              borderRadius: '12px',
              padding: '12px 14px',
              gap: '6px',
              marginTop: '6px',
              textAlign: 'left'
            }
          },
            h('span', { class: 'label', style: { margin: 0, color: 'var(--teal)', fontWeight: '700', fontSize: '.8rem' } }, '📝 Từ ghép & Ví dụ đặt câu:'),
            ...kj.ex.slice(0, 3).map((e) => h('div', { class: 'row between', style: { alignItems: 'center', gap: '8px' } },
              h('div', { class: 'stack', style: { gap: '2px' } },
                h('p', { class: 'small', lang: 'ja', style: { fontSize: '1rem', margin: 0, fontWeight: 600 } }, ruby(e[0])),
                h('p', { class: 'small muted', style: { margin: 0 } }, e[1])
              ),
              spk('ja', plain(e[0]))
            ))
          )
        );
      }
      const pool = Object.values(cardIndex(code)), t0r = Date.now();
      const answer = it.v ? it.v.m : it.k.hv;
      const others = it.v
        ? pool.filter((x) => x.v && x.v.id !== it.v.id && x.v.m !== it.v.m && x.t === it.t).concat(pool.filter((x) => x.v && x.v.id !== it.v.id && x.v.m !== it.v.m && x.t !== it.t))
        : pool.filter((x) => x.k && x.k.k !== it.k.k && x.k.hv !== it.k.hv);
      const labels = [...new Set(others.slice(0, 40).map((x) => (it.v ? x.v.m : x.k.hv)))];
      const opts = shuffle([answer, ...sample(labels, 3)]);
      const verdict = h('div', { 'aria-live': 'assertive' });
      let wrongFlag = false;
      const onNext = () => {
        queue.shift();
        if (wrongFlag) queue.push(item);
        show();
      };
      const contTop = h('button', {
        class: 'primary block next-btn',
        style: { fontSize: '1.05rem', fontWeight: '700', padding: '12px 16px', borderRadius: '12px' },
        onclick: onNext
      }, 'Tiếp theo ➔');
      const topDock = h('div', { class: 'stack', style: { gap: '8px' }, hidden: true }, contTop, verdict);

      const bs = opts.map((o, j) => h('button', { 'aria-keyshortcuts': String(j + 1), onclick: () => {
        const ok = o === answer, sec = (Date.now() - t0r) / 1000, g = !ok ? 1 : sec <= 4 ? 4 : sec <= 10 ? 3 : 2;
        bs.forEach((b, n) => { b.disabled = true; if (opts[n] === answer) b.classList.add('right'); else if (n === j) b.classList.add('wrong'); });
        S.srs[k] = srsNext(s, g); count++; addXp(g >= 2 ? XP_ITEM : 0, code);
        back.hidden = false; say(code, sayText);
        verdict.replaceChildren(h('div', {
          class: 'feedback ' + (ok ? 'ok' : 'no'),
          style: { margin: 0, padding: '8px 12px', textAlign: 'center', borderRadius: '10px' }
        }, h('strong', {}, ok ? 'Chính xác!' : 'Chưa đúng.'), ' · ' + (ok ? 'Ôn lại sau ' + ivText(S.srs[k]) : 'Ôn lại ngay hôm nay')));
        wrongFlag = !ok;
        topDock.hidden = false;
        contTop.focus();
      } }, h('span', { class: 'kbd', 'aria-hidden': 'true' }, j + 1), h('span', { class: 'grow' }, o)));

      return mount(h('div', { class: 'stack-lg' }, head(true), topBar,
        topDock,
        h('div', { class: 'panel card' },
          h('p', { class: 'small muted' }, it.v ? 'Chọn nghĩa đúng' : 'Chọn âm Hán Việt đúng'),
          front,
          h('div', { class: 'listen' }, spk(code, sayText, { cls: 'big' })),
          back
        ),
        h('div', { class: 'options' }, bs)
      ));
    }

    // 2. LUYỆN NÓI
    if (item.skill === 'speak') {
      const it = (item.it && item.it.it) || item.it || {};
      const targetText = it.text || item.id;
      const wordsBox = h('div', { class: 'words', lang: L().lang, style: { fontSize: code === 'en' ? '1.4rem' : '1.8rem', justifyContent: 'center' } }, it.raw ? ruby(it.raw) : plain(targetText));
      const resultBox = h('div', { class: 'stack center', style: { gap: '4px', minHeight: '40px' } });
      const verdict = h('div', { 'aria-live': 'assertive' });
      let wrongFlag = false;
      const onNext = () => {
        queue.shift();
        if (wrongFlag) queue.push(item);
        show();
      };
      const contTop = h('button', {
        class: 'primary block next-btn',
        style: { fontSize: '1.05rem', fontWeight: '700', padding: '12px 16px', borderRadius: '12px' },
        onclick: onNext
      }, 'Tiếp theo ➔');
      const topDock = h('div', { class: 'stack', style: { gap: '8px' }, hidden: true }, contTop, verdict);

      const finishSpeak = (g, ok, scoreText) => {
        S.srs[k] = srsNext(s, g);
        count++;
        addXp(ok ? XP_ITEM : 0, code);
        verdict.replaceChildren(h('div', {
          class: 'feedback ' + (ok ? 'ok' : 'no'),
          style: { margin: 0, padding: '8px 12px', textAlign: 'center', borderRadius: '10px' }
        }, h('strong', {}, ok ? 'Đạt yêu cầu!' : 'Chưa đạt.'), ' · ' + (scoreText ? scoreText + ' · ' : '') + (ok ? 'Ôn lại sau ' + ivText(S.srs[k]) : 'Ôn lại sớm')));
        wrongFlag = !ok;
        topDock.hidden = false;
        contTop.focus();
      };

      const ctrl = micControl(code, (said) => {
        const a = align(code, targetText, said);
        wordsBox.replaceChildren(...a.units.map((w, idx) => h('span', { class: a.hit[idx] ? 'hit' : 'miss' }, w)));
        const ok = a.score >= 70;
        const g = a.score >= 90 ? 4 : a.score >= 70 ? 3 : a.score >= 50 ? 2 : 1;
        resultBox.replaceChildren(
          h('div', { class: 'score', style: { color: ok ? 'var(--good)' : 'var(--ink)' } }, a.score + '%'),
          h('p', { class: 'center small muted', lang: L().lang }, 'Máy nghe được: “' + said + '”'),
          h('div', { class: 'ielts-tip-box', style: { margin: '6px 0 0 0', padding: '6px 10px', fontSize: '.82rem', borderRadius: '8px', textAlign: 'left' } },
            h('p', { style: { margin: 0, color: '#b45309', fontWeight: 500 } }, getTipForStep({ type: 'speak' }, code))
          )
        );
        finishSpeak(g, ok, 'Điểm phát âm ' + a.score + '%');
      }, (selfGrade) => {
        finishSpeak(selfGrade >= 3 ? 3 : 1, selfGrade >= 3, 'Tự đánh giá');
      }, [['Chưa tốt', 1], ['Tạm ổn', 2], ['Nói tốt', 3]]);

      return mount(h('div', { class: 'stack-lg' }, head(true), topBar,
        topDock,
        h('div', { class: 'panel card stack center', style: { gap: '10px' } },
          h('p', { class: 'small muted' }, 'Bấm Micro và nói lại câu này theo phương pháp lặp lại ngắt quãng:'),
          wordsBox,
          it.r && it.r !== targetText ? h('p', { class: code === 'en' ? 'ipa' : 'read', style: { margin: 0, textAlign: 'center' } }, it.r) : null,
          it.m ? h('p', { class: 'small muted center', style: { fontSize: '1.05rem', margin: 0 } }, it.m) : null,
          h('div', { class: 'listen', style: { justifyContent: 'center' } }, spk(code, targetText, { cls: 'big' })),
          ctrl,
          resultBox
        )
      ));
    }

    // 3. LUYỆN VIẾT
    if (item.skill === 'write') {
      const c = item.id;
      const hint = item.it.hint || charHint(code, c);
      const wbox = h('div', { class: 'charbox', style: { margin: '0 auto' } });
      const info = h('p', { class: 'small muted center' }, 'Đang tải nét chữ…');
      const verdict = h('div', { 'aria-live': 'assertive' });
      let wrongFlag = false;
      const onNext = () => {
        queue.shift();
        if (wrongFlag) queue.push(item);
        show();
      };
      const contTop = h('button', {
        class: 'primary block next-btn',
        style: { fontSize: '1.05rem', fontWeight: '700', padding: '12px 16px', borderRadius: '12px' },
        onclick: onNext
      }, 'Tiếp theo ➔');
      const topDock = h('div', { class: 'stack', style: { gap: '8px' }, hidden: true }, contTop, verdict);

      const finishWrite = (g, ok, note) => {
        S.srs[k] = srsNext(s, g);
        count++;
        addXp(ok ? XP_ITEM : 0, code);
        verdict.replaceChildren(h('div', {
          class: 'feedback ' + (ok ? 'ok' : 'no'),
          style: { margin: 0, padding: '8px 12px', textAlign: 'center', borderRadius: '10px' }
        }, h('strong', {}, ok ? 'Đạt nét chữ!' : 'Chưa đạt.'), ' · ' + (note ? note + ' · ' : '') + (ok ? 'Ôn lại sau ' + ivText(S.srs[k]) : 'Ôn lại sớm')));
        wrongFlag = !ok;
        topDock.hidden = false;
        contTop.focus();
      };

      setTimeout(async () => {
        const strokes = await loadStrokes(code);
        const data = strokes[c];
        if (!data || !window.HanziWriter) {
          info.replaceChildren(
            h('p', {}, 'Chữ: ', h('b', { lang: LANGS[code].lang }, c), (hint ? ' (' + hint + ')' : '')),
            h('div', { class: 'row center', style: { gap: '8px' } },
              h('button', { class: 'mini', onclick: () => finishWrite(3, true, 'Đã nhớ chữ') }, 'Tôi đã nhớ chữ này'),
              h('button', { class: 'mini ghost', onclick: () => finishWrite(1, false, 'Cần ôn lại') }, 'Chưa nhớ')
            )
          );
          return;
        }
        const size = Math.min(260, window.innerWidth - 64);
        const writer = HanziWriter.create(wbox, c, {
          width: size, height: size, padding: 12, showCharacter: false, showOutline: false,
          strokeColor: getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#222',
          outlineColor: guideColor(),
          drawingColor: getComputedStyle(document.documentElement).getPropertyValue('--teal').trim() || '#0f5257',
          charDataLoader: (ch, ok) => ok(data)
        });
        info.textContent = 'Hãy nhớ chữ và viết từng nét vào ô (không nét mờ)';
        writer.quiz({
          showHintAfterMisses: 2,
          onComplete: (res) => {
            const ok = res.totalMistakes <= 3;
            info.textContent = ok ? 'Hoàn thành tốt! (Sai ' + res.totalMistakes + ' lần)' : 'Hoàn thành nhưng sai ' + res.totalMistakes + ' lần.';
            finishWrite(ok ? (res.totalMistakes === 0 ? 4 : 3) : 1, ok);
          }
        });
      }, 50);

      return mount(h('div', { class: 'stack-lg' }, head(true), topBar,
        topDock,
        h('div', { class: 'panel card stack center', style: { gap: '10px' } },
          h('p', { class: 'small muted' }, 'Tập viết chữ theo phương pháp lặp lại ngắt quãng:'),
          h('div', { class: 'row center', style: { gap: '8px', alignItems: 'center' } },
            h('span', { class: 'chip good', lang: LANGS[code].lang, style: { fontSize: '1.2rem', padding: '4px 14px' } }, c),
            hint ? h('b', {}, hint) : null,
            spk(code, c)
          ),
          wbox,
          info,
          h('div', { class: 'row center', style: { gap: '8px' } },
            h('button', { class: 'ghost mini', onclick: () => finishWrite(3, true, 'Đã viết xong') }, 'Đã viết trên giấy (Đạt)'),
            h('button', { class: 'ghost mini', onclick: () => finishWrite(1, false, 'Chưa nhớ nét') }, 'Chưa nhớ nét (Ôn lại)')
          )
        )
      ));
    }

    // 4. NGỮ PHÁP
    if (item.skill === 'gram') {
      const p = item.it;
      let g = p.g || (DATA[code].grammar && DATA[code].grammar[p.gid]);
      let q = null;
      if (code === 'en') {
        const v = p.v;
        if (!v || !v.ex) { queue.shift(); show(); return; }
        const plainWord = plain(v.w);
        const tokens = tokensOf('en', v.ex);
        const allWords = (DATA.en.topics || []).flatMap((t) => t.vocab || []);
        const isCloze = Math.random() < 0.5;
        const regexW = new RegExp('\\b' + plainWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
        if (isCloze && regexW.test(v.ex)) {
          const dist = sample(allWords.filter((w) => w.id !== v.id && w.w && plain(w.w) !== plainWord), 3).map((w) => plain(w.w));
          q = {
            type: 'cloze',
            label: 'Điền từ đúng vào cấu trúc câu',
            prompt: v.ex.replace(regexW, '＿＿＿＿＿＿'),
            hint: v.exm || v.m,
            answer: plainWord,
            opts: shuffle([plainWord, ...dist]),
            e: [v.ex, v.exr || '', v.exm || '']
          };
        } else {
          let bank = shuffle(tokens.map((t, k) => ({ t, k })));
          for (let n = 0; n < 6 && bank.every((b, i) => b.k === i); n++) bank = shuffle(bank);
          q = {
            type: 'order',
            label: 'Sắp xếp các từ thành câu đúng',
            prompt: v.exm || ('Câu có từ “' + plainWord + '” (' + v.m + ')'),
            bank,
            answer: tokens.join(' '),
            e: [v.ex, v.exr || '', v.exm || '']
          };
        }
        g = {
          t: 'Cấu trúc câu: ' + (v.d || plainWord),
          f: v.w + ' (' + v.m + ')',
          notes: v.d ? [v.d] : []
        };
      } else {
        if (!g) {
          queue.shift(); show(); return;
        }
        const all = grammarPoints(code);
        const pool = [...new Set(all.flatMap((x) => gqKeywords(x.g)))];
        q = gqMake(p, all, pool) || {
          type: 'cloze', p, e: g.ex[0], label: 'Điền từ đúng',
          prompt: g.ex[0][0], hint: g.ex[0][2], answer: gqKeywords(g)[0] || '', opts: [gqKeywords(g)[0] || '', 'không', 'đã', 'sẽ']
        };
      }

      const langAttr = LANGS[code].lang;
      let done = false;
      let wrongFlag = false;
      const onNext = () => {
        queue.shift();
        if (wrongFlag) queue.push(item);
        show();
      };
      const contTop = h('button', {
        class: 'primary block next-btn',

function renderListenSkills(code, d) {
  const pick = topicPicker(code, LISTEN_TOPIC, () => skillsView('listen'));
  const t = d.topics.find((x) => x.id === LISTEN_TOPIC[code]) || d.topics[0];
  const vocabsWithEx = (t.vocab || []).filter((v) => v.ex);
  
  let isPlayingAll = false;
  let playIndex = 0;
  let playTimeout = null;

  const playAllBtn = h('button', {
    class: 'primary block',
    style: { margin: '4px 0 8px 0', fontSize: '.95rem', fontWeight: 600, padding: '10px 14px', borderRadius: '12px' },
    onclick: () => {
      if (isPlayingAll) {
        isPlayingAll = false;
        if (playTimeout) clearTimeout(playTimeout);
        playAllBtn.textContent = '🔊 Tắm ngôn ngữ · Phát toàn bộ câu bài này (' + vocabsWithEx.length + ' câu)';
        playAllBtn.classList.remove('accent');
        playAllBtn.classList.add('primary');
        return;
      }
      if (!vocabsWithEx.length) { toast('Chủ đề này chưa có câu ví dụ.'); return; }
      isPlayingAll = true;
      playIndex = 0;
      playAllBtn.classList.remove('primary');
      playAllBtn.classList.add('accent');

      function playNext() {
        if (!isPlayingAll) return;
        if (playIndex >= vocabsWithEx.length) {
          isPlayingAll = false;
          playAllBtn.textContent = '🔊 Tắm ngôn ngữ · Phát toàn bộ câu bài này (' + vocabsWithEx.length + ' câu)';
          playAllBtn.classList.remove('accent');
          playAllBtn.classList.add('primary');
          toast('Đã phát xong toàn bộ câu trong chủ đề!');
          return;
        }
        const v = vocabsWithEx[playIndex];
        playAllBtn.textContent = '⏹ Đang phát câu ' + (playIndex + 1) + '/' + vocabsWithEx.length + ' (Bấm để dừng)';
        say(code, v.ex);
        playIndex++;
        playTimeout = setTimeout(playNext, 3800);
      }
      playNext();
    }
  }, '🔊 Tắm ngôn ngữ · Phát toàn bộ câu bài này (' + vocabsWithEx.length + ' câu)');

  let hideEnglish = false;
  const toggleTextBtn = h('button', {
    class: 'ghost mini',
    style: { fontSize: '.8rem', padding: '6px 12px' },
    onclick: () => {
      hideEnglish = !hideEnglish;
      toggleTextBtn.textContent = hideEnglish ? '👁️ Hiện chữ tiếng Anh' : '🙈 Ẩn chữ (Nghe chay)';
      const exTexts = document.querySelectorAll('.listen-ex-text');
      exTexts.forEach((el) => {
        el.style.opacity = hideEnglish ? '0' : '1';
      });
    }
  }, '🙈 Ẩn chữ (Nghe chay)');

  return [
    h('div', { class: 'stack', style: { gap: '8px' } },
      pick,
      h('div', { class: 'panel card stack', style: { gap: '8px', background: 'var(--surface)', borderRadius: '12px', padding: '12px 14px' } },
        h('div', { class: 'row between', style: { alignItems: 'center' } },
          h('b', { style: { fontSize: '1rem', color: 'var(--teal)' } }, '🎧 Ôn tập kỹ năng Nghe'),
          toggleTextBtn
        ),
        h('p', { class: 'small muted', style: { margin: 0 } }, 'Luyện nghe phản xạ câu bài học: Tắm ngôn ngữ tự động phát liên tục hoặc ẩn chữ để luyện nghe chay.'),
        playAllBtn
      )
    ),
    h('div', { class: 'stack', style: { gap: '10px' } },
      h('h3', { style: { margin: '6px 0 0 0' } }, '🎧 Các câu luyện nghe trong bài học'),
      ...vocabsWithEx.map((v, idx) => {
        return h('div', { class: 'panel', style: { padding: '12px 14px', borderRadius: '12px', display: 'flex', flexDirection: 'column', gap: '6px' } },
          h('div', { class: 'row between', style: { alignItems: 'flex-start', gap: '10px' } },
            h('div', { class: 'stack', style: { gap: '4px', flex: 1, minWidth: 0 } },
              h('div', { class: 'row', style: { gap: '6px', alignItems: 'center', flexWrap: 'wrap' } },
                h('span', { class: 'chip good', style: { fontSize: '.72rem' } }, '#' + (idx + 1)),
                h('span', { class: 'chip', style: { fontSize: '.75rem', fontWeight: 600 } }, plain(v.w))
              ),
              h('p', { class: 'listen-ex-text', lang: 'en', style: { fontSize: '1.02rem', fontWeight: 600, margin: '2px 0', lineHeight: 1.45, transition: 'opacity .2s' } }, v.ex),
              v.exm ? h('p', { class: 'small muted', style: { margin: 0 } }, v.exm) : null
            ),
            h('div', { class: 'row', style: { gap: '6px', flex: 'none', alignItems: 'center' } },
              spk(code, v.ex, { cls: 'big' }),
              spk(code, v.ex, { slow: true, cls: 'big' })
            )
          )
        );
      })
    ),
    h('div', { class: 'stack', style: { gap: '8px', marginTop: '12px' } },
      h('h3', { style: { margin: '6px 0 0 0' } }, 'Từ vựng & Phát âm trong bài'),
      h('div', { class: 'stack', style: { gap: '6px' } },
        ...(t.vocab || []).map((v) => h('div', { class: 'panel row between', style: { alignItems: 'center', padding: '10px 14px', borderRadius: '12px' } },
          h('div', { class: 'stack', style: { gap: '2px', minWidth: 0 } },
            h('div', { class: 'row', style: { gap: '8px', alignItems: 'center' } },
              h('b', { lang: 'en', style: { fontSize: '.98rem' } }, plain(v.w)),
              v.r ? h('span', { class: 'ipa small', style: { color: 'var(--teal)' } }, v.r) : null
            ),
            h('span', { class: 'small muted' }, v.m)
          ),
          h('div', { class: 'row', style: { gap: '4px', flex: 'none' } },
            spk(code, v.w),
            spk(code, v.w, { slow: true })
          )
        ))
      )
    )
  ];
}

// ===== Luyện Đọc (Chỉ chứa nội dung bài học, không có IELTS/tips) =====
function renderReadSkills(code, d) {
  const pick = topicPicker(code, READ_TOPIC, () => skillsView('read'));
  const t = d.topics.find((x) => x.id === READ_TOPIC[code]) || d.topics[0];
  const quizzes = t.quiz || [];
  const vocabsWithEx = (t.vocab || []).filter((v) => v.ex);
  const dialogues = getTopicDialogues(code, t);
  const curDialogue = dialogues[0];

  // Khung Đọc Hiểu Đoạn Hội Thoại / Email Bài Học
  let readingDialogueEl = null;
  if (curDialogue && curDialogue.lines.length) {
    const fullText = curDialogue.lines.map((ln) => ln.name + ': ' + ln.text).join('\n');
    readingDialogueEl = h('div', { class: 'panel card stack', style: { gap: '10px', background: 'var(--surface)', borderRadius: '14px', padding: '14px' } },
      h('div', { class: 'row between', style: { alignItems: 'center' } },
        h('h3', { style: { margin: 0, fontSize: '1.05rem', color: 'var(--teal)' } }, '📖 Bài đọc hội thoại: ' + curDialogue.title),
        spk(code, fullText)
      ),
      h('div', { class: 'stack', style: { gap: '8px', background: 'var(--sunk)', padding: '12px', borderRadius: '10px' } },
        ...curDialogue.lines.map((ln) => h('div', { class: 'stack', style: { gap: '2px' } },
          h('div', { class: 'row', style: { gap: '6px', alignItems: 'baseline' } },
            h('b', { style: { color: ln.speaker === 'A' ? 'var(--teal)' : '#b45309', fontSize: '.88rem' } }, ln.name + ':'),
            h('span', { lang: LANGS[code].lang, style: { fontSize: '1rem', fontWeight: 600 } }, ln.raw ? ruby(ln.raw) : plain(ln.text))
          ),
          ln.r ? h('span', { class: code === 'en' ? 'ipa small' : 'read small', style: { color: 'var(--muted)', marginLeft: '14px' } }, ln.r) : null,
          ln.m ? h('span', { class: 'small muted', style: { marginLeft: '14px' } }, ln.m) : null
        ))
      ),
      h('details', {},
        h('summary', { class: 'small muted', style: { cursor: 'pointer', fontWeight: 600 } }, 'Xem tóm tắt bản dịch toàn bài'),
        h('p', { class: 'small muted', style: { margin: '6px 0 0 0', lineHeight: 1.5 } }, curDialogue.lines.map((ln) => ln.name + ': ' + ln.m).join(' / '))
      )
    );
  }

  // Câu hỏi đọc hiểu tình huống bài học (t.quiz hoặc trắc nghiệm hội thoại)
  const effectiveQuizzes = quizzes.length > 0 ? quizzes : (() => {
    if (!curDialogue || curDialogue.lines.length < 2) return [];
    const l1 = curDialogue.lines[0], l2 = curDialogue.lines[1];
    return [
      {
        q: (code === 'en' ? 'What is the main topic of the conversation?' : code === 'zh' ? '这段对话的主要内容是什么？' : 'この会話の主な話題は何ですか？'),
        o: [
          curDialogue.title,
          code === 'en' ? 'Discussing tomorrow schedule' : code === 'zh' ? '讨论明天的日程' : '明日の予定を話す',
          code === 'en' ? 'Ordering food at a restaurant' : code === 'zh' ? '在餐厅点餐' : 'レストランで注文する'
        ],
        a: 0,
        why: 'Đoạn hội thoại xoay quanh chủ đề chính: ' + curDialogue.title
      },
      {
        q: (code === 'en' ? 'Who speaks first in the dialogue?' : code === 'zh' ? '谁先开口说话？' : '誰が最初に話しましたか？'),
        o: [l1.name, l2.name, code === 'en' ? 'Both at the same time' : 'Cả hai cùng lúc'],
        a: 0,
        why: l1.name + ' là nhân vật mở đầu đoạn hội thoại với câu: “' + l1.text + '”.'
      }
    ];
  })();

  const quizEls = effectiveQuizzes.map((q, qIdx) => {
    const fbBox = h('div', { style: { marginTop: '8px' } });
    let answered = false;

    const optBtns = (q.o || []).map((optText, optIdx) => {
      const btn = h('button', {
        class: 'ghost block',
        style: { textAlign: 'left', padding: '10px 14px', fontSize: '.92rem', borderRadius: '10px', margin: '4px 0' },
        onclick: () => {
          if (answered) return;
          answered = true;
          const isRight = optIdx === q.a;
          optBtns.forEach((b, idx) => {
            b.disabled = true;
            if (idx === q.a) b.classList.add('good', 'right');
            else if (idx === optIdx) b.classList.add('wrong');
          });
          fbBox.replaceChildren(
            h('div', { class: 'feedback ' + (isRight ? 'ok' : 'no'), style: { margin: 0, padding: '8px 12px', borderRadius: '8px' } },
              h('strong', {}, isRight ? 'Chính xác!' : 'Chưa đúng.'),
              q.why ? ' ' + q.why : ''
            )
          );
        }
      }, h('span', { style: { fontWeight: 600, marginRight: '6px' } }, (optIdx + 1) + '.'), optText);
      return btn;
    });

    return h('div', { class: 'panel stack', style: { gap: '6px', borderRadius: '12px' } },
      h('div', { class: 'row between', style: { alignItems: 'flex-start', gap: '8px' } },
        h('div', { class: 'stack', style: { gap: '4px', flex: 1 } },
          h('span', { class: 'chip accent', style: { fontSize: '.72rem', alignSelf: 'flex-start' } }, 'Câu hỏi #' + (qIdx + 1)),
          h('p', { lang: LANGS[code].lang, style: { fontWeight: 600, fontSize: '.98rem', margin: '2px 0', lineHeight: 1.45 } }, q.q)
        ),
        spk(code, q.q)
      ),
      h('div', { class: 'stack', style: { gap: '2px' } }, ...optBtns),
      fbBox
    );
  });

  return [
    h('div', { class: 'stack', style: { gap: '8px' } },
      pick,
      h('div', { class: 'panel card stack', style: { gap: '6px', background: 'var(--surface)', borderRadius: '12px', padding: '12px 14px' } },
        h('h3', { style: { margin: 0, fontSize: '1.05rem', color: 'var(--teal)' } }, '📖 Ôn tập kỹ năng Đọc'),
        h('p', { class: 'small muted', style: { margin: 0 } }, 'Đọc hiểu đoạn hội thoại tình huống bài học kèm audio và làm bài trắc nghiệm kiểm tra độ hiểu có giải thích chi tiết.')
      )
    ),
    readingDialogueEl,
    quizEls.length > 0 ? h('div', { class: 'stack', style: { gap: '10px' } },
      h('h3', { style: { margin: '6px 0 0 0' } }, '🎯 Trắc nghiệm kiểm tra độ hiểu bài đọc'),
      ...quizEls
    ) : null,
    vocabsWithEx.length > 0 ? h('div', { class: 'stack', style: { gap: '8px', marginTop: '12px' } },
      h('h3', { style: { margin: '6px 0 0 0' } }, '📖 Đọc các câu ví dụ ngữ cảnh từ vựng'),
      ...vocabsWithEx.map((v) => h('div', { class: 'panel stack', style: { gap: '4px', borderRadius: '12px' } },
        h('div', { class: 'row between', style: { alignItems: 'center' } },
          h('b', { class: 'chip good', style: { fontSize: '.78rem' } }, plain(v.w)),
          spk(code, v.ex)
        ),
        h('p', { lang: LANGS[code].lang, style: { fontWeight: 600, margin: '2px 0' } }, v.ex),
        v.exr ? h('p', { class: code === 'en' ? 'ipa small' : 'read small', style: { margin: 0, color: 'var(--teal)' } }, v.exr) : null,
        v.exm ? h('p', { class: 'small muted', style: { margin: 0 } }, v.exm) : null
      ))
    ) : null
  ];
}

function skillsView(tab) {
  if (tab) SKILL_TAB = tab;
  VIEW = 'skills';
  setTabs(true);
  const code = S.lang, d = DATA[code];
  
  if (!['listen', 'speak', 'read', 'write'].includes(SKILL_TAB)) {
    SKILL_TAB = 'listen';
  }

  const curTopicId = (
    SKILL_TAB === 'listen' ? LISTEN_TOPIC[code] :
    SKILL_TAB === 'speak' ? SPEAK_TOPIC[code] :
    SKILL_TAB === 'read' ? READ_TOPIC[code] :
    WRITE_TOPIC[code]
  );
  const t = d.topics.find((x) => x.id === curTopicId) || d.topics[0];

  const skillTabsDef = [
    ['listen', '🎧 Nghe'],
    ['speak', '🎙️ Nói'],
    ['read', '📖 Đọc'],
    ['write', '✍️ Viết']
  ];

  const navSub = h('div', { class: 'skill-tabs', role: 'tablist' },
    ...skillTabsDef.map(([skKey, skLabel]) => h('button', {
      class: 'skill-tab-btn' + (SKILL_TAB === skKey ? ' active' : ''),
      role: 'tab',
      'aria-selected': String(SKILL_TAB === skKey),
      onclick: () => { SKILL_TAB = skKey; skillsView(); }
    }, skLabel))
  );

  const head = h('div', { class: 'stack', style: { gap: '6px' } },
    h('div', { class: 'row between', style: { alignItems: 'center' } },
      h('h1', { style: { margin: 0 } }, 'Kỹ năng'),
      h('div', { class: 'row', style: { gap: '6px', alignItems: 'center' } },
        feedbackBtn({ mode: SKILL_TAB, topicId: t.id, topicTitle: t.sub || t.title }),
        langSwitch()
      )
    ),
    navSub
  );

  let bodyElements = [];
  if (SKILL_TAB === 'listen') bodyElements = renderListenSkills(code, d);
  else if (SKILL_TAB === 'speak') bodyElements = renderSpeakSkills(code, d);
  else if (SKILL_TAB === 'read') bodyElements = renderReadSkills(code, d);
  else bodyElements = renderWriteSkills(code, d);

  mount(h('div', { class: 'stack-lg' },
    head,
    ...bodyElements.filter(Boolean)
  ));
}

function listenView() {
  SKILL_TAB = 'listen';
  VIEW = 'skills';
  skillsView('listen');
}

function speakView() {
  SKILL_TAB = 'speak';
  VIEW = 'skills';
  skillsView('speak');
}

function readView() {
  SKILL_TAB = 'read';
  VIEW = 'skills';
  skillsView('read');
}

function writeView() {
  SKILL_TAB = 'write';
  VIEW = 'skills';
  skillsView('write');

const KANA_H = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもや_ゆ_よらりるれろわ___をん____';
const KANA = { hira: [...KANA_H], kata: [...KANA_H].map((c) => c === '_' ? c : String.fromCharCode(c.charCodeAt(0) + 96)) };
const ROMA = 'a i u e o ka ki ku ke ko sa shi su se so ta chi tsu te to na ni nu ne no ha hi fu he ho ma mi mu me mo ya _ yu _ yo ra ri ru re ro wa _ _ _ wo n _ _ _ _'.split(' ');
function charHint(code, c) {
  if (code === 'zh') { const i = DATA.zh.chars[c]; return i && i.hv ? i.hv : ''; }
  const k = DATA.ja.topics.flatMap((t) => t.kanji || []).find((x) => x.k === c); if (k) return k.hv;
  let i = KANA.hira.indexOf(c); if (i < 0) i = KANA.kata.indexOf(c); return i >= 0 ? ROMA[i] : '';
}
// Màu chữ mờ để đồ nét: trộn màu chữ với màu nền (hex đặc, không dùng độ trong suốt) cho đủ thấy ở cả giao diện sáng và tối
function guideColor() {
  const css = getComputedStyle(document.documentElement);
  const rgb = (v, d) => { const m = /^#?([0-9a-f]{6})$/i.exec(css.getPropertyValue(v).trim()); if (!m) return d; const n = parseInt(m[1], 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
  const a = rgb('--ink', [27, 42, 44]), b = rgb('--surface', [255, 255, 255]);
  return '#' + a.map((x, i) => Math.round(x * 0.28 + b[i] * 0.72).toString(16).padStart(2, '0')).join('');
}
function charView(code, c, list) {
  const idx = list.indexOf(c), box = h('div', { class: 'charbox' });
  const status = h('p', { class: 'center small muted', 'aria-live': 'polite' }, 'Đang tải nét chữ…');
  const strokeBadge = h('span', { class: 'chip good', style: { marginLeft: '8px', fontSize: '.85rem', verticalAlign: 'middle' }, hidden: true });
  const strokeStepBadge = h('div', { class: 'center', style: { minHeight: '32px', margin: '4px 0' } },
    h('span', { class: 'chip', style: { fontSize: '1rem', fontWeight: 700, padding: '3px 14px' } }, 'Tập viết (không có nét mờ)')
  );
  const stepLabel = strokeStepBadge.firstChild;
  let writer = null, totalStrokes = 0, isAnimating = false, blindMode = true;

  const toggleOutlineBtn = h('button', { class: 'ghost mini', onclick: () => {
    blindMode = !blindMode;
    toggleOutlineBtn.textContent = blindMode ? 'Hiện nét mờ' : 'Ẩn nét mờ';
    quiz(blindMode);
  } }, 'Hiện nét mờ');

  const again = h('button', { onclick: () => quiz(true) }, 'Viết lại');

  const quiz = (blind) => {
    if (!writer) return;
    isAnimating = false;
    blindMode = blind;
    toggleOutlineBtn.textContent = blind ? 'Hiện nét mờ' : 'Ẩn nét mờ';
    blind ? writer.hideOutline() : writer.showOutline();
    stepLabel.className = 'chip ' + (blind ? '' : 'good');
    stepLabel.textContent = blind ? 'Tập viết (không có nét mờ)' : 'Tập viết (có nét mờ)';
    const strokeInfo = totalStrokes ? ' (' + totalStrokes + ' nét)' : '';
    status.textContent = blind
      ? 'Tập viết không có nét mờ' + strokeInfo + ': Nhớ chữ rồi viết từng nét vào ô. Bấm “Xem thứ tự nét” nếu cần xem lại.'
      : 'Đồ theo chữ mờ' + strokeInfo + ': Viết từng nét vào ô. Bấm “Xem thứ tự nét” nếu cần xem cách viết.';
    writer.quiz({
      showHintAfterMisses: 2,
      onMistake: (s) => {
        const cur = (s && s.strokeNum != null) ? s.strokeNum + 1 : '?';
        status.replaceChildren(
          h('span', { style: { color: 'var(--bad)', fontWeight: 600 } }, 'Sai nét ' + cur + (totalStrokes ? '/' + totalStrokes : '') + '. '),
          h('span', { class: 'small muted' }, 'Hãy thử lại nét này!')
        );
      },
      onCorrectStroke: (s) => {
        const cur = (s && s.strokeNum != null) ? s.strokeNum + 1 : '?';
        stepLabel.className = 'chip good';
        stepLabel.textContent = 'Đúng nét ' + cur + (totalStrokes ? ' / ' + totalStrokes : '');
        status.replaceChildren(
          h('span', { class: 'chip good', style: { fontSize: '.85rem', padding: '2px 8px', marginRight: '6px' } }, 'Nét ' + cur + (totalStrokes ? '/' + totalStrokes : '')),
          h('span', { class: 'small muted' }, s.strokesRemaining > 0 ? 'Đúng rồi! Còn ' + s.strokesRemaining + ' nét nữa.' : 'Đã hoàn thành nét cuối!')
        );
      },
      onComplete: (s) => {
        const k = sid(code, c);
        S.written[k] = (S.written[k] || 0) + 1;
        srsRate(code + ':write:' + c, s.totalMistakes <= 3);
        addXp(XP_ITEM, code);
        checkAch();
        stepLabel.className = 'chip good';
        stepLabel.textContent = 'Hoàn thành ' + (totalStrokes ? totalStrokes + ' nét' : '!');
        status.textContent = (s.totalMistakes === 0 ? 'Hoàn hảo! Viết đúng cả ' + (totalStrokes ? totalStrokes + ' ' : '') + 'nét không sai lần nào.' : 'Xong cả ' + (totalStrokes ? totalStrokes + ' ' : '') + 'nét! Sai ' + s.totalMistakes + ' lần.') + ' Bấm “Viết lại” để thử viết lại.';
      }
    });
  };

  const playStrokeAnimation = () => {
    if (!writer) return;
    writer.cancelQuiz();
    isAnimating = true;
    writer.showOutline();
    stepLabel.className = 'chip good';
    stepLabel.textContent = 'Nét 1' + (totalStrokes ? ' / ' + totalStrokes : '');
    status.textContent = 'Đang chạy thứ tự nét: Nét 1' + (totalStrokes ? '/' + totalStrokes : '') + '...';

    if (writer._renderState) {
      const orig = writer._renderState._onStateChange;
      let lastS = -1;
      writer._renderState._onStateChange = (nextState, prevState) => {
        orig.call(writer._renderState, nextState, prevState);
        if (isAnimating) {
          const strokes = nextState && nextState.character && nextState.character.main && nextState.character.main.strokes;

  };

function renderKnowledgeGrammar(code) {
  const isJa = code === 'ja';
  const langAttr = LANGS[code].lang;
  const lvs = GRAM_LEVELS[code] || [];
  const pts = grammarPoints(code);
  const st = gqStore();
  const sel = GQ[code] || 'all';
  const qText = (GQ_SEARCH[code] || '').trim().toLowerCase();

  const matchQuery = (x) => {
    if (!qText) return true;
    const haystack = [
      x.g.t, x.g.zh, x.g.f, ...(x.g.notes || []),
      ...x.g.ex.flatMap(e => [e[0], e[1], e[2]]),
      x.topics.map(t => (t.sub || t.title)).join(' ')
    ].join(' ').toLowerCase();
    return haystack.includes(qText);
  };

  const shown = pts.filter((x) => (sel === 'all' || x.lv === sel) && matchQuery(x));
  const count = (lv) => pts.filter((x) => x.lv === lv).length;
  const nWrong = pts.filter((x) => (sel === 'all' || x.lv === sel) && st.wrong[x.gid]).length;
  const bestVal = st.best[code + ':' + sel] != null ? st.best[code + ':' + sel] : (code === 'zh' ? st.best[sel] : null);
  const chip = (key, label) => h('button', {
    class: 'mini' + (sel === key ? ' primary' : ' ghost'),
    'aria-pressed': String(sel === key),
    onclick: () => { GQ[code] = key; knowledgeTabView(); }
  }, label);

  const toggleAll = () => {
    const details = document.querySelectorAll('.stack-lg details.gram');
    const anyClosed = [...details].some((d) => !d.open);
    details.forEach((d) => { d.open = anyClosed; });
    const btn = document.getElementById('toggle-gram-btn');
    if (btn) btn.textContent = anyClosed ? 'Thu gọn tất cả' : 'Mở tất cả';
  };

  return h('div', { class: 'stack-lg', style: { gap: '12px' } },
    h('div', { class: 'row', style: { gap: '8px', alignItems: 'center' } },
      h('input', {
        type: 'search',
        class: 'gram-search-input',
        style: { flex: 1, minHeight: '44px', padding: '10px 14px' },
        placeholder: isJa ? '🔍 Tìm kiếm ngữ pháp N5–N1, từ khóa, ví dụ...' : '🔍 Tìm kiếm ngữ pháp HSK 1–6, từ khóa, ví dụ...',
        value: GQ_SEARCH[code] || '',
        oninput: (e) => {
          GQ_SEARCH[code] = e.target.value;
          knowledgeTabView();
          const el = document.querySelector('.gram-search-input');
          if (el) { el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
        }
      }),
      GQ_SEARCH[code] ? h('button', { class: 'ghost mini', onclick: () => { GQ_SEARCH[code] = ''; knowledgeTabView(); } }, 'Xóa tìm') : null
    ),
    h('div', { class: 'row', style: { flexWrap: 'wrap', gap: '6px' } },
      chip('all', 'Tất cả (' + pts.length + ')'),
      ...lvs.filter((lv) => count(lv)).map((lv) => chip(lv, (isJa ? lv : lv.replace('HSK ', '')) + ' (' + count(lv) + ')'))
    ),
    h('div', { class: 'panel stack', style: { background: 'var(--surface)', borderRadius: '12px', padding: '14px' } },
      h('h2', { style: { margin: 0, fontSize: '1.05rem' } }, '🎯 Luyện Quiz Ngữ Pháp'),
      srsDueItems(code, 'gram').length > 0 ? h('button', {
        class: 'accent block',
        onclick: () => { REVIEW_SKILL = 'gram'; go('review'); }
      }, '📖 Ôn tập ngắt quãng: Có ' + srsDueItems(code, 'gram').length + ' điểm ngữ pháp cần ôn hôm nay') : null,
      h('p', { class: 'small muted', style: { margin: '4px 0 8px 0' } }, '10 câu trắc nghiệm: điền từ đúng vào cấu trúc câu hoặc sắp xếp từ.' + (bestVal != null ? ' Điểm cao nhất: ' + bestVal + '/10.' : '')),
      h('div', { class: 'row', style: { gap: '8px' } },
        h('button', { class: 'primary grow', onclick: () => grammarQuizView(sel, false) }, 'Làm quiz · ' + (sel === 'all' ? 'Tất cả cấp' : sel)),
        nWrong > 0 ? h('button', { class: 'accent', onclick: () => grammarQuizView(sel, true) }, 'Ôn ' + nWrong + ' điểm hay sai') : null
      )
    ),
    h('div', { class: 'row between', style: { alignItems: 'center', marginTop: '4px' } },
      h('span', { class: 'small muted' }, qText ? ('Tìm thấy ' + shown.length + '/' + pts.length + ' điểm ngữ pháp') : (shown.length + ' điểm ngữ pháp')),
      shown.length > 0 && h('button', { id: 'toggle-gram-btn', class: 'ghost mini', onclick: toggleAll }, 'Mở tất cả')
    ),
    shown.length === 0 ? h('p', { class: 'note center' }, 'Không tìm thấy điểm ngữ pháp nào phù hợp với “' + qText + '”.') : null,
    ...shown.map((x) => h('details', { class: 'panel gram', style: { borderRadius: '12px' } },
      h('summary', { style: { cursor: 'pointer', fontWeight: 600 } },
        x.g.t, ' ', h('span', { class: 'chip good', style: { fontSize: '.7rem' } }, x.lv)
      ),
      h('div', { class: 'gram', style: { marginTop: '8px' } },
        h('p', { lang: langAttr, class: 'muted', style: { fontWeight: 500 } }, x.g.zh),
        x.g.f && h('p', { class: 'pat', lang: langAttr }, x.g.f),
        ...(x.g.notes || []).map((n) => h('p', { style: { margin: '4px 0' } }, n)),
        ...x.g.ex.map((e) => h('div', { class: 'ex', style: { margin: '6px 0', padding: '8px', background: 'var(--sunk)', borderRadius: '8px' } },
          h('p', { lang: langAttr, style: { margin: 0, fontWeight: 500 } }, e[0], ' ', spk(code, e[0])),
          h('p', { class: 'small read', style: { textAlign: 'left', margin: '2px 0' } }, e[1]),
          h('p', { class: 'small muted', style: { margin: 0 } }, e[2])
        )),
        h('p', { class: 'small muted', style: { marginTop: '6px' } }, 'Gặp trong bài: ' + x.topics.map((t) => t.sub || t.title).join(' · '))
      )
    ))
  );
}

        h('p', { class: 'small muted', style: { margin: 0 } }, 'Nắm vững quy tắc viết để nhớ mặt chữ nhanh gấp 3 lần và viết chữ đẹp chuẩn phong cách:'),
        ...rules.map((ru) => h('div', { class: 'panel', style: { background: 'var(--sunk)', borderRadius: '10px', padding: '10px' } },
          h('div', { class: 'row between', style: { alignItems: 'center' } },
            h('b', { style: { color: 'var(--teal)' } }, ru.title),
            h('button', {
              class: 'chip good',
              style: { cursor: 'pointer', fontSize: '1rem', padding: '2px 10px' },
              onclick: () => charView('zh', ru.ex, [ru.ex])
            }, ru.ex + ' (' + ru.pinyin + ') ➔ Tập viết')
          ),
          h('p', { class: 'small', style: { margin: '4px 0 2px 0' } }, ru.desc),
          h('p', { class: 'small muted', style: { margin: 0 } }, 'Ý nghĩa Hán Việt: ' + ru.hv)
        ))
      ),
      h('div', { class: 'panel card stack', style: { gap: '10px' } },
        h('div', { class: 'row between', style: { alignItems: 'center' } },
          h('h2', { style: { margin: 0 } }, '🈴 Bộ thủ thường gặp nhất'),
          h('span', { class: 'chip good', style: { fontSize: '.75rem' } }, filteredRad.length + ' bộ thủ')
        ),
        h('input', {
          type: 'search',
          placeholder: '🔍 Tìm bộ thủ (nhập chữ Hán, Pinyin hoặc nghĩa tiếng Việt)...',
          value: CHARS_SEARCH,
          style: { minHeight: '40px', padding: '8px 12px' },
          oninput: (e) => { CHARS_SEARCH = e.target.value; knowledgeTabView(); }
        }),
        h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(140px, 1fr))', gap: '8px' } },
          ...filteredRad.map((x) => h('div', {
            class: 'panel stack center',
            style: { background: 'var(--sunk)', borderRadius: '10px', padding: '8px', cursor: 'pointer' },
            onclick: () => charView('zh', x.r, [x.r])
          },
            h('span', { style: { fontSize: '1.6rem', fontWeight: 700, color: 'var(--ink)' } }, x.r),
            h('b', { style: { fontSize: '.85rem' } }, x.p),
            h('p', { class: 'small muted center', style: { margin: 0, fontSize: '.75rem', lineHeight: 1.2 } }, x.m),
            h('span', { class: 'chip', style: { fontSize: '.65rem', padding: '1px 6px', marginTop: '2px' } }, x.s + ' nét')
          ))
        )
      )
    );
  }

  // Japanese Kanji Lookup
  const allKanji = [];
  const topics = DATA.ja.topics || [];
  topics.forEach((t) => {
    (t.kanji || []).forEach((k) => {
      if (!allKanji.some((x) => x.k === k.k)) {
        allKanji.push({ ...k, topicTitle: t.sub || t.title, lv: t.level || 'N5' });
      }
    });
  });

  const q = CHARS_SEARCH.trim().toLowerCase();
  const filtered = allKanji.filter((k) => !q || k.k.includes(q) || k.hv.toLowerCase().includes(q) || (k.on && k.on.toLowerCase().includes(q)) || (k.kun && k.kun.toLowerCase().includes(q)));

  return h('div', { class: 'stack-lg' },
    h('div', { class: 'row between', style: { alignItems: 'center' } },
      h('h2', { style: { margin: 0 } }, '🈴 Danh mục Kanji JLPT'),
      h('span', { class: 'chip good', style: { fontSize: '.75rem' } }, filtered.length + '/' + allKanji.length + ' chữ')
    ),
    h('p', { class: 'small muted', style: { margin: 0 } }, 'Tra cứu âm Hán Việt, âm On (Onyomi), âm Kun (Kunyomi) và bấm chữ để tập viết từng nét:'),
    h('input', {
      type: 'search',
      placeholder: '🔍 Tìm Kanji theo chữ, âm Hán Việt, On, Kun...',
      value: CHARS_SEARCH,
      style: { minHeight: '40px', padding: '8px 12px' },
      oninput: (e) => { CHARS_SEARCH = e.target.value; knowledgeTabView(); }
    }),
    h('div', { class: 'stack', style: { gap: '8px' } },
      ...filtered.map((k) => h('div', { class: 'panel kj', style: { borderRadius: '12px', background: 'var(--surface)' } },
        h('button', {
          class: 'k ghost',
          lang: 'ja',
          'aria-label': 'Tập viết ' + k.k,
          onclick: () => { S.lang = 'ja'; charView('ja', k.k, allKanji.map((x) => x.k)); }
        }, k.k),
        h('div', { class: 'grow stack', style: { gap: '4px' } },
          h('div', { class: 'row', style: { gap: '8px', alignItems: 'center' } },
            h('b', { style: { fontSize: '1.05rem', color: 'var(--teal)' } }, k.hv),
            h('span', { class: 'chip good', style: { fontSize: '.75rem' } }, k.lv),
            h('span', { class: 'small muted' }, 'Bài: ' + k.topicTitle)
          ),
          k.on ? h('p', { class: 'small', lang: 'ja', style: { margin: 0 } }, 'On: ' + k.on) : null,
          k.kun ? h('p', { class: 'small', lang: 'ja', style: { margin: 0 } }, 'Kun: ' + k.kun) : null,
          ...(k.ex || []).slice(0, 2).map((e) => h('p', { class: 'small muted', lang: 'ja', style: { margin: 0 } }, ruby(e[0]), ' · ' + e[1]))
        )
      ))
    )
  );
}

// Chế độ thi thử Demo cho HSK / JLPT
function startExamDemo(code, lv) {
  const isZh = code === 'zh';
  const pts = grammarPoints(code).filter((x) => x.lv === lv);
  const samplePts = pts.length >= 3 ? pts.slice(0, 5) : grammarPoints(code).slice(0, 5);
  let curQ = 0;
  let score = 0;
  const total = samplePts.length;

  const questions = samplePts.map((p, idx) => {
    const ex = p.g.ex && p.g.ex[0];
    const plainSentence = ex ? ex[0] : p.g.t;
    const meaning = ex ? ex[2] : (p.g.notes && p.g.notes[0]) || '';
    const kw = gqKeywords(p.g)[0] || (isZh ? '的' : 'は');
    const wrongPool = isZh ? ['不', '在', '了', '很', '没', '和'] : ['が', 'を', 'に', 'で', 'も', 'と'];
    const dist = sample(wrongPool.filter((w) => w !== kw), 3);
    const opts = shuffle([kw, ...dist]);
    return {
      num: idx + 1,
      prompt: plainSentence.replace(kw, ' ( ___ ) '),
      answer: kw,
      opts,
      meaning,
      full: plainSentence
    };
  });

  const renderQuiz = () => {
    if (curQ >= total) {
      // Kết quả thi
      const pass = score >= Math.ceil(total * 0.6);
      mount(h('div', { class: 'stack-lg center', style: { paddingTop: '24px' } },
        h('h1', { style: { color: pass ? 'var(--good)' : 'var(--bad)' } }, pass ? '🎉 CHÚC MỪNG BẠN ĐÃ ĐẠT!' : '⚡ CẦN TIẾP TỤC ÔN LUYỆN'),
        h('div', { class: 'panel card stack center', style: { padding: '24px', borderRadius: '16px', gap: '12px' } },
          h('p', { class: 'label' }, 'Kết quả bài thi thử mẫu ' + lv),
          h('div', { style: { fontSize: '2.5rem', fontWeight: 800, color: pass ? 'var(--good)' : 'var(--bad)' } }, score + ' / ' + total),
          h('p', { class: 'small muted center' }, pass ? 'Bạn nắm rất chắc các điểm kiến thức trọng tâm của cấp độ này!' : 'Hãy vào tab Kiến thức để ôn lại các điểm ngữ pháp trước khi thi.'),
          h('div', { class: 'row center', style: { gap: '10px', marginTop: '12px' } },
            h('button', { class: 'primary', onclick: () => examTabView() }, 'Về phòng thi'),
            h('button', { class: 'ghost', onclick: () => startExamDemo(code, lv) }, 'Làm lại đề này')
          )
        )
      ));
      return;
    }

    const q = questions[curQ];
    mount(h('div', { class: 'stack-lg' },
      h('div', { class: 'row between', style: { alignItems: 'center' } },
        h('button', { class: 'ghost mini', onclick: () => examTabView() }, '✕ Hủy bài thi'),
        h('span', { class: 'chip good', style: { fontWeight: 700 } }, 'Câu ' + (curQ + 1) + ' / ' + total),
        h('span', { class: 'small muted' }, 'Điểm: ' + score)
      ),
      h('div', { class: 'panel card stack', style: { gap: '12px', borderRadius: '14px' } },
        h('p', { class: 'label', style: { margin: 0 } }, isZh ? 'Chọn từ thích hợp điền vào chỗ trống:' : '正しい言葉を一つ選んでください:'),
        h('h2', { lang: LANGS[code].lang, style: { margin: '8px 0', fontSize: '1.25rem', lineHeight: 1.5 } }, q.prompt),
        q.meaning ? h('p', { class: 'small muted', style: { margin: 0 } }, 'Ý nghĩa: ' + q.meaning) : null,
        h('div', { class: 'options', style: { marginTop: '12px' } },
          ...q.opts.map((opt, i) => h('button', {
            class: 'primary',
            style: { padding: '14px', fontSize: '1.05rem', textAlign: 'left', fontWeight: 600 },
            onclick: () => {
              const ok = opt === q.answer;
              if (ok) score++;
              toast(ok ? 'Chính xác! (+1)' : ('Chưa đúng. Đáp án: ' + q.answer));
              curQ++;
              setTimeout(renderQuiz, 400);
            }
          }, h('span', { class: 'kbd' }, i + 1), opt))
        )
      )
    ));
  };

  renderQuiz();
}

// ===== Chuyển tiến độ giữa bản trên Claude và bản web (mã chữ, gộp không ghi đè) =====
const b64 = { enc: (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); },
  dec: (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0)) };
async function pipeBytes(u8, stream) { return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(stream)).arrayBuffer()); }
async function exportCode() {
  const raw = new TextEncoder().encode(JSON.stringify(S));
  if (window.CompressionStream) { try { return 'LGG1z.' + b64.enc(await pipeBytes(raw, new CompressionStream('gzip'))); } catch (e) { /* dùng bản không nén */ } }
  return 'LGG1.' + b64.enc(raw);
}
async function importCode(code) {
  const m = String(code).replace(/\s+/g, '').match(/^LGG1(z?)\.([A-Za-z0-9+/=]+)$/);
  if (!m) throw new Error('Mã không đúng. Hãy dán nguyên đoạn mã bắt đầu bằng LGG1.');
  let bytes = b64.dec(m[2]);
  if (m[1]) { if (!window.DecompressionStream) throw new Error('Trình duyệt này quá cũ để đọc mã. Hãy cập nhật iOS/trình duyệt.'); bytes = await pipeBytes(bytes, new DecompressionStream('gzip')); }
  const o = JSON.parse(new TextDecoder().decode(bytes));
  if (!o || o.v !== 2 || typeof o.srs !== 'object' || typeof o.lessons !== 'object') throw new Error('Mã không phải tiến độ Lingogo.');
  return o;
}
async function copyProgress() {
  const code = await exportCode();
  let ok = false; try { await navigator.clipboard.writeText(code); ok = true; } catch (e) { try { const ta = h('textarea', { readonly: true }); ta.value = code; document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove(); } catch (e2) { ok = false; } }
  toast(ok ? 'Đã sao chép tiến độ (Push). Mở máy khác bấm Nhận (Pull).' : 'Không sao chép tự động được.');
  return ok;
}
async function pasteProgress() {
  let txt = ''; try { txt = await navigator.clipboard.readText(); } catch (e) { toast('Không đọc được bộ nhớ tạm. Hãy dán mã vào ô.'); return false; }
  try {
    const inc = await importCode(txt);
    const nL = Object.keys(S.lessons).length, nS = Object.keys(S.srs).length;
    S = mergeState(S, inc); save();
    const dl = Object.keys(S.lessons).length - nL, ds = Object.keys(S.srs).length - nS;
    toast(dl || ds ? 'Đã gộp (Pull): thêm ' + dl + ' bài, ' + ds + ' mục ôn.' : 'Đã gộp (Pull). Tiến độ đã khớp.');
    route();
    return true;
  } catch (e) { toast(e.message || 'Không đọc được mã.'); return false; }
}
async function getSyncUrl() {
  const cfg = getGhConfig();
  let payload = {};
  if (cfg.token && cfg.gistId) {
    payload = { v: 2, token: cfg.token, gistId: cfg.gistId, user: cfg.user };
  } else {
    payload = { v: 2, code: await exportCode() };
  }
  const str = encodeURIComponent(JSON.stringify(payload));
  return window.location.origin + window.location.pathname + '#sync=' + str;
}
async function handleUrlSync() {
  const hash = window.location.hash;
  if (!hash || !hash.includes('sync=')) return false;
  const match = hash.match(/sync=([^&]+)/);
  if (!match) return false;
  try {
    const raw = decodeURIComponent(match[1]);
    let parsed = null;
    try { parsed = JSON.parse(raw); } catch (e) {
      try { parsed = JSON.parse(decodeURIComponent(escape(atob(raw)))); } catch (e2) { parsed = null; }
    }
    if (!parsed && raw.startsWith('LGG1')) {
      parsed = { code: raw };
    }
    if (!parsed) return false;

    let imported = false;
    // 1. Cấu hình GitHub Gist nếu có trong link
    if (parsed.token) {
      saveGhConfig({ token: parsed.token, gistId: parsed.gistId || '', user: parsed.user || '' });
      try {
        const pulled = await pullGhSync(false);
        if (pulled) imported = true;
      } catch (e) {}
    }

    // 2. Mã tiến độ
    if (parsed.code) {
      try {
        const inc = await importCode(parsed.code);
        S = mergeState(S, inc);
        save();
        imported = true;
      } catch (e) {}
    }

    if (imported) {
      toast('Đồng bộ thành công! Chào mừng ' + (S.name || 'bạn') + '.');
    }

    history.replaceState(null, '', window.location.pathname + window.location.search);
    return true;
  } catch (err) {
    console.warn('Lỗi xử lý URL sync:', err);
    return false;
  }
}
async function autoSync() {
  const btn = document.querySelector('.sync-btn');
  if (btn) btn.classList.add('spinning');
  try {
    const cfg = getGhConfig();
    if (!cfg.token) {
      toast('Chưa kết nối GitHub! Vui lòng nhập Token một lần để đồng bộ.');
      showSyncModal();
      return;
    }
    // 1. Tự động đồng bộ qua GitHub Gist nếu đã thiết lập
    if (!cfg.gistId) {
      try {
        const res = await findOrCreateGhGist(cfg.token);
        cfg.gistId = res.gistId; cfg.user = res.user; saveGhConfig(cfg);
      } catch (e) {
        toast('Lỗi xác thực GitHub: ' + (e.message || ''));
        return;
      }
    }
    if (cfg.gistId) {
      try {
        const res = await fetch('https://api.github.com/gists/' + cfg.gistId, { headers: ghHeaders(cfg.token) });
        if (!res.ok) {
          if (res.status === 401) {
            toast('GitHub Token không hợp lệ hoặc đã hết hạn. Vui lòng kiểm tra lại!');
            showSyncModal();
            return;
          }
          if (res.status === 404) {
            toast('Không tìm thấy bản sao lưu cũ trên GitHub. Đang tạo mới...');
            const found = await findOrCreateGhGist(cfg.token);
            cfg.gistId = found.gistId; cfg.user = found.user; saveGhConfig(cfg);
          }
        } else {
          const gist = await res.json();
          const f = gist.files && gist.files['lingogo-progress.json'];
          if (f && f.content) {
            const remote = JSON.parse(f.content);
            const prevL = Object.keys(S.lessons || {}).length;
            const prevS = Object.keys(S.srs || {}).length;
            const prevW = Object.keys(S.written || {}).length;
            const remoteT = remote.t || 0;
            const localT = S.t || 0;

            const merged = mergeState(S, remote);
            const dl = Object.keys(merged.lessons || {}).length - prevL;
            const ds = Object.keys(merged.srs || {}).length - prevS;
            const dw = Object.keys(merged.written || {}).length - prevW;
            const remoteHasMore = dl > 0 || ds > 0 || dw > 0;

            if (remoteT > localT || remoteHasMore) {
              S = merged;
              GH_SYNC.seen = S.t || Date.now();
              save();
              route();
              const parts = [dl && (dl + ' bài'), ds && (ds + ' mục ôn'), dw && (dw + ' chữ viết')].filter(Boolean).join(', ');
              toast('Đã kéo (Pull): ' + (parts ? 'gộp thêm ' + parts + ' từ GitHub.' : 'tiến độ đã cập nhật mới nhất từ GitHub.'));
              return;
            } else {
              await pushGhSync(true);
              toast('Đã đẩy (Push): Tiến độ máy này mới nhất, đã lưu lên GitHub (@' + (cfg.user || 'User') + ').');
              return;
            }
          }
        }
      } catch (ghErr) {
        toast('Lỗi kết nối GitHub: ' + (ghErr.message || 'Kiểm tra mạng'));
        return;
      }
    }
  } catch (err) {
    toast('Lỗi đồng bộ: ' + (err.message || 'Không thể đồng bộ.'));
  } finally {
    if (btn) setTimeout(() => btn.classList.remove('spinning'), 600);
  }
}

      h('label', { class: 'row', style: { alignItems: 'center', gap: '8px', cursor: 'pointer', fontWeight: 600 } }, smartSchedCheck, h('span', {}, 'Bật lộ trình học theo thứ trong tuần (chống loạn ngôn ngữ)')),
      h('p', { class: 'small muted', style: { margin: 0 } }, 'Tự động tăng mục tiêu XP cho ngôn ngữ trọng tâm trong ngày và giảm nhẹ cho các ngôn ngữ duy trì (kèm nhắc nhở Spaced Repetition).'),
      h('label', { for: 'goal', class: 'label', style: { marginTop: '8px' } }, 'Mức độ mục tiêu cơ bản'), goalSel, h('p', { class: 'small muted' }, 'Mỗi từ, kanji, câu hoặc tình huống làm đúng được 5 XP. Học lại bài cũ được nửa XP.'),
      h('p', { class: 'small muted' }, 'Thêm vào màn hình chính trên iPhone: mở link bằng Safari, bấm Chia sẻ, chọn “Thêm vào MH chính”.')),
    h('div', { class: 'panel stack', style: { background: 'var(--sunk)', border: '1px solid var(--line)', gap: '10px' } },
      h('div', { class: 'row between', style: { alignItems: 'center' } },
        h('div', { class: 'row', style: { gap: '10px', alignItems: 'center' } },
          h('span', { class: 'sync-badge-icon', style: { color: '#eab308', background: 'rgba(234, 179, 8, .12)' } }, icon(ICON.feedback, { size: 20 })),
          h('div', { style: { minWidth: 0 } },
            h('b', { style: { display: 'block', fontSize: '.92rem' } }, 'Góp ý & Báo lỗi cho AI'),
            h('span', { class: 'small muted', style: { fontSize: '.8rem' } }, 'Phát hiện câu sai, lỗi âm thanh hay cần tính năng mới?')
          )
        ),
        h('button', { class: 'primary mini', onclick: () => showFeedbackModal() }, 'Góp ý ngay')
      )
    ),
    transferPanel(),
    resetBtn));
}

// ===== Phím tắt: 1–9 chọn đáp án (hoặc mức nhớ khi ôn), Enter = Kiểm tra / Tiếp tục / Hiện nghĩa =====
const visible = (el) => el && !el.disabled && el.offsetParent !== null && !el.closest('[hidden]');
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
  if (/^[1-9]$/.test(e.key)) {
    const n = Number(e.key) - 1;
    const grades = [...document.querySelectorAll('.grades button')].filter(visible);
    let opts = grades.length ? grades : [...document.querySelectorAll('.options button')].filter(visible);
    if (!opts.length) opts = [...document.querySelectorAll('.langcard')].filter(visible);
    if (opts[n]) { e.preventDefault(); opts[n].click(); }
    return;
  }
  if (e.key === 'Escape' && subjectsOpen) {
    subjectsOpen = false;
    homeView();
    return;
  }
  if (e.key === 'Enter') {
    const main = [...document.querySelectorAll('.dock button, .next-btn')].filter((b) => visible(b) && !b.closest('.grades'))[0];
    if (main) { e.preventDefault(); main.click(); }
  }
});
document.addEventListener('click', (e) => {
  if (subjectsOpen && !e.target.closest('.subjects-box') && !e.target.closest('.langchip')) {
    subjectsOpen = false;
    homeView();
  }
});

async function checkAppUpdate() {
  try {
    const res = await fetch('version.json?_t=' + Date.now(), { cache: 'no-store' });
    if (res.ok) {
      const data = await res.json();
      if (data.build && data.build !== APP_BUILD_ID) {
        const reloadKey = 'lingogo_reload_' + data.build;
        if (sessionStorage.getItem(reloadKey)) {
          console.warn('Đang chờ cache CDN làm mới bản build:', APP_BUILD_ID, '->', data.build);
          return;
        }
        sessionStorage.setItem(reloadKey, '1');
        console.log('Phát hiện bản cập nhật mới:', data.build);
        window.location.reload();
      }
    }
  } catch (e) {}
}

// ===== Khởi động =====
(async () => {
  await handleUrlSync();
  route();
  startSync();
  startGhSync();
  checkAppUpdate();
})();
</script>
