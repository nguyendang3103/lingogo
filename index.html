          )
        );
      } else {
        const kj = it.k; sayText = kj.ex && kj.ex[0] ? plain(kj.ex[0][0]) : kj.k;
        front = h('div', { class: 'big', lang: 'ja' }, kj.k);
        back = h('div', { class: 'stack', hidden: true, style: { gap: '8px', marginTop: '8px' } },
          h('p', { style: { fontSize: '1.3rem', fontWeight: 700, margin: '2px 0' } }, kj.hv + (kj.m ? ' (' + kj.m + ')' : '')),
          h('p', { class: 'small', lang: 'ja', style: { color: 'var(--teal)', fontWeight: 600 } }, 'On: ' + kj.on + ' · Kun: ' + kj.kun),
          kj.ex && kj.ex.length && h('div', {
            class: 'panel stack',
            style: {
              background: 'rgba(15,82,87,.07)',
              border: '1px solid var(--line)',

              gap: '6px',
              marginTop: '6px',
              textAlign: 'left'
            }
          },
            h('span', { class: 'label', style: { margin: 0, color: 'var(--teal)', fontWeight: '700', fontSize: '.8rem' } }, '📝 Từ ghép & Ví dụ đặt câu:'),
            ...kj.ex.slice(0, 3).map((e) => h('div', { class: 'row between', style: { alignItems: 'center', gap: '8px' } },
              h('div', { class: 'stack', style: { gap: '2px' } },
                h('p', { class: 'small', lang: 'ja', style: { fontSize: '1rem', margin: 0, fontWeight: 600 } }, ruby(e[0])),
                h('p', { class: 'small muted', style: { margin: 0 } }, e[1])
              ),
              spk('ja', plain(e[0]))
            ))
          )
        );
      }
      const pool = Object.values(cardIndex(code)), t0r = Date.now();
      const answer = it.v ? it.v.m : it.k.hv;
      const others = it.v
        ? pool.filter((x) => x.v && x.v.id !== it.v.id && x.v.m !== it.v.m && x.t === it.t).concat(pool.filter((x) => x.v && x.v.id !== it.v.id && x.v.m !== it.v.m && x.t !== it.t))
        : pool.filter((x) => x.k && x.k.k !== it.k.k && x.k.hv !== it.k.hv);
      const labels = [...new Set(others.slice(0, 40).map((x) => (it.v ? x.v.m : x.k.hv)))];
      const opts = shuffle([answer, ...sample(labels, 3)]);
      const verdict = h('div', { 'aria-live': 'assertive' });
      let wrongFlag = false;
      const onNext = () => {
        queue.shift();
        if (wrongFlag) queue.push(item);
        show();
      };
      const contTop = h('button', {
        class: 'primary block next-btn',
        style: { fontSize: '1.05rem', fontWeight: '700', padding: '12px 16px', borderRadius: '12px' },
        onclick: onNext
      }, 'Tiếp theo ➔');
      const topDock = h('div', { class: 'stack', style: { gap: '8px' }, hidden: true }, contTop, verdict);

      const bs = opts.map((o, j) => h('button', { 'aria-keyshortcuts': String(j + 1), onclick: () => {
        const ok = o === answer, sec = (Date.now() - t0r) / 1000, g = !ok ? 1 : sec <= 4 ? 4 : sec <= 10 ? 3 : 2;
        bs.forEach((b, n) => { b.disabled = true; if (opts[n] === answer) b.classList.add('right'); else if (n === j) b.classList.add('wrong'); });
        S.srs[k] = srsNext(s, g); if (ok) markReviewedToday(code, t0); count++; addXp(g >= 2 ? XP_ITEM : 0, code);
        back.hidden = false; say(code, sayText);
        verdict.replaceChildren(h('div', {
          class: 'feedback ' + (ok ? 'ok' : 'no'),
          style: { margin: 0, padding: '8px 12px', textAlign: 'center', borderRadius: '10px' }
        }, h('strong', {}, ok ? 'Chính xác!' : 'Chưa đúng.'), ' · ' + (ok ? 'Ôn lại sau ' + ivText(S.srs[k]) : 'Ôn lại ngay hôm nay')));
        wrongFlag = !ok;
        topDock.hidden = false;
        contTop.focus();
      } }, h('span', { class: 'kbd', 'aria-hidden': 'true' }, j + 1), h('span', { class: 'grow' }, o)));

      return mount(h('div', { class: 'stack-lg' }, head(true), topBar,
        topDock,
        h('div', { class: 'panel card' },
          h('p', { class: 'small muted' }, it.v ? 'Chọn nghĩa đúng' : 'Chọn âm Hán Việt đúng'),
          front,
          h('div', { class: 'listen' }, spk(code, sayText, { cls: 'big' })),
          back
        ),
        h('div', { class: 'options' }, bs)

    }

    // 2. LUYỆN NÓI
    if (item.skill === 'speak') {
      const it = (item.it && item.it.it) || item.it || {};
      const targetText = it.text || item.id;
      const wordsBox = h('div', { class: 'words', lang: L().lang, style: { fontSize: code === 'en' ? '1.4rem' : '1.8rem', justifyContent: 'center' } }, it.raw ? ruby(it.raw) : plain(targetText));
      const resultBox = h('div', { class: 'stack center', style: { gap: '4px', minHeight: '40px' } });
      const verdict = h('div', { 'aria-live': 'assertive' });
      let wrongFlag = false;
      const onNext = () => {
        queue.shift();
        if (wrongFlag) queue.push(item);
        show();
      };
      const contTop = h('button', {
        class: 'primary block next-btn',
        style: { fontSize: '1.05rem', fontWeight: '700', padding: '12px 16px', borderRadius: '12px' },
        onclick: onNext
      }, 'Tiếp theo ➔');
      const topDock = h('div', { class: 'stack', style: { gap: '8px' }, hidden: true }, contTop, verdict);

      const finishSpeak = (g, ok, scoreText) => {
        S.srs[k] = srsNext(s, g);
        count++;
        addXp(ok ? XP_ITEM : 0, code);
        verdict.replaceChildren(h('div', {
          class: 'feedback ' + (ok ? 'ok' : 'no'),
          style: { margin: 0, padding: '8px 12px', textAlign: 'center', borderRadius: '10px' }
        }, h('strong', {}, ok ? 'Đạt yêu cầu!' : 'Chưa đạt.'), ' · ' + (scoreText ? scoreText + ' · ' : '') + (ok ? 'Ôn lại sau ' + ivText(S.srs[k]) : 'Ôn lại sớm')));
        wrongFlag = !ok;
        topDock.hidden = false;
        contTop.focus();
      };

      const ctrl = micControl(code, (said) => {
        const a = align(code, targetText, said);
        wordsBox.replaceChildren(...a.units.map((w, idx) => h('span', { class: a.hit[idx] ? 'hit' : 'miss' }, w)));
        const ok = a.score >= 70;
        const g = a.score >= 90 ? 4 : a.score >= 70 ? 3 : a.score >= 50 ? 2 : 1;
        resultBox.replaceChildren(
          h('div', { class: 'score', style: { color: ok ? 'var(--good)' : 'var(--ink)' } }, a.score + '%'),

      }, (selfGrade) => {
        finishSpeak(selfGrade >= 3 ? 3 : 1, selfGrade >= 3, 'Tự đánh giá');
      }, [['Chưa tốt', 1], ['Tạm ổn', 2], ['Nói tốt', 3]]);

      const readingLine = it.r || (code === 'ja' && it.raw ? jaHiraganaFromRaw(it.raw) : '');
      return mount(h('div', { class: 'stack-lg' }, head(true), topBar,
        topDock,
        h('div', { class: 'panel card stack center', style: { gap: '10px' } },
          h('p', { class: 'small muted' }, 'Bấm Micro và nói lại câu này theo phương pháp lặp lại ngắt quãng:'),
          wordsBox,
          readingLine && readingLine !== targetText ? h('p', { class: code === 'en' ? 'ipa' : 'read', lang: L().lang, style: { margin: 0, textAlign: 'center' } }, readingLine) : null,
          it.m ? h('p', { class: 'small muted center', style: { fontSize: '1.05rem', margin: 0 } }, it.m) : null,
          h('div', { class: 'listen', style: { justifyContent: 'center' } }, spk(code, targetText, { cls: 'big' })),
          ctrl,
          resultBox
        )
      ));
    }

    // 3. LUYỆN VIẾT
    if (item.skill === 'write') {
      const c = item.id;
      const chars = [...String(c || '')].filter((x) => /[\u4e00-\u9fff\u3040-\u30ff]/.test(x));
      let activeCh = chars[0] || c;
      const hint = item.it.hint || charHint(code, c);
      const wbox = h('div', { class: 'charbox', style: { margin: '0 auto' } });
      const info = h('p', { class: 'small muted center' }, 'Đang tải nét chữ…');
      const verdict = h('div', { 'aria-live': 'assertive' });
      let wrongFlag = false;
      let writer = null;
      let blindMode = false;
      const onNext = () => {
        queue.shift();
        if (wrongFlag) queue.push(item);
        show();
      };
      const contTop = h('button', {
        class: 'primary block next-btn',
        style: { fontSize: '1.05rem', fontWeight: '700', padding: '12px 16px', borderRadius: '12px' },
        onclick: onNext
      }, 'Tiếp theo ➔');
      const topDock = h('div', { class: 'stack', style: { gap: '8px' }, hidden: true }, contTop, verdict);

      const finishWrite = (g, ok, note) => {
        S.srs[k] = srsNext(s, g);
        count++;
        addXp(ok ? XP_ITEM : 0, code);
        verdict.replaceChildren(h('div', {
          class: 'feedback ' + (ok ? 'ok' : 'no'),
          style: { margin: 0, padding: '8px 12px', textAlign: 'center', borderRadius: '10px' }
        }, h('strong', {}, ok ? 'Đạt nét chữ!' : 'Chưa đạt.'), ' · ' + (note ? note + ' · ' : '') + (ok ? 'Ôn lại sau ' + ivText(S.srs[k]) : 'Ôn lại sớm')));
        wrongFlag = !ok;
        topDock.hidden = false;
        contTop.focus();
      };

      const toggleOutlineBtn = h('button', {
        class: 'ghost mini',
        onclick: () => {
          if (!writer) return;
          blindMode = !blindMode;
          toggleOutlineBtn.textContent = blindMode ? 'Hiện nét mờ' : 'Ẩn nét mờ';
          blindMode ? writer.hideOutline() : writer.showOutline();

      const strokeAnimBtn = h('button', {

              writer.quiz({
                showHintAfterMisses: 2,
                onComplete: (res) => {

                  info.textContent = ok ? 'Hoàn thành tốt! (Sai ' + res.totalMistakes + ' lần)' : 'Hoàn thành nhưng sai ' + res.totalMistakes + ' lần.';

            }
          });
        }
      }, 'Xem thứ tự nét');

      const loadCharIntoBox = async (ch) => {

            h('div', { class: 'row center', style: { gap: '8px' } },
              h('button', { class: 'mini', onclick: () => finishWrite(3, true, 'Đã nhớ chữ') }, 'Tôi đã nhớ chữ này'),

        writer.quiz({
          showHintAfterMisses: 2,
          onComplete: (res) => {
            const ok = res.totalMistakes <= 3;
            info.textContent = ok ? 'Hoàn thành tốt! (Sai ' + res.totalMistakes + ' lần)' : 'Hoàn thành nhưng sai ' + res.totalMistakes + ' lần.';
            finishWrite(ok ? (res.totalMistakes === 0 ? 4 : 3) : 1, ok);
          }

      };

      setTimeout(() => loadCharIntoBox(activeCh), 50);

      const charPicker = chars.length > 1
        ? h('div', { class: 'row center', style: { gap: '6px' } }, chars.map((ch) =>
            h('button', {
              class: 'mini ' + (ch === activeCh ? 'primary' : 'ghost'),
              lang: LANGS[code].lang,
              onclick: (e) => {

        topDock,
        h('div', { class: 'panel card stack center', style: { gap: '10px' } },

          h('div', { class: 'row center', style: { gap: '8px', alignItems: 'center' } },
            h('span', { class: 'chip good', lang: LANGS[code].lang, style: { fontSize: '1.2rem', padding: '4px 14px' } }, c),
            hint ? h('b', {}, hint) : null,
            spk(code, c)

          charPicker,
          wbox,

          h('div', { class: 'row center wrap', style: { gap: '8px' } },

          h('div', { class: 'row center', style: { gap: '8px' } },
            h('button', { class: 'ghost mini', onclick: () => finishWrite(3, true, 'Đã viết xong') }, 'Đã viết trên giấy (Đạt)'),

          )

    }

    // 4. NGỮ PHÁP
    if (item.skill === 'gram') {
      const p = item.it;
      let g = p.g || (DATA[code].grammar && DATA[code].grammar[p.gid]);
      let q = null;
      if (code === 'en') {

        const tokens = tokensOf('en', v.ex);
        const allWords = (DATA.en.topics || []).flatMap((t) => t.vocab || []);

          for (let n = 0; n < 6 && bank.every((b, i) => b.k === i); n++) bank = shuffle(bank);

            type: 'order',
            label: 'Sắp xếp các từ thành câu đúng',
            prompt: v.exm || ('Câu có từ “' + plainWord + '” (' + v.m + ')'),

            answer: tokens.join(' '),
            e: [v.ex, v.exr || '', v.exm || '']
          };
        }
        g = {
          t: 'Cấu trúc câu: ' + (v.d || plainWord),

          notes: v.d ? [v.d] : []
        };
      } else {
        if (!g) {
          queue.shift(); show(); return;
        }
        const all = grammarPoints(code);
        const pool = [...new Set(all.flatMap((x) => gqKeywords(x.g)))];
        q = gqMake(p, all, pool) || {
          type: 'cloze', p, e: g.ex[0], label: 'Điền từ đúng',
          prompt: g.ex[0][0], hint: g.ex[0][2], answer: gqKeywords(g)[0] || '', opts: [gqKeywords(g)[0] || '', 'không', 'đã', 'sẽ']
        };
      }

      const langAttr = LANGS[code].lang;
      let done = false;
      let wrongFlag = false;
      const onNext = () => {
        queue.shift();
        if (wrongFlag) queue.push(item);
        show();
      };
      const contTop = h('button', {
        class: 'primary block next-btn',
        style: { fontSize: '1.05rem', fontWeight: '700', padding: '12px 16px', borderRadius: '12px' },
        onclick: onNext
      }, 'Tiếp theo ➔');
      const verdict = h('div', { 'aria-live': 'assertive' });
      const topDock = h('div', { class: 'stack', style: { gap: '8px' }, hidden: true }, contTop, verdict);
      const fb = h('div', { 'aria-live': 'polite' });

      const revealGrammar = (ok) => {
        done = true;
        const sGrade = ok ? 3 : 1;

        addXp(ok ? XP_ITEM : 0, code);

        wrongFlag = !ok;
        verdict.replaceChildren(h('div', {
          class: 'feedback ' + (ok ? 'ok' : 'no'),
          style: { margin: 0, padding: '8px 12px', textAlign: 'center', borderRadius: '10px' }
        }, h('strong', {}, ok ? 'Chính xác!' : 'Chưa đúng.'), ' · ' + (ok ? 'Ôn lại sau ' + ivText(S.srs[k]) : ('Đáp án: ' + (q.type === 'order' ? q.e[0] : q.answer) + ' · Ôn lại sớm'))));
        topDock.hidden = false;
        contTop.focus();

        fb.replaceChildren(
          h('div', { class: 'panel gram', style: { gap: '8px' } },
            h('div', { class: 'ex' },
              h('p', { lang: langAttr }, q.e[0], ' ', spk(code, q.e[0])),
              h('p', { class: 'small read', style: { textAlign: 'left' } }, q.e[1]),
              h('p', { class: 'small muted' }, q.e[2])
            )
          ),
          h('div', { class: 'panel gram stack', style: { gap: '6px' } },
            h('p', { class: 'label', style: { margin: 0 } }, 'Giải thích ngữ pháp:'),
            h('p', { class: 'pat', style: { margin: 0 } }, g.t),
            g.f && h('p', { class: 'small', lang: langAttr, style: { margin: 0 } }, g.f),
            ...(g.notes || []).map((n) => h('p', { class: 'small', style: { margin: 0 } }, n))
          )
        );
        setTimeout(() => say(code, q.e[0]), 250);
      };

      let body;
      if (q.type === 'cloze') {
        const bs = q.opts.map((o, idx) => h('button', { 'aria-keyshortcuts': String(idx + 1), onclick: () => {
          if (done) return;

  const pick = topicPicker(code, LISTEN_TOPIC, () => skillsView('listen'));

  const vocabsWithEx = (t.vocab || []).filter((v) => v.ex);

  const playAllBtn = h('button', {
    class: 'primary block',

        playAllBtn.classList.add('primary');
        return;
      }
      if (!vocabsWithEx.length) { toast('Chủ đề này chưa có câu ví dụ.'); return; }
      isPlayingAll = true;
      playIndex = 0;
      playAllBtn.classList.remove('primary');
      playAllBtn.classList.add('accent');

      function playNext() {
        if (!isPlayingAll) return;
        if (playIndex >= vocabsWithEx.length) {
          isPlayingAll = false;
          playAllBtn.textContent = '🔊 Tắm ngôn ngữ · Phát toàn bộ câu bài này (' + vocabsWithEx.length + ' câu)';
          playAllBtn.classList.remove('accent');

          h('b', { style: { fontSize: '1rem', color: 'var(--teal)' } }, '🎧 Ôn tập kỹ năng Nghe'),
          toggleTextBtn
        ),
        h('p', { class: 'small muted', style: { margin: 0 } }, 'Luyện nghe phản xạ câu bài học: Tắm ngôn ngữ tự động phát liên tục hoặc ẩn chữ để luyện nghe chay.'),
        playAllBtn
      )
    ),
    h('div', { class: 'stack', style: { gap: '10px' } },
      h('h3', { style: { margin: '6px 0 0 0' } }, '🎧 Các câu luyện nghe trong bài học'),
      ...vocabsWithEx.map((v, idx) => {
        return h('div', { class: 'panel', style: { padding: '12px 14px', borderRadius: '12px', display: 'flex', flexDirection: 'column', gap: '6px' } },
          h('div', { class: 'row between', style: { alignItems: 'flex-start', gap: '10px' } },
            h('div', { class: 'stack', style: { gap: '4px', flex: 1, minWidth: 0 } },

            spk(code, v.w, { slow: true })
          )
        ))
      )
    )
  ];
}

// ===== Luyện Đọc (Chỉ chứa nội dung bài học, không có IELTS/tips) =====
function renderReadSkills(code, d) {
  const pick = topicPicker(code, READ_TOPIC, () => skillsView('read'));
  const t = d.topics.find((x) => x.id === READ_TOPIC[code]) || d.topics[0];
  const quizzes = t.quiz || [];
  const vocabsWithEx = (t.vocab || []).filter((v) => v.ex);
  const dialogues = getTopicDialogues(code, t);
  const curDialogue = dialogues[0];

  // Khung Đọc Hiểu Đoạn Hội Thoại / Email Bài Học
  let readingDialogueEl = null;
  if (curDialogue && curDialogue.lines.length) {
    const fullText = curDialogue.lines.map((ln) => ln.name + ': ' + ln.text).join('\n');
    readingDialogueEl = h('div', { class: 'panel card stack', style: { gap: '10px', background: 'var(--surface)', borderRadius: '14px', padding: '14px' } },
      h('div', { class: 'row between', style: { alignItems: 'center' } },
        h('h3', { style: { margin: 0, fontSize: '1.05rem', color: 'var(--teal)' } }, '📖 Bài đọc hội thoại: ' + curDialogue.title),
        spk(code, fullText)
      ),
      h('div', { class: 'stack', style: { gap: '8px', background: 'var(--sunk)', padding: '12px', borderRadius: '10px' } },
        ...curDialogue.lines.map((ln) => h('div', { class: 'stack', style: { gap: '2px' } },
          h('div', { class: 'row', style: { gap: '6px', alignItems: 'baseline' } },
            h('b', { style: { color: ln.speaker === 'A' ? 'var(--teal)' : '#b45309', fontSize: '.88rem' } }, ln.name + ':'),
            h('span', { lang: LANGS[code].lang, style: { fontSize: '1rem', fontWeight: 600 } }, ln.raw ? ruby(ln.raw) : plain(ln.text))
          ),
          ln.r ? h('span', { class: code === 'en' ? 'ipa small' : 'read small', style: { color: 'var(--muted)', marginLeft: '14px' } }, ln.r) : null,
          ln.m ? h('span', { class: 'small muted', style: { marginLeft: '14px' } }, ln.m) : null
        ))
      ),
      h('details', {},
        h('summary', { class: 'small muted', style: { cursor: 'pointer', fontWeight: 600 } }, 'Xem tóm tắt bản dịch toàn bài'),
        h('p', { class: 'small muted', style: { margin: '6px 0 0 0', lineHeight: 1.5 } }, curDialogue.lines.map((ln) => ln.name + ': ' + ln.m).join(' / '))
      )
    );
  }

  // Câu hỏi đọc hiểu tình huống bài học (t.quiz hoặc trắc nghiệm hội thoại)
  const effectiveQuizzes = quizzes.length > 0 ? quizzes : (() => {
    if (!curDialogue || curDialogue.lines.length < 2) return [];
    const l1 = curDialogue.lines[0], l2 = curDialogue.lines[1];
    return [
      {
        q: (code === 'en' ? 'What is the main topic of the conversation?' : code === 'zh' ? '这段对话的主要内容是什么？' : 'この会話の主な話題は何ですか？'),
        o: [
          curDialogue.title,
          code === 'en' ? 'Discussing tomorrow schedule' : code === 'zh' ? '讨论明天的日程' : '明日の予定を話す',
          code === 'en' ? 'Ordering food at a restaurant' : code === 'zh' ? '在餐厅点餐' : 'レストランで注文する'
        ],
        a: 0,
        why: 'Đoạn hội thoại xoay quanh chủ đề chính: ' + curDialogue.title
      },
      {
        q: (code === 'en' ? 'Who speaks first in the dialogue?' : code === 'zh' ? '谁先开口说话？' : '誰が最初に話しましたか？'),
        o: [l1.name, l2.name, code === 'en' ? 'Both at the same time' : 'Cả hai cùng lúc'],
        a: 0,
        why: l1.name + ' là nhân vật mở đầu đoạn hội thoại với câu: “' + l1.text + '”.'
      }
    ];
  })();

  const quizEls = effectiveQuizzes.map((q, qIdx) => {
    const fbBox = h('div', { style: { marginTop: '8px' } });
    let answered = false;

    const optBtns = (q.o || q.opts || []).map((optText, optIdx) => {
      const btn = h('button', {
        class: 'ghost block',
        style: { textAlign: 'left', padding: '10px 14px', fontSize: '.92rem', borderRadius: '10px', margin: '4px 0' },
        onclick: () => {
          if (answered) return;
          answered = true;
          const isRight = optIdx === q.a;
          optBtns.forEach((b, idx) => {
            b.disabled = true;
            if (idx === q.a) b.classList.add('good', 'right');
            else if (idx === optIdx) b.classList.add('wrong');
          });
          fbBox.replaceChildren(
            h('div', { class: 'feedback ' + (isRight ? 'ok' : 'no'), style: { margin: 0, padding: '8px 12px', borderRadius: '8px' } },
              h('strong', {}, isRight ? 'Chính xác!' : 'Chưa đúng.'),
              (q.why || q.exp) ? ' ' + (q.why || q.exp) : ''
            )
          );
        }
      }, h('span', { style: { fontWeight: 600, marginRight: '6px' } }, (optIdx + 1) + '.'), optText);
      return btn;
    });

    return h('div', { class: 'panel stack', style: { gap: '6px', borderRadius: '12px' } },
      h('div', { class: 'row between', style: { alignItems: 'flex-start', gap: '8px' } },
        h('div', { class: 'stack', style: { gap: '4px', flex: 1 } },
          h('span', { class: 'chip accent', style: { fontSize: '.72rem', alignSelf: 'flex-start' } }, 'Câu hỏi #' + (qIdx + 1)),
          h('p', { lang: LANGS[code].lang, style: { fontWeight: 600, fontSize: '.98rem', margin: '2px 0', lineHeight: 1.45 } }, q.q)
        ),
        spk(code, q.q)
      ),
      h('div', { class: 'stack', style: { gap: '2px' } }, ...optBtns),
      fbBox
    );
  });

  return [
    h('div', { class: 'stack', style: { gap: '8px' } },
      pick,
      h('div', { class: 'panel card stack', style: { gap: '6px', background: 'var(--surface)', borderRadius: '12px', padding: '12px 14px' } },
        h('h3', { style: { margin: 0, fontSize: '1.05rem', color: 'var(--teal)' } }, '📖 Ôn tập kỹ năng Đọc'),
        h('p', { class: 'small muted', style: { margin: 0 } }, 'Đọc hiểu đoạn hội thoại tình huống bài học kèm audio và làm bài trắc nghiệm kiểm tra độ hiểu có giải thích chi tiết.')
      )
    ),
    readingDialogueEl,
    quizEls.length > 0 ? h('div', { class: 'stack', style: { gap: '10px' } },
      h('h3', { style: { margin: '6px 0 0 0' } }, '🎯 Trắc nghiệm kiểm tra độ hiểu bài đọc'),
      ...quizEls
    ) : null,
    vocabsWithEx.length > 0 ? h('div', { class: 'stack', style: { gap: '8px', marginTop: '12px' } },
      h('h3', { style: { margin: '6px 0 0 0' } }, '📖 Đọc các câu ví dụ ngữ cảnh từ vựng'),
      ...vocabsWithEx.map((v) => h('div', { class: 'panel stack', style: { gap: '4px', borderRadius: '12px' } },
        h('div', { class: 'row between', style: { alignItems: 'center' } },
          h('b', { class: 'chip good', style: { fontSize: '.78rem' } }, plain(v.w)),
          spk(code, v.ex)
        ),
        h('p', { lang: LANGS[code].lang, style: { fontWeight: 600, margin: '2px 0' } }, v.ex),
        v.exr ? h('p', { class: code === 'en' ? 'ipa small' : 'read small', style: { margin: 0, color: 'var(--teal)' } }, v.exr) : null,
        v.exm ? h('p', { class: 'small muted', style: { margin: 0 } }, v.exm) : null
      ))
    ) : null
  ];
}

function renderSkillsMcqPanel(code, t, quizzes, onRefresh = () => skillsView('read')) {
  let qIdx = Math.min(READ_QUIZ_IDX[t.id] || 0, quizzes.length - 1);
  if (qIdx < 0) qIdx = 0;
  const q = quizzes[qIdx];
  const dlg = resolveQuizDialogue(t, q);
  const qOpts = q.o || q.opts || [];
  const opts = shuffle(qOpts.map((o, k) => ({ o, k, r: (q.r && q.r[k]) || '' })));
  let picked = null;
  let graded = false;
  const fbEl = h('div', { class: 'stack', style: { gap: '8px' }, 'aria-live': 'polite' });
  const optBtns = [];
  const checkBtn = h('button', { type: 'button', disabled: true }, 'Kiểm tra');
  const nextBtn = quizzes.length > 1 ? h('button', {
    type: 'button', class: 'ghost mini',
    onclick: () => { READ_QUIZ_IDX[t.id] = (qIdx + 1) % quizzes.length; onRefresh(); }
  }, 'Câu tiếp theo ➔') : null;
  const retryBtn = h('button', {
    type: 'button', class: 'ghost mini', hidden: true,
    onclick: () => onRefresh()
  }, '↻ Làm lại');

  const optsWrap = h('div', { class: 'stack', style: { gap: '8px' } }, ...opts.map((opt) => {
    const b = h('button', {
      type: 'button',
      style: { textAlign: 'left', padding: '10px 14px', borderRadius: '12px', border: '1px solid var(--line)', background: 'rgba(15,23,42,.35)', color: 'inherit', cursor: 'pointer', display: 'flex', flexDirection: 'column', gap: '3px' },
      onclick: () => {
        if (graded) return;
        picked = opt;
        optBtns.forEach((ob) => {
          const isSel = ob === b;
          ob.style.borderColor = isSel ? 'var(--teal)' : 'var(--line)';
          ob.style.background = isSel ? 'rgba(45,212,191,.14)' : 'rgba(15,23,42,.35)';
        });
        checkBtn.disabled = false;
      }
    }, h('span', { lang: LANGS[code].lang, style: { fontWeight: 600 } }, opt.o));
    optBtns.push(b);
    return b;
  }));

  checkBtn.onclick = () => {
    if (graded || !picked) return;
    graded = true;
    checkBtn.disabled = true;
    retryBtn.hidden = false;
    const isOk = picked.k === q.a;
    optBtns.forEach((b, j) => {
      b.disabled = true;
      if (opts[j].k === q.a) {
        b.style.borderColor = '#22c55e';
        b.style.background = 'rgba(34,197,94,.16)';
      } else if (opts[j] === picked) {
        b.style.borderColor = '#ef4444';
        b.style.background = 'rgba(239,68,68,.16)';
      }
      if (opts[j].r) {
        b.appendChild(h('span', { class: 'small read', style: { color: 'var(--teal)', fontWeight: 600 } }, opts[j].r));
      }
    });
    fbEl.replaceChildren(
      h('div', { class: 'feedback ' + (isOk ? 'ok' : 'no') },
        h('strong', {}, isOk ? 'Chính xác!' : 'Chưa đúng'),
        quizFeedback(code, { q }, { correct: isOk, note: q.why || q.exp || '' })
      )
    );
  };

  const navPills = quizzes.length > 1 ? h('div', { class: 'row', style: { gap: '6px', flexWrap: 'wrap' } },
    ...quizzes.map((_, idx) => h('button', {
      type: 'button',
      class: 'ghost mini',
      style: idx === qIdx
        ? { background: 'rgba(45,212,191,.18)', border: '1px solid var(--teal)', color: 'var(--teal)', fontWeight: 700, borderRadius: '999px', padding: '4px 10px' }
        : { border: '1px solid var(--line)', borderRadius: '999px', padding: '4px 10px' },
      onclick: () => { READ_QUIZ_IDX[t.id] = idx; onRefresh(); }
    }, 'Câu ' + (idx + 1)))
  ) : null;

  return h('div', { class: 'stack', style: { gap: '12px' } },
    navPills,
    dlg ? renderDialogueCard(code, dlg.title, dlg.src, dlg.lines, { defaultShowPy: true, defaultShowVi: false, compact: true }) : null,
    h('p', { class: 'q', style: { margin: '2px 0' } }, q.q),
    optsWrap,
    h('div', { class: 'row', style: { gap: '8px', flexWrap: 'wrap', alignItems: 'center' } }, checkBtn, retryBtn, nextBtn),
    fbEl
  );
}

function renderSkillsFillPanel(code, t, fills, onRefresh = () => skillsView('read')) {
  let fIdx = Math.min(READ_FILL_IDX[t.id] || 0, fills.length - 1);
  if (fIdx < 0) fIdx = 0;
  const fillObj = fills[fIdx];
  const navPills = fills.length > 1 ? h('div', { class: 'row', style: { gap: '6px', flexWrap: 'wrap' } },
    ...fills.map((f, idx) => h('button', {
      type: 'button',
      class: 'ghost mini',
      style: idx === fIdx
        ? { background: 'rgba(45,212,191,.18)', border: '1px solid var(--teal)', color: 'var(--teal)', fontWeight: 700, borderRadius: '999px', padding: '4px 10px' }
        : { border: '1px solid var(--line)', borderRadius: '999px', padding: '4px 10px' },
      onclick: () => { READ_FILL_IDX[t.id] = idx; onRefresh(); }
    }, 'Bài ' + (idx + 1) + (f.src ? ' · ' + f.src.replace('301 · ', '') : '')))
  ) : null;

  const fbEl = h('div', { class: 'stack', style: { gap: '8px' }, 'aria-live': 'polite' });
  const checkBtn = h('button', { type: 'button', disabled: true }, 'Kiểm tra');
  const retryBtn = h('button', { type: 'button', class: 'ghost mini', hidden: true, onclick: () => onRefresh() }, '↻ Làm lại');
  const { box, sels } = buildFillInputs(code, fillObj, () => {
    checkBtn.disabled = !sels.every((s) => s.value);
  });

  checkBtn.onclick = () => {
    let ok = 0;
    sels.forEach((s) => {
      s.disabled = true;
      const right = s.value === s.dataset.ok;
      if (right) ok++;
      s.classList.add(right ? 'right' : 'wrong');
    });
    checkBtn.disabled = true;
    retryBtn.hidden = false;
    fbEl.replaceChildren(
      h('div', { class: 'feedback ' + (ok === sels.length ? 'ok' : 'no') },
        h('strong', {}, ok === sels.length ? 'Chính xác tuyệt đối!' : 'Đúng ' + ok + '/' + sels.length + ' chỗ trống'),
        ok < sels.length ? h('p', { class: 'small', lang: LANGS[code].lang, style: { margin: '4px 0 0 0' } }, 'Đáp án: ' + sels.map((s) => s.dataset.ok).join(' · ')) : null
      ),
      fillReveal(code, fillObj, (fillObj.src && !fillObj.audio) ? null : t.id)
    );
  };

  return h('div', { class: 'stack', style: { gap: '10px' } },
    navPills,
    h('div', { class: 'row between', style: { alignItems: 'center', gap: '8px', flexWrap: 'wrap' } },
      h('span', { class: 'small', style: { fontWeight: 700 } }, fillObj.title || 'Điền từ thích hợp vào đoạn hội thoại'),
      fillObj.src ? h('span', { class: 'chip', style: { fontSize: '.7rem', padding: '1px 8px', margin: 0, background: 'rgba(45,212,191,.14)', color: 'var(--teal)' } }, '📘 ' + fillObj.src) : null
    ),
    h('div', { class: 'panel' }, box),
    fillObj.trans ? h('details', {}, h('summary', { class: 'small muted' }, 'Xem nghĩa đoạn hội thoại'), h('p', { class: 'small muted', style: { marginTop: '6px', lineHeight: 1.5 } }, fillObj.trans)) : null,
    h('div', { class: 'row', style: { gap: '8px', alignItems: 'center' } }, checkBtn, retryBtn),
    fbEl
  );
}

function renderReadSkillsRich(code, d, onRefresh = () => skillsView('read')) {
  if (code !== 'zh') return renderReadSkills(code, d);
  const pick = topicPicker(code, READ_TOPIC, onRefresh);
  const t = d.topics.find((x) => x.id === READ_TOPIC[code]) || d.topics[0];
  if (!t) return [pick];

  const out = [pick];
  const speaks = Array.isArray(t.speak) ? t.speak : [];
  if (speaks.length) {
    let dIdx = Math.min(READ_DLG_IDX[t.id] || 0, speaks.length - 1);
    if (dIdx < 0) dIdx = 0;
    const sc = speaks[dIdx];
    const dlgTabs = speaks.length > 1 ? h('div', { class: 'row', style: { gap: '6px', flexWrap: 'wrap' } },
      ...speaks.map((item, idx) => h('button', {
        type: 'button',
        class: 'ghost mini',
        style: idx === dIdx
          ? { background: 'rgba(45,212,191,.18)', border: '1px solid var(--teal)', color: 'var(--teal)', fontWeight: 700, borderRadius: '999px', padding: '4px 10px' }
          : { border: '1px solid var(--line)', borderRadius: '999px', padding: '4px 10px' },
        onclick: () => { READ_DLG_IDX[t.id] = idx; onRefresh(); }
      }, (idx + 1) + '. ' + (item.title || 'Hội thoại')))
    ) : null;
    out.push(h('div', { class: 'card stack', style: { gap: '10px' } },
      h('p', { class: 'label', style: { margin: 0 } }, '💬 Hội thoại & Bài đọc giáo trình 301'),
      dlgTabs,
      renderDialogueCard(code, sc.title, sc.src, sc.lines, { defaultShowPy: true, defaultShowVi: true })
    ));
  }

  const quizzes = Array.isArray(t.quiz) ? t.quiz : [];
  const fills = topicFillsList(t);
  if (quizzes.length || fills.length) {
    let mode = READ_MODE[t.id] || (quizzes.length ? 'mcq' : 'fill');
    if (mode === 'mcq' && !quizzes.length) mode = 'fill';
    if (mode === 'fill' && !fills.length) mode = 'mcq';
    const modeRow = h('div', { class: 'row', style: { gap: '8px', flexWrap: 'wrap' } },
      quizzes.length ? h('button', {
        type: 'button',
        class: 'ghost mini',
        style: mode === 'mcq'
          ? { background: 'var(--teal)', color: '#052e2b', fontWeight: 700, borderRadius: '10px', padding: '7px 12px', border: '1px solid var(--teal)' }
          : { border: '1px solid var(--line)', borderRadius: '10px', padding: '7px 12px' },
        onclick: () => { READ_MODE[t.id] = 'mcq'; onRefresh(); }
      }, '☑️ Trắc nghiệm đọc hiểu (' + quizzes.length + ')') : null,
      fills.length ? h('button', {
        type: 'button',
        class: 'ghost mini',
        style: mode === 'fill'
          ? { background: 'var(--teal)', color: '#052e2b', fontWeight: 700, borderRadius: '10px', padding: '7px 12px', border: '1px solid var(--teal)' }
          : { border: '1px solid var(--line)', borderRadius: '10px', padding: '7px 12px' },
        onclick: () => { READ_MODE[t.id] = 'fill'; onRefresh(); }
      }, '✍️ Điền từ vào hội thoại (' + fills.length + ')') : null
    );
    out.push(h('div', { class: 'card stack', style: { gap: '12px' } },
      h('p', { class: 'label', style: { margin: 0 } }, '📝 Thực hành Đọc hiểu hội thoại'),
      modeRow,
      mode === 'mcq' ? renderSkillsMcqPanel(code, t, quizzes, onRefresh) : renderSkillsFillPanel(code, t, fills, onRefresh)
    ));
  }

  const exVocab = (t.vocab || []).filter((v) => v.ex);
  if (exVocab.length) {
    out.push(h('div', { class: 'card stack', style: { gap: '10px' } },

      const k = kws.find((w) => e[0].includes(w) && e[0].replace(w, '').replace(/[，、。？！\s]/g, '').length >= 2);

function gqBuild(levelKey, onlyWrong, code = S.lang) {

  const weighted = shuffle(pts).sort((a, b) => (st.wrong[b.gid] ? 1 : 0) - (st.wrong[a.gid] ? 1 : 0));

      h('div', { class: 'row between' }, h('span', { class: 'chip' }, 'Câu ' + (i + 1) + '/' + qs.length), h('span', { class: 'chip good' }, q.p.lv)),

          '• Mục tiêu: Học cách người bản ngữ tư duy và sử dụng tiếng Anh trong thực tế.\n• Cách đọc: Đọc chậm, phân tích từ vựng kèm collocations, mổ xẻ ngữ pháp và cấu trúc câu.\n• Ưu điểm: Đọc ít nhưng học được nhiều, phục vụ trực tiếp cho cả 4 kỹ năng Nghe–Nói–Đọc–Viết.'
        )

  );

  const stepsList = h('div', { class: 'stack', style: { gap: '10px' } },
    h('div', { class: 'row between', style: { alignItems: 'center' } },
      h('h3', { style: { margin: 0, fontSize: '1.1rem' } }, '📋 Quy trình 8 bước thực hành Deep Reading mỗi ngày'),
      h('span', { class: 'small muted' }, '8 bước chuẩn hóa')
    ),
    ...steps.map((s) => h('div', { class: 'panel card stack', style: { gap: '8px', padding: '14px', borderRadius: '12px', background: 'var(--surface)' } },
      h('div', { class: 'row between wrap', style: { alignItems: 'center', gap: '6px' } },
        h('div', { class: 'row', style: { gap: '8px', alignItems: 'center' } },
          h('span', { style: { display: 'inline-flex', width: '26px', height: '26px', borderRadius: '50%', background: 'var(--teal)', color: '#fff', alignItems: 'center', justifyContent: 'center', fontSize: '.85rem', fontWeight: 700 } }, s.num),
          h('b', { style: { fontSize: '1rem', color: 'var(--ink)' } }, s.title)

      h('p', { class: 'small', style: { margin: 0, lineHeight: 1.55 } }, s.desc),
      h('div', { class: 'panel', style: { background: 'var(--sunk)', borderRadius: '8px', padding: '10px', fontSize: '.84rem', lineHeight: 1.5, whiteSpace: 'pre-line' } },
        s.key
      )
    ))
  );

  const scheduleCard = h('div', { class: 'panel card stack', style: { gap: '10px', background: 'var(--surface)', borderRadius: '12px', padding: '14px' } },
    h('div', { class: 'row between', style: { alignItems: 'center' } },
      h('b', { style: { fontSize: '1.05rem', color: 'var(--teal)' } }, '⏱️ Thời gian biểu Deep Reading (15–20 phút/ngày)'),
      h('span', { class: 'chip good small' }, 'Lộ trình tối ưu')
    ),
    h('p', { class: 'small muted', style: { margin: 0 } },
      'Bạn không nhất thiết phải làm hết cả 8 bước nếu quỹ thời gian hạn hẹp. Dưới đây là phân bổ thời gian thực chiến hàng ngày:'
    ),
    h('div', { class: 'stack', style: { gap: '6px' } },
      ...schedule.map((item) => h('div', { class: 'row between align-center', style: { background: 'var(--sunk)', padding: '8px 12px', borderRadius: '8px', gap: '8px' } },
        h('div', { class: 'row', style: { gap: '8px', alignItems: 'center' } },
          h('span', {}, item.icon),
          h('span', { class: 'small', style: { fontWeight: 500 } }, item.act)
        ),
        h('b', { class: 'chip accent small', style: { flexShrink: 0 } }, item.time)
      ))
    ),
    h('p', { class: 'small muted', style: { margin: '4px 0 0 0', lineHeight: 1.45, fontStyle: 'italic' } },
      '💡 Lời khuyên: Khi có ít thời gian, hãy ưu tiên: Đọc hiểu ➔ Vocabulary & Collocations. Khi có nhiều thời gian hơn vào cuối tuần, mổ xẻ sâu thêm Cấu trúc câu, Cách liên kết đoạn văn và Ngữ pháp.'
    )
  );

  const summaryCard = h('div', { class: 'panel stack', style: { background: 'rgba(16, 185, 129, 0.08)', border: '1px solid #10b981', borderRadius: '12px', padding: '14px', gap: '8px' } },
    h('b', { style: { color: '#047857', fontSize: '1.02rem' } }, '🌟 Triết lý: Đọc ít hơn nhưng học được nhiều hơn'),
    h('p', { class: 'small', style: { margin: 0, lineHeight: 1.6 } },
      '“Một người có thể đọc hàng chục bài viết mỗi ngày nhưng chỉ nhớ được rất ít từ và cấu trúc mới. Ngược lại, việc dành thời gian nghiên cứu kỹ một bài viết có thể giúp bạn học được Vocabulary, Collocations, Sentence Structures, Paragraph Organization và Grammar từ cùng một nguồn duy nhất.”'
    ),
    h('p', { class: 'small', style: { margin: 0, fontWeight: 600, color: '#047857' } },
      '👉 Đọc chậm hơn, phân tích kỹ hơn và quan trọng nhất: Đừng chỉ học xem tác giả nói gì — hãy học cách tác giả sử dụng tiếng Anh để nói điều đó!'
    )
  );

  return h('div', { class: 'stack', style: { gap: '14px' } },
    banner,
    compareCard,
    stepsList,
    scheduleCard,
    summaryCard
  );
}

function guideAccordionItem({ id, icon, title, subtitle, tag, content, defaultOpen = false }) {

      gap: '12px'
    }
  },
    h('div', { class: 'row', style: { gap: '12px', alignItems: 'center', flex: 1, minWidth: 0 } },
      h('span', { style: { fontSize: '1.45rem', flexShrink: 0 } }, icon),
      h('div', { style: { minWidth: 0, flex: 1 } },
        h('b', { style: { fontSize: '1rem', color: 'var(--ink)', display: 'block', lineHeight: 1.35 } }, title),
        subtitle ? h('p', { class: 'small muted', style: { margin: '3px 0 0 0', lineHeight: 1.35, fontSize: '.83rem' } }, subtitle) : null
      )
    ),
    h('div', { class: 'row', style: { gap: '8px', alignItems: 'center', flexShrink: 0 } },
      tag ? h('span', { class: 'chip small', style: { fontWeight: 600 } }, tag) : null,
      h('span', { class: 'guide-arrow', style: { color: 'var(--teal)', fontWeight: 700, fontSize: '.95rem' } }, '▾')
    )
  );

  const bodyEl = h('div', {
    class: 'guide-body stack',
    style: {
      padding: '16px',
      borderTop: '1px solid var(--line)',
      gap: '14px',
      background: 'var(--surface)'
    }
  }, content);

  const detailsAttrs = {
    class: 'panel card guide-accordion-item',
    style: {
      padding: 0,
      borderRadius: '14px',
      overflow: 'hidden',
      background: 'var(--surface)',

  return h('details', detailsAttrs, summaryEl, bodyEl);
}

  return h('div', { class: 'stack', style: { gap: '14px' } },
    h('div', { class: 'panel stack', style: { background: 'rgba(15, 82, 87, 0.08)', border: '1px solid var(--teal)', borderRadius: '12px', padding: '14px', gap: '6px' } },
      h('div', { class: 'row between wrap', style: { alignItems: 'center', gap: '6px' } },
        h('b', { style: { color: 'var(--teal)', fontSize: '1rem' } }, '🎯 Cẩm nang 26 câu hỏi phỏng vấn Remote Job & The Coach'),
        h('span', { class: 'chip good' }, 'B2 Thương mại · 26 câu hỏi')
      ),
      h('p', { class: 'small', style: { margin: 0, lineHeight: 1.5 } },
        'Trọn bộ câu hỏi và câu trả lời mẫu tiếng Anh phỏng vấn các vị trí làm việc từ xa: Account Management, Customer Success, Sales Coordination và Order Management. Bấm vào từng câu để xem câu trả lời chi tiết và bấm loa 🔊 để nghe phát âm mẫu!'
      )
    ),
    h('div', { class: 'stack', style: { gap: '8px' } },
      h('b', { style: { fontSize: '.95rem', color: 'var(--teal)' } }, '🌟 Phần 1: Giới thiệu bản thân & Vị trí công việc (The Coach)'),
      qItem('01', 'Tell me about yourself / Walk me through your experience.', 'Giới thiệu bản thân và tóm lược quá trình làm việc 9 năm', 'I have 9 years of experience across Sales Administration, Furniture Merchandising, and B2B Account Management. My work has focused on customer communication, order processing, quotations, ERP updates, production follow-up, shipping documents, and issue resolution. I have worked with international customers and internal teams to make sure orders move smoothly and customers receive clear updates. I am now looking for a remote role in Account Management, Customer Success, Sales Coordination, Order Management, or B2B Customer Support, where I can use my follow-up, communication, and coordination skills.', 'Pitch 9 năm'),
      qItem('02', 'Which department are you in and what does your department mainly do?', 'Bạn thuộc bộ phận nào và bộ phận của bạn chủ yếu phụ trách công việc gì?', "I'm in the sales and account management department, where we mainly support international customers, manage orders, and coordinate with internal teams. We work closely with production, logistics, and quality teams to make sure orders move smoothly and customers receive timely updates.", 'The Coach'),
      qItem('03', 'What is the most exciting part of your job?', 'Phần thú vị nhất trong công việc hàng ngày của bạn là gì?', 'I find dealing with customers the most exciting part of my job because I enjoy understanding their needs and solving problems with the team. I also like brainstorming ideas with the team when we need to resolve a bottleneck or improve a process.', 'The Coach'),
      qItem('04', 'What is your least favorite part of the job?', 'Điều bạn ít thích nhất trong công việc là gì và cách bạn xử lý?', 'My least favorite part is paperwork and repetitive tasks, but I understand they are necessary to keep operations smooth. I always try to stay organized and complete them carefully so the rest of the order process can move without delay.', 'The Coach')
    ),
    h('div', { class: 'stack', style: { gap: '8px' } },
      h('b', { style: { fontSize: '.95rem', color: 'var(--teal)' } }, '💼 Phần 2: 16 Câu hỏi phỏng vấn chung & Kỹ năng vận hành'),
      qItem('05', 'Why Account Management or Customer Success?', 'Tại sao bạn lại quan tâm đến vị trí Quản lý tài khoản / Customer Success?', 'My background is in B2B Account Management, but the strongest part of my experience is order management, customer communication, delivery follow-up, ERP updates, and coordination with internal teams. That is why I am interested in Account Management and Customer Success. I want a remote role where I can use my follow-up, documentation, and customer communication skills to support daily operations, service quality, and long-term customer relationships.'),
      qItem('06', 'What did you do in your most recent role at ANCO Pottery?', 'Bạn đã đảm nhiệm những công việc gì trong vai trò gần đây nhất?', 'In my most recent Account Management role at ANCO Pottery, I supported international B2B customers from order confirmation to shipment. I confirmed customer requirements, updated orders in ERP, followed up with the factory, checked labels and packaging, and coordinated inspections. I also kept customers updated when there was a change, delay risk, or issue that needed attention.'),
      qItem('07', 'How do you manage an order from confirmation to shipment?', 'Quy trình quản lý đơn hàng từ lúc nhận đơn đến khi xuất hàng?', 'First, I confirm the customer requirements and make sure the information is complete. Then I update the order in the system and coordinate with the factory or internal teams on production timing, labels, packaging, inspection, and documents. I follow up on changes or risks, keep clear notes, and update the customer until the order or request is completed.'),
      qItem('08', 'Tell me about a difficult customer request. (Lyprodan Case)', 'Xử lý yêu cầu khó của khách hàng khi vượt quá khả năng sản xuất?', 'At Lyprodan, a key customer asked for changes to the mold, shape, color, and finishing. Some changes were not feasible, so I checked with the internal team, explained the limitation clearly, and offered practical options using existing designs and finishing choices. The customer accepted the solution, placed orders, and continued working with us.', 'STAR'),
      qItem('09', 'How do you handle a delivery risk?', 'Xử lý khi phát hiện nguy cơ trễ tiến độ giao hàng?', 'I first check the real reason for the risk and confirm the updated timeline with the factory or related team. Then I look for possible solutions and inform the customer early. If the timeline needs to change, I explain the situation honestly and agree on a realistic next step. I prefer clear communication instead of making a promise that may affect quality or service.'),
      qItem('10', 'How do you prioritize multiple customers and urgent orders?', 'Cách sắp xếp thứ tự ưu tiên khi có nhiều khách hàng và đơn hàng gấp?', 'I prioritize based on urgency, customer impact, deadline risk, and which task can block other work. I review the schedule regularly, keep clear notes, and follow up early with the factory or related teams. For urgent issues, I focus on the next action first and make sure the customer receives a clear update.'),
      qItem('11', 'How do you ensure data accuracy across ERP and documents?', 'Làm thế nào bạn đảm bảo độ chính xác dữ liệu trên ERP?', 'I check the latest customer-approved information before updating an order or customer record, especially product details, labels, packaging, quantity, and delivery dates. I compare the information with order documents and keep clear records of changes. I always use the latest approved version as the single source of truth.'),
      qItem('12', 'Tell me about a mistake you made. (ANCO Pottery $200 Error)', 'Kể về một sai sót trong công việc và cách bạn chịu trách nhiệm giải quyết?', 'At ANCO Pottery, I used old handover information instead of the latest approved label and carton version. I took responsibility, informed the customer, proposed a correction solution using carton decals, and coordinated with Purchasing and the factory. The customer accepted the solution, the order was delivered on time, and I added a stricter checking step to avoid the same issue again.', 'STAR'),
      qItem('13', 'What tools have you used to manage customer and order information?', 'Những công cụ phần mềm bạn đã thành thạo?', 'I have used ERP systems, MISA AMIS, and Base to manage customer, order, and internal task information. I also use Microsoft Office and cloud-based storage to organize files, reports, and shared documents. These tools help me keep information updated, follow up on work, and reduce missed details.'),
      qItem('14', 'Why do you want remote work?', 'Tại sao bạn lại hướng tới công việc làm từ xa (Remote)?', 'I am looking for a role that is remote, hybrid, or based in Ho Chi Minh City, preferably near Binh Thanh. My previous roles were factory-based in Binh Duong and required onsite work six days a week, so the commute took significant time. I want to use my time more productively while continuing to support customers through clear communication, documentation, and follow-up.'),
      qItem('15', 'What is your development area?', 'Điểm bạn đang muốn tiếp tục trau dồi và học hỏi thêm?', 'My direct experience is stronger in B2B operations, order management, and ERP than in modern CRM tools or SaaS Customer Success. However, I have used MISA AMIS, Base, Microsoft Office, and cloud tools, and I have completed Customer Success training. I am ready to learn a new product, system, and process quickly.'),
      qItem('16', 'Why did you leave your previous company?', 'Lý do bạn tìm kiếm cơ hội công việc mới?', 'I learned a lot from my previous roles, especially about international B2B customers, order coordination, and working with factories. Most of my previous roles were factory-based and required onsite work six days a week, so the commute took significant time. I am now looking for a remote, hybrid, or Ho Chi Minh City-based role where I can grow in a more international and dynamic environment.'),
      qItem('17', 'Why should we hire you?', 'Tại sao công ty nên lựa chọn tuyển dụng bạn?', 'I bring 9 years of practical B2B experience in customer communication, order coordination, data accuracy, and issue resolution. I am careful with details, proactive with follow-up, and comfortable working with different internal teams. I can support daily customer operations well, and I can learn new systems quickly.'),
      qItem('18', 'What are your strengths and weakness?', 'Điểm mạnh lớn nhất và điểm yếu cần cải thiện?', 'My strengths are follow-up, attention to detail, and coordination. I am careful with order information, customer requirements, and deadlines. As for my weakness, sometimes I can be nervous when speaking English in an interview, especially when I want to give a perfect answer. I am improving this by preparing short answers, practising out loud, and focusing on clear communication instead of perfect grammar.'),
      qItem('19', 'How do you handle pressure or tight deadlines?', 'Cách bạn đối phó với áp lực và deadline gấp rút?', 'I first check what is most urgent and what can affect the customer or delivery timeline. Then I confirm the facts with the related team, focus on the next action, and update the customer clearly. I try to stay calm, organize the work by priority, and avoid making promises before I confirm the real situation.'),
      qItem('20', 'What are your salary expectations?', 'Kỳ vọng về mức lương và chế độ đãi ngộ?', 'I am open to discussing based on the role scope, working arrangement, and benefits. My priority is to find a good long-term fit where I can contribute my B2B customer support, order coordination, and follow-up experience. I would be happy to understand the company budget for this position first.')
    ),
    h('div', { class: 'stack', style: { gap: '8px' } },
      h('b', { style: { fontSize: '.95rem', color: 'var(--teal)' } }, '🎯 Phần 3: 6 Tình huống Customer Success & Quản lý tài khoản'),
      qItem('21', 'How would you support a new customer during onboarding?', 'Hỗ trợ khách hàng mới trong giai đoạn tiếp nhận (onboarding)?', "I would first understand the customer's goal, workflow, and main difficulty. Then I would explain the process in simple steps, give a practical example, and confirm the next action. After that, I would follow up regularly and coordinate with the right internal team if there is a blocker.", 'CS'),
      qItem('22', 'How would you manage a customer at risk?', 'Xử lý và giữ chân khách hàng có nguy cơ rời bỏ (customer at risk)?', 'I would first understand the reason for the risk, such as low usage, an unresolved issue, or unclear expectations. I would confirm the facts with the customer and internal teams, then agree on a recovery plan with clear actions and deadlines. I would follow up until the issue is resolved.', 'CS'),
      qItem('23', 'How would you manage a high-volume customer portfolio?', 'Quản lý danh mục nhiều khách hàng cùng lúc mà không bị sót việc?', 'I would organize customers by priority, such as customer impact, delivery or adoption risk, and the next required action. I would keep accurate notes and use a clear follow-up schedule, so important tasks are not missed. For urgent issues, I would focus on the immediate action first and communicate clearly with the customer and internal teams.', 'CS'),
      qItem('24', 'How would you use customer data or a health score?', 'Ứng dụng dữ liệu và điểm sức khỏe khách hàng (health score)?', 'I would use the data to understand whether customers are active, using key features, or facing repeated issues. If I saw a risk signal, I would check the reason, contact the customer early, and agree on the next step. My direct experience is in ERP and order data, but I am ready to learn each company’s customer-health process.', 'CS'),
      qItem('25', 'How do you learn a new system or product?', 'Phương pháp học nhanh phần mềm và sản phẩm mới?', 'I first learn the main workflow and the most important customer tasks. Then I practise with real examples, take clear notes, and ask questions when I need clarification. My experience with ERP, MISA AMIS, Base, and cloud-based tools has helped me become comfortable learning new systems.', 'CS'),
      qItem('26', 'How do you improve a recurring customer issue?', 'Cải tiến và ngăn chặn vấn đề lặp đi lặp lại của khách hàng?', 'I document the issue clearly, check the root cause with the related teams, and suggest a practical solution. Then I discuss it in an internal meeting and follow up on the result. I used this approach in my previous work to help improve label and order-detail checking.', 'CS')
    ),
    h('div', { class: 'stack', style: { gap: '8px' } },
      h('b', { style: { fontSize: '.95rem', color: 'var(--teal)' } }, '❓ Phần 4: 4 Câu hỏi ngược xuất sắc cho nhà tuyển dụng (Reverse Questions)'),
      h('div', { class: 'panel', style: { background: 'var(--sunk)', borderRadius: '10px', padding: '12px', gap: '8px' } },
        h('b', { style: { color: 'var(--teal)' } }, '1. Thành công trong 90 ngày đầu tiên:'),
        h('p', { class: 'small', style: { margin: '2px 0 0 0', fontStyle: 'italic', color: 'var(--ink)' } }, '“What would success look like in the first 90 days in this role? What key priorities should the new team member focus on first?”'),
        h('b', { style: { color: 'var(--teal)', marginTop: '8px', display: 'block' } }, '2. Thách thức lớn nhất trong khâu onboarding của khách:'),

        h('b', { style: { color: 'var(--teal)', marginTop: '8px', display: 'block' } }, '4. Công cụ theo dõi sức khỏe khách hàng:'),
        h('p', { class: 'small', style: { margin: '2px 0 0 0', fontStyle: 'italic', color: 'var(--ink)' } }, '“Which tools or systems does the team currently use to manage customer health, order status, and cross-functional communication?”')

    ),
    h('div', { class: 'stack', style: { gap: '8px' } },
      h('b', { style: { fontSize: '.95rem', color: 'var(--teal)' } }, '🚀 Phần 5: 3 Câu chuyện thực chiến theo khung STAR (Verified STAR Stories)'),
      h('div', { class: 'panel', style: { background: 'var(--sunk)', borderRadius: '10px', padding: '12px', gap: '6px' } },

function knowledgeTabView() {
  const code = S.lang;
  if (code === 'en') {
    return renderEnglishKnowledgeView();
  }

  const isJa = code === 'ja';
  const subtabs = isJa
    ? [
        { k: 'gram', label: '📖 Ngữ pháp JLPT' },
        { k: 'chars', label: '🈴 Chữ Hán Kanji' },
        { k: 'kana', label: '🔤 Bảng chữ cái' }
      ]
    : [
        { k: 'gram', label: '📖 Ngữ pháp HSK' },
        { k: 'read301', label: '💬 Hội thoại & Đọc 301' },
        { k: 'chiet_tu', label: '🧩 Chiết tự & Mẹo nhớ chữ' },
        { k: 'chars', label: '🈴 Bộ thủ & Bút thuận' }
      ];

  if (!subtabs.some((st) => st.k === KNOWLEDGE_TAB)) {
    KNOWLEDGE_TAB = 'gram';
  }

  const header = h('div', { class: 'stack', style: { gap: '4px' } },
    h('div', { class: 'row between', style: { alignItems: 'center' } },
      h('p', { class: 'label', style: { margin: 0 } }, isJa ? 'Kiến thức Tiếng Nhật' : 'Kiến thức Tiếng Trung'),
      h('div', { class: 'row', style: { gap: '6px', alignItems: 'center' } },
        feedbackBtn({ mode: 'knowledge_tab' }),
        langSwitch()
      )
    ),
    h('h1', { style: { margin: 0 } }, isJa ? 'Kiến thức & Ngữ pháp JLPT' : 'Kiến thức, Ngữ pháp & Đọc 301'),
    h('p', { class: 'muted small', style: { margin: '2px 0 0 0' } },
      isJa
        ? 'Tổng hợp ngữ pháp chuẩn JLPT N5–N1, tra cứu Kanji theo nét và bảng chữ cái Kana.'
        : 'Tổng hợp ngữ pháp HSK 1–6, hội thoại đọc hiểu 301, chiết tự chữ Hán, 214 bộ thủ Khang Hy và quy tắc bút thuận.'
    )
  );

  const navSub = h('div', { class: 'skill-tabs', style: { margin: '6px 0 12px 0' } },
    ...subtabs.map((st) => h('button', {
      class: 'skill-tab-btn' + (KNOWLEDGE_TAB === st.k ? ' active' : ''),
      onclick: () => { KNOWLEDGE_TAB = st.k; knowledgeTabView(); }
    }, st.label))
  );

  let body = null;
  if (KNOWLEDGE_TAB === 'gram') body = renderKnowledgeGrammar(code);
  else if (KNOWLEDGE_TAB === 'read301') body = h('div', { class: 'stack-lg' }, ...renderReadSkillsRich(code, DATA[code], () => knowledgeTabView()));
  else if (KNOWLEDGE_TAB === 'chiet_tu') body = renderKnowledgeChietTu(code);
  else if (KNOWLEDGE_TAB === 'chars') body = renderKnowledgeChars(code);
  else if (KNOWLEDGE_TAB === 'kana') body = renderKnowledgeKana(code);

  mount(h('div', { class: 'stack-lg' }, header, navSub, body));
}

function renderKnowledgeGrammar(code) {
  const isJa = code === 'ja';
  const langAttr = LANGS[code].lang;
  const lvs = GRAM_LEVELS[code] || [];
  const pts = grammarPoints(code);
  const st = gqStore();
  const sel = GQ[code] || 'all';
  const qText = (GQ_SEARCH[code] || '').trim().toLowerCase();

  const matchQuery = (x) => {
    if (!qText) return true;
    const haystack = [
      x.g.t, x.g.zh, x.g.f, ...(x.g.notes || []),
      ...x.g.ex.flatMap(e => [e[0], e[1], e[2]]),
      x.topics.map(t => (t.sub || t.title)).join(' ')
    ].join(' ').toLowerCase();
    return haystack.includes(qText);
  };

  const shown = pts.filter((x) => (sel === 'all' || x.lv === sel) && matchQuery(x));
  const count = (lv) => pts.filter((x) => x.lv === lv).length;
  const nWrong = pts.filter((x) => (sel === 'all' || x.lv === sel) && st.wrong[x.gid]).length;
  const bestVal = st.best[code + ':' + sel] != null ? st.best[code + ':' + sel] : (code === 'zh' ? st.best[sel] : null);
  const chip = (key, label) => h('button', {
    class: 'mini' + (sel === key ? ' primary' : ' ghost'),
    'aria-pressed': String(sel === key),
    onclick: () => { GQ[code] = key; knowledgeTabView(); }
  }, label);

  const toggleAll = () => {
    const details = document.querySelectorAll('.stack-lg details.gram');
    const anyClosed = [...details].some((d) => !d.open);
    details.forEach((d) => { d.open = anyClosed; });
    const btn = document.getElementById('toggle-gram-btn');
    if (btn) btn.textContent = anyClosed ? 'Thu gọn tất cả' : 'Mở tất cả';
  };

  return h('div', { class: 'stack-lg', style: { gap: '12px' } },
    h('div', { class: 'row', style: { gap: '8px', alignItems: 'center' } },
      h('input', {
        type: 'search',
        class: 'gram-search-input',
        style: { flex: 1, minHeight: '44px', padding: '10px 14px' },
        placeholder: code === 'en' ? '🔍 Tìm kiếm ngữ pháp A1–C1, công thức, ví dụ...' : (isJa ? '🔍 Tìm kiếm ngữ pháp N5–N1, từ khóa, ví dụ...' : '🔍 Tìm kiếm ngữ pháp HSK 1–6, từ khóa, ví dụ...'),
        value: GQ_SEARCH[code] || '',
        oninput: (e) => {
          GQ_SEARCH[code] = e.target.value;
          knowledgeTabView();
          const el = document.querySelector('.gram-search-input');
          if (el) { el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
        }
      }),
      GQ_SEARCH[code] ? h('button', { class: 'ghost mini', onclick: () => { GQ_SEARCH[code] = ''; knowledgeTabView(); } }, 'Xóa tìm') : null
    ),
    h('div', { class: 'row', style: { flexWrap: 'wrap', gap: '6px' } },
      chip('all', 'Tất cả (' + pts.length + ')'),
      ...lvs.filter((lv) => count(lv)).map((lv) => chip(lv, (code === 'en' ? lv : (isJa ? lv : lv.replace('HSK ', ''))) + ' (' + count(lv) + ')'))
    ),
    code !== 'en' ? h('div', { class: 'panel stack', style: { background: 'var(--surface)', borderRadius: '12px', padding: '14px' } },
      h('h2', { style: { margin: 0, fontSize: '1.05rem' } }, '🎯 Luyện Quiz Ngữ Pháp'),
      h('p', { class: 'small muted', style: { margin: '4px 0 8px 0' } }, '10 câu trắc nghiệm: điền từ đúng vào cấu trúc câu hoặc sắp xếp từ.' + (bestVal != null ? ' Điểm cao nhất: ' + bestVal + '/10.' : '')),
      h('div', { class: 'row', style: { gap: '8px' } },
        h('button', { class: 'primary grow', onclick: () => grammarQuizView(sel, false) }, 'Làm quiz · ' + (sel === 'all' ? 'Tất cả cấp' : sel)),
        nWrong > 0 ? h('button', { class: 'accent', onclick: () => grammarQuizView(sel, true) }, 'Ôn ' + nWrong + ' điểm hay sai') : null
      )
    ) : null,
    h('div', { class: 'row between', style: { alignItems: 'center', marginTop: '4px' } },
      h('span', { class: 'small muted' }, qText ? ('Tìm thấy ' + shown.length + '/' + pts.length + ' điểm ngữ pháp') : (shown.length + ' điểm ngữ pháp')),
      shown.length > 0 && h('button', { id: 'toggle-gram-btn', class: 'ghost mini', onclick: toggleAll }, 'Mở tất cả')
    ),
    shown.length === 0 ? h('p', { class: 'note center' }, 'Không tìm thấy điểm ngữ pháp nào phù hợp với “' + qText + '”.') : null,
    ...shown.map((x) => h('details', { class: 'panel gram', style: { borderRadius: '12px' } },
      h('summary', { style: { cursor: 'pointer', fontWeight: 600 } },
        x.g.t, ' ', h('span', { class: 'chip good', style: { fontSize: '.7rem' } }, x.lv)
      ),
      h('div', { class: 'gram', style: { marginTop: '8px' } },
        x.g.zh && h('p', { lang: langAttr, class: 'muted', style: { fontWeight: 500 } }, x.g.zh),
        x.g.f && h('p', { class: 'pat', lang: langAttr }, x.g.f),
        ...(x.g.notes || []).map((n) => h('p', { style: { margin: '4px 0' } }, n)),
        ...x.g.ex.map((e) => h('div', { class: 'ex', style: { margin: '6px 0', padding: '8px', background: 'var(--sunk)', borderRadius: '8px' } },
          h('p', { lang: langAttr, style: { margin: 0, fontWeight: 500 } }, e[0], ' ', spk(code, e[0])),
          h('p', { class: 'small read', style: { textAlign: 'left', margin: '2px 0' } }, e[1]),
          h('p', { class: 'small muted', style: { margin: 0 } }, e[2])
        )),
        (x.topics && x.topics.length ? h('p', { class: 'small muted', style: { marginTop: '6px' } }, 'Gặp trong: ' + x.topics.map((t) => t.sub || t.title).join(' · ')) : null)
      )
    ))
  );
}

// Đồng hồ bấm giờ thi thử chuẩn format HSKK
function createHskkTimer(prepSec, speakSec) {
  const box = h('div', { class: 'panel', style: { background: 'var(--sunk)', borderRadius: '10px', padding: '8px 12px', margin: '4px 0', border: '1px solid var(--line)' } });
  let state = 'idle'; // 'idle', 'prep', 'speaking', 'done'
  let interval = null;
  let remaining = 0;

  const statusEl = h('b', { style: { fontSize: '.84rem', color: 'var(--teal)' } }, '⏱️ ' + (prepSec ? 'Chuẩn bị ' + prepSec + 's ➔ ' : '') + 'Nói ' + speakSec + 's');
  const timerBadge = h('span', { class: 'chip small', style: { display: 'none', fontWeight: 700 } });
  const actionBtn = h('button', { class: 'mini ghost', style: { fontWeight: 600 } }, '▶ Bấm giờ thi');
  const skipBtn = h('button', { class: 'mini accent', style: { display: 'none' } }, 'Nói ngay ➔');

  function updateDisplay() {
    const m = String(Math.floor(remaining / 60)).padStart(2, '0');
    const s = String(remaining % 60).padStart(2, '0');
    if (state === 'prep') {
      timerBadge.style.display = 'inline-block';
      timerBadge.className = 'chip small';
      timerBadge.style.background = '#f59e0b';
      timerBadge.style.color = '#000';
      timerBadge.textContent = '⏳ Chuẩn bị: ' + m + ':' + s;
      skipBtn.style.display = 'inline-block';
      actionBtn.textContent = '⏹ Dừng';
    } else if (state === 'speaking') {
      timerBadge.style.display = 'inline-block';
      timerBadge.className = 'chip small';
      timerBadge.style.background = remaining <= 10 ? 'var(--bad)' : 'var(--teal)';
      timerBadge.style.color = '#fff';
      timerBadge.textContent = '🎙️ Đang nói: ' + m + ':' + s;
      skipBtn.style.display = 'none';
      actionBtn.textContent = '⏹ Dừng';
    } else if (state === 'done') {
      timerBadge.style.display = 'inline-block';
      timerBadge.className = 'chip good small';
      timerBadge.style.background = '';
      timerBadge.style.color = '';
      timerBadge.textContent = '✓ Đã hết giờ!';
      skipBtn.style.display = 'none';
      actionBtn.textContent = '↺ Bấm lại';
    } else {
      timerBadge.style.display = 'none';
      skipBtn.style.display = 'none';
      actionBtn.textContent = '▶ Bấm giờ thi';
    }
  }

  function startSpeaking() {
    state = 'speaking';
    remaining = speakSec;
    updateDisplay();
    clearInterval(interval);
    interval = setInterval(() => {
      remaining--;
      if (remaining <= 0) {
        clearInterval(interval);
        state = 'done';
        updateDisplay();
      } else {
        updateDisplay();
      }
    }, 1000);
  }

  function startTimer() {
    if (prepSec > 0) {
      state = 'prep';
      remaining = prepSec;
      updateDisplay();
      clearInterval(interval);
      interval = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          startSpeaking();
        } else {
          updateDisplay();
        }
      }, 1000);
    } else {
      startSpeaking();
    }
  }

  actionBtn.onclick = () => {
    if (state === 'idle' || state === 'done') {
      startTimer();
    } else {
      clearInterval(interval);
      state = 'idle';
      updateDisplay();
    }
  };

  skipBtn.onclick = () => {
    startSpeaking();
  };

  box.replaceChildren(
    h('div', { class: 'row between wrap', style: { alignItems: 'center', gap: '8px' } },
      h('div', { class: 'row', style: { gap: '8px', alignItems: 'center', flexWrap: 'wrap' } }, statusEl, timerBadge),
      h('div', { class: 'row', style: { gap: '6px', alignItems: 'center' } }, skipBtn, actionBtn)
    )
  );
  return box;
}

// Bộ luyện nói & chấm điểm AI chuẩn kỳ thi HSKK (giống giao diện bài học)
function createHskkSpeakingPractice(item, curData, targetText) {
  const box = h('div', {
    class: 'panel stack',
    style: {
      background: 'rgba(15, 82, 87, 0.05)',
      borderRadius: '12px',
      padding: '12px',
      margin: '8px 0',
      gap: '8px',
      border: '1px solid rgba(15, 82, 87, 0.18)'
    }
  });

  const spokenKey = 'zh:hskk:' + curData.id + '-q' + item.qId;
  const initBest = S.spoken[spokenKey];
  let attempts = 0;
  let currentBest = initBest || 0;

  const headerEl = h('div', { class: 'row between wrap', style: { alignItems: 'center', gap: '6px' } },
    h('div', { class: 'row', style: { alignItems: 'center', gap: '6px', flexWrap: 'wrap' } },
      h('span', { class: 'label', style: { color: 'var(--teal)', fontWeight: 700, margin: 0, fontSize: '.84rem' } }, '🎙️ Luyện nói theo mẫu & Chấm điểm AI'),
      currentBest > 0 ? h('span', { class: 'chip good small', style: { fontWeight: 700 } }, 'Kỷ lục: ' + currentBest + '%') : null
    ),
    h('div', { class: 'row', style: { gap: '4px' } },
      spk('zh', targetText),
      spk('zh', targetText, { slow: true })
    )
  );

  const cleanTarget = plain(targetText);
  const wordsBox = h('div', {
    class: 'words',
    lang: 'zh-Hans',
    style: {
      fontSize: cleanTarget.length > 60 ? '1.08rem' : (cleanTarget.length > 25 ? '1.25rem' : '1.5rem'),
      lineHeight: 1.6,
      justifyContent: 'center',
      textAlign: 'center',
      margin: '4px 0'
    }
  }, cleanTarget);

  const hintEl = h('p', { class: 'center small muted', style: { margin: '2px 0' } },
    currentBest > 0 ? 'Bấm micro để nói lại và nâng cao điểm' : 'Bấm micro rồi đọc to câu trả lời bằng tiếng Trung'
  );

  const micBtn = h('button', {
    class: 'mic',
    'aria-label': 'Bấm để nói tiếng Trung',
    style: { width: '74px', height: '74px', margin: '4px auto', display: 'flex', alignItems: 'center', justifyContent: 'center' },
    onclick: async (e) => {
      const b = e.currentTarget;
      if (b.classList.contains('live')) {
        if (ACTIVE_STOP_FN) { ACTIVE_STOP_FN(); return; }
      }
      b.classList.add('live');
      hintEl.textContent = 'Đang nghe... Bạn hãy đọc to và rõ ràng câu trên';
      try {
        const said = await tryListen('zh', (interim) => {
          if (interim) hintEl.textContent = 'Đang nghe: “' + interim + '”';
        });
        b.classList.remove('live');
        hintEl.textContent = 'Bấm micro để nói lại và nâng cao điểm';
        if (said) {
          handleSpeechResult(said);
        }
      } catch (err) {
        b.classList.remove('live');
        hintEl.textContent = 'Bấm micro rồi đọc to câu trả lời bằng tiếng Trung';
      }
    }
  }, icon(ICON.speak));

  const selfBtn = h('button', {
    class: 'ghost mini',
    style: { opacity: .75, alignSelf: 'center', margin: '2px auto' },
    onclick: () => {
      attempts++;
      currentBest = Math.max(currentBest, 85);
      S.spoken[spokenKey] = currentBest;
      addXp(XP_ITEM, 'zh');
      checkAch();
      save();
      resultBox.replaceChildren(
        h('div', { class: 'score', style: { color: 'var(--good)', fontSize: '2rem', margin: '2px 0' } }, '85%'),
        h('p', { class: 'center small', style: { color: 'var(--good)', fontWeight: 600 } }, '✓ Đã ghi nhận bạn tự đọc to và hoàn thành câu nói!')
      );
    }
  }, 'Tự đọc (không dùng micro)');

  const resultBox = h('div', { class: 'stack center', style: { gap: '3px' } });

  if (currentBest > 0) {
    resultBox.replaceChildren(
      h('div', {
        class: 'score',
        style: {
          color: currentBest >= 80 ? 'var(--good)' : (currentBest >= 60 ? '#f59e0b' : 'var(--ink)'),
          fontSize: '2rem',
          margin: '2px 0'
        }
      }, currentBest + '%'),
      h('p', { class: 'center small muted', style: { margin: '2px 0' } }, 'Điểm cao nhất hiện tại: ' + currentBest + '% · Bấm Micro để nói lại và nâng cao điểm số!')
    );
  }

  function handleSpeechResult(said) {
    attempts++;
    const prevBest = currentBest;
    const a = align('zh', cleanTarget, said);
    const score = a.score;
    currentBest = Math.max(currentBest, score);
    S.spoken[spokenKey] = currentBest;
    addXp(score >= 70 ? XP_ITEM : 1, 'zh');
    checkAch();
    save();

    // Cập nhật từng chữ Hán: đúng (xanh lá), sai/thiếu (đỏ lượn sóng)
    wordsBox.replaceChildren(...a.units.map((w, idx) => h('span', { class: a.hit[idx] ? 'hit' : 'miss' }, w)));

    const isImproved = attempts > 1 && score > prevBest;
    const isLower = attempts > 1 && score < currentBest;

    resultBox.replaceChildren(
      h('div', {
        class: 'score',
        style: {
          color: score >= 80 ? 'var(--good)' : (score >= 60 ? '#f59e0b' : 'var(--bad)'),
          fontSize: '2.4rem',
          margin: '4px 0 2px 0'
        }
      }, score + '%'),
      isImproved
        ? h('p', { class: 'center small', style: { color: 'var(--good)', fontWeight: 700, margin: '2px 0' } }, '🎉 Điểm tăng: ' + prevBest + '% ➔ ' + score + '% (+' + (score - prevBest) + '%)!')
        : isLower
        ? h('p', { class: 'center small muted', style: { margin: '2px 0' } }, 'Lần nói này: ' + score + '% · Điểm cao nhất: ' + currentBest + '% (giữ nguyên)')
        : h('p', { class: 'center small muted', style: { margin: '2px 0' } }, 'Điểm cao nhất: ' + currentBest + '%'),
      h('p', { class: 'center small muted', lang: 'zh-Hans', style: { margin: '3px 0', lineHeight: 1.4 } }, 'Máy nghe được: “' + said + '”'),
      h('p', { class: 'center small', style: { margin: '3px 0' } },
        score >= 80
          ? 'Rất tốt! Bạn có thể luyện nói thêm câu khác, hoặc bấm Micro nói lại để nâng % cao hơn.'
          : (score >= 60
            ? 'Khá tốt! Chữ gạch đỏ uốn lượn là chữ máy chưa nghe rõ. Bạn hãy bấm Micro nói lại để cải thiện % điểm nhé!'
            : 'Chữ gạch đỏ là chữ máy chưa nghe rõ hoặc phát âm sai thanh điệu. Nghe loa mẫu rồi bấm Micro nói lại nhé!')),
      h('p', { class: 'center small muted', style: { fontSize: '.8rem', margin: '4px 0 0 0' } },
        'Đã thử ' + attempts + ' lần · Bấm Micro để nói lại không giới hạn'
      )
    );
  }

  // Tùy chọn thu âm phòng thi thực tế (accordion collapse)
  const mockRecordingDetails = h('details', { style: { marginTop: '6px', borderTop: '1px dashed var(--line)', paddingTop: '6px' } },
    h('summary', { style: { cursor: 'pointer', fontSize: '.82rem', color: 'var(--muted)', fontWeight: 600 } }, '🎙️ Tùy chọn: Thu âm bài thi thực tế (Nghe lại audio của bạn) ▾'),
    createHskkRecorder(item)
  );

  box.replaceChildren(
    headerEl,
    wordsBox,
    hintEl,
    micBtn,
    selfBtn,
    resultBox,
    mockRecordingDetails
  );

  return box;
}

// Bộ thu âm & nhận diện khẩu ngữ HSKK với MediaRecorder & Web Speech
function createHskkRecorder(item) {
  const box = h('div', { class: 'ielts-speak-recorder stack', style: { margin: '6px 0' } });
  let isRecording = false;
  let mediaRecorder = null;
  let recordedChunks = [];
  let stream = null;
  let timerInterval = null;
  let seconds = 0;
  let recognizedText = '';

  const statusLabel = h('p', { class: 'small muted', style: { margin: '0' } }, 'Bấm Micro để ghi âm câu trả lời tiếng Trung của bạn:');
  const timerBadge = h('span', { class: 'chip small', style: { display: 'none', background: 'var(--bad)', color: '#fff', fontWeight: 700 } }, '● Đang ghi âm: 00:00');
  const transcriptEl = h('div', { class: 'small', style: { display: 'none', background: 'rgba(15, 82, 87, 0.05)', padding: '8px 10px', borderRadius: '8px', lineHeight: 1.5, margin: '4px 0' } });
  const audioPlayerWrap = h('div', { style: { display: 'none', margin: '4px 0' } });

  const recordBtn = h('button', {
    class: 'primary mini',
    style: { display: 'inline-flex', alignItems: 'center', gap: '6px', fontWeight: 600 },
    onclick: async () => {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    }
  }, '🎙️ Bấm để ghi âm');

  async function startRecording() {
    isRecording = true;
    box.className = 'ielts-speak-recorder recording stack';
    recordBtn.className = 'accent mini';
    recordBtn.textContent = '⏹ Dừng ghi âm';
    timerBadge.style.display = 'inline-block';
    statusLabel.textContent = 'Đang ghi âm... Hãy nói to và rõ câu trả lời vào micro:';
    transcriptEl.style.display = 'block';
    transcriptEl.textContent = 'Đang nhận diện giọng nói (zh-CN)...';
    audioPlayerWrap.style.display = 'none';

    seconds = 0;
    timerBadge.textContent = '● Đang ghi âm: 00:00';
    timerInterval = setInterval(() => {
      seconds++;
      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      timerBadge.textContent = '● Đang ghi âm: ' + m + ':' + s;
    }, 1000);

    recordedChunks = [];
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) recordedChunks.push(e.data);
        };
        mediaRecorder.onstop = () => {
          const mime = (mediaRecorder && mediaRecorder.mimeType) || 'audio/webm';
          const blob = new Blob(recordedChunks, { type: mime });
          const url = URL.createObjectURL(blob);
          const aud = h('audio', { controls: 'controls', src: url, style: { width: '100%', height: '36px', marginTop: '4px' } });
          audioPlayerWrap.replaceChildren(
            h('p', { class: 'small muted', style: { margin: '2px 0', fontWeight: 600 } }, '🎧 Nghe lại phần nói khẩu ngữ vừa ghi âm của bạn:'),
            aud
          );
          audioPlayerWrap.style.display = 'block';
          if (stream) {
            try { stream.getTracks().forEach((t) => t.stop()); } catch (e) {}
          }
        };
        mediaRecorder.start();
      } catch (err) {
        console.log('MediaRecorder info:', err);
      }
    }

    tryListen('zh', (interim) => {
      if (isRecording) {
        transcriptEl.textContent = interim;
      }
    }).then((said) => {
      if (said) {
        recognizedText = said;
        const charCount = said.replace(/[\s\p{P}]/gu, '').length;
        transcriptEl.replaceChildren(
          h('p', { style: { margin: 0, fontWeight: 600 } }, '🗣️ Máy nghe được: “' + said + '”'),
          h('div', { class: 'row between wrap', style: { marginTop: '4px', alignItems: 'center', gap: '4px' } },
            h('span', { class: 'chip good small' }, 'Độ dài: ' + charCount + ' chữ Hán'),
            h('span', { class: 'small muted' }, charCount >= 20 ? '✓ Phát âm rõ ràng, độ dài tốt!' : '💡 Nên nói thêm chi tiết để đạt điểm cao hơn')
          )
        );
      } else if (!recognizedText) {
        transcriptEl.textContent = 'Đã hoàn thành lượt nói. Bạn có thể nghe lại audio bên dưới!';
      }
    }).catch(() => {});
  }

  function stopRecording() {
    isRecording = false;
    clearInterval(timerInterval);
    if (ACTIVE_STOP_FN) {
      try { ACTIVE_STOP_FN(); } catch (e) {}
      ACTIVE_STOP_FN = null;
    }
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      try { mediaRecorder.stop(); } catch (e) {}
    }
    box.className = 'ielts-speak-recorder stack';
    recordBtn.className = 'ghost mini';
    recordBtn.textContent = '🔄 Ghi âm lại';
    statusLabel.textContent = 'Đã hoàn thành ghi âm (' + seconds + 's):';
    timerBadge.style.display = 'none';
  }

  box.replaceChildren(
    h('div', { class: 'row between wrap', style: { alignItems: 'center', gap: '8px' } }, statusLabel, timerBadge, recordBtn),
    transcriptEl,
    audioPlayerWrap
  );
  return box;
}

  const header = h('div', { class: 'stack', style: { gap: '4px' } },
