<!doctype html>
<html lang="vi">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lingogo">
<title>Lingogo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Bố cục: một cột kiểu app điện thoại; đổi ngôn ngữ ở đầu trang, thanh tab cố định dưới, mỗi màn hình một việc chính. */
:root {
  --bg: #f6f3ee;
  --surface: #ffffff;
  --sunk: #ece6dc;
  --ink: #1b2a2c;
  --muted: #5b6a6b;
  --line: #ddd4c6;
  --teal: #0f5257;
  --teal-ink: #ffffff;
  --amber: #e2902f;
  --amber-ink: #2a1600;
  --good: #23784a;
  --good-bg: #e2f2e7;
  --bad: #b03d2b;
  --bad-bg: #fbe5df;
  --grid: #e3d9ca;
  --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --zh: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --ja: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1e20; --surface: #15292c; --sunk: #1c3639; --ink: #e7eeed; --muted: #9bb0ae; --line: #2a4a4d;
    --teal: #55b6b2; --teal-ink: #06201f; --amber: #f0a752; --amber-ink: #2a1600; --grid: #2a4a4d;
    --good: #72d39b; --good-bg: #173a29; --bad: #f28b77; --bad-bg: #432018; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1e20; --surface: #15292c; --sunk: #1c3639; --ink: #e7eeed; --muted: #9bb0ae; --line: #2a4a4d;
  --teal: #55b6b2; --teal-ink: #06201f; --amber: #f0a752; --amber-ink: #2a1600; --grid: #2a4a4d;
  --good: #72d39b; --good-bg: #173a29; --bad: #f28b77; --bad-bg: #432018; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--ink); font: 16px/1.5 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px calc(88px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 560px; margin: 0 auto; }
h1, h2, h3 { margin: 0; line-height: 1.25; text-wrap: balance; }
h1 { font-size: 1.5rem; font-weight: 700; }
h2 { font-size: 1.15rem; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
[lang="zh-Hans"] { font-family: var(--zh); }
[lang="ja"] { font-family: var(--ja); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.center { text-align: center; }
.label { font-size: .75rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.note { background: var(--sunk); border-radius: 12px; padding: 12px; font-size: .88rem; color: var(--muted); }
button, select {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; min-height: 48px; padding: 10px 16px; cursor: pointer;
}
button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.primary { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); font-weight: 600; }
.accent { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); font-weight: 600; }
.ghost { background: transparent; border-color: transparent; color: var(--teal); }
.block { width: 100%; }
.mini { min-height: 36px; padding: 6px 12px; font-size: .88rem; border-radius: 10px; }
input[type=text], input[type=password], input[type=search], textarea {
  width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-height: 50px;
}
select { width: 100%; }

/* Chọn ngôn ngữ */
.langpick { display: grid; gap: 12px; }
.langcard { width: 100%; display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: center; text-align: left; padding: 18px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); }
.langcard:hover { border-color: var(--teal); }
.langcard.cur { border: 2px solid var(--teal); }
.langcard .glyph { grid-row: span 3; width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; background: var(--sunk); font-size: 1.9rem; font-weight: 700; color: var(--teal); }
.langcard .name { font-size: 1.2rem; font-weight: 700; }
.langcard .bar { grid-column: 2; }
.langchip { min-height: 40px; padding: 6px 12px; border-radius: 99px; font-weight: 600; gap: 6px; }
.langchip .caret { font-size: .75rem; color: var(--muted); }
.langs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--sunk); padding: 4px; border-radius: 14px; }
.langs button { border: none; background: transparent; min-height: 42px; font-weight: 600; color: var(--muted); border-radius: 10px; padding: 6px; }
.langs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* Thống kê */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 8px; text-align: center; min-width: 0; }
.stat b { display: block; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .76rem; color: var(--muted); }
.bar { height: 10px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--amber); border-radius: 99px; transition: width .35s; }

/* Lộ trình */
.phase { margin-top: 8px; }
.topic { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.topic.cur { border: 2px solid var(--teal); }
.topic > button.head { width: 100%; border: none; border-radius: 0; justify-content: flex-start; text-align: left; gap: 12px; padding: 12px 14px; background: transparent; }
.topic .num { flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--sunk); font-weight: 700; font-size: .85rem; font-variant-numeric: tabular-nums; }
.topic.done .num { background: var(--good-bg); color: var(--good); }
.topic .meta { flex: 1; min-width: 0; }
.topic .meta b { display: block; overflow-wrap: anywhere; }
.topic .body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.lesson { width: 100%; justify-content: flex-start; text-align: left; gap: 12px; min-height: 52px; }
.lesson .dot { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); font-weight: 700; font-size: .8rem; }
.lesson.done .dot { background: var(--good-bg); color: var(--good); }
.lesson.next { border: 2px solid var(--teal); }
.lesson .meta { flex: 1; min-width: 0; }
.extras { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.level { font-size: .74rem; font-weight: 700; padding: 2px 7px; border-radius: 6px; letter-spacing: .02em; flex: none; text-transform: uppercase; }
.chip.level.a1 { background: #e6f7ec; color: #0d8a43; border: 1px solid #b7ebc6; }
.chip.level.a2 { background: #e6f4ff; color: #096dd9; border: 1px solid #91caff; }
.chip.level.b1 { background: #f9f0ff; color: #722ed1; border: 1px solid #d3adf7; }
.chip.level.b2 { background: #fff7e6; color: #d46b08; border: 1px solid #ffd591; }
.chip.level.c1 { background: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; }
.chip.level.c2 { background: #feffe6; color: #ad8b00; border: 1px solid #ffe58f; font-weight: 800; box-shadow: 0 0 4px rgba(250,219,20,.4); }
.chip.level.hsk1 { background: #e6f7ec; color: #0d8a43; border: 1px solid #b7ebc6; }
.chip.level.hsk2 { background: #e6f4ff; color: #096dd9; border: 1px solid #91caff; }
.chip.level.hsk3 { background: #f0f5ff; color: #1d39c4; border: 1px solid #adc6ff; }
.chip.level.hsk4 { background: #f9f0ff; color: #722ed1; border: 1px solid #d3adf7; }
.chip.level.hsk5 { background: #fff7e6; color: #d46b08; border: 1px solid #ffd591; }
.chip.level.hsk6 { background: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; }
.chip.level.hsk7 { background: #f0f0ff; color: #391085; border: 1px solid #d3adf7; }
.chip.level.hsk8 { background: #fff0f6; color: #c41d7f; border: 1px solid #ffadd2; }
.chip.level.hsk9 { background: #feffe6; color: #ad8b00; border: 1px solid #ffe58f; font-weight: 800; box-shadow: 0 0 4px rgba(250,219,20,.4); }
.chip.level.n5 { background: #e6f7ec; color: #0d8a43; border: 1px solid #b7ebc6; }
.chip.level.n4 { background: #e6f4ff; color: #096dd9; border: 1px solid #91caff; }
.chip.level.n3 { background: #f0f5ff; color: #1d39c4; border: 1px solid #adc6ff; }
.chip.level.n2 { background: #f9f0ff; color: #722ed1; border: 1px solid #d3adf7; }
.chip.level.n1 { background: #feffe6; color: #ad8b00; border: 1px solid #ffe58f; font-weight: 800; box-shadow: 0 0 4px rgba(250,219,20,.4); }
.kbd { flex: none; display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 7px; font: 600 .8rem/1 var(--font); color: var(--muted); background: var(--bg); font-variant-numeric: tabular-nums; }
.options button { gap: 12px; }
.options button[aria-pressed="true"] .kbd { border-color: var(--teal); color: var(--teal); }
.grades .kbd { min-width: 20px; height: 20px; font-size: .7rem; margin-bottom: 2px; }
.keyhint { text-align: center; font-size: .75rem; color: var(--muted); }
@media (hover: none) { .keyhint { display: none; } }

/* Phân loại chủ đề */
.cat-bar { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; margin-top: 4px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.cat-bar::-webkit-scrollbar { display: none; }
.cat-pill { flex: none; padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); font-size: .88rem; font-weight: 500; cursor: pointer; transition: all .15s ease; white-space: nowrap; line-height: 1.2; }
.cat-pill:hover { border-color: var(--teal); color: var(--ink); }
.cat-pill.active { background: var(--teal); color: #fff; border-color: var(--teal); font-weight: 600; box-shadow: 0 2px 6px rgba(0, 128, 128, 0.25); }
/* Nút Subjects & menu chọn chủ đề */
.subjects-box { position: relative; width: 100%; }
.subjects-trigger {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 14px;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  cursor: pointer;
  transition: all .15s ease;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.subjects-trigger:hover, .subjects-trigger.open {
  border-color: var(--teal);
  box-shadow: 0 2px 8px rgba(15,82,87,.12);
}
.subjects-badge {
  display: inline-flex;
  align-items: center;
  font-size: .75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .04em;
  background: var(--teal);
  color: var(--teal-ink);
  padding: 3px 8px;
  border-radius: 6px;
  line-height: 1;
  flex: none;
}
.subjects-name {
  font-size: .95rem;
  font-weight: 700;
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.subjects-arrow {
  font-size: .75rem;
  color: var(--muted);
  flex: none;
  transition: transform .15s ease;
}
.subjects-dropdown {
  position: relative;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 6px 18px rgba(0,0,0,.08);
  padding: 6px;
  gap: 4px;
  margin-top: 6px;
  z-index: 10;
  animation: fadeInDown .15s ease;
}
@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}
.subjects-item {
  width: 100%;
  display: flex;
  flex-direction: column;
  padding: 10px 12px;
  background: transparent;
  border: 1.5px solid transparent;
  border-radius: 10px;
  cursor: pointer;
  text-align: left;
  transition: all .12s ease;
}
.subjects-item:hover {
  background: var(--sunk);
}
.subjects-item.selected {
  background: var(--sunk);
  border-color: var(--teal);
}
.subjects-check {
  display: inline-grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 99px;
  background: var(--teal);
  color: #fff;
  font-size: .75rem;
  font-weight: 700;
  flex: none;
}


/* Bài học */
.topbar { display: flex; align-items: center; gap: 12px; }
.topbar .bar { flex: 1; }
.q { font-size: 1.15rem; font-weight: 600; white-space: pre-line; }
.options { display: grid; gap: 10px; }
.options button { justify-content: flex-start; text-align: left; }
.options button[aria-pressed="true"] { border: 2px solid var(--teal); background: var(--sunk); }
.options button.right { background: var(--good-bg); border-color: var(--good); }
.options button.wrong { background: var(--bad-bg); border-color: var(--bad); }
.big { font-size: 2.2rem; font-weight: 700; text-align: center; line-height: 1.25; overflow-wrap: anywhere; }
.big[lang="zh-Hans"], .big[lang="ja"] { font-size: 2.8rem; font-weight: 500; }
.read { color: var(--teal); text-align: center; font-size: 1rem; }
.ipa { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: var(--teal); font-weight: 600; text-align: center; font-size: 1.05rem; letter-spacing: .25px; }
.hv { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 12px; border-radius: 12px; background: var(--sunk); }
.hv .hvw { color: var(--teal); font-size: 1.25rem; letter-spacing: .02em; }
.hvrows { display: flex; flex-direction: column; gap: 4px; width: 100%; max-width: 320px; }
.hvrow { display: flex; align-items: baseline; gap: 8px; font-size: .92rem; text-align: left; border-top: 1px solid var(--line); padding-top: 4px; }
.hvrow .hvc { flex: none; font-size: 1.2rem; min-width: 1.6em; text-align: center; }
.hvglue { text-align: center; color: var(--ink); }
.endef { text-align: center; color: var(--muted); font-size: .95rem; font-style: italic; }
.tokens { display: flex; flex-wrap: wrap; gap: 8px; min-height: 52px; align-content: flex-start; }
.tokens.answer { border-bottom: 2px dashed var(--line); padding-bottom: 10px; }
.tokens button { min-height: 44px; padding: 8px 14px; user-select: none; -webkit-user-select: none; touch-action: manipulation; transition: transform .12s, box-shadow .12s, border-color .12s; }
.tokens.answer button { cursor: grab; }
.tokens.answer button:active { cursor: grabbing; }
.tokens.answer button.dragging { opacity: .25; transform: scale(.92); }
.tokens.answer button.drop-target-before { border-left: 3px solid var(--teal) !important; transform: translateX(3px); }
.tokens.answer button.drop-target-after { border-right: 3px solid var(--teal) !important; transform: translateX(-3px); }
.token-drag-clone {
  position: fixed; pointer-events: none; z-index: 1000;
  border-radius: 12px; background: var(--surface); color: var(--ink);
  border: 2px solid var(--teal); box-shadow: 0 10px 24px rgba(0,0,0,.35);
  padding: 8px 16px; font-weight: 600; font-size: 1.1rem;
  transform: translate(-50%, -50%) scale(1.08);
  transition: none;
}
.feedback { border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.feedback.ok { background: var(--good-bg); }
.feedback.ok strong { color: var(--good); }
.feedback.no { background: var(--bad-bg); }
.feedback.no strong { color: var(--bad); }
.dock { position: sticky; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); padding-top: 12px; background: linear-gradient(transparent, var(--bg) 35%); z-index: 2; }
.lessonmode .dock { bottom: env(safe-area-inset-bottom, 0px); padding-bottom: 8px; }
.listen { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; align-items: center; }
.spk { flex: none; width: 40px; height: 40px; min-height: 40px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--teal); display: inline-grid; place-items: center; vertical-align: middle; }
.spk svg { width: 20px; height: 20px; }
.spk.big { width: 52px; height: 52px; min-height: 52px; }
.spk.big svg { width: 26px; height: 26px; }
.spk .turtle { font-size: 1.3rem; line-height: 1; }
.spk.big .turtle { font-size: 1.6rem; }
.spk:active { background: var(--sunk); }
span.spk { width: 34px; height: 34px; min-height: 34px; }
.fill { line-height: 2.4; white-space: pre-line; }
.fill select { width: auto; min-height: 38px; padding: 4px 8px; border-radius: 10px; font-size: .95rem; margin: 0 2px; }
.fill select.right { border-color: var(--good); background: var(--good-bg); }
.fill select.wrong { border-color: var(--bad); background: var(--bad-bg); }

/* Luyện nói */
.words { display: flex; flex-wrap: wrap; gap: 4px 6px; justify-content: center; font-size: 1.3rem; font-weight: 600; }
.words[lang="zh-Hans"], .words[lang="ja"] { gap: 0; font-weight: 500; font-size: 1.6rem; }
.words .hit { color: var(--good); }
.words .miss { color: var(--bad); text-decoration: underline wavy; text-underline-offset: 4px; }
.score { font-size: 2.4rem; font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; }
.mic { width: 84px; height: 84px; border-radius: 50%; margin: 0 auto; background: var(--teal); color: var(--teal-ink); border: none; }
.mic.live { background: var(--bad); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
.mic svg { width: 32px; height: 32px; }
.sentence { width: 100%; justify-content: space-between; text-align: left; }
.sentence .meta { flex: 1; min-width: 0; }
.phrases { display: flex; flex-wrap: wrap; gap: 6px; }
.phrases span { border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px; font-size: .9rem; }
.phrases span.used { background: var(--good-bg); border-color: var(--good); color: var(--good); }

/* Viết chữ */
.charbox { width: min(300px, 78vw); aspect-ratio: 1; max-width: 100%; margin: 0 auto; border: 2px solid var(--line); border-radius: 12px; background-color: var(--surface);
  background-image: linear-gradient(to right, transparent calc(50% - .5px), var(--grid) calc(50% - .5px), var(--grid) calc(50% + .5px), transparent calc(50% + .5px)),
    linear-gradient(to bottom, transparent calc(50% - .5px), var(--grid) calc(50% - .5px), var(--grid) calc(50% + .5px), transparent calc(50% + .5px));
  touch-action: none; }
.charbox svg { display: block; width: 100%; height: 100%; }
.chargrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.chargrid button { min-height: 64px; padding: 4px; flex-direction: column; gap: 0; font-size: 1.6rem; line-height: 1.2; }
.chargrid button small { font-size: .7rem; color: var(--muted); font-family: var(--font); }
.chargrid button.done { border-color: var(--good); }
.kana { grid-template-columns: repeat(5, 1fr); }

const fresh = () => ({ v: 2, name: '', goal: 20, lang: 'en', enCat: 'a1', zhCat: 'hsk1', jaCat: 'n5', days: {}, dl: {}, pv: {}, srs: {}, lessons: {}, spoken: {}, written: {}, fill: {}, gq: {}, ach: {}, t: 0 });

function save() {

// Gộp hai bản tiến độ (điện thoại và máy tính): giữ phần học nhiều hơn ở mỗi mục
function mergeState(a, b) {
  const [newer, older] = (a.t || 0) >= (b.t || 0) ? [a, b] : [b, a];
  const out = Object.assign(fresh(), older, newer);
  out.days = Object.assign({}, older.days); for (const [k, v] of Object.entries(newer.days || {})) out.days[k] = Math.max(out.days[k] || 0, v);
  out.dl = {}; for (const src of [older.dl || {}, newer.dl || {}]) for (const [d, m] of Object.entries(src)) { out.dl[d] = out.dl[d] || {}; for (const [c, v] of Object.entries(m)) out.dl[d][c] = Math.max(out.dl[d][c] || 0, v); }
  out.pv = Object.assign({}, older.pv, newer.pv);
  out.srs = Object.assign({}, older.srs); for (const [k, v] of Object.entries(newer.srs || {})) { const o = out.srs[k]; if (!o || (v.last || 0) > (o.last || 0) || ((v.last || 0) === (o.last || 0) && v.b >= o.b)) out.srs[k] = v; }
  for (const f of ['lessons', 'spoken', 'written']) {
    out[f] = Object.assign({}, older[f]);
    for (const [k, v] of Object.entries(newer[f] || {})) { const o = out[f][k]; out[f][k] = typeof v === 'number' && typeof o === 'number' ? Math.max(v, o) : (typeof v === 'number' ? v : o != null ? o : v); }
  }
  out.fill = Object.assign({}, older.fill, newer.fill); out.ielts_challenge = Object.assign({}, older.ielts_challenge, newer.ielts_challenge); out.ach = Object.assign({}, older.ach, newer.ach);
  out.name = newer.name || older.name; out.t = Math.max(a.t || 0, b.t || 0);
  return out;
}
async function pullSync() {
  const snap = await SYNC.ref.get();
  const remote = snap && snap.exists && snap.data();
  if (remote && remote.json && (remote.t || 0) !== SYNC.seen) {
    S = mergeState(S, JSON.parse(remote.json)); SYNC.seen = remote.t || 0;
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* bỏ qua */ }
    return true;
  }
  return false;
}
async function pushSync() {
  try { await pullSync(); S.t = Math.max(Date.now(), (S.t || 0) + 1); await SYNC.ref.set({ json: JSON.stringify(S), t: S.t }); SYNC.seen = S.t; } catch (e) { /* thử lại lần lưu sau */ }
}
async function startSync() {
  try {
    if (!window.claude || !claude.use) return;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    SYNC.ref = db.doc('data/users/' + id + '/progress');
    const changed = await pullSync();
    if (changed && VIEW !== 'lesson') route();
    if (S.t && S.t !== SYNC.seen) pushSync();
    document.addEventListener('visibilitychange', async () => { if (!document.hidden && SYNC.ref) { try { if (await pullSync() && VIEW !== 'lesson') route(); } catch (e) { /* bỏ qua */ } } });
  } catch (e) { /* không đồng bộ được: vẫn dùng bản trên máy */ }
}

// ===== Đồng bộ GitHub Gist (tự động sao lưu tiến độ lên tài khoản GitHub) =====
const GH_KEY = 'lingogo-github-sync';
const GH_SYNC = { timer: 0, seen: -1, running: false };
function getGhConfig() {
  try { const raw = localStorage.getItem(GH_KEY); return raw ? JSON.parse(raw) : { token: '', gistId: '', user: '' }; } catch (e) { return { token: '', gistId: '', user: '' }; }
}
function saveGhConfig(cfg) {
  try { localStorage.setItem(GH_KEY, JSON.stringify(cfg)); } catch (e) {}
}
function ghHeaders(token) {
  const clean = (token || '').trim();
  const auth = clean.startsWith('Bearer ') || clean.startsWith('token ') ? clean : ('Bearer ' + clean);
  return { 'Accept': 'application/vnd.github+json', 'Authorization': auth, 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' };
}
async function findOrCreateGhGist(token) {
  const h = ghHeaders(token);
  const uRes = await fetch('https://api.github.com/user', { headers: h });
  if (!uRes.ok) throw new Error('Token không hợp lệ hoặc thiếu quyền gist (lỗi ' + uRes.status + ')');
  const uData = await uRes.json();
  const username = uData.login || '';
  const lRes = await fetch('https://api.github.com/gists?per_page=50', { headers: h });
  if (lRes.ok) {
    const list = await lRes.json();
    const found = list.find((g) => g.files && g.files['lingogo-progress.json']);
    if (found) return { gistId: found.id, user: username, isNew: false };
  }
  const cRes = await fetch('https://api.github.com/gists', {
    method: 'POST',
    headers: h,
    body: JSON.stringify({
      description: 'Lingogo Learning Progress Backup (Tự động đồng bộ)',
      public: false,
      files: { 'lingogo-progress.json': { content: JSON.stringify(S) } }
    })
  });
  if (!cRes.ok) throw new Error('Không thể tạo Gist (lỗi ' + cRes.status + ')');
  const created = await cRes.json();
  return { gistId: created.id, user: username, isNew: true };
}
async function pullGhSync(quiet = false) {
  const cfg = getGhConfig();
  if (!cfg.token || !cfg.gistId || GH_SYNC.running) return false;
  try {
    GH_SYNC.running = true;
    const res = await fetch('https://api.github.com/gists/' + cfg.gistId, { headers: ghHeaders(cfg.token) });
    if (!res.ok) {
      if (res.status === 404) {
        const found = await findOrCreateGhGist(cfg.token);
        cfg.gistId = found.gistId; saveGhConfig(cfg);
      }
      return false;
    }
    const gist = await res.json();
    const f = gist.files && gist.files['lingogo-progress.json'];
    if (!f || !f.content) return false;
    const remote = JSON.parse(f.content);
    if (remote && (remote.t || 0) !== GH_SYNC.seen) {
      const prevL = Object.keys(S.lessons || {}).length, prevS = Object.keys(S.srs || {}).length;
      S = mergeState(S, remote);
      GH_SYNC.seen = S.t || Date.now();
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
      const dl = Object.keys(S.lessons || {}).length - prevL, ds = Object.keys(S.srs || {}).length - prevS;
      if (!quiet) toast(dl || ds ? ('Đồng bộ GitHub: nhận thêm ' + dl + ' bài, ' + ds + ' mục ôn.') : 'Tiến độ đã đồng bộ mới nhất từ GitHub.');
      if (typeof route === 'function' && VIEW !== 'lesson') route();
      return true;
    }
    return false;
  } catch (e) {
    if (!quiet) toast('Lỗi đọc tiến độ từ GitHub: ' + (e.message || ''));
    return false;
  } finally {
    GH_SYNC.running = false;
  }
}
async function pushGhSync(quiet = true) {
  const cfg = getGhConfig();
  if (!cfg.token || !cfg.gistId || GH_SYNC.running) return false;
  try {
    GH_SYNC.running = true;
    try {
      const getRes = await fetch('https://api.github.com/gists/' + cfg.gistId, { headers: ghHeaders(cfg.token) });
      if (getRes.ok) {
        const gist = await getRes.json();
        const f = gist.files && gist.files['lingogo-progress.json'];
        if (f && f.content) {
          const remote = JSON.parse(f.content);
          if (remote && (remote.t || 0) > (S.t || 0)) S = mergeState(S, remote);
        }
      }
    } catch (e) {}
    S.t = Math.max(Date.now(), (S.t || 0) + 1);
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    const res = await fetch('https://api.github.com/gists/' + cfg.gistId, {
      method: 'PATCH',
      headers: ghHeaders(cfg.token),
      body: JSON.stringify({ files: { 'lingogo-progress.json': { content: JSON.stringify(S) } } })
    });
    if (!res.ok) throw new Error('Mã ' + res.status);
    GH_SYNC.seen = S.t;
    if (!quiet) toast('Đã sao lưu tiến độ lên GitHub!');
    return true;
  } catch (e) {
    if (!quiet) toast('Chưa thể lưu lên GitHub: ' + (e.message || ''));
    return false;
  } finally {
    GH_SYNC.running = false;
  }
}
function scheduleGhPush() {
  const cfg = getGhConfig();
  if (!cfg.token || !cfg.gistId) return;
  clearTimeout(GH_SYNC.timer);
  GH_SYNC.timer = setTimeout(() => { pushGhSync(true); }, 2500);
}
async function startGhSync() {
  const cfg = getGhConfig();
  if (!cfg.token) return;
  try {
    if (!cfg.gistId) {
      const res = await findOrCreateGhGist(cfg.token);
      cfg.gistId = res.gistId; cfg.user = res.user; saveGhConfig(cfg);
    }
    const updated = await pullGhSync(true);
    if (updated) {
      toast('Đã tự động nạp tiến độ mới nhất từ GitHub (@' + (cfg.user || 'User') + ')');
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) pullGhSync(true); });
  } catch (e) { /* yên lặng khi khởi động nếu offline */ }
}

function getDaySchedule(d = todayN()) {
  const diffDays = d - todayN();
  const dateObj = new Date();
  if (diffDays !== 0) dateObj.setDate(dateObj.getDate() + diffDays);
  return WEEKLY_SCHEDULE[dateObj.getDay()] || WEEKLY_SCHEDULE[0];
}

function goal(code = S.lang, d = todayN()) {
  const base = Math.max(20, S.goal || 20);
  if (S.smartSchedule === false) return base;
  const sch = getDaySchedule(d);
  if (!sch || !sch.goals || !sch.goals[code]) return base;
  return Math.max(10, Math.round(base * sch.goals[code]));
}

const xpOf = (d, code) => ((S.dl || {})[d] || {})[code] || 0;
const metGoal = (d, code) => xpOf(d, code) >= goal(code, d);

function streak(code = S.lang) {
  let d = todayN(); if (!metGoal(d, code)) d--;
  let n = 0; while (metGoal(d, code)) { n++; d--; }
  return n;
}

function longest(code = S.lang) {
  const ks = Object.keys(S.dl || {}).filter((k) => metGoal(k, code)).map(Number).sort((a, b) => a - b);
  let best = 0, run = 0, prev = null;
  for (const k of ks) { run = prev !== null && k === prev + 1 ? run + 1 : 1; best = Math.max(best, run); prev = k; }
  return best;
}

function addXp(n, code = S.lang) {
  if (!n) return;
  const t = todayN(), before = metGoal(t, code);
  S.days[t] = (S.days[t] || 0) + n;
  S.dl = S.dl || {}; S.dl[t] = S.dl[t] || {}; S.dl[t][code] = (S.dl[t][code] || 0) + n;

}

function getStrokePositions(charData, width, height, padding) {
  if (!charData || !charData.medians || !window.HanziWriter) return [];
  const tf = HanziWriter.getScalingTransform ? HanziWriter.getScalingTransform(width, height, padding) : null;
  const scale = tf ? tf.scale : ((width - 2 * padding) / 1024);
  const xOffset = tf ? tf.x : padding;
  const yOffset = tf ? tf.y : padding;

  const pts = [];
  for (let i = 0; i < charData.medians.length; i++) {

function renderStrokeNumbers(box, strokePositions, visibleCount, completedCount = 0) {

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');

    text.setAttribute('y', pt.y.toFixed(1));

    text.setAttribute('dominant-baseline', 'central');

    itemG.appendChild(text);

  return 'Từ mới ' + n + ' · ' + ws + (l.words.length > 3 ? '…' : '');

// ===== Hệ thống Spaced Repetition cho tất cả các kỹ năng (Từ vựng, Nói, Viết, Ngữ pháp) =====
const CARDS = {}, SPEAK_CARDS = {}, WRITE_CARDS = {}, GRAM_CARDS = {};

function cardIndex(code) {
  if (CARDS[code] || !DATA[code]) return CARDS[code] || {};
  const m = {};
  DATA[code].topics.forEach((t) => {
    t.vocab.forEach((v) => { m[v.id] = { v, t }; });
    (t.kanji || []).forEach((k) => { m[k.id] = { k, t }; });
  });
  return (CARDS[code] = m);
}

function speakIndex(code) {
  if (SPEAK_CARDS[code] || !DATA[code]) return SPEAK_CARDS[code] || {};
  const m = {};
  DATA[code].topics.forEach((t) => {
    (speakItems(code, t) || []).filter((it) => it.kind === 'line').forEach((it) => {
      const p = plain(it.text);
      if (!m[p]) m[p] = { it, t };
    });
  });
  return (SPEAK_CARDS[code] = m);
}

function writeIndex(code) {
  if (WRITE_CARDS[code] || !DATA[code]) return WRITE_CARDS[code] || {};
  const m = {};
  DATA[code].topics.forEach((t) => {
    t.vocab.forEach((v) => {
      [...plain(v.w)].filter((c) => /[㐀-鿿]/.test(c)).forEach((c) => {
        if (!m[c]) m[c] = { c, t, hint: charHint(code, c), v };
      });
    });
    (t.kanji || []).forEach((k) => {
      if (!m[k.k]) m[k.k] = { c: k.k, t, hint: k.hv, k };
    });
  });
  return (WRITE_CARDS[code] = m);
}

function grammarIndex(code) {
  if (GRAM_CARDS[code] || !DATA[code] || !DATA[code].grammar) return GRAM_CARDS[code] || {};
  const m = {};
  const all = grammarPoints(code);
  all.forEach((p) => { m[p.gid] = p; });
  return (GRAM_CARDS[code] = m);
}

function parseSrsKey(k, code) {
  if (!k.startsWith(code + ':')) return null;
  const rest = k.slice(code.length + 1);
  if (rest.startsWith('speak:')) {
    const text = rest.slice(6);
    const sp = (speakIndex(code) || {})[text] || { it: { text }, t: {} };
    return { skill: 'speak', key: k, id: text, it: sp };
  }
  if (rest.startsWith('write:')) {
    const ch = rest.slice(6);
    const wr = (writeIndex(code) || {})[ch] || { c: ch, t: {}, hint: charHint(code, ch) };
    return { skill: 'write', key: k, id: ch, it: wr };
  }
  if (rest.startsWith('gram:')) {
    if (code === 'en') return null; // Tiếng Anh không đưa ngữ pháp vào Ôn tập ngắt quãng
    const gid = rest.slice(5);
    const d = DATA[code];
    const gr = (grammarIndex(code) || {})[gid] || (d && d.grammar && d.grammar[gid] ? { gid, g: d.grammar[gid], lv: d.grammar[gid].lv } : null);
    if (!gr) return null;
    return { skill: 'gram', key: k, id: gid, it: gr };
  }
  const vMap = cardIndex(code);
  const it = vMap[rest];
  if (it) return { skill: 'vocab', key: k, id: rest, it };
  return null;
}

const isCard = (code, key) => !!parseSrsKey(key, code);

// Kiểm tra xem một mục đã thực sự được học hay chưa (chỉ ôn những gì đã học)
function isLearned(code, parsed) {
  if (!parsed) return false;
  const d = DATA[code]; if (!d) return false;

  // 1. TỪ VỰNG / KANJI: Phải nằm trong các bài học đã hoàn thành (lessonDone)
  if (parsed.skill === 'vocab') {
    const it = parsed.it; if (!it) return false;
    if (it.v) {
      const vId = it.v.id, t = it.t;
      if (!t || !t.lessons) return false;
      return t.lessons.some((l, i) => lessonDone(t, i) && l.words && l.words.some((w) => w.id === vId));
    }
    if (it.k) {
      const t = it.t;
      if (!t || !t.lessons) return false;
      return t.lessons.some((l, i) => lessonDone(t, i) && (l.kind === 'kanji' || l.kind === 'learn'));
    }
    return false;
  }

  // 2. LUYỆN NÓI: Chỉ những câu người dùng ĐÃ từng luyện nói (có trong S.spoken)
  if (parsed.skill === 'speak') {
    const text = plain(parsed.id);
    return !!(S.spoken && S.spoken[sid(code, text)] != null);
  }

  // 3. LUYỆN VIẾT: Chỉ những chữ người dùng ĐÃ từng tập viết (có trong S.written)
  if (parsed.skill === 'write') {
    const ch = parsed.id;
    return !!(S.written && (S.written[sid(code, ch)] || 0) > 0);
  }

  // 4. NGỮ PHÁP: Chỉ những điểm ngữ pháp của chủ đề đã học bài (bất kỳ bài học nào trong chủ đề) hoặc đã làm quiz trong tab ngữ pháp
  if (parsed.skill === 'gram') {
    if (code === 'en') return false; // Tiếng Anh không đưa ngữ pháp vào Ôn tập ngắt quãng
    const gid = parsed.id;
    const allPts = grammarPoints(code);
    const p = allPts.find((x) => x.gid === gid);
    if (!p) return false;
    const hasStudiedTopic = p.topics.some((t) => {
      return t.lessons.some((l, i) => lessonDone(t, i));
    });
    const hasGq = S.gq && (
      (S.gq.best && (S.gq.best[code + ':' + p.lv] != null || S.gq.best[code + ':topic'] != null)) ||
      (S.gq.wrong && S.gq.wrong[gid] != null)
    );
    return hasStudiedTopic || !!hasGq;
  }

  return false;
}

function ensureSrsItems(code) {
  if (!S.srs) S.srs = {};
  // Dọn sạch triệt để mọi key ngữ pháp tiếng Anh trong S.srs nếu từng tồn tại
  if (S.srs) {
    let deletedAny = false;
    Object.keys(S.srs).forEach((k) => {
      if (k.startsWith('en:gram:')) {
        delete S.srs[k];
        deletedAny = true;
      }
    });
    if (deletedAny && typeof save === 'function') save();
  }
  const d = DATA[code]; if (!d) return;
  const t0 = todayN();

  // 1. Chỉ đưa từ vựng / kanji của các BÀI ĐÃ HOÀN THÀNH (lessonDone) vào hàng ôn tập
  d.topics.forEach((t) => {
    t.lessons.forEach((l, i) => {
      if (lessonDone(t, i)) {
        (l.words || []).forEach((w) => {
          const k = sid(code, w.id);
          if (!S.srs[k]) S.srs[k] = { b: 1, due: t0, last: t0 - 1 };
        });
        if (l.kind === 'kanji' && t.kanji) {
          t.kanji.forEach((kj) => {
            const k = sid(code, kj.id);
            if (!S.srs[k]) S.srs[k] = { b: 1, due: t0, last: t0 - 1 };
          });
        }
      }
    });

    const hasAnyDone = t.lessons.some((l, i) => lessonDone(t, i));
    if (hasAnyDone && t.gram && d.grammar && code !== 'en') {
      t.gram.forEach((gid) => {
        const k = code + ':gram:' + gid;
        if (!S.srs[k] && d.grammar[gid]) S.srs[k] = { b: 1, due: t0, last: t0 - 1 };
      });
    }
  });

  // 2. Chỉ các câu ĐÃ luyện nói
  if (S.spoken) {
    Object.keys(S.spoken).forEach((k) => {
      if (k.startsWith(code + ':')) {
        const text = k.slice(code.length + 1);
        const sKey = code + ':speak:' + text;
        if (!S.srs[sKey]) S.srs[sKey] = { b: (S.spoken[k] || 0) >= 80 ? 2 : 1, due: t0, last: t0 - 1 };
      }
    });
  }

  // 3. Chỉ các chữ ĐÃ tập viết
  if (S.written) {
    Object.keys(S.written).forEach((k) => {
      if (k.startsWith(code + ':') && S.written[k] > 0) {
        const ch = k.slice(code.length + 1);
        const sKey = code + ':write:' + ch;
        if (!S.srs[sKey]) S.srs[sKey] = { b: 1, due: t0, last: t0 - 1 };
      }
    });
  }

  // 4. DỌN SẠCH DỮ LIỆU: Loại bỏ mọi mục chưa học khỏi S.srs
  Object.keys(S.srs).forEach((k) => {
    if (k.startsWith(code + ':')) {
      const parsed = parseSrsKey(k, code);
      if (!parsed || !isLearned(code, parsed)) {
        delete S.srs[k];
      }
    }
  });
}

function srsDueItems(code, skillFilter = 'all') {
  ensureSrsItems(code);
  const t0 = todayN();
  const allKeys = Object.keys(S.srs || {}).filter((k) => k.startsWith(code + ':') && S.srs[k].due <= t0);
  const parsed = allKeys
    .map((k) => parseSrsKey(k, code))
    .filter((x) => x && isLearned(code, x));
  if (skillFilter === 'all') return parsed;
  return parsed.filter((x) => x.skill === skillFilter);
}

// ===== HỆ THỐNG LUYỆN THI IELTS 4 KỸ NĂNG (TIẾNG ANH) =====
function bandOfLevel(lvl) {
  if (lvl === 'A1') return 'Band 4.5–5.0';
  if (lvl === 'A2') return 'Band 5.0–5.5';
  if (lvl === 'B1') return 'Band 5.5–6.5';
  if (lvl === 'B2') return 'Band 6.5–7.5';
  return 'Band 7.5–8.5+';
}

function isIeltsDone(t, skill) {
  if (!S.ielts) return false;
  const k = t.lang + ':' + t.id + ':' + skill;
  return !!(S.ielts[k] && S.ielts[k].done);
}

function ieltsDoneCount(t) {
  const skills = ['listen', 'speak', 'read', 'write'];
  return skills.filter((s) => isIeltsDone(t, s)).length;
}

function markIeltsDone(t, skill, score, band) {
  if (!S.ielts) S.ielts = {};
  const k = t.lang + ':' + t.id + ':' + skill;
  const isFirst = !S.ielts[k] || !S.ielts[k].done;
  const b = band || (score >= 90 ? '8.5' : score >= 80 ? '7.5' : score >= 70 ? '6.5' : '6.0');
  S.ielts[k] = { done: true, score: score || 100, band: b, ts: Date.now() };
  if (isFirst) {
    addXp(15, 'en');
    checkAch();
    save();
    toast('🎉 Hoàn thành IELTS ' + (skill === 'listen' ? 'Listening' : skill === 'speak' ? 'Speaking' : skill === 'read' ? 'Reading' : 'Writing') + ' (Band ' + b + ')! +15 XP');
  } else {
    save();
    toast('Đã cập nhật bài làm IELTS (Band ' + b + ')!');
  }
}

tal priority, terminating space exploration would be dangerously short-sighted. By dedicating a reasonable portion of national budgets to aerospace research, humanity not only safeguards its future among the stars but also secures transformative technologies that preserve our home planet."

sents a pragmatic and indispensable public health strategy. By disincentivizing unhealthy consumption and financing nutritional education, governments can stem the epidemic of chronic lifestyle diseases."

function getIeltsBand(t, skill) {
  if (!S.ielts) return 'Chưa thi';
  const k = t.lang + ':' + t.id + ':' + skill;
  const item = S.ielts[k];
  if (!item || !item.done) return 'Chưa thi';
  if (item.band) return item.band;
  const s = item.score || 80;
  if (s >= 90) return '8.5';
  if (s >= 80) return '7.5';
  if (s >= 70) return '6.5';
  if (s >= 60) return '6.0';
  return '5.5';
}

function calculateOverallIeltsBand(t) {
  const skills = ['listen', 'speak', 'read', 'write'];
  const bands = skills.map((sk) => {
    const bStr = getIeltsBand(t, sk);
    const num = parseFloat(bStr);
    return isNaN(num) ? 6.5 : num;
  });
  const avg = bands.reduce((a, b) => a + b, 0) / 4;
  const whole = Math.floor(avg);
  const frac = avg - whole;
  if (frac < 0.25) return (whole).toFixed(1);
  if (frac < 0.75) return (whole + 0.5).toFixed(1);
  return (whole + 1.0).toFixed(1);
}

  const overall = calculateOverallIeltsBand(t);

  const cefr = parseFloat(overall) >= 8.5 ? 'C2 · Mastery (Bậc thầy xuất sắc)'

          IELTS_TOPIC['en'] = nextTopic.id;

function ieltsTipBox(title, items, fullModalTab) {
  let open = false;
  const content = h('div', { class: 'stack', style: { display: 'none', gap: '8px', marginTop: '8px', fontSize: '.86rem', lineHeight: 1.55 } },
    ...items.map(it => {
      if (typeof it === 'string') return h('p', { class: 'small muted', style: { margin: '2px 0' } }, '• ' + it);
      return h('div', { class: 'stack', style: { gap: '2px', padding: '6px 0', borderBottom: '1px dashed var(--line)' } },
        h('b', { style: { color: 'var(--teal)' } }, it.title || it.q || it.trap || it.rule || it.name),
        h('span', { class: 'small' }, it.desc || it.say || it.fix || it.ex),
        it.note && h('span', { class: 'small muted', style: { fontStyle: 'italic' } }, it.note)
      );
    }),
    fullModalTab ? h('button', {
      class: 'ghost mini',
      style: { alignSelf: 'flex-start', marginTop: '6px', color: 'var(--teal)', fontWeight: 600, padding: '4px 8px' },
      onclick: () => showIeltsTipsModal(fullModalTab)
    }, '📖 Mở Cẩm nang đầy đủ ➔') : null
  );

  const toggleBtn = h('button', {
    class: 'mini ghost',
    style: { border: '1px solid rgba(217, 119, 6, 0.35)', color: '#d97706', fontWeight: 600, padding: '3px 8px' },
    onclick: () => {
      open = !open;
      content.style.display = open ? 'flex' : 'none';
      toggleBtn.textContent = open ? 'Thu gọn ▴' : 'Xem mẹo ▾';
    }
  }, 'Xem mẹo ▾');

  return h('div', { class: 'ielts-tip-box stack' },
    h('div', { class: 'row between', style: { alignItems: 'center' } },
      h('div', { class: 'row', style: { gap: '6px', alignItems: 'center' } },
        h('span', { style: { fontSize: '1.05rem' } }, '💡'),
        h('b', { style: { fontSize: '.88rem', color: '#b45309' } }, title)
      ),
      toggleBtn
    ),
    content
  );
}

function showIeltsTipsModal(defaultTab) {
  let activeTab = defaultTab || 'roadmap';
  if (activeTab === 'listen') activeTab = 'listening';
  if (activeTab === 'speak') activeTab = 'speaking';
  if (activeTab === 'read') activeTab = 'reading';
  if (activeTab === 'write') activeTab = 'writing';

  const overlay = h('div', {
    class: 'modal-overlay',
    style: {
      position: 'fixed', top: 0, left: 0, right: 0, bottom: 0,
      background: 'rgba(0,0,0,0.72)', zIndex: 100,
      display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '12px'

    onclick: (e) => { if (e.target === overlay) overlay.remove(); }

  const tabs = [
    ['roadmap', '🚀 Lộ trình 0-7.5+'],
    ['listening', '🎧 10 Mẹo Nghe'],
    ['speaking', '🎙️ Nói & Phản xạ'],
    ['reading', '📖 Đọc Band 8.0+'],
    ['writing', '✍️ Viết & Dấu phẩy'],
    ['drills', '🎯 3 Bài luyện']
  ];

  const bodyArea = h('div', {
    class: 'stack',
    style: {
      gap: '12px', marginTop: '6px',
      overflowY: 'auto', flex: '1 1 auto', minHeight: 0,
      paddingRight: '4px', scrollbarWidth: 'thin'

  });

  const tabButtons = tabs.map(([k, label]) => h('button', {
    class: 'ielts-tip-tab-btn' + (k === activeTab ? ' active' : ''),
    onclick: () => { activeTab = k; renderTab(); }
  }, label));

  const tabsBar = h('div', { class: 'ielts-tip-tabs-bar' }, ...tabButtons);

  function renderTab() {
    tabButtons.forEach((b, idx) => {
      b.className = 'ielts-tip-tab-btn' + (tabs[idx][0] === activeTab ? ' active' : '');

    bodyArea.replaceChildren();

    if (activeTab === 'roadmap') {
      bodyArea.appendChild(h('p', { class: 'small muted' }, 'Lộ trình 4 giai đoạn chuẩn bị thi từ nền tảng đến 7.5+ IELTS từ chuyên mục Cẩm nang Tip:'));

            h('span', { class: 'chip level' }, 'Band ' + r.target)

          h('p', { class: 'small', style: { margin: '4px 0' } }, h('b', {}, 'Trọng tâm: '), r.focus),
