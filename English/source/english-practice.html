: "Outdoor tiles need high slip resistance.", "vn": "độ chống trơn trượt"}, {"id": "E28-12", "en": "surface finish", "vi": "the look and feel of the top layer of a product", "ex": "We offer a matt or a glossy surface finish.", "vn": "bề mặt hoàn thiện"}, {"id": "E28-13", "en": "nominal size", "vi": "the official size, before small differences in production", "ex": "The nominal size is 600 by 600 millimetres.", "vn": "kích thước danh nghĩa"}, {"id": "E28-14", "en": "thickness", "vi": "the distance from one side of a flat object to the other", "ex": "The thickness of the panel is 10 millimetres.", "vn": "độ dày"}, {"id": "E28-15", "en": "shade variation", "vi": "small colour differences between production batches", "ex": "Please order enough tiles to avoid shade variation.", "vn": "chênh lệch màu giữa các lô"}, {"id": "E28-16", "en": "test certificate", "vi": "a document that shows a product has passed a test", "ex": "We can send the test certificate for these panels.", "vn": "chứng chỉ thử nghiệm"}, {"id": "E28-17", "en": "comply with", "vi": "follow a rule or a standard", "ex": "The products comply with Australian standards.", "vn": "tuân thủ"}, {"id": "E28-18", "en": "fire rating", "vi": "a grade that shows how long a material resists fire", "ex": "The panels have a fire rating of two hours.", "vn": "cấp chịu lửa"}, {"id": "E28-19", "en": "durable", "vi": "able to last a long time without damage", "ex": "Granite is a very durable material.", "vn": "bền"}], "quiz": [{"s": "A contractor asks how strong the bricks are. Which answer is best?", "o": ["The compressive strength of these bricks is 30 megapascals.", "These bricks are very, very strong.", "Strong is thirty."], "why": "Give the measured value with its unit. \"Compressive strength\" is the standard term."}, {"s": "You need to know if the panels meet the local rules.", "o": ["Could you confirm that these panels comply with the Australian standard?", "Are the panels good for Australia or not?", "Panels, Australia standard, yes?"], "why": "\"Comply with\" + the standard is the usual way to ask about rules."}, {"s": "Tiles from different batches can look slightly different. How do you warn the buyer?", "o": ["Please order the full quantity at once, because there may be shade variation between batches.", "Maybe the colours are a little not same.", "You must not complain about the colour later."], "why": "Explain the reason and give a simple instruction the buyer can follow."}, {"s": "A \"load-bearing\" wall is…", "o": ["a wall that carries the weight of the building", "a wall made of glass", "a wall that moves"], "why": "Never remove a load-bearing wall without an engineer."}, {"s": "You want to know the material and safety of a wall panel.", "o": ["What material is the cladding made of, and what is its fire rating?", "What is this wall, tell me everything?", "Is the wall good or bad?"], "why": "Ask about material and fire rating in the same question."}, {"s": "Which property tells you if a floor is safe when wet?", "o": ["Slip resistance", "Thickness", "Nominal size"], "why": "Slip resistance measures how safe a surface is when wet."}], "speak": [{"s": "Describe a tile product to a contractor", "l": ["These are porcelain tiles, 600 by 600 millimetres, ten millimetres thick.", "The water absorption is below 0.5 percent, so they are suitable for outdoor use.", "We can send the test certificate with the quotation."]}, {"s": "Answer a question about standards", "l": ["Yes, the panels comply with the Australian standard.", "The fire rating is two hours, and the test certificate is attached.", "If you need another document, please let me know."]}], "email": "Subject: Technical data – porcelain tiles 600 x 600\n\nDear Mr. Hall,\n\nThank you for your interest in our porcelain tiles. The tiles have a [[nominal|normal|nominated]] size of 600 by 600 millimetres and a thickness of 10 millimetres. The water absorption is below 0.5 percent, so they are suitable [[for|to|at]] outdoor floors.\n\nThe products comply [[with|to|for]] the Australian standard. Please find the test certificate attached.\n\nBecause of possible shade [[variation|variety|various]], we recommend ordering the full quantity [[at once|at one|once time]].\n\nBest regards,\nSally", "coach": [{"q": "What is the water absorption of these tiles?", "vi": "Độ hút nước của những viên gạch này là bao nhiêu?", "st": "The water absorption is + value + so + use.", "ph": ["water absorption", "below 0.5 percent", "outdoor use"], "ss": [], "sa": "The water absorption is below 0.5 percent, so these porcelain tiles are suitable for outdoor use.", "src": "Industry practice", "sc": "A contractor is choosing tiles for a terrace and wants to know if they are safe in the rain.", "lab": "Work practice"}, {"q": "Do your products meet our local standards?", "vi": "Sản phẩm của bạn có đạt tiêu chuẩn địa phương của chúng tôi không?", "st": "Yes, they comply with + standard, and we can send + document.", "ph": ["comply with", "Australian standards", "the test certificate"], "ss": [], "sa": "Yes, our products comply with Australian standards, and we can send the test certificate with the quotation.", "src": "Industry practice", "sc": "An importer in Sydney asks whether your panels can be used in buildings there.", "lab": "Work practice"}, {"q": "Which surface do you recommend for a bathroom floor?", "vi": "Bạn khuyên dùng bề mặt nào cho sàn phòng tắm?", "st": "I recommend + finish + because + reason.", "ph": ["slip resistance", "a matt finish", "wet areas"], "ss": [], "sa": "I recommend a matt finish because it has higher slip resistance, which is important in wet areas.", "src": "Industry practice", "sc": "A hotel designer asks about the safest tile finish for bathrooms.", "lab": "Work practice"}, {"q": "Why is the price of this panel higher?", "vi": "Vì sao giá của tấm này cao hơn?", "st": "The price is higher because + reasons.", "ph": ["fire rating", "more durable", "a longer service life"], "ss": [], "sa": "The price is higher because it has a better fire rating and is more durable, so it gives a longer service life.", "src": "Industry practice", "sc": "The customer compares two panels and asks why one costs more.", "lab": "Work practice"}], "ph": "Products and trade"}, {"n": 32, "en": "Wine and spirits 1: products, tasting and recommendations", "vi": "", "vocab": [{"id": "E32-0", "en": "oak barrel", "vi": "a wooden barrel made of oak", "ex": "The wine rests in oak barrels for a year.", "vn": "thùng gỗ sồi"}, {"id": "E32-1", "en": "tannin", "vi": "a natural substance in wine that makes the mouth feel dry", "ex": "Young red wines often have strong tannin.", "vn": "chất chát (tannin)"}, {"id": "E32-2", "en": "appellation", "vi": "a protected area where a wine is made", "ex": "The wine comes from a famous appellation in Bordeaux.", "vn": "vùng sản xuất được bảo hộ"}, {"id": "E32-3", "en": "alcohol by volume", "vi": "the percentage of alcohol in a drink", "ex": "The alcohol by volume is 13.5 percent.", "vn": "nồng độ cồn"}, {"id": "E32-4", "en": "blend", "vi": "a mix of different grapes or different spirits", "ex": "This red wine is a blend of three grape varieties.", "vn": "hỗn hợp, pha trộn"}, {"id": "E32-5", "en": "cask", "vi": "a large wooden barrel in which wine or spirits mature", "ex": "The whisky was aged in oak casks.", "vn": "thùng gỗ ủ rượu"}, {"id": "E32-6", "en": "aged", "vi": "left to mature for some time before sale", "ex": "The brandy is aged for ten years.", "vn": "được ủ"}, {"id": "E32-7", "en": "distillery", "vi": "a place where spirits are made", "ex": "We visited the distillery last year.", "vn": "nhà máy chưng cất"}, {"id": "E32-8", "en": "single malt", "vi": "whisky made from malted barley at one distillery", "ex": "This single malt has a smooth, smoky taste.", "vn": "whisky mạch nha đơn"}, {"id": "E32-9", "en": "aroma", "vi": "the smell of a wine or a spirit", "ex": "The wine has an aroma of black fruit and vanilla.", "vn": "hương thơm"}, {"id": "E32-10", "en": "palate", "vi": "the sense of taste, or the way a wine tastes in the mouth", "ex": "The wine has a fresh palate with a long finish.", "vn": "vị giác, hậu vị"}, {"id": "E32-11", "en": "full-bodied", "vi": "rich and strong in flavour", "ex": "This is a full-bodied red with soft tannins.", "vn": "đậm đà"}, {"id": "E32-12", "en": "crisp", "vi": "fresh and light, with a clean taste", "ex": "The white wine is crisp and not too sweet.", "vn": "tươi mát"}, {"id": "E32-13", "en": "dry", "vi": "not sweet", "ex": "We recommend a dry white wine with seafood.", "vn": "vị khô (không ngọt)"}, {"id": "E32-14", "en": "sparkling", "vi": "containing small bubbles of gas", "ex": "The sparkling wine is popular for celebrations.", "vn": "có ga, sủi bọt"}, {"id": "E32-15", "en": "cork", "vi": "a stopper made from tree bark that closes a bottle", "ex": "The bottle is sealed with a natural cork.", "vn": "nút bần"}, {"id": "E32-16", "en": "harvest", "vi": "the picking of grapes", "ex": "The harvest was early this year because of the warm weather.", "vn": "thu hoạch"}, {"id": "E32-17", "en": "food pairing", "vi": "choosing a drink that goes well with a dish", "ex": "The food pairing for this wine is grilled meat.", "vn": "kết hợp rượu với món ăn"}, {"id": "E32-18", "en": "sommelier", "vi": "a wine expert who works in a restaurant", "ex": "The sommelier recommended this bottle.", "vn": "chuyên gia rượu vang"}, {"id": "E32-19", "en": "cellar", "vi": "a cool room where wine is stored", "ex": "Keep the bottles in a dark, cool cellar.", "vn": "hầm rượu"}], "quiz": [{"s": "A customer asks you to describe a red wine. Which answer is best?", "o": ["It is a full-bodied red with soft tannins and a long finish. It pairs well with grilled meat.", "It is a red wine. It is good.", "It tastes like wine."], "why": "Describe body, texture and finish, then suggest a food pairing."}, {"s": "You need the exact age of a spirit.", "o": ["The whisky was aged in oak casks for twelve years.", "The whisky is old.", "The whisky is very old, maybe ten or more."], "why": "Give the number of years and the type of cask. Buyers compare these facts."}, {"s": "The customer wants a wine for a seafood dinner.", "o": ["I'd recommend a crisp, dry white wine, which goes well with seafood.", "Any wine is good with fish.", "Please choose one yourself."], "why": "Recommend a style and explain the match in one sentence."}, {"s": "\"Crisp\" describes a wine that is…", "o": ["fresh and light", "old and heavy", "very sweet"], "why": "A crisp white wine is fresh and light."}, {"s": "What does ABV mean?", "o": ["alcohol by volume", "a bottle's value", "an aged blend"], "why": "ABV is the percentage of alcohol in a drink."}, {"s": "A customer is cooking beef. What do you recommend?", "o": ["A full-bodied red would match the beef very well.", "Any wine is fine with beef.", "White wine, because beef is white."], "why": "Match strong dishes with full-bodied wines."}], "speak": [{"s": "Recommend a wine to a customer", "l": ["Which dishes will you serve at the dinner?", "For seafood, I'd recommend a crisp, dry white wine.", "For grilled meat, a full-bodied red is a better match."]}, {"s": "Present a spirit to a distributor", "l": ["This single malt is aged in oak casks for twelve years.", "The alcohol by volume is 43 percent.", "I'll send the tasting notes and the technical data sheet."]}], "email": "Subject: Tasting notes – 2021 Cabernet Sauvignon\n\nDear Ms. Rossi,\n\nThank you for tasting our wines. Please find the tasting notes [[attached|attaching|attach]] for the 2021 vintage.\n\nThe wine is a blend of Cabernet Sauvignon and Merlot from a famous [[appellation|appeal|apply]]. It is full-bodied, with soft tannins and a long finish. The alcohol by volume is 13.5 percent.\n\nWe recommend it [[with|by|on]] grilled meat and hard cheese.\n\nBest regards,\nSally", "coach": [{"q": "Can you describe this wine?", "vi": "Bạn có thể mô tả loại rượu này không?", "st": "This wine is + style, with + taste and + finish.", "ph": ["full-bodied", "soft tannins", "a long finish"], "ss": [], "sa": "This wine is full-bodied, with soft tannins and a long finish. It is ideal for grilled meat.", "src": "Industry practice", "sc": "A restaurant owner asks you to describe a red wine for the menu.", "lab": "Work practice"}, {"q": "What is the difference between these two whiskies?", "vi": "Hai loại whisky này khác nhau thế nào?", "st": "The first is + feature, and the second is + feature.", "ph": ["aged in oak casks", "a blend", "a single malt"], "ss": [], "sa": "The first is a blend, which is lighter, and the second is a single malt aged in oak casks for twelve years, which is richer.", "src": "Industry practice", "sc": "A buyer wants to understand which product to put on the shelf.", "lab": "Work practice"}, {"q": "Which wine goes well with seafood?", "vi": "Loại rượu nào hợp với hải sản?", "st": "I'd recommend + wine, because + reason.", "ph": ["a crisp white wine", "dry", "goes well with seafood"], "ss": [], "sa": "I'd recommend a crisp white wine. It is dry and goes well with seafood.", "src": "Industry practice", "sc": "A customer is planning a dinner and asks for advice.", "lab": "Work practice"}, {"q": "How old is this vintage and how was it made?", "vi": "Rượu này thuộc vụ năm nào và được làm thế nào?", "st": "This wine is from + year, and it was + process.", "ph": ["the 2021 vintage", "harvested by hand", "aged for twelve months"], "ss": [], "sa": "This wine is from the 2021 vintage. The grapes were harvested by hand and the wine was aged for twelve months in oak.", "src": "Industry practice", "sc": "A guest at a tasting asks about the history of the bottle.", "lab": "Work practice"}], "ph": "Products and trade"}, {"n": 30, "en": "Biomass pellets 1: the product, quality and specifications", "vi": "", "vocab": [{"id": "E30-0", "en": "biomass", "vi": "plant material, such as wood, that is used as fuel", "ex": "Biomass is a renewable source of energy.", "vn": "sinh khối"}, {"id": "E30-1", "en": "wood pellet", "vi": "a small compressed cylinder of sawdust used as fuel", "ex": "Our wood pellets are made from clean sawdust.", "vn": "viên nén gỗ"}, {"id": "E30-2", "en": "sawdust", "vi": "very small pieces of wood made when wood is cut", "ex": "The factory uses sawdust from local sawmills.", "vn": "mùn cưa"}, {"id": "E30-3", "en": "softwood", "vi": "wood from trees such as pine", "ex": "Softwood pellets burn very cleanly.", "vn": "gỗ mềm"}, {"id": "E30-4", "en": "hardwood", "vi": "wood from trees such as oak or acacia", "ex": "These pellets are made from hardwood.", "vn": "gỗ cứng"}, {"id": "E30-5", "en": "compress", "vi": "press something to make it smaller and denser", "ex": "The machine compresses the sawdust into pellets.", "vn": "nén"}, {"id": "E30-6", "en": "net calorific value", "vi": "the amount of heat that a fuel gives when it burns", "ex": "The net calorific value is at least 16.5 MJ per kilogram.", "vn": "nhiệt trị thực"}, {"id": "E30-7", "en": "moisture content", "vi": "the percentage of water in a material", "ex": "The moisture content must be below 10 percent.", "vn": "độ ẩm"}, {"id": "E30-8", "en": "ash content", "vi": "the percentage of material left after burning", "ex": "The ash content is 0.6 percent.", "vn": "hàm lượng tro"}, {"id": "E30-9", "en": "bulk density", "vi": "the weight of a material in a given volume", "ex": "The bulk density is above 600 kilograms per cubic metre.", "vn": "khối lượng riêng xô"}, {"id": "E30-10", "en": "mechanical durability", "vi": "how well a pellet resists breaking into dust", "ex": "The mechanical durability is 98 percent.", "vn": "độ bền cơ học"}, {"id": "E30-11", "en": "fines", "vi": "very small pieces and dust in a pellet shipment", "ex": "The fines must be less than 1 percent.", "vn": "bụi và mảnh vụn"}, {"id": "E30-12", "en": "diameter", "vi": "the width of a round object", "ex": "The diameter of the pellets is 6 millimetres.", "vn": "đường kính"}, {"id": "E30-13", "en": "additive", "vi": "a substance added to a product for a special purpose", "ex": "Our pellets contain no chemical additive.", "vn": "phụ gia"}, {"id": "E30-14", "en": "sulphur content", "vi": "the percentage of sulphur in a fuel", "ex": "The sulphur content is very low.", "vn": "hàm lượng lưu huỳnh"}, {"id": "E30-15", "en": "lab analysis", "vi": "a test carried out in a laboratory", "ex": "We can send the lab analysis of the last batch.", "vn": "phân tích phòng thí nghiệm"}, {"id": "E30-16", "en": "certified", "vi": "officially approved by an independent body", "ex": "Our pellets are certified to the ENplus standard.", "vn": "được chứng nhận"}, {"id": "E30-17", "en": "sustainable", "vi": "not harming the environment for the future", "ex": "The wood comes from sustainable forests.", "vn": "bền vững"}, {"id": "E30-18", "en": "boiler", "vi": "a machine that burns fuel to heat water", "ex": "The pellets are used in industrial boilers.", "vn": "nồi hơi"}, {"id": "E30-19", "en": "quality parameter", "vi": "a measurable property used to judge quality", "ex": "Moisture is the most important quality parameter.", "vn": "chỉ tiêu chất lượng"}], "quiz": [{"s": "A buyer asks about the quality of the pellets. Which answer is best?", "o": ["The moisture content is below 8 percent, and the ash content is 0.6 percent.", "The quality is good, very good.", "Our pellets are the best in the world."], "why": "Give measured values. Buyers compare moisture, ash and heat value."}, {"s": "You need to prove the pellets meet the standard.", "o": ["We can send the lab analysis and the ENplus certificate.", "Please trust us, we are a good company.", "The standard is not important."], "why": "Documents such as a lab analysis and a certificate are the normal proof."}, {"s": "The buyer asks why fines are important.", "o": ["Too many fines mean more dust, and they can cause problems in the boiler.", "Fines are small things.", "Fines do not matter at all."], "why": "Explain the effect: dust, waste and boiler problems."}, {"s": "\"Calorific value\" tells you…", "o": ["how much heat the fuel gives when it burns", "how heavy the fuel is", "how long the fuel can be stored"], "why": "Buyers compare pellets by calorific value."}, {"s": "Which value should be low in good pellets?", "o": ["Ash content", "Calorific value", "Bulk density"], "why": "High ash content leaves more waste in the boiler."}, {"s": "You want the size of the pellets.", "o": ["What are the diameter and the length of your pellets?", "Pellets size, please tell me.", "Are your pellets big or small?"], "why": "Ask for exact dimensions with a clear question."}], "speak": [{"s": "Describe your pellets to a new buyer", "l": ["Our wood pellets are made from clean softwood sawdust.", "The diameter is 6 millimetres, and the moisture content is below 8 percent.", "They are certified, and we can send the lab analysis."]}, {"s": "Answer a quality question", "l": ["The net calorific value is at least 16.5 megajoules per kilogram.", "The ash content is 0.6 percent and the fines are less than 1 percent.", "I'll send the full specification today."]}], "email": "Subject: Product specification – wood pellets 6 mm\n\nDear Mr. Kim,\n\nThank you for your inquiry. Please find our quality [[specification|specify|specific]] attached.\n\nOur pellets are made [[from|by|at]] clean softwood sawdust. The diameter is 6 millimetres, the moisture content is below 8 percent and the ash content is 0.6 percent. The pellets are certified [[to|at|by to]] the ENplus standard.\n\nWe can also send the lab [[analysis|analyse|analytic]] of the last batch.\n\nBest regards,\nSally", "coach": [{"q": "What are your pellets made from?", "vi": "Viên nén của bạn được làm từ gì?", "st": "Our pellets are made from + material + and contain + addition.", "ph": ["clean softwood sawdust", "no chemical additive", "sustainable forests"], "ss": [], "sa": "Our pellets are made from clean softwood sawdust from sustainable forests, and they contain no chemical additive.", "src": "Industry practice", "sc": "A buyer in Korea asks about your raw material and whether anything is added.", "lab": "Work practice"}, {"q": "What is the moisture content and the ash content?", "vi": "Độ ẩm và hàm lượng tro là bao nhiêu?", "st": "The moisture content is + value, and the ash content is + value.", "ph": ["moisture content", "below 8 percent", "ash content"], "ss": [], "sa": "The moisture content is below 8 percent, and the ash content is 0.6 percent, which is within the standard.", "src": "Industry practice", "sc": "The buyer's technical team sends a list of quality questions before a first trial.", "lab": "Work practice"}, {"q": "Do you have a certificate for your pellets?", "vi": "Bạn có chứng nhận cho viên nén không?", "st": "Yes, our pellets are + certification, and we can send + document.", "ph": ["certified", "the ENplus standard", "the lab analysis"], "ss": [], "sa": "Yes, our pellets are certified to the ENplus standard, and we can send the lab analysis of each batch.", "src": "Industry practice", "sc": "A power plant needs documents before it will approve a new supplier.", "lab": "Work practice"}, {"q": "Why should we choose your pellets?", "vi": "Vì sao chúng tôi nên chọn viên nén của bạn?", "st": "You should choose us because + reasons.", "ph": ["high calorific value", "low ash content", "consistent quality"], "ss": [], "sa": "You should choose us because our pellets have a high calorific value, a low ash content and consistent quality from batch to batch.", "src": "Industry practice", "sc": "The buyer is comparing three suppliers and asks you for your main advantages.", "lab": "Work practice"}], "ph": "Products and trade"}, {"n": 8, "en": "Buying through a distributor: quotes, terms and written confirmation", "vi": "", "vocab": [{"id": "L1-0", "en": "authorized distributor", "vi": "a company officially approved by a brand to sell and support its products in a market", "ex": "Le Hoang is the authorized distributor for Unitree in Vietnam.", "vn": "nhà phân phối chính thức"}, {"id": "L1-1", "en": "price list", "vi": "a document showing the standard prices of a company's products", "ex": "Could you send us your latest price list for the A2 series?", "vn": "bảng giá"}, {"id": "L1-2", "en": "itemized quotation", "vi": "a quotation that lists the price of each item separately", "ex": "Please send an itemized quotation so we can see the cost of each accessory.", "vn": "báo giá chi tiết từng hạng mục"}, {"id": "L1-3", "en": "inclusive of VAT", "vi": "with value added tax already included in the price", "ex": "Is this price inclusive of VAT?", "vn": "đã bao gồm VAT"}, {"id": "L1-4", "en": "exclusive of tax", "vi": "without tax included in the price", "ex": "All prices are exclusive of tax and shipping.", "vn": "chưa gồm thuế"}, {"id": "L1-5", "en": "VAT invoice", "vi": "an official invoice showing the VAT charged, needed for accounting", "ex": "We will need a VAT invoice issued to our company name.", "vn": "hoá đơn VAT"}, {"id": "L1-6", "en": "configuration", "vi": "the particular set of parts and options chosen for a product", "ex": "We have not decided on the final configuration yet.", "vn": "cấu hình"}, {"id": "L1-7", "en": "accessory", "vi": "an extra item that can be added to a main product", "ex": "The charging dock is sold as an optional accessory.", "vn": "phụ kiện"}, {"id": "L1-8", "en": "bundle", "vi": "a set of products or services sold together for one price", "ex": "Is the inspection software included in the bundle?", "vn": "gói sản phẩm"}, {"id": "L1-9", "en": "delivery schedule", "vi": "the planned dates on which goods will be delivered", "ex": "Please confirm the delivery schedule once we place the order.", "vn": "lịch giao hàng"}, {"id": "L1-10", "en": "in writing", "vi": "on paper or by email, not only spoken", "ex": "Could you confirm the warranty terms in writing?", "vn": "bằng văn bản"}, {"id": "L1-11", "en": "decision-maker", "vi": "the person who has the authority to make the final decision", "ex": "Our director is the final decision-maker on this purchase.", "vn": "người ra quyết định"}, {"id": "L1-12", "en": "follow-up question", "vi": "a question asked after an answer, to get more detail", "ex": "I have a few follow-up questions about the battery.", "vn": "câu hỏi bổ sung"}, {"id": "L1-13", "en": "outstanding", "vi": "not yet answered, paid or done", "ex": "There are still three outstanding questions from our last email.", "vn": "còn tồn đọng, chưa giải quyết"}, {"id": "L1-14", "en": "chase up", "vi": "contact someone again to get something they have not sent yet", "ex": "I'll chase up the quotation if they don't reply by Friday.", "vn": "đôn đốc, nhắc lại"}, {"id": "L1-15", "en": "pending", "vi": "waiting for a decision or action", "ex": "The purchase is pending our director's approval.", "vn": "đang chờ"}, {"id": "L1-16", "en": "budget approval", "vi": "official permission to spend a certain amount of money", "ex": "We need budget approval before we can confirm the order.", "vn": "duyệt ngân sách"}, {"id": "L1-17", "en": "purchase agreement", "vi": "a contract that sets out the terms of a purchase", "ex": "Please send a draft purchase agreement for our review.", "vn": "hợp đồng mua bán"}, {"id": "L1-18", "en": "after-sales support", "vi": "help given to customers after they have bought a product", "ex": "Does the price include after-sales support in Australia?", "vn": "hỗ trợ hậu mãi"}, {"id": "L1-19", "en": "system integration", "vi": "connecting a product with other hardware or software so they work together", "ex": "The distributor also offers system integration for custom software.", "vn": "tích hợp hệ thống"}], "quiz": [{"s": "The distributor's quote does not say whether VAT is included. Which sentence asks most clearly?", "o": ["Could you confirm whether the quoted price is inclusive of VAT?", "Is VAT?", "Your price has VAT or not, tell me."], "why": "Use \"confirm whether\" with a full statement; \"inclusive of VAT\" is the standard phrase."}, {"s": "You have waited a week for answers to 11 questions. What is the best follow-up?", "o": ["I'm just following up on the questions we sent last week. Could you let us know when we can expect a reply?", "Why have you not answered yet?", "Answer my questions now, please."], "why": "Refer to the earlier email, stay polite and ask for a timeline."}, {"s": "Your director has not approved the purchase yet. How do you tell the supplier?", "o": ["The order is still pending budget approval, so we can't confirm it yet.", "We don't want it now.", "The order is approve later maybe."], "why": "\"Pending + noun\" explains a delay without sounding negative."}, {"s": "Ask the distributor whether the price includes the charging dock and software.", "o": ["Does the quoted price include the charging dock and the inspection software?", "Price has dock and software or not?", "You give dock for free?"], "why": "Be specific about each item that might be missing from the quote."}, {"s": "What does \"authorized distributor\" mean?", "o": ["a company officially approved by the brand to sell its products", "a company that makes the products", "a shop that sells used goods"], "why": "An authorized distributor can offer warranty and support."}, {"s": "You need the delivery date to be certain.", "o": ["Could you confirm the delivery schedule in writing?", "Tell me the day, I will remember.", "When you can, you send."], "why": "Ask for key dates in writing so that both sides have a record."}], "speak": [{"s": "Ask a distributor for a detailed quotation", "l": ["We're interested in the A2 Pro for site inspection in Australia.", "Could you send us an itemized quotation, including accessories and software?", "Please also confirm whether the prices are inclusive of VAT."]}, {"s": "Chase up an overdue reply", "l": ["I'm calling to follow up on our email from last week.", "We still have a few outstanding questions about the warranty.", "Could you give us a written answer by Friday?"]}], "email": "Subject: Request for itemized quotation – A2 Pro\n\nDear Le Hoang team,\n\nThank you for the product information you [[sent|send|sending]] last week. We are now comparing three models and would appreciate an itemized quotation [[for|of|at]] the A2 Pro, including the charging dock and inspection software.\n\nCould you also confirm in writing whether the prices are [[inclusive|include|including]] of VAT and whether the warranty is valid in Australia?\n\nOur final decision is [[pending|waiting|delayed]] budget approval, so we would be grateful to receive your reply [[by|until|on]] the end of this week.\n\nBest regards,\nSally", "coach": [{"q": "Why are you buying through a distributor instead of directly from the manufacturer?", "vi": "Vì sao bạn mua qua nhà phân phối thay vì mua trực tiếp từ nhà sản xuất?", "st": "We prefer to buy through + partner + because + reasons.", "ph": ["local after-sales support", "no import paperwork", "a VAT invoice"], "sa": "We prefer to buy through the authorized distributor because they provide local after-sales support, handle the import paperwork and can issue a VAT invoice.", "sc": "A colleague in Australia asks why our company did not order the robot directly from the factory.", "ss": [], "src": "Buying through a distributor", "lab": "Work practice"}, {"q": "What information do you still need before you can place the order?", "vi": "Bạn còn cần thông tin gì trước khi đặt hàng?", "st": "Before we place the order, we need + information.", "ph": ["an itemized quotation", "written warranty terms", "budget approval"], "sa": "Before we place the order, we need an itemized quotation, written warranty terms for Australia and budget approval from our director.", "sc": "Your director asks why the robot has not been ordered yet.", "ss": [], "src": "Buying through a distributor", "lab": "Work practice"}, {"q": "How will you choose between the three models?", "vi": "Bạn sẽ chọn giữa ba mẫu như thế nào?", "st": "We will compare them on + criteria, and then + final step.", "ph": ["weather protection", "battery life", "software access"], "sa": "We will compare them on weather protection, battery life and software access, and then weigh the total cost against our budget.", "sc": "The distributor asks what matters most in your decision.", "ss": [], "src": "Buying through a distributor", "lab": "Work practice"}, {"q": "What will you do if the distributor doesn't reply?", "vi": "Bạn sẽ làm gì nếu nhà phân phối không trả lời?", "st": "If they don't reply by + time, I will + action.", "ph": ["chase them up by phone", "escalate to their sales manager", "contact the brand directly"], "sa": "If they don't reply by Friday, I will chase them up by phone and, if necessary, escalate to their sales manager.", "sc": "Your director is worried about delays.", "ss": [], "src": "Buying through a distributor", "lab": "Work practice"}], "ph": "Import-export"}, {"n": 9, "en": "Technical specifications: robots, sensors and software", "vi": "", "vocab": [{"id": "L2-0", "en": "specification sheet", "vi": "a document listing a product's technical details", "ex": "The specification sheet does not mention the operating temperature.", "vn": "bảng thông số kỹ thuật"}, {"id": "L2-1", "en": "payload", "vi": "the weight a robot or vehicle can carry while working", "ex": "The A2 can walk with a payload of about 25 kilograms.", "vn": "tải trọng"}, {"id": "L2-2", "en": "runtime", "vi": "how long a device can operate on one battery charge", "ex": "Real runtime outdoors is usually shorter than the figure in the brochure.", "vn": "thời gian hoạt động"}, {"id": "L2-3", "en": "hot-swappable", "vi": "able to be replaced while the machine is still running", "ex": "The A2 has hot-swappable batteries, so it can work in shifts.", "vn": "thay nóng"}, {"id": "L2-4", "en": "IP rating", "vi": "a code that shows how well a device is protected against dust and water", "ex": "We need an IP rating of at least IP54 for outdoor sites.", "vn": "chuẩn chống bụi, nước IP"}, {"id": "L2-5", "en": "operating temperature", "vi": "the range of temperatures in which a device works safely", "ex": "Is the operating temperature suitable for an Australian summer?", "vn": "nhiệt độ vận hành"}, {"id": "L2-6", "en": "LiDAR", "vi": "a sensor that uses laser light to measure distance and build 3D maps", "ex": "The LiDAR scans the site and creates a point cloud.", "vn": "cảm biến LiDAR"}, {"id": "L2-7", "en": "point cloud", "vi": "a set of 3D points that represents the shape of an area or object", "ex": "Can we export the point cloud to our own software?", "vn": "đám mây điểm"}, {"id": "L2-8", "en": "thermal camera", "vi": "a camera that detects heat and shows temperature differences", "ex": "A thermal camera can find hot spots in electrical panels.", "vn": "camera nhiệt"}, {"id": "L2-9", "en": "pan-tilt-zoom camera", "vi": "a camera that can turn, tilt and zoom by remote control", "ex": "A pan-tilt-zoom camera lets us inspect details from a distance.", "vn": "camera PTZ (xoay, nghiêng, zoom)"}, {"id": "L2-10", "en": "onboard computer", "vi": "a computer built into a machine that processes its data", "ex": "Our software will run on the onboard computer.", "vn": "máy tính tích hợp trên máy"}, {"id": "L2-11", "en": "SDK (software development kit)", "vi": "a set of tools that lets developers build software for a device", "ex": "Without the SDK, we cannot install our own agent software.", "vn": "bộ công cụ phát triển phần mềm"}, {"id": "L2-12", "en": "API", "vi": "a set of rules that lets two programs exchange data", "ex": "We need API access to the camera and the battery status.", "vn": "giao diện lập trình ứng dụng"}, {"id": "L2-13", "en": "firmware", "vi": "the basic software built into a device that controls its hardware", "ex": "Will installing our software affect the firmware or the warranty?", "vn": "phần mềm điều khiển thiết bị"}, {"id": "L2-14", "en": "over-the-air update", "vi": "a software update sent wirelessly to a device", "ex": "The robot receives an over-the-air update every month.", "vn": "cập nhật phần mềm từ xa (OTA)"}, {"id": "L2-15", "en": "autonomous navigation", "vi": "moving along a route without a person controlling it", "ex": "Autonomous navigation on stairs needs the industrial software package.", "vn": "tự hành"}, {"id": "L2-16", "en": "waypoint", "vi": "a fixed point on a route where a robot must pass or stop", "ex": "The robot stops at each waypoint to take photos.", "vn": "điểm mốc trên tuyến"}, {"id": "L2-17", "en": "charging dock", "vi": "a station where a robot returns to recharge automatically", "ex": "The robot returns to the charging dock when the battery is low.", "vn": "trạm sạc"}, {"id": "L2-18", "en": "accuracy", "vi": "how close a measurement is to the true value", "ex": "LiDAR mapping accuracy is only a few centimeters.", "vn": "độ chính xác"}, {"id": "L2-19", "en": "tolerance", "vi": "the acceptable amount of error in a measurement", "ex": "For final acceptance, the tolerance must be within millimeters.", "vn": "dung sai"}], "quiz": [{"s": "The brochure says \"runtime: over 5 hours, no load\". What should you ask?", "o": ["What is the realistic runtime outdoors with a 25-kilogram payload?", "Is 5 hours good?", "Why is the battery so small?"], "why": "Brochure figures are often measured without a load; ask about your real working conditions."}, {"s": "Which specification matters most for dust and rain on an outdoor site?", "o": ["The IP rating", "The color", "The number of legs"], "why": "The IP rating shows the level of protection against dust and water."}, {"s": "Your developer needs to read camera data from the robot. What do you ask the supplier?", "o": ["Does this model give SDK and API access to the camera feed?", "Can the camera be bigger?", "Is the camera free?"], "why": "Whether you can run custom software depends on SDK and API access."}, {"s": "\"Payload\" means…", "o": ["the weight that a robot can carry", "the price of a robot", "the speed of a robot"], "why": "Payload is the maximum load a machine can carry."}, {"s": "You want to change the battery without turning the robot off.", "o": ["Is the battery hot-swappable?", "Is the battery hot?", "Can the battery change when cold?"], "why": "\"Hot-swappable\" means it can be changed while the device is on."}, {"s": "Which feature updates the software without a cable?", "o": ["An over-the-air update", "A charging dock", "A point cloud"], "why": "Over-the-air updates are sent wirelessly."}], "speak": [{"s": "Explain your technical requirements to a supplier", "l": ["The robot will patrol construction sites, both indoors and outdoors.", "It needs an IP rating of at least IP54 and a runtime of two hours with a payload.", "Most importantly, we need SDK access to run our own software."]}, {"s": "Question a figure in the specification sheet", "l": ["The specification sheet says the runtime is over five hours.", "Is that measured with or without a payload?", "Could you share test data for outdoor conditions?"]}], "email": "Subject: Technical questions – A2 Pro\n\nDear Le Hoang team,\n\nWe have reviewed the specification [[sheet|paper|list]] for the A2 Pro and have a few technical questions.\n\n1. What is the realistic runtime [[with|by|for]] a 25 kg payload?\n2. Is the IP rating valid for the whole robot or only for the [[core|heart|middle]] components?\n3. Does the SDK give access [[to|for|with]] the LiDAR and camera data?\n\nWe would appreciate a written reply, as your answers will [[determine|decide on|depend]] which model we choose.\n\nBest regards,\nSally", "coach": [{"q": "What will the robot be used for?", "vi": "Robot sẽ được dùng vào việc gì?", "st": "It will be used to + tasks + at/in + place.", "ph": ["patrol construction sites", "capture daily photos", "build 3D maps"], "sa": "It will be used to patrol construction sites in Australia, capture daily photos at fixed waypoints and build 3D maps to track progress.", "sc": "A supplier's engineer asks about your use case before recommending a model.", "ss": [], "src": "Technical specifications", "lab": "Work practice"}, {"q": "Which technical features are essential for you?", "vi": "Tính năng kỹ thuật nào là bắt buộc với bạn?", "st": "The essential features are + list.", "ph": ["an outdoor IP rating", "automatic recharging", "SDK access"], "sa": "The essential features are an outdoor IP rating, automatic recharging at a charging dock and full SDK access for our own software.", "sc": "The supplier asks you to rank your requirements.", "ss": [], "src": "Technical specifications", "lab": "Work practice"}, {"q": "Is centimeter-level accuracy enough for your project?", "vi": "Độ chính xác cỡ centimet có đủ cho dự án không?", "st": "It is enough for + purpose, but not for + purpose.", "ph": ["tracking progress", "final acceptance", "millimeter tolerance"], "sa": "It is enough for tracking progress, but not for final acceptance, where we would need millimeter tolerance from survey equipment.", "sc": "A site engineer questions whether the robot's measurements are reliable.", "ss": [], "src": "Technical specifications", "lab": "Work practice"}, {"q": "What happens if installing your software voids the warranty?", "vi": "Nếu cài phần mềm riêng làm mất bảo hành thì sao?", "st": "In that case, we would need to + actions.", "ph": ["get written confirmation", "negotiate the terms", "choose another model"], "sa": "In that case, we would need written confirmation of what is still covered, try to negotiate the terms, or choose a model that allows custom software.", "sc": "The distributor warns that custom software may affect the warranty.", "ss": [], "src": "Technical specifications", "lab": "Work practice"}], "ph": "Import-export"}, {"n": 12, "en": "Acceptance testing, warranty and after-sales service", "vi": "", "vocab": [{"id": "L5-0", "en": "acceptance test", "vi": "a test to check that equipment works as agreed before the buyer accepts it", "ex": "We will run an acceptance test on site before we sign.", "vn": "chạy thử nghiệm thu"}, {"id": "L5-1", "en": "delivery note", "vi": "a document listing the goods delivered, signed by the receiver", "ex": "Please sign the delivery note and note any damage.", "vn": "phiếu giao hàng"}, {"id": "L5-2", "en": "unboxing", "vi": "opening the packaging of a new product", "ex": "Record a video during unboxing in case there is damage.", "vn": "mở thùng"}, {"id": "L5-3", "en": "visible damage", "vi": "damage that can be seen from the outside", "ex": "Note any visible damage before you sign.", "vn": "hư hỏng nhìn thấy được"}, {"id": "L5-4", "en": "functional test", "vi": "a test to check that each function works", "ex": "The functional test covers walking, charging and the cameras.", "vn": "thử chức năng"}, {"id": "L5-5", "en": "acceptance criteria", "vi": "the conditions a product must meet to be accepted", "ex": "The acceptance criteria were agreed in the purchase agreement.", "vn": "tiêu chí nghiệm thu"}, {"id": "L5-6", "en": "malfunction", "vi": "a failure of a machine to work properly", "ex": "If there is a malfunction during testing, we will request a replacement.", "vn": "trục trặc"}, {"id": "L5-7", "en": "one-to-one replacement", "vi": "replacing a faulty unit with a new identical unit", "ex": "The distributor offers a one-to-one replacement within the test period.", "vn": "đổi 1-1"}, {"id": "L5-8", "en": "warranty period", "vi": "the time during which repairs are free under the warranty", "ex": "The warranty period starts on the delivery date.", "vn": "thời hạn bảo hành"}, {"id": "L5-9", "en": "international warranty", "vi": "a warranty that is valid in more than one country", "ex": "Is this an international warranty or only valid in Vietnam?", "vn": "bảo hành quốc tế"}, {"id": "L5-10", "en": "void the warranty", "vi": "make the warranty no longer valid", "ex": "Opening the battery case may void the warranty.", "vn": "làm mất hiệu lực bảo hành"}, {"id": "L5-11", "en": "service center", "vi": "a place where products are repaired", "ex": "Where is the nearest authorized service center in Australia?", "vn": "trung tâm bảo hành"}, {"id": "L5-12", "en": "spare parts", "vi": "extra parts kept to replace broken ones", "ex": "We should keep spare parts such as feet and a second battery.", "vn": "phụ tùng thay thế"}, {"id": "L5-13", "en": "troubleshooting", "vi": "finding and fixing the cause of a problem", "ex": "The manual has a troubleshooting section.", "vn": "xử lý sự cố"}, {"id": "L5-14", "en": "remote support", "vi": "help from a technician through the internet or by phone", "ex": "Most software issues can be solved with remote support.", "vn": "hỗ trợ từ xa"}, {"id": "L5-15", "en": "onboarding training", "vi": "training that helps new users start using a product", "ex": "The distributor provides onboarding training for two operators.", "vn": "đào tạo ban đầu"}, {"id": "L5-16", "en": "user manual", "vi": "a document that explains how to use a product", "ex": "Is the user manual available in English?", "vn": "sách hướng dẫn sử dụng"}, {"id": "L5-17", "en": "sign off", "vi": "give formal approval that work is complete", "ex": "The site manager will sign off after the test.", "vn": "ký duyệt"}, {"id": "L5-18", "en": "commissioning", "vi": "preparing and testing new equipment so it is ready for normal use", "ex": "Commissioning on site will take two days.", "vn": "vận hành thử, đưa vào sử dụng"}, {"id": "L5-19", "en": "service level", "vi": "the standard of service a provider promises, such as response time", "ex": "What service level do you offer for urgent repairs?", "vn": "mức dịch vụ"}], "quiz": [{"s": "You notice a scratch on the robot when it arrives. What do you do first?", "o": ["Note the visible damage on the delivery note and take photos before signing", "Sign quickly and email later", "Throw away the box"], "why": "Record damage at delivery; claims are harder once you have signed a clean delivery note."}, {"s": "The robot fails the charging test on day two. Which request fits the agreed terms?", "o": ["We would like to request a one-to-one replacement, as agreed for the test period.", "Give us our money back now.", "Fix it sometime."], "why": "Refer to the agreed term and ask for the specific remedy."}, {"s": "\"Void the warranty\" means…", "o": ["make the warranty no longer valid", "extend the warranty", "print the warranty"], "why": "Void = cancel; unauthorized changes often void a warranty."}, {"s": "\"Acceptance criteria\" are…", "o": ["the conditions the product must meet to be accepted", "the price of the product", "the date of the contract"], "why": "Acceptance criteria are agreed before the test."}, {"s": "The robot stops working in the first week.", "o": ["The unit stopped working after two days. Could you advise on troubleshooting or send a replacement?", "Your robot is bad, fix it now.", "The robot is sleeping, please help."], "why": "Describe the problem with facts and ask for a clear next step."}, {"s": "You need your team to learn how to use the robot.", "o": ["Could you provide onboarding training for our operators?", "Please teach all of us the robot.", "We want learn the robot quickly."], "why": "\"Onboarding training\" helps new users start working with a product."}], "speak": [{"s": "Report a problem during acceptance testing", "l": ["During the acceptance test, the robot did not return to the charging dock.", "We repeated the test three times with the same result.", "Could you arrange remote support or a one-to-one replacement?"]}, {"s": "Ask about after-sales service in Australia", "l": ["We will use the robot on sites in Australia.", "Is the warranty valid there, and where is the nearest service center?", "How quickly can you supply spare parts?"]}], "email": "Subject: Acceptance test result – charging issue\n\nDear Support team,\n\nWe received the robot on Monday and started the acceptance test [[on|in|at]] site. Most functions passed, but the robot [[failed|fail|failing]] to return to the charging dock in all three tests.\n\nAs agreed, a malfunction during the test period [[qualifies|qualify|qualifying]] for a one-to-one replacement. Please let us know the next steps.\n\nWe have attached the test log and a video [[of|for|from]] the issue.\n\nBest regards,\nSally", "coach": [{"q": "What will you check when the robot arrives?", "vi": "Bạn sẽ kiểm tra gì khi robot về?", "st": "First we + action, then we + action.", "ph": ["record the unboxing", "check for visible damage", "run a functional test"], "sa": "First we record the unboxing and check for visible damage, then we run a functional test of walking, charging and the cameras.", "sc": "The distributor asks how you will handle delivery day.", "ss": [], "src": "Acceptance testing, warranty and after-sales service", "lab": "Work practice"}, {"q": "What are your acceptance criteria?", "vi": "Tiêu chí nghiệm thu của bạn là gì?", "st": "The robot must + requirements.", "ph": ["complete a full patrol", "return to the dock automatically", "send images to our software"], "sa": "The robot must complete a full patrol route, return to the dock automatically and send images to our software without errors.", "sc": "The distributor wants to agree on acceptance criteria before delivery.", "ss": [], "src": "Acceptance testing, warranty and after-sales service", "lab": "Work practice"}, {"q": "What support do you expect after the purchase?", "vi": "Bạn mong đợi hỗ trợ gì sau khi mua?", "st": "We expect + support.", "ph": ["onboarding training", "remote support", "fast spare parts"], "sa": "We expect onboarding training for our operators, remote support for software issues and fast delivery of spare parts.", "sc": "The distributor asks what after-sales package you need.", "ss": [], "src": "Acceptance testing, warranty and after-sales service", "lab": "Work practice"}, {"q": "What will you do if the warranty is not valid in Australia?", "vi": "Bạn sẽ làm gì nếu bảo hành không có hiệu lực ở Úc?", "st": "We would + action + or + action.", "ph": ["negotiate an extended warranty", "use a local service partner", "budget for repairs"], "sa": "We would negotiate an extended warranty with the distributor or use a local service partner, and budget for repairs.", "sc": "The founder asks about the risk of repairs abroad.", "ss": [], "src": "Acceptance testing, warranty and after-sales service", "lab": "Work practice"}], "ph": "Import-export"}, {"n": 11, "en": "Shipping to Australia: couriers, air cargo and biosecurity", "vi": "", "vocab": [{"id": "L4-0", "en": "express courier", "vi": "a company that delivers parcels quickly door to door, often handling customs", "ex": "An express courier is faster for one unit, but it costs more.", "vn": "chuyển phát nhanh"}, {"id": "L4-1", "en": "air cargo", "vi": "goods sent by plane as freight, not as a passenger's luggage", "ex": "Air cargo takes a few days, including customs clearance.", "vn": "hàng hoá đường hàng không"}, {"id": "L4-2", "en": "door-to-door", "vi": "covering transport from the sender's address to the receiver's address", "ex": "We prefer a door-to-door service to the site office.", "vn": "giao tận nơi"}, {"id": "L4-3", "en": "chargeable weight", "vi": "the weight used to calculate freight: actual or volumetric, whichever is higher", "ex": "The chargeable weight is based on the box size, not the robot's weight.", "vn": "trọng lượng tính cước"}, {"id": "L4-4", "en": "volumetric weight", "vi": "a weight calculated from the size of a package", "ex": "Large, light boxes are charged by volumetric weight.", "vn": "trọng lượng thể tích"}, {"id": "L4-5", "en": "biosecurity", "vi": "rules that protect a country from pests and diseases brought in by goods", "ex": "Australia has strict biosecurity rules for wooden packaging.", "vn": "kiểm dịch, an toàn sinh học"}, {"id": "L4-6", "en": "ISPM 15", "vi": "the international standard for treating wooden packaging such as pallets", "ex": "All wooden pallets must be treated and stamped under ISPM 15.", "vn": "tiêu chuẩn xử lý bao bì gỗ ISPM 15"}, {"id": "L4-7", "en": "fumigation", "vi": "treating goods or packaging with gas to kill insects", "ex": "The crate needs fumigation before shipment.", "vn": "hun trùng"}, {"id": "L4-8", "en": "heat treatment", "vi": "treating wood with heat to kill pests", "ex": "Heat treatment is an approved method under ISPM 15.", "vn": "xử lý nhiệt"}, {"id": "L4-9", "en": "GST (goods and services tax)", "vi": "Australia's tax on goods and services, similar to VAT", "ex": "Import GST is calculated on the customs value plus freight and insurance.", "vn": "thuế GST của Úc"}, {"id": "L4-10", "en": "customs value", "vi": "the value of goods used to calculate duty and tax", "ex": "The customs value must match the commercial invoice.", "vn": "trị giá hải quan"}, {"id": "L4-11", "en": "consignee", "vi": "the person or company that receives the goods", "ex": "Please put our Sydney office as the consignee.", "vn": "người nhận hàng"}, {"id": "L4-12", "en": "shipper", "vi": "the person or company that sends the goods", "ex": "The shipper must sign the dangerous goods declaration.", "vn": "người gửi hàng"}, {"id": "L4-13", "en": "temporary import", "vi": "bringing goods into a country for a limited time without paying full duty", "ex": "We asked the broker whether a temporary import is possible for testing.", "vn": "tạm nhập"}, {"id": "L4-14", "en": "proof of delivery", "vi": "a document or signature showing that the goods were delivered", "ex": "Please send the proof of delivery once the parcel arrives.", "vn": "bằng chứng giao hàng"}, {"id": "L4-15", "en": "transit insurance", "vi": "insurance that covers goods while they are being transported", "ex": "High-value equipment should have transit insurance.", "vn": "bảo hiểm vận chuyển"}, {"id": "L4-16", "en": "held at customs", "vi": "kept by customs until a problem is solved", "ex": "The parcel was held at customs because a document was missing.", "vn": "bị hải quan giữ"}, {"id": "L4-17", "en": "release", "vi": "allow goods to leave customs after clearance", "ex": "Customs released the shipment this morning.", "vn": "giải phóng hàng"}, {"id": "L4-18", "en": "final mile", "vi": "the last stage of delivery to the final address", "ex": "The final mile to the site will be by local truck.", "vn": "chặng giao cuối"}, {"id": "L4-19", "en": "rate comparison", "vi": "comparing prices from several transport providers", "ex": "Let's do a rate comparison between three couriers.", "vn": "so sánh giá cước"}], "quiz": [{"s": "You ship one robot in a large, light box. How is the price likely to be calculated?", "o": ["By chargeable weight, which may be the volumetric weight", "By the robot's color", "By the number of documents"], "why": "Carriers charge the higher of the actual and the volumetric weight."}, {"s": "Your crate sits on a wooden pallet. What must you check for Australia?", "o": ["That the pallet is treated and stamped under ISPM 15", "That the pallet is painted", "Nothing, wood is always fine"], "why": "Under biosecurity rules, untreated wood can be refused or treated at your cost."}, {"s": "Customs is holding your parcel. What is the best first message?", "o": ["Could you tell us which document or information customs needs to release the parcel?", "Why is customs so slow?", "Please send the parcel back."], "why": "Find out exactly what is missing so that customs can release it."}, {"s": "Which term describes the delivery from the local hub to the customer's door?", "o": ["Final mile", "Customs value", "Heat treatment"], "why": "The final mile is the last step of delivery."}, {"s": "What is GST?", "o": ["a tax on goods and services in Australia", "a type of container", "a customs document"], "why": "GST stands for goods and services tax."}, {"s": "You want to know how long the parcel will take.", "o": ["What is the estimated transit time door-to-door?", "When parcel arrive to me?", "Is the parcel late or not?"], "why": "Use \"estimated transit time\" and name the service you mean."}], "speak": [{"s": "Compare courier and air cargo with your manager", "l": ["For one robot, an express courier is faster and handles customs for us.", "Air cargo may be cheaper, but we need a broker at both ends.", "Both options need dangerous goods approval for the battery."]}, {"s": "Call about a parcel held at customs", "l": ["Our parcel has been held at customs in Sydney since Tuesday.", "Could you tell us what information is missing?", "We can send the commercial invoice and the battery documents today."]}], "email": "Subject: Quote request – one robot to Sydney\n\nDear team,\n\nWe would like a door-to-door [[quote|quotation of|quoting]] for one robot from Ho Chi Minh City to Sydney. The box is about 100 x 60 x 50 cm, with a gross weight of about 50 kg.\n\nThe robot contains a lithium-ion battery, so please confirm whether you can handle it as dangerous [[goods|good|items of]].\n\nPlease also include transit [[insurance|insure|insured]] and let us know the expected transit time.\n\nWe look forward [[to|for|at]] your reply.\n\nBest regards,\nSally", "coach": [{"q": "How will you send the robot to Australia?", "vi": "Bạn sẽ gửi robot sang Úc bằng cách nào?", "st": "We are considering + options; the final choice depends on + factors.", "ph": ["an express courier", "air cargo", "the battery rules"], "sa": "We are considering an express courier or air cargo; the final choice depends on the battery rules, the total cost and how soon the site needs it.", "sc": "The Australian site manager asks when and how the robot will arrive.", "ss": [], "src": "Shipping to Australia", "lab": "Work practice"}, {"q": "What could delay the shipment at Australian customs?", "vi": "Điều gì có thể làm lô hàng chậm ở hải quan Úc?", "st": "It could be delayed by + problems.", "ph": ["missing documents", "untreated wooden packaging", "a value mismatch"], "sa": "It could be delayed by missing documents, untreated wooden packaging or a mismatch between the customs value and the invoice.", "sc": "Your director wants to know the main shipping risks.", "ss": [], "src": "Shipping to Australia", "lab": "Work practice"}, {"q": "Who should be the consignee?", "vi": "Ai nên đứng tên người nhận hàng?", "st": "The consignee should be + party, because + reason.", "ph": ["our Australian office", "the site office", "the importer of record"], "sa": "The consignee should be our Australian office, because they will receive the goods and act as the importer of record.", "sc": "The courier asks who will receive the parcel in Australia.", "ss": [], "src": "Shipping to Australia", "lab": "Work practice"}, {"q": "How do you choose between three courier quotes?", "vi": "Bạn chọn giữa ba báo giá chuyển phát thế nào?", "st": "I compare + criteria, not just + price.", "ph": ["the total cost", "the transit time", "dangerous goods experience"], "sa": "I compare the total cost, the transit time and their experience with dangerous goods, not just the base price.", "sc": "Finance asks why you did not pick the cheapest quote.", "ss": [], "src": "Shipping to Australia", "lab": "Work practice"}], "ph": "Import-export"}, {"n": 10, "en": "Dangerous goods and compliance: batteries, radio equipment and HS codes", "vi": "", "vocab": [{"id": "L3-0", "en": "dangerous goods", "vi": "items such as batteries or chemicals that need special rules for transport", "ex": "Lithium batteries are classified as dangerous goods for air transport.", "vn": "hàng nguy hiểm"}, {"id": "L3-1", "en": "lithium-ion battery", "vi": "a rechargeable battery used in robots, laptops and phones", "ex": "The robot's lithium-ion battery is rated at about 230 watt-hours.", "vn": "pin lithium-ion"}, {"id": "L3-2", "en": "watt-hour rating", "vi": "a measure of how much energy a battery stores", "ex": "Airlines check the watt-hour rating before they accept a battery.", "vn": "chỉ số Wh của pin"}, {"id": "L3-3", "en": "UN38.3", "vi": "the UN safety test that lithium batteries must pass before they can be shipped", "ex": "Please send the UN38.3 test summary for this battery.", "vn": "chứng nhận thử nghiệm UN38.3"}, {"id": "L3-4", "en": "safety data sheet", "vi": "a document describing a product's hazards and how to handle it safely (also called MSDS)", "ex": "The forwarder asked for the safety data sheet before booking.", "vn": "bảng dữ liệu an toàn (MSDS)"}, {"id": "L3-5", "en": "declaration", "vi": "an official written statement about goods", "ex": "The shipper must sign a dangerous goods declaration.", "vn": "bản khai, tờ khai"}, {"id": "L3-6", "en": "classification", "vi": "putting goods into the correct official category", "ex": "Correct classification decides the duty rate.", "vn": "phân loại hàng"}, {"id": "L3-7", "en": "radio equipment approval", "vi": "official permission to use a device that sends wireless signals", "ex": "The robot uses WiFi and 4G, so we must check radio equipment approval.", "vn": "chứng nhận thiết bị vô tuyến"}, {"id": "L3-8", "en": "certificate of conformity", "vi": "a document stating that a product meets the required standards", "ex": "The buyer wants a certificate of conformity for each unit.", "vn": "giấy chứng nhận hợp chuẩn"}, {"id": "L3-9", "en": "test report", "vi": "a document showing the results of a product test by a laboratory", "ex": "The lab will issue the test report within ten days.", "vn": "báo cáo thử nghiệm"}, {"id": "L3-10", "en": "restricted item", "vi": "goods that can only be shipped or imported under certain conditions", "ex": "Large batteries are a restricted item on passenger flights.", "vn": "hàng hạn chế"}, {"id": "L3-11", "en": "prohibited", "vi": "not allowed by law or rules", "ex": "Some chemicals are prohibited on all flights.", "vn": "bị cấm"}, {"id": "L3-12", "en": "regulation", "vi": "an official rule made by a government or authority", "ex": "We must follow the regulations of the destination country.", "vn": "quy định"}, {"id": "L3-13", "en": "compliance check", "vi": "a review to make sure goods meet all rules before shipping", "ex": "The compliance check found a missing label.", "vn": "kiểm tra tuân thủ"}, {"id": "L3-14", "en": "duty rate", "vi": "the percentage of tax charged on imported goods", "ex": "The duty rate depends on the HS code.", "vn": "thuế suất"}, {"id": "L3-15", "en": "import permit", "vi": "official permission to bring certain goods into a country", "ex": "Do we need an import permit for this equipment?", "vn": "giấy phép nhập khẩu"}, {"id": "L3-16", "en": "liability", "vi": "legal responsibility for something, especially damage or cost", "ex": "Who takes liability if the battery is damaged in transit?", "vn": "trách nhiệm pháp lý"}, {"id": "L3-17", "en": "hazard", "vi": "something that could cause harm or damage", "ex": "A damaged battery is a fire hazard.", "vn": "mối nguy"}, {"id": "L3-18", "en": "packaging requirements", "vi": "the rules about how goods must be packed for transport", "ex": "Dangerous goods have strict packaging requirements.", "vn": "yêu cầu đóng gói"}, {"id": "L3-19", "en": "audit trail", "vi": "a record of every step and decision that can be checked later", "ex": "Keep all emails with the broker as an audit trail.", "vn": "hồ sơ lưu vết"}], "quiz": [{"s": "An airline asks about the robot's battery. Which details do they usually need?", "o": ["The watt-hour rating, the UN38.3 test summary and the safety data sheet", "Only the battery color", "The price of the robot"], "why": "Battery energy and safety documents decide whether and how it can fly."}, {"s": "The agency gives you an HS code by phone. What should you do?", "o": ["Ask them to confirm the HS code and duty rate in writing.", "Use it and forget about it.", "Choose a code with a lower duty."], "why": "Get written confirmation; choosing a code just to pay less duty is misclassification."}, {"s": "\"Restricted\" means…", "o": ["allowed only under certain conditions", "never allowed", "allowed with no rules"], "why": "Restricted = conditions apply; prohibited = not allowed at all."}, {"s": "Which document explains a product's hazards and how to handle it?", "o": ["A safety data sheet", "A packing list", "A tracking number"], "why": "A safety data sheet describes hazards and safe handling."}, {"s": "You want to know if the robot needs a permit to be imported.", "o": ["Does this product need an import permit or a radio approval?", "Can I just import it, yes or no?", "Who cares about permits?"], "why": "Ask about the exact permit types for the product."}, {"s": "\"Compliance\" means…", "o": ["following the rules and regulations", "asking for a lower price", "shipping by air"], "why": "Compliance is meeting the legal requirements."}], "speak": [{"s": "Ask a forwarder about shipping a battery", "l": ["We need to ship a robot with a lithium-ion battery of about 230 watt-hours.", "Can you accept it as dangerous goods by air?", "Which documents do you need from us before booking?"]}, {"s": "Explain a compliance risk to your director", "l": ["Before we order, we need to confirm two compliance points.", "The robot uses WiFi and 4G, so it may need radio equipment approval.", "I'll get written confirmation from the agency before we pay."]}], "email": "Subject: Battery documents for shipment\n\nDear Supplier Support team,\n\nOur forwarder has asked for the battery documents [[before|until|after]] they can confirm the booking. Could you please send the UN38.3 test summary and the safety data [[sheet|paper|form]] for the A2 battery?\n\nThe battery is [[classified|classifying|class]] as dangerous goods, so the documents must match the exact model we are buying.\n\nWe would also like to know who takes [[liability|liable|lie]] if the battery is damaged in transit.\n\nThank you in advance.\n\nBest regards,\nSally", "coach": [{"q": "Why do lithium batteries need special handling?", "vi": "Vì sao pin lithium cần xử lý đặc biệt?", "st": "They are + classification + because + reason.", "ph": ["dangerous goods", "a fire hazard", "strict packaging requirements"], "sa": "They are classified as dangerous goods because a damaged battery can be a fire hazard, so they have strict packaging requirements.", "sc": "A new admin colleague asks why the robot cannot simply go in a suitcase.", "ss": [], "src": "Dangerous goods and compliance", "lab": "Work practice"}, {"q": "Which documents will you ask the supplier for?", "vi": "Bạn sẽ xin nhà cung cấp những chứng từ nào?", "st": "We will ask for + documents.", "ph": ["the UN38.3 test summary", "the safety data sheet", "a certificate of conformity"], "sa": "We will ask for the UN38.3 test summary, the safety data sheet and a certificate of conformity for the exact model.", "sc": "The forwarder needs documents before they can quote.", "ss": [], "src": "Dangerous goods and compliance", "lab": "Work practice"}, {"q": "Who confirms the HS code and duty rate?", "vi": "Ai xác nhận mã HS và thuế suất?", "st": "+ party + confirms it, and we keep + record.", "ph": ["the customs broker", "in writing", "an audit trail"], "sa": "The customs broker confirms it in writing, and we keep the email as an audit trail in the shipment folder.", "sc": "Your director asks how you know the duty rate is correct.", "ss": [], "src": "Dangerous goods and compliance", "lab": "Work practice"}, {"q": "What is the biggest compliance risk in this project?", "vi": "Rủi ro tuân thủ lớn nhất của dự án là gì?", "st": "The biggest risk is + risk, because + consequence.", "ph": ["radio equipment approval", "the battery shipment", "delays at customs"], "sa": "The biggest risk is radio equipment approval, because without it the robot could be held at customs and we could not use it legally.", "sc": "The founder asks what could stop the project.", "ss": [], "src": "Dangerous goods and compliance", "lab": "Work practice"}], "ph": "Import-export"}, {"n": 14, "en": "Exporting building materials: samples, packing and quality", "vi": "", "vocab": [{"id": "L7-0", "en": "brick sample", "vi": "a single brick sent so the buyer can check its quality", "ex": "We are sending two brick samples to the buyer in Sydney.", "vn": "gạch mẫu"}, {"id": "L7-1", "en": "crate", "vi": "a strong wooden or plastic box for shipping goods", "ex": "The samples are packed in a wooden crate.", "vn": "thùng gỗ, kiện"}, {"id": "L7-2", "en": "dimensions", "vi": "measurements of length, width and height", "ex": "Please confirm the dimensions of each brick.", "vn": "kích thước"}, {"id": "L7-3", "en": "net weight", "vi": "the weight of the goods without packaging", "ex": "The net weight of the samples is about 32 kilograms.", "vn": "trọng lượng tịnh"}, {"id": "L7-4", "en": "gross weight", "vi": "the total weight including packaging", "ex": "The gross weight is higher because of the wooden crate.", "vn": "trọng lượng cả bì"}, {"id": "L7-5", "en": "shipping mark", "vi": "information printed on a package, such as buyer, destination and package number", "ex": "Each crate needs a clear shipping mark.", "vn": "ký mã hiệu"}, {"id": "L7-6", "en": "fragile", "vi": "easily broken", "ex": "Mark the crate as fragile and keep it upright.", "vn": "dễ vỡ"}, {"id": "L7-7", "en": "cushioning", "vi": "soft material that protects goods from impact", "ex": "Add foam cushioning between the bricks.", "vn": "vật liệu chèn lót"}, {"id": "L7-8", "en": "compressive strength", "vi": "the ability of a material to resist being crushed", "ex": "The buyer asked for the compressive strength test results.", "vn": "cường độ nén"}, {"id": "L7-9", "en": "water absorption", "vi": "how much water a material takes in", "ex": "Low water absorption is important for outdoor use.", "vn": "độ hút nước"}, {"id": "L7-10", "en": "finish", "vi": "the look and feel of a surface, such as matt or glossy", "ex": "The buyer prefers a natural matt finish.", "vn": "bề mặt hoàn thiện"}, {"id": "L7-11", "en": "color variation", "vi": "differences in color between items in a batch", "ex": "Some color variation is normal for clay bricks.", "vn": "chênh lệch màu"}, {"id": "L7-12", "en": "product standard", "vi": "an official technical requirement a product must meet in a market", "ex": "We need to check which product standard applies in Australia.", "vn": "tiêu chuẩn sản phẩm"}, {"id": "L7-13", "en": "third-party inspection", "vi": "a quality check done by an independent company", "ex": "The buyer may require a third-party inspection before shipment.", "vn": "kiểm định bên thứ ba"}, {"id": "L7-14", "en": "price per square meter", "vi": "the price for one square meter of a material such as tiles or bricks", "ex": "Our price per square meter includes export packing.", "vn": "giá trên mỗi mét vuông"}, {"id": "L7-15", "en": "container load", "vi": "the amount of goods that fits in one container", "ex": "How many square meters fit in one container load?", "vn": "sức chứa một container"}, {"id": "L7-16", "en": "palletize", "vi": "pack goods onto pallets for transport", "ex": "We will palletize the order and wrap it in film.", "vn": "xếp lên pallet"}, {"id": "L7-17", "en": "breakage", "vi": "goods broken during handling or transport", "ex": "We include a small breakage allowance in the price.", "vn": "hàng vỡ hỏng"}, {"id": "L7-18", "en": "trial order", "vi": "a small first order to test a product or supplier", "ex": "If the samples pass, they will place a trial order.", "vn": "đơn hàng thử"}, {"id": "L7-19", "en": "sample approval", "vi": "the buyer's formal acceptance of a sample before production", "ex": "Production will start after sample approval.", "vn": "duyệt mẫu"}], "quiz": [{"s": "The buyer asks why the samples look slightly different in color. What is the best answer?", "o": ["Some color variation is normal for natural clay, and production will stay within the approved sample range.", "They are not the same bricks.", "Color is not important."], "why": "Explain the natural cause and link it to the approved sample."}, {"s": "You use a wooden pallet for the sample crate to Australia. Which detail matters most?", "o": ["ISPM 15 treatment and stamp", "The color of the pallet", "The brand of the wrapping film"], "why": "Wooden packaging must meet biosecurity rules."}, {"s": "What does \"net weight\" exclude?", "o": ["the packaging", "the goods", "the shipping mark"], "why": "Net = goods only; gross = goods plus packaging."}, {"s": "\"Gross weight\" includes…", "o": ["the product and its packaging", "only the product", "only the box"], "why": "Gross weight is the total, net weight is the product alone."}, {"s": "A buyer worries about breakage during shipping.", "o": ["We pack in wooden crates with cushioning, and we can add a small breakage allowance.", "Nothing will break, trust us.", "If it breaks, it is not our problem."], "why": "Explain how you reduce the risk and offer a practical solution."}, {"s": "What is a \"trial order\"?", "o": ["a small first order to test the quality and the cooperation", "an order in a court", "a free gift"], "why": "A trial order lets both sides test before a large commitment."}], "speak": [{"s": "Present your brick samples to a buyer", "l": ["We've sent two samples with a natural matt finish.", "They have low water absorption, which suits outdoor use.", "We can share compressive strength test results on request."]}, {"s": "Explain the packing to a courier", "l": ["The samples are packed in one wooden crate with foam cushioning.", "The pallet is heat-treated and stamped under ISPM 15.", "The crate is marked fragile, with the net and gross weight on the label."]}], "email": "Subject: Brick samples – shipment details\n\nDear Mr. Wilson,\n\nWe are pleased to confirm that the brick samples [[were|was|are being]] dispatched today. They are packed in one wooden crate with foam cushioning, and the pallet is heat-treated [[under|on|by]] ISPM 15.\n\nThe net weight is about 32 kg. We will send the tracking number [[as soon as|as long as|as well as]] we receive it from the courier.\n\nOnce you have checked the samples, we would welcome your feedback before the [[trial|try|trying]] order.\n\nBest regards,\nSally", "coach": [{"q": "Can you describe the samples you sent?", "vi": "Bạn mô tả hàng mẫu đã gửi được không?", "st": "We sent + quantity + with + features.", "ph": ["a natural matt finish", "low water absorption", "consistent dimensions"], "sa": "We sent two brick samples with a natural matt finish, low water absorption and consistent dimensions.", "sc": "An Australian buyer calls to ask about the samples on their way.", "ss": [], "src": "Exporting building materials", "lab": "Work practice"}, {"q": "How did you pack the samples to avoid breakage?", "vi": "Bạn đóng gói mẫu thế nào để tránh vỡ?", "st": "We + packing steps + to + purpose.", "ph": ["used a wooden crate", "added foam cushioning", "marked it fragile"], "sa": "We used a wooden crate, added foam cushioning between the bricks and marked it fragile to avoid breakage.", "sc": "The courier asks whether the crate needs special handling.", "ss": [], "src": "Exporting building materials", "lab": "Work practice"}, {"q": "What tests might the buyer ask for?", "vi": "Người mua có thể yêu cầu thử nghiệm gì?", "st": "They might ask for + tests.", "ph": ["compressive strength", "water absorption", "a third-party inspection"], "sa": "They might ask for compressive strength and water absorption test results, or a third-party inspection before shipment.", "sc": "Your director asks what the buyer may need before ordering.", "ss": [], "src": "Exporting building materials", "lab": "Work practice"}, {"q": "What happens after the samples are approved?", "vi": "Sau khi mẫu được duyệt thì sao?", "st": "After + step, + next steps.", "ph": ["sample approval", "a trial order", "production starts"], "sa": "After sample approval, the buyer places a trial order, we confirm the price per square meter and production starts.", "sc": "The buyer asks about the next steps.", "ss": [], "src": "Exporting building materials", "lab": "Work practice"}], "ph": "Import-export"}, {"n": 29, "en": "Building materials 2: orders, loading and delivery to site", "vi": "", "vocab": [{"id": "E29-0", "en": "pallet", "vi": "a flat wooden base used to stack and move goods", "ex": "The tiles are packed on wooden pallets.", "vn": "pallet, kệ nâng hàng"}, {"id": "E29-1", "en": "wooden crate", "vi": "a strong wooden box used to protect heavy goods", "ex": "Glass panels are shipped in wooden crates.", "vn": "thùng gỗ"}, {"id": "E29-2", "en": "strapping", "vi": "strong bands used to hold goods together", "ex": "Each pallet is wrapped and fixed with strapping.", "vn": "dây đai"}, {"id": "E29-3", "en": "breakage allowance", "vi": "extra goods added to cover pieces that may break", "ex": "We add a 2 percent breakage allowance to the order.", "vn": "phần hàng dự phòng vỡ"}, {"id": "E29-4", "en": "damage in transit", "vi": "damage that happens while the goods are being moved", "ex": "Please report any damage in transit within three days.", "vn": "hư hỏng khi vận chuyển"}, {"id": "E29-5", "en": "loading list", "vi": "a list that shows what is loaded into each container", "ex": "The loading list will be sent before departure.", "vn": "danh sách xếp hàng"}, {"id": "E29-6", "en": "loading photos", "vi": "pictures taken while a container is being loaded", "ex": "We will send loading photos for each container.", "vn": "ảnh xếp hàng"}, {"id": "E29-7", "en": "forklift", "vi": "a small vehicle with two arms for lifting pallets", "ex": "The site needs a forklift to unload the pallets.", "vn": "xe nâng"}, {"id": "E29-8", "en": "unloading", "vi": "taking goods off a truck or out of a container", "ex": "Unloading will take about two hours.", "vn": "dỡ hàng"}, {"id": "E29-9", "en": "site delivery", "vi": "delivery directly to the building site", "ex": "We can arrange site delivery in Melbourne.", "vn": "giao hàng tại công trình"}, {"id": "E29-10", "en": "delivery window", "vi": "the time period in which a delivery can arrive", "ex": "The delivery window is between 8 and 10 a.m.", "vn": "khung giờ giao hàng"}, {"id": "E29-11", "en": "site contact", "vi": "the person at the building site who receives the goods", "ex": "Please give us the name of the site contact.", "vn": "người nhận tại công trình"}, {"id": "E29-12", "en": "made to order", "vi": "produced only after the customer places an order", "ex": "These panels are made to order, so lead time is six weeks.", "vn": "sản xuất theo đơn"}, {"id": "E29-13", "en": "in stock", "vi": "available now and ready to be sent", "ex": "The grey tiles are in stock and can ship this week.", "vn": "có sẵn trong kho"}, {"id": "E29-14", "en": "colour matching", "vi": "making sure the colour is the same as a sample", "ex": "We offer colour matching for special orders.", "vn": "phối màu theo mẫu"}, {"id": "E29-15", "en": "installation guide", "vi": "a document that explains how to put a product in place", "ex": "The installation guide is included in each carton.", "vn": "hướng dẫn lắp đặt"}, {"id": "E29-16", "en": "service life", "vi": "the number of years that a product can be used", "ex": "The service life of these panels is more than 30 years.", "vn": "tuổi thọ sử dụng"}, {"id": "E29-17", "en": "defect claim", "vi": "a request for repair or replacement because of a fault", "ex": "We will review your defect claim within 48 hours.", "vn": "khiếu nại về lỗi"}, {"id": "E29-18", "en": "photographic evidence", "vi": "pictures that prove a problem", "ex": "Please send photographic evidence of the damage.", "vn": "bằng chứng bằng ảnh"}, {"id": "E29-19", "en": "storage conditions", "vi": "the way goods must be kept before use", "ex": "Keep the boxes dry; check the storage conditions on the label.", "vn": "điều kiện bảo quản"}], "quiz": [{"s": "Some tiles always break in transit. How do you plan for it?", "o": ["We recommend adding a 2 percent breakage allowance to the order.", "Please do not break the tiles.", "Tiles break, so it is your problem."], "why": "A \"breakage allowance\" is a normal extra quantity that covers expected damage."}, {"s": "The goods arrived with damage. What should the customer send first?", "o": ["Please send photographic evidence of the damage within three days.", "Please tell us you are angry.", "Send the goods back to us at once."], "why": "A claim needs evidence and a deadline. Photos are the standard proof."}, {"s": "You want to organise a delivery to the building site.", "o": ["Could you give us the name of the site contact and the delivery window?", "Where do I put the goods?", "Tell me when you are free."], "why": "Two facts are needed: who receives the goods and when."}, {"s": "\"Made to order\" means…", "o": ["produced only after the customer places the order", "always in stock", "made by a robot"], "why": "Made-to-order items need a longer lead time."}, {"s": "You want to check availability.", "o": ["Is this colour in stock, or is it made to order?", "Do you have colour or not?", "I want this colour today."], "why": "Ask whether it's in stock or made to order, and then the lead time."}, {"s": "What is a forklift used for?", "o": ["lifting and moving pallets", "cutting tiles", "measuring weight"], "why": "A forklift unloads pallets from trucks and containers."}], "speak": [{"s": "Confirm loading and delivery details", "l": ["We will load two containers on Monday and send you the loading photos.", "The goods are packed on pallets with strapping.", "Please confirm the site contact and that you have a forklift for unloading."]}, {"s": "Handle a damage report", "l": ["I'm sorry to hear that some tiles arrived broken.", "Could you send photographic evidence and the number of pallets affected?", "We will review your defect claim within 48 hours."]}], "email": "Subject: Delivery to site – order 4417\n\nDear Ms. Evans,\n\nYour order is ready and will be loaded on Monday. The tiles are packed on pallets and fixed [[with|by|from]] strapping. We have added a 2 percent breakage [[allowance|allow|allowing]] to the quantity.\n\nPlease confirm the site [[contact|contacting|contacted]] and th
