n và tuổi thọ sản phẩm", "sc": "The customer is a technical company that cares strongly about product durability. You need to give a convincing explanation of product lifespan and reliability."}, {"q": "What kind of warranty covers it?", "vi": "Sản phẩm được bảo hành như thế nào?", "st": "The warranty includes + support item.", "ph": ["replacement parts", "technical support", "repair service"], "ss": ["The warranty includes replacement parts for confirmed production-related issues within the covered period.", "We also provide technical support to help customers identify the issue and choose the best solution.", "If necessary, repair service can also be arranged depending on the product type and market location."], "sa": "The warranty includes replacement parts, technical support, and repair service when applicable.", "src": "Trình bày độ bền và tuổi thọ sản phẩm", "sc": "The customer is a technical company that cares strongly about product durability. You need to give a convincing explanation of product lifespan and reliability."}, {"q": "How does it perform in harsh conditions?", "vi": "Sản phẩm hoạt động như thế nào trong điều kiện khắc nghiệt?", "st": "It performs well in + harsh environment type.", "ph": ["extreme temperatures", "high humidity", "corrosive environments"], "ss": ["It performs well in extreme temperatures when used within the tested operating range.", "The product is also designed to maintain stable performance in high-humidity environments with proper material treatment and finishing.", "For corrosive environments, we can recommend suitable coatings, materials, or protective specifications based on the actual use case."], "sa": "It performs well in extreme temperatures, high humidity, and other demanding environments when the right materials and finishing are applied.", "src": "Trình bày độ bền và tuổi thọ sản phẩm", "sc": "The customer is a technical company that cares strongly about product durability. You need to give a convincing explanation of product lifespan and reliability."}], "ph": "Sales and meetings"}, {"n": 22, "en": "Emails to suppliers and factories: orders, specifications, quality problems", "vi": "", "vocab": [{"id": "E22-0", "en": "purchase order", "vi": "an official document in which a buyer orders goods", "ex": "Please confirm receipt of purchase order PO-2048.", "vn": "đơn đặt hàng"}, {"id": "E22-1", "en": "order quantity", "vi": "the number of units in an order", "ex": "The order quantity is 2,000 units.", "vn": "số lượng đặt hàng"}, {"id": "E22-r2", "en": "unit cost", "vi": "the cost of making or buying one item", "ex": "Can you break down the unit cost for this item?", "vn": "giá thành một đơn vị"}, {"id": "E22-r3", "en": "raw material", "vi": "the basic material used to make a product", "ex": "The price of raw material went up by eight percent.", "vn": "nguyên liệu thô"}, {"id": "E22-4", "en": "production schedule", "vi": "the plan that shows when each step of production happens", "ex": "Could you send us the production schedule for this order?", "vn": "kế hoạch sản xuất"}, {"id": "E22-5", "en": "pre-production sample", "vi": "a sample made before mass production to check quality", "ex": "We need to approve the pre-production sample first.", "vn": "mẫu trước sản xuất"}, {"id": "E22-r6", "en": "material certificate", "vi": "a document that proves the quality of the material", "ex": "Please attach the material certificate to the shipment.", "vn": "chứng chỉ vật liệu"}, {"id": "E22-7", "en": "defect rate", "vi": "the share of products that have a fault", "ex": "The defect rate in the last batch was 4 percent.", "vn": "tỷ lệ lỗi"}, {"id": "E22-8", "en": "non-conformance", "vi": "a product or process that does not meet the requirement", "ex": "We found a non-conformance in the packaging.", "vn": "sự không phù hợp (so với yêu cầu)"}, {"id": "E22-r9", "en": "defective", "vi": "having a fault and not working as it should", "ex": "Twenty cartons contained defective units.", "vn": "bị lỗi"}, {"id": "E22-r10", "en": "quality standard", "vi": "the level of quality that a product must reach", "ex": "The goods do not meet our quality standard.", "vn": "tiêu chuẩn chất lượng"}, {"id": "E22-11", "en": "inspection report", "vi": "a document with the results of a quality check", "ex": "The inspection report shows two major defects.", "vn": "báo cáo kiểm hàng"}, {"id": "E22-r12", "en": "production run", "vi": "one period of making a set number of products", "ex": "The next production run starts on Monday.", "vn": "đợt sản xuất"}, {"id": "E22-13", "en": "rework", "vi": "repair or redo a product so that it meets the requirement", "ex": "We expect you to rework the faulty units at your cost.", "vn": "làm lại, sửa lại hàng lỗi"}, {"id": "E22-14", "en": "change request", "vi": "a formal request to change the order or the specification", "ex": "We would like to submit a change request for the logo position.", "vn": "yêu cầu thay đổi"}, {"id": "E22-15", "en": "ready date", "vi": "the date when the goods are ready to be collected", "ex": "What is the ready date for the second batch?", "vn": "ngày hàng sẵn sàng"}, {"id": "E22-r16", "en": "carton label", "vi": "a label on the outside of a carton", "ex": "Each carton label must show the PO number.", "vn": "nhãn thùng hàng"}, {"id": "E22-17", "en": "acknowledge receipt", "vi": "confirm that you have received something", "ex": "Please acknowledge receipt of this email.", "vn": "xác nhận đã nhận"}, {"id": "E22-r18", "en": "approve the sample", "vi": "agree officially that a sample is good enough", "ex": "We will approve the sample after the test.", "vn": "duyệt mẫu"}, {"id": "E22-19", "en": "prompt reply", "vi": "a quick answer", "ex": "We would appreciate a prompt reply, as the deadline is tight.", "vn": "phản hồi nhanh"}], "quiz": [{"s": "You are sending a purchase order to a factory. Which sentence works best?", "o": ["Please find attached purchase order PO-2048. Kindly acknowledge receipt and confirm the ready date.", "Here is order. You make and send soon.", "I want to buy, please do it fast."], "why": "Name the document, then say exactly what you need back: acknowledgement and a date."}, {"s": "The last batch had a high defect rate. How do you ask for action?", "o": ["Please investigate the root cause and send us your corrective action plan by Friday.", "Please be better next time.", "Fix the problem or we will stop everything."], "why": "Ask for a cause, a plan and a deadline. It is firm and still professional."}, {"s": "A supplier gave a new price by phone. What should you write?", "o": ["Thank you for the call. Could you please confirm the new price in writing?", "I don't trust phone calls.", "OK, I note it in my head."], "why": "Prices and terms should always be confirmed in writing so both sides have a record."}, {"s": "\"Pre-production sample\" means…", "o": ["a sample made to approve quality before mass production", "a sample made after the goods ship", "a free product for staff"], "why": "Approve the sample before the factory starts mass production."}, {"s": "You want to know when the factory will be ready.", "o": ["Could you confirm the ready date for the second batch?", "When you finish, tell me.", "The batch is ready or no?"], "why": "Ask for a specific date, and name the batch."}, {"s": "The factory proposes a later date, but your customer's deadline is fixed.", "o": ["We can't accept a later date, as our customer's deadline is fixed. Could you expedite?", "Late is not okay, we will leave you.", "Maybe later is fine, you decide."], "why": "Explain the reason and ask for a solution."}], "speak": [{"s": "Call a factory about a quality problem", "l": ["Hello, this is Sally. I'm calling about the last batch.", "Our inspector found two major defects in the packaging.", "Could you check the root cause and send us a corrective action plan by Friday?"]}, {"s": "Ask a supplier to confirm a new order", "l": ["We would like to place a new order for 2,000 units.", "Could you confirm the ready date and the payment terms?", "Please send us the pro forma invoice in writing."]}], "email": "Subject: Quality issue – batch 07, PO-2048\n\nDear Mr. Chen,\n\nThank you for sending the inspection report. We found that the defect rate in batch 07 is 6 percent, [[which|what|who]] is above our limit of 2 percent.\n\nCould you please investigate the root [[cause|causing|caused]] and send us a corrective action plan [[by|until|since]] Friday? We also expect you to rework the faulty units [[at your cost|in your cost|on your cost]].\n\nPlease confirm the new ready date [[in writing|by writing|with write]]. We would appreciate a prompt reply.\n\nBest regards,\nSally", "coach": [{"q": "Why are you changing the order?", "vi": "Vì sao bạn thay đổi đơn hàng?", "st": "We would like to submit a change request because + reason.", "ph": ["a change request", "a new packaging design", "a different logo position"], "ss": [], "sa": "We would like to submit a change request because our customer asked for a new packaging design and a different logo position.", "src": "Email by audience", "sc": "A supplier is surprised that you want to change an order that is already in production.", "lab": "Work practice"}, {"q": "Can you explain the quality problem?", "vi": "Bạn có thể giải thích vấn đề chất lượng không?", "st": "We found + problem + in + batch / product.", "ph": ["two major defects", "the inspection report", "does not meet the specification"], "ss": [], "sa": "We found two major defects in this batch, as shown in the inspection report. The packaging does not meet the specification.", "src": "Email by audience", "sc": "Your factory contact asks you to explain exactly what is wrong with the last delivery.", "lab": "Work practice"}, {"q": "When can you send the next batch?", "vi": "Khi nào bạn có thể gửi lô tiếp theo?", "st": "The ready date is + date, if + condition.", "ph": ["the ready date", "the pre-production sample", "pay the deposit"], "ss": [], "sa": "The ready date is 20 January, if we approve the pre-production sample and pay the deposit by next week.", "src": "Email by audience", "sc": "You are planning the schedule with a supplier and need a clear date and the condition for it.", "lab": "Work practice"}, {"q": "Why do you need it in writing?", "vi": "Vì sao bạn cần xác nhận bằng văn bản?", "st": "We need it in writing so that + reason.", "ph": ["a clear record", "avoid misunderstandings", "both sides"], "ss": [], "sa": "We need it in writing so that both sides have a clear record and we can avoid misunderstandings later.", "src": "Email by audience", "sc": "A supplier says a phone call is enough and does not want to send an email.", "lab": "Work practice"}], "ph": "Email writing by audience"}, {"n": 23, "en": "Emails to forwarders and carriers: bookings, documents, schedule changes", "vi": "", "vocab": [{"id": "E23-0", "en": "booking confirmation", "vi": "a document from the carrier that confirms space on a ship", "ex": "We received the booking confirmation for the 40-foot container.", "vn": "xác nhận đặt chỗ"}, {"id": "E23-1", "en": "cut-off date", "vi": "the last date to deliver cargo or documents for a sailing", "ex": "The cut-off date for this vessel is 12 December.", "vn": "hạn chót giao hàng hoặc chứng từ"}, {"id": "E23-2", "en": "ETD (estimated time of departure)", "vi": "the expected date when the ship or flight leaves", "ex": "The ETD is 14 December from Cat Lai port.", "vn": "ngày dự kiến khởi hành"}, {"id": "E23-3", "en": "ETA (estimated time of arrival)", "vi": "the expected date when the ship or flight arrives", "ex": "The ETA at Sydney is 5 January.", "vn": "ngày dự kiến đến"}, {"id": "E23-r4", "en": "vessel", "vi": "a ship that carries cargo", "ex": "The vessel leaves Cat Lai port on Tuesday.", "vn": "tàu chở hàng"}, {"id": "E23-5", "en": "shipping instruction", "vi": "the details you give the forwarder to prepare the bill of lading", "ex": "Please send us the shipping instruction by Tuesday noon.", "vn": "hướng dẫn làm vận đơn"}, {"id": "E23-6", "en": "bill of lading", "vi": "the main transport document that proves the carrier received the cargo", "ex": "Please check the draft bill of lading carefully.", "vn": "vận đơn đường biển"}, {"id": "E23-r7", "en": "port of loading", "vi": "the port where cargo is put on the ship", "ex": "The port of loading is Hai Phong.", "vn": "cảng xếp hàng"}, {"id": "E23-r8", "en": "port of discharge", "vi": "the port where cargo is taken off the ship", "ex": "The port of discharge is Sydney.", "vn": "cảng dỡ hàng"}, {"id": "E23-9", "en": "notify party", "vi": "the company that the carrier contacts when the goods arrive", "ex": "Please add our broker as the notify party.", "vn": "bên được thông báo"}, {"id": "E23-r10", "en": "container yard", "vi": "the place where containers are kept before loading", "ex": "Please return the empty container to the container yard.", "vn": "bãi container"}, {"id": "E23-r11", "en": "shipping line", "vi": "a company that owns ships and sells space on them", "ex": "The shipping line has changed the sailing date.", "vn": "hãng tàu"}, {"id": "E23-r12", "en": "weight limit", "vi": "the most weight that is allowed", "ex": "The pallet is over the weight limit.", "vn": "giới hạn trọng lượng"}, {"id": "E23-13", "en": "pick-up", "vi": "collect the goods from the sender", "ex": "Can you arrange a pick-up from our warehouse on Monday?", "vn": "lấy hàng"}, {"id": "E23-14", "en": "roll over", "vi": "move cargo to a later ship because the first ship is full", "ex": "Our container was rolled over to the next vessel.", "vn": "bị đẩy sang chuyến sau"}, {"id": "E23-15", "en": "transshipment", "vi": "moving cargo from one ship to another during the trip", "ex": "The route includes one transshipment in Singapore.", "vn": "chuyển tải"}, {"id": "E23-16", "en": "schedule change", "vi": "a change in departure or arrival dates", "ex": "We were informed of a schedule change this morning.", "vn": "thay đổi lịch tàu"}, {"id": "E23-r17", "en": "cubic metre", "vi": "a unit used to measure the space that cargo takes", "ex": "The shipment is about 22 cubic metres.", "vn": "mét khối"}, {"id": "E23-18", "en": "amend", "vi": "change a document after it was issued", "ex": "Please amend the consignee name on the bill of lading.", "vn": "sửa đổi"}, {"id": "E23-19", "en": "urgent", "vi": "needing quick action", "ex": "This is urgent, as the cut-off date is tomorrow.", "vn": "khẩn"}], "quiz": [{"s": "You need a price for sea freight. Which request is clear?", "o": ["Could you send us your freight rate for 1 x 20-foot container from Ho Chi Minh City to Sydney, including all surcharges?", "How much shipping?", "Please give price to Sydney, thank you very much."], "why": "Name the container, the route and what the price must include."}, {"s": "The draft bill of lading has a wrong consignee name.", "o": ["Please amend the consignee name on the bill of lading as shown below.", "The bill of lading is wrong, do it again.", "Change name, okay?"], "why": "\"Amend\" is the standard word, and showing the correct name saves time."}, {"s": "Your container was rolled over. What should you ask first?", "o": ["Could you confirm the new ETD and ETA, and whether any extra cost applies?", "Why did you do this to us?", "Tell me what you will do."], "why": "Ask for the new dates and the cost impact. Do not start with blame."}, {"s": "What is the \"cut-off date\"?", "o": ["the last date to deliver cargo or documents for a sailing", "the date when goods arrive", "the date when you pay"], "why": "Miss the cut-off and the cargo may be rolled over."}, {"s": "You need to check the transport document before the ship leaves.", "o": ["Could you send us the draft bill of lading to check?", "Send me the paper, I check later.", "I do not need to check anything."], "why": "Always check the draft bill of lading before it is final."}, {"s": "\"Roll over\" means…", "o": ["move cargo to a later ship", "turn a container around", "cancel a booking"], "why": "If the ship is full, cargo is rolled over to the next sailing."}], "speak": [{"s": "Book a shipment with a forwarder", "l": ["Hello, I'd like to book one 20-foot container from Ho Chi Minh City to Sydney.", "The cargo will be ready on 10 December.", "Could you send us the booking confirmation and the cut-off date?"]}, {"s": "Ask about a schedule change", "l": ["I saw that the vessel schedule has changed.", "Could you confirm the new ETD and ETA?", "Please let me know if there is any extra cost."]}], "email": "Subject: Booking request – 1 x 20' FCL to Sydney\n\nDear Ms. Park,\n\nWe would like to [[book|booking|to booking]] one 20-foot container from Ho Chi Minh City to Sydney. The cargo will be ready [[on|at|in]] 10 December.\n\nCould you send us your freight rate, including all [[surcharges|surcharging|surcharged]], and the cut-off date for the earliest sailing?\n\nPlease also let us know the [[transit time|transit times|transiting time]] and whether there is any transshipment.\n\nThank you for your prompt reply.\n\nBest regards,\nSally", "coach": [{"q": "Can you give me a quote for this route?", "vi": "Bạn báo giúp tôi giá cho tuyến này được không?", "st": "Could you send us + information + for + route?", "ph": ["your freight rate", "all surcharges", "the transit time"], "ss": [], "sa": "Could you send us your freight rate, all surcharges and the transit time for one 20-foot container to Sydney?", "src": "Email by audience", "sc": "You are asking a forwarder for a first quotation and want it to be complete.", "lab": "Work practice"}, {"q": "Why was my container delayed?", "vi": "Vì sao container của tôi bị trễ?", "st": "The container was delayed because + reason.", "ph": ["rolled over", "the next vessel", "extra cost"], "ss": [], "sa": "The container was rolled over to the next vessel because the first ship was full. There is no extra cost, and the new ETA is 8 January.", "src": "Email by audience", "sc": "Your customer asks you why their cargo has not arrived on the date you gave them.", "lab": "Work practice"}, {"q": "What documents do you need from us?", "vi": "Bạn cần chứng từ gì từ chúng tôi?", "st": "We need + document + before + deadline.", "ph": ["the shipping instruction", "the packing list", "the cut-off date"], "ss": [], "sa": "We need the shipping instruction and the packing list before the cut-off date, so we can issue the bill of lading on time.", "src": "Email by audience", "sc": "A new forwarder asks what to prepare before they can book your shipment.", "lab": "Work practice"}, {"q": "Can you pick up the goods from our warehouse?", "vi": "Bạn có thể lấy hàng tại kho của chúng tôi không?", "st": "Can you arrange + service + on + date?", "ph": ["a pick-up", "door-to-door", "from our warehouse"], "ss": [], "sa": "Can you arrange a pick-up from our warehouse on Monday morning, and quote door-to-door delivery to the customer's site?", "src": "Email by audience", "sc": "You want the forwarder to handle the cargo from your warehouse all the way to the customer.", "lab": "Work practice"}], "ph": "Email writing by audience"}, {"n": 24, "en": "Emails to overseas partners and distributors: introductions, proposals, follow-ups", "vi": "", "vocab": [{"id": "E24-0", "en": "introduce ourselves", "vi": "tell someone who you are and what you do", "ex": "We would like to introduce ourselves as a manufacturer of furniture.", "vn": "giới thiệu về công ty mình"}, {"id": "E24-1", "en": "partnership proposal", "vi": "a written offer to work together", "ex": "Please find attached our partnership proposal.", "vn": "đề xuất hợp tác"}, {"id": "E24-2", "en": "exclusive distribution", "vi": "the right to be the only distributor of a product in an area", "ex": "We are interested in exclusive distribution in Australia.", "vn": "phân phối độc quyền"}, {"id": "E24-3", "en": "territory", "vi": "the area or country where a distributor can sell", "ex": "The territory covers Australia and New Zealand.", "vn": "khu vực, thị trường được phân phối"}, {"id": "E24-4", "en": "target market", "vi": "the group of customers a company wants to sell to", "ex": "Our target market is small and medium builders.", "vn": "thị trường mục tiêu"}, {"id": "E24-5", "en": "sales target", "vi": "the amount a distributor agrees to sell in a period", "ex": "The annual sales target is 300 units.", "vn": "chỉ tiêu doanh số"}, {"id": "E24-r6", "en": "product range", "vi": "all the products that a company sells", "ex": "We would like to widen our product range.", "vn": "danh mục sản phẩm"}, {"id": "E24-7", "en": "commission", "vi": "money paid to an agent for each sale", "ex": "We pay a 5 percent commission on every order.", "vn": "hoa hồng"}, {"id": "E24-r8", "en": "confidential", "vi": "secret and not to be shared with others", "ex": "The drawings are confidential.", "vn": "bảo mật, bí mật"}, {"id": "E24-9", "en": "letter of intent", "vi": "a document that says two sides plan to work together", "ex": "We can start with a letter of intent.", "vn": "thư bày tỏ ý định hợp tác"}, {"id": "E24-r10", "en": "pilot project", "vi": "a small project used to test an idea before a full start", "ex": "Let's start with a pilot project in Sydney.", "vn": "dự án thí điểm"}, {"id": "E24-11", "en": "product training", "vi": "teaching a partner's team how to use and sell the product", "ex": "We will provide product training for your sales team.", "vn": "đào tạo sản phẩm"}, {"id": "E24-12", "en": "marketing support", "vi": "help with brochures, photos and promotion", "ex": "We offer marketing support, including catalogues and photos.", "vn": "hỗ trợ tiếp thị"}, {"id": "E24-13", "en": "terms of cooperation", "vi": "the conditions of working together", "ex": "Let's discuss the terms of cooperation on a call.", "vn": "điều khoản hợp tác"}, {"id": "E24-14", "en": "mutually beneficial", "vi": "good for both sides", "ex": "We hope to build a mutually beneficial partnership.", "vn": "đôi bên cùng có lợi"}, {"id": "E24-15", "en": "long-term", "vi": "lasting for many years", "ex": "We are looking for a long-term partner.", "vn": "dài hạn"}, {"id": "E24-16", "en": "due diligence", "vi": "a careful check of a partner before a deal", "ex": "Your team may want to do some due diligence first.", "vn": "thẩm định đối tác"}, {"id": "E24-17", "en": "a good fit", "vi": "right for a particular purpose or situation", "ex": "We believe your company is a good fit for our products.", "vn": "phù hợp"}, {"id": "E24-r18", "en": "get in touch", "vi": "contact someone", "ex": "Please get in touch if you would like to discuss this.", "vn": "liên lạc"}, {"id": "E24-19", "en": "it was a pleasure meeting you", "vi": "a polite phrase used after a first meeting", "ex": "It was a pleasure meeting you at the trade fair.", "vn": "rất vui được gặp bạn"}], "quiz": [{"s": "You write to a possible distributor for the first time. Which opening works best?", "o": ["I'm reaching out to introduce our company and to explore a possible cooperation in your market.", "Hello friend, please buy from us.", "We are the best company. You should work with us."], "why": "Say who you are and why you write, in one polite sentence. Avoid selling too hard."}, {"s": "You met a buyer at a trade fair yesterday. How do you start your follow-up?", "o": ["It was a pleasure meeting you at the fair. As discussed, I'm sending our catalogue and price list.", "Do you remember me?", "I send you email because boss said so."], "why": "Refer to the meeting and the promise you made. Then give what you promised."}, {"s": "You want to propose a small first step.", "o": ["We suggest starting with a trial order of 50 units to test the cooperation.", "We want a big order from you right now.", "Let's sign everything today."], "why": "A trial order lowers risk for both sides and is a normal first step."}, {"s": "\"Exclusive distribution\" means…", "o": ["only one distributor sells the product in an area", "anyone can sell the product", "the product is very expensive"], "why": "Exclusivity gives one distributor the sole right in a territory."}, {"s": "You suggest a first conversation about the terms.", "o": ["Could we arrange a video call next week to discuss the terms of cooperation?", "Let us talk, when you want, I come.", "I call you now and you answer."], "why": "Propose a clear time frame and a purpose."}, {"s": "You describe the aim of the partnership.", "o": ["We hope to build a mutually beneficial, long-term partnership.", "We want to make a lot of money from you.", "We only work for a short time."], "why": "Mention benefits for both sides and the long term."}], "speak": [{"s": "Introduce your company to a possible distributor", "l": ["Thank you for taking my call. I'm Sally from a furniture manufacturer in Vietnam.", "We are looking for a long-term distribution partner in Australia.", "Could we arrange a video call next week to discuss the terms of cooperation?"]}, {"s": "Follow up after a trade fair", "l": ["It was a pleasure meeting you at the fair.", "As discussed, I'll send you our catalogue and a draft proposal today.", "Please let me know if you would like a sample or a trial order."]}], "email": "Subject: Partnership proposal – Australian market\n\nDear Mr. Brown,\n\nIt was a pleasure [[meeting|to meet|met]] you at the Sydney trade fair. As discussed, I am sending you our catalogue and a draft partnership proposal.\n\nWe believe your company is a good [[fit|fitting|fitted]] for our products, and we are interested in exclusive distribution in your [[territory|territories of|territorial]].\n\nWe suggest starting [[with|from|by]] a trial order of 50 units. We can also provide product training and marketing support.\n\nI look forward to hearing [[from|of|to]] you.\n\nBest regards,\nSally", "coach": [{"q": "Why should we work with you?", "vi": "Vì sao chúng tôi nên hợp tác với bạn?", "st": "We offer + benefit + and + benefit.", "ph": ["a long-term partnership", "product training", "marketing support"], "ss": [], "sa": "We offer a long-term partnership, product training for your sales team and full marketing support, so your team can sell with confidence.", "src": "Email by audience", "sc": "A possible distributor asks you to explain in short what makes your offer different.", "lab": "Work practice"}, {"q": "What do you expect from a distributor?", "vi": "Bạn kỳ vọng gì ở nhà phân phối?", "st": "We expect + result + in + period.", "ph": ["an annual sales target", "regular sales reports", "active promotion"], "ss": [], "sa": "We expect an annual sales target, regular sales reports and active promotion in the territory.", "src": "Email by audience", "sc": "A partner asks about the targets and duties before agreeing to a meeting.", "lab": "Work practice"}, {"q": "Can we have exclusive rights?", "vi": "Chúng tôi có thể có quyền độc quyền không?", "st": "We can consider + option, if + condition.", "ph": ["exclusive distribution", "the sales target", "a six-month trial period"], "ss": [], "sa": "We can consider exclusive distribution for your territory, if you reach the sales target after a six-month trial period.", "src": "Email by audience", "sc": "A distributor wants exclusive rights from the first order. You want to protect your position.", "lab": "Work practice"}, {"q": "Can we start with a small order?", "vi": "Chúng ta có thể bắt đầu với một đơn nhỏ không?", "st": "I suggest + first step + so that + reason.", "ph": ["a trial order", "test the market", "build trust"], "ss": [], "sa": "I suggest a trial order of 50 units, so that we can test the market and build trust before we sign a long-term agreement.", "src": "Email by audience", "sc": "The partner is interested but not ready to commit to a large volume.", "lab": "Work practice"}], "ph": "Email writing by audience"}, {"n": 25, "en": "Emails to your team and management: updates, escalations, approvals", "vi": "", "vocab": [{"id": "E25-r0", "en": "weekly summary", "vi": "a short report sent once a week", "ex": "I'll send the weekly summary every Friday morning.", "vn": "tóm tắt hằng tuần"}, {"id": "E25-1", "en": "on track", "vi": "going as planned", "ex": "The project is on track for delivery on 20 January.", "vn": "đúng tiến độ"}, {"id": "E25-r2", "en": "ahead of schedule", "vi": "earlier than planned", "ex": "The packing is ahead of schedule.", "vn": "sớm hơn kế hoạch"}, {"id": "E25-3", "en": "blocker", "vi": "something that stops work from moving forward", "ex": "The main blocker is the missing customs document.", "vn": "vướng mắc, cản trở"}, {"id": "E25-r4", "en": "workload", "vi": "the amount of work a person or team has to do", "ex": "My team's workload is heavy this month.", "vn": "khối lượng công việc"}, {"id": "E25-r5", "en": "raise a concern", "vi": "tell someone about a worry or a problem", "ex": "I'd like to raise a concern about the supplier.", "vn": "nêu mối lo ngại"}, {"id": "E25-6", "en": "approval", "vi": "official permission to go ahead", "ex": "We need your approval before we can place the order.", "vn": "phê duyệt"}, {"id": "E25-7", "en": "sign-off", "vi": "final approval of a document or decision", "ex": "We are waiting for the sign-off from finance.", "vn": "duyệt cuối"}, {"id": "E25-8", "en": "budget impact", "vi": "the effect of a decision on costs", "ex": "The air freight option has a budget impact of USD 2,000.", "vn": "tác động đến ngân sách"}, {"id": "E25-9", "en": "risk", "vi": "the chance that something bad will happen", "ex": "The main risk is a delay at customs.", "vn": "rủi ro"}, {"id": "E25-r10", "en": "backup plan", "vi": "a second plan in case the first one does not work", "ex": "We need a backup plan if the vessel is delayed.", "vn": "phương án dự phòng"}, {"id": "E25-11", "en": "next steps", "vi": "the actions that will be done after now", "ex": "The next steps are listed below.", "vn": "các bước tiếp theo"}, {"id": "E25-12", "en": "heads-up", "vi": "an early warning about something", "ex": "Just a heads-up: the supplier may be late.", "vn": "báo trước"}, {"id": "E25-13", "en": "loop in", "vi": "include someone in a conversation", "ex": "I've looped in the logistics team on this email.", "vn": "đưa ai vào trao đổi"}, {"id": "E25-14", "en": "action owner", "vi": "the person responsible for a task", "ex": "Please assign an action owner for each item.", "vn": "người phụ trách việc"}, {"id": "E25-r15", "en": "turnaround time", "vi": "the time needed to finish a task or answer a request", "ex": "Our turnaround time for quotations is 24 hours.", "vn": "thời gian xử lý"}, {"id": "E25-16", "en": "priority", "vi": "something that is more important than other things", "ex": "The priority this week is the delayed order.", "vn": "ưu tiên"}, {"id": "E25-17", "en": "resource", "vi": "people, time or money needed for work", "ex": "We need one more resource to handle the extra orders.", "vn": "nguồn lực"}, {"id": "E25-r18", "en": "recap", "vi": "repeat the main points in a short way", "ex": "Let me recap the main points before we finish.", "vn": "tóm lược lại"}, {"id": "E25-19", "en": "for your information", "vi": "used when you share something that needs no action", "ex": "For your information, the customer has confirmed the date.", "vn": "để bạn nắm thông tin"}], "quiz": [{"s": "You write a status update to your director. Which sentence is clearest?", "o": ["The project is on track, but the main blocker is the missing customs document, which we expect by Friday.", "Everything is okay, maybe some problems.", "We have problems and many things are late."], "why": "Give the overall status first, then the blocker and a date."}, {"s": "You need a decision from management.", "o": ["I'd appreciate your approval by Wednesday so that we can place the order on time.", "Please decide it quickly.", "Boss, you must answer today."], "why": "State what you need, and the date. \"I'd appreciate\" keeps it respectful."}, {"s": "A supplier problem is getting worse. How do you raise it?", "o": ["I'd like to escalate this issue, as the delay may affect our customer's deadline.", "Everybody is failing, so I tell the director.", "Please do something about the supplier."], "why": "Escalate with a clear reason: the effect on the customer or the business."}, {"s": "\"Heads-up\" means…", "o": ["an early warning", "a hat", "an angry message"], "why": "A heads-up tells someone about a problem before it grows."}, {"s": "You need a decision from your manager.", "o": ["I'd appreciate your sign-off by Wednesday so that we can proceed.", "Please decide fast, I wait.", "You must answer today, boss."], "why": "Give a polite request with a date."}, {"s": "You want a colleague to follow a shipment.", "o": ["I've looped in the logistics team so that they can follow the shipment.", "I send it to everybody, find out.", "Logistics will see it someday."], "why": "\"Loop in\" means to include someone in the conversation."}], "speak": [{"s": "Give your manager a quick status update", "l": ["Here is a quick update on the Sydney order.", "We are on track for delivery on 20 January.", "The main risk is customs, and I'll send you a mitigation plan on Thursday."]}, {"s": "Ask for approval in a meeting", "l": ["I'd like your approval for air freight on this order.", "The budget impact is about 2,000 US dollars.", "If we approve today, we can still meet the customer's deadline."]}], "email": "Subject: Weekly update – Sydney order\n\nHi Mr. Nam,\n\nHere is the weekly status update.\n\nStatus: the order is [[on track|in track|on tracking]] for 20 January. The second batch is two days [[behind|after|late]] schedule, but the factory is working overtime.\n\nMain risk: delay at customs. We can mitigate it [[by|with|for]] preparing all documents early.\n\nI need your [[approval|approve|approving]] by Wednesday for air freight (budget impact: USD 2,000).\n\nNext steps are listed below. I'll keep you posted.\n\nBest regards,\nSally", "coach": [{"q": "How is the project going?", "vi": "Dự án đang tiến triển thế nào?", "st": "The project is + status, and + main point.", "ph": ["on track", "the main blocker", "by Friday"], "ss": [], "sa": "The project is on track overall, but the main blocker is the customs document. We expect to receive it by Friday.", "src": "Email by audience", "sc": "Your director stops you in the corridor and asks for a quick update.", "lab": "Work practice"}, {"q": "Why do you need extra budget?", "vi": "Vì sao bạn cần thêm ngân sách?", "st": "We need + amount + because + reason.", "ph": ["the budget impact", "air freight", "the customer's deadline"], "ss": [], "sa": "We need an extra 2,000 US dollars because air freight is the only way to meet the customer's deadline. The budget impact is small compared with the risk.", "src": "Email by audience", "sc": "You are asking finance to approve a one-off cost and need to justify it.", "lab": "Work practice"}, {"q": "What are the next steps?", "vi": "Các bước tiếp theo là gì?", "st": "The next steps are + action + by + owner.", "ph": ["next steps", "action owner", "deadline"], "ss": [], "sa": "The next steps are to confirm the new date with the customer and to book air freight. Each item has an action owner and a deadline.", "src": "Email by audience", "sc": "A meeting is ending and your manager wants to know what happens next.", "lab": "Work practice"}, {"q": "Why are you escalating this issue?", "vi": "Vì sao bạn báo vấn đề này lên cấp cao hơn?", "st": "I'm escalating this because + effect.", "ph": ["has not responded", "affect our customer", "a quick decision"], "ss": [], "sa": "I'm escalating this because the supplier has not responded in three days, and the delay may affect our customer. We need a quick decision.", "src": "Email by audience", "sc": "A colleague asks why you copied the director into an email.", "lab": "Work practice"}], "ph": "Email writing by audience"}, {"n": 5, "en": "Import-export 1: orders, Incoterms, payment", "vi": "", "vocab": [{"id": "w5-0", "en": "purchase order (PO)", "vi": "a buyer's official document to order goods", "ex": "We have received your purchase order.", "vn": "đơn đặt hàng"}, {"id": "w5-1", "en": "lead time", "vi": "the time needed to make or deliver goods", "ex": "The lead time is four weeks.", "vn": "thời gian sản xuất, giao hàng"}, {"id": "w5-2", "en": "FOB", "vi": "the seller pays until the goods are on the ship at the port of loading", "ex": "The price is FOB Ho Chi Minh City.", "vn": "giao hàng lên tàu tại cảng đi"}, {"id": "w5-3", "en": "CIF", "vi": "the price includes goods, insurance and freight to the port of arrival", "ex": "Could you quote CIF Busan?", "vn": "giá gồm hàng, bảo hiểm, cước tới cảng đến"}, {"id": "w5-4", "en": "T/T", "vi": "payment by bank transfer", "ex": "Payment by T/T: 30% deposit and 70% before shipment.", "vn": "chuyển khoản điện tín"}, {"id": "w5-5", "en": "L/C", "vi": "a bank's promise to pay the seller when the terms are met", "ex": "We can accept an L/C at sight.", "vn": "thư tín dụng"}, {"id": "w5-6", "en": "deposit", "vi": "money paid first to confirm an order", "ex": "Production starts after we receive the deposit.", "vn": "tiền đặt cọc"}, {"id": "w5-7", "en": "pro forma invoice", "vi": "a first invoice sent before the goods are shipped", "ex": "Please send us a pro forma invoice.", "vn": "hoá đơn chiếu lệ"}, {"id": "w5-8", "en": "Incoterms", "vi": "international rules that say who pays for and is responsible for each step of a delivery", "ex": "Which Incoterms will you use for this order?", "vn": "điều kiện giao hàng quốc tế"}, {"id": "w5-9", "en": "named place", "vi": "the exact place written after an Incoterm", "ex": "Please add the named place after FCA.", "vn": "địa điểm nêu tên"}, {"id": "w5-10", "en": "transfer of risk", "vi": "the point where responsibility for loss or damage passes from seller to buyer", "ex": "The transfer of risk happens when the goods are loaded.", "vn": "điểm chuyển giao rủi ro"}, {"id": "w5-11", "en": "EXW (Ex Works)", "vi": "the buyer collects the goods at the seller's premises and handles everything after that", "ex": "Under EXW, we only get the goods ready at our factory.", "vn": "giao tại xưởng"}, {"id": "w5-12", "en": "FCA (Free Carrier)", "vi": "the seller hands the goods to the buyer's carrier at a named place", "ex": "For container shipments we prefer FCA.", "vn": "giao cho người chuyên chở"}, {"id": "w5-13", "en": "DAP (Delivered at Place)", "vi": "the seller delivers to a named place in the buyer's country, not unloaded", "ex": "The price is DAP our Hanoi warehouse.", "vn": "giao tại nơi đến"}, {"id": "w5-14", "en": "DDP (Delivered Duty Paid)", "vi": "the seller delivers to the buyer's country and also pays the import duty", "ex": "DDP is hard for us because we cannot clear customs abroad.", "vn": "giao hàng đã nộp thuế"}, {"id": "w5-15", "en": "export clearance", "vi": "completing customs formalities so goods can leave a country", "ex": "The seller handles export clearance under FCA.", "vn": "thông quan xuất khẩu"}, {"id": "w5-16", "en": "freight", "vi": "goods carried by ship, plane, truck or train, or the cost of carrying them", "ex": "Freight costs went up again this month.", "vn": "cước vận chuyển; hàng vận chuyển"}, {"id": "w5-17", "en": "cargo insurance", "vi": "insurance that covers goods against loss or damage during transport", "ex": "Under CIF, the seller must buy cargo insurance.", "vn": "bảo hiểm hàng hoá"}, {"id": "w5-18", "en": "make to order (MTO)", "vi": "producing only after a customer places an order", "ex": "This item is made to order, so please allow six weeks.", "vn": "sản xuất theo đơn"}, {"id": "w5-19", "en": "make to stock (MTS)", "vi": "producing goods in advance based on a forecast", "ex": "Standard sizes are made to stock and ship within a week.", "vn": "sản xuất để tồn kho"}], "quiz": [{"s": "The customer wants a price that includes insurance and sea freight to Busan. Which term do they need?", "o": ["CIF Busan", "FOB Busan", "EXW Busan"], "why": "CIF covers the goods, insurance and freight to the port of arrival."}, {"s": "State the payment terms: 30% deposit, 70% before shipment.", "o": ["Payment by T/T: 30% deposit, 70% before shipment.", "Payment T/T 30% deposit before, 70% shipment after before.", "You pay 30% and then 70% maybe."], "why": "Short and clear, deposit first, then the balance."}, {"s": "Say the production time is four weeks.", "o": ["The lead time is four weeks from receipt of deposit.", "The lead time are four week.", "Lead time will four weeks."], "why": "Say when the lead time starts so nobody misunderstands."}, {"s": "The customer wants to collect the goods at your factory. Which Incoterm do you use?", "o": ["EXW (Ex Works)", "DDP (Delivered Duty Paid)", "CIF (Cost, Insurance and Freight)"], "why": "Under EXW the buyer collects the goods at the seller's premises."}, {"s": "A bank promises to pay the seller if the documents are correct. What is it?", "o": ["A letter of credit (L/C)", "A telegraphic transfer (T/T)", "A pro forma invoice"], "why": "An L/C is a bank guarantee. A T/T is a normal bank transfer."}, {"s": "When does the risk pass to the buyer under FOB?", "o": ["Once the goods are on board the ship", "When the goods leave the factory", "When the buyer pays the invoice"], "why": "Under FOB the risk passes when the goods are loaded on the vessel."}], "speak": [{"s": "Confirm an order with a customer", "l": ["We have received your purchase order, thank you.", "The lead time is four weeks from receipt of the deposit.", "I'll send you the pro forma invoice today."]}, {"s": "Explain delivery and payment terms", "l": ["Our price is FOB Ho Chi Minh City.", "If you prefer, we can also quote CIF Busan.", "Payment is by T/T: 30% deposit and 70% before shipment."]}], "email": "Subject: Order confirmation – PO 4521\n\nDear Mr. Park,\n\nThank you for your purchase order [[No.|Num|Nr]] 4521. Please find the pro forma invoice attached.\n\nTerms: CIF Busan. Payment by T/T, 30% deposit and 70% [[before|until|since]] shipment.\n\nThe lead time is four weeks from [[receipt|receive|received]] of the deposit.\n\nPlease [[confirm|confirming|confirmed]] so we can start production.\n\nBest regards,\nSally", "coach": [{"q": "How can we customize the product?", "vi": "Chúng tôi có thể tùy chỉnh sản phẩm như thế nào?", "st": "We can customize + product element.", "ph": [], "ss": ["We can customize the product based on your preferred size, material, color, glaze, and finishing details.", "For furniture or pottery items, we can also adjust the shape, surface effect, or packaging style depending on your market needs.", "If you have a reference design or mood board, we can develop the sample based on that direction."], "sa": "We can customize the product in terms of size, material, color, finish, and design details.", "src": "Trình bày quy trình tùy chỉnh", "sc": "The customer wants to order products based on their own design. You need to explain your process and customization capability clearly."}, {"q": "What is the process for custom orders?", "vi": "Quy trình cho đơn hàng tùy chỉnh là gì?", "st": "The process starts with + first step.", "ph": [], "ss": ["The process starts with your design brief or reference sample.", "After that, we confirm the specifications and prepare a sample for your review and approval.", "Once the sample is approved, we move to bulk production according to the agreed timeline and requirements."], "sa": "The process starts with your brief, then sample development, approval, and finally bulk production.", "src": "Trình bày quy trình tùy chỉnh", "sc": "The customer wants to order products based on their own design. You need to explain your process and customization capability clearly."}, {"q": "Is there a minimum order for customization?", "vi": "Có số lượng tối thiểu cho đơn hàng tùy chỉnh không?", "st": "The minimum order depends on + factor.", "ph": [], "ss": ["The minimum order depends on the product type, design complexity, and material requirements.", "For some customized items, we may be flexible if the design can fit into our existing production process.", "For more specialized developments, a higher minimum order quantity may be needed to make the project workable."], "sa": "The minimum order depends on the product type and the complexity of the customization.", "src": "Trình bày quy trình tùy chỉnh", "sc": "The customer wants to order products based on their own design. You need to explain your process and customization capability clearly."}, {"q": "How long does it take to get a sample?", "vi": "Mất bao lâu để có mẫu?", "st": "It usually takes + sample timeline.", "ph": [], "ss": ["It usually takes around two to four weeks to prepare a sample, depending on the design and materials.", "If the product requires special molds, glazes, or construction adjustments, the sample lead time may be slightly longer.", "Once we receive all the confirmed details, we can give you a more accurate sample timeline."], "sa": "It usually takes two to four weeks to prepare a sample, depending on the design and technical details.", "src": "Trình bày quy trình tùy chỉnh", "sc": "The customer wants to order products based on their own design. You need to explain your process and customization capability clearly."}, {"q": "What are the extra costs involved?", "vi": "Có những chi phí phát sinh nào?", "st": "The extra costs may include + cost item.", "ph": [], "ss": ["The extra costs may include sample development, mold charges, special materials, or customized packaging.", "In some cases, there may also be extra costs for special finishes, additional testing, or design revisions.", "We always try to explain these costs clearly before moving forward, so there are no surprises later."], "sa": "The extra costs may include sample development, special materials, customized packaging, or technical adjustments.", "src": "Trình bày quy trình tùy chỉnh", "sc": "The customer wants to order products based on their own design. You need to explain your process and customization capability clearly."}], "ph": "Import-export and negotiation"}, {"n": 6, "en": "Import-export 2: documents, shipping, complaints", "vi": "", "vocab": [{"id": "w6-0", "en": "bill of lading (B/L)", "vi": "the shipping document that shows who owns the goods", "ex": "The original bill of lading will be sent by courier.", "vn": "vận đơn"}, {"id": "w6-1", "en": "packing list", "vi": "a list of what is in each package", "ex": "Please check the packing list against the goods.", "vn": "phiếu đóng gói"}, {"id": "w6-2", "en": "certificate of origin (C/O)", "vi": "a document that shows where goods were made", "ex": "We will provide a certificate of origin Form E.", "vn": "giấy chứng nhận xuất xứ"}, {"id": "w6-3", "en": "ETD / ETA", "vi": "estimated time of departure / estimated time of arrival", "ex": "ETD is 5 November and ETA is 12 November.", "vn": "ngày dự kiến tàu chạy / tàu đến"}, {"id": "w6-4", "en": "shortage", "vi": "not enough goods delivered", "ex": "There is a shortage of 20 cartons.", "vn": "thiếu hàng"}, {"id": "w6-5", "en": "damaged", "vi": "broken or harmed", "ex": "Some boxes arrived damaged.", "vn": "bị hư hỏng"}, {"id": "w6-6", "en": "compensation", "vi": "money paid for a loss or damage", "ex": "We will offer compensation for the damaged goods.", "vn": "bồi thường"}, {"id": "w6-7", "en": "apologize for", "vi": "say sorry about something", "ex": "We apologize for the inconvenience.", "vn": "xin lỗi về"}, {"id": "w6-8", "en": "quality control (QC)", "vi": "checking products to make sure they meet the required standard", "ex": "Quality control found ten faulty units.", "vn": "kiểm soát chất lượng"}, {"id": "w6-9", "en": "incoming inspection", "vi": "checking materials when they arrive from a supplier", "ex": "Incoming inspection rejected one batch of fabric.", "vn": "kiểm hàng đầu vào"}, {"id": "w6-10", "en": "pre-shipment inspection", "vi": "a final check of goods before they are shipped", "ex": "We booked a pre-shipment inspection for Thursday.", "vn": "kiểm hàng trước khi giao"}, {"id": "w6-11", "en": "batch", "vi": "a group of products made at the same time", "ex": "Please send the batch number with your claim.", "vn": "lô sản xuất"}, {"id": "w6-12", "en": "commercial invoice", "vi": "the seller's bill to the buyer, which customs also uses to value the goods", "ex": "Customs needs the commercial invoice and the packing list.", "vn": "hoá đơn thương mại"}, {"id": "w6-13", "en": "customs broker", "vi": "a licensed agent who clears goods through customs for you", "ex": "Our customs broker will file the import declaration.", "vn": "đại lý hải quan"}, {"id": "w6-14", "en": "freight forwarder", "vi": "a company that arranges transport and documents for shipments", "ex": "Ask the freight forwarder for the vessel schedule.", "vn": "công ty giao nhận vận tải"}, {"id": "w6-15", "en": "cut-off", "vi": "the last time cargo or documents can be handed in for a sailing", "ex": "The cut-off for this vessel is Friday at noon.", "vn": "giờ cắt hàng, hạn chót nhận hàng"}, {"id": "w6-16", "en": "claim", "vi": "a formal request for payment or replacement because of a problem", "ex": "We filed a claim for the damaged cartons.", "vn": "khiếu nại đòi bồi thường"}, {"id": "w6-17", "en": "root cause", "vi": "the main reason a problem happened", "ex": "We need the root cause, not just a replacement.", "vn": "nguyên nhân gốc"}, {"id": "w6-18", "en": "corrective action", "vi": "a step taken to fix a problem and stop it happening again", "ex": "Please send your corrective action plan by Monday.", "vn": "hành động khắc phục"}, {"id": "w6-19", "en": "reverse logistics", "vi": "managing goods that come back from customers, such as returns and repairs", "ex": "Reverse logistics costs us about three percent of sales.", "vn": "logistics ngược (hàng trả về)"}], "quiz": [{"s": "A customer says the goods arrived damaged. Which opening line is best?", "o": ["We're sorry to hear that some boxes arrived damaged.", "It is not our fault.", "Damaged? Send photo."], "why": "Show understanding first, deal with responsibility later."}, {"s": "Give the departure and arrival dates.", "o": ["ETD is 5 November and ETA is 12 November.", "ETA is 5 November leave and ETD 12 arrive.", "The ship go 5 and come 12 November."], "why": "ETD is when the ship leaves, ETA is when it arrives."}, {"s": "Ask the customer for evidence to handle the claim.", "o": ["Could you send us photos of the damaged items?", "Prove it.", "Give us photo or we do nothing."], "why": "A polite request that says exactly what you need."}, {"s": "Which document lists what is inside each carton?", "o": ["The packing list", "The bill of lading", "The certificate of origin"], "why": "The packing list shows the contents of every carton."}, {"s": "A customer reports a shortage. What do you ask for first?", "o": ["Could you send us the packing list and photos of the cartons you received?", "Please count again, you are wrong.", "Tell us what you want us to do."], "why": "Ask for facts and photos before you decide on a solution."}, {"s": "\"Root cause\" means…", "o": ["the main reason for a problem", "the first part of a plant", "the cost of a repair"], "why": "Finding the root cause stops the same problem from happening again."}], "speak": [{"s": "Call a customer about a short delivery", "l": ["Thank you for letting us know about the shortage.", "Could you send us the packing list and photos?", "We'll check with the warehouse and get back to you by Friday."]}, {"s": "Update a customer on the shipping schedule", "l": ["Your goods have been loaded.", "ETD is 5 November and ETA is 12 November.", "We'll send the bill of lading by courier."]}, {"s": "Discuss Contract Renewal: The current contract with an important customer is about to expire. You call to discuss the renewal and any updated terms.", "l": ["Our current agreement is coming to an end soon, so I would like to discuss the renewal with you.", "We truly value our cooperation and hope to continue working together under the new contract period.", "I would also like to review any updated terms or requirements from your side.", "If you agree, we can go through the renewal points one by one."], "src": "Gia hạn hợp đồng"}, {"s": "Introduce Additional Products: You believe a long-term customer may be interested in a new product line. You call to introduce it and suggest that they try it.", "l": ["I thought this new product line might be relevant for your current market needs.", "It complements the products you are already selling and could create an additional sales opportunity for you.", "If you are interested, we would be happy to send samples for your review.", "I believe this could be a good extension to your current product range."], "src": "Gia hạn hợp đồng"}, {"s": "Negotiate Contract Terms: The customer agrees to renew the contract but wants to negotiate the terms further. You need to handle this carefully while still protecting the company's interests.", "l": ["We are open to discussing the terms in order to find a solution that works for both sides.", "Could you let me know which specific points you would like to review?", "We will do our best to be flexible while keeping the agreement practical and sustainable.", "Once we align on the key terms, we can move forward with the renewal draft."], "src": "Gia hạn hợp đồng"}], "email": "Subject: Re: Damaged goods – PO 4521\n\nDear Mr. Park,\n\nWe are sorry to [[hear|listen|heard]] that some boxes arrived damaged. We [[apologize|apology|apologise to]] for the inconvenience.\n\nCould you please send us photos of the damaged items and the [[packing list|pack list|packing lists of]]? Once we receive them, we will arrange [[compensation|compensate|compensated]] or a replacement.\n\nBest regards,\nSally", "coach": [{"q": "Which documents do you send with the shipment?", "vi": "Bạn gửi những chứng từ nào kèm lô hàng?", "st": "We send + documents + with the goods.", "ph": ["the bill of lading", "the packing list", "the commercial invoice"], "ss": [], "sa": "We send the bill of lading, the packing list and the commercial invoice with the goods, and a certificate of origin if you need it.", "src": "Documents, shipping and complaints", "sc": "A customer's customs broker asks which papers will be ready before the vessel arrives.", "lab": "Work practice"}, {"q": "The goods arrived damaged. What will you do?", "vi": "Hàng đến nơi bị hỏng. Bạn sẽ làm gì?", "st": "We apologize for + problem, and we will + action.", "ph": ["apologize for the damage", "photos of the damage", "a replacement"], "ss": [], "sa": "We apologize for the damage. Please send us photos of the damage, and we will arrange a replacement or compensation.", "src": "Documents, shipping and complaints", "sc": "A customer calls you after opening the boxes and finding broken items.", "lab": "Work practice"}, {"q": "Why was the shipment late?", "vi": "Vì sao lô hàng bị trễ?", "st": "The shipment was late because + reason, and + new date.", "ph": ["missed the cut-off", "rolled over", "the new ETA"], "ss": [], "sa": "The container missed the cut-off and was rolled over to the next vessel. The new ETA is 12 November.", "src": "Documents, shipping and complaints", "sc": "The customer asks why the ship did not arrive on the date you promised.", "lab": "Work practice"}, {"q": "How do you prevent quality problems?", "vi": "Bạn ngăn ngừa vấn đề chất lượng thế nào?", "st": "We do + inspection, and if a problem occurs, we + action.", "ph": ["pre-shipment inspection", "the root cause", "corrective action"], "ss": [], "sa": "We do a pre-shipment inspection at the factory, and if a problem occurs, we find the root cause and take corrective action.", "src": "Documents, shipping and complaints", "sc": "A new customer asks how you control quality before the goods leave.", "lab": "Work practice"}], "ph": "Import-export and negotiation"}, {"n": 7, "en": "Negotiation: price, terms, conditional concessions", "vi": "", "vocab": [{"id": "w7-0", "en": "counteroffer", "vi": "a new offer made in reply to an offer", "ex": "Thank you for your counteroffer.", "vn": "đề nghị ngược lại"}, {"id": "w7-1", "en": "concession", "vi": "something you give up to reach an agreement", "ex": "We can make a small concession on price.", "vn": "sự nhượng bộ"}, {"id": "w7-2", "en": "on condition that", "vi": "only if", "ex": "We can lower the price on condition that you order 2,000 units.", "vn": "với điều kiện là"}, {"id": "w7-3", "en": "meet halfway", "vi": "each side gives up part of what it wants", "ex": "Could we meet halfway at 3%?", "vn": "mỗi bên nhường một nửa"}, {"id": "w7-4", "en": "bottom line", "vi": "the lowest price you can accept", "ex": "This is our bottom line.", "vn": "mức thấp nhất có thể chấp nhận"}, {"id": "w7-5", "en": "payment terms", "vi": "when and how payment is made", "ex": "Can we discuss the payment terms?", "vn": "điều khoản thanh toán"}, {"id": "w7-6", "en": "volume", "vi": "the amount ordered", "ex": "The discount depends on the volume.", "vn": "khối lượng đặt hàng"}, {"id": "w7-7", "en": "close the deal", "vi": "reach a final agreement", "ex": "If we agree on this, we can close the deal today.", "vn": "chốt thương vụ"}, {"id": "w7-8", "en": "sea freight", "vi": "sending goods by ship", "ex": "Sea freight is cheaper but takes about 30 days.", "vn": "vận tải đường biển"}, {"id": "w7-9", "en": "air freight", "vi": "sending goods by plane", "ex": "We used air freight for the urgent samples.", "vn": "vận tải hàng không"}, {"id": "w7-10", "en": "FCL (full container load)", "vi": "a shipment that fills a whole container for one shipper", "ex": "This order is big enough for a full container.", "vn": "hàng nguyên container"}, {"id": "w7-11", "en": "LCL (less than container load)", "vi": "a small shipment that shares a container with other cargo", "ex": "LCL is better for orders under ten cubic meters.", "vn": "hàng lẻ ghép container"}, {"id": "w7-12", "en": "transit time", "vi": "how long goods take to travel from origin to destination", "ex": "The transit time to Rotterdam is 28 days.", "vn": "thời gian vận chuyển"}, {"id": "w7-13", "en": "carrier", "vi": "the company that actually moves the goods, such as a shipping line or airline", "ex": "The carrier changed the sailing date.", "vn": "hãng vận chuyển"}, {"id": "w7-14", "en": "freight rate", "vi": "the price charged to move cargo", "ex": "Can we lock in this freight rate for three months?", "vn": "giá cước"}, {"id": "w7-15", "en": "surcharge", "vi": "an extra fee added to the normal price", "ex": "There is a peak season surcharge in October.", "vn": "phụ phí"}, {"id": "w7-16", "en": "intermodal", "vi": "using more than one type of transport, such as ship and rail, for one shipment", "ex": "An intermodal route can save both cost and time.", "vn": "vận tải đa phương thức"}, {"id": "w7-17", "en": "SLA (service level agreement)", "vi": "a contract that sets the standard of service a provider must reach", "ex": "The SLA says 98 percent of orders must ship on time.", "vn": "thoả thuận mức dịch vụ"}, {"id": "w7-18", "en": "penalty clause", "vi": "a contract term that sets a payment if one side fails to meet an obligation", "ex": "We agreed to remove the penalty clause in exchange for faster payment.", "vn": "điều khoản phạt"}, {"id": "w7-19", "en": "long-term contract", "vi": "an agreement that runs for a year or more", "ex": "A long-term contract gives us a better freight rate.", "vn": "hợp đồng dài hạn"}], "quiz": [{"s": "The customer asks for 10% off. You only agree if they order more.", "o": ["We could offer 5% if you increase the order to 2,000 units.", "Okay, 10% discount, no problem.", "No discount. Never."], "why": "A concession should always get you something in return."}, {"s": "Suggest that each side gives up half.", "o": ["Could we meet halfway at 3%?", "Let's meet half at 3% way.", "We go middle 3% okay?"], "why": "Use the fixed phrase \"meet halfway\"."}, {"s": "Hold your price when the customer keeps pushing.", "o": ["I'm afraid this is our best price for this volume.", "Okay, I'll ask for more discount.", "Your request is unreasonable, stop asking."], "why": "\"I'm afraid...\" is a soft no and links the price to the volume."}, {"s": "The customer asks for a lower price. You want to set a condition.", "o": ["We could do that on condition that you pay a 50 percent deposit.", "We do that if you like us.", "We do that or we do not do."], "why": "\"On condition that\" links a concession to something you receive."}, {"s": "What is a \"concession\"?", "o": ["something you agree to give up in order to reach a deal", "a shop inside a store", "a type of contract"], "why": "In negotiation, each side makes concessions to reach an agreement."}, {"s": "You are close to an agreement and want to close the deal.", "o": ["If we agree on 4 percent, I can confirm the order today.", "Okay, maybe we sign something?", "We stop now, it is too hard."], "why": "Offer a clear final step and a time to move to the order."}], "speak": [{"s": "Reply when a customer asks for a discount", "l": ["I understand you need a better price.", "We can offer 5% on condition that you order 2,000 units.", "Would that work for you?"]}, {"s": "Close the deal", "l": ["So, to summarize: 3% discount, 2,000 units, payment by T/T.", "If we agree on this, we can close the deal today.", "I'll send the revised quotation this afternoon."]}, {"s": "Present a Potential Market: You have just completed some research and found a promising new market. Your manager asks you to present the opportunity briefly and make a convincing case.", "l": ["I have identified a new market that shows strong growth potential for our product line.", "This market appears attractive because customer demand is increasing and the competitive space is still manageable.", "I believe this is a good opportunity for us to expand in a focused way.", "If we enter early, we may be able to build a stronger position."], "src": "Thảo luận cơ hội thị trường"}, {"s": "Analyze Customer Demand Trends: You have noticed a recent shift in customer demand. You need to share this with the team so everyone can adjust accordingly.", "l": ["We have recently seen a noticeable shift in customer demand.", "Customers seem to be placing more value on ___ than before.", "I think we should adjust our product focus and communication accordingly.", "It would be helpful for the team to review this trend together and align our next steps."], "src": "Thảo luận cơ hội thị trường"}, {"s": "Set Market Sales Targets: The company has decided to focus on a priority market. Your manager wants you to recommend a sales target for next year and support it with a reasonable number.", "l": ["Based on the current market conditions, I would suggest a realistic sales target of ___.", "This target is ambitious, but still achievable if we focus on the right customer segments.", "The recommendation is based on market size, expected demand, and our current capacity.", "We can also break this target down by quarter for easier tracking."], "src": "Thảo luận cơ hội thị trường"}, {"s": "Convince the Customer to Upgrade the Service", "l": ["I believe you could gain more value by moving to our premium service package.", "The upgraded option offers stronger support and additional benefits that match your current needs.", "In the long run, this could help you save time and improve results."], "src": "Thảo luận cơ hội thị trường"}, {"s": "Report the Contract Renewal Result", "l": ["We have successfully renewed the contract with the customer.", "The main terms have been agreed, including ___ and ___.", "I would like to give you a quick summary of the final outcome and the next steps."], "src": "Thảo luận cơ hội thị trường"}, {"s": "Propose an Exclusive Agreement", "l": ["Since your performance has been very strong, we would like to discuss the possibility of an exclusive agreement.", "We believe an exclusive partnership could strengthen our cooperation and create clearer market focus.", "Of course, we would need to align carefully on the scope, expectations, and commercial terms."], "src": "Thảo luận cơ hội thị trường"}, {"s": "Review Competitor Activity", "l": ["A competitor has recently made several noticeable moves in the market.", "I think we should review their activity carefully and assess the possible impact on our position.", "This analysis could help us respond more quickly and adjust our strategy if needed."], "src": "Thảo luận cơ hội thị trường"}], "email": "Subject: Revised offer\n\nDear Ms. Chen,\n\nThank you for your [[counteroffer|counter|countering]]. We have reviewed it carefully.\n\nWe can offer a 5% discount [[on condition that|on the condition|in condition that]] the order is increased to 2,000 units. I'm [[afraid|afraid of|fear]] this is our best price for this volume.\n\nIf this works for you, we can [[close|closing|closed]] the deal this week.\n\nBest regards,\nSally", "coach": [{"q": "How are you better than competitor X?", "vi": "Sản phẩm của bạn tốt hơn đối thủ cạnh tranh X như thế nào?", "st": "We offer + advantage + compared with competitor X.", "ph": ["faster delivery", "customized solutions", "superior quality"], "ss": ["We offer faster delivery, more flexible customization, and more stable finishing quality compared with competitor X.", "One important difference is that we can adapt the design and order structure more easily based on your market needs.", "We also focus strongly on consistency, which is especially important for repeat orders and retail programs."], "sa": "We offer faster delivery, customized solutions, and superior quality compared with competitor X.", "src": "So sánh sản phẩm với đối thủ", "sc": "The customer is comparing your product with a competitor’s product. They want a direct and objective comparison, so you need to highlight your strengths clearly."}, {"q": "What is your key competitive advantage?", "vi": "Lợi thế cạnh tranh chính của bạn là gì?", "st": "Our main advantage is + advantage area.", "ph": ["advanced technology", "global network", "flexible terms"], "ss": ["Our main advantage is our ability to combine product development, export coordination, and flexible commercial support in one process.", "We also have a strong global network, which helps us understand different market expectations and customer preferences.", "Another advantage is that we can work with flexible terms when the project scope and long-term cooperation are clear."], "sa": "Our main advantage is a strong global network, flexible terms, and the ability to support customers with practical solutions.", "src": "So sánh sản phẩm với đối thủ", "sc": "The customer is comparing your product with a competitor’s product. They want a direct and objective comparison, so you need to highlight your strengths clearly."}, {"q": "Why do they offer a lower price?", "vi": "Tại sao họ lại đưa ra mức giá thấp hơn?", "st": "They use + lower-cost factor.", "ph": ["cheaper materials", "limited support", "smaller capacity"], "ss": ["In some cases, a lower price may come from cheaper materials or a simpler finishing process.", "It can also mean the supplier provides more limited support in areas like customization, quality control, or after-sales follow-up.", "Sometimes smaller capacity allows a supplier to focus only on simple orders, but it may be harder for them to maintain consistency at scale."], "sa": "They may use cheaper materials, offer more limited support, or operate with a smaller capacity structure.", "src": "So sánh sản phẩm với đối thủ", "sc": "The customer is comparing your product with a competitor’s product. They want a direct and objective comparison, so you need to highlight your strengths clearly."}, {"q": "What guarantees can you provide?", "vi": "Bạn có thể cung cấp những đảm bảo nào?", "st": "We guarantee + assurance area.", "ph": ["product quality", "on-time delivery", "free replacement"], "ss": ["We guarantee product quality through inspection standards, production follow-up, and final checking before shipment.", "We also work hard to maintain on-time delivery by confirming timelines clearly and updating customers early if any issue appears.", "If there is a confirmed production defect, we can discuss free replacement or another practical solution depending on the case."], "sa": "We guarantee product quality, on-time delivery, and practical replacement support when needed.", "src": "So sánh sản phẩm với đối thủ", "sc": "The customer is comparing your product with a competitor’s product. They want a direct and objective comparison, so you need to highlight your strengths clearly."}, {"q": "How do you handle after-sales service?", "vi": "Bạn xử lý dịch vụ hậu mãi như thế nào?", "st": "We provide + after-sales support type.", "ph": ["technical support", "regular follow-up", "training sessions"], "ss": ["We provide technical support whenever the customer needs product clarification, usage guidance, or issue follow-up.", "We also maintain regular follow-up after delivery to make sure the customer is satisfied with quality, packaging, and performance.", "If needed, we can arrange training sessions or product briefings for distributors and sales teams."], "sa": "We provide technical support, regular follow-up, and training sessions as part of our after-sales service.", "src": "So sánh sản phẩm với đối thủ", "sc": "The customer is comparing your product with a competitor’s product. They want a direct and objective comparison, so you need to highlight your strengths clearly."}], "ph": "Import-export and negotiation"}, {"n": 26, "en": "Difficult emails: saying no, pushing back, chasing payment, complaints", "vi": "", "vocab": [{"id": "E26-0", "en": "overdue invoice", "vi": "an invoice that has not been paid by the due date", "ex": "Invoice 1087 is now 20 days overdue.", "vn": "hóa đơn quá hạn"}, {"id": "E26-1", "en": "outstanding balance", "vi": "the amount that has not yet been paid", "ex": "The outstanding balance is USD 4,500.", "vn": "số dư còn nợ"}, {"id": "E26-2", "en": "payment reminder", "vi": "a message that reminds a customer to pay", "ex": "This is a friendly payment reminder.", "vn": "nhắc thanh toán"}, {"id": "E26-3", "en": "final notice", "vi": "the last warning before further action", "ex": "This is our final notice before we stop shipments.", "vn": "thông báo cuối cùng"}, {"id": "E26-r4", "en": "late fee", "vi": "an extra charge for paying late", "ex": "A late fee applies after 30 days.", "vn": "phí trả chậm"}, {"id": "E26-5", "en": "grace period", "vi": "extra time allowed after the due date", "ex": "We can allow a grace period of seven days.", "vn": "thời gian gia hạn"}, {"id": "E26-6", "en": "decline politely", "vi": "say no in a respectful way", "ex": "We have to decline politely, as the price is below our cost.", "vn": "từ chối lịch sự"}, {"id": "E26-7", "en": "regret to inform you", "vi": "a formal way to give bad news", "ex": "We regret to inform you that we cannot accept this order.", "vn": "rất tiếc phải báo"}, {"id": "E26-8", "en": "unfortunately", "vi": "used before bad news", "ex": "Unfortunately, we cannot offer a further discount.", "vn": "rất tiếc là"}, {"id": "E26-9", "en": "push back", "vi": "disagree with a request or decision", "ex": "We need to push back on the new delivery date.", "vn": "phản đối, không đồng ý ngay"}, {"id": "E26-10", "en": "non-negotiable", "vi": "not open to discussion", "ex": "The safety requirements are non-negotiable.", "vn": "không thể thương lượng"}, {"id": "E26-11", "en": "we must insist", "vi": "a firm way to repeat a requirement", "ex": "We must insist on written confirmation.", "vn": "chúng tôi buộc phải yêu cầu"}, {"id": "E26-12", "en": "breach of contract", "vi": "breaking the terms of an agreement", "ex": "Late delivery without notice may be a breach of contract.", "vn": "vi phạm hợp đồng"}, {"id": "E26-13", "en": "penalty", "vi": "a payment or punishment for breaking a rule", "ex": "The contract includes a penalty for late delivery.", "vn": "tiền phạt"}, {"id": "E26-14", "en": "dispute", "vi": "a disagreement about a payment, price or term", "ex": "We would like to resolve this dispute quickly.", "vn": "tranh chấp"}, {"id": "E26-15", "en": "resolve", "vi": "find a solution to a problem", "ex": "We hope to resolve this matter this week.", "vn": "giải quyết"}, {"id": "E26-16", "en": "formal complaint", "vi": "an official written statement of a problem", "ex": "We have to submit a formal complaint about the damaged goods.", "vn": "khiếu nại chính thức"}, {"id": "E26-17", "en": "compromise", "vi": "an agreement in which both sides give up something", "ex": "Let's find a compromise on the delivery date.", "vn": "thỏa hiệp"}, {"id": "E26-18", "en": "alternative", "vi": "another option", "ex": "We can offer an alternative: a partial shipment now.", "vn": "phương án thay thế"}, {"id": "E26-19", "en": "take action", "vi": "start to do something about a problem", "ex": "We will have to take action if we do not receive payment.", "vn": "có biện pháp xử lý"}], "quiz": [{"s": "A customer is 20 days late with a payment. Which opening is firm but polite?", "o": ["I'm writing to remind you that invoice 1087 is now 20 days overdue. Could you please settle the balance by 30 November?", "You didn't pay. Pay now or we stop.", "I think maybe you forgot something."], "why": "Name the invoice, the delay and a deadline. Firm, clear and respectful."}, {"s": "You must refuse a price request.", "o": ["Unfortunately, we are unable to offer a further discount, but we can propose an alternative.", "No. Our price is final. Do not ask again.", "Maybe, we will think. Probably no."], "why": "Say no clearly, then give an alternative to keep the relationship."}, {"s": "A supplier delivered damaged goods again. How do you start the complaint?", "o": ["I'm writing to submit a formal complaint about the damaged goods in shipment 07. Photos are attached.", "Your goods are terrible. We are angry.", "This happens always. What are you doing?"], "why": "Describe the problem with facts and evidence. Keep emotion out of the first line."}, {"s": "\"Final notice\" means…", "o": ["the last warning before further action", "the first reminder", "a thank-you note"], "why": "A final notice says action will follow if nothing changes."}, {"s": "A customer demands an unrealistic delivery date.", "o": ["I'm afraid that date isn't realistic. Could we propose a compromise?", "No, never, impossible.", "Okay, we will try, maybe."], "why": "Say no politely and offer a compromise."}, {"s": "\"Grace period\" means…", "o": ["extra time allowed after the due date", "a prayer before a meal", "a discount for early payment"], "why": "A grace period gives a short extension without penalty."}], "speak": [{"s": "Phone a customer about an overdue payment", "l": ["Hello, this is Sally from the finance team.", "I'm calling about invoice 1087, which is now 20 days overdue.", "Could you tell me when we can expect the payment?"]}, {"s": "Refuse a request politely", "l": ["Thank you for your offer. Unfortunately, we cannot accept this price.", "The price is below our cost, so we have to decline politely.", "However, we can offer a partial shipment as an alternative."]}], "email": "Subject: Payment reminder – invoice 1087\n\nDear Mr. Silva,\n\nI'm writing to remind you that invoice 1087 is now 20 days [[overdue|overdued|over due]]. The outstanding balance is USD 4,500.\n\nCould you please [[settle|settling|to settle]] it by 30 November? If there is any problem with the invoice, please let me know so that we can [[resolve|resolved|resolution]] it quickly.\n\nWe must insist [[on|in|at]] payment before the next shipment is released.\n\nThank you for your understanding.\n\nBest regards,\nSally", "coach": [{"q": "Why can't you give us a discount?", "vi": "Vì sao bạn không thể giảm giá cho chúng tôi?", "st": "Unfortunately, we cannot + action + because + reason.", "ph": ["a further discount", "close to our cost", "an alternative"], "ss": [], "sa": "Unfortunately, we cannot offer a further discount because the price is already close to our cost. I can offer an alternative: free delivery on the next order.", "src": "Email by audience", "sc": "A big customer asks for a second discount after you already lowered the price.", "lab": "Work practice"}, {"q": "When will you pay the invoice?", "vi": "Khi nào bạn thanh toán hóa đơn?", "st": "We expect + payment + by + date.", "ph": ["the outstanding balance", "a grace period", "stop further shipments"], "ss": [], "sa": "We expect the outstanding balance by 30 November. We can allow a grace period of seven days, but after that we will have to stop further shipments.", "src": "Email by audience", "sc": "A customer is late and asks for more time. You can give a short extension.", "lab": "Work practice"}, {"q": "Why are you pushing back on the schedule?", "vi": "Vì sao bạn không đồng ý với lịch này?", "st": "We need to push back because + reason, and we propose + solution.", "ph": ["the new delivery date", "not realistic", "a compromise"], "ss": [], "sa": "We need to push back on the new delivery date because it is not realistic for the factory. We propose a compromise: a partial shipment on the original date.", "src": "Email by audience", "sc": "A customer demands a delivery date that the factory cannot meet.", "lab": "Work practice"}, {"q": "What do you want us to do about the damaged goods?", "vi": "Bạn muốn chúng tôi xử lý hàng bị hỏng thế nào?", "st": "We request + action + within + time.", "ph": ["a formal complaint", "replace the damaged goods", "within ten days"], "ss": [], "sa": "We have submitted a formal complaint. We request that you replace the damaged goods within ten days, at your cost.", "src": "Email by audience", "sc": "You are on a call with a supplier who says the damage must have happened in transit.", "lab": "Work practice"}], "ph": "Email writing by audience"}, {"n": 28, "en": "Building materials 1: products, specifications and standards", "vi": "", "vocab": [{"id": "E28-0", "en": "ceramic tile", "vi": "a thin, hard square used to cover floors and walls", "ex": "These ceramic tiles are for indoor floors.", "vn": "gạch ốp lát gốm"}, {"id": "E28-1", "en": "porcelain tile", "vi": "a very dense tile that takes in almost no water", "ex": "Porcelain tiles are better for outdoor areas.", "vn": "gạch porcelain"}, {"id": "E28-2", "en": "moisture resistance", "vi": "how well a material stays strong when it is wet", "ex": "Moisture resistance is important for bathroom walls.", "vn": "khả năng chịu ẩm"}, {"id": "E28-3", "en": "bending strength", "vi": "the greatest bending force a material can take before it breaks", "ex": "The bending strength of the board is 22 MPa.", "vn": "cường độ chịu uốn"}, {"id": "E28-4", "en": "load-bearing", "vi": "able to carry the weight of a building", "ex": "This is a load-bearing wall, so we cannot remove it.", "vn": "chịu lực"}, {"id": "E28-5", "en": "reinforced concrete", "vi": "concrete with steel bars inside it", "ex": "The columns are made of reinforced concrete.", "vn": "bê tông cốt thép"}, {"id": "E28-6", "en": "rebar", "vi": "a steel bar placed inside concrete to make it stronger", "ex": "We need 20 tonnes of rebar for the foundation.", "vn": "thép cốt bê tông"}, {"id": "E28-7", "en": "aggregate", "vi": "sand, gravel or crushed stone mixed into concrete", "ex": "The aggregate must be clean and dry.", "vn": "cốt liệu"}, {"id": "E28-8", "en": "insulation", "vi": "material that stops heat or sound from passing through", "ex": "We recommend rock wool insulation for the roof.", "vn": "vật liệu cách nhiệt"}, {"id": "E28-9", "en": "cladding", "vi": "an outer layer that covers the wall of a building", "ex": "The cladding is made of aluminium panels.", "vn": "tấm ốp mặt ngoài"}, {"id": "E28-10", "en": "waterproofing", "vi": "a treatment that stops water from getting in", "ex": "Waterproofing is essential for the basement.", "vn": "chống thấm"}, {"id": "E28-11", "en": "slip resistance", "vi": "how well a surface stops people from slipping", "ex"
