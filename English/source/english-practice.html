e delivery window. The site will need a forklift for unloading.\n\nIf you see any damage in transit, please send photographic [[evidence|evidences|proofs]] within three days so that we can review your defect claim.\n\nBest regards,\nSally", "coach": [{"q": "How are the tiles packed for shipping?", "vi": "Gạch được đóng gói để vận chuyển như thế nào?", "st": "The goods are packed + method + to protect + risk.", "ph": ["wooden pallets", "strapping", "damage in transit"], "ss": [], "sa": "The tiles are packed on wooden pallets with strapping to protect them from damage in transit.", "src": "Industry practice", "sc": "A buyer worries that fragile tiles will break on the way and asks about packing.", "lab": "Work practice"}, {"q": "Can you deliver to the building site?", "vi": "Bạn có thể giao đến công trình không?", "st": "Yes, we can arrange + service, if + information.", "ph": ["site delivery", "the site contact", "a forklift"], "ss": [], "sa": "Yes, we can arrange site delivery, if you give us the name of the site contact and confirm that you have a forklift for unloading.", "src": "Industry practice", "sc": "A contractor wants the goods delivered directly to the site instead of a warehouse.", "lab": "Work practice"}, {"q": "Is this colour in stock?", "vi": "Màu này có sẵn trong kho không?", "st": "This colour is + status, and the lead time is + time.", "ph": ["in stock", "made to order", "six weeks"], "ss": [], "sa": "This colour is in stock and ready to ship. The other colour is made to order, so the lead time is six weeks.", "src": "Industry practice", "sc": "The customer asks if they can have the grey and the blue tiles next week.", "lab": "Work practice"}, {"q": "What if some goods arrive damaged?", "vi": "Nếu một số hàng đến nơi bị hỏng thì sao?", "st": "Please send + evidence + so that + action.", "ph": ["photographic evidence", "within three days", "review your defect claim"], "ss": [], "sa": "Please send photographic evidence within three days, so that we can review your defect claim and arrange a replacement.", "src": "Industry practice", "sc": "A new customer asks about your policy before placing the first order.", "lab": "Work practice"}], "ph": "Products and trade"}, {"n": 33, "en": "Wine and spirits 2: price lists, orders and distribution", "vi": "", "vocab": [{"id": "E33-0", "en": "wholesale price", "vi": "the price at which a seller sells goods in large quantities", "ex": "The wholesale price is USD 9 per bottle.", "vn": "giá sỉ"}, {"id": "E33-1", "en": "retail price", "vi": "the price at which goods are sold to the public", "ex": "The recommended retail price is USD 18.", "vn": "giá bán lẻ"}, {"id": "E33-2", "en": "wine list", "vi": "the list of wines that a restaurant offers", "ex": "We would like to add your wine to our wine list.", "vn": "danh sách rượu (nhà hàng)"}, {"id": "E33-3", "en": "supermarket chain", "vi": "a group of supermarkets with the same owner", "ex": "A supermarket chain asked for a listing.", "vn": "chuỗi siêu thị"}, {"id": "E33-4", "en": "excise duty", "vi": "a tax on alcohol and some other goods", "ex": "Excise duty is added to the invoice.", "vn": "thuế tiêu thụ đặc biệt"}, {"id": "E33-5", "en": "duty-paid", "vi": "with import taxes already paid", "ex": "The price is duty-paid, delivered to your warehouse.", "vn": "đã nộp thuế"}, {"id": "E33-6", "en": "bonded warehouse", "vi": "a store where goods wait until tax is paid", "ex": "The wine will stay in a bonded warehouse until it is sold.", "vn": "kho ngoại quan"}, {"id": "E33-7", "en": "duty stamp", "vi": "a tax stamp on bottles of alcohol in some countries", "ex": "Bottles need a duty stamp before they can be sold.", "vn": "tem thuế rượu"}, {"id": "E33-8", "en": "mixed case", "vi": "a case with different wines in it", "ex": "A mixed case is a good way to try the range.", "vn": "thùng hỗn hợp"}, {"id": "E33-9", "en": "limited edition", "vi": "a product made in a small, fixed number", "ex": "This is a limited edition of 500 bottles.", "vn": "phiên bản giới hạn"}, {"id": "E33-10", "en": "listing", "vi": "approval for a product to be sold in a shop or on a menu", "ex": "We hope to get a listing in the main supermarkets.", "vn": "đưa sản phẩm vào danh mục bán"}, {"id": "E33-11", "en": "volume discount", "vi": "a lower price for a larger order", "ex": "We offer a volume discount from 50 cases.", "vn": "chiết khấu theo số lượng"}, {"id": "E33-12", "en": "promotional support", "vi": "help from the supplier to promote a product", "ex": "We offer promotional support, such as tastings in stores.", "vn": "hỗ trợ khuyến mại"}, {"id": "E33-13", "en": "bottle size", "vi": "the volume of a bottle, such as 750 ml", "ex": "The bottle size is 750 millilitres.", "vn": "dung tích chai"}, {"id": "E33-14", "en": "market launch", "vi": "the first sale of a product in a market", "ex": "We plan the market launch for September.", "vn": "ra mắt thị trường"}, {"id": "E33-15", "en": "stock rotation", "vi": "selling older goods first", "ex": "Good stock rotation avoids old stock.", "vn": "luân chuyển hàng tồn"}, {"id": "E33-16", "en": "sell-through", "vi": "the speed at which products are sold from the shelf", "ex": "The sell-through of the new wine is very good.", "vn": "tốc độ bán ra"}, {"id": "E33-17", "en": "reorder", "vi": "order the same goods again", "ex": "We expect you to reorder after the first month.", "vn": "đặt hàng lại"}, {"id": "E33-18", "en": "price band", "vi": "a range of prices for a type of product", "ex": "This wine is in the mid-price band.", "vn": "phân khúc giá"}, {"id": "E33-19", "en": "minimum order", "vi": "the smallest quantity that a seller accepts", "ex": "The minimum order for the first shipment is 500 cases.", "vn": "đơn hàng tối thiểu"}], "quiz": [{"s": "A distributor asks about the price. Which answer is clear?", "o": ["The wholesale price is USD 9 per bottle, duty-paid, and the recommended retail price is USD 18.", "The price is good, around ten dollars.", "Price depends on many things."], "why": "State wholesale and retail price and say whether duty is included."}, {"s": "A buyer wants to try several wines before a large order.", "o": ["We can offer a mixed case so that you can taste the whole range.", "You should buy 100 cases first.", "We do not sell small orders."], "why": "A mixed case lets the buyer test without a big commitment."}, {"s": "You want to ask for a supermarket listing.", "o": ["We would like to apply for a listing, and we can offer promotional support in the stores.", "Please put our wine in your shop now.", "We want your shelf for free."], "why": "A listing request works best when you also offer support for sales."}, {"s": "\"Duty-paid\" means…", "o": ["import taxes are already paid", "the goods are free", "the goods are damaged"], "why": "Duty-paid prices include import taxes."}, {"s": "You want to know the smallest first order.", "o": ["What is the minimum order for the first shipment?", "How small order you accept?", "I want to buy only a few."], "why": "Ask for the minimum order and the shipment it applies to."}, {"s": "\"Sell-through\" tells you…", "o": ["how fast products are sold from the shelf", "how many bottles are made", "how long a bottle lasts"], "why": "A good sell-through leads to a repeat order."}], "speak": [{"s": "Discuss prices with a distributor", "l": ["The wholesale price is nine dollars per bottle, duty-paid.", "We offer a volume discount from fifty cases.", "The minimum order for the first shipment is five hundred cases."]}, {"s": "Pitch to a restaurant group", "l": ["Our wine is in the mid-price band and works well on the on-trade menu.", "We can send a mixed case for your tasting.", "If it sells well, we expect you to reorder within a month."]}], "email": "Subject: Price list and first order – spring range\n\nDear Mr. Costa,\n\nThank you for your interest in our spring range. Please find our price list attached. The wholesale price is USD 9 per bottle, duty-[[paid|pay|paying]], delivered to your warehouse.\n\nThe minimum order for the first shipment is 500 cases. We offer a volume [[discount|discounted|discounting]] from 50 cases, and a mixed case is available [[for|to|at]] tasting.\n\nWe can also provide promotional support in your stores. I look forward to hearing from you.\n\nBest regards,\nSally", "coach": [{"q": "What are your prices?", "vi": "Giá của bạn là bao nhiêu?", "st": "The wholesale price is + amount, and the retail price is + amount.", "ph": ["the wholesale price", "the recommended retail price", "duty-paid"], "ss": [], "sa": "The wholesale price is nine dollars per bottle, duty-paid, and the recommended retail price is eighteen dollars.", "src": "Industry practice", "sc": "A new distributor asks for a price quote before a meeting.", "lab": "Work practice"}, {"q": "What is your minimum order?", "vi": "Đơn hàng tối thiểu của bạn là bao nhiêu?", "st": "The minimum order is + quantity, but + flexibility.", "ph": ["the minimum order", "500 cases", "a mixed case"], "ss": [], "sa": "The minimum order is 500 cases for the first shipment, but we can send a mixed case for a first tasting.", "src": "Industry practice", "sc": "The buyer says the first order should be smaller than your normal minimum.", "lab": "Work practice"}, {"q": "What support do you give distributors?", "vi": "Bạn hỗ trợ nhà phân phối những gì?", "st": "We offer + support such as + examples.", "ph": ["promotional support", "tastings in stores", "a volume discount"], "ss": [], "sa": "We offer promotional support, such as tastings in stores, and a volume discount for larger orders.", "src": "Industry practice", "sc": "A distributor asks how you will help sell your wine in a new market.", "lab": "Work practice"}, {"q": "How does the wine reach the customer?", "vi": "Rượu đến tay khách hàng bằng cách nào?", "st": "The wine goes from + point to + point through + channel.", "ph": ["a bonded warehouse", "the on-trade", "off-trade"], "ss": [], "sa": "The wine goes from a bonded warehouse to the on-trade, such as restaurants and hotels, and to the off-trade through supermarkets.", "src": "Industry practice", "sc": "An investor wants to understand your sales channels.", "lab": "Work practice"}], "ph": "Products and trade"}, {"n": 31, "en": "Biomass pellets 2: bulk shipping, contracts and inspection", "vi": "", "vocab": [{"id": "E31-0", "en": "bulk cargo", "vi": "goods shipped loose, not in boxes or containers", "ex": "Pellets are usually shipped as bulk cargo.", "vn": "hàng rời"}, {"id": "E31-1", "en": "big bag", "vi": "a large strong bag that holds about one tonne", "ex": "We can also ship the pellets in big bags.", "vn": "bao jumbo"}, {"id": "E31-2", "en": "vessel hold", "vi": "the space inside a ship where cargo is kept", "ex": "The vessel holds must be clean and dry.", "vn": "hầm tàu"}, {"id": "E31-3", "en": "loading rate", "vi": "the amount of cargo loaded per day", "ex": "The loading rate is 3,000 tonnes per day.", "vn": "tốc độ xếp hàng"}, {"id": "E31-4", "en": "laytime", "vi": "the time allowed to load or unload a ship", "ex": "The laytime is 72 hours in total.", "vn": "thời gian xếp dỡ cho phép"}, {"id": "E31-5", "en": "notice of readiness", "vi": "a message from the ship that it is ready to load", "ex": "The captain sent the notice of readiness this morning.", "vn": "thông báo sẵn sàng"}, {"id": "E31-6", "en": "draft survey", "vi": "a check of the ship's depth in the water to measure the cargo weight", "ex": "A draft survey will confirm the quantity loaded.", "vn": "giám định mớn nước"}, {"id": "E31-7", "en": "independent surveyor", "vi": "an outside expert who checks quality and quantity", "ex": "An independent surveyor will inspect the cargo.", "vn": "giám định viên độc lập"}, {"id": "E31-8", "en": "inspection certificate", "vi": "a document from a surveyor that confirms quality or quantity", "ex": "The inspection certificate is issued at the port of loading.", "vn": "chứng thư giám định"}, {"id": "E31-9", "en": "quantity tolerance", "vi": "the small difference in quantity that is allowed", "ex": "The quantity tolerance is plus or minus 5 percent.", "vn": "dung sai số lượng"}, {"id": "E31-10", "en": "spot price", "vi": "the price for immediate delivery", "ex": "The spot price changes every week.", "vn": "giá giao ngay"}, {"id": "E31-11", "en": "offtake agreement", "vi": "a long-term contract in which the buyer agrees to buy a supplier's goods", "ex": "We are discussing a three-year offtake agreement.", "vn": "hợp đồng bao tiêu"}, {"id": "E31-12", "en": "shipment period", "vi": "the time in which the seller must ship the goods", "ex": "The shipment period is 15 to 30 March.", "vn": "thời gian giao hàng"}, {"id": "E31-13", "en": "weather delay", "vi": "a delay because of bad weather", "ex": "A weather delay does not count as laytime.", "vn": "chậm trễ do thời tiết"}, {"id": "E31-14", "en": "dead freight", "vi": "money paid for cargo space that was booked but not used", "ex": "The buyer paid dead freight for the empty space.", "vn": "cước khống"}, {"id": "E31-15", "en": "quality claim", "vi": "a request for compensation because the goods do not meet the contract", "ex": "We received a quality claim about the ash content.", "vn": "khiếu nại chất lượng"}, {"id": "E31-16", "en": "port congestion", "vi": "a situation in which too many ships wait to enter a port", "ex": "Port congestion delayed the loading by four days.", "vn": "ùn tắc cảng"}, {"id": "E31-17", "en": "payment against documents", "vi": "payment made when the seller gives the shipping documents", "ex": "We offer payment against documents at sight.", "vn": "thanh toán đối chứng từ"}, {"id": "E31-18", "en": "price per tonne", "vi": "the cost of one tonne of goods", "ex": "The price is USD 140 per tonne CIF Busan.", "vn": "giá mỗi tấn"}, {"id": "E31-19", "en": "firm offer", "vi": "an offer that the seller cannot change before a stated date", "ex": "This is a firm offer valid until Friday.", "vn": "chào giá cố định"}], "quiz": [{"s": "A buyer asks how the quantity will be confirmed. Which answer is best?", "o": ["An independent surveyor will do a draft survey, and the certificate will be issued at the port of loading.", "We will tell you the number after the ship leaves.", "Please trust our own figure."], "why": "A neutral surveyor and a draft survey are standard for bulk cargo."}, {"s": "The vessel is late and loading starts after the agreed time. What term do you raise?", "o": ["If loading is late, the buyer may have to pay demurrage under the contract.", "The vessel will wait, no problem.", "We will stop work and go home."], "why": "\"Demurrage\" is the money paid when a ship waits longer than agreed."}, {"s": "You want to make a binding price offer.", "o": ["This is a firm offer at USD 140 per tonne, valid until Friday.", "Maybe the price is around 140.", "I think we can do 140, not sure."], "why": "A \"firm offer\" gives the price and a clear validity date."}, {"s": "A \"draft survey\" is…", "o": ["a check of the ship's depth in the water to calculate the cargo weight", "a plan for a new contract", "a first copy of a document"], "why": "A draft survey is a standard way to measure bulk cargo."}, {"s": "You want a safe payment method for a large order.", "o": ["Would you accept payment against documents at sight?", "Pay me later, it is okay.", "We want money before we start."], "why": "\"Payment against documents\" balances risk for both sides."}, {"s": "\"Laytime\" means…", "o": ["the time allowed to load or unload a ship", "the time for the ship to sail", "the time to pay the invoice"], "why": "Laytime counts how long the ship may stay at the port."}], "speak": [{"s": "Discuss a bulk shipment with a buyer", "l": ["We plan to load 30,000 tonnes in the second half of March.", "The loading rate is 3,000 tonnes per day, and an independent surveyor will check the quantity.", "We will send the notice of readiness as soon as the vessel arrives."]}, {"s": "Make a firm offer", "l": ["I'd like to make a firm offer for 5,000 tonnes.", "The price is 140 US dollars per tonne CIF, and the offer is valid until Friday.", "Payment will be against documents at sight."]}], "email": "Subject: Firm offer – wood pellets, March shipment\n\nDear Mr. Tanaka,\n\nWe are pleased to make a firm offer for 30,000 tonnes of wood pellets. The price is USD 140 per tonne CIF Busan, and the [[shipment|shipping|ship]] period is 15 to 30 March.\n\nThe quantity tolerance is plus or minus 5 percent. An independent surveyor will [[carry out|carry on|take out]] a draft survey at the port of loading, and the inspection certificate will be final. Payment will be [[against|for|by]] documents at sight.\n\nThis offer is valid [[until|since|during]] Friday.\n\nBest regards,\nSally", "coach": [{"q": "How will the pellets be shipped?", "vi": "Viên nén sẽ được vận chuyển như thế nào?", "st": "The pellets will be shipped + method + from + port.", "ph": ["as bulk cargo", "in big bags", "the port of loading"], "ss": [], "sa": "The pellets will be shipped as bulk cargo, or in big bags if you prefer, from the port of loading in Vietnam.", "src": "Industry practice", "sc": "A new buyer asks about packing and shipping options before making an offer.", "lab": "Work practice"}, {"q": "Who will check the quantity and quality?", "vi": "Ai sẽ kiểm tra số lượng và chất lượng?", "st": "An independent surveyor will + action, and + document.", "ph": ["independent surveyor", "draft survey", "inspection certificate"], "ss": [], "sa": "An independent surveyor will carry out a draft survey and check the quality, and the inspection certificate will be final for both sides.", "src": "Industry practice", "sc": "The buyer wants to avoid disagreements about how much was loaded.", "lab": "Work practice"}, {"q": "What happens if the vessel is delayed?", "vi": "Điều gì xảy ra nếu tàu bị chậm?", "st": "If + situation, then + result under the contract.", "ph": ["laytime", "demurrage", "a weather delay"], "ss": [], "sa": "A weather delay does not count as laytime, but if loading is late for another reason, the buyer may have to pay demurrage.", "src": "Industry practice", "sc": "Both sides discuss the contract terms for loading time.", "lab": "Work practice"}, {"q": "Can you offer a long-term contract?", "vi": "Bạn có thể chào hợp đồng dài hạn không?", "st": "We can offer + contract + with + terms.", "ph": ["offtake agreement", "a three-year", "a fixed price"], "ss": [], "sa": "We can offer a three-year offtake agreement with a fixed price for the first year and a review every six months.", "src": "Industry practice", "sc": "A trading company wants a stable supply and asks if you can commit for several years.", "lab": "Work practice"}], "ph": "Products and trade"}, {"n": 15, "en": "The wine trade: labels, licences and temperature control", "vi": "", "vocab": [{"id": "L8-0", "en": "vintage", "vi": "the year in which the grapes for a wine were picked", "ex": "The 2022 vintage is sold out.", "vn": "niên vụ"}, {"id": "L8-1", "en": "grape variety", "vi": "the type of grape used to make a wine", "ex": "Shiraz is the main grape variety in this wine.", "vn": "giống nho"}, {"id": "L8-2", "en": "region of origin", "vi": "the area where a wine or other product comes from", "ex": "The label must show the region of origin.", "vn": "vùng xuất xứ"}, {"id": "L8-3", "en": "alcohol content", "vi": "the percentage of alcohol in a drink", "ex": "The alcohol content is 13.5 percent.", "vn": "nồng độ cồn"}, {"id": "L8-4", "en": "back label", "vi": "the label on the back of a bottle with legal and product information", "ex": "The importer will add a back label in Vietnamese.", "vn": "nhãn phụ"}, {"id": "L8-5", "en": "excise tax", "vi": "a tax on certain goods such as alcohol and tobacco", "ex": "Excise tax makes up a large part of the retail price.", "vn": "thuế tiêu thụ đặc biệt"}, {"id": "L8-6", "en": "import licence", "vi": "official permission to import certain goods", "ex": "Only companies with an import licence can bring in wine.", "vn": "giấy phép nhập khẩu"}, {"id": "L8-7", "en": "temperature-controlled", "vi": "kept at a fixed temperature during storage or transport", "ex": "We ship wine in temperature-controlled containers.", "vn": "kiểm soát nhiệt độ"}, {"id": "L8-8", "en": "reefer container", "vi": "a refrigerated shipping container", "ex": "In summer, a reefer container protects the wine from heat.", "vn": "container lạnh"}, {"id": "L8-9", "en": "case", "vi": "a box that holds a set number of bottles, usually six or twelve", "ex": "The minimum order is 50 cases.", "vn": "thùng rượu"}, {"id": "L8-10", "en": "shelf life", "vi": "how long a product can be stored before it loses quality", "ex": "Most white wines have a shorter shelf life.", "vn": "thời gian bảo quản"}, {"id": "L8-11", "en": "tasting notes", "vi": "a short description of how a wine smells and tastes", "ex": "Please include tasting notes in the catalogue.", "vn": "ghi chú cảm quan"}, {"id": "L8-12", "en": "price point", "vi": "the retail price level at which a product is sold", "ex": "Restaurants want wines at a mid-range price point.", "vn": "mức giá bán lẻ"}, {"id": "L8-13", "en": "on-trade", "vi": "selling drinks to restaurants, bars and hotels", "ex": "Our focus is the on-trade, mainly hotels.", "vn": "kênh nhà hàng, khách sạn"}, {"id": "L8-14", "en": "off-trade", "vi": "selling drinks through shops and supermarkets for drinking at home", "ex": "Off-trade sales grow before Tet.", "vn": "kênh bán lẻ"}, {"id": "L8-15", "en": "cellar door", "vi": "a winery's own shop where visitors can taste and buy wine", "ex": "We met the producer at the cellar door.", "vn": "cửa hàng tại vườn nho"}, {"id": "L8-16", "en": "producer", "vi": "a company that makes a product, such as a winery", "ex": "The producer can ship within four weeks.", "vn": "nhà sản xuất"}, {"id": "L8-17", "en": "allocation", "vi": "the limited quantity a supplier sets aside for a customer", "ex": "Our allocation of the premium wine is only 20 cases.", "vn": "lượng phân bổ"}, {"id": "L8-18", "en": "importer of record", "vi": "the company legally responsible for imported goods and their duties", "ex": "As importer of record, we pay the excise tax and import duty.", "vn": "đơn vị đứng tên nhập khẩu"}, {"id": "L8-19", "en": "sell-out", "vi": "sales from the retailer to the final customer", "ex": "We track sell-out in each restaurant every month.", "vn": "doanh số bán ra (sell-out)"}], "quiz": [{"s": "Why would you choose a reefer container for wine in summer?", "o": ["To keep the wine at a stable temperature and avoid heat damage", "Because it is always cheaper", "To make the wine colder for drinking"], "why": "Heat can damage wine during long sea transport."}, {"s": "A restaurant group belongs to which channel?", "o": ["on-trade", "off-trade", "cellar door"], "why": "On-trade = drinks served on the premises, such as restaurants, bars and hotels."}, {"s": "What is usually needed before a company can import wine?", "o": ["an import licence for alcohol", "a driving licence", "a hotel booking"], "why": "Alcohol is a controlled product in many countries; confirm the local rules with a broker."}, {"s": "What does \"vintage\" tell you about a wine?", "o": ["the year the grapes were harvested", "the price of the wine", "the colour of the wine"], "why": "The vintage is the harvest year."}, {"s": "\"Allocation\" means…", "o": ["a limited quantity that a buyer may order", "a free sample", "a type of label"], "why": "An allocation is a fixed share of a limited product."}, {"s": "Which information must usually appear on the back label?", "o": ["the importer's name and the alcohol content", "only the price", "the sommelier's name"], "why": "The back label carries legal information such as the importer and alcohol."}], "speak": [{"s": "Introduce a wine to a hotel buyer", "l": ["This is a 2022 Shiraz from South Australia.", "It has an alcohol content of 14 percent and rich, dark fruit notes.", "It sits at a mid-range price point for hotel wine lists."]}, {"s": "Discuss shipping conditions with a producer", "l": ["We'd like to ship the order in a reefer container because of the summer heat.", "Could you confirm the number of cases per pallet?", "We'll add the back labels after the goods arrive."]}], "email": "Subject: Order inquiry – Shiraz 2022\n\nDear Producer,\n\nWe are an importer based in Vietnam and are interested in your 2022 Shiraz for the [[on-trade|on trade|in-trade]] market.\n\nCould you please send your price per case, your minimum order and the [[allocation|allocate|located]] available for this year?\n\nWe would also like to know whether you can ship in a temperature-[[controlled|control|controlling]] container.\n\nWe look forward to [[working|work|worked]] with you.\n\nBest regards,\nSally", "coach": [{"q": "Which channel will you sell the wine through?", "vi": "Bạn sẽ bán rượu qua kênh nào?", "st": "We will focus on + channel, mainly + customers.", "ph": ["the on-trade", "hotels and restaurants", "a mid-range price point"], "sa": "We will focus on the on-trade, mainly hotels and restaurants, with wines at a mid-range price point.", "sc": "A producer asks about your sales plan before offering an allocation.", "ss": [], "src": "The wine trade", "lab": "Work practice"}, {"q": "How will you protect the wine during shipping?", "vi": "Bạn bảo quản rượu khi vận chuyển thế nào?", "st": "We will + methods + to + purpose.", "ph": ["use a reefer container", "avoid the hottest weeks", "insure the shipment"], "sa": "We will use a reefer container to keep the temperature stable, avoid the hottest weeks if possible and insure the shipment.", "sc": "The producer worries about heat damage on the way to Vietnam.", "ss": [], "src": "The wine trade", "lab": "Work practice"}, {"q": "Which costs make wine expensive to import?", "vi": "Chi phí nào làm rượu nhập khẩu đắt?", "st": "The main costs are + list.", "ph": ["excise tax", "import duty", "temperature-controlled freight"], "sa": "The main costs are excise tax, import duty and temperature-controlled freight, plus labelling and storage.", "sc": "A hotel buyer asks why imported wine costs so much.", "ss": [], "src": "The wine trade", "lab": "Work practice"}, {"q": "What must appear on the back label?", "vi": "Nhãn phụ phải có thông tin gì?", "st": "It must show + information, but + caution.", "ph": ["the alcohol content", "the region of origin", "the importer's details"], "sa": "It must show the alcohol content, the region of origin and the importer's details, but we confirm the exact rules with a broker.", "sc": "The producer asks what you need for labelling.", "ss": [], "src": "The wine trade", "lab": "Work practice"}], "ph": "Import-export"}, {"n": 13, "en": "OEM and ODM: working with factories on your own brand", "vi": "", "vocab": [{"id": "L6-0", "en": "OEM (original equipment manufacturer)", "vi": "a factory that makes a product to your design under your brand", "ex": "In an OEM project, the factory builds the robot to our design.", "vn": "sản xuất theo thiết kế của bên đặt hàng (OEM)"}, {"id": "L6-1", "en": "ODM (original design manufacturer)", "vi": "a factory that sells its own design under your brand", "ex": "With an ODM model, we use the factory's design and add our logo.", "vn": "dùng thiết kế sẵn của nhà máy (ODM)"}, {"id": "L6-2", "en": "private label", "vi": "a product made by one company and sold under another company's brand", "ex": "We want to sell the robot under a private label.", "vn": "nhãn riêng"}, {"id": "L6-3", "en": "white label", "vi": "a standard product that several companies can rebrand and sell", "ex": "A white label product is faster to launch but not exclusive.", "vn": "sản phẩm dán nhãn trắng"}, {"id": "L6-4", "en": "non-disclosure agreement (NDA)", "vi": "a contract that keeps shared information confidential", "ex": "Both sides must sign a non-disclosure agreement before we share the specification.", "vn": "thoả thuận bảo mật"}, {"id": "L6-5", "en": "intellectual property", "vi": "ideas, designs and software that legally belong to someone", "ex": "Who owns the intellectual property of the new design?", "vn": "quyền sở hữu trí tuệ"}, {"id": "L6-6", "en": "exclusivity", "vi": "the right to be the only buyer or seller of something", "ex": "Exclusivity in Australia would increase the price.", "vn": "độc quyền"}, {"id": "L6-7", "en": "tooling cost", "vi": "the cost of making the moulds and tools needed for production", "ex": "The factory charges a one-time tooling cost.", "vn": "chi phí khuôn"}, {"id": "L6-8", "en": "NRE (non-recurring engineering) cost", "vi": "a one-time fee for design and development work", "ex": "The NRE cost covers design changes and testing.", "vn": "chi phí phát triển một lần (NRE)"}, {"id": "L6-9", "en": "prototype", "vi": "a first model built to test a design", "ex": "The first prototype will be ready in eight weeks.", "vn": "mẫu thử"}, {"id": "L6-10", "en": "golden sample", "vi": "the approved sample that all production units must match", "ex": "We will keep a golden sample for quality checks.", "vn": "mẫu chuẩn"}, {"id": "L6-11", "en": "bill of materials (BOM)", "vi": "a full list of the parts and materials in a product", "ex": "Please share the bill of materials for the main components.", "vn": "danh mục vật tư (BOM)"}, {"id": "L6-12", "en": "tiered pricing", "vi": "prices that drop as the order quantity increases", "ex": "Please quote tiered pricing for 10, 50 and 100 units.", "vn": "giá theo bậc số lượng"}, {"id": "L6-13", "en": "ramp-up", "vi": "the period when production increases to full volume", "ex": "Ramp-up usually takes two to three months.", "vn": "giai đoạn tăng tốc sản xuất"}, {"id": "L6-14", "en": "factory audit", "vi": "an inspection of a factory's systems, quality and conditions", "ex": "We plan a factory audit before we sign.", "vn": "đánh giá nhà máy"}, {"id": "L6-15", "en": "rebrand", "vi": "change a product's name, logo or design to a new brand", "ex": "Can we rebrand the software interface as well?", "vn": "đổi thương hiệu"}, {"id": "L6-16", "en": "licensing fee", "vi": "a payment for the right to use someone else's technology or design", "ex": "Is there a licensing fee for the firmware?", "vn": "phí bản quyền"}, {"id": "L6-17", "en": "source code", "vi": "the original program code of software", "ex": "We need access to the source code to customize the app.", "vn": "mã nguồn"}, {"id": "L6-18", "en": "trademark", "vi": "a registered name or logo that only its owner can use", "ex": "We must check that the trademark is not already registered.", "vn": "nhãn hiệu"}, {"id": "L6-19", "en": "term sheet", "vi": "a short document listing the main terms before a full contract", "ex": "Let's agree on a term sheet before the lawyers draft the contract.", "vn": "bản điều khoản chính"}], "quiz": [{"s": "You want the factory's existing robot with your logo and software. Which model is this?", "o": ["ODM", "OEM to your own design", "Buying from a distributor"], "why": "ODM = the factory's design, sold under your brand."}, {"s": "Before sending your detailed specification to a new factory, you should…", "o": ["sign a non-disclosure agreement", "send it to every factory you can find", "post it online"], "why": "An NDA protects confidential information before you share it."}, {"s": "The factory quotes one price for any quantity. What do you ask?", "o": ["Could you quote tiered pricing for 10, 50 and 100 units?", "Why is it so expensive?", "Can you make it free?"], "why": "Tiered pricing shows how the unit price changes with volume and reveals the MOQ."}, {"s": "\"Golden sample\" means…", "o": ["the approved sample that mass production must match", "a sample made of gold", "the cheapest sample"], "why": "The golden sample is the reference for quality control."}, {"s": "You want to reduce the cost of tooling.", "o": ["Could the tooling cost be shared, or refunded after a certain volume?", "Tooling is too expensive, change it.", "We pay nothing for tooling."], "why": "Ask for a clear option: sharing the cost or a refund after a volume."}, {"s": "You want to keep your design after the project ends.", "o": ["Does the contract state that the intellectual property belongs to us?", "Is the design mine, I think?", "The design is just ideas, no problem."], "why": "Intellectual property rights must be stated in the contract."}], "speak": [{"s": "Open a first call with a factory", "l": ["We're planning an inspection robot for construction sites under our own brand.", "Do you work on an OEM or an ODM basis?", "Before we share our specification, we'd like to sign an NDA."]}, {"s": "Negotiate exclusivity and ownership", "l": ["We'd like exclusivity for the Australian market.", "We also need to own the software we develop and the data it collects.", "Can we put these points in a term sheet first?"]}], "email": "Subject: OEM/ODM inquiry – inspection robot\n\nDear Sales team,\n\nWe are developing an inspection robot for construction sites under [[our|we|ours]] own brand. We are interested in either an OEM or an ODM model.\n\nCould you please tell us your MOQ, your typical NRE and tooling costs, and whether you can offer [[exclusivity|exclusive|exclude]] in Australia?\n\nWe would be happy to sign a non-disclosure agreement before sharing our [[specification|specify|special]].\n\nWe look forward to [[hearing|hear|heard]] from you.\n\nBest regards,\nSally", "coach": [{"q": "What is the difference between OEM and ODM for your project?", "vi": "OEM và ODM khác nhau thế nào với dự án của bạn?", "st": "With OEM, + meaning; with ODM, + meaning.", "ph": ["our own design", "the factory's design", "faster and cheaper"], "sa": "With OEM, the factory builds our own design; with ODM, we use the factory's design under our brand, which is faster and cheaper but usually not exclusive.", "sc": "Your director asks which model we should choose.", "ss": [], "src": "OEM and ODM", "lab": "Work practice"}, {"q": "What do you need to protect before working with a factory?", "vi": "Bạn cần bảo vệ gì trước khi làm việc với nhà máy?", "st": "We need to protect + items, so we + action.", "ph": ["our specification", "the software we develop", "our trademark"], "sa": "We need to protect our specification, the software we develop and our trademark, so we start with an NDA and a trademark search.", "sc": "A lawyer asks what is most valuable in the project.", "ss": [], "src": "OEM and ODM", "lab": "Work practice"}, {"q": "Which costs should the factory quote?", "vi": "Nhà máy nên báo những chi phí nào?", "st": "Please quote + costs.", "ph": ["tiered unit prices", "tooling and NRE costs", "sample costs"], "sa": "Please quote tiered unit prices, one-time tooling and NRE costs, and the cost and lead time of samples.", "sc": "The factory asks what you need in their quotation.", "ss": [], "src": "OEM and ODM", "lab": "Work practice"}, {"q": "How will you choose the factory?", "vi": "Bạn sẽ chọn nhà máy như thế nào?", "st": "We will shortlist + and decide after + steps.", "ph": ["three to five factories", "a factory audit", "testing a prototype"], "sa": "We will shortlist three to five factories and decide after a factory audit and testing a prototype against our requirements.", "sc": "The founder asks how you will reduce the risk of choosing the wrong partner.", "ss": [], "src": "OEM and ODM", "lab": "Work practice"}], "ph": "Import-export"}, {"n": 16, "en": "Running the operation: owners, approvals and closing a shipment", "vi": "", "vocab": [{"id": "L9-0", "en": "RACI chart", "vi": "a table showing who is Responsible, Accountable, Consulted and Informed for each task", "ex": "Let's update the RACI chart for the robot project.", "vn": "bảng phân vai RACI"}, {"id": "L9-1", "en": "accountable", "vi": "having to take final responsibility for a result", "ex": "The founder is accountable for approving new suppliers.", "vn": "chịu trách nhiệm cuối cùng"}, {"id": "L9-2", "en": "owner", "vi": "the person responsible for completing a task", "ex": "Every task needs one owner and a deadline.", "vn": "người phụ trách"}, {"id": "L9-3", "en": "approval threshold", "vi": "the value above which a decision needs higher approval", "ex": "Orders above the approval threshold go to the founder.", "vn": "ngưỡng phê duyệt"}, {"id": "L9-4", "en": "checkpoint", "vi": "a point where work must be checked before it can continue", "ex": "QC is a checkpoint: no pass, no shipment.", "vn": "điểm kiểm soát"}, {"id": "L9-5", "en": "red flag", "vi": "a sign that something may be wrong", "ex": "A supplier who refuses to confirm in writing is a red flag.", "vn": "dấu hiệu cảnh báo"}, {"id": "L9-6", "en": "hand off", "vi": "pass work to another person or team", "ex": "Sales hands off the order to operations after the deposit.", "vn": "bàn giao"}, {"id": "L9-7", "en": "workflow", "vi": "the sequence of steps used to complete a job", "ex": "Our export workflow has nine steps.", "vn": "quy trình làm việc"}, {"id": "L9-8", "en": "standard operating procedure (SOP)", "vi": "written step-by-step instructions for a routine task", "ex": "We updated the standard operating procedure after the claim.", "vn": "quy trình chuẩn (SOP)"}, {"id": "L9-9", "en": "tracker", "vi": "a shared document used to follow the status of tasks or orders", "ex": "Please update the tracker before the weekly meeting.", "vn": "bảng theo dõi"}, {"id": "L9-10", "en": "status meeting", "vi": "a regular meeting to review progress", "ex": "In the status meeting, we only discuss blocked tasks.", "vn": "họp cập nhật tiến độ"}, {"id": "L9-11", "en": "blocked", "vi": "unable to continue because something is missing", "ex": "This shipment is blocked until the broker replies.", "vn": "bị kẹt"}, {"id": "L9-12", "en": "decision log", "vi": "a record of decisions, who made them and why", "ex": "Add the model choice to the decision log.", "vn": "nhật ký quyết định"}, {"id": "L9-13", "en": "margin", "vi": "the difference between cost and selling price", "ex": "The actual margin was lower than the quoted margin.", "vn": "biên lợi nhuận"}, {"id": "L9-14", "en": "cash flow forecast", "vi": "an estimate of money coming in and going out over the next weeks", "ex": "The cash flow forecast shows a gap in December.", "vn": "dự báo dòng tiền"}, {"id": "L9-15", "en": "accounts payable", "vi": "money a company owes to its suppliers", "ex": "Accounts payable increased after the deposit.", "vn": "công nợ phải trả"}, {"id": "L9-16", "en": "accounts receivable", "vi": "money that customers owe to a company", "ex": "Most of our accounts receivable are under 30 days.", "vn": "công nợ phải thu"}, {"id": "L9-17", "en": "post-shipment review", "vi": "a meeting after a shipment to review results and lessons", "ex": "We'll hold a post-shipment review next Monday.", "vn": "họp rút kinh nghiệm sau lô hàng"}, {"id": "L9-18", "en": "recurring issue", "vi": "a problem that happens again and again", "ex": "Late documents are a recurring issue with this forwarder.", "vn": "lỗi lặp lại"}, {"id": "L9-19", "en": "close out", "vi": "complete all final steps and records for a project or shipment", "ex": "We can close out the shipment once payment is received.", "vn": "đóng lô, kết thúc hồ sơ"}], "quiz": [{"s": "Who is \"accountable\" in a RACI chart?", "o": ["The one person who takes final responsibility for the result", "Everyone who is informed", "The person who only gives advice"], "why": "There should be exactly one accountable person for each task."}, {"s": "QC reports a fail, but the vessel leaves tomorrow. What does the checkpoint rule say?", "o": ["Do not ship; escalate to the founder and agree on a new plan.", "Ship anyway to keep the booking.", "Hide the QC report."], "why": "A checkpoint is a rule, not advice: no pass, no shipment."}, {"s": "What is the purpose of a post-shipment review?", "o": ["To compare actual results with the plan and fix recurring issues", "To blame the forwarder", "To book the next vessel"], "why": "Reviews turn problems into updated SOPs and checklists."}, {"s": "A task has no clear owner. What do you do?", "o": ["Assign one owner and a deadline in the tracker.", "Wait until someone does it.", "Ask everyone to do it together."], "why": "Every task needs one owner and a date."}, {"s": "\"Hand off\" means…", "o": ["pass a task to another person", "stop working", "shake hands"], "why": "A hand-off passes responsibility to someone else."}, {"s": "What is a decision log for?", "o": ["to record what was decided and by whom", "to track company cars", "to list customer addresses"], "why": "A decision log avoids repeated discussions and unclear decisions."}], "speak": [{"s": "Run a short status meeting", "l": ["Let's go through the blocked tasks first.", "The robot purchase is blocked until we receive the itemized quotation.", "Who will own the follow-up, and by when?"]}, {"s": "Close out a shipment", "l": ["All documents are filed and payment has been received, so we can close out this shipment.", "Our actual margin was two points lower than quoted because of extra freight.", "Let's add that to the SOP so it doesn't become a recurring issue."]}], "email": "Subject: Weekly status – robot project\n\nHi team,\n\nHere is this week's status [[update|updating|updated]].\n\n1. Quotation: still blocked. Sally will chase up the distributor [[by|until|in]] Thursday.\n2. Compliance: the broker has confirmed the HS code in [[writing|written|write]].\n3. Decision needed: the founder to approve the model choice, as it is above the approval [[threshold|limitation|border]].\n\nPlease update the tracker before Monday's meeting.\n\nBest regards,\nSally", "coach": [{"q": "How do you make sure tasks don't fall through the cracks?", "vi": "Làm sao để việc không bị bỏ sót?", "st": "Every task has + and + ; we + routine.", "ph": ["one owner", "a deadline", "a shared tracker"], "sa": "Every task has one owner and a deadline, and we follow everything in a shared tracker that we review in the weekly status meeting.", "sc": "A new team member asks how our team keeps work organized.", "ss": [], "src": "Running the operation", "lab": "Work practice"}, {"q": "Which decisions need the founder's approval?", "vi": "Quyết định nào cần sếp duyệt?", "st": "Anything + condition + goes to the founder, as well as + cases.", "ph": ["above the approval threshold", "new suppliers", "high-risk compliance cases"], "sa": "Anything above the approval threshold goes to the founder, as well as new suppliers and high-risk compliance cases such as lithium batteries.", "sc": "A colleague asks whether they can approve a new forwarder.", "ss": [], "src": "Running the operation", "lab": "Work practice"}, {"q": "What do you do when a task is blocked?", "vi": "Bạn làm gì khi một việc bị kẹt?", "st": "I + actions.", "ph": ["identify what is missing", "escalate early", "agree on a new deadline"], "sa": "I identify exactly what is missing, escalate early if needed and agree on a new deadline with the owner.", "sc": "In the status meeting, the quotation task is blocked for the second week.", "ss": [], "src": "Running the operation", "lab": "Work practice"}, {"q": "What do you learn from a post-shipment review?", "vi": "Bạn rút ra gì từ buổi họp sau lô hàng?", "st": "We compare + and update + .", "ph": ["the actual and quoted margin", "recurring issues", "the SOP"], "sa": "We compare the actual and quoted margin, list any recurring issues and update the SOP and checklists.", "sc": "The founder asks why the review meeting is worth the time.", "ss": [], "src": "Running the operation", "lab": "Work practice"}], "ph": "Import-export"}, {"n": 17, "en": "Construction investors 1: progress meetings and reports", "vi": "", "vocab": [{"id": "w8-0", "en": "progress report", "vi": "a report on how much work is done", "ex": "Here is this week's progress report.", "vn": "báo cáo tiến độ"}, {"id": "w8-1", "en": "milestone", "vi": "an important point in a project", "ex": "We reached the foundation milestone last week.", "vn": "mốc tiến độ"}, {"id": "w8-2", "en": "on schedule", "vi": "on time according to the plan", "ex": "The project is on schedule.", "vn": "đúng tiến độ"}, {"id": "w8-3", "en": "behind schedule", "vi": "later than planned", "ex": "The steel work is two weeks behind schedule.", "vn": "chậm tiến độ"}, {"id": "w8-4", "en": "contractor", "vi": "a company hired to do building work", "ex": "The main contractor will join the meeting.", "vn": "nhà thầu"}, {"id": "w8-5", "en": "site", "vi": "the place where the building work happens", "ex": "We will visit the site on Thursday.", "vn": "công trường"}, {"id": "w8-6", "en": "be caused by", "vi": "happen because of something", "ex": "The delay was caused by heavy rain.", "vn": "do ... gây ra"}, {"id": "w8-7", "en": "catch up", "vi": "work faster to make up lost time", "ex": "We plan to catch up by adding a night shift.", "vn": "bắt kịp, bù tiến độ"}, {"id": "w8-8", "en": "visibility", "vi": "being able to see where goods and orders are at any time", "ex": "Real-time visibility helps us warn customers early.", "vn": "khả năng theo dõi xuyên suốt"}, {"id": "w8-9", "en": "tracking", "vi": "following the location and status of a shipment", "ex": "Please send me the tracking link for this shipment.", "vn": "theo dõi lô hàng"}, {"id": "w8-10", "en": "bottleneck", "vi": "a point where work slows down and holds up the whole process", "ex": "Customs inspection is our biggest bottleneck.", "vn": "điểm nghẽn"}, {"id": "w8-11", "en": "inventory", "vi": "the goods and materials a company holds in stock", "ex": "We hold about two months of inventory.", "vn": "hàng tồn kho"}, {"id": "w8-12", "en": "safety stock", "vi": "extra stock kept to protect against delays or sudden demand", "ex": "Keep safety stock for the critical parts.", "vn": "tồn kho an toàn"}, {"id": "w8-13", "en": "stockout", "vi": "running out of an item so that orders cannot be filled", "ex": "The stockout cost us two key accounts.", "vn": "hết hàng"}, {"id": "w8-14", "en": "reorder point", "vi": "the stock level at which you place a new order", "ex": "The reorder point for this item is 500 units.", "vn": "điểm đặt hàng lại"}, {"id": "w8-15", "en": "SKU (stock keeping unit)", "vi": "a code for one specific product variant, such as one size or color", "ex": "Each color has its own SKU.", "vn": "mã hàng"}, {"id": "w8-16", "en": "warehouse", "vi": "a large building where goods are stored before they are sold or shipped", "ex": "The goods are now in our Binh Duong warehouse.", "vn": "kho hàng"}, {"id": "w8-17", "en": "on-time delivery", "vi": "delivering goods by the agreed date", "ex": "On-time delivery was 95 percent last quarter.", "vn": "giao hàng đúng hạn"}, {"id": "w8-18", "en": "status update", "vi": "a short report on where an order or task stands", "ex": "I'll send you a status update every Monday.", "vn": "cập nhật tình trạng"}, {"id": "w8-19", "en": "dashboard", "vi": "a screen that shows the key numbers and status in one place", "ex": "The shipment dashboard shows every ETA.", "vn": "bảng theo dõi tổng quan"}], "quiz": [{"s": "Report that the steel work is two weeks late.", "o": ["The steel work is two weeks behind schedule.", "The steel work is behind two weeks schedule.", "Steel is late schedule two week."], "why": "Use \"X weeks behind schedule\"."}, {"s": "The investor asks why the work is late. Which answer is best?", "o": ["The delay was caused by heavy rain, and we plan to catch up by adding a night shift.", "Rain. Not our problem.", "We don't know why."], "why": "Give the cause and the plan to fix it."}, {"s": "Report that the foundation milestone was reached.", "o": ["We reached the foundation milestone last week.", "We reach foundation milestone at last week.", "Foundation milestone is reached us last week."], "why": "Use the past simple with \"last week\"."}, {"s": "\"Milestone\" means…", "o": ["an important point in a project", "a stone beside the road", "a type of payment"], "why": "A milestone marks a key step in the schedule."}, {"s": "Stock is getting low. What do you report?", "o": ["We are near the reorder point, so we need to place an order this week.", "We have some stock, maybe enough.", "The warehouse is nearly empty, bad luck."], "why": "Mention the reorder point and a clear action."}, {"s": "\"Stockout\" means…", "o": ["no stock left to sell or use", "too much stock", "stock moved to another place"], "why": "A stockout stops work or sales."}], "speak": [{"s": "Give a progress update at the start of an investor meeting", "l": ["Let me start with a quick update on progress.", "Overall, the project is on schedule.", "The steel work is one week behind, and we plan to catch up by the end of the month."]}, {"s": "Explain a delay and the recovery plan", "l": ["The delay was caused by late delivery of materials.", "To catch up, we'll add a night shift.", "We expect to be back on schedule by 20 December."]}], "email": "Subject: Weekly progress report – Week 45\n\nDear Mr. Smith,\n\nPlease find this week's progress report attached. Overall, the project is [[on|in|at]] schedule.\n\nThe steel work is one week [[behind|late|after]] schedule due to late delivery of materials. To [[catch up|catch|catching up]], the contractor will add a night shift.\n\nWe expect to reach the next [[milestone|mile|milestones of]] on 20 December.\n\nBest regards,\nSally", "coach": [{"q": "Is the project on schedule?", "vi": "Dự án có đúng tiến độ không?", "st": "The work is + status, and the delay was caused by + reason.", "ph": ["behind schedule", "caused by", "catch up"], "ss": [], "sa": "The steel work is two weeks behind schedule. The delay was caused by the rain, and we plan to catch up by adding a second shift.", "src": "Progress meetings", "sc": "The investor opens the progress meeting with a direct question about the schedule.", "lab": "Work practice"}, {"q": "What was completed this month?", "vi": "Tháng này hoàn thành được những gì?", "st": "We reached + milestone, and the work is + status.", "ph": ["reached the foundation milestone", "the concrete work", "on schedule"], "ss": [], "sa": "We reached the foundation milestone this month, and the concrete work is on schedule.", "src": "Progress meetings", "sc": "You are presenting the monthly progress report to a client.", "lab": "Work practice"}, {"q": "Do we have enough materials on site?", "vi": "Tại công trình đã đủ vật liệu chưa?", "st": "We keep + stock, and we reorder when + condition.", "ph": ["safety stock", "reorder point", "a stockout"], "ss": [], "sa": "We keep a safety stock of cement, and we reorder when we reach the reorder point, so we avoid a stockout.", "src": "Progress meetings", "sc": "The investor is worried that missing materials will stop the work.", "lab": "Work practice"}, {"q": "How will you keep us informed?", "vi": "Bạn sẽ cập nhật cho chúng tôi thế nào?", "st": "We will send + report + and you can check + tool.", "ph": ["a progress report", "weekly status update", "the dashboard"], "ss": [], "sa": "We will send a progress report every Friday with a weekly status update, and you can also check the dashboard at any time.", "src": "Progress meetings", "sc": "The investor asks how often they will hear from the site team.", "lab": "Work practice"}], "ph": "Construction clients"}, {"n": 18, "en": "Construction investors 2: variations and extra costs", "vi": "", "vocab": [{"id": "w9-0", "en": "variation order", "vi": "an official change to the work in a contract", "ex": "We need a variation order before starting the extra work.", "vn": "lệnh thay đổi, phát sinh"}, {"id": "w9-1", "en": "scope of work", "vi": "the work included in the contract", "ex": "This item is outside the original scope of work.", "vn": "phạm vi công việc"}, {"id": "w9-2", "en": "additional cost", "vi": "cost on top of the agreed price", "ex": "The additional cost is estimated at USD 8,000.", "vn": "chi phí phát sinh"}, {"id": "w9-3", "en": "impact", "vi": "have an effect on", "ex": "The change will impact the schedule by one week.", "vn": "ảnh hưởng (đến)"}, {"id": "w9-4", "en": "written approval", "vi": "agreement given in writing", "ex": "We need your written approval to proceed.", "vn": "phê duyệt bằng văn bản"}, {"id": "w9-5", "en": "revised drawing", "vi": "a drawing that has been changed", "ex": "We received the revised drawing yesterday.", "vn": "bản vẽ sửa đổi"}, {"id": "w9-6", "en": "estimate", "vi": "a calculation of the likely cost", "ex": "This is a preliminary estimate.", "vn": "ước tính"}, {"id": "w9-7", "en": "proceed", "vi": "start or continue doing something", "ex": "Please confirm so we can proceed.", "vn": "tiến hành"}, {"id": "w9-8", "en": "disruption", "vi": "an event that stops or seriously slows the supply chain", "ex": "The port strike caused a major disruption.", "vn": "sự gián đoạn"}, {"id": "w9-9", "en": "resilience", "vi": "the ability of a supply chain to recover quickly from problems", "ex": "Dual sourcing improves our resilience.", "vn": "khả năng chống chịu và phục hồi"}, {"id": "w9-10", "en": "risk assessment", "vi": "a review of what could go wrong and how serious it would be", "ex": "We run a risk assessment for every new market.", "vn": "đánh giá rủi ro"}, {"id": "w9-11", "en": "contingency plan", "vi": "a plan for what to do if something goes wrong", "ex": "Our contingency plan uses a second port.", "vn": "kế hoạch dự phòng"}, {"id": "w9-12", "en": "backup supplier", "vi": "a second supplier you can use if the main one fails", "ex": "We approved a backup supplier in Thailand.", "vn": "nhà cung cấp dự phòng"}, {"id": "w9-13", "en": "single point of failure", "vi": "one part whose failure stops the whole system", "ex": "That one machine is a single point of failure.", "vn": "điểm gãy duy nhất"}, {"id": "w9-14", "en": "force majeure", "vi": "events outside anyone's control, such as war or natural disasters, that can excuse a delay", "ex": "The supplier declared force majeure after the flood.", "vn": "bất khả kháng"}, {"id": "w9-15", "en": "business continuity", "vi": "keeping key operations running during a crisis", "ex": "ISO 22301 covers business continuity.", "vn": "duy trì hoạt động liên tục"}, {"id": "w9-16", "en": "just in time", "vi": "receiving goods only when they are needed, to keep stock low", "ex": "Just in time works only when suppliers are reliable.", "vn": "đúng lúc (JIT), tồn kho tối thiểu"}, {"id": "w9-17", "en": "just in case", "vi": "holding extra stock to protect against risk", "ex": "After the crisis we moved to a just in case approach.", "vn": "tồn kho dự phòng"}, {"id": "w9-18", "en": "cost overrun", "vi": "spending more than the planned budget", "ex": "The cost overrun came from extra air freight.", "vn": "vượt chi phí"}, {"id": "w9-19", "en": "mitigate", "vi": "make a risk or problem less serious", "ex": "We can mitigate the risk with a second route.", "vn": "giảm thiểu"}], "quiz": [{"s": "The investor asks for extra work that is not in the contract.", "o": ["This item is outside the original scope, so we'll need a variation order.", "Okay, we'll do it for free.", "No, we can't do anything extra."], "why": "Say it is outside the scope and suggest the variation process."}, {"s": "Say the change will delay the schedule by one week.", "o": ["The change will impact the schedule by one week.", "The change will impact to schedule one week.", "Change makes schedule one week impact."], "why": "\"impact\" takes a direct object, so no \"to\"."}, {"s": "Ask for written approval before starting.", "o": ["We need your written approval before we proceed.", "Write approval us please before.", "You approve then we maybe proceed."], "why": "Clear wording protects both sides."}, {"s": "What is a \"variation order\"?", "o": ["a written instruction that changes the work and the price", "a delivery note", "a weather report"], "why": "A variation order records changes to the original scope."}, {"s": "The client asks for extra work. What do you ask for first?", "o": ["Could you give us a written instruction so that we can estimate the additional cost?", "We will do it, don't worry about the cost.", "We can't do anything extra."], "why": "Get the request in writing before you price it."}, {"s": "\"Contingency plan\" means…", "o": ["a plan for what to do if something goes wrong", "a plan for the next holiday", "a plan to sell more"], "why": "A contingency plan prepares you for a problem."}], "speak": [{"s": "Explain a variation to the investor", "l": ["Based on the revised drawing, the scope of work has changed.", "The additional cost is estimated at USD 8,000.", "The change will impact the schedule by about one week."]}, {"s": "Ask for approval to proceed", "l": ["We've prepared a variation order for your review.", "We need your written approval before we proceed.", "Could you confirm by Friday?"]}], "email": "Subject: Variation order – additional canopy\n\nDear Mr. Smith,\n\nFollowing the revised drawing, the new canopy is outside the original [[scope|scoop|scopes]] of work.\n\nThe additional cost is [[estimated|estimate|estimating]] at USD 8,000, and the change will [[impact|impact on to|impacts to]] the schedule by about one week.\n\nPlease find the variation order attached. We need your written [[approval|approve|approving]] before we proceed.\n\nBest regards,\nSally", "coach": [{"q": "Can you add this extra work?", "vi": "Bạn có thể làm thêm hạng mục này không?", "st": "This item is + status, so we need + document.", "ph": ["outside the original scope", "a variation order", "written approval"], "ss": [], "sa": "This item is outside the original scope, so we need a variation order and your written approval before we proceed.", "src": "Variations and extra costs", "sc": "The investor asks you in a meeting to add a new room to the plan.", "lab": "Work practice"}, {"q": "How much will the change cost?", "vi": "Thay đổi này sẽ tốn bao nhiêu?", "st": "I'll send + estimate + of + cost and impact.", "ph": ["additional cost", "an estimate", "the impact on the schedule"], "ss": [], "sa": "I'll send an estimate of the additional cost and the impact on the schedule by Wednesday.", "src": "Variations and extra costs", "sc": "The investor wants a price before agreeing to a change.", "lab": "Work practice"}, {"q": "What if the supplier cannot deliver?", "vi": "Nếu nhà cung cấp không giao được thì sao?", "st": "We have + plan, based on + analysis.", "ph": ["a backup supplier", "a contingency plan", "risk assessment"], "ss": [], "sa": "We have a backup supplier and a contingency plan, based on our risk assessment, so one delay will not stop the work.", "src": "Variations and extra costs", "sc": "The investor asks how you handle a supply problem.", "lab": "Work practice"}, {"q": "Why has the cost increased?", "vi": "Vì sao chi phí tăng?", "st": "The cost overrun comes from + reason.", "ph": ["cost overrun", "the revised drawing", "two weeks"], "ss": [], "sa": "The cost overrun comes from the revised drawing, which added two weeks of extra work.", "src": "Variations and extra costs", "sc": "The investor sees a higher figure in the budget report and asks you to explain it.", "lab": "Work practice"}], "ph": "Construction clients"}, {"n": 19, "en": "Construction investors 3: handover, payment, defects", "vi": "", "vocab": [{"id": "w10-0", "en": "handover", "vi": "giving the finished work to the owner", "ex": "The handover is planned for 15 January.", "vn": "bàn giao"}, {"id": "w10-1", "en": "inspection", "vi": "a check to see if work is done correctly", "ex": "The final inspection is on Monday.", "vn": "kiểm tra, nghiệm thu"}, {"id": "w10-2", "en": "defect", "vi": "a fault or problem in the work", "ex": "We found three minor defects.", "vn": "lỗi, khuyết tật"}, {"id": "w10-3", "en": "punch list", "vi": "a list of small faults to fix before handover", "ex": "Please see the punch list attached.", "vn": "danh sách lỗi cần sửa"}, {"id": "w10-4", "en": "invoice", "vi": "a bill asking for payment", "ex": "We have issued the invoice for the second payment.", "vn": "hoá đơn"}, {"id": "w10-5", "en": "overdue", "vi": "not paid by the due date", "ex": "The payment is now 15 days overdue.", "vn": "quá hạn"}, {"id": "w10-6", "en": "retention", "vi": "money held back until the warranty ends", "ex": "The 5% retention will be released after the warranty period.", "vn": "tiền giữ lại bảo hành"}, {"id": "w10-7", "en": "settle", "vi": "pay a bill", "ex": "Could you settle the invoice by the end of the month?", "vn": "thanh toán (hoá đơn)"}, {"id": "w10-8", "en": "customs declaration", "vi": "the official form that lists goods for import or export", "ex": "The customs declaration must match the invoice.", "vn": "tờ khai hải quan"}, {"id": "w10-9", "en": "HS code", "vi": "the international number used to classify goods for customs and duty", "ex": "Please confirm the HS code for this product.", "vn": "mã HS"}, {"id": "w10-10", "en": "compliance", "vi": "following the laws, rules and standards that apply", "ex": "Compliance checks take two days.", "vn": "tuân thủ"}, {"id": "w10-11", "en": "exchange rate", "vi": "the value of one currency compared with another", "ex": "The exchange rate moved three percent this month.", "vn": "tỷ giá"}, {"id": "w10-12", "en": "currency risk", "vi": "the risk of losing money when exchange rates change", "ex": "Paying in US dollars reduces our currency risk.", "vn": "rủi ro tỷ giá"}, {"id": "w10-13", "en": "advance payment", "vi": "paying part or all of the price before the goods are shipped", "ex": "The supplier wants a 30 percent advance payment.", "vn": "thanh toán trước"}, {"id": "w10-14", "en": "balance payment", "vi": "the remaining amount paid after the deposit", "ex": "The balance payment is due before shipment.", "vn": "thanh toán phần còn lại"}, {"id": "w10-15", "en": "credit note", "vi": "a document that reduces the amount a buyer owes, often after a claim", "ex": "We will issue a credit note for the shortage.", "vn": "giấy ghi giảm công nợ (credit note)"}, {"id": "w10-16", "en": "debit note", "vi": "a document that asks the other side to pay an extra amount", "ex": "We sent a debit note for the extra freight.", "vn": "giấy đề nghị thanh toán thêm (debit note)"}, {"id": "w10-17", "en": "demurrage", "vi": "a fee charged when a container stays in the port longer than the free time", "ex": "Late documents caused three days of demurrage.", "vn": "phí lưu container tại cảng"}, {"id": "w10-18", "en": "detention", "vi": "a fee for keeping a carrier's container outside the port for too long", "ex": "Return the empty container quickly to avoid detention.", "vn": "phí lưu container ngoài cảng"}, {"id": "w10-19", "en": "free time", "vi": "the number of days you can keep a container without paying extra fees", "ex": "We negotiated 14 days of free time.", "vn": "thời gian miễn phí lưu container"}], "quiz": [{"s": "Remind a client politely that a payment is 15 days late.", "o": ["Our records show that invoice 112 is now 15 days overdue.", "You didn't pay! Pay now.", "Why so slow paying?"], "why": "State the facts and don't blame anyone."}, {"s": "Send the list of faults after the inspection.", "o": ["Please see the punch list attached. We'll fix all items by Friday.", "There are some problems, maybe.", "Defects list attach, see."], "why": "Add a clear date for the fixes."}, {"s": "Ask when the retention money will be paid.", "o": ["Could you confirm when the 5% retention will be released?", "When you give back retention money?", "Retention release when?"], "why": "\"Could you confirm...\" is polite and uses the right term."}, {"s": "Which term is the part of a payment kept until defects are fixed?", "o": ["Retention", "Advance payment", "Credit note"], "why": "Retention protects the client until the work is complete."}, {"s": "What is a \"credit note\"?", "o": ["a document that reduces the amount the buyer owes", "a loan from a bank", "a thank-you letter"], "why": "A credit note corrects or reduces an invoice."}, {"s": "You want the client to accept the building.", "o": ["Could you please sign the handover certificate once you are satisfied with the inspection?", "Sign here and don't read.", "We want to finish, please sign it."], "why": "Link the signature to the client's satisfaction with the inspection."}], "speak": [{"s": "Lead the final inspection", "l": ["Thank you all for joining the final inspection.", "We found three minor defects, listed on the punch list.", "We'll fix all items by Friday, before the handover."]}, {"s": "Call a client about an overdue payment", "l": ["I'm calling about invoice 112.", "Our records show it is now 15 days overdue.", "Could you let me know when we can expect payment?"]}], "email": "Subject: Payment reminder – Invoice 112\n\nDear Mr. Smith,\n\nI hope you are well. Our records show that invoice 112 is now 15 days [[overdue|overdo|over due date]].\n\nCould you please [[settle|settled|settling]] the invoice by 30 January? I have attached a copy for your reference.\n\nWe have also attached the updated punch list. All [[defects|defect|defected]] will be fixed before the [[handover|hand over to|handing]].\n\nBest regards,\nSally", "coach": [{"q": "When can we take over the building?", "vi": "Khi nào chúng tôi có thể nhận bàn giao công trình?", "st": "After + step, we will fix + list, and then + handover.", "ph": ["the inspection", "the punch list", "handover"], "ss": [], "sa": "After the inspection we will fix the items on the punch list, and then the handover can take place next Friday.", "src": "Handover and payment", "sc": "The investor asks for a date to move in.", "lab": "Work practice"}, {"q": "Why has the invoice not been paid?", "vi": "Vì sao hoá đơn chưa được thanh toán?", "st": "The invoice is + status; we can release + amount after + condition.", "ph": ["15 days overdue", "the retention", "the balance"], "ss": [], "sa": "Invoice 112 is now 15 days overdue. We can release the retention after the defects are fixed, but the balance is due now.", "src": "Handover and payment", "sc": "You call the client's finance team about a late payment.", "lab": "Work practice"}, {"q": "Can we pay in another currency?", "vi": "Chúng tôi có thể thanh toán bằng đồng tiền khác không?", "st": "We can accept + currency, if + condition.", "ph": ["exchange rate", "currency risk", "advance payment"], "ss": [], "sa": "We can accept another currency, if you agree on the exchange rate. To limit the currency risk, we ask for an advance payment.", "src": "Handover and payment", "sc": "The client's head office prefers to pay in a different currency.", "lab": "Work practice"}, {"q": "What if the goods stay at the port?", "vi": "Nếu hàng nằm lại cảng thì sao?", "st": "After + time, the port charges + fees.", "ph": ["demurrage", "free time", "detention"], "ss": [], "sa": "After the free time ends, the port charges demurrage and detention, so please collect the container within five days.", "src": "Handover and payment", "sc": "The investor's container is waiting at the port for customs clearance.", "lab": "Work practice"}], "ph": "Construction clients"}, {"n": 20, "en": "Leading meetings: chairing, interrupting, closing", "vi": "", "vocab": [{"id": "w11-0", "en": "kick off", "vi": "start", "ex": "Let's kick off with a quick update.", "vn": "bắt đầu"}, {"id": "w11-1", "en": "interrupt", "vi": "stop someone while they are speaking", "ex": "Sorry to interrupt, but we're running out of time.", "vn": "ngắt lời"}, {"id": "w11-2", "en": "get back on track", "vi": "return to the main topic", "ex": "Let's get back on track.", "vn": "quay lại đúng chủ đề"}, {"id": "w11-3", "en": "take the floor", "vi": "speak to the group in a meeting", "ex": "Linh, would you like to take the floor?", "vn": "phát biểu"}, {"id": "w11-4", "en": "summarize", "vi": "give the main points briefly", "ex": "Let me summarize the key points.", "vn": "tóm tắt"}, {"id": "w11-5", "en": "deadline", "vi": "the latest time to finish something", "ex": "What's a realistic deadline for this?", "vn": "hạn chót"}, {"id": "w11-6", "en": "consensus", "vi": "general agreement", "ex": "It seems we have a consensus.", "vn": "sự đồng thuận"}, {"id": "w11-7", "en": "wrap up", "vi": "finish", "ex": "Let's wrap up here.", "vn": "kết thúc"}, {"id": "w11-8", "en": "3PL (third-party logistics)", "vi": "a company that handles transport, warehousing and other logistics for you", "ex": "We use a 3PL for our online orders.", "vn": "nhà cung cấp dịch vụ logistics bên thứ ba"}, {"id": "w11-9", "en": "4PL (fourth-party logistics)", "vi": "a provider that manages several 3PLs and the overall logistics strategy", "ex": "A 4PL could manage all our regional providers.", "vn": "logistics bên thứ tư"}, {"id": "w11-10", "en": "end-to-end", "vi": "covering every step from start to finish", "ex": "We need end-to-end visibility of each order.", "vn": "xuyên suốt từ đầu đến cuối"}, {"id": "w11-11", "en": "digitalization", "vi": "moving paper-based work to digital tools", "ex": "Digitalization cut our document errors by half.", "vn": "số hoá"}, {"id": "w11-12", "en": "lean", "vi": "a way of working that removes waste and unnecessary steps", "ex": "Lean methods reduced walking time in the warehouse.", "vn": "tinh gọn"}, {"id": "w11-13", "en": "sustainability", "vi": "reducing harm to the environment over the long term", "ex": "Customers ask about sustainability in every tender.", "vn": "tính bền vững"}, {"id": "w11-14", "en": "carbon footprint", "vi": "the amount of greenhouse gas an activity produces", "ex": "Sea freight has a smaller carbon footprint than air freight.", "vn": "lượng phát thải carbon"}, {"id": "w11-15", "en": "lessons learned", "vi": "what a team has found out from a project so it can do better next time", "ex": "Let's list the lessons learned from this shipment.", "vn": "bài học rút ra"}, {"id": "w11-16", "en": "best practice", "vi": "the way of working that is known to give the best results", "ex": "Keeping all documents in one folder is best practice.", "vn": "cách làm tốt nhất"}, {"id": "w11-17", "en": "benchmark", "vi": "a standard used to compare performance", "ex": "Our benchmark is 98 percent on-time delivery.", "vn": "chuẩn so sánh"}, {"id": "w11-18", "en": "escalate", "vi": "pass a problem to a more senior person to solve", "ex": "If the vendor doesn't reply, escalate it to their manager.", "vn": "chuyển lên cấp trên xử lý"}, {"id": "w11-19", "en": "action plan", "vi": "a list of steps, owners and deadlines to reach a goal", "ex": "Let's agree on an action plan before we close.", "vn": "kế hoạch hành động"}], "quiz": [{"s": "Someone has been talking too long and is off topic.", "o": ["Sorry to interrupt, but let's get back on track.", "Stop talking, please.", "You talk too much."], "why": "Say sorry before you interrupt, then bring the meeting back to the topic."}, {"s": "Invite someone to speak.", "o": ["Linh, would you like to take the floor?", "Linh, your turn talk.", "Linh, speak now."], "why": "A polite invitation from the person chairing."}, {"s": "Close the meeting with action items.", "o": ["Let's wrap up. To summarize, Minh will send the report by Friday.", "Meeting finish, bye.", "Okay that's all, go."], "why": "Summarize with an owner and a deadline."}, {"s": "You want everyone's agreement before moving on.", "o": ["Do we have consensus on this point?", "Everybody agree or no?", "I decide, so we finish."], "why": "\"Consensus\" means general agreement in the group."}, {"s": "\"Lessons learned\" are…", "o": ["what a team learns from a project for the future", "homework for a school", "mistakes to hide"], "why": "A lessons-learned review helps the team improve."}, {"s": "You start the meeting.", "o": ["Let's kick off. The first item on the agenda is the schedule.", "Okay, we start, please be quiet.", "Hello, who is the boss here?"], "why": "\"Kick off\" is a natural way to start a meeting."}], "speak": [{"s": "Open and run a meeting", "l": ["Let's kick off with a quick round of updates.", "Linh, would you like to take the floor?", "Sorry to interrupt, but let's get back on track."]}, {"s": "Close a meeting", "l": ["Let me summarize the key points.", "Minh will send the report by Friday, and I'll update the client.", "Let's wrap up here. Thanks, everyone."]}], "email": "Subject: Action items from today's meeting\n\nHi all,\n\nThanks for a productive meeting. To [[summarize|summary|summarizing]]:\n\n- Minh will send the sales report by Friday.\n- Linh will confirm the new [[deadline|dead line|deadlines of]] with the supplier.\n\nIt seems we have a [[consensus|consent|consensual]] on the new pricing. Let's [[kick off|kick|kicking off]] the next meeting with a quick update on these items.\n\nBest,\nSally", "coach": [{"q": "How do you start a meeting?", "vi": "Bạn bắt đầu cuộc họp thế nào?", "st": "Let's + start, the agenda has + number items.", "ph": ["kick off", "the agenda", "take the floor"], "ss": [], "sa": "Let's kick off. The agenda has three items, and each person will take the floor for five minutes.", "src": "Leading meetings", "sc": "You are chairing a meeting with six people from different departments.", "lab": "Work practice"}, {"q": "What do you do if the discussion goes off topic?", "vi": "Bạn làm gì khi cuộc thảo luận lạc đề?", "st": "Sorry to + action, but let's + action.", "ph": ["interrupt", "get back on track", "the next item"], "ss": [], "sa": "Sorry to interrupt, but let's get back on track and move to the next item.", "src": "Leading meetings", "sc": "A participant has been talking about a different subject for five minutes.", "lab": "Work practice"}, {"q": "How do you end a meeting?", "vi": "Bạn kết thúc cuộc họp thế nào?", "st": "Let's wrap up. To + action, here is + document.", "ph": ["wrap up", "summarize", "the action plan"], "ss": [], "sa": "Let's wrap up. To summarize, here is the action plan with the owners and the deadlines.", "src": "Leading meetings", "sc": "The time is almost over and several topics are still open.", "lab": "Work practice"}, {"q": "What did the team learn from the project?", "vi": "Nhóm đã học được gì từ dự án?", "st": "The main lessons are to + action and to + action.", "ph": ["lessons learned", "best practice", "benchmark"], "ss": [], "sa": "The main lessons learned are to share best practice early and to use a benchmark for every new supplier.", "src": "Leading meetings", "sc": "Your manager asks for a short review after a project closes.", "lab": "Work practice"}], "ph": "Leading meetings"}, {"n": 27, "en": "Final review: mixed practice from all topics", "vi": "", "mix": true, "ph": "Final review"}], "audio": {"agenda": [1, "dafd501364a8"], "Let's go through the agenda first.": [1, "88db8197bd75"], "chair a meeting": [1, "9fc175fdee7f"], "I'll chair today's meeting.": [1, "7894ae2e9398"], "be in charge of": [1, "e595cdeb7a93"], "I'm in charge of key accounts in the South.": [1, "1f05db2c9c2d"], "be responsible for": [1, "32a72d88360a"], "I'm responsible for order processing and reporting.": [1, "8e2c50812897"], "minutes": [1, "be2e2bb698c7"], "Could you take the minutes today?": [1, "8bf24d8120a7"], "action item": [1, "e01278ee2141"], "Let's recap the action items.": [1, "c9ed45b85454"], "follow up": [1, "af153c298286"], "I'll follow up with the supplier tomorrow.": [1, "8629d9192339"], "clarify": [1, "ef8fe782bf94"], "Could you clarify the delivery date?": [1, "7cdcce5b7a78"], "What does your company do?": [1, "8a66f3ddf7ea"], "We provide furniture export solutions, innovative products, and long-term business partnerships for international customers.": [1, "d05b50854676"], "export solutions": [1, "78428f340f9d"], "innovative products": [1, "6b31e7961019"], "business partnerships": [1, "5cbabbe97d56"], "What is new about this product?": [1, "6768fe0ab5fc"], "This product offers advanced features, a unique design, and improved quality for today's market needs.": [1, "5a5ffe8d5502"], "advanced features": [1, "a22cd23308b9"], "unique design": [1, "f0bf764bfa5e"], "improved quality": [1, "02de6be868aa"], "Where are your products made?": [1, "aa5586ec93d2"], "Our products are made in Vietnam by skilled workers and produced with strict quality standards.": [1, "67fcf468ea22"], "in Vietnam": [1, "8b40ed08707a"], "by skilled workers": [1, "4763c94ad0af"], "with strict standards": [1, "21149665e20a"], "What kind of business are you in?": [1, "d1d65d06eda6"], "We specialize in international trade, product development, and export services for furniture and home decor products.": [1, "039d87cc8e91"], "international trade": [1, "5f68958649a9"], "product development": [1, "cf3625824500"], "export services": [1, "faa0f5aedd87"], "Can I have your catalog?": [1, "e0a3c9d3b69f"], "Yes, of course. I can give you our product catalog, a digital brochure, and printed materials for reference.": [1, "825137cc4e4a"], "our product catalog": [1, "8e65d3870c84"], "a digital brochure": [1, "b79a5da03fb0"], "printed materials": [1, "2372e0e5f0e4"], "Hi, I'm Sally. I've worked in sales administration and account management for about nine years.": [1, "6bb4927044ba"], "I'm in charge of order processing, reporting and key accounts.": [1, "9d33f8ee6e06"], "I'm looking forward to working with you.": [1, "ef5230dd319e"], "Thanks for joining. Let's go through the agenda first.": [1, "0ea9d82e0242"], "To recap, we have three action items.": [1, "dd88515250d3"], "I'll send the minutes by the end of today.": [1, "cbc508027b17"], "headquarters": [2, "66fe0da68037"], "Our headquarters is in Ho Chi Minh City.": [2, "77f64ca1c975"], "subsidiary": [2, "41409707103f"], "We have a subsidiary in Hanoi.": [2, "974638e1a2e3"], "core business": [2, "70b2c0712a8d"], "Our core business is importing and distributing industrial goods.": [2, "fd1ee1322122"], "report to": [2, "d3dd0b436c2e"], "I report directly to the sales director.": [2, "65f6b05e0bf2"], "oversee": [2, "8b1f974224c1"], "I oversee a team of five coordinators.": [2, "bcf3674429fc"], "key account": [2, "fb856b674eb7"], "We handle about twenty key accounts.": [2, "3fa72e93116f"], "market share": [2, "dfe33457bc3d"], "We aim to grow our market share in the South.": [2, "2db126fd273f"], "track record": [2, "fdfc5f11104a"], "We have a strong track record with Japanese clients.": [2, "a4340370d92b"], "Which department are you in?": [2, "28bc3586892d"], "I'm in the sales department.": [2, "0baa840dd770"], "the finance": [2, "5c96960dce0e"], "the marketing": [2, "74aa0b031cf2"], "the sales": [2, "684a69cb1517"], "I work in the account management team, which supports customers and internal coordination.": [2, "8f705056e705"], "My department focuses on client communication, order follow-up, and smooth daily operations.": [2, "809bf504981f"], "What does your department mainly do?": [2, "4fdb6343a240"], "We mainly support customers, manage orders, and coordinate with internal teams.": [2, "110ff2091596"], "sell products": [2, "e349be8f75ad"], "create products": [2, "a9237507b0ff"], "manage the company's money": [2, "40a46a21d3f2"], "We mainly support customers, follow up on orders, and coordinate with internal teams to keep everything on track.": [2, "7e98b8932438"], "In my department, we handle communication with clients and make sure the order process runs smoothly.": [2, "162e9565eb31"], "We also work closely with production and logistics when customers need updates or changes.": [2, "e4adce915b6f"], "What is the most exciting part of your job?": [2, "06d30d8ba688"], "I find dealing with customers the most exciting part of my job.": [2, "8a44c123e99e"], "dealing with the customers": [2, "3995bf893c6e"], "brainstorming ideas": [2, "0a5fda97300b"], "business trips": [2, "f1b7399eada4"], "I also enjoy brainstorming ideas with the team when we need to solve a customer problem or improve a process.": [2, "cb438f7fe698"], "Sometimes business trips are exciting too because they help me understand customers better in real situations.": [2, "8770b9f2bc82"], "What is your least favorite part of the job?": [2, "84c6a33295f6"], "I don't like too much paperwork or repetitive tasks, but I underst
