and they are part of the job.": [2, "7d6c94e3953a"], "the paperwork": [2, "a5563488ce0d"], "the low salary": [2, "7e40a33b6f51"], "the repetitive tasks": [2, "7e87a9031ce5"], "I don't like too much paperwork because it takes time away from customer work.": [2, "78a34e67dac0"], "I also find repetitive tasks a little less exciting, but I know they are still necessary for smooth operations.": [2, "f7065dd935c2"], "Even so, I always try to stay organized and complete those tasks carefully.": [2, "077e86bfbe24"], "What is your factory's capacity?": [2, "78a546e275ee"], "We can produce large monthly volumes, customized bulk orders, and high-demand products with a stable production schedule.": [2, "71cb1ed31cc3"], "large monthly volumes": [2, "2a2ca07e70c7"], "customized bulk orders": [2, "a383f7a24255"], "high-demand products": [2, "21e8a11222f5"], "We can produce large monthly volumes for furniture, pottery, and home decor collections.": [2, "a074a8bb1f72"], "Our factory is also able to handle customized bulk orders based on customer specifications and seasonal requirements.": [2, "7e7f4f71709c"], "We are experienced in producing high-demand products while maintaining stable lead times and consistent finishing quality.": [2, "8097e7bac3f5"], "How do you ensure quality control?": [2, "b34ab4d53098"], "We use strict inspection processes, advanced testing equipment, and trained quality staff for quality control.": [2, "4670accdf575"], "strict inspection processes": [2, "e7a4dcd3dd7f"], "advanced testing equipment": [2, "d5880b4b0367"], "trained quality staff": [2, "7f5b6a72bd22"], "We use strict inspection processes at every stage of production to maintain consistent quality.": [2, "99d9f9eabe89"], "We also rely on advanced testing equipment to check materials, finishing, and product performance where needed.": [2, "67f7a400d906"], "In addition, we have trained quality staff who monitor production and final inspection before shipment.": [2, "575953d64cfd"], "What quality certificates do you have?": [2, "92fc3ab2684b"], "We hold ISO 9001 certification, and depending on the market, we can also provide CE certification or FDA-related compliance support.": [2, "fb9c2f1a82e7"], "ISO 9001": [2, "cdb7083c0b44"], "CE certification": [2, "4549d1393a50"], "FDA approval": [2, "8b048da6589c"], "We hold ISO 9001 certification to support our quality management system.": [2, "f7837243a82d"], "For products and markets where it is relevant, we can also provide CE certification or FDA-related compliance documents.": [2, "388798aa0041"], "The exact certificates depend on the product category and the destination market.": [2, "7972406c47db"], "Who are your current major clients?": [2, "a416d3a1cf4f"], "Our clients include leading retailers, international distributors, and well-known brands.": [2, "128f2807e24c"], "leading retailers": [2, "a7ef6e731ac5"], "international distributors": [2, "f48c205cf153"], "well-known brands": [2, "2abe44d558fb"], "Our clients include leading retailers, international distributors, and well-known brands in the furniture and home decor sector.": [2, "1de1b259c925"], "We work with customers in different markets, including buyers who require both standard production and customized development.": [2, "f7377ec94366"], "Many of our clients value our ability to combine product design, production coordination, and logistics support.": [2, "88d45c7e92a9"], "Why are you a reliable partner?": [2, "d9c305ae96cb"], "We offer consistent delivery times, transparent communication, and flexible solutions to our clients.": [2, "1791bd6038f4"], "consistent delivery times": [2, "360d24e3a41f"], "transparent communication": [2, "13185c382d94"], "flexible solutions": [2, "535a1c7f460b"], "We offer consistent delivery times to clients by planning production carefully and following up closely with each order.": [2, "d598f5819d3d"], "We also maintain transparent communication, so customers are updated clearly about progress, issues, and next steps.": [2, "932ded45582a"], "In addition, we provide flexible solutions when customers need adjustments in design, quantity, or delivery arrangements.": [2, "8a272a3c2f36"], "What specific services do you provide to these clients?": [2, "731caf3c747e"], "We provide them with product design, logistics support, and marketing support.": [2, "f4b422a39eca"], "product design": [2, "f322f7af7b23"], "logistics support": [2, "3b7d10b98e0a"], "marketing support": [2, "7a8eae2098c6"], "We provide them with product design support to help develop collections that match their market needs.": [2, "98b8c1dfc16b"], "We also provide logistics support, including shipment coordination, document follow-up, and delivery updates.": [2, "9a711828da7b"], "For some customers, we provide marketing support such as catalogs, product photos, and display suggestions.": [2, "5e560717f0f1"], "Our company specializes in importing and distributing industrial goods.": [2, "96472723c9d4"], "Our headquarters is in Ho Chi Minh City, and we serve clients across Vietnam.": [2, "ce93655acc42"], "We have a strong track record with international partners.": [2, "0da0c8c40b57"], "I oversee order processing and a team of coordinators.": [2, "7f84e036f34e"], "My main focus this year is growing our key accounts.": [2, "8f98435d7c2c"], "inquiry": [3, "5e6c0650d4f9"], "Thank you for your inquiry about our products.": [3, "ca5ea3134cca"], "quotation": [3, "f6257b67b512"], "Please find our quotation attached.": [3, "5e584829a9df"], "valid until": [3, "49b30c577ebe"], "This price is valid until 30/11/2026.": [3, "740542b34d00"], "unit price": [3, "7606a69d90bf"], "The unit price is USD 12.50.": [3, "02efd5eb4bab"], "follow up on": [3, "0e2c00134806"], "I'm following up on my email from last week.": [3, "a046d70b30d0"], "at your earliest convenience": [3, "7396636f2467"], "Please reply at your earliest convenience.": [3, "18915957be6c"], "reach out": [3, "f8277f02f0f6"], "Feel free to reach out if you have any questions.": [3, "da7cda48c483"], "for your reference": [3, "8e5e41ffc478"], "The catalogue is attached for your reference.": [3, "829b9f50eca0"], "When are you available for a quick call?": [3, "f520e8353ab4"], "Please share your preferred time with me, and I will arrange a quick follow-up call.": [3, "379c45cb6794"], "your free time": [3, "3f0b69fdd345"], "your preferred time": [3, "e45812c9712e"], "your schedule": [3, "45ca6f8cd7ba"], "How can I contact you after the fair?": [3, "4196372b6952"], "I can contact you via your email address or phone number after the fair.": [3, "096822927b45"], "your email address": [3, "13b99cde786b"], "your phone number": [3, "d4f6c35e451f"], "your office line": [3, "20a4ad9dcde9"], "What information should I prepare for our meeting?": [3, "e894412a453a"], "Please prepare your product list, your company profile, and your questions for our meeting.": [3, "6883820e6940"], "your product list": [3, "b81bdb7b4168"], "your company profile": [3, "f4a42d4d181c"], "your questions": [3, "c1a44714766a"], "Who else should join our meeting?": [3, "5366d9b632f1"], "You can invite your technical team or your manager to join if needed.": [3, "bae9d949e1b9"], "your technical team": [3, "78482d35c25a"], "your manager": [3, "78233f3b1acd"], "your assistant": [3, "b663ea18273a"], "What is the best way to follow up?": [3, "62a4715a4093"], "The best way is a phone call first, followed by an email summary.": [3, "bc93acd2a0e3"], "a phone call": [3, "eeba20b81c6f"], "an email": [3, "f9ad76590a54"], "a video meeting": [3, "f163fa5c721b"], "What's the price for this item?": [3, "530698e2ab32"], "The price is about an estimated amount for now.": [3, "a07455d6c728"], "an estimated amount": [3, "8b85108a4131"], "our current offer": [3, "2bcfd3052679"], "a competitive rate": [3, "d3a31d34fd8c"], "The price is an estimated amount based on your order details.": [3, "4fcc3afb3de8"], "Our current offer is very competitive for this item.": [3, "767eb1feceef"], "I can give you a quick estimate right now.": [3, "9552aacbec8d"], "Does the price change with quantity?": [3, "4267121cecd3"], "Yes, the price changes with quantity.": [3, "3d23ce5ff6e1"], "order size": [3, "73679fb808af"], "bulk purchase": [3, "95a8a17e3dc5"], "large quantity": [3, "a94dd59db5de"], "Yes, the price changes with order size.": [3, "73d27e0d5bc7"], "For a bulk purchase, we can give a better rate.": [3, "1800e02501c4"], "If you order in a large quantity, the price will be lower.": [3, "3ca25982fd2d"], "What is your Minimum Order Quantity?": [3, "af6bf45d1c37"], "The minimum order is 100 units.": [3, "06d603b0aec9"], "100 units": [3, "abfd978f0fb6"], "one full carton": [3, "6874dca97918"], "a standard batch": [3, "f130d92e2ddf"], "For this item, one full carton is the MOQ.": [3, "9a6206e20f8b"], "We usually start with a standard batch for first orders.": [3, "93be0598ad75"], "Is this your best price?": [3, "4475c18a8d1a"], "Yes, this is our best price at this time.": [3, "e3e064317ef1"], "at this time": [3, "1bf5b3c6359e"], "for this order": [3, "42ed24c69446"], "for your request": [3, "545a1169f2a0"], "This price is for this order and the quantity you mentioned.": [3, "86108a22cd79"], "We are giving a very good rate for your request.": [3, "e51de6bc278a"], "What is included in this price?": [3, "cd0e16baa8bb"], "The price includes standard packaging and basic shipping.": [3, "a07290ff1c72"], "standard packaging": [3, "a4fcdbaf69be"], "basic shipping": [3, "fae40f8dabaa"], "product warranty": [3, "962e3374a8b5"], "The price includes standard packaging.": [3, "52bd4d1acdd3"], "It also includes basic shipping and product warranty.": [3, "261923f88c61"], "If you need extra services, I can quote those separately.": [3, "e97f28b389e3"], "Hi, this is Sally from the sales team.": [3, "98554390617d"], "I'm calling to follow up on the quotation we sent last Monday.": [3, "091471668c62"], "Do you have any questions about the prices or the delivery time?": [3, "a31465a7c95d"], "Thank you for your inquiry.": [3, "5c81da001955"], "I'll send you our quotation by the end of today.": [3, "b38cbcef105d"], "Could you confirm the quantity you need?": [3, "6bcac60c1e4e"], "feature": [4, "4b7615dce52c"], "The key feature is its long battery life.": [4, "032b1c88b423"], "benefit": [4, "2124037ca66a"], "The main benefit for you is lower maintenance cost.": [4, "3e892494a3c9"], "competitive": [4, "b3b1197c826a"], "Our price is very competitive for this quality.": [4, "2d4a4d372809"], "discount": [4, "c467ca0fa214"], "We can offer a 5% discount for orders over 1,000 units.": [4, "c2261532a6b3"], "minimum order quantity (MOQ)": [4, "93aa74582075"], "Our MOQ is 500 pieces.": [4, "dd6a433990b5"], "warranty": [4, "0cf5f9cdc9bf"], "It comes with a two-year warranty.": [4, "00d1f3c18813"], "value for money": [4, "0ed22281a66b"], "Customers see it as good value for money.": [4, "878e6f467960"], "justify": [4, "3d7a034a83cb"], "Let me explain what justifies the price.": [4, "f0930ea0c659"], "What makes this new product special?": [4, "82490f0846aa"], "This product offers unique design features, a handcrafted finish, and strong commercial appeal. That is what makes it special in the market.": [4, "7e10553c7676"], "exclusive technology": [4, "25a3fef1af22"], "unique design features": [4, "871884535934"], "advanced performance benefits": [4, "8d4f27c17e3b"], "We have recently launched a new furniture and home decor collection designed for customers who want something more distinctive in their market.": [4, "3666e640c7b4"], "This product offers unique design features, a handcrafted finish, and a look that works well in modern living spaces.": [4, "b56b3fac3d7c"], "It also provides strong commercial value because the materials and finishing are suitable for repeated retail orders.": [4, "41224d41027f"], "This collection stands out because it combines natural textures, practical use, and strong visual appeal.": [4, "a9034d19050a"], "Who is the target customer for this 67b2a5e"], "written approval": [9, "2c2510792ccc"], "We need your written approval to proceed.": [9, "82b4572d3b35"], "revised drawing": [9, "985b5a336fd8"], "We received the revised drawing yesterday.": [9, "4c9e027ec122"], "estimate": [9, "cb3fca157fd0"], "This is a preliminary estimate.": [9, "57c02d291f96"], "proceed": [9, "35747d13dcd9"], "Please confirm so we can proceed.": [9, "366d1583f971"], "Based on the revised drawing, the scope of work has changed.": [9, "b6472fbfe2e7"], "The change will impact the schedule by about one week.": [9, "5e6c79be815a"], "We've prepared a variation order for your review.": [9, "d0aae949c7ea"], "We need your written approval before we proceed.": [9, "88dc8b5c3d32"], "Could you confirm by Friday?": [9, "a920e7a92d7e"], "handover": [10, "7d50f37dd6b0"], "The handover is planned for 15 January.": [10, "3d4a9c7c67a6"], "inspection": [10, "90f9b69fcbf8"], "The final inspection is on Monday.": [10, "7e6d0729aadc"], "defect": [10, "1ca0739975cf"], "We found three minor defects.": [10, "015a7f35b855"], "punch list": [10, "a9b383dfcec2"], "Please see the punch list attached.": [10, "653bcc3672d5"], "invoice": [10, "baeba7e7b9ec"], "We have issued the invoice for the second payment.": [10, "4f58d05a5eda"], "overdue": [10, "ba2fff4051e9"], "The payment is now 15 days overdue.": [10, "e8d2106c33d6"], "retention": [10, "31e69adfb28b"], "The 5% retention will be released after the warranty period.": [10, "32b56be067f7"], "settle": [10, "d424af29a8c5"], "Could you settle the invoice by the end of the month?": [10, "aa07fc4ed339"], "Thank you all for joining the final inspection.": [10, "c1b415262304"], "We found three minor defects, listed on the punch list.": [10, "9d1b48f7b2e8"], "We'll fix all items by Friday, before the handover.": [10, "ac23366608f4"], "I'm calling about invoice 112.": [10, "21d00ac791ec"], "Our records show it is now 15 days overdue.": [10, "fe8610d486d8"], "Could you let me know when we can expect payment?": [10, "28a "], "backup supplier": [9, "889adbf3522b"], "We approved a backup supplier in Thailand.": [9, "34f49a9678c1"], "single point of failure": [9, "ebac223308c7"], "That one machine is a single point of failure.": [9, "a758606af2ca"], "force majeure": [9, "2e82dce04334"], "The supplier declared force majeure after the flood.": [9, "4883a5038511"], "business continuity": [9, "b9c9629b92d0"], "ISO 22301 covers business continuity.": [9, "7f5387de4c11"], "just in time": [9, "aaee59697957"], "Just in time works only when suppliers are reliable.": [9, "c12cbd732033"], "just in case": [9, "0d0c7a4655cb"], "After the crisis we moved to a just in case approach.": [9, "b81a192658c1"], "cost overrun": [9, "ce01ba8ca23e"], "The cost overrun came from extra air freight.": [9, "6bc86c2c74e4"], "mitigate": [9, "ec258f8320ff"], "We can mitigate the risk with a second route.": [9, "4f572be90419"], "customs declaration": [10, "7654cb3ee937"], "The customs declaration must match the invoice.": [10, "1c7316a7d109"], "HS code": [10, "a4b267957ade"], "Please confirm the HS code for this product.": [10, "9b94d42fa8e2"], "compliance": [10, "e9aecb868cc4"], "Compliance checks take two days.": [10, "e83a9d955453"], "exchange rate": [10, "019c5d85f4e6"], "The exchange rate moved three percent this month.": [10, "fd1464aae545"], "currency risk": [10, "15724527e593"], "Paying in US dollars reduces our currency risk.": [10, "7cdbd5ff9212"], "advance payment": [10, "97ee29b399ca"], "The supplier wants a 30 percent advance payment.": [10, "029376e6e9f5"], "balance payment": [10, "20c78d3b83e9"], "The balance payment is due before shipment.": [10, "28b88a4559a9"], "credit note": [10, "4cf07b51b6f7"], "We will issue a credit note for the shortage.": [10, "294096bc610a"], "debit note": [10, "dc38bd65678a"], "We sent a debit note for the extra freight.": [10, "ed94d8655e95"], "demurrage": [10, "9c3d89e713bc"], "Late documents caused three days of demurrage.": [10, "844f55cc1a0a"], "detention": [10, "6d11c ["L1", "d6ff37601a31"], "Is this price inclusive of VAT?": ["L1", "2e0ed6b61476"], "exclusive of tax": ["L1", "8fe0a8735a7d"], "All prices are exclusive of tax and shipping.": ["L1", "317e0e8018e4"], "VAT invoice": ["L1", "f1a823576f20"], "We will need a VAT invoice issued to our company name.": ["L1", "ad010b8c29c8"], "configuration": ["L1", "ccd1066343c9"], "We have not decided on the final configuration yet.": ["L1", "c6fa0c2443a5"], "accessory": ["L1", "34217ce63232"], "The charging dock is sold as an optional accessory.": ["L1", "9c865bbf3e82"], "bundle": ["L1", "94377c156735"], "Is the inspection software included in the bundle?": ["L1", "1973edb36134"], "delivery schedule": ["L1", "587c7b083bae"], "Please confirm the delivery schedule once we place the order.": ["L1", "17ca9c33d153"], "in writing": ["L1", "b3322794469f"], "Could you confirm the warranty terms in writing?": ["L1", "a6519d92b51a"], "decision-maker": ["L1", "82823008e993"], "Our director is the final decision-maker on this purchase.": ["L1", "5a29195983eb"], "follow-up question": ["L1", "dead56f32ede"], "I have a few follow-up questions about the battery.": ["L1", "2d3d7d6d056b"], "outstanding": ["L1", "c552473b4b58"], "There are still three outstanding questions from our last email.": ["L1", "e719a869f1bc"], "chase up": ["L1", "0e469f891534"], "I'll chase up the quotation if they don't reply by Friday.": ["L1", "d1fc4e78b3f9"], "pending": ["L1", "7c6c2e5d48ab"], "The purchase is pending our director's approval.": ["L1", "1e469d674332"], "budget approval": ["L1", "42cd456078e3"], "We need budget approval before we can confirm the order.": ["L1", "4872e1d7e7f4"], "purchase agreement": ["L1", "bd909e79b576"], "Please send a draft purchase agreement for our review.": ["L1", "33816a473f0b"], "after-sales support": ["L1", "83cdce9bb061"], "Does the price include after-sales support in Australia?": ["L1", "42e9d81f2460"], "system integration": ["L1", "9a3892e83a1b"], "The distributor also offers system integration for custom software.": ["L1", "d5d13e4884b5"], "Why are you buying through a distributor instead of directly from the manufacturer?": ["L1", "2f082139b6fb"], "We prefer to buy through the authorized distributor because they provide local after-sales support, handle the import paperwork and can issue a VAT invoice.": ["L1", "28120906098c"], "local after-sales support": ["L1", "ad026505cca9"], "no import paperwork": ["L1", "9b778fe15e72"], "a VAT invoice": ["L1", "b4c54b9e4188"], "What information do you still need before you can place the order?": ["L1", "c810ccbdc998"], "Before we place the order, we need an itemized quotation, written warranty terms for Australia and budget approval from our director.": ["L1", "cceb50bfda3b"], "an itemized quotation": ["L1", "0b9d1a2ff202"], "written warranty terms": ["L1", "39312aaf1112"], "How will you choose between the three models?": ["L1", "1cf733516ed1"], "We will compare them on weather protection, battery life and software access, and then weigh the total cost against our budget.": ["L1", "93a50c3c385a"], "weather protection": ["L1", "7503c17628a0"], "battery life": ["L1", "7af7f21e7967"], "software access": ["L1", "569cc7cddbdb"], "What will you do if the distributor doesn't reply?": ["L1", "ecbba4a71258"], "If they don't reply by Friday, I will chase them up by phone and, if necessary, escalate to their sales manager.": ["L1", "e0e9addc4ed9"], "chase them up by phone": ["L1", "3c77f05b4ecc"], "escalate to their sales manager": ["L1", "0f1c53dc9197"], "contact the brand directly": ["L1", "c47376c2bccf"], "We're interested in the A2 Pro for site inspection in Australia.": ["L1", "abf0f3f7a02a"], "Could you send us an itemized quotation, including accessories and software?": ["L1", "a7258157bc5a"], "Please also confirm whether the prices are inclusive of VAT.": ["L1", "d7ee396cc9a3"], "I'm calling to follow up on our email from last week.": ["L1", "8c99ea7e9fa8"], "We still have a few outstanding questions about the warranty.": ["L1", "254c87bb8235"], "Could you give us a written answer by Friday?": ["L1", "2faa924f5384"], "specification sheet": ["L2", "b251a3b7c616"], "The specification sheet does not mention the operating temperature.": ["L2", "36a909545afb"], "payload": ["L2", "321c3cf486ed"], "The A2 can walk with a payload of about 25 kilograms.": ["L2", "a1f5b29a1b4f"], "runtime": ["L2", "b4a619251c5c"], "Real runtime outdoors is usually shorter than the figure in the brochure.": ["L2", "0c07d05507be"], "hot-swappable": ["L2", "1a5b9e8627eb"], "The A2 has hot-swappable batteries, so it can work in shifts.": ["L2", "77f1c5ceb2df"], "IP rating": ["L2", "c7eb965cf7b2"], "We need an IP rating of at least IP54 for outdoor sites.": ["L2", "b40abafd5329"], "operating temperature": ["L2", "0b8b63e9757a"], "Is the operating temperature suitable for an Australian summer?": ["L2", "fb88c8353692"], "LiDAR": ["L2", "ca9b95621e4b"], "The LiDAR scans the site and creates a point cloud.": ["L2", "ce2af3a52a60"], "point cloud": ["L2", "609184dd00c7"], "Can we export the point cloud to our own software?": ["L2", "a1c26aca5423"], "thermal camera": ["L2", "e61d33c97499"], "A thermal camera can find hot spots in electrical panels.": ["L2", "373d7a55df3d"], "pan-tilt-zoom camera": ["L2", "17fdcce593ee"], "A pan-tilt-zoom camera lets us inspect details from a distance.": ["L2", "9a569039f7d9"], "onboard computer": ["L2", "e0038057b0a8"], "Our software will run on the onboard computer.": ["L2", "15694236070d"], "SDK (software development kit)": ["L2", "d689b804a98f"], "Without the SDK, we cannot install our own agent software.": ["L2", "c2719c2735ef"], "API": ["L2", "db974238714c"], "We need API access to the camera and the battery status.": ["L2", "c30cb7e533fd"], "firmware": ["L2", "74b5b5e9570e"], "Will installing our software affect the firmware or the warranty?": ["L2", "09feaea28bfd"], "over-the-air update": ["L2", "3d5745e905f6"], "The robot receives an over-the-air update every month.": ["L2", "6c38a32d5dd1"], "autonomous navigation": ["L2", "41ae2d40881b"], "Autonomous navigation on stairs needs the industrial software package.": ["L2", "c6130b88d5b9"], "waypoint": ["L2", "f75862c2bd00"], "The robot stops at each waypoint to take photos.": ["L2", "c5394a160080"], "charging dock": ["L2", "64d740c9f845"], "The robot returns to the charging dock when the battery is low.": ["L2", "794de9cf660a"], "accuracy": ["L2", "5d6db9a1dc72"], "LiDAR mapping accuracy is only a few centimeters.": ["L2", "0a52bdca639e"], "tolerance": ["L2", "8d2ace945d82"], "For final acceptance, the tolerance must be within millimeters.": ["L2", "0f18d373c8cd"], "What will the robot be used for?": ["L2", "1609044ce5f4"], "It will be used to patrol construction sites in Australia, capture daily photos at fixed waypoints and build 3D maps to track progress.": ["L2", "2e5d39d098d0"], "patrol construction sites": ["L2", "b9727c498aa6"], "capture daily photos": ["L2", "cc4a37d17520"], "build 3D maps": ["L2", "5e42df7ff1bf"], "Which technical features are essential for you?": ["L2", "72e67dfff4b2"], "The essential features are an outdoor IP rating, automatic recharging at a charging dock and full SDK access for our own software.": ["L2", "d373bbeef2fe"], "an outdoor IP rating": ["L2", "7bffeec417d9"], "automatic recharging": ["L2", "7352aaadd1dc"], "SDK access": ["L2", "24adbf3a34f2"], "Is centimeter-level accuracy enough for your project?": ["L2", "b2b12af9577b"], "It is enough for tracking progress, but not for final acceptance, where we would need millimeter tolerance from survey equipment.": ["L2", "6fd55e786c93"], "tracking progress": ["L2", "27d5035ee1ca"], "final acceptance": ["L2", "55d211292b96"], "millimeter tolerance": ["L2", "c71f405705bb"], "What happens if installing your software voids the warranty?": ["L2", "bef66ca4e766"], "In that case, we would need written confirmation of what is still covered, try to negotiate the terms, or choose a model that allows custom software.": ["L2", "031ecfdbe89b"], "get written confirmation": ["L2", "dc301098e4f3"], "negotiate the terms": ["L2", "1e30886118d9"], "choose another model": ["L2", "3caf637b2022"], "The robot will patrol construction sites, both indoors and outdoors.": ["L2", "399e45b9dac8"], "It needs an IP rating of at least IP54 and a runtime of two hours with a payload.": ["L2", "760bd64e477f"], "Most importantly, we need SDK access to run our own software.": ["L2", "2c9e24940244"], "The specification sheet says the runtime is over five hours.": ["L2", "33cae58984f8"], "Is that measured with or without a payload?": ["L2", "98089e67586b"], "Could you share test data for outdoor conditions?": ["L2", "254e5979efde"], "dangerous goods": ["L3", "dfc0f380228a"], "Lithium batteries are classified as dangerous goods for air transport.": ["L3", "9c4e1027ddbb"], "lithium-ion battery": ["L3", "bc5bd3f089aa"], "The robot's lithium-ion battery is rated at about 230 watt-hours.": ["L3", "167f0a5f68e6"], "watt-hour rating": ["L3", "2d7a0f35f550"], "Airlines check the watt-hour rating before they accept a battery.": ["L3", "fe2219bf01da"], "UN38.3": ["L3", "258f059cdde0"], "Please send the UN38.3 test summary for this battery.": ["L3", "432c1e1bccd6"], "safety data sheet": ["L3", "e7cd8b2dc2c4"], "The forwarder asked for the safety data sheet before booking.": ["L3", "650b20337150"], "declaration": ["L3", "1c2294224328"], "The shipper must sign a dangerous goods declaration.": ["L3", "661c2c94f909"], "classification": ["L3", "63f69c7f9587"], "Correct classification decides the duty rate.": ["L3", "b16bddb94d90"], "radio equipment approval": ["L3", "f42c47526ab7"], "The robot uses WiFi and 4G, so we must check radio equipment approval.": ["L3", "273d52358548"], "certificate of conformity": ["L3", "17046f1d4035"], "The buyer wants a certificate of conformity for each unit.": ["L3", "507a97c04e3a"], "test report": ["L3", "7c21ec101769"], "The lab will issue the test report within ten days.": ["L3", "51c2c85728a5"], "restricted item": ["L3", "a5331fd7cf4c"], "Large batteries are a restricted item on passenger flights.": ["L3", "b23e8d2dba05"], "prohibited": ["L3", "607f49f78497"], "Some chemicals are prohibited on all flights.": ["L3", "b7d4988fdabc"], "regulation": ["L3", "b367d9be2f2d"], "We must follow the regulations of the destination country.": ["L3", "75b677c8ef0c"], "compliance check": ["L3", "58fa781b209e"], "The compliance check found a missing label.": ["L3", "2e298962f6ad"], "duty rate": ["L3", "e7db61bcbc8f"], "The duty rate depends on the HS code.": ["L3", "fdbb2aaaae00"], "import permit": ["L3", "411cbb96d323"], "Do we need an import permit for this equipment?": ["L3", "cf335a9815d7"], "liability": ["L3", "c91db3c2cfd8"], "Who takes liability if the battery is damaged in transit?": ["L3", "fd62df6dcb9a"], "hazard": ["L3", "afbe5099e0f5"], "A damaged battery is a fire hazard.": ["L3", "d4b09809a286"], "packaging requirements": ["L3", "06e1bec539e3"], "Dangerous goods have strict packaging requirements.": ["L3", "c7b03d215123"], "audit trail": ["L3", "7c4a2dee92b6"], "Keep all emails with the broker as an audit trail.": ["L3", "08281c175f5a"], "Why do lithium batteries need special handling?": ["L3", "3beffa67a695"], "They are classified as dangerous goods because a damaged battery can be a fire hazard, so they have strict packaging requirements.": ["L3", "e1b93423abdd"], "a fire hazard": ["L3", "f2391d23df4f"], "strict packaging requirements": ["L3", "88e421632d20"], "Which documents will you ask the supplier for?": ["L3", "7f9752305786"], "We will ask for the UN38.3 test summary, the safety data sheet and a certificate of conformity for the exact model.": ["L3", "3369fe34809f"], "the UN38.3 test summary": ["L3", "8f86d2e3a199"], "the safety data sheet": ["L3", "1e95c453597b"], "a certificate of conformity": ["L3", "f4ebc7918d08"], "Who confirms the HS code and duty rate?": ["L3", "d991b5fbeed7"], "The customs broker confirms it in writing, and we keep the email as an audit trail in the shipment folder.": ["L3", "ceef214d9ab9"], "the customs broker": ["L3", "59492cb9b0be"], "an audit trail": ["L3", "3244a0842e2a"], "What is the biggest compliance risk in this project?": ["L3", "b957ed25f6a0"], "The biggest risk is radio equipment approval, because without it the robot could be held at customs and we could not use it legally.": ["L3", "d482e9e3e3c9"], "the battery shipment": ["L3", "5742a0c5c40a"], "delays at customs": ["L3", "db7762e87cc7"], "We need to ship a robot with a lithium-ion battery of about 230 watt-hours.": ["L3", "b96ce2f87956"], "Can you accept it as dangerous goods by air?": ["L3", "9716e81dc66e"], "Which documents do you need from us before booking?": ["L3", "1a4b421efd25"], "Before we order, we need to confirm two compliance points.": ["L3", "459ae2fab6a4"], "The robot uses WiFi and 4G, so it may need radio equipment approval.": ["L3", "a4e07dacfcf5"], "I'll get written confirmation from the agency before we pay.": ["L3", "04deff8f5afa"], "express courier": ["L4", "ee350f83f40a"], "An express courier is faster for one unit, but it costs more.": ["L4", "e27659e08cc0"], "air cargo": ["L4", "2fde91d2b40d"], "Air cargo takes a few days, including customs clearance.": ["L4", "aead4ff2f877"], "door-to-door": ["L4", "39d34d079b90"], "We prefer a door-to-door service to the site office.": ["L4", "ade417c7b339"], "chargeable weight": ["L4", "30b83ef6b6b0"], "The chargeable weight is based on the box size, not the robot's weight.": ["L4", "84644e5936dc"], "volumetric weight": ["L4", "c1bfe4488c10"], "Large, light boxes are charged by volumetric weight.": ["L4", "ec17c39394cc"], "biosecurity": ["L4", "5081c15fcbdc"], "Australia has strict biosecurity rules for wooden packaging.": ["L4", "359e69ef47df"], "ISPM 15": ["L4", "288cabe72e87"], "All wooden pallets must be treated and stamped under ISPM 15.": ["L4", "f16302c5cb72"], "fumigation": ["L4", "58dc25d0eb35"], "The crate needs fumigation before shipment.": ["L4", "8a6625390a2d"], "heat treatment": ["L4", "580439efd62e"], "Heat treatment is an approved method under ISPM 15.": ["L4", "44d87e20077c"], "GST (goods and services tax)": ["L4", "98fe03130787"], "Import GST is calculated on the customs value plus freight and insurance.": ["L4", "4e7242b3b0da"], "customs value": ["L4", "4e2b1dfdb731"], "The customs value must match the commercial invoice.": ["L4", "33dcff1cddff"], "consignee": ["L4", "dfe027ab1560"], "Please put our Sydney office as the consignee.": ["L4", "c0f48fc7113b"], "shipper": ["L4", "733956531299"], "The shipper must sign the dangerous goods declaration.": ["L4", "0ea2beff3edf"], "temporary import": ["L4", "99cdbbcd668b"], "We asked the broker whether a temporary import is possible for testing.": ["L4", "718eddf26a2a"], "proof of delivery": ["L4", "a48b9b24de57"], "Please send the proof of delivery once the parcel arrives.": ["L4", "b8255bfa9bbd"], "transit insurance": ["L4", "d5687bce4dda"], "High-value equipment should have transit insurance.": ["L4", "1ca6901a0196"], "held at customs": ["L4", "f7cb70e66459"], "The parcel was held at customs because a document was missing.": ["L4", "6f54eeabdd18"], "release": ["L4", "123fead50246"], "Customs released the shipment this morning.": ["L4", "5a0af1e0ff18"], "final mile": ["L4", "b2e9437dd86d"], "The final mile to the site will be by local truck.": ["L4", "cdcf0b7988be"], "rate comparison": ["L4", "9ddab332f389"], "Let's do a rate comparison between three couriers.": ["L4", "56ef2b4164d2"], "How will you send the robot to Australia?": ["L4", "7bfd53e84630"], "We are considering an express courier or air cargo; the final choice depends on the battery rules, the total cost and how soon the site needs it.": ["L4", "1132cff5db5a"], "an express courier": ["L4", "6162c252eefe"], "the battery rules": ["L4", "ce1d087b5d5d"], "What could delay the shipment at Australian customs?": ["L4", "cd9f53e60620"], "It could be delayed by missing documents, untreated wooden packaging or a mismatch between the customs value and the invoice.": ["L4", "3edde9627e8c"], "missing documents": ["L4", "aff16d2feea2"], "untreated wooden packaging": ["L4", "85a3f881912a"], "a value mismatch": ["L4", "b87350fd70e0"], "Who should be the consignee?": ["L4", "ddca68524126"], "The consignee should be our Australian office, because they will receive the goods and act as the importer of record.": ["L4", "f7cfb9828c03"], "our Australian office": ["L4", "86f569809c36"], "the site office": ["L4", "939091647ff3"], "the importer of record": ["L4", "0e1caf013781"], "How do you choose between three courier quotes?": ["L4", "d83c2400c83f"], "I compare the total cost, the transit time and their experience with dangerous goods, not just the base price.": ["L4", "4eec57845cde"], "the total cost": ["L4", "3295800725ce"], "the transit time": ["L4", "03568bfebd46"], "dangerous goods experience": ["L4", "a3399038d37b"], "For one robot, an express courier is faster and handles customs for us.": ["L4", "b09f40b686dd"], "Air cargo may be cheaper, but we need a broker at both ends.": ["L4", "3e5486fdbd9d"], "Both options need dangerous goods approval for the battery.": ["L4", "f6d445a031f5"], "Our parcel has been held at customs in Sydney since Tuesday.": ["L4", "ecc13875d28a"], "Could you tell us what information is missing?": ["L4", "68de19f0ec8c"], "We can send the commercial invoice and the battery documents today.": ["L4", "534b358cdf52"], "acceptance test": ["L5", "c73024029777"], "We will run an acceptance test on site before we sign.": ["L5", "3e1f459255c6"], "delivery note": ["L5", "8a3341abd9bf"], "Please sign the delivery note and note any damage.": ["L5", "ffb2b806411c"], "unboxing": ["L5", "919a33897395"], "Record a video during unboxing in case there is damage.": ["L5", "b2d7d46b28e9"], "visible damage": ["L5", "d3e0d9848236"], "Note any visible damage before you sign.": ["L5", "dc62deb925b6"], "functional test": ["L5", "e1d3cb3c6bee"], "The functional test covers walking, charging and the cameras.": ["L5", "d2212ccdc660"], "acceptance criteria": ["L5", "4e75f1da092b"], "The acceptance criteria were agreed in the purchase agreement.": ["L5", "18759ea2298c"], "malfunction": ["L5", "a65e35329426"], "If there is a malfunction during testing, we will request a replacement.": ["L5", "2f8304cc9e92"], "one-to-one replacement": ["L5", "cb5cdfbc39e0"], "The distributor offers a one-to-one replacement within the test period.": ["L5", "5126a2970f09"], "warranty period": ["L5", "8dd749a9f696"], "The warranty period starts on the delivery date.": ["L5", "959fdc105d05"], "international warranty": ["L5", "ed64ad19057f"], "Is this an international warranty or only valid in Vietnam?": ["L5", "44c49b0e1b94"], "void the warranty": ["L5", "2ab9903ae70d"], "Opening the battery case may void the warranty.": ["L5", "078850f6dc35"], "service center": ["L5", "f95ab3406541"], "Where is the nearest authorized service center in Australia?": ["L5", "ecf16b509d15"], "spare parts": ["L5", "acf1a84a698b"], "We should keep spare parts such as feet and a second battery.": ["L5", "85b73211d572"], "troubleshooting": ["L5", "e09245effc62"], "The manual has a troubleshooting section.": ["L5", "df8d70661bbf"], "remote support": ["L5", "86e11c2a0b0f"], "Most software issues can be solved with remote support.": ["L5", "67c2e1c58693"], "onboarding training": ["L5", "e9c8d9957cb2"], "The distributor provides onboarding training for two operators.": ["L5", "ffb6f2f757b6"], "user manual": ["L5", "0509dd4c9789"], "Is the user manual available in English?": ["L5", "c43d79564b00"], "sign off": ["L5", "50ce505b13ec"], "The site manager will sign off after the test.": ["L5", "adeff6905918"], "commissioning": ["L5", "7a3d67fb1781"], "Commissioning on site will take two days.": ["L5", "ede57e1d406d"], "service level": ["L5", "79f05e8f9991"], "What service level do you offer for urgent repairs?": ["L5", "27e6f9f6b67a"], "What will you check when the robot arrives?": ["L5", "94df8fceb875"], "First we record the unboxing and check for visible damage, then we run a functional test of walking, charging and the cameras.": ["L5", "53bacb45d6b9"], "record the unboxing": ["L5", "d9b5d4956b3e"], "check for visible damage": ["L5", "44d8029f6577"], "run a functional test": ["L5", "3e9d8e9c9385"], "What are your acceptance criteria?": ["L5", "158fd8a34515"], "The robot must complete a full patrol route, return to the dock automatically and send images to our software without errors.": ["L5", "8445d64b2e58"], "complete a full patrol": ["L5", "2d42e4ece218"], "return to the dock automatically": ["L5", "45c31aed305b"], "send images to our software": ["L5", "7159977dd824"], "What support do you expect after the purchase?": ["L5", "026d506365e1"], "We expect onboarding training for our operators, remote support for software issues and fast delivery of spare parts.": ["L5", "4d444cae9a2a"], "fast spare parts": ["L5", "055abcc30e66"], "What will you do if the warranty is not valid in Australia?": ["L5", "6f098f458d40"], "We would negotiate an extended warranty with the distributor or use a local service partner, and budget for repairs.": ["L5", "3eeee1f773ba"], "negotiate an extended warranty": ["L5", "c5fa1e4cdb8b"], "use a local service partner": ["L5", "89c39060b047"], "budget for repairs": ["L5", "610dc56f3934"], "During the acceptance test, the robot did not return to the charging dock.": ["L5", "a50ee749a98d"], "We repeated the test three times with the same result.": ["L5", "a60e1b48b851"], "Could you arrange remote support or a one-to-one replacement?": ["L5", "17718f8179d0"], "We will use the robot on sites in Australia.": ["L5", "93915895b5ca"], "Is the warranty valid there, and where is the nearest service center?": ["L5", "a4b0d72a0644"], "How quickly can you supply spare parts?": ["L5", "e8f194645cb4"], "OEM (original equipment manufacturer)": ["L6", "6bf0aa08e2be"], "In an OEM project, the factory builds the robot to our design.": ["L6", "4ef3ecaca369"], "ODM (original design manufacturer)": ["L6", "a65d55feb416"], "With an ODM model, we use the factory's design and add our logo.": ["L6", "7ca92160f46a"], "private label": ["L6", "2b06c504d632"], "We want to sell the robot under a private label.": ["L6", "ce6794f59900"], "white label": ["L6", "2d9aa197cdc1"], "A white label product is faster to launch but not exclusive.": ["L6", "5630c73a11e9"], "non-disclosure agreement (NDA)": ["L6", "babb15fdfd19"], "Both sides must sign a non-disclosure agreement before we share the specification.": ["L6", "af73872e3583"], "intellectual property": ["L6", "428700a65bca"], "Who owns the intellectual property of the new design?": ["L6", "e039f80161e2"], "exclusivity": ["L6", "242b3fa3b4ca"], "Exclusivity in Australia would increase the price.": ["L6", "25d6a0a8defb"], "tooling cost": ["L6", "a8778450026f"], "The factory charges a one-time tooling cost.": ["L6", "fc3616d1fa07"], "NRE (non-recurring engineering) cost": ["L6", "6eeec55e64c9"], "The NRE cost covers design changes and testing.": ["L6", "a4a88eeb6e34"], "prototype": ["L6", "c18462a35a7a"], "The first prototype will be ready in eight weeks.": ["L6", "f5819e595098"], "golden sample": ["L6", "92744065ba15"], "We will keep a golden sample for quality checks.": ["L6", "8e4822084540"], "bill of materials (BOM)": ["L6", "8b862712a74b"], "Please share the bill of materials for the main components.": ["L6", "804e07a52682"], "tiered pricing": ["L6", "0970fac1bd55"], "Please quote tiered pricing for 10, 50 and 100 units.": ["L6", "23c7fad009bb"], "ramp-up": ["L6", "0fc05bb325c7"], "Ramp-up usually takes two to three months.": ["L6", "f211a99fa291"], "factory audit": ["L6", "c2a7dd163157"], "We plan a factory audit before we sign.": ["L6", "55d992708d2b"], "rebrand": ["L6", "67aed930d7a2"], "Can we rebrand the software interface as well?": ["L6", "af77ca0c1f12"], "licensing fee": ["L6", "76230fc715b1"], "Is there a licensing fee for the firmware?": ["L6", "1667a676192a"], "source code": ["L6", "3c78fa8b3e5d"], "We need access to the source code to customize the app.": ["L6", "d80d06fc14c0"], "trademark": ["L6", "9ebf51b8e23b"], "We must check that the trademark is not already registered.": ["L6", "d70968d98ca1"], "term sheet": ["L6", "69ddf2affbf5"], "Let's agree on a term sheet before the lawyers draft the contract.": ["L6", "326f2228d48c"], "What is the difference between OEM and ODM for your project?": ["L6", "d462ab9b5eab"], "With OEM, the factory builds our own design; with ODM, we use the factory's design under our brand, which is faster and cheaper but usually not exclusive.": ["L6", "b71da15a99e7"], "our own design": ["L6", "5cc97483be06"], "the factory's design": ["L6", "941bee955ee6"], "faster and cheaper": ["L6", "b3b029f686cb"], "What do you need to protect before working with a factory?": ["L6", "6a6a2023ec08"], "our specification": ["L6", "dad136be21f3"], "the software we develop": ["L6", "9845c71b5f77"], "Which costs should the factory quote?": ["L6", "29079a68e329"], "Please quote tiered unit prices, one-time tooling and NRE costs, and the cost and lead time of samples.": ["L6", "dccf512214df"], "tiered unit prices": ["L6", "f92403c7b3ba"], "tooling and NRE costs": ["L6", "2e27716ec07b"], "sample costs": ["L6", "3ad503b0db92"], "How will you choose the factory?": ["L6", "ec6f6744e80c"], "We will shortlist three to five factories and decide after a factory audit and testing a prototype against our requirements.": ["L6", "958fe13851f8"], "three to five factories": ["L6", "484b3913778d"], "a factory audit": ["L6", "523e1dfb5280"], "testing a prototype": ["L6", "fc85c7ec1b35"], "We're planning an inspection robot for construction sites under our own brand.": ["L6", "4bc52dd9dcd9"], "Do you work on an OEM or an ODM basis?": ["L6", "be60314e9100"], "Before we share our specification, we'd like to sign an NDA.": ["L6", "1fe7bcac96a6"], "We'd like exclusivity for the Australian market.": ["L6", "35261c861a20"], "We also need to own the software we develop and the data it collects.": ["L6", "b86950c21e3f"], "Can we put these points in a term sheet first?": ["L6", "9ff2e0b7eaa2"], "brick sample": ["L7", "317f9c17a952"], "We are sending two brick samples to the buyer in Sydney.": ["L7", "8acde9123769"], "crate": ["L7", "dd4827af87b2"], "The samples are packed in a wooden crate.": ["L7", "20a3fa856b0f"], "dimensions": ["L7", "f412b80e160b"], "Please confirm the dimensions of each brick.": ["L7", "1ac0c3feed56"], "net weight": ["L7", "1185f84d5590"], "The net weight of the samples is about 32 kilograms.": ["L7", "9a58fc8f8f53"], "gross weight": ["L7", "73020537e0ec"], "The gross weight is higher because of the wooden crate.": ["L7", "7256aa929e30"], "shipping mark": ["L7", "032ace7bfa72"], "Each crate needs a clear shipping mark.": ["L7", "b2027f3e28ca"], "fragile": ["L7", "7039c71bf73a"], "Mark the crate as fragile and keep it upright.": ["L7", "ca262c9e6566"], "cushioning": ["L7", "cfda8762c4d0"], "Add foam cushioning between the bricks.": ["L7", "7c5263a6bffd"], "compressive strength": ["L7", "d140c6019c05"], "The buyer asked for the compressive strength test results.": ["L7", "88b58f758f86"], "water absorption": ["L7", "b64a37d1cff2"], "Low water absorption is important for outdoor use.": ["L7", "b684132906b7"], "finish": ["L7", "3248bc7547ce"], "The buyer prefers a natural matt finish.": ["L7", "922fbc54552c"], "color variation": ["L7", "dc2787164f65"], "Some color variation is normal for clay bricks.": ["L7", "0104b4e7cacc"], "product standard": ["L7", "6d59c7c91710"], "We need to check which product standard applies in Australia.": ["L7", "7031b632b1b2"], "third-party inspection": ["L7", "8595671adc7c"], "The buyer may require a third-party inspection before shipment.": ["L7", "a737d0b155bb"], "price per square meter": ["L7", "55ade644d9d6"], "Our price per square meter includes export packing.": ["L7", "cd8224e7ec8f"], "container load": ["L7", "845edb29f02a"], "How many square meters fit in one container load?": ["L7", "aca89c862abe"], "palletize": ["L7", "7d103f2482cd"], "We will palletize the order and wrap it in film.": ["L7", "bdf179760e4f"], "breakage": ["L7", "f4e882c427a7"], "We include a small breakage allowance in the price.": ["L7", "ebfd651d0a84"], "trial order": ["L7", "c44edad83f7e"], "If the samples pass, they will place a trial order.": ["L7", "f1658d781b99"], "sample approval": ["L7", "92e1a51d2167"], "Production will start after sample approval.": ["L7", "272b1515764c"], "Can you describe the samples you sent?": ["L7", "4e92f4927163"], "We sent two brick samples with a natural matt finish, low water absorption and consistent dimensions.": ["L7", "60047f9e0428"], "a natural matt finish": ["L7", "cadbbddd2f2d"], "low water absorption": ["L7", "cf241651cf7d"], "consistent dimensions": ["L7", "b87a411fadce"], "How did you pack the samples to avoid breakage?": ["L7", "a1012ee6720a"], "We used a wooden crate, added foam cushioning between the bricks and marked it fragile to avoid breakage.": ["L7", "467dc5ba8be8"], "used a wooden crate": ["L7", "ef4ac757f851"], "added foam cushioning": ["L7", "4c4b6ffa0008"], "marked it fragile": ["L7", "334fb957ecc3"], "What tests might the buyer ask for?": ["L7", "b72da049d479"], "They might ask for compressive strength and water absorption test results, or a third-party inspection before shipment.": ["L7", "14a12b8ac255"], "a third-party inspection": ["L7", "75d4a9a74564"], "What happens after the samples are approved?": ["L7", "7a2093349596"], "After sample approval, the buyer places a trial order, we confirm the price per square meter and production starts.": ["L7", "673027b7533e"], "a trial order": ["L7", "180a93583275"], "production starts": ["L7", "25e4e59fee6d"], "We've sent two samples with a natural matt finish.": ["L7", "836d9ff43296"], "They have low water absorption, which suits outdoor use.": ["L7", "ac87c3a545de"], "We can share compressive strength test results on request.": ["L7", "b312dc9f8f3d"], "The samples are packed in one wooden crate with foam cushioning.": ["L7", "ce824f34aa3e"], "The pallet is heat-treated and stamped under ISPM 15.": ["L7", "3e2e1db1dc87"], "The crate is marked fragile, with the net and gross weight on the label.": ["L7", "1b4af29356f2"], "vintage": ["L8", "7b23b679ae00"], "The 2022 vintage is sold out.": ["L8", "d7999e71a0bb"], "grape variety": ["L8", "74d8c49fcca6"], "Shiraz is the main grape variety in this wine.": ["L8", "2976aac47d34"], "region of origin": ["L8", "a49e243fff8d"], "The label must show the region of origin.": ["L8", "593a56433dbd"], "alcohol content": ["L8", "55628005b5c1"], "The alcohol content is 13.5 percent.": ["L8", "9b0722c12a84"], "back label": ["L8", "1ef61daa3458"], "The importer will add a back label in Vietnamese.": ["L8", "b057419cbc5e"], "excise tax": ["L8", "78786f023cbe"], "Excise tax makes up a large part of the retail price.": ["L8", "0e90ed22aeed"], "import licence": ["L8", "6cd9e9fe6549"], "Only companies with an import licence can bring in wine.": ["L8", "cf1584e983bd"], "temperature-controlled": ["L8", "87dcce548335"], "We ship wine in temperature-controlled containers.": ["L8", "6c54a7b83137"], "reefer container": ["L8", "d506ba3e7dd0"], "In summer, a reefer container protects the wine from heat.": ["L8", "6f80548f9e32"], "case": ["L8", "cd14c3239020"], "The minimum order is 50 cases.": ["L8", "54baf7d62ed6"], "shelf life": ["L8", "b2b2aeade1f7"], "Most white wines have a shorter shelf life.": ["L8", "59ecbbc64283"], "tasting notes": ["L8", "24e5afe6375d"], "Please include tasting notes in the catalogue.": ["L8", "8f5a4cd4f079"], "price point": ["L8", "0971a6e32def"], "Restaurants want wines at a mid-range price point.": ["L8", "baa9ba479350"], "on-trade": ["L8", "a7f29afd0d09"], "Our focus is the on-trade, mainly hotels.": ["L8", "d0fd5b8d875e"], "off-trade": ["L8", "c1f819269a72"], "Off-trade sales grow before Tet.": ["L8", "57c392b7e06d"], "cellar door": ["L8", "a12024692893"], "We met the producer at the cellar door.": ["L8", "4a19af126e13"], "producer": ["L8", "f18122ddebc4"], "The producer can ship within four weeks.": ["L8", "90c0148563b1"], "allocation": ["L8", "950f407814b8"], "Our allocation of the premium wine is only 20 cases.": ["L8", "406c7dad91c7"], "importer of record": ["L8", "70556174ec35"], "As importer of record, we pay the excise tax and import duty.": ["L8", "30c2f5bc79ec"], "sell-out": ["L8", "6870c1fb7ef3"], "We track sell-out in each restaurant every month.": ["L8", "acfe02e24523"], "Which channel will you sell the wine through?": ["L8", "bff9bb645044"], "We will focus on the on-trade, mainly hotels and restaurants, with wines at a mid-range price point.": ["L8", "a325c3053bb2"], "the on-trade": ["L8", "df9827b8b9ee"], "hotels and restaurants": ["L8", "afcf5a115c9a"], "a mid-range price point": ["L8", "214d3f013338"], "How will you protect the wine during shipping?": ["L8", "dba8aa438a81"], "We will use a reefer container to keep the temperature stable, avoid the hottest weeks if possible and insure the shipment.": ["L8", "44e2b302dc9c"], "use a reefer container": ["L8", "dfad2631b426"], "avoid the hottest weeks": ["L8", "5a6b13bcac7a"], "insure the shipment": ["L8", "19ce75bd9153"], "Which costs make wine expensive to import?": ["L8", "9295cc2f52b2"], "The main costs are excise tax, import duty and temperature-controlled freight, plus labelling and storage.": ["L8", "b62f3a98e8a4"], "temperature-controlled freight": ["L8", "2d7e7e55420b"], "What must appear on the back label?": ["L8", "3f9923cd98fc"], "It must show the alcohol content, the region of origin and the importer's details, but we confirm the exact rules with a broker.": ["L8", "81ffa47f0a39"], "the alcohol content": ["L8", "343a851fbd26"], "the region of origin": ["L8", "b255f8fcfc84"], "the importer's details": ["L8", "a4ffb59ed701"], "This is a 2022 Shiraz from South Australia.": ["L8", "01edb426e387"], "It has an alcohol content of 14 percent and rich, dark fruit notes.": ["L8", "e2283ecf89bb"], "It sits at a mid-range price point for hotel wine lists.": ["L8", "186054fbc818"], "We'd like to ship the order in a reefer container because of the summer heat.": ["L8", "1ebe2c97a409"], "Could you confirm the number of cases per pallet?": ["L8", "684ceb162f78"], "We'll add the back labels after the goods arrive.": ["L8", "80a65ae7e286"], "RACI chart": ["L9", "28976733926e"], "Let's update the RACI chart for the robot project.": ["L9", "bf01dbf423f1"], "accountable": ["L9", "1e37365b1a70"], "The founder is accountable for approving new suppliers.": ["L9", "952fee25bc05"], "owner": ["L9", "72122ce96bfe"], "Every task needs one owner and a deadline.": ["L9", "65719ff8565a"], "approval threshold": ["L9", "2ba8d49ca7c4"], "Orders above the approval threshold go to the founder.": ["L9", "9b7390d57d1e"], "checkpoint": ["L9", "a1af74ebd46e"], "QC is a checkpoint: no pass, no shipment.": ["L9", "fe6161574bcc"], "red flag": ["L9", "49a87a7428ff"], "A supplier who refuses to confirm in writing is a red flag.": ["L9", "975aaf8d3f03"], "hand off": ["L9", "5b5fe7e08409"], "Sales hands off the order to operations after the deposit.": ["L9", "2a02a13ce012"], "workflow": ["L9", "2e2e2d35a15a"], "Our export workflow has nine steps.": ["L9", "ae4d9159e36d"], "standard operating procedure (SOP)": ["L9", "92351a1aa8e4"], "We updated the standard operating procedure after the claim.": ["L9", "4bd5a4803f6d"], "tracker": ["L9", "ae2aeb935c2a"], "Please update the tracker before the weekly meeting.": ["L9", "bf23c1b6edf3"], "status meeting": ["L9", "627b36c3a0c6"], "In the status meeting, we only discuss blocked tasks.": ["L9", "5bc8eebe8ff7"], "blocked": ["L9", "61326117ed4a"], "This shipment is blocked until the broker replies.": ["L9", "d9feebafce7f"], "decision log": ["L9", "f1b10afecf59"], "Add the model choice to the decision log.": ["L9", "1a061f3ccb5a"], "margin": ["L9", "d42f4851e770"], "The actual margin was lower than the quoted margin.": ["L9", "77bc457c790b"], "cash flow forecast": ["L9", "86f5646ec2c5"], "The cash flow forecast shows a gap in December.": ["L9", "4ee399bc544e"], "accounts payable": ["L9", "623fa03d9d85"], "Accounts payable increased after the deposit.": ["L9", "83949872e65d"], "accounts receivable": ["L9", "0e4ca924cf66"], "Most of our accounts receivable are under 30 days.": ["L9", "6733c4d4fb41"], "post-shipment review": ["L9", "3602e01a5f55"], "We'll hold a post-shipment review next Monday.": ["L9", "59aa5447b567"], "recurring issue": ["L9", "9a1eee5ce0b0"], "Late documents are a recurring issue with this forwarder.": ["L9", "c323d7def93a"], "close out": ["L9", "d650c221f7a4"], "We can close out the shipment once payment is received.": ["L9", "52aa7b0a0383"], "How do you make sure tasks don't fall through the cracks?": ["L9", "b41f134b8064"], "Every task has one owner and a deadline, and we follow everything in a shared tracker that we review in the weekly status meeting.": ["L9", "33ef4af4743a"], "one owner": ["L9", "1de4a75d49db"], "a deadline": ["L9", "dccc77377d83"], "a shared tracker": ["L9", "77179ea3b24f"], "Which decisions need the founder's approval?": ["L9", "17bbc0f59dd7"], "Anything above the approval threshold goes to the founder, as well as new suppliers and high-risk compliance cases such as lithium batteries.": ["L9", "8736ad6f38f8"], "above the approval threshold": ["L9", "c94ce1be3b09"], "new suppliers": ["L9", "40ab24405ccd"], "high-risk compliance cases": ["L9", "bc5f68355123"], "What do you do when a task is blocked?": ["L9", "ee9115c6eea2"], "I identify exactly what is missing, escalate early if needed and agree on a new deadline with the owner.": ["L9", "c5eda10b22ca"], "identify what is missing": ["L9", "3336453a9749"], "escalate early": ["L9", "93e032259bf7"], "agree on a new deadline": ["L9", "1ece8782ed9d"], "What do you learn from a post-shipment review?": ["L9", "2f73e93be264"], "We compare the actual and quoted margin, list any recurring issues and update the SOP and checklists.": ["L9", "0d2445a58cea"], "the actual and quoted margin": ["L9", "3fd2d4724e33"], "recurring issues": ["L9", "f6efa15c2ca8"], "the SOP": ["L9", "0c4c0a1aaffa"], "Let's go through the blocked tasks first.": ["L9", "2c16c942f22d"], "The robot purchase is blocked until we receive the itemized quotation.": ["L9", "6d46198147bf"], "Who will own the follow-up, and by when?": ["L9", "688fc7200ac1"], "All documents are filed and payment has been received, so we can close out this shipment.": ["L9", "99d2674447aa"], "Our actual margin was two points lower than quoted because of extra freight.": ["L9", "713889c4fee8"], "Let's add that to the SOP so it doesn't become a recurring issue.": ["L9", "5248310c9836"], "order confirmation": ["E21", "c697bcdbd908"], "We sent the order confirmation this morning.": ["E21", "c521ca4aa53b"], "estimated delivery date": ["E21", "858ba9b90f98"], "The estimated delivery date is 15 December.": ["E21", "a8a2f574c3ce"], "dispatch": ["E21", "05b145cfb6fb"], "We will dispatch the goods on Monday.": ["E21", "865a7c851497"], "partial shipment": ["E21", "af44ea33f8d0"], "We can offer a partial shipment of 500 units.": ["E21", "ed3f8ceb81b4"], "backorder": ["E21", "66b000676405"], "The blue model is on backorder until January.": ["E21", "99ccc2923205"], "tracking number": ["E21", "7525badf01e3"], "I will send you the tracking number once it ships.": ["E21", "a0c7848821fd"], "apologize for the inconvenience": ["E21", "3db6616004ff"], "We apologize for the inconvenience caused by the delay.": ["E21", "5b5069f4d1df"], "rest assured": ["E21", "844e140135c6"], "Rest assured, we are following this up with the factory.": ["E21", "48cbaa5f70d9"], "as discussed": ["E21", "ea2a58de5dd7"], "As discussed on the call, we will ship by air.": ["E21", "bcee266b1cfe"], "with reference to": ["E21", "469edbf2cac2"], "With reference to your email of 3 November, we have checked the stock.": ["E21", "37aa5c032992"], wo major defects in the packaging.": ["E22", "e5e60a6f2eaa"], "Could you check the root cause and send us a corrective action plan by Friday?": ["E22", "fccd6a0751f8"], "We would like to place a new order for 2,000 units.": ["E22", "ca10c6d9111b"], "Could you confirm the ready date and the payment terms?": ["E22", "7603aaed3d4e"], "Please send us the pro forma invoice in writing.": ["E22", "a16ec8e58d17"], "booking confirmation": ["E23", "02182e850a7a"], "We received the booking confirmation for the 40-foot container.": ["E23", "ac49e1f91ad2"], "cut-off date": ["E23", "d73dc7db8541"], "The cut-off date for this vessel is 12 December.": ["E23", "e32cbe3c7a79"], "ETD (estimated time of departure)": ["E23", "ee495724d310"], "The ETD is 14 December from Cat Lai port.": ["E23", "2bd7ea26dfb4"], "ETA (estimated time of arrival)": ["E23", "91f599334f9c"], "The ETA at Sydney is 5 January.": ["E23", "1f3688dfdaa6"], "shipping instruction": ["E23", "caf8aa50313e"], "Please send us the shipping instruction by Tuesday noon.": ["E23", "2ccaed727498"], "bill of lading": ["E23", "dabfa697c95f"], "Please check the draft bill of lading carefully.": ["E23", "f637b5167347"], "notify party": ["E23", "9f9f38a6bc58"], "Please add our broker as the notify party.": ["E23", "4a252111d630"], "pick-up": ["E23", "57ef3901e176"], "Can you arrange a pick-up from our warehouse on Monday?": ["E23", "21c35f6c2c35"], "roll over": ["E23", "49c3b25244e7"], "Our container was rolled over to the next vessel.": ["E23", "9a75bf0f3c66"], "transshipment": ["E23", "32fb54c3fb6f"], "The route includes one transshipment in Singapore.": ["E23", "1171c536a580"], "schedule change": ["E23", "cc2264acdef5"], "We were informed of a schedule change this morning.": ["E23", "708cdcc2acc9"], "amend": ["E23", "cc352edb928b"], "Please amend the consignee name on the bill of lading.": ["E23", "a29bf52aa354"], "urgent": ["E23", "8d0cdea0adfc"], "This is urgent, as the cut-off date is tomorrow.": ["E23", "cb026c0f6fe9"], "Ca  is valid until Friday.": ["E31", "be8b62fc7015"], "Payment will be against documents at sight.": ["E31", "c5222c661f22"], "oak barrel": ["E32", "82865d5947fb"], "The wine rests in oak barrels for a year.": ["E32", "cffed717443d"], "tannin": ["E32", "cb803372ce80"], "Young red wines often have strong tannin.": ["E32", "0e16f17baba9"], "appellation": ["E32", "c251bb198c92"], "The wine comes from a famous appellation in Bordeaux.": ["E32", "3de20af41abc"], "alcohol by volume": ["E32", "4b41e4e6746e"], "The alcohol by volume is 13.5 percent.": ["E32", "de7c7ec65fb4"], "blend": ["E32", "f9b1cd1ec91a"], "This red wine is a blend of three grape varieties.": ["E32", "4fed01d8c40f"], "cask": ["E32", "91e3fd6c0281"], "The whisky was aged in oak casks.": ["E32", "dff462ba8e1e"], "aged": ["E32", "3fd8d44ce133"], "The brandy is aged for ten years.": ["E32", "bae86994357f"], "distillery": ["E32", "20dc6b125478"], "We visited the distillery last year.": ["E32", "938b8f5ede42"], "single malt": ["E32", "f20e30c8baed"], "This single malt has a smooth, smoky taste.": ["E32", "27571131e6d5"], "aroma": ["E32", "6a32bbb3481b"], "The wine has an aroma of black fruit and vanilla.": ["E32", "58f1f5c00347"], "palate": ["E32", "8ad2eec9ff90"], "The wine has a fresh palate with a long finish.": ["E32", "6a9d64d6fb41"], "full-bodied": ["E32", "8eef7fa720bc"], "This is a full-bodied red with soft tannins.": ["E32", "dfe6ab81feb0"], "crisp": ["E32", "d7dccdcfa16d"], "The white wine is crisp and not too sweet.": ["E32", "f932e9ad1d8c"], "dry": ["E32", "ef926a85211d"], "We recommend a dry white wine with seafood.": ["E32", "4cd5921b363c"], "sparkling": ["E32", "7521ad334533"], "The sparkling wine is popular for celebrations.": ["E32", "3af9e4c14177"], "cork": ["E32", "e92dae8be39e"], "The bottle is sealed with a natural cork.": ["E32", "4d37939ca5ce"], "harvest": ["E32", "2721c74f6d2d"], "The harvest was early this year because of the warm weather.": ["E32", "a01a1f349e20"], "food pairing": ["E32" <script>
const D=JSON.parse(document.getElementById('data').textContent);
/* x.n is the fixed internal number (it names the stored ids and progress keys); x.pos is the place on the path, easiest to hardest. */
D.weeks.forEach((x,i)=>x.pos=i+1);const byN=n=>D.weeks.find(x=>x.n===n);
const KEY='english-practice-261026';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function sshuffle(a,seed){let s=seed%2147483646+1;const r=()=>(s=s*16807%2147483647)/2147483647;a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pad=n=>String(n).padStart(2,'0');
let week=1,day=1,tab=load().tab||'cards',X=null,P=null;
/* No calendar: the current position is the first lesson not finished yet. */
function curPos(){for(const x of D.weeks)for(let d=1;d<=5;d++)if(!isDone(x.n,d))return [x.n,d];return [D.weeks[D.weeks.length-1].n,5]}

/* Spaced repetition: every item (word, Coach question, speaking scene, quiz question) sits in a box 0-6. A success moves it up and books the next review 1, 3, 7, 14, 30 or 60 days later (tomorrow, 3 days, a week, two weeks, a month, two months); a miss sends it back to tomorrow. */
const IV=[1,1,3,7,14,30,60];
const todayN=()=>{const n=new Date();return Math.floor((n.getTime()-n.getTimezoneOffset()*6e4)/864e5)};
const srsGet=id=>(load().srs||{})[id]||null;
const bx=id=>(srsGet(id)||{b:0}).b;
function srsRate(id,ok){const d=load();d.srs=d.srs||{};const t=todayN(),s=d.srs[id]||{b:0,due:t,last:-1};
  if(ok&&s.last===t&&s.b>0)return s;
  s.b=ok?Math.min(6,s.b+1):0;s.due=t+IV[s.b];s.last=t;d.srs[id]=s;store(d);return s}
const ITEMS=[];
D.weeks.forEach(x=>{if(x.mix)return;const nn=x.n,w=x.pos,base=(w-1)*5,add=(kind,list,pre,day)=>list.forEach((r,i)=>{if(!r.id)r.id=pre+nn+'-'+i;ITEMS.push({id:r.id,kind:kind,w:w,g:base+day(i),ref:r})});
  add('vocab',x.vocab,'v',i=>i%4+1);add('coach',x.coach,'c',i=>i%4+1);add('speak',x.speak,'s',i=>(i+1)%4+1);add('quiz',x.quiz,'q',i=>[1,3,2,4][i%4])});
/* A lesson counts as finished only when it was finished with all its current parts. Finishing stores a signature of the lesson's fixed content (PARTS: bump it when a new kind of exercise is added to lessons; the new items of the lesson; whether it has the email exercise). If new parts are added later, the signature no longer matches and the lesson shows as not finished, so you know to go back. Old finished marks (value 1) stay valid except for lessons that gained the email exercise afterwards (lesson 4, 5 and the final review). */
const PARTS='a1';
function lsig(x,d){const ids=ITEMS.filter(i=>i.w===x.pos&&i.g===(x.pos-1)*5+d).map(i=>i.id).join(',');let h=5381;for(let i=0;i<ids.length;i++)h=(h*33+ids.charCodeAt(i))>>>0;return PARTS+'.'+h.toString(36)+((x.mix||d>=4)?'E':'')}
function isDone(n,d){const v=(load().days||{})[n+'-'+d];if(!v)return false;const x=byN(n);if(v===1)return !(x.mix||d>=4);return v===lsig(x,d)}
{const p=curPos();week=p[0];day=p[1]}
function srsSummary(){const d=load().srs||{},t=todayN(),o={tomorrow:0,week:0,month:0,known:0,total:ITEMS.filter(i=>i.kind==='vocab').length};
  ITEMS.forEach(it=>{const s=d[it.id];if(!s)return;const n=s.due-t;if(n<=1)o.tomorrow++;else if(n<=7)o.week++;else o.month++;if(it.kind==='vocab'&&s.b>=3)o.known++});return o}

/* Lesson plan, about 15 minutes. Each topic has 5 lessons and 20 new words (8 on the topic, 12 on supply chain or the topic's own list). Lessons 1-4: the lesson's new items plus the reviews that are due (5 new words + up to 6 due, Coach, one scene, one quiz question). Lesson 5: the topic's review (the 12 weakest words of the topic). Lesson 5 of every 4th topic (4, 8, 12, 16, 20, 24): the weakest items of those four topics. The last topic: the weakest items of the whole course. */
function plan(x,d){
  const w=x.pos,g=(w-1)*5+d,t=todayN(),rv=d===5,month=!x.mix&&rv&&w%4===0;
  const st=it=>srsGet(it.id)||{b:0,due:t,last:-1};
  const pool=kind=>ITEMS.filter(it=>it.kind===kind);
  const fresh=kind=>pool(kind).filter(it=>it.g===g).map(it=>it.ref);
  const due=(kind,cap)=>pool(kind).filter(it=>it.g<g&&st(it).due<=t).sort((a,b)=>st(a).due-st(b).due||st(a).b-st(b).b||a.g-b.g).slice(0,cap).map(it=>it.ref);
  const weak=(kind,k,from,to)=>pool(kind).filter(it=>it.w>=from&&it.w<=to).sort((a,b)=>st(a).b-st(b).b||st(a).due-st(b).due||a.g-b.g).slice(0,k).map(it=>it.ref);
  let r,kind;
  if(x.mix){const e=D.weeks.filter(v=>!v.mix);kind='Final review';
    r={vocab:weak('vocab',10,1,D.weeks.length-1),fresh:[],quiz:weak('quiz',3,1,D.weeks.length-1),coach:weak('coach',3,1,D.weeks.length-1),speak:weak('speak',2,1,D.weeks.length-1),email:sshuffle(e.map(v=>v.email),d*7919+5)[0]}}
  else if(month){kind='Extended review';
    r={vocab:weak('vocab',10,w-3,w),fresh:[],quiz:weak('quiz',3,w-3,w),coach:weak('coach',3,w-3,w),speak:weak('speak',1,w-3,w),email:x.email}}
  else if(rv){kind='Topic review';
    r={vocab:weak('vocab',12,w,w),fresh:[],quiz:pool('quiz').filter(it=>it.w===w).map(it=>it.ref),coach:weak('coach',3,w,w),speak:weak('speak',1,w,w),email:x.email}}
  else{kind='Learn and review';const fv=fresh('vocab'),fc=fresh('coach');
    r={vocab:fv.concat(due('vocab',6)),fresh:fv.map(v=>v.id),quiz:fresh('quiz').concat(due('quiz',1)),coach:fc.concat(due('coach',2)).slice(0,Math.max(2,fc.length)),speak:fresh('speak').concat(due('speak',1)).slice(0,2),email:d>=4?x.email:null}}
  r.kind=kind;r.min=Math.max(5,Math.round(r.vocab.length*.5+r.coach.length*1.5+r.speak.length*1.2+r.quiz.length*.5+(r.email?3:0)));
  return r;
}
const dk=()=>week+'-'+day;

  $('dy').innerHTML=[1,2,3,4,5].map(d=>'<option value="'+d+'"'+(d===day?' selected':'')+'>Lesson '+d+(d===5?(X.mix?' · final review':X.pos%4===0?' · extended review':' · topic review'):'')+(isDone(week,d)?' ✓':'')+'</option>').join('');
  const mp=[['Cards',P.vocab.length*.5],['Coach',P.coach.length*1.5],['Speak',P.speak.length*1.2],['Quiz',P.quiz.length*.5],['Email',P.email?3:0]].filter(a=>a[1]>0).map(a=>a[0]+' ~'+Math.max(1,Math.round(a[1]))+' min').join(' + ');
  $('lvl').textContent='Topic '+X.pos+' · '+phase(week);$('topic').textContent=X.en;
  $('mins').textContent=P.kind+' · about '+P.min+' min: '+mp;progress();
}
function progress(){
  const d=load(),qb=(d.quiz||{})[dk()],eb=(d.email||{})[dk()];
  const parts=['Words learned '+ITEMS.filter(i=>i.kind==='vocab'&&(d.srs||{})[i.id]).length+'/'+ITEMS.filter(i=>i.kind==='vocab').length,'Cards in this lesson '+P.fresh.length+' new, '+(P.vocab.length-P.fresh.length)+' review'];

function best(kind,v,total){const d=load();d[kind]=d[kind]||{};const old=d[kind][dk()];if(kind==='email'){const o=old?+old.split('/')[0]:-1;if(v>o)d[kind][dk()]=v+'/'+total}else if(!(old>=v))d[kind][dk()]=v;store(d);progress()}
function markDone(){}

const TABS={cards:'Cards',coach:'Coach',quiz:'Quiz',speak:'Speak',email:'Email'};
function avail(){return Object.keys(TABS).filter(t=>(t==='cards'?P.vocab.length:t==='email'?!!P.email:P[t].length))}

/* Audio: recorded clips (one bundle per week) play even in Silent mode; the browser voice is the fallback */
const canSay='speechSynthesis' in window;
const AU=new Audio(),bundles={};
function dayTexts(){return [...P.vocab.flatMap(v=>[v.en,v.ex]),...P.coach.flatMap(c=>[c.q,c.sa,...c.ph,...c.ss]),...P.speak.flatMap(s=>s.l)]}
function preload(){new Set(dayTexts().map(t=>(D.audio[t]||[])[0]).filter(Boolean)).forEach(w=>{if(!(w in bundles)){bundles[w]=null;fetch('audio/w'+w+'.json').then(r=>r.ok?r.json():{}).then(m=>{bundles[w]=m}).catch(()=>{bundles[w]={}})}})}
function clip(t){const a=D.audio[t],m=a&&bundles[a[0]];return m&&m[a[1]]?'data:audio/mpeg;base64,'+m[a[1]]:null}
function note(msg){let n=$('sayNote');if(!n){n=document.createElement('p');n.id='sayNote';n.className='hint note';$('panel').prepend(n)}n.textContent=msg}
var PT=0;
function stopAudio(){PT++;AU.onended=null;AU.pause();if(canSay)speechSynthesis.cancel()}
function tts(t,done,slow){
  if(!canSay){note('Audio is not available on this device.');if(done)done();return}

  const vs=speechSynthesis.getVoices(),v=vs.find(x=>/^en[-_]US/i.test(x.lang))||vs.find(x=>/^en/i.test(x.lang));if(v)u.voice=v;
  u.onend=done||null;speechSynthesis.speak(u);

const pendingClip=t=>{const a=D.audio[t];return !!a&&bundles[a[0]]===null};
var LASTPLAY=null;
function play(t,done,slow,n){const my=PT;n=n||0;if(!n)LASTPLAY={t:t,rec:!!D.audio[t],slow:!!slow,at:Date.now()};

const line=t=>'<li><span>'+esc(t)+'</span>'+sayBtn(t)+'</li>';

/* Speaking check: speech recognition compares what you said with the line word by word; without it, record yourself and listen back */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const canRec=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
const canMic=!!SR||canRec;
let REC=null,MR=null,drillT=0;
const MINE=new Audio();
const words=t=>t.toLowerCase().replace(/['’]/g,'').replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean);
function hits(ref,heard){const n=ref.length,m=heard.length,L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=ref[i]===heard[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const hit=new Array(n).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(ref[i]===heard[j]){hit[i]=true;i++;j++}else if(L[i+1][j]>=L[i][j+1])i++;else j++}
  return hit}
function grade(text,heard){
  const toks=text.split(/\s+/),ref=[],own=[],ok=toks.map(()=>null);
  toks.forEach((t,k)=>words(t).forEach(w=>{ref.push(w);own.push(k)}));
  const hit=hits(ref,words(heard));
  ref.forEach((w,x)=>{const k=own[x];ok[k]=ok[k]!==false&&hit[x]});
  return {score:Math.round(100*hit.filter(Boolean).length/Math.max(1,ref.length)),
    html:toks.map((t,k)=>'<span class="'+(ok[k]===null?'':ok[k]?'w-ok':'w-miss')+'">'+esc(t)+'</span>').join(' ')}}
function stopMic(){clearTimeout(drillT);MINE.pause();
  if(REC){REC._dead=true;try{REC.abort()}catch(e){}REC=null}
  if(MR){MR._dead=true;try{if(MR.state!=='inactive')MR.stop();MR.stream.getTracks().forEach(t=>t.stop())}catch(e){}MR=null}
  document.querySelectorAll('button.rec').forEach(b=>{b.classList.remove('rec');b.textContent=b.dataset.label||b.textContent})}
function micErr(err){return err==='not-allowed'||err==='service-not-allowed'?'The microphone is blocked here. Allow it in the browser or site settings, or open the app in a normal browser tab.':err==='no-speech'||!err?'I did not hear anything. Try again, closer to the microphone.':'Speech check stopped ('+err+'). Try again.'}
function listen(btn,id,long,live,cb){
  stopAudio();stopMic();

{const o=micErr;micErr=function(e){return (e&&String(e).startsWith('gum:')?'This page is not allowed to use the microphone inside the Claude app frame, so recording and speech scoring are unavailable. Say the sentence yourself, then tap I said it. To get scoring, try opening the link in regular Chrome or Safari.':o(e))+' ['+(e||'-')+' · SR='+(SR?1:0)+' rec='+(canRec?1:0)+']'}}

/* Fallback without speech recognition: record, then play the model line and your own voice back to back */
function recordMine(btn,id,text,fb,after){
  if(MR&&MR._id===id){MR.stop();return}

  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    const chunks=[],m=new MediaRecorder(stream);MR=m;m._id=id;
    btn.dataset.label=btn.dataset.label||btn.textContent;btn.classList.add('rec');btn.textContent='● Tap to stop';
    m.ondataavailable=e=>chunks.push(e.data);
    m.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(m._dead)return;MR=null;btn.classList.remove('rec');btn.textContent=btn.dataset.label;
      MINE.src=URL.createObjectURL(new Blob(chunks,{type:m.mimeType}));
      fb.innerHTML='<p class="hint">Model, then you. Compare the rhythm and the stressed words.</p>';

/* Drill: for each line the model plays, you say it, the score shows, then the next line; hide the text first to drill from memory */

    const id='l'+i+'_'+j,t=ls[j];out.textContent='Line '+(j+1)+' of '+ls.length+': listen, then speak.';
