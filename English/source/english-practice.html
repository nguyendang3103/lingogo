  async send(){if(!this.ref)return;try{await this.ref.set({json:JSON.stringify(load()),t:Date.now()});this.say('☁ Synced')}catch(e){this.say('☁ Sync failed')}},
  async pull(){if(!this.ref)return;
    try{const snap=await this.ref.get(),rem=snap.exists&&snap.data().json?JSON.parse(snap.data().json):{},loc=load(),m=mergeAll(loc,rem),ms=JSON.stringify(m);
      const changed=ms!==JSON.stringify(loc);
      if(changed)try{localStorage.setItem(KEY,ms)}catch(e){}
      if(ms!==JSON.stringify(rem))await this.send();else this.say('☁ Synced');
      if(changed&&!L&&$('vPractice').hidden){const v=!$('vLearn').hidden?'learn':'plan';setDay(week,day);view(v)}}
    catch(e){this.say('☁ Sync failed')}}};
setDay(week,day);
view('learn');

/* Move progress between the index.html file version (speech scoring works) and the claude.ai version: Export to a code, paste it into the Import box on the other one; Import merges, nothing is lost. */
(()=>{const el=$('xfer');
  el.innerHTML='<h2 style="margin:0;font-size:18px">Move progress</h2><p class="hint">Use this when you open the app from the index.html file (speech scoring works) and want to share progress with the claude.ai version: Export here, paste into the box and Import on the other one. Import merges, nothing is lost.</p><textarea id="xtext" rows="3" spellcheck="false" style="width:100%;box-sizing:border-box;font:13px ui-monospace,Consolas,monospace;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)"></textarea><div class="row"><button id="xout">Export</button><button class="alt" id="xin">Import</button></div><p class="hint" id="xmsg"></p>';
  $('xout').onclick=async()=>{const t=JSON.stringify(load()),a=$('xtext');a.value=t;a.select();let ok=false;
    try{await navigator.clipboard.writeText(t);ok=true}catch(e){try{ok=document.execCommand('copy')}catch(e2){}}
    $('xmsg').textContent=ok?'Copied. Paste it into this box on the other device or version, then tap Import.':'Could not copy automatically: click the box, then Ctrl+A, Ctrl+C.'};
  $('xin').onclick=()=>{try{const r=JSON.parse($('xtext').value.trim());if(!r||typeof r!=='object'||Array.isArray(r))throw 0;
      store(mergeAll(load(),r));$('xtext').value='';$('xmsg').textContent='Progress merged.';setDay(week,day);view('plan')}
    catch(e){$('xmsg').textContent='That code is not valid. Tap Export on the other version and paste it here exactly.'}}})();

/* Feedback: the 🚩 button on every screen (inside a lesson it sits next to the close button). Each report is saved as a document feedback/<id> in the artifact db with the context: topic, lesson, exercise, the item on screen, the last clip played (and whether a recorded clip exists), a text snapshot of the screen. Claude reads the reports with status "new", fixes the app and sets the status. Without db (opened from the file) the report stays on this device and can be copied. */
var FBDB=null,FBUID=null,FBCTX=null,fbSel='audio';
const FBKEY='english-practice-feedback';
const fbQueue=()=>{try{return JSON.parse(localStorage.getItem(FBKEY))||[]}catch(e){return[]}};
const fbSave=q=>{try{localStorage.setItem(FBKEY,JSON.stringify(q))}catch(e){}};
const FBCAT=[['audio','Wrong pronunciation'],['content','Wrong content'],['vi','Wrong Vietnamese meaning'],['bug','App bug'],['idea','Other']];
function fbItem(){const o={},w=v=>({id:v.id,en:v.en,vi:v.vi,ex:v.ex,vn:v.vn}),qz=q=>({id:q.id,s:q.s,why:q.why}),co=c=>({id:c.id,q:c.q,lab:c.lab,src:c.src});
  if(L&&L.cur){const e=L.cur;o.exercise=e.t;
    if(e.v)o.word=w(e.v);if(e.q)o.quiz=qz(e.q);if(e.c)o.coach=co(e.c);if(e.t==='say'&&e.text)o.line=e.text}
  else{if(tab==='cards'&&queue[0])o.word=w(queue[0]);
    if(tab==='quiz'&&typeof qs!=='undefined'&&qs[qi])o.quiz=qz(qs[qi])}
  return o}
function fbContext(){const inL=!!L&&!$('lesson').hidden,v=inL?'lesson':!$('vLearn').hidden?'learn':!$('vPlan').hidden?'plan':'practice';
  const shot=(inL?$('lbody').innerText+' | '+$('lfb').innerText:v==='practice'?$('panel').innerText:v==='plan'?$('planPanel').innerText:'').replace(/\s+/g,' ').slice(0,600);
  return {view:v,topic:week,topicNo:X?X.pos:0,lesson:day,topicName:X?X.en:'',tab:tab,
    lastPlay:LASTPLAY?{text:LASTPLAY.t,recorded:LASTPLAY.rec,slow:LASTPLAY.slow,secondsAgo:Math.round((Date.now()-LASTPLAY.at)/1000)}:null,
    item:fbItem(),screen:shot,fromFile:location.protocol==='file:',ua:navigator.userAgent.slice(0,110)}}
function fbDraw(){const b=document.querySelector('#fbm .fbbox');
  b.innerHTML='<h2 id="fbt">Report a problem</h2><p class="hint">Pick the kind of problem and describe it briefly. It is saved with exactly what you are looking at; Claude will read it and fix the app.</p>'+
    '<div class="chips">'+FBCAT.map(k=>'<button class="chip'+(k[0]===fbSel?' on':'')+'" data-fbc="'+k[0]+'">'+esc(k[1])+'</button>').join('')+'</div>'+
    '<textarea id="fbtext" rows="3" placeholder="Example: the word is read wrongly, or the Vietnamese meaning is not right">'+esc(($('fbtext')||{}).value||'')+'</textarea>'+
    '<details><summary>Attached information</summary><pre>'+esc(JSON.stringify(FBCTX,null,1))+'</pre></details>'+
    '<div class="row"><button id="fbsend">Send</button><button class="alt" id="fbcopy">Copy</button><button class="alt" id="fbclose">Close</button></div><p class="hint" id="fbmsg"></p>'}
function fbOpen(){FBCTX=fbContext();stopAudio();$('fbm').hidden=false;fbDraw();try{$('fbtext').focus()}catch(e){}}
function fbClose(){$('fbm').hidden=true}
async function fbFlush(){const q=fbQueue();if(!q.length)return 0;if(!FBDB)return -1;let sent=0;
  for(const r of q.slice()){try{await FBDB.doc('feedback/'+r.id).set({id:r.id,status:'new',app:'english',cat:r.cat,text:r.text,topic:r.ctx.topic,lesson:r.ctx.lesson,view:r.ctx.view,exercise:(r.ctx.item||{}).exercise||'',by:FBUID||'',t:r.t,ctx:JSON.stringify(r.ctx)});
      fbSave(fbQueue().filter(x=>x.id!==r.id));sent++}catch(e){return sent||-2}}
  return sent}
async function fbSend(){const text=($('fbtext').value||'').trim(),m=$('fbmsg');
  if(!text&&fbSel!=='audio'){m.textContent='Please describe the problem briefly.';return}
  const rec={id:'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),cat:fbSel,text:text,ctx:FBCTX,t:Date.now()};
  const q=fbQueue();q.push(rec);fbSave(q);$('fbsend').disabled=true;
  const r=await fbFlush();
  if(r>0){m.textContent='Sent. Ask Claude to "process feedback" to fix the app.';$('fbtext').value='';setTimeout(fbClose,1800)}
  else{$('fbsend').disabled=false;m.textContent=r===-1?'Not sent because the app is open from a file (no db). Kept on this device; tap Copy and send it to Claude, or open the claude.ai version to send it yourself.':'Could not send; kept on this device and will retry next time. You can tap Copy.'}}
async function fbCopy(){const t=JSON.stringify({cat:fbSel,text:($('fbtext').value||'').trim(),ctx:FBCTX},null,1);let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true}catch(e){try{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch(e2){}}
  $('fbmsg').textContent=ok?'Copied. Paste it to Claude.':'Could not copy; open "Attached information" and copy it by hand.'}
$('fbfab').onclick=fbOpen;$('lrep').onclick=fbOpen;
$('fbm').addEventListener('click',e=>{const t=e.target;
  if(t===$('fbm')||t.id==='fbclose')return fbClose();
  const c=t.closest('[data-fbc]');if(c){fbSel=c.dataset.fbc;const v=$('fbtext').value;fbDraw();$('fbtext').value=v;return}
  if(t.id==='fbsend')fbSend();else if(t.id==='fbcopy')fbCopy()});

(async()=>{try{
  if(typeof claude==='undefined'||!claude.use)return;
  const db=await claude.use('db'),user=await claude.use('user');if(!db||!user)return;
  FBDB=db;FBUID=await user.id();fbFlush();
  SYNC.ref=db.doc('data/users/'+FBUID+'/progress');
  await SYNC.pull();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)SYNC.pull()})}catch(e){}})();
</script>
