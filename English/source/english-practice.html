<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one column; week picker, practice tabs, one practice panel. Serif for the English being learned, system sans for the interface. */
:root{
  --bg:#f4f5f8;--card:#ffffff;--fg:#1a2233;--mut:#5f6b80;--line:#d7dce6;
  --ac:#2f4fb5;--ac-fg:#ffffff;--ac-soft:#e6ebf8;--ok:#1d7f46;--bad:#b4322a;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141c;--card:#1a2030;--fg:#e7ebf3;--mut:#9aa5ba;--line:#2c3549;
  --ac:#8ea8ff;--ac-fg:#0d1530;--ac-soft:#232d48;--ok:#4cc584;--bad:#f2766c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141c;--card:#1a2030;--fg:#e7ebf3;--mut:#9aa5ba;--line:#2c3549;
  --ac:#8ea8ff;--ac-fg:#0d1530;--ac-soft:#232d48;--ok:#4cc584;--bad:#f2766c;color-scheme:dark}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font:700 26px/1.2 var(--serif);margin:0;text-wrap:balance}
.week{display:flex;flex-direction:column;gap:6px}
select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-width:100%}
.topic{margin:0;font-weight:600}
.topic-vi,.prog{margin:0;color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums}
.mins{margin:0;font-size:14px;font-weight:600;color:var(--fg)}
.lvl{display:inline-block;margin:0;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ac)}
.lines li>div{flex:1 1 220px;min-width:0}
.lines li>b{font-variant-numeric:tabular-nums}
.tabs{gap:4px;background:var(--line);padding:4px;border-radius:12px}
.tabs button{background:transparent;color:var(--fg);padding:9px 4px;font-size:14px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:var(--ac);color:var(--ac-fg);cursor:pointer;min-height:44px}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>button{flex:1}
.row>button.say{flex:none}
.saygrp{display:inline-flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.say{font:600 13px/1 var(--sans)}
.lines li,.ex{flex-wrap:wrap}
.lines li>span:first-child,.ex>span:first-child{flex:1 1 220px;min-width:0}
.note{color:var(--bad)}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.term{font:700 30px/1.25 var(--serif);text-align:center;margin:18px 0 6px;overflow-wrap:anywhere}
.vi{text-align:center;font-size:18px;margin:0}
.vn{text-align:center;font-size:15px;color:var(--mut);margin:4px 0 0}
.ex{font:500 18px/1.5 var(--serif);background:var(--ac-soft);border-radius:10px;padding:12px 14px;margin:0;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.say{flex:none;display:inline-flex;align-items:center;text-decoration:none;border-radius:10px;min-height:36px;padding:6px 10px;background:transparent;color:var(--ac);border:1px solid var(--line);font-size:13px}
.situ{margin:0;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--line);font:500 17px/1.4 var(--serif)}
.opts button.ok{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.opts button.bad{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.why{margin:0;font-size:15px}
.why b.ok{color:var(--ok)}.why b.bad{color:var(--bad)}
.result{font:700 28px/1.2 var(--serif);text-align:center;margin:8px 0 0;font-variant-numeric:tabular-nums}
.hint{color:var(--mut);font-size:14px;margin:0}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lines li{font:500 18px/1.5 var(--serif);display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:8px}
.masked .lines li .ttext{filter:blur(6px);user-select:none}
.lines li>.ttext{flex:1 1 220px;min-width:0}
.fb{flex-basis:100%;font:500 17px/1.5 var(--serif)}
.fb:empty{display:none}
.fb .hint{font-family:var(--sans);margin-top:4px}
.w-ok{color:var(--ok)}
.w-miss{color:var(--bad);text-decoration:underline wavy}
.sc{font:700 15px var(--sans);margin-left:10px}
.sc.ok{color:var(--ok)}.sc.bad{color:var(--bad)}
.say.rec,button.rec{background:var(--bad);color:#fff;border-color:var(--bad)}
.speak-block{display:flex;flex-direction:column;gap:10px}
.speak-block+.speak-block{border-top:2px solid var(--line);padding-top:14px}
.mail{font:500 17px/2.1 var(--serif);white-space:normal;overflow-wrap:anywhere}
.mail select{font:600 15px var(--sans);padding:4px 6px;margin:0 2px;max-width:100%}
.mail select.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.mail select.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}

.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick select{flex:1 1 150px;min-width:0}
.tabs{display:flex}
.tabs button{flex:1;min-width:0}
.src{margin:0;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ac)}
.qline{font-weight:700}
.struct{margin:0;font-size:15px;background:var(--ac-soft);border-radius:8px;padding:8px 10px}
.struct b{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:6px 12px;border-radius:999px;background:transparent;color:var(--fg);border:1px solid var(--line);font:500 15px/1.2 var(--serif)}
/* Learn path, lesson flow and bottom navigation (Duolingo-style) */
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body.inl{overflow:hidden}
body.inl main,body.inl .bnav{display:none}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--line)}
.bnav button{flex:1;max-width:180px;background:transparent;color:var(--mut);font:700 13px/1.2 var(--sans);padding:8px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px}
.bnav button span{font-size:22px;line-height:1}
.bnav button.on{background:var(--ac-soft);color:var(--ac);box-shadow:inset 0 0 0 2px var(--ac)}
.stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.st{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:700;font-variant-numeric:tabular-nums}
.st.goal{position:relative;overflow:hidden;flex:1 1 140px;min-width:140px;text-align:center;padding:8px 12px}
.st.goal i{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--ok) 25%,transparent)}
.st.goal em{position:relative;font-style:normal;font-size:14px}
.hero{display:flex;flex-direction:column;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px}
.hero p{margin:0}
.bigbtn{width:100%;padding:14px 16px;border-radius:14px;font:800 16px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;min-height:52px;box-shadow:0 4px 0 color-mix(in srgb,var(--ac) 65%,#000)}
.bigbtn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--ac) 65%,#000)}
.bigbtn:disabled{background:var(--line);color:var(--mut);box-shadow:none;cursor:default}
.wk{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.wkh{display:flex;flex-direction:column;gap:2px;background:var(--ac-soft);border-radius:14px;padding:10px 14px}
.nodes{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0 10px}
.node{width:58px;height:58px;min-height:58px;border-radius:50%;padding:0;font:800 20px/1 var(--sans);background:var(--card);color:var(--mut);border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}
.node.done{background:var(--ok);color:#fff;border-color:var(--ok);box-shadow:0 5px 0 color-mix(in srgb,var(--ok) 60%,#000)}
.node.star{border-radius:18px}
.node.cur{background:var(--ac);color:var(--ac-fg);border-color:var(--ac);box-shadow:0 5px 0 color-mix(in srgb,var(--ac) 60%,#000),0 0 0 6px var(--ac-soft)}
#lesson{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
#lesson[hidden]{display:none!important}
.lhead{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:560px;width:100%;margin:0 auto;box-sizing:border-box}
.lx{min-height:40px;min-width:40px;padding:0;background:transparent;color:var(--mut);font-size:22px}
.pbar{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .3s}
.lbody{flex:1;overflow:auto;padding:8px 16px 24px;max-width:560px;width:100%;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
.lbar{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line);background:var(--bg)}
.lbar .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.lbar.ok{background:color-mix(in srgb,var(--ok) 16%,var(--bg))}
.lbar.bad{background:color-mix(in srgb,var(--bad) 16%,var(--bg))}
.lbar.ok .fbt{color:var(--ok)}.lbar.bad .fbt{color:var(--bad)}
.lbar.bad .bigbtn{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,#000)}
.lbar.ok .bigbtn{background:var(--ok);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 60%,#000)}
.fbt{font:800 20px/1.2 var(--sans)}
.fbd{font-size:15px}
.lskip{background:transparent;color:var(--mut);border:0;text-decoration:underline;min-height:36px}
.qtitle{margin:0;font:800 22px/1.25 var(--sans)}
.big{font:700 38px/1.2 var(--serif);text-align:center;margin:10px 0 0;overflow-wrap:anywhere}
.sent{margin:0;font:500 22px/1.5 var(--serif)}
.big2{font-size:26px}
.blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--ac)}
.c{justify-content:center}
.row.c>button{flex:none}
.spk{width:96px;height:96px;border-radius:50%;font-size:40px;padding:0;box-shadow:0 5px 0 color-mix(in srgb,var(--ac) 65%,#000)}
.opt{border:2px solid var(--line)!important;border-bottom-width:4px!important;border-radius:14px!important;background:var(--card);color:var(--fg)}
.opt.sel{border-color:var(--ac)!important;background:var(--ac-soft)}
.opt .kbd{display:inline-block;min-width:1.5em;margin-right:10px;padding:0 4px;border:1px solid var(--line);border-radius:6px;font:700 13px/1.6 var(--sans);text-align:center;color:var(--mut)}
.opt.ok{border-color:var(--ok)!important;background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.opt.bad{border-color:var(--bad)!important;background:color-mix(in srgb,var(--bad) 16%,var(--card))}
.opt:disabled{opacity:1}
.qbox{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);font:600 20px/1.4 var(--serif)}
.qbox span{flex:1 1 200px;min-width:0}
.ansarea{min-height:64px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chipw{min-height:44px;padding:8px 14px;border-radius:12px;background:var(--card);color:var(--fg);border:2px solid var(--line);border-bottom-width:4px;font:500 18px/1.2 var(--serif)}
.chipw.used{opacity:.25}
.okbox{border-color:var(--ok)!important}.badbox{border-color:var(--bad)!important}
.typein{font:500 22px var(--serif);padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);width:100%;box-sizing:border-box}
.done{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:20px}
.done h2{margin:0;font:800 28px/1.2 var(--sans)}
.trophy{font-size:72px;line-height:1}
.sgrid{display:flex;gap:10px;width:100%}
.sbox{flex:1;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.sbox em{display:block;font:800 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:6px;color:#fff;font-style:normal}
.sbox b{display:block;font:800 22px var(--sans);padding:12px 6px;font-variant-numeric:tabular-nums}
.sbox.xp em{background:#d99a00}.sbox.acc em{background:var(--ok)}.sbox.tm em{background:var(--ac)}
.streak{margin:0;font:800 22px var(--sans)}
/* Compact answer screens in lessons: smaller type box, buttons side by side, quieter mic message */
#lbody>*{flex-shrink:0}
#lbody textarea.typein{min-height:56px}
#lbody .typein{font:14px/1.4 var(--sans);padding:8px 10px;border-width:1px;border-radius:10px}
#lbody.coach{gap:10px}
#lbody.coach .qbox{font-size:18px;padding:10px 12px}
#lbody.coach .struct{font-size:14px;padding:6px 10px}
#lbody.coach .chip{min-height:32px;padding:4px 10px;font-size:14px}
#lbody.coach .cbtns button{min-height:40px;padding:8px 12px;font-size:14px}
#lbody .fb{font:13px/1.4 var(--sans)}
#lbody .fb .w-miss{text-decoration:none}
/* Feedback button and dialog */
.fbfab{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:11;min-height:40px;padding:8px 14px;border-radius:999px;background:var(--card);color:var(--fg);border:2px solid var(--line);font:700 13px/1 var(--sans);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.fbfab i{font-style:normal}
body.inl .fbfab{display:none}
#lrep{font-size:20px}
#fbm{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
#fbm[hidden]{display:none!important}
.fbbox{background:var(--bg);color:var(--fg);width:100%;max-width:560px;max-height:92%;overflow:auto;box-sizing:border-box;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0;display:flex;flex-direction:column;gap:12px}
.fbbox h2{margin:0;font:800 20px/1.2 var(--sans)}
.fbbox textarea{width:100%;box-sizing:border-box;font:16px/1.4 var(--sans);padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg)}
.fbbox details{font-size:13px;color:var(--mut)}
.fbbox pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 0;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;max-height:160px;overflow:auto}
.chip.on{background:var(--ac-soft);border-color:var(--ac);color:var(--ac)}
#vLearn,#vPractice,#vPlan{display:flex;flex-direction:column;gap:14px}
#vLearn[hidden],#vPractice[hidden],#vPlan[hidden]{display:none!important}
</style>
<main>
  <section id="vLearn"></section>
  <section id="vPractice" hidden>
  <header class="week">
    <h1>Practice</h1>
    <label for="wk" class="hint">33 topics · 5 lessons each · about 15 minutes a lesson · spaced review</label>
    <div class="pick"><select id="wk" aria-label="Topic"></select><select id="dy" aria-label="Lesson"></select></div>
    <p class="lvl" id="lvl"></p>
    <p class="topic" id="topic"></p>
    <p class="mins" id="mins"></p>
    <p class="prog" id="prog"></p>
  </header>
  <nav class="tabs" role="tablist" aria-label="Practice type" id="tabs"></nav>
  <section class="panel" id="panel" aria-live="polite"></section>
  </section>
  <section id="vPlan" hidden><h1>Plan</h1><section class="panel" id="planPanel"></section>
  <section class="panel" id="xfer"></section></section>
</main>
<nav class="bnav" id="bnav" aria-label="Main"><button id="nLearn" class="on" onclick="view('learn')"><span>🏠</span>Learn</button><button id="nPractice" style="display:none" onclick="view('practice')"><span>🎯</span>Practice</button><button id="nPlan" onclick="view('plan')"><span>📊</span>Plan</button></nav>
<button id="fbfab" class="fbfab" aria-label="Report a problem"><span>🚩</span> <i>Feedback</i></button>

  <div class="lbody" id="lbody"></div>

</div>
<script type="application/json" id="data">{"weeks": [{"n": 1, "en": "Meeting basics and introducing yourself", "vi": "", "vocab": [{"id": "w1-0", "en": "agenda", "vi": "the list of topics for a meeting", "ex": "Let's go through the agenda first.", "vn": "chương trình họp"}, {"id": "w1-1", "en": "chair a meeting", "vi": "lead a meeting", "ex": "I'll chair today's meeting.", "vn": "chủ trì cuộc họp"}, {"id": "w1-2", "en": "be in charge of", "vi": "be responsible for something or someone", "ex": "I'm in charge of key accounts in the South.", "vn": "phụ trách"}, {"id": "w1-3", "en": "be responsible for", "vi": "have the duty to do or manage something", "ex": "I'm responsible for order processing and reporting.", "vn": "chịu trách nhiệm"}, {"id": "w1-4", "en": "minutes", "vi": "the written record of a meeting", "ex": "Could you take the minutes today?", "vn": "biên bản họp"}, {"id": "w1-5", "en": "action item", "vi": "a task someone must do after a meeting", "ex": "Let's recap the action items.", "vn": "việc cần làm sau họp"}, {"id": "w1-6", "en": "follow up", "vi": "contact someone again or check progress", "ex": "I'll follow up with the supplier tomorrow.", "vn": "theo dõi, liên hệ lại"}, {"id": "w1-7", "en": "clarify", "vi": "make something easier to understand", "ex": "Could you clarify the delivery date?", "vn": "làm rõ"}, {"id": "w1-8", "en": "supply chain", "vi": "the network of companies and steps that moves a product from raw materials to the customer", "ex": "Our supply chain runs from suppliers in China to customers in Europe.", "vn": "chuỗi cung ứng"}, {"id": "w1-9", "en": "supplier", "vi": "a company that provides goods or materials to another company", "ex": "We have two suppliers for this part, and one supplier is late again.", "vn": "nhà cung cấp"}, {"id": "w1-10", "en": "manufacturer", "vi": "a company that makes products in large quantities", "ex": "The manufacturer will ship the goods next month.", "vn": "nhà sản xuất"}, {"id": "w1-11", "en": "distributor", "vi": "a company that buys goods and sells them on to shops or other businesses", "ex": "Our distributor in Japan handles all retail orders.", "vn": "nhà phân phối"}, {"id": "w1-12", "en": "end customer", "vi": "the person or company that finally uses the product", "ex": "The end customer only cares about the delivery date.", "vn": "khách hàng cuối"}, {"id": "w1-13", "en": "stakeholder", "vi": "a person or group affected by a project or business decision", "ex": "We need to update every stakeholder before Friday.", "vn": "bên liên quan"}, {"id": "w1-14", "en": "information flow", "vi": "the movement of data such as orders and forecasts between partners", "ex": "A clear information flow keeps the factory and the buyer in sync.", "vn": "dòng thông tin"}, {"id": "w1-15", "en": "cash flow", "vi": "the money coming into and going out of a business", "ex": "Long payment terms hurt our cash flow.", "vn": "dòng tiền"}, {"id": "w1-16", "en": "network", "vi": "a group of connected suppliers, factories, warehouses and customers", "ex": "A supply chain is a network, not a straight line.", "vn": "mạng lưới"}, {"id": "w1-17", "en": "efficiency", "vi": "doing work with the least time, cost or waste", "ex": "This route improves efficiency but adds risk.", "vn": "hiệu quả, tiết kiệm nguồn lực"}, {"id": "w1-18", "en": "responsiveness", "vi": "the ability to react quickly to changes in customer demand", "ex": "Some customers value responsiveness more than a low price.", "vn": "khả năng phản ứng nhanh"}, {"id": "w1-19", "en": "trade-off", "vi": "a balance between two things you cannot fully have at the same time", "ex": "There is always a trade-off between cost and speed.", "vn": "sự đánh đổi"}], "quiz": [{"s": "You are opening a meeting with foreign partners. Which line sounds most natural and professional?", "o": ["Thanks for joining. Let's start with a quick look at the agenda.", "Okay, we start now. Listen to me.", "Hello. Meeting is begin."], "why": "Thank people for coming, then move to the agenda. That is the standard way to open."}, {"s": "You didn't catch the number your partner just said.", "o": ["Sorry, could you repeat the last figure?", "What? Say again.", "You speak too fast."], "why": "\"Could you repeat...\" is polite and says exactly what you need again."}, {"s": "Introduce your role.", "o": ["I'm in charge of sales administration and key accounts.", "I am charge sales admin.", "My job is do the sales."], "why": "Use \"be in charge of + noun\"."}, {"s": "You want someone to write the official record of the meeting.", "o": ["Could you take the minutes today?", "Could you speak the minutes today?", "You write the meeting for me."], "why": "\"Take the minutes\" means to write the official record of a meeting."}, {"s": "The meeting is ending. How do you make sure everyone knows their tasks?", "o": ["Let's recap the action items and who owns each one.", "I think everybody knows already.", "Okay, we finish now. Goodbye."], "why": "Recap the action items and the owners at the end of every meeting."}, {"s": "\"Follow up\" means…", "o": ["contact someone again or check progress", "go behind someone", "finish a meeting early"], "why": "To follow up is to check again on something you started earlier."}], "speak": [{"s": "Introduce yourself and your role in 30 seconds", "l": ["Hi, I'm Sally. I've worked in sales administration and account management for about nine years.", "I'm in charge of order processing, reporting and key accounts.", "I'm looking forward to working with you."]}, {"s": "Open and close a short meeting", "l": ["Thanks for joining. Let's go through the agenda first.", "To recap, we have three action items.", "I'll send the minutes by the end of today."]}], "email": "Subject: Meeting recap\n\nDear team,\n\nThank you for [[joining|join|joined]] today's meeting. Please find the minutes [[attached|attach|attaching]].\n\nThe main action items are:\n1. Linh to [[follow up|follow|following up]] with the supplier on the new lead time.\n2. Minh to update the sales report [[by|until|on]] Friday.\n\nPlease let me know if anything needs to be [[clarified|clarify|clarifying]].\n\nBest regards,\nSally", "coach": [{"q": "What does your company do?", "vi": "Công ty bạn hoạt động trong lĩnh vực gì?", "st": "We provide + product / service / solution.", "ph": ["export solutions", "innovative products", "business partnerships"], "ss": [], "sa": "We provide furniture export solutions, innovative products, and long-term business partnerships for international customers.", "src": "Giới thiệu nhanh sản phẩm cho khách", "sc": "A potential customer just stops by your booth. You only have a short time to introduce the product and get their attention."}, {"q": "What is new about this product?", "vi": "Sản phẩm này có gì mới không?", "st": "This product offers + key feature / key improvement.", "ph": ["advanced features", "unique design", "improved quality"], "ss": [], "sa": "This product offers advanced features, a unique design, and improved quality for today's market needs.", "src": "Giới thiệu nhanh sản phẩm cho khách", "sc": "A potential customer just stops by your booth. You only have a short time to introduce the product and get their attention."}, {"q": "Where are your products made?", "vi": "Sản phẩm của bạn được sản xuất ở đâu?", "st": "Our products are made + place / standard / workforce detail.", "ph": ["in Vietnam", "by skilled workers", "with strict standards"], "ss": [], "sa": "Our products are made in Vietnam by skilled workers and produced with strict quality standards.", "src": "Giới thiệu nhanh sản phẩm cho khách", "sc": "A potential customer just stops by your booth. You only have a short time to introduce the product and get their attention."}, {"q": "What kind of business are you in?", "vi": "Bạn kinh doanh trong lĩnh vực nào?", "st": "We specialize in + business area / service.", "ph": ["international trade", "product development", "export services"], "ss": [], "sa": "We specialize in international trade, product development, and export services for furniture and home decor products.", "src": "Giới thiệu nhanh sản phẩm cho khách", "sc": "A potential customer just stops by your booth. You only have a short time to introduce the product and get their attention."}, {"q": "Can I have your catalog?", "vi": "Tôi có thể lấy catalog của bạn được không?", "st": "I can give you + material / document.", "ph": ["our product catalog", "a digital brochure", "printed materials"], "ss": [], "sa": "Yes, of course. I can give you our product catalog, a digital brochure, and printed materials for reference.", "src": "Giới thiệu nhanh sản phẩm cho khách", "sc": "A potential customer just stops by your booth. You only have a short time to introduce the product and get their attention."}], "ph": "Sales and meetings"}, {"n": 2, "en": "Your company and your role", "vi": "", "vocab": [{"id": "w2-0", "en": "headquarters", "vi": "the main office of a company", "ex": "Our headquarters is in Ho Chi Minh City.", "vn": "trụ sở chính"}, {"id": "w2-1", "en": "subsidiary", "vi": "a company owned by a larger company", "ex": "We have a subsidiary in Hanoi.", "vn": "công ty con"}, {"id": "w2-2", "en": "core business", "vi": "the main activity a company earns money from", "ex": "Our core business is importing and distributing industrial goods.", "vn": "mảng kinh doanh chính"}, {"id": "w2-3", "en": "report to", "vi": "have someone as your direct manager", "ex": "I report directly to the sales director.", "vn": "báo cáo cho (cấp trên)"}, {"id": "w2-4", "en": "oversee", "vi": "manage and check the work of others", "ex": "I oversee a team of five coordinators.", "vn": "giám sát, quản lý chung"}, {"id": "w2-5", "en": "key account", "vi": "one of the most important customers", "ex": "We handle about twenty key accounts.", "vn": "khách hàng trọng điểm"}, {"id": "w2-6", "en": "market share", "vi": "the part of a market a company sells to", "ex": "We aim to grow our market share in the South.", "vn": "thị phần"}, {"id": "w2-7", "en": "track record", "vi": "past results that show you can do the job well", "ex": "We have a strong track record with Japanese clients.", "vn": "thành tích đã chứng minh"}, {"id": "w2-8", "en": "SCOR model", "vi": "a standard framework that splits supply chain work into Plan, Source, Make, Deliver and Return", "ex": "We use the SCOR model to map every order.", "vn": "mô hình SCOR"}, {"id": "w2-9", "en": "sourcing", "vi": "finding and choosing the suppliers you buy from", "ex": "I handle sourcing for packaging materials.", "vn": "tìm và chọn nguồn hàng"}, {"id": "w2-10", "en": "procurement", "vi": "the process of buying goods and services for a company", "ex": "Procurement must approve every new vendor.", "vn": "thu mua, mua hàng"}, {"id": "w2-11", "en": "logistics", "vi": "planning and managing how goods are moved and stored", "ex": "Our logistics team books all sea freight.", "vn": "hậu cần, logistics"}, {"id": "w2-12", "en": "demand planning", "vi": "forecasting how much customers will buy so that supply can be planned", "ex": "Demand planning starts three months before the season.", "vn": "hoạch định nhu cầu"}, {"id": "w2-13", "en": "forecast", "vi": "an estimate of future sales or demand", "ex": "The forecast for the first quarter is 20,000 units.", "vn": "dự báo"}, {"id": "w2-14", "en": "capacity", "vi": "the maximum amount a factory or production line can make", "ex": "The factory is running at full capacity.", "vn": "công suất"}, {"id": "w2-15", "en": "coordinator", "vi": "a person who organizes people and tasks so that work runs smoothly", "ex": "As a supply chain coordinator, I follow every shipment.", "vn": "điều phối viên"}, {"id": "w2-16", "en": "cross-functional", "vi": "involving people from different departments", "ex": "We set up a cross-functional team for the launch.", "vn": "liên phòng ban"}, {"id": "w2-17", "en": "KPI (key performance indicator)", "vi": "a number used to measure how well work is being done", "ex": "Our main KPI is on-time delivery.", "vn": "chỉ số đo lường hiệu quả"}, {"id": "w2-18", "en": "continuous improvement", "vi": "making small changes all the time so that work gets better", "ex": "We review every claim each month for continuous improvement.", "vn": "cải tiến liên tục"}, {"id": "w2-19", "en": "ISO 9001", "vi": "the international standard for quality management systems", "ex": "The factory is certified to ISO 9001.", "vn": "tiêu chuẩn quản lý chất lượng ISO 9001"}], "quiz": [{"s": "Say that you report directly to the sales director.", "o": ["I report directly to the sales director.", "I report the sales director directly.", "Sales director reports me."], "why": "\"report to someone\" needs the preposition to."}, {"s": "Describe the size of your team.", "o": ["I oversee a team of five coordinators.", "I oversee five coordinator team.", "I am oversee five people."], "why": "Use \"a team of + number + plural noun\"."}, {"s": "Introduce your company's main business.", "o": ["Our core business is distributing industrial equipment.", "Our core business are distribute equipment.", "We core business is equipment."], "why": "\"core business\" is singular, so use is + -ing."}, {"s": "You want to say that you are responsible for the results of a team.", "o": ["I'm responsible for the performance of a team of five.", "I am responsibility for a team of five.", "The team of five is my responsible."], "why": "Use \"be responsible for + noun\"."}, {"s": "A colleague asks what a KPI is.", "o": ["A KPI is a number we use to measure how well we are doing.", "A KPI is a kind of meeting.", "A KPI is a type of customer."], "why": "KPI means key performance indicator: a measure of performance."}, {"s": "Describe your company's position in the market.", "o": ["We have a strong track record and a growing market share in the South.", "We are very big, please believe us.", "Our market is share many in South."], "why": "Use facts such as track record and market share."}], "speak": [{"s": "Introduce your company in one minute", "l": ["Our company specializes in importing and distributing industrial goods.", "Our headquarters is in Ho Chi Minh City, and we serve clients across Vietnam.", "We have a strong track record with international partners."]}, {"s": "Explain what you are responsible for", "l": ["I report directly to the sales director.", "I oversee order processing and a team of coordinators.", "My main focus this year is growing our key accounts."]}], "email": "Subject: Introduction – Sales Administration\n\nDear Ms. Tanaka,\n\nMy name is Sally, and I am the Sales Administration Manager [[at|in|on]] our company. I will be your main [[point of contact|point of contacts|contact point of]] for orders and documents.\n\nOur core business is importing and [[distributing|distribute|distributed]] industrial goods in Vietnam. I [[report|reporting|am report]] directly to our sales director, Mr. Nam.\n\nI look forward to [[working|work|worked]] with you.\n\nBest regards,\nSally", "coach": [{"q": "Which department are you in?", "vi": "Bạn thuộc bộ phận nào?", "st": "I'm in + department name + department.", "ph": ["the finance", "the marketing", "the sales"], "ss": ["I'm in the sales department.", "I work in the account management team, which supports customers and internal coordination.", "My department focuses on client communication, order follow-up, and smooth daily operations."], "sa": "I'm in the sales department.", "src": "Giới thiệu về công việc", "sc": "You are talking about your current work in an interview or casual work conversation. You need to describe your department, what it does, and what part of the job feels most interesting to you."}, {"q": "What does your department mainly do?", "vi": "Bộ phận của bạn chủ yếu làm công việc gì?", "st": "We mainly + verb phrase.", "ph": ["sell products", "create products", "manage the company's money"], "ss": ["We mainly support customers, follow up on orders, and coordinate with internal teams to keep everything on track.", "In my department, we handle communication with clients and make sure the order process runs smoothly.", "We also work closely with production and logistics when customers need updates or changes."], "sa": "We mainly support customers, manage orders, and coordinate with internal teams.", "src": "Giới thiệu về công việc", "sc": "You are talking about your current work in an interview or casual work conversation. You need to describe your department, what it does, and what part of the job feels most interesting to you."}, {"q": "What is the most exciting part of your job?", "vi": "", "st": "I find + activity + most exciting.", "ph": ["dealing with the customers", "brainstorming ideas", "business trips"], "ss": ["I find dealing with customers the most exciting part of my job.", "I also enjoy brainstorming ideas with the team when we need to solve a customer problem or improve a process.", "Sometimes business trips are exciting too because they help me understand customers better in real situations."], "sa": "I find dealing with customers the most exciting part of my job.", "src": "Giới thiệu về công việc", "sc": "You are talking about your current work in an interview or casual work conversation. You need to describe your department, what it does, and what part of the job feels most interesting to you."}, {"q": "What is your least favorite part of the job?", "vi": "", "st": "I don't like + activity / situation.", "ph": ["the paperwork", "the low salary", "the repetitive tasks"], "ss": ["I don't like too much paperwork because it takes time away from customer work.", "I also find repetitive tasks a little less exciting, but I know they are still necessary for smooth operations.", "Even so, I always try to stay organized and complete those tasks carefully."], "sa": "I don't like too much paperwork or repetitive tasks, but I understand they are part of the job.", "src": "Giới thiệu về công việc", "sc": "You are talking about your current work in an interview or casual work conversation. You need to describe your department, what it does, and what part of the job feels most interesting to you."}, {"q": "What is your factory's capacity?", "vi": "Năng lực sản xuất của nhà máy bạn là gì?", "st": "We can produce + capacity / order type.", "ph": ["large monthly volumes", "customized bulk orders", "high-demand products"], "ss": ["We can produce large monthly volumes for furniture, pottery, and home decor collections.", "Our factory is also able to handle customized bulk orders based on customer specifications and seasonal requirements.", "We are experienced in producing high-demand products while maintaining stable lead times and consistent finishing quality."], "sa": "We can produce large monthly volumes, customized bulk orders, and high-demand products with a stable production schedule.", "src": "Chứng minh năng lực sản xuất", "sc": "The customer is unsure whether your company can handle large-volume orders. They want specific information before making a decision."}, {"q": "How do you ensure quality control?", "vi": "Bạn đảm bảo kiểm soát chất lượng như thế nào?", "st": "We use + method / system + for quality.", "ph": ["strict inspection processes", "advanced testing equipment", "trained quality staff"], "ss": ["We use strict inspection processes at every stage of production to maintain consistent quality.", "We also rely on advanced testing equipment to check materials, finishing, and product performance where needed.", "In addition, we have trained quality staff who monitor production and final inspection before shipment."], "sa": "We use strict inspection processes, advanced testing equipment, and trained quality staff for quality control.", "src": "Chứng minh năng lực sản xuất", "sc": "The customer is unsure whether your company can handle large-volume orders. They want specific information before making a decision."}, {"q": "What quality certificates do you have?", "vi": "Bạn có những chứng chỉ chất lượng nào?", "st": "We hold + certificate type + certificates.", "ph": ["ISO 9001", "CE certification", "FDA approval"], "ss": ["We hold ISO 9001 certification to support our quality management system.", "For products and markets where it is relevant, we can also provide CE certification or FDA-related compliance documents.", "The exact certificates depend on the product category and the destination market."], "sa": "We hold ISO 9001 certification, and depending on the market, we can also provide CE certification or FDA-related compliance support.", "src": "Chứng minh năng lực sản xuất", "sc": "The customer is unsure whether your company can handle large-volume orders. They want specific information before making a decision."}, {"q": "Who are your current major clients?", "vi": "Những khách hàng lớn hiện tại của bạn là ai?", "st": "Our clients include + customer group.", "ph": ["leading retailers", "international distributors", "well-known brands"], "ss": ["Our clients include leading retailers, international distributors, and well-known brands in the furniture and home decor sector.", "We work with customers in different markets, including buyers who require both standard production and customized development.", "Many of our clients value our ability to combine product design, production coordination, and logistics support."], "sa": "Our clients include leading retailers, international distributors, and well-known brands.", "src": "Chứng minh năng lực sản xuất", "sc": "The customer is unsure whether your company can handle large-volume orders. They want specific information before making a decision."}, {"q": "Why are you a reliable partner?", "vi": "Tại sao bạn là một đối tác đáng tin cậy?", "st": "We offer + reliability factor + to clients.", "ph": ["consistent delivery times", "transparent communication", "flexible solutions"], "ss": ["We offer consistent delivery times to clients by planning production carefully and following up closely with each order.", "We also maintain transparent communication, so customers are updated clearly about progress, issues, and next steps.", "In addition, we provide flexible solutions when customers need adjustments in design, quantity, or delivery arrangements."], "sa": "We offer consistent delivery times, transparent communication, and flexible solutions to our clients.", "src": "Chứng minh năng lực sản xuất", "sc": "The customer is unsure whether your company can handle large-volume orders. They want specific information before making a decision."}, {"q": "What specific services do you provide to these clients?", "vi": "Bạn cung cấp những dịch vụ cụ thể nào cho các khách hàng này?", "st": "We provide them with + service / support.", "ph": ["product design", "logistics support", "marketing support"], "ss": ["We provide them with product design support to help develop collections that match their market needs.", "We also provide logistics support, including shipment coordination, document follow-up, and delivery updates.", "For some customers, we provide marketing support such as catalogs, product photos, and display suggestions."], "sa": "We provide them with product design, logistics support, and marketing support.", "src": "Chứng minh năng lực sản xuất", "sc": "The customer is unsure whether your company can handle large-volume orders. They want specific information before making a decision."}], "ph": "Sales and meetings"}, {"n": 3, "en": "Business emails: inquiries, quotations, follow-ups", "vi": "", "vocab": [{"id": "w3-0", "en": "inquiry", "vi": "a request for information or a price", "ex": "Thank you for your inquiry about our products.", "vn": "yêu cầu hỏi thông tin, hỏi giá"}, {"id": "w3-1", "en": "quotation", "vi": "a document that states the price you offer", "ex": "Please find our quotation attached.", "vn": "bảng báo giá"}, {"id": "w3-2", "en": "valid until", "vi": "can be used up to a certain date", "ex": "This price is valid until 30/11/2026.", "vn": "có hiệu lực đến"}, {"id": "w3-3", "en": "unit price", "vi": "the price of one item", "ex": "The unit price is USD 12.50.", "vn": "đơn giá"}, {"id": "w3-4", "en": "follow up on", "vi": "check on something you asked about earlier", "ex": "I'm following up on my email from last week.", "vn": "nhắc lại, theo dõi (việc gì)"}, {"id": "w3-5", "en": "at your earliest convenience", "vi": "as soon as it is easy for you", "ex": "Please reply at your earliest convenience.", "vn": "khi nào tiện thì sớm nhất"}, {"id": "w3-6", "en": "reach out", "vi": "contact someone", "ex": "Feel free to reach out if you have any questions.", "vn": "liên hệ"}, {"id": "w3-7", "en": "for your reference", "vi": "so you can look at it if needed", "ex": "The catalogue is attached for your reference.", "vn": "để bạn tham khảo"}, {"id": "w3-8", "en": "RFQ (request for quotation)", "vi": "a document that asks suppliers to quote a price for specific goods", "ex": "We sent the RFQ to three suppliers.", "vn": "yêu cầu báo giá"}, {"id": "w3-9", "en": "RFI (request for information)", "vi": "a request asking suppliers to share basic information about their company and products", "ex": "Please complete our RFI by Monday.", "vn": "yêu cầu cung cấp thông tin"}, {"id": "w3-10", "en": "vendor", "vi": "a company that sells goods or services to you", "ex": "The vendor confirmed the new price this morning.", "vn": "nhà cung cấp, bên bán"}, {"id": "w3-11", "en": "vendor selection", "vi": "the process of comparing and choosing suppliers", "ex": "Vendor selection usually takes about four weeks.", "vn": "lựa chọn nhà cung cấp"}, {"id": "w3-12", "en": "shortlist", "vi": "a small list of the best options chosen from a longer list", "ex": "We now have a shortlist of two factories.", "vn": "danh sách rút gọn"}, {"id": "w3-13", "en": "specification", "vi": "a detailed description of what a product must be", "ex": "Please check the specification before you quote.", "vn": "thông số kỹ thuật"}, {"id": "w3-14", "en": "sample", "vi": "one product sent so the buyer can check quality before ordering", "ex": "Could you send a sample by courier?", "vn": "hàng mẫu"}, {"id": "w3-15", "en": "reference", "vi": "a past customer who can confirm that a supplier does good work", "ex": "Could you give us a reference in Europe?", "vn": "khách hàng tham chiếu"}, {"id": "w3-16", "en": "weighted scoring", "vi": "rating options against criteria that have different levels of importance", "ex": "We used weighted scoring to compare the vendors.", "vn": "chấm điểm có trọng số"}, {"id": "w3-17", "en": "single sourcing", "vi": "buying an item from only one supplier", "ex": "Single sourcing is simpler but riskier.", "vn": "mua từ một nguồn duy nhất"}, {"id": "w3-18", "en": "dual sourcing", "vi": "buying the same item from two suppliers to reduce risk", "ex": "We moved to dual sourcing after the last delay.", "vn": "mua từ hai nguồn"}, {"id": "w3-19", "en": "supplier audit", "vi": "a visit or review to check whether a supplier meets your standards", "ex": "The supplier audit is planned for next week.", "vn": "đánh giá nhà cung cấp tại chỗ"}], "quiz": [{"s": "A customer hasn't replied to your quotation for a week. Which opening line fits a reminder email?", "o": ["I'm following up on the quotation I sent last week.", "Why didn't you answer my email?", "You forgot my quotation."], "why": "\"I'm following up on...\" is a gentle reminder that doesn't blame the customer."}, {"s": "Say the quotation is valid until 30/11/2026.", "o": ["This quotation is valid until 30/11/2026.", "This quotation is valid to 30/11/2026 only until.", "This quotation valid at 30/11/2026."], "why": "\"valid until + date\" is the standard phrase."}, {"s": "End an email by inviting questions.", "o": ["Please feel free to reach out if you have any questions.", "If question, contact.", "You must contact me for questions."], "why": "\"feel free to reach out\" is friendly and professional."}, {"s": "Which document asks several suppliers for a price for the same goods?", "o": ["An RFQ (request for quotation)", "An RFI (request for information)", "A reference letter"], "why": "An RFQ asks for prices, while an RFI asks for general information."}, {"s": "A customer sends you an inquiry. How do you reply?", "o": ["Thank you for your inquiry. I'm pleased to send you our quotation.", "Thanks you for inquiry, quotation here.", "We got your message, please wait."], "why": "Thank the customer first, then give what was asked."}, {"s": "What is \"dual sourcing\"?", "o": ["buying the same item from two suppliers to reduce risk", "buying from only one supplier", "selling to two customers at once"], "why": "Dual sourcing reduces the risk of depending on one supplier."}], "speak": [{"s": "Call a customer about a quotation", "l": ["Hi, this is Sally from the sales team.", "I'm calling to follow up on the quotation we sent last Monday.", "Do you have any questions about the prices or the delivery time?"]}, {"s": "Reply to a price inquiry", "l": ["Thank you for your inquiry.", "I'll send you our quotation by the end of today.", "Could you confirm the quantity you need?"]}], "email": "Subject: Quotation for steel brackets\n\nDear Mr. Lee,\n\nThank you for your [[inquiry|inquire|inquired]] dated 20 October. Please find our quotation [[attached|attach|attaching]].\n\nThe unit price is USD 12.50, and this offer is valid [[until|by the time|since]] 30 November 2026.\n\nPlease reply [[at your earliest convenience|at your early convenient|in your earliest convenient]] so we can reserve stock for you.\n\nBest regards,\nSally", "coach": [{"q": "When are you available for a quick call?", "vi": "Khi nào anh/chị rảnh để chúng ta nói chuyện nhanh qua điện thoại?", "st": "Please share + time / availability detail + with me.", "ph": ["your free time", "your preferred time", "your schedule"], "ss": [], "sa": "Please share your preferred time with me, and I will arrange a quick follow-up call.", "src": "Lên lịch hẹn follow-up với khách tiềm năng", "sc": "The conversation went well, but the booth is too noisy. You want a separate meeting to discuss the details more clearly. Suggest a follow-up appointment."}, {"q": "How can I contact you after the fair?", "vi": "Làm thế nào tôi có thể liên hệ với anh/chị sau hội chợ?", "st": "I can contact you via + contact method.", "ph": ["your email address", "your phone number", "your office line"], "ss": [], "sa": "I can contact you via your email address or phone number after the fair.", "src": "Lên lịch hẹn follow-up với khách tiềm năng", "sc": "The conversation went well, but the booth is too noisy. You want a separate meeting to discuss the details more clearly. Suggest a follow-up appointment."}, {"q": "What information should I prepare for our meeting?", "vi": "Tôi nên chuẩn bị thông tin gì cho cuộc họp của chúng ta?", "st": "Please prepare + information / document + for our meeting.", "ph": ["your product list", "your company profile", "your questions"], "ss": [], "sa": "Please prepare your product list, your company profile, and your questions for our meeting.", "src": "Lên lịch hẹn follow-up với khách tiềm năng", "sc": "The conversation went well, but the booth is too noisy. You want a separate meeting to discuss the details more clearly. Suggest a follow-up appointment."}, {"q": "Who else should join our meeting?", "vi": "Ai khác nên tham gia cuộc họp của chúng ta?", "st": "You can invite + person / team + to join.", "ph": ["your technical team", "your manager", "your assistant"], "ss": [], "sa": "You can invite your technical team or your manager to join if needed.", "src": "Lên lịch hẹn follow-up với khách tiềm năng", "sc": "The conversation went well, but the booth is too noisy. You want a separate meeting to discuss the details more clearly. Suggest a follow-up appointment."}, {"q": "What is the best way to follow up?", "vi": "Cách tốt nhất để theo dõi là gì?", "st": "The best way is + follow-up method.", "ph": ["a phone call", "an email", "a video meeting"], "ss": [], "sa": "The best way is a phone call first, followed by an email summary.", "src": "Lên lịch hẹn follow-up với khách tiềm năng", "sc": "The conversation went well, but the booth is too noisy. You want a separate meeting to discuss the details more clearly. Suggest a follow-up appointment."}, {"q": "What's the price for this item?", "vi": "Giá của mặt hàng này là bao nhiêu?", "st": "The price is + amount.", "ph": ["an estimated amount", "our current offer", "a competitive rate"], "ss": ["The price is an estimated amount based on your order details.", "Our current offer is very competitive for this item.", "I can give you a quick estimate right now."], "sa": "The price is about an estimated amount for now.", "src": "Báo giá sơ bộ cho khách tại gian hàng", "sc": "A customer at your booth likes the product and wants a quick price. You need to give a clear, reasonable estimate and answer follow-up questions about quantity and included items."}, {"q": "Does the price change with quantity?", "vi": "Giá có thay đổi theo số lượng không?", "st": "The price changes with + quantity / order size.", "ph": ["order size", "bulk purchase", "large quantity"], "ss": ["Yes, the price changes with order size.", "For a bulk purchase, we can give a better rate.", "If you order in a large quantity, the price will be lower."], "sa": "Yes, the price changes with quantity.", "src": "Báo giá sơ bộ cho khách tại gian hàng", "sc": "A customer at your booth likes the product and wants a quick price. You need to give a clear, reasonable estimate and answer follow-up questions about quantity and included items."}, {"q": "What is your Minimum Order Quantity?", "vi": "Số lượng đặt hàng tối thiểu của bạn là bao nhiêu?", "st": "The minimum order is + number / unit.", "ph": ["100 units", "one full carton", "a standard batch"], "ss": ["The minimum order is 100 units.", "For this item, one full carton is the MOQ.", "We usually start with a standard batch for first orders."], "sa": "The minimum order is 100 units.", "src": "Báo giá sơ bộ cho khách tại gian hàng", "sc": "A customer at your booth likes the product and wants a quick price. You need to give a clear, reasonable estimate and answer follow-up questions about quantity and included items."}, {"q": "Is this your best price?", "vi": "Đây có phải là giá tốt nhất của bạn không?", "st": "This is our best price + time reference.", "ph": ["at this time", "for this order", "for your request"], "ss": ["Yes, this is our best price at this time.", "This price is for this order and the quantity you mentioned.", "We are giving a very good rate for your request."], "sa": "Yes, this is our best price at this time.", "src": "Báo giá sơ bộ cho khách tại gian hàng", "sc": "A customer at your booth likes the product and wants a quick price. You need to give a clear, reasonable estimate and answer follow-up questions about quantity and included items."}, {"q": "What is included in this price?", "vi": "Giá này bao gồm những gì?", "st": "The price includes + items / services.", "ph": ["standard packaging", "basic shipping", "product warranty"], "ss": ["The price includes standard packaging.", "It also includes basic shipping and product warranty.", "If you need extra services, I can quote those separately."], "sa": "The price includes standard packaging and basic shipping.", "src": "Báo giá sơ bộ cho khách tại gian hàng", "sc": "A customer at your booth likes the product and wants a quick price. You need to give a clear, reasonable estimate and answer follow-up questions about quantity and included items."}], "ph": "Sales and meetings"}, {"n": 21, "en": "Emails to customers: confirmations, delays and apologies", "vi": "", "vocab": [{"id": "E21-0", "en": "order confirmation", "vi": "a message that confirms the details of an order", "ex": "We sent the order confirmation this morning.", "vn": "xác nhận đơn hàng"}, {"id": "E21-r1", "en": "invoice number", "vi": "the number that identifies an invoice", "ex": "Please quote the invoice number when you pay.", "vn": "số hoá đơn"}, {"id": "E21-2", "en": "estimated delivery date", "vi": "the date when the goods are expected to arrive", "ex": "The estimated delivery date is 15 December.", "vn": "ngày giao hàng dự kiến"}, {"id": "E21-3", "en": "dispatch", "vi": "send goods out to the customer", "ex": "We will dispatch the goods on Monday.", "vn": "gửi hàng đi"}, {"id": "E21-4", "en": "partial shipment", "vi": "sending only part of an order now and the rest later", "ex": "We can offer a partial shipment of 500 units.", "vn": "giao hàng từng phần"}, {"id": "E21-5", "en": "backorder", "vi": "an order for goods that are out of stock and will be sent later", "ex": "The blue model is on backorder until January.", "vn": "đơn hàng chờ hàng về"}, {"id": "E21-6", "en": "tracking number", "vi": "a code used to follow a parcel or shipment", "ex": "I will send you the tracking number once it ships.", "vn": "mã theo dõi vận đơn"}, {"id": "E21-7", "en": "apologize for the inconvenience", "vi": "say sorry for a problem you caused", "ex": "We apologize for the inconvenience caused by the delay.", "vn": "xin lỗi vì sự bất tiện"}, {"id": "E21-8", "en": "rest assured", "vi": "be certain that a problem is being handled", "ex": "Rest assured, we are following this up with the factory.", "vn": "xin hãy yên tâm"}, {"id": "E21-9", "en": "as discussed", "vi": "as we talked about before", "ex": "As discussed on the call, we will ship by air.", "vn": "như đã trao đổi"}, {"id": "E21-10", "en": "with reference to", "vi": "in connection with an earlier message", "ex": "With reference to your email of 3 November, we have checked the stock.", "vn": "liên quan đến"}, {"id": "E21-11", "en": "please find attached", "vi": "here is the file I have attached", "ex": "Please find attached the updated quotation.", "vn": "xin xem file đính kèm"}, {"id": "E21-12", "en": "kindly confirm", "vi": "please confirm (formal and polite)", "ex": "Kindly confirm the delivery address by Friday.", "vn": "vui lòng xác nhận"}, {"id": "E21-13", "en": "revised", "vi": "changed after review", "ex": "Here is the revised delivery schedule.", "vn": "đã điều chỉnh"}, {"id": "E21-14", "en": "reschedule", "vi": "move something to a new date or time", "ex": "We have to reschedule the shipment to next week.", "vn": "dời lịch"}, {"id": "E21-15", "en": "expedite", "vi": "make something happen faster", "ex": "We can expedite the order for an extra fee.", "vn": "đẩy nhanh"}, {"id": "E21-16", "en": "compensate", "vi": "give something to make up for a problem", "ex": "We will compensate you with a 5% discount on your next order.", "vn": "bồi thường, đền bù"}, {"id": "E21-17", "en": "goodwill gesture", "vi": "something given to keep a good relationship after a problem", "ex": "The free spare parts are a goodwill gesture.", "vn": "cử chỉ thiện chí"}, {"id": "E21-18", "en": "keep you posted", "vi": "keep giving someone the latest news", "ex": "I'll keep you posted on any changes.", "vn": "sẽ cập nhật cho bạn"}, {"id": "E21-19", "en": "look forward to hearing from you", "vi": "a polite closing line asking for a reply", "ex": "I look forward to hearing from you soon.", "vn": "mong sớm nhận phản hồi"}], "quiz": [{"s": "Your customer's shipment will be five days late. Which opening line is best?", "o": ["I'm writing to let you know that your shipment will be delayed by five days, and I apologize for the inconvenience.", "Your shipment is late. It is not our fault.", "Sorry, late, five days."], "why": "State the news clearly in the first sentence and apologize once, without blaming anyone."}, {"s": "You need the customer to check the delivery address.", "o": ["Kindly confirm that the delivery address below is correct.", "You must tell me the address is right.", "Confirm address, thank you."], "why": "\"Kindly confirm that...\" is polite and tells the reader exactly what to do."}, {"s": "Only part of the order is ready. Which sentence offers a solution?", "o": ["We can offer a partial shipment now and send the remaining units next week.", "We can partial ship now, remain units next week.", "The order is not complete, so nothing can be sent."], "why": "Offer an option, not only the problem. \"Partial shipment\" is the standard term."}, {"s": "You want to give the customer the tracking number.", "o": ["I'm pleased to confirm that your order has shipped. Your tracking number is below.", "Your order go, number is here.", "The goods left, you find them yourself."], "why": "Confirm the shipment first, then give the number."}, {"s": "\"Rest assured\" means…", "o": ["you can be sure that we are handling the problem", "go to sleep", "the problem is very big"], "why": "\"Rest assured\" calms the reader."}, {"s": "End an email and ask for confirmation.", "o": ["Kindly confirm by Friday, and I will keep you posted.", "Confirm now or I will be angry.", "Answer me when you can maybe."], "why": "Give a date and promise an update."}], "speak": [{"s": "Phone a customer about a delayed order", "l": ["Hello, this is Sally. I'm calling about your order from last week.", "I'm afraid the shipment will arrive five days later than planned.", "I apologize for the inconvenience. I'll send you the revised schedule by email today."]}, {"s": "Confirm an order and the next steps", "l": ["Thank you for your order. I'd like to confirm the quantity and the delivery address.", "We will send the pro forma invoice today.", "Once we receive payment, we will dispatch the goods and send you the tracking number."]}], "email": "Subject: Delay notice – order PO 4521\n\nDear Ms. Tanaka,\n\nI'm writing [[to inform you|to informing you|for inform you]] that your order will be dispatched on 12 December instead of 7 December, because the factory had a [[shortage|shorten|shortly]] of raw material.\n\nWe sincerely apologize [[for|of|about]] the inconvenience. To make up for the delay, we will [[expedite|expedition|expediting]] the shipment by air at our own cost.\n\nPlease find the revised delivery schedule [[attached|attaching|attach]]. I will keep you [[posted|post|posting]] on any further changes.\n\nBest regards,\nSally", "coach": [{"q": "Why is my order late?", "vi": "Vì sao đơn hàng của tôi bị trễ?", "st": "We are sorry for the delay, which was caused by + reason.", "ph": ["a raw material shortage", "at the factory", "a faster shipment"], "ss": [], "sa": "We are sorry for the delay. It was caused by a raw material shortage at the factory, and we are now arranging a faster shipment.", "src": "Email by audience", "sc": "A long-standing customer writes to ask why their order has not arrived. They are annoyed and want a clear explanation and a new date.", "lab": "Work practice"}, {"q": "Can you ship part of the order now?", "vi": "Bạn có thể giao một phần đơn hàng ngay bây giờ không?", "st": "We can offer + option + and + next step.", "ph": ["a partial shipment", "the remaining units next week", "a revised delivery schedule"], "ss": [], "sa": "Yes, we can offer a partial shipment of 500 units now and send the remaining units next week. I will send a revised delivery schedule today.", "src": "Email by audience", "sc": "The customer needs some goods urgently for an event and asks if you can send what is ready.", "lab": "Work practice"}, {"q": "Can you confirm my order details?", "vi": "Bạn xác nhận giúp chi tiết đơn hàng của tôi được không?", "st": "Please find + document + and + request.", "ph": ["the order confirmation", "estimated delivery date", "kindly confirm"], "ss": [], "sa": "Please find attached the order confirmation with the quantity, price and estimated delivery date. Kindly confirm that everything is correct.", "src": "Email by audience", "sc": "A new customer has just placed a first order and wants to be sure everything is understood correctly.", "lab": "Work practice"}, {"q": "What will you do to make up for the delay?", "vi": "Bạn sẽ làm gì để bù đắp cho việc trễ hàng?", "st": "To make up for it, we will + action.", "ph": ["a 5% discount", "the air freight", "a goodwill gesture"], "ss": [], "sa": "To make up for the delay, we will give you a 5% discount on your next order and pay for the air freight, as a goodwill gesture.", "src": "Email by audience", "sc": "The customer accepts your apology but asks what you can offer in return for the late delivery.", "lab": "Work practice"}], "ph": "Email writing by audience"}, {"n": 4, "en": "Presenting products and handling price questions", "vi": "", "vocab": [{"id": "w4-0", "en": "feature", "vi": "something a product has or can do", "ex": "The key feature is its long battery life.", "vn": "tính năng"}, {"id": "w4-1", "en": "benefit", "vi": "an advantage the customer gets", "ex": "The main benefit for you is lower maintenance cost.", "vn": "lợi ích"}, {"id": "w4-2", "en": "competitive", "vi": "as good as or better than others in price", "ex": "Our price is very competitive for this quality.", "vn": "cạnh tranh"}, {"id": "w4-3", "en": "discount", "vi": "an amount taken off the normal price", "ex": "We can offer a 5% discount for orders over 1,000 units.", "vn": "chiết khấu"}, {"id": "w4-4", "en": "minimum order quantity (MOQ)", "vi": "the smallest amount a customer can order", "ex": "Our MOQ is 500 pieces.", "vn": "số lượng đặt tối thiểu"}, {"id": "w4-5", "en": "warranty", "vi": "a promise to repair or replace a product", "ex": "It comes with a two-year warranty.", "vn": "bảo hành"}, {"id": "w4-6", "en": "value for money", "vi": "worth the price you pay", "ex": "Customers see it as good value for money.", "vn": "đáng đồng tiền"}, {"id": "w4-7", "en": "justify", "vi": "show that something is reasonable", "ex": "Let me explain what justifies the price.", "vn": "chứng minh là hợp lý"}, {"id": "w4-8", "en": "make or buy", "vi": "the decision to produce something yourself or buy it from a supplier", "ex": "This is a make or buy decision for the management team.", "vn": "tự sản xuất hay mua ngoài"}, {"id": "w4-9", "en": "outsource", "vi": "pay another company to do work or make parts for you", "ex": "We outsource packaging to a local partner.", "vn": "thuê ngoài"}, {"id": "w4-10", "en": "in-house", "vi": "done inside the company, not by an outside supplier", "ex": "We do all quality checks in-house.", "vn": "tự làm trong nội bộ"}, {"id": "w4-11", "en": "nearshore", "vi": "use suppliers in a nearby country", "ex": "Nearshore suppliers can cut transit time by weeks.", "vn": "dùng nguồn ở nước lân cận"}, {"id": "w4-12", "en": "farshore", "vi": "use suppliers in a distant country (also called offshore)", "ex": "Farshore suppliers offer low prices but longer lead times.", "vn": "dùng nguồn ở nước xa"}, {"id": "w4-13", "en": "total cost", "vi": "the full cost of buying, including freight, duty, inspection and delays, not just the unit price", "ex": "The total cost is much higher than the quote suggests.", "vn": "tổng chi phí"}, {"id": "w4-14", "en": "landed cost", "vi": "the cost of a product once it reaches your warehouse, including freight, insurance and duty", "ex": "Please calculate the landed cost per unit.", "vn": "giá về tới kho"}, {"id": "w4-15", "en": "hidden cost", "vi": "an extra cost that is easy to miss when you compare offers", "ex": "Long transit times create a hidden cost in extra stock.", "vn": "chi phí ẩn"}, {"id": "w4-16", "en": "tariff", "vi": "a tax that a government puts on imported goods", "ex": "The new tariff adds ten percent to the price.", "vn": "thuế quan"}, {"id": "w4-17", "en": "import duty", "vi": "the tax paid on goods when they enter a country", "ex": "Who pays the import duty under this term?", "vn": "thuế nhập khẩu"}, {"id": "w4-18", "en": "strategic supplier", "vi": "a key supplier you build a close, long-term partnership with", "ex": "They are a strategic supplier for our main product line.", "vn": "nhà cung cấp chiến lược"}, {"id": "w4-19", "en": "economies of scale", "vi": "a lower cost per unit when you produce or buy in larger quantities", "ex": "Bigger orders give us economies of scale.", "vn": "lợi thế nhờ quy mô"}], "quiz": [{"s": "The customer says: \"Your price is higher than your competitor's.\" How do you answer?", "o": ["I understand. Let me show you what's included in our price.", "No, our price is cheap.", "Then buy from them."], "why": "Agree with the concern, then move to value. Don't argue and don't drop the price at once."}, {"s": "Tell the customer the main benefit.", "o": ["The main benefit for you is lower maintenance cost.", "The main benefit for you are lower maintain cost.", "It benefit you lower cost."], "why": "Use \"benefit is + noun\"; maintenance is a noun."}, {"s": "Talk about the minimum order.", "o": ["Our minimum order quantity is 500 pieces.", "Our minimum order is 500 piece minimum.", "You must order minimum 500 pieces quantity."], "why": "Use the fixed phrase minimum order quantity (MOQ)."}, {"s": "The customer asks what makes your product different.", "o": ["Our main advantage is durability, which gives you better value for money.", "Our product is just different, that's all.", "Ask our competitors, they will tell you."], "why": "Name one clear benefit and link it to the customer's interest."}, {"s": "The customer thinks the cheapest offer is best. What do you say?", "o": ["The lowest price is not always the lowest total cost, because of shipping and duty.", "Cheap price is always better.", "Cost is not important for this."], "why": "Explain total cost: transport, duty and other costs matter."}, {"s": "\"In-house\" means…", "o": ["done inside your own company", "done in a house", "done by another country"], "why": "In-house work is done by your own team, not by an outside company."}], "speak": [{"s": "Present a product in one minute", "l": ["Let me introduce our best-selling model.", "Its key feature is a two-year warranty.", "The main benefit for you is lower maintenance cost."]}, {"s": "Reply when a customer says the price is too high", "l": ["I understand your concern about the price.", "Let me explain what's included.", "For orders over 1,000 units, we can offer a 5% discount."]}], "email": "Subject: Re: Price for model X200\n\nDear Ms. Chen,\n\nThank you for your feedback on our price. I understand your [[concern|concerned|concerning]].\n\nOur price includes a two-year [[warranty|warrant|warranted]] and free technical support. For orders [[over|above of|more]] 1,000 units, we can offer a 5% discount.\n\nWe believe the X200 is good value [[for|of|to]] money.\n\nBest regards,\nSally", "coach": [{"q": "What makes this new product special?", "vi": "Điều gì làm cho sản phẩm mới này đặc biệt?", "st": "This product offers + key feature / key benefit.", "ph": ["exclusive technology", "unique design features", "advanced performance benefits"], "ss": ["We have recently launched a new furniture and home decor collection designed for customers who want something more distinctive in their market.", "This product offers unique design features, a handcrafted finish, and a look that works well in modern living spaces.", "It also provides strong commercial value because the materials and finishing are suitable for repeated retail orders.", "This collection stands out because it combines natural textures, practical use, and strong visual appeal."], "sa": "This product offers unique design features, a handcrafted finish, and strong commercial appeal. That is what makes it special in the market.", "src": "Giới thiệu dòng sản phẩm mới", "sc": "The customer is a large distributor looking for distinctive products for their market. You need to introduce the new product line in a strong and memorable way."}, {"q": "Who is the target customer for this?", "vi": "Khách hàng mục tiêu cho sản phẩm này là ai?", "st": "The target customer is + customer group.", "ph": ["young professionals", "health-conscious families", "urban trendsetters"], "ss": ["The target customer is young professionals who are looking for stylish furniture and home accessories for modern apartments.", "This product is also suitable for families who care about design, durability, and everyday practicality.", "It can also appeal to lifestyle stores and boutique distributors looking for distinctive pottery and decor pieces."], "sa": "The target customer is young professionals, health-conscious families, and urban trendsetters.", "src": "Giới thiệu dòng sản phẩm mới", "sc": "The customer is a large distributor looking for distinctive products for their market. You need to introduce the new product line in a strong and memorable way."}, {"q": "How do you support your distributors?", "vi": "Bạn hỗ trợ các nhà phân phối của mình như thế nào?", "st": "We provide + support method.", "ph": ["marketing materials", "training sessions", "after-sales service"], "ss": ["We provide product catalogs, photos, and display suggestions to help our distributors promote the collection effectively.", "We also provide training sessions so their sales team can understand the materials, finishes, and key selling points clearly.", "In addition, we offer after-sales support and order follow-up to help them handle customer feedback after launch."], "sa": "We provide marketing materials, training sessions, and after-sales service to support our distributors.", "src": "Giới thiệu dòng sản phẩm mới", "sc": "The customer is a large distributor looking for distinctive products for their market. You need to introduce the new product line in a strong and memorable way."}, {"q": "What is the production lead time?", "vi": "Thời gian sản xuất là bao lâu?", "st": "The lead time is + time frame / processing type.", "ph": ["four weeks", "standard processing", "customized scheduling"], "ss": ["The lead time is usually four weeks for standard furniture items.", "For pottery or customized pieces, the lead time may be slightly longer because of sampling, glaze approval, and finishing.", "Our standard processing works well for repeat orders, while customized scheduling is available for special collections or project-based orders.", "If you share the quantity and specifications, I can confirm a more accurate lead time for you."], "sa": "The lead time is usually four weeks for standard processing, but customized scheduling may take longer depending on the design and order volume.", "src": "Giới thiệu dòng sản phẩm mới", "sc": "The customer is a large distributor looking for distinctive products for their market. You need to introduce the new product line in a strong and memorable way."}, {"q": "Why should we choose this product?", "vi": "Tại sao chúng tôi nên chọn sản phẩm này?", "st": "You should choose this for + business benefit / product value.", "ph": ["market differentiation", "high profit margins", "customer loyalty"], "ss": ["You should choose this for market differentiation because the design is distinctive and not easy to replace with mass-market items.", "This collection can also support high profit margins, especially for lifestyle stores selling furniture, home decor, or pottery with a handcrafted story.", "Another reason is customer loyalty, because well-designed and consistent products often encourage repeat purchases.", "If your market is looking for products with both visual appeal and commercial potential, this could be a strong choice."], "sa": "You should choose this for market differentiation, high profit margins, and stronger customer loyalty.", "src": "Giới thiệu dòng sản phẩm mới", "sc": "The customer is a large distributor looking for distinctive products for their market. You need to introduce the new product line in a strong and memorable way."}, {"q": "Why is your price higher than others?", "vi": "Tại sao giá của bạn cao hơn bên khác?", "st": "The reason is + price factor.", "ph": ["premium materials", "advanced technology", "strict quality control"], "ss": ["The reason is that we use premium materials and pay close attention to finishing quality.", "Another reason is that our production process includes advanced technology where needed and strong coordination between design, sampling, and mass production.", "We also apply strict quality control, which helps reduce defects and maintain consistency across export orders."], "sa": "The reason is premium materials, advanced technology, and strict quality control.", "src": "Giải đáp thắc mắc về giá", "sc": "The customer believes your price is higher than the competitors and wants an explanation for the difference."}, {"q": "What value do we get for this price?", "vi": "Với mức giá này chúng tôi nhận được giá trị gì?", "st": "You receive + value element.", "ph": ["extended warranty", "dedicated support", "exclusive features"], "ss": ["For this price, you receive exclusive features that are not easy to find in standard mass-market products.", "You also receive dedicated support from our team during development, production, and order follow-up.", "Depending on the product category and project terms, extended warranty or after-sales support may also be included."], "sa": "You receive exclusive features, dedicated support, and in some cases extended warranty for this price.", "src": "Giải đáp thắc mắc về giá", "sc": "The customer believes your price is higher than the competitors and wants an explanation for the difference."}, {"q": "Can you offer a lower price?", "vi": "Bạn có thể đưa giá thấp hơn không?", "st": "I can consider + condition / pricing option.", "ph": ["bulk orders", "long-term partnership", "special promotions"], "ss": ["I can consider a better price for bulk orders, depending on the final quantity and specifications.", "We are also open to discussing more competitive pricing for a long-term partnership.", "In some cases, we may be able to support special promotions for selected collections or order programs."], "sa": "I can consider a lower price for bulk orders, long-term partnership opportunities, or special promotions.", "src": "Giải đáp thắc mắc về giá", "sc": "The customer believes your price is higher than the competitors and wants an explanation for the difference."}, {"q": "How is your product different?", "vi": "Sản phẩm của bạn khác biệt như thế nào?", "st": "Our product offers + differentiating feature.", "ph": ["unique design", "patented solution", "higher durability"], "ss": ["Our product offers a unique design that is more distinctive than standard market alternatives.", "In some cases, it may also include a patented solution or a specialized technical feature, depending on the product line.", "Another key difference is higher durability, which is especially important for customers looking for long-term product performance."], "sa": "Our product offers unique design, higher durability, and in some cases patented solutions.", "src": "Giải đáp thắc mắc về giá", "sc": "The customer believes your price is higher than the competitors and wants an explanation for the difference."}, {"q": "What is included in the price?", "vi": "Mức giá này bao gồm những gì?", "st": "", "ph": [], "ss": ["The price usually includes the product itself, standard packing, and the agreed finishing specifications.", "Depending on the quotation term, it may also include sampling support, quality inspection, or export coordination.", "If you need, I can break the quotation down for you so you can see exactly what is included."], "sa": "The price includes the product, standard packing, and the agreed specifications, with additional services depending on the quotation terms.", "src": "Giải đáp thắc mắc về giá", "sc": "The customer believes your price is higher than the competitors and wants an explanation for the difference."}, {"q": "What is the expected lifespan of this product?", "vi": "Tuổi thọ dự kiến của sản phẩm này là bao lâu?", "st": "The expected lifespan is + duration / durability description.", "ph": ["ten years", "extended service life", "reliable operation"], "ss": ["The expected lifespan is around ten years under normal usage conditions, depending on the environment and maintenance level.", "The product is designed for extended service life and stable day-to-day performance.", "Our focus is not only on appearance, but also on reliable operation over time."], "sa": "The expected lifespan is around ten years, with extended service life and reliable operation under normal conditions.", "src": "Trình bày độ bền và tuổi thọ sản phẩm", "sc": "The customer is a technical company that cares strongly about product durability. You need to give a convincing explanation of product lifespan and reliability."}, {"q": "How was it tested for durability?", "vi": "Sản phẩm đã được kiểm tra độ bền như thế nào?", "st": "We tested it with + testing method.", "ph": ["stress simulations", "repeated load cycles", "impact analysis"], "ss": ["We tested it with stress simulations to evaluate how the product performs under demanding conditions.", "We also used repeated load cycles to measure stability and long-term structural performance.", "In addition, impact analysis helped us understand how the product responds to pressure and sudden force."], "sa": "We tested it with stress simulations, repeated load cycles, and impact analysis.", "src": "Trình bày độ bền và tuổi thọ sản phẩm", "sc": "The customer is a technical company that cares strongly about product durability. You need to give a convincing explanation of product lifespan and reliability."}, {"q": "What materials contribute to its strength?", "vi": "Những vật liệu nào góp phần tạo nên độ bền của sản phẩm?", "st": "The main materials are + material list.", "ph": ["reinforced steel", "composite polymers", "high-grade aluminum"], "ss": ["The main materials are reinforced steel, composite polymers, and high-grade aluminum, depending on the product type.", "These materials were selected because they offer a strong balance between strength, weight, and durability.", "We also pay attention to finishing and assembly, because durability depends on both materials and production quality."], "sa": "The main materials are reinforced steel, composite polymers, and high-grade aluminum.", "src": "Trình bày độ bề
